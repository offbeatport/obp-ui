<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>paperkit - component gallery</title>
        <script>
            // Pre-paint: apply the stored theme before first paint so the page never flashes
            // light-then-dark. Mirrors @paperkit/ui's prePaintScript() on the default
            // "cslopslop" namespace - the same key <ThemeToggle> writes.
            try {
                var d = document.documentElement;
                var t = localStorage.getItem("cslopslop-theme");
                if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
                    d.classList.add("dark");
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
