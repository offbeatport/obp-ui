<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Slop Slop · Split Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfd;
    --surface:#ffffff;
    --panel:#f6f6f8;
    --line:#ececf0;
    --line-strong:#e0e0e6;
    --ink:#16161a;
    --ink-2:#54545c;
    --ink-3:#8a8a93;
    --ink-4:#b4b4bc;
    --accent:#5b5bf0;
    --accent-soft:#eeeefe;
    --accent-ink:#4747d6;
    --green:#1fa971;--green-soft:#e6f6ee;
    --amber:#d99106;--amber-soft:#fdf2dd;
    --violet:#7c5cf0;--violet-soft:#f0ecfe;
    --blue:#2f6df0;--blue-soft:#e7effe;
    --red:#e2483c;--red-soft:#fdebe9;
    --slate:#8a8a93;--slate-soft:#f0f0f3;
    --gray:#9a9aa2;
    --radius:10px;
    --radius-sm:7px;
    --shadow:0 1px 2px rgba(20,20,30,.04),0 8px 28px -16px rgba(20,20,30,.18);
    --ease:cubic-bezier(.32,.72,0,1);
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:13.5px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.005em;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  kbd{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1;
    background:var(--surface);border:1px solid var(--line-strong);
    border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--ink-2);
    min-width:18px;display:inline-flex;align-items:center;justify-content:center;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--accent-soft)}

  /* layout shell */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{
    height:46px;flex:0 0 46px;display:flex;align-items:center;gap:14px;
    padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em}
  .logo{width:20px;height:20px;border-radius:6px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
    box-shadow:0 2px 6px -1px rgba(91,91,240,.5)}
  .brand small{color:var(--ink-3);font-weight:450}
  .topnav{display:flex;gap:2px;margin-left:6px}
  .topnav button{
    font-size:12.5px;font-weight:500;color:var(--ink-3);padding:6px 11px;border-radius:7px;
    transition:.13s var(--ease);
  }
  .topnav button:hover{color:var(--ink-2);background:var(--panel)}
  .topnav button.on{color:var(--accent-ink);background:var(--accent-soft)}
  .spacer{flex:1}
  .cmdk{
    display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 11px;
    border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);
    color:var(--ink-3);font-size:12.5px;width:230px;transition:.14s var(--ease);
  }
  .cmdk:hover{background:var(--surface);border-color:#d2d2da}
  .cmdk .ph{flex:1;text-align:left}
  .topmeta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);position:relative}
  .pulse-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;
    background:var(--blue);opacity:.35;animation:pulse 1.6s var(--ease) infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.5}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}

  .body{flex:1;display:flex;min-height:0;position:relative}

  /* ===== INBOX (left) ===== */
  .inbox{
    flex:0 0 372px;display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--line);background:var(--surface);
  }
  .inbox-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .inbox-title{display:flex;align-items:baseline;gap:9px}
  .inbox-title h1{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .count-pill{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
    background:var(--violet-soft);color:var(--violet);
  }
  .count-pill.zero{background:var(--green-soft);color:var(--green)}
  .inbox-sub{color:var(--ink-3);font-size:12px;margin-top:3px}
  .inbox-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .sec-label{
    display:flex;align-items:center;gap:8px;padding:14px 18px 6px;
    font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);
  }
  .sec-label .hr{flex:1;height:1px;background:var(--line)}

  .item{
    display:flex;gap:11px;padding:11px 18px;cursor:pointer;position:relative;
    border-bottom:1px solid var(--line);transition:background .1s var(--ease);
  }
  .item:hover{background:var(--panel)}
  .item.sel{background:var(--accent-soft)}
  .item.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--accent)}
  .item.resolved{opacity:.45}
  .item-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--slate)}
  .item-dot.await{background:var(--violet)}
  .item-dot.blocked{background:var(--red)}
  .item-dot.promote{background:var(--accent)}
  .item-body{flex:1;min-width:0}
  .item-top{display:flex;align-items:center;gap:7px}
  .item-co{font-size:11px;font-weight:600;color:var(--ink-3)}
  .item-tag{
    font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 6px;border-radius:5px;
  }
  .tag-await{background:var(--violet-soft);color:var(--violet)}
  .tag-blocked{background:var(--red-soft);color:var(--red)}
  .tag-promote{background:var(--accent-soft);color:var(--accent-ink)}
  .item-time{margin-left:auto;font-size:10.5px;color:var(--ink-4)}
  .item-line{font-size:13px;color:var(--ink-2);margin-top:2px}
  .item.unread .item-line{font-weight:600;color:var(--ink)}
  .item-meta{font-size:11px;color:var(--ink-4);margin-top:3px}

  /* companies secondary list */
  .co-row{
    display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;
    transition:background .1s var(--ease);
  }
  .co-row:hover{background:var(--panel)}
  .co-status{width:7px;height:7px;border-radius:50%}
  .s-active{background:var(--green)}.s-paused{background:var(--amber)}.s-archived{background:var(--gray)}
  .co-name{font-size:12.5px;font-weight:500}
  .co-thesis{font-size:11px;color:var(--ink-4);margin-left:auto;text-align:right;
    max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .co-mrr{font-size:11px;color:var(--ink-3);font-weight:500;flex:0 0 auto}

  /* ===== READER (right) ===== */
  .reader{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .reader-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .reader-inner{max-width:760px;margin:0 auto;padding:28px 36px 120px}

  .r-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .r-co-mark{
    width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;
  }
  .r-co-mark.blocked{background:var(--red-soft);color:var(--red)}
  .r-co-mark.promote{background:var(--accent-soft);color:var(--accent-ink)}
  .r-htext h2{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .r-htext .r-sub{color:var(--ink-3);font-size:12.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .r-htext .r-sub a{color:var(--accent-ink);text-decoration:none}
  .r-htext .r-sub a:hover{text-decoration:underline}
  .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4);display:inline-block}
  .r-actions{margin-left:auto;display:flex;gap:7px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    margin-top:18px;overflow:hidden;
  }
  .card-h{
    display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  }
  .card-h .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:450}

  /* doneWhen check banner */
  .check{display:flex;align-items:center;gap:11px;padding:13px 15px;background:var(--green-soft)}
  .check-ic{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;
    color:#fff;flex:0 0 auto;box-shadow:0 2px 8px -2px rgba(31,169,113,.6)}
  .check-ic svg{width:13px;height:13px}
  .check-t{font-size:12.5px;font-weight:600;color:#0f7a4f}
  .check-d{font-size:11.5px;color:#1c8a5e;margin-top:1px}

  /* preview */
  .preview-bar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:#d6d6dd;display:block}
  .url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:4px 9px;font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .url .lock{color:var(--green)}
  .open-btn{font-size:11px;font-weight:500;color:var(--accent-ink);padding:4px 9px;border-radius:6px}
  .open-btn:hover{background:var(--accent-soft)}
  .preview-body{padding:22px;background:repeating-linear-gradient(45deg,#fafafc,#fafafc 11px,#f4f4f7 11px,#f4f4f7 22px)}
  .mailpv{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow);max-width:440px;margin:0 auto}
  .mailpv .mh{font-size:15px;font-weight:600}
  .mailpv .ms{font-size:11px;color:var(--ink-4);margin:2px 0 13px}
  .lead-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .scorechip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--green-soft);color:var(--green)}
  .lead-row .ln{font-size:12.5px;flex:1}
  .lead-row .lc{font-size:11px;color:var(--ink-4)}

  /* diff */
  .diff{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.65;padding:6px 0}
  .diff .dl{display:flex;padding:0 14px;white-space:pre}
  .diff .dl .gut{width:26px;color:var(--ink-4);user-select:none;flex:0 0 auto}
  .diff .add{background:var(--green-soft)}.diff .add .gut{color:var(--green)}
  .diff .add .tx{color:#0f6b46}
  .diff .ctx .tx{color:var(--ink-3)}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:8px;
    font-size:12.5px;font-weight:500;transition:.13s var(--ease);border:1px solid transparent;
  }
  .btn kbd{background:rgba(255,255,255,.22);border-color:transparent;color:inherit;margin-left:2px}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px rgba(91,91,240,.55)}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink-2)}
  .btn-ghost:hover{background:var(--panel);border-color:#d2d2da}
  .btn-ghost kbd{background:var(--panel);border-color:var(--line)}
  .btn-danger-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--red)}
  .btn-danger-ghost:hover{background:var(--red-soft);border-color:#f3cfca}

  /* approval footer (sticky) */
  .approve-bar{
    position:sticky;bottom:0;display:flex;align-items:center;gap:11px;
    margin-top:20px;padding:13px 16px;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:12px;box-shadow:0 -2px 24px -12px rgba(20,20,30,.2),var(--shadow);
  }
  .approve-bar .at{font-size:12.5px;color:var(--ink-2)}
  .approve-bar .at b{color:var(--ink);font-weight:600}
  .approve-bar .grow{flex:1}

  /* flash confirm */
  .flash{
    position:fixed;top:58px;left:50%;transform:translate(-50%,-12px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;
    padding:9px 16px;border-radius:10px;box-shadow:0 10px 32px -8px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;z-index:80;
    transition:.22s var(--ease);
  }
  .flash.show{opacity:1;transform:translate(-50%,0)}
  .flash.ok{background:#0f7a4f}.flash.warn{background:var(--amber)}
  .flash .fic{width:16px;height:16px}

  /* feedback box */
  .fbwrap{margin-top:14px;display:none}
  .fbwrap.open{display:block;animation:slideup .2s var(--ease)}
  @keyframes slideup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fbwrap textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;
    font-family:inherit;font-size:12.5px;resize:vertical;min-height:74px;color:var(--ink);background:var(--surface);
  }
  .fbwrap textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fbrow{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}

  /* slices list in reader */
  .slice{display:flex;align-items:center;gap:11px;padding:9px 15px;border-top:1px solid var(--line)}
  .slice:first-child{border-top:none}
  .sn{font-size:11px;color:var(--ink-4);width:18px;flex:0 0 auto}
  .st{font-size:12.5px;flex:1}
  .badge{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
  .b-shipped{background:var(--green-soft);color:var(--green)}
  .b-building{background:var(--blue-soft);color:var(--blue)}
  .b-await{background:var(--violet-soft);color:var(--violet)}
  .b-todo{background:var(--slate-soft);color:var(--slate)}
  .b-blocked{background:var(--red-soft);color:var(--red)}
  .b-building .bd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:4px;animation:blink 1.3s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .prio{font-size:10.5px;color:var(--ink-4)}

  /* opportunity reader */
  .opp-score{display:flex;align-items:center;gap:14px;padding:16px}
  .gauge{width:64px;height:64px;flex:0 0 auto}
  .opp-thought{font-size:13px;color:var(--ink-2);padding:0 16px 14px;font-style:italic}

  /* company chat */
  .chat{border-top:1px solid var(--line);background:var(--surface)}
  .chat-msgs{padding:14px 16px;display:flex;flex-direction:column;gap:9px;max-height:200px;overflow-y:auto}
  .msg{display:flex;gap:9px;max-width:88%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .av{width:24px;height:24px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:700}
  .av.a{background:var(--accent-soft);color:var(--accent-ink)}.av.u{background:var(--slate-soft);color:var(--ink-2)}
  .bub{font-size:12.5px;padding:8px 11px;border-radius:11px;line-height:1.4}
  .msg.assistant .bub{background:var(--panel);color:var(--ink)}
  .msg.user .bub{background:var(--accent);color:#fff}
  .chat-input{display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--line)}
  .chat-input input{flex:1;border:none;background:none;font-size:13px;color:var(--ink);outline:none}
  .chat-input input::placeholder{color:var(--ink-4)}
  .send{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .send:hover{background:var(--accent-ink)}

  /* empty / inbox zero */
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3)}
  .empty .em{font-size:40px}
  .empty h3{font-size:17px;color:var(--ink);font-weight:600}

  /* ===== OVERVIEW (portfolio) ===== */
  .overview{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
  .overview.show{display:flex}
  .ov-scroll{flex:1;overflow-y:auto}
  .ov-inner{max-width:1180px;margin:0 auto;padding:26px 36px 130px}
  .ov-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  .ov-h h1{font-size:22px;font-weight:600;letter-spacing:-.025em}
  .ov-h span{color:var(--ink-3);font-size:13px}
  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 26px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .metric .mv{font-size:23px;font-weight:600;letter-spacing:-.02em}
  .metric .ml{font-size:11px;color:var(--ink-3);margin-top:2px}
  .metric.alert{border-color:#e7d7f3;background:linear-gradient(180deg,#faf7ff,#fff)}
  .metric.alert .mv{color:var(--violet)}

  .ov-cols{display:grid;grid-template-columns:1.55fr 1fr;gap:22px}
  .ov-sec h3{font-size:13px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .ov-sec h3 .ct{font-size:11px;font-weight:500;color:var(--ink-4)}
  .co-card{
    display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:.14s var(--ease);
  }
  .co-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
  .co-card .cm{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;background:var(--panel);color:var(--ink-2)}
  .co-card .cinfo{flex:1;min-width:0}
  .co-card .cn{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .co-card .cth{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .co-card .cstat{font-size:11px;color:var(--ink-3);text-align:right;flex:0 0 auto}
  .co-card .cstat b{color:var(--ink);font-weight:600}
  .needs-flag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--violet);background:var(--violet-soft);padding:2px 6px;border-radius:5px}

  .opp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px}
  .opp-card.killed{opacity:.5}
  .opp-top{display:flex;align-items:center;gap:9px}
  .opp-name{font-size:13px;font-weight:600}
  .opp-bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .opp-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .opp-num{font-size:11.5px;font-weight:600;color:var(--ink-2);width:22px;text-align:right}
  .opp-th{font-size:11.5px;color:var(--ink-4);margin:5px 0 9px}
  .promote{font-size:11.5px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:7px;transition:.12s var(--ease)}
  .promote:hover{background:#e3e3fd}
  .moves li{font-size:12.5px;color:var(--ink-2);padding:8px 0 8px 20px;border-top:1px solid var(--line);position:relative;list-style:none}
  .moves li:first-child{border-top:none}
  .moves li::before{content:'→';position:absolute;left:0;color:var(--accent);font-weight:600}

  /* global command bar (overview) */
  .gcmd{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(620px,82%);z-index:25}
  .gcmd-inner{display:flex;align-items:center;gap:11px;height:46px;padding:0 8px 0 16px;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
    box-shadow:0 18px 50px -18px rgba(20,20,30,.32),var(--shadow)}
  .gcmd-inner svg{color:var(--accent)}
  .gcmd-inner input{flex:1;border:none;background:none;font-size:13.5px;outline:none;color:var(--ink)}
  .gcmd-inner input::placeholder{color:var(--ink-4)}
  .gcmd-send{height:32px;padding:0 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}

  /* ===== ACTIVITY STRIP (bottom, collapsible) ===== */
  .activity{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);z-index:40;
  }
  .act-collapsed{display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;transition:background .1s}
  .act-collapsed:hover{background:var(--panel)}
  .act-collapsed .lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4)}
  .act-line{font-size:12.5px;color:var(--ink-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-line b{color:var(--ink);font-weight:600}
  .act-chev{color:var(--ink-4);transition:transform .2s var(--ease)}
  .activity.open .act-chev{transform:rotate(180deg)}
  .act-expanded{max-height:0;overflow:hidden;transition:max-height .26s var(--ease);border-top:0 solid var(--line)}
  .activity.open .act-expanded{max-height:340px;overflow-y:auto;border-top-width:1px}
  .act-group{padding:6px 0}
  .act-gh{font-size:10.5px;font-weight:600;color:var(--ink-3);padding:8px 16px 4px;display:flex;align-items:center;gap:8px}
  .act-ev{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 30px;font-size:12.5px;color:var(--ink-2)}
  .act-ev .t{margin-left:auto;font-size:10.5px;color:var(--ink-4)}
  .ev-dot{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:0 0 auto}
  .ev-dot.building,.ev-dot.deploy{background:var(--blue)}
  .ev-dot.await{background:var(--violet)}.ev-dot.check{background:var(--green)}
  .ev-dot.blocked{background:var(--red)}.ev-dot.reprioritize{background:var(--slate)}
  .ev-dot.running{position:relative}
  .ev-dot.running::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:inherit;opacity:.4;animation:pulse 1.6s var(--ease) infinite}

  .badge-corner{
    position:fixed;right:14px;bottom:14px;z-index:60;
    background:var(--ink);color:#fff;font-size:11px;font-weight:600;
    padding:6px 11px;border-radius:9px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:7px;letter-spacing:.01em;
  }
  .badge-corner .bd{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#dcdce3;border-radius:6px;border:3px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:#c8c8d0}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand"><span class="logo">C</span> C Slop Slop <small>·&nbsp;Split Inbox</small></div>
    <div class="topnav">
      <button id="navInbox" class="on" onclick="showInbox()">Inbox</button>
      <button id="navOverview" onclick="showOverview()">Portfolio</button>
    </div>
    <div class="spacer"></div>
    <div class="cmdk" onclick="focusGlobal()" title="Command bar">
      <span>⌘</span><span class="ph">Ask or command…</span><kbd>K</kbd>
    </div>
    <div class="topmeta"><span class="pulse-dot"></span> 2 building</div>
  </div>

  <!-- BODY -->
  <div class="body">
    <!-- INBOX -->
    <aside class="inbox">
      <div class="inbox-head">
        <div class="inbox-title">
          <h1>Inbox</h1>
          <span class="count-pill" id="countPill">1 needs you</span>
        </div>
        <div class="inbox-sub">Newest first · <kbd>j</kbd> <kbd>k</kbd> move · <kbd>↵</kbd> open · <kbd>e</kbd> approve</div>
      </div>
      <div class="inbox-scroll">
        <div class="sec-label">Needs you <span class="hr"></span></div>
        <div id="queue"></div>
        <div class="sec-label">All companies <span class="hr"></span></div>
        <div id="coList"></div>
      </div>
    </aside>

    <!-- READER -->
    <section class="reader">
      <div class="reader-scroll">
        <div class="reader-inner" id="reader"></div>
      </div>
    </section>
  </div>

  <!-- ACTIVITY STRIP -->
  <div class="activity" id="activity">
    <div class="act-collapsed" onclick="toggleActivity()">
      <span class="pulse-dot"></span>
      <span class="lbl">Live</span>
      <span class="act-line" id="actLatest"></span>
      <span class="act-chev">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>
      </span>
    </div>
    <div class="act-expanded" id="actExpanded"></div>
  </div>
</div>

<!-- OVERVIEW (portfolio) -->
<div class="overview" id="overview">
  <div class="ov-scroll">
    <div class="ov-inner">
      <div class="ov-h"><h1>Portfolio</h1><span>From thought to bag - one validated slice at a time.</span></div>
      <div class="metrics" id="metrics"></div>
      <div class="ov-cols">
        <div class="ov-sec">
          <h3>Companies <span class="ct" id="coCount"></span></h3>
          <div id="ovCompanies"></div>
        </div>
        <div>
          <div class="ov-sec" style="margin-bottom:24px">
            <h3>Opportunities <span class="ct">candidates → promote</span></h3>
            <div id="ovOpps"></div>
          </div>
          <div class="ov-sec">
            <h3>Next moves</h3>
            <ul class="moves" id="ovMoves"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="gcmd">
    <div class="gcmd-inner">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <input id="globalInput" placeholder="Direct the portfolio - “promote PayoutReconciler”, “unblock RedditPainBot”…">
      <button class="gcmd-send" onclick="sendGlobal()">Send <kbd style="background:rgba(255,255,255,.2);border:none;color:#fff">↵</kbd></button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="badge-corner"><span class="bd"></span>12 · Split Inbox</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ---------- inbox queue model ---------- */
let queue = [
  { id:'q-leadsift', co:'LeadSift', coId:'leadsift', kind:'await', tag:'Approval', dot:'await',
    line:'Slice 5 - daily digest awaiting your approval', meta:'doneWhen passed · preview ready', time:'2m', unread:true, type:'approval' },
  { id:'q-reddit', co:'RedditPainBot', coId:'redditpainbot', kind:'blocked', tag:'Blocked', dot:'blocked',
    line:'Slice 8 blocked - no progress (same failure ×3)', meta:'Unblock or pause the company', time:'18m', unread:true, type:'company' },
  { id:'q-promote', co:'Opportunity', coId:'o1', kind:'promote', tag:'Promote', dot:'promote',
    line:'Promote “PayoutReconciler” to a company', meta:'Score 82 · top candidate', time:'1h', unread:true, type:'opp' },
];
let sel = 0;            // index into visible items
let resolved = {};      // id -> true
const flashEl = document.getElementById('flash');

function liveQueue(){ return queue.filter(q=>!resolved[q.id]); }
function needsCount(){ return liveQueue().length; }

/* ---------- render inbox ---------- */
function renderQueue(){
  const live = liveQueue();
  const host = document.getElementById('queue');
  if(!live.length){
    host.innerHTML = `<div style="padding:34px 18px;text-align:center;color:var(--ink-3)">
      <div style="font-size:30px">🎉</div>
      <div style="font-weight:600;color:var(--ink);margin-top:6px">Inbox zero</div>
      <div style="font-size:11.5px;margin-top:2px">Nothing needs you. Agents keep building.</div></div>`;
  } else {
    host.innerHTML = live.map((q,i)=>`
      <div class="item ${q.unread?'unread':''} ${i===sel?'sel':''}" data-i="${i}" onclick="selectIdx(${i})" ondblclick="openSel()">
        <span class="item-dot ${q.dot}"></span>
        <div class="item-body">
          <div class="item-top">
            <span class="item-co">${q.co}</span>
            <span class="item-tag tag-${q.kind==='await'?'await':q.kind==='blocked'?'blocked':'promote'}">${q.tag}</span>
            <span class="item-time">${q.time}</span>
          </div>
          <div class="item-line">${q.line}</div>
          <div class="item-meta">${q.meta}</div>
        </div>
      </div>`).join('');
  }
  updateCount();
}
function updateCount(){
  const n = needsCount();
  const pill = document.getElementById('countPill');
  if(n===0){ pill.textContent='Inbox zero 🎉'; pill.classList.add('zero'); }
  else { pill.textContent = n+' needs you'; pill.classList.remove('zero'); }
}

function renderCoList(){
  document.getElementById('coList').innerHTML = DATA.companies.map(c=>`
    <div class="co-row" onclick="openCompany('${c.id}')">
      <span class="co-status s-${c.status}"></span>
      <span class="co-name">${c.name}</span>
      <span class="co-mrr mono">$${c.mrr}</span>
      <span class="co-thesis">${c.thesis}</span>
    </div>`).join('');
}

/* ---------- selection / keyboard ---------- */
function selectIdx(i){
  const live = liveQueue();
  if(!live.length) return;
  sel = Math.max(0, Math.min(i, live.length-1));
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel', +el.dataset.i===sel));
  openSel();
}
function openSel(){
  const live = liveQueue();
  if(!live.length){ renderReaderEmpty(); return; }
  const q = live[sel];
  q.unread = false;
  if(q.type==='approval') renderApproval();
  else if(q.type==='company') openCompany(q.coId, true);
  else if(q.type==='opp') renderOpp(q.coId);
  renderQueue();
}

document.addEventListener('keydown', e=>{
  if(overviewOpen()) {
    if(e.key==='Escape'){ showInbox(); }
    return;
  }
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'){
    if(e.key==='Escape') e.target.blur();
    return;
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); showOverview(); focusGlobal(); return; }
  const live = liveQueue();
  if(e.key==='j'){ e.preventDefault(); if(live.length){ sel=Math.min(sel+1,live.length-1); highlightSel(); } }
  else if(e.key==='k'){ e.preventDefault(); if(live.length){ sel=Math.max(sel-1,0); highlightSel(); } }
  else if(e.key==='Enter'){ e.preventDefault(); openSel(); }
  else if(e.key.toLowerCase()==='e'){
    e.preventDefault();
    const q = live[sel];
    if(q && q.type==='approval'){ doApprove(); }
  }
  else if(e.key==='Escape'){ if(overviewOpen()) showInbox(); }
});
function highlightSel(){
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel', +el.dataset.i===sel));
  const cur = document.querySelector('.item.sel'); if(cur) cur.scrollIntoView({block:'nearest'});
}

/* ---------- reader: approval gate (LeadSift) ---------- */
function renderApproval(){
  const c = DATA.companies.find(c=>c.id==='leadsift');
  const a = c.approval;
  const diffLines = a.diff.split('\n').map(l=>{
    const add = l.startsWith('+'); const cls = add?'add':'ctx';
    const gut = add?'+':' ';
    const tx = add? l.slice(2) : l.replace(/^\s{2}/,'');
    return `<div class="dl ${cls}"><span class="gut">${gut}</span><span class="tx">${escapeHtml(tx)}</span></div>`;
  }).join('');

  document.getElementById('reader').innerHTML = `
    <div class="r-head">
      <div class="r-co-mark">L</div>
      <div class="r-htext">
        <h2>${a.title}</h2>
        <div class="r-sub">
          <b style="color:var(--ink-2)">LeadSift</b><span class="dot-sep"></span>
          Slice ${a.slice} · attempt ${a.attempt}<span class="dot-sep"></span>
          <span class="badge b-await"><span class="bd"></span>Awaiting approval</span>
        </div>
      </div>
      <div class="r-actions">
        <button class="btn btn-ghost" onclick="openCompany('leadsift')">Open company</button>
      </div>
    </div>

    <div class="card">
      <div class="check">
        <span class="check-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>
        <div>
          <div class="check-t">doneWhen passed</div>
          <div class="check-d mono">${escapeHtml(a.doneWhen)}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Live preview <span class="r mono">200 OK · ${a.attempt} attempts</span></div>
      <div class="preview-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="url"><span class="lock">●</span><a href="${a.previewUrl}" onclick="event.preventDefault();flash('Opening preview…')">${a.previewUrl}</a></span>
        <button class="open-btn" onclick="flash('Opening preview…')">Open ↗</button>
      </div>
      <div class="preview-body">
        <div class="mailpv">
          <div class="mh">Your top leads today</div>
          <div class="ms">digest@leadsift.app · to you · 08:00</div>
          ${[['Acme Robotics','94','sales@acme.io'],['Northwind Co.','88','ops@northwind.com'],['Belier SaaS','81','hi@belier.dev'],['Tiber Labs','76','team@tiber.xyz']]
            .map(r=>`<div class="lead-row"><span class="scorechip">${r[1]}</span><span class="ln">${r[0]}</span><span class="lc mono">${r[2]}</span></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Diff <span class="r mono">+5 / −0 · DailyDigest.tsx</span></div>
      <div class="diff">${diffLines}</div>
    </div>

    <div class="fbwrap" id="fbwrap">
      <textarea id="fbtext" placeholder="What should change? Agents will re-build this slice from your feedback…"></textarea>
      <div class="fbrow">
        <button class="btn btn-ghost" onclick="closeFeedback()">Cancel</button>
        <button class="btn btn-primary" onclick="submitReject()">Send feedback</button>
      </div>
    </div>

    <div class="approve-bar" id="approveBar">
      <span class="check-ic" style="width:18px;height:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>
      <span class="at"><b>Ready to ship.</b> Live + proven. Your call.</span>
      <span class="grow"></span>
      <button class="btn btn-danger-ghost" onclick="toggleFeedback()">Reject with feedback</button>
      <button class="btn btn-primary" onclick="doApprove()">Approve <kbd>e</kbd></button>
    </div>

    ${companyChatHtml('leadsift')}
  `;
  wireChat('leadsift');
}

function doApprove(){
  const bar = document.getElementById('approveBar');
  if(bar) bar.innerHTML = `<span class="check-ic" style="width:18px;height:18px;background:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span class="at"><b style="color:var(--green)">Approved ✓</b> Slice 5 shipped - now live on leadsift.app.</span>`;
  flash('Approved ✓ - slice shipped','ok');
  resolved['q-leadsift'] = true;
  setTimeout(()=>{ sel=0; renderQueue(); afterResolve(); }, 850);
}
function toggleFeedback(){ const w=document.getElementById('fbwrap'); w.classList.toggle('open'); if(w.classList.contains('open')) document.getElementById('fbtext').focus(); }
function closeFeedback(){ document.getElementById('fbwrap').classList.remove('open'); }
function submitReject(){
  const t = document.getElementById('fbtext').value.trim();
  flash(t? 'Feedback sent - agents re-building' : 'Rejected - agents re-building','warn');
  const bar = document.getElementById('approveBar');
  if(bar) bar.innerHTML = `<span class="at"><b style="color:var(--amber)">Rejected ↺</b> Sent back with feedback - agents re-building slice 5.</span>`;
  closeFeedback();
  resolved['q-leadsift'] = true;
  setTimeout(()=>{ sel=0; renderQueue(); afterResolve(); }, 950);
}
function afterResolve(){
  if(!liveQueue().length){ renderReaderEmpty(); }
  else openSel();
}

/* ---------- reader: blocked company (RedditPainBot) ---------- */
function openCompany(id, fromQueue){
  const c = DATA.companies.find(c=>c.id===id);
  if(!c) return;
  if(id==='leadsift' && c.approval){ // LeadSift always shows the gate
    // select its queue item if present
    const idx = liveQueue().findIndex(q=>q.id==='q-leadsift');
    if(idx>=0){ sel=idx; highlightSel(); }
    renderApproval(); showInbox(); return;
  }
  renderCompanyView(c); showInbox();
}
function renderCompanyView(c){
  const slices = (c.slices||[]).map(s=>sliceRow(s)).join('') ||
    (c.currentSlice? sliceRow(c.currentSlice):'');
  const mark = c.status==='paused'? 'blocked':'';
  document.getElementById('reader').innerHTML = `
    <div class="r-head">
      <div class="r-co-mark ${mark}">${c.name[0]}</div>
      <div class="r-htext">
        <h2>${c.name}</h2>
        <div class="r-sub">
          <span class="co-status s-${c.status}" style="display:inline-block;width:7px;height:7px;border-radius:50%"></span>
          ${c.status}<span class="dot-sep"></span>
          ${c.domain? c.domain : 'no domain yet'}<span class="dot-sep"></span>
          ${c.previewUrl? `<a href="${c.previewUrl}" onclick="event.preventDefault();flash('Opening preview…')">${c.previewUrl}</a>` : 'no preview'}
        </div>
      </div>
      <div class="r-actions">
        <button class="btn btn-ghost" onclick="showInbox()">Back <kbd>esc</kbd></button>
      </div>
    </div>
    <p style="color:var(--ink-2);font-size:13px;margin-top:10px">${c.thesis}</p>
    ${c.status==='paused'? `<div class="card"><div class="check" style="background:var(--red-soft)">
       <span class="check-ic" style="background:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 8v5M12 17h0M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span>
       <div><div class="check-t" style="color:var(--red)">Slice 8 blocked</div>
       <div class="check-d" style="color:var(--red)">No progress - same failure ×3. Unblock with guidance, or pause the company.</div></div></div></div>`:''}
    <div class="card">
      <div class="card-h">Slices <span class="r mono">${(c.slices||[]).filter(s=>s.status==='shipped').length || c.slicesShipped||0} shipped</span></div>
      ${slices}
    </div>
    <div class="approve-bar" id="approveBar">
      <span class="at">${c.status==='paused'? 'This company is paused. Decide its fate.' : 'Direct this company below.'}</span>
      <span class="grow"></span>
      ${c.status==='paused'
        ? `<button class="btn btn-ghost" onclick="flash('Paused - agents idle')">Keep paused</button>
           <button class="btn btn-primary" onclick="flash('Unblocked - agents retrying ✓','ok'); resolveReddit()">Unblock with guidance</button>`
        : `<button class="btn btn-ghost" onclick="flash('Re-prioritized ✓','ok')">Re-prioritize</button>`}
    </div>
    ${companyChatHtml(c.id)}
  `;
  wireChat(c.id);
}
function resolveReddit(){
  resolved['q-reddit'] = true;
  setTimeout(()=>{ sel=0; renderQueue(); }, 700);
}
function sliceRow(s){
  const map={shipped:['b-shipped','shipped'],building:['b-building','building'],awaiting_approval:['b-await','needs you'],todo:['b-todo','todo'],blocked:['b-blocked','blocked']};
  const m = map[s.status]||['b-todo',s.status];
  const dot = s.status==='building'? '<span class="bd"></span>':'';
  const right = s.priority? `<span class="prio mono">P${s.priority}</span>`
    : s.note? `<span class="prio">${s.note}</span>`
    : s.step? `<span class="prio">${s.step}</span>` : '';
  return `<div class="slice"><span class="sn mono">${s.n}</span><span class="st">${s.title}</span>${right}
    <span class="badge ${m[0]}">${dot}${m[1]}</span></div>`;
}

/* ---------- reader: opportunity (PayoutReconciler) ---------- */
function renderOpp(id){
  const o = DATA.opportunities.find(o=>o.id===id) || DATA.opportunities[0];
  const r=22, c=2*Math.PI*r, off=c*(1-o.score/100);
  document.getElementById('reader').innerHTML = `
    <div class="r-head">
      <div class="r-co-mark promote">★</div>
      <div class="r-htext">
        <h2>${o.title}</h2>
        <div class="r-sub"><span class="item-tag tag-promote">Opportunity</span><span class="dot-sep"></span>candidate · not yet a company</div>
      </div>
      <div class="r-actions"><button class="btn btn-ghost" onclick="showOverview()">All opportunities</button></div>
    </div>
    <div class="card">
      <div class="opp-score">
        <svg class="gauge" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 28 28)"/>
          <text x="28" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono">${o.score}</text>
        </svg>
        <div>
          <div style="font-size:14px;font-weight:600">${o.thesis}</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">Validation score ${o.score}/100 - top-ranked candidate</div>
        </div>
      </div>
      <div class="opp-thought">“${o.thought}”</div>
    </div>
    <div class="approve-bar" id="approveBar">
      <span class="at"><b>Promote</b> spins up a company and queues slice #1 - a walking skeleton.</span>
      <span class="grow"></span>
      <button class="btn btn-ghost" onclick="flash('Kept as candidate')">Keep watching</button>
      <button class="btn btn-primary" onclick="promoteOpp('${o.id}')">Promote to company</button>
    </div>
  `;
}
function promoteOpp(id){
  const o = DATA.opportunities.find(o=>o.id===id);
  flash('Promoted ✓ - '+(o?o.title:'')+' is now a company','ok');
  const bar=document.getElementById('approveBar');
  if(bar) bar.innerHTML=`<span class="at"><b style="color:var(--green)">Promoted ✓</b> ${o.title} is live as a company - slice #1 queued.</span>`;
  resolved['q-promote'] = true;
  setTimeout(()=>{ sel=0; renderQueue(); afterResolve(); }, 850);
}

function renderReaderEmpty(){
  document.getElementById('reader').innerHTML = `
    <div class="empty" style="min-height:60vh">
      <div class="em">🎉</div>
      <h3>Inbox zero</h3>
      <div>Nothing needs you right now. Agents keep building - new items land here.</div>
      <button class="btn btn-ghost" style="margin-top:14px" onclick="showOverview()">Open Portfolio</button>
    </div>`;
}

/* ---------- company chat (spine) ---------- */
function companyChatHtml(id){
  const msgs = (id==='leadsift'? DATA.chat : [
    {role:'assistant', text:'I’m tracking this company’s slices. Ask me to re-prioritize, unblock, or explain anything.'}
  ]).map(m=>`
    <div class="msg ${m.role}">
      <div class="av ${m.role==='user'?'u':'a'}">${m.role==='user'?'You':'AI'}</div>
      <div class="bub">${m.text}</div>
    </div>`).join('');
  return `<div class="card chat" style="margin-top:22px;border-radius:var(--radius)">
    <div class="card-h">Company chat <span class="r">${id==='leadsift'?'LeadSift':''}</span></div>
    <div class="chat-msgs" id="chatMsgs-${id}">${msgs}</div>
    <div class="chat-input">
      <input id="chatIn-${id}" placeholder="Message the ${id} agents…">
      <button class="send" onclick="sendChat('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>`;
}
function wireChat(id){
  const inp=document.getElementById('chatIn-'+id);
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); sendChat(id);} });
}
function sendChat(id){
  const inp=document.getElementById('chatIn-'+id); const v=inp.value.trim(); if(!v) return;
  const host=document.getElementById('chatMsgs-'+id);
  host.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="av u">You</div><div class="bub">${escapeHtml(v)}</div></div>`);
  inp.value=''; host.scrollTop=host.scrollHeight;
  setTimeout(()=>{ host.insertAdjacentHTML('beforeend',`<div class="msg assistant"><div class="av a">AI</div><div class="bub">On it - I’ll route that to the build loop and report back here.</div></div>`); host.scrollTop=host.scrollHeight; }, 480);
}

/* ---------- activity strip ---------- */
function renderActivity(){
  const latest = DATA.activity[0];
  document.getElementById('actLatest').innerHTML = `<b>${latest.co}</b> ${latest.text} · <span class="mono" style="color:var(--ink-4)">${latest.t}</span>`;
  const groups={};
  DATA.activity.forEach(a=>{(groups[a.co]=groups[a.co]||[]).push(a);});
  const order=['TranslatorBill','QuietInbox','LeadSift','DataDrop','RedditPainBot'];
  document.getElementById('actExpanded').innerHTML = order.filter(co=>groups[co]).map(co=>{
    const c=DATA.companies.find(x=>x.name===co);
    return `<div class="act-group">
      <div class="act-gh"><span class="co-status s-${c?c.status:'active'}"></span>${co}</div>
      ${groups[co].map(a=>`<div class="act-ev">
        <span class="ev-dot ${a.kind} ${a.running?'running':''}"></span>
        <span>${a.text}</span><span class="t mono">${a.t}</span></div>`).join('')}
    </div>`;
  }).join('');
}
function toggleActivity(){ document.getElementById('activity').classList.toggle('open'); }

/* ---------- overview / portfolio ---------- */
function renderOverview(){
  const p=DATA.portfolio;
  document.getElementById('metrics').innerHTML = [
    ['$'+p.mrr,'MRR'],[p.users,'Users'],[p.activeCompanies,'Active companies'],[p.slicesShipped,'Slices shipped']
  ].map(m=>`<div class="metric"><div class="mv mono">${m[0]}</div><div class="ml">${m[1]}</div></div>`).join('')
   + `<div class="metric alert"><div class="mv mono">${p.needsYou}</div><div class="ml">Needs you</div></div>`;

  document.getElementById('coCount').textContent = DATA.companies.length+' total';
  document.getElementById('ovCompanies').innerHTML = DATA.companies.map(c=>{
    const cur = c.currentSlice; const aw = c.needsYou;
    const stat = aw? '<span class="needs-flag">Needs you</span>'
      : cur? `<span class="badge ${cur.status==='building'?'b-building':cur.status==='blocked'?'b-blocked':'b-todo'}">${cur.status==='building'?'<span class="bd"></span>':''}${cur.status}</span>` : '';
    return `<div class="co-card" onclick="openCompany('${c.id}')">
      <div class="cm">${c.name[0]}</div>
      <div class="cinfo">
        <div class="cn">${c.name} <span class="co-status s-${c.status}"></span></div>
        <div class="cth">${c.thesis}</div>
      </div>
      <div class="cstat"><b class="mono">$${c.mrr}</b> · ${c.users}u<br>${stat}</div>
    </div>`;
  }).join('');

  document.getElementById('ovOpps').innerHTML = DATA.opportunities.map(o=>`
    <div class="opp-card ${o.status==='killed'?'killed':''}">
      <div class="opp-top">
        <span class="opp-name">${o.title}</span>
        <span class="opp-bar"><i style="width:${o.score}%;background:${o.score>=70?'var(--accent)':o.score>=50?'var(--amber)':'var(--gray)'}"></i></span>
        <span class="opp-num mono">${o.score}</span>
      </div>
      <div class="opp-th">${o.thesis}</div>
      ${o.status==='killed'? '<span style="font-size:11px;color:var(--red)">✕ killed</span>'
        : `<button class="promote" onclick="promoteFromOverview('${o.id}')">Promote to company →</button>`}
    </div>`).join('');

  document.getElementById('ovMoves').innerHTML = DATA.nextMoves.map(m=>`<li>${m}</li>`).join('');
}
function promoteFromOverview(id){
  const o=DATA.opportunities.find(o=>o.id===id);
  flash('Promoted ✓ - '+o.title+' is now a company','ok');
}

/* ---------- view switching ---------- */
function overviewOpen(){ return document.getElementById('overview').classList.contains('show'); }
function showOverview(){
  document.getElementById('overview').classList.add('show');
  document.getElementById('navOverview').classList.add('on');
  document.getElementById('navInbox').classList.remove('on');
}
function showInbox(){
  document.getElementById('overview').classList.remove('show');
  document.getElementById('navInbox').classList.add('on');
  document.getElementById('navOverview').classList.remove('on');
}
function focusGlobal(){ showOverview(); setTimeout(()=>{ const g=document.getElementById('globalInput'); if(g) g.focus(); },60); }
function sendGlobal(){
  const g=document.getElementById('globalInput'); const v=g.value.trim();
  flash(v? 'Sent: “'+(v.length>40?v.slice(0,40)+'…':v)+'”' : 'Type a command first','warn');
  g.value='';
}
document.getElementById('globalInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();sendGlobal();} });

/* ---------- helpers ---------- */
let flashTimer;
function flash(msg, kind){
  flashEl.className='flash show'+(kind?' '+kind:'');
  flashEl.innerHTML = (kind==='ok'?'<svg class="fic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>':'') + '<span>'+msg+'</span>';
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>flashEl.classList.remove('show'),1600);
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- init ---------- */
renderQueue();
renderCoList();
renderActivity();
renderOverview();
selectIdx(0);   // open the LeadSift approval gate by default
</script>
