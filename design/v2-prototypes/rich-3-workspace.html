<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop - Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8; --ink:#2c2926;
    --ink-soft:#635c52; --ink-faint:#7b7368; --line:#e6ddce; --line-soft:#efe8da;
    --accent:#c8643c; --green:#4f8a52; --blue:#4a72b0; --violet:#7a5ea8;
    --amber:#c08a2e; --red:#b6483f; --slate:#8a8579;
    --shadow:0 1px 2px rgba(60,50,38,.04),0 8px 28px rgba(60,50,38,.07);
    --shadow-lg:0 4px 14px rgba(60,50,38,.10),0 24px 60px rgba(60,50,38,.16);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --ui:'Inter',system-ui,sans-serif;
    --disp:'Space Grotesk',var(--ui);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--ui); background:var(--cream); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-size:13px; line-height:1.45; overflow:hidden;
  }
  ::selection{background:rgba(200,100,60,.18)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d9cfbd;border-radius:6px;border:2px solid var(--cream)}
  ::-webkit-scrollbar-thumb:hover{background:#c9bfa9}
  .mono{font-family:var(--mono)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---------- shell ---------- */
  #app{display:flex;height:100vh;min-width:1240px}
  .sidebar{
    width:228px;flex:none;background:var(--cream-2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 12px 10px;
  }
  .wsbtn{
    display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;
    cursor:pointer;transition:background .12s;
  }
  .wsbtn:hover{background:#eae2d2}
  .wslogo{
    width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#a94e2c);color:#fff;
    font-family:var(--disp);font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(168,78,44,.35);
  }
  .wsname{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:-.01em;line-height:1.1}
  .wssub{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
  .wschev{margin-left:auto;color:var(--ink-faint);font-size:11px}

  .kbtn{
    margin-top:11px;display:flex;align-items:center;gap:8px;width:100%;
    padding:7px 9px;border-radius:9px;background:var(--paper);border:1px solid var(--line);
    color:var(--ink-faint);font-size:12px;transition:.12s;
  }
  .kbtn:hover{border-color:#d8ccba;color:var(--ink-soft)}
  .kbtn .kk{margin-left:auto;display:flex;gap:3px}
  kbd{
    font-family:var(--mono);font-size:10px;background:var(--cream-2);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:var(--ink-soft);box-shadow:0 1px 0 rgba(60,50,38,.05);
  }

  .navsec{margin-top:14px}
  .navlabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 9px 6px;font-weight:600}
  .nav{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:8px;
    color:var(--ink-soft);font-size:13px;font-weight:500;cursor:pointer;position:relative;transition:.1s}
  .nav svg{width:16px;height:16px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none}
  .nav:hover{background:#eae2d2;color:var(--ink)}
  .nav.active{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
  .nav.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:3px;height:17px;border-radius:3px;background:var(--accent)}
  .nav .nk{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .nav .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
    background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
  .nav.active .nk{color:var(--ink-faint)}

  .sidefoot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  .mini-kpi{display:flex;justify-content:space-between;padding:5px 9px;font-size:11.5px}
  .mini-kpi b{font-family:var(--mono);font-weight:600}
  .badge-corner{margin-top:8px;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;
    background:var(--paper);border:1px solid var(--line);font-size:11px;color:var(--ink-soft)}
  .badge-corner .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--cream)}
  .topbar{height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line);background:var(--cream)}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px}
  .crumb .c0{color:var(--ink-faint)}
  .crumb .sep{color:var(--ink-faint);opacity:.6}
  .crumb .c1{font-weight:600;font-family:var(--disp);letter-spacing:-.01em}
  .topspacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
    border-radius:8px;padding:5px 10px;width:240px;transition:.12s}
  .search:focus-within{border-color:#d3b39a;box-shadow:0 0 0 3px rgba(200,100,60,.10)}
  .search svg{width:14px;height:14px;stroke:var(--ink-faint);stroke-width:1.8;fill:none}
  .search input{border:none;outline:none;background:none;font-family:var(--ui);font-size:12.5px;
    color:var(--ink);width:100%}
  .search input::placeholder{color:var(--ink-faint)}
  .tbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:12.5px;
    font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);transition:.12s}
  .tbtn:hover{border-color:#d8ccba;color:var(--ink)}
  .tbtn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 2px 7px rgba(200,100,60,.3)}
  .tbtn.primary:hover{background:#b8572f}
  .av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
    font-family:var(--mono);background:var(--cream-2);border:1px solid var(--line);color:var(--ink-soft)}

  .viewport{flex:1;min-height:0;overflow:hidden;display:flex}

  /* ---------- split list+detail ---------- */
  .listpane{width:430px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;
    background:var(--cream);min-height:0}
  .listhead{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
    border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .listhead .seg{margin-left:auto;display:flex;gap:2px;background:var(--cream-2);border-radius:7px;padding:2px}
  .seg b{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:5px;cursor:pointer;
    color:var(--ink-faint);font-weight:600;letter-spacing:.04em}
  .seg b.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
  .listscroll{flex:1;overflow-y:auto;min-height:0}

  .grouphdr{padding:9px 16px 5px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:8px}
  .grouphdr .gc{width:6px;height:6px;border-radius:50%}
  .grouphdr .gn{margin-left:auto;opacity:.7}

  .row{padding:9px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .1s;
    position:relative}
  .row:hover{background:var(--cream-2)}
  .row.sel{background:var(--paper);box-shadow:inset 2px 0 0 var(--accent)}
  .row.sel:hover{background:var(--paper)}
  .row-top{display:flex;align-items:center;gap:9px}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none}
  .row-name{font-weight:600;font-size:13px;letter-spacing:-.01em}
  .row-stage{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1px 6px;border-radius:5px;
    font-weight:600;white-space:nowrap}
  .row-mrr{margin-left:auto;display:flex;align-items:center;gap:8px}
  .row-mrr .v{font-family:var(--mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
  .row-meta{display:flex;align-items:center;gap:10px;margin-top:6px;padding-left:17px;
    font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .row-meta .mi{display:flex;align-items:center;gap:4px}
  .row-meta .up{color:var(--green)}
  .auto-badges{display:flex;gap:3px}
  .ab{font-family:var(--mono);font-size:9px;font-weight:600;padding:1px 4px;border-radius:4px;letter-spacing:.02em}
  .owner{margin-left:auto;display:flex;align-items:center;gap:5px}
  .oav{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;
    font-family:var(--mono)}

  /* ---------- detail pane ---------- */
  .detail{flex:1;min-width:0;overflow-y:auto;background:var(--cream)}
  .det-head{padding:18px 22px 0;border-bottom:1px solid var(--line);background:var(--paper)}
  .det-title{display:flex;align-items:center;gap:12px}
  .det-title h1{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.02em}
  .det-kpis{display:flex;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
  .dk{display:flex;flex-direction:column;gap:2px}
  .dk .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .dk .v{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
  .dk .v small{font-size:11px;font-weight:500}
  .conn-row{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
  .conn{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;padding:2px 8px;
    border-radius:6px;border:1px solid var(--line);font-weight:500}
  .conn.on{color:var(--green);border-color:rgba(79,138,82,.3);background:rgba(79,138,82,.06)}
  .conn.off{color:var(--ink-faint);background:var(--cream-2);text-decoration:line-through;opacity:.7}

  .tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--paper)}
  .tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink-soft)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .tc{font-family:var(--mono);font-size:9.5px;background:var(--cream-2);border-radius:5px;padding:0 5px;color:var(--ink-faint)}
  .tabbody{padding:18px 22px 40px}

  /* ---------- cards / panels ---------- */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line-soft)}
  .panel-h h3{font-family:var(--disp);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .panel-h .ph-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
  .panel-b{padding:14px 15px}
  .secttl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin:0 0 9px}

  /* grids */
  .grid{display:grid;gap:14px}
  .pad{padding:18px 20px}

  /* slice list */
  .slice{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;border:1px solid var(--line-soft);
    margin-bottom:7px;background:var(--cream)}
  .slice .sn{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);font-weight:600;width:46px;flex:none}
  .slice .st{flex:1;font-size:12.5px;font-weight:500}
  .slice .ss{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.03em;white-space:nowrap}
  .slice.hot{border-color:rgba(200,100,60,.35);background:rgba(200,100,60,.05)}

  /* status colors */
  .st-green{color:var(--green);background:rgba(79,138,82,.12)}
  .st-blue{color:var(--blue);background:rgba(74,114,176,.12)}
  .st-amber{color:var(--amber);background:rgba(192,138,46,.13)}
  .st-slate{color:var(--slate);background:rgba(138,133,121,.15)}
  .st-red{color:var(--red);background:rgba(182,72,63,.12)}
  .st-violet{color:var(--violet);background:rgba(122,94,168,.13)}
  .st-terra{color:var(--accent);background:rgba(200,100,60,.12)}
  .bg-green{background:var(--green)} .bg-blue{background:var(--blue)} .bg-amber{background:var(--amber)}
  .bg-slate{background:var(--slate)} .bg-red{background:var(--red)} .bg-violet{background:var(--violet)} .bg-terra{background:var(--accent)}
  .tx-green{color:var(--green)} .tx-red{color:var(--red)} .tx-amber{color:var(--amber)} .tx-blue{color:var(--blue)}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:5px}
  .frow{display:flex;align-items:center;gap:10px}
  .frow .fl{width:78px;flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .fbar{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 9px;color:#fff;
    font-family:var(--mono);font-size:11px;font-weight:600;min-width:34px}
  .fpct{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);width:40px}

  /* bars */
  .barline{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .barline .bl{width:90px;flex:none;font-size:12px;color:var(--ink-soft);font-weight:500}
  .bartrack{flex:1;height:9px;background:var(--cream-2);border-radius:6px;overflow:hidden}
  .barfill{height:100%;border-radius:6px}
  .barline .bv{font-family:var(--mono);font-size:11.5px;font-weight:600;width:56px;text-align:right}

  /* stacked spend bar */
  .stackbar{height:30px;border-radius:8px;overflow:hidden;display:flex;border:1px solid var(--line)}
  .stackbar .seg2{height:100%}
  .stack-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px}
  .legi{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
  .legi .ld{width:9px;height:9px;border-radius:3px}
  .legi b{font-family:var(--mono);font-weight:600;color:var(--ink)}

  /* needs-you queue */
  .qitem{border:1px solid var(--line);border-radius:11px;background:var(--paper);margin-bottom:11px;
    box-shadow:var(--shadow);overflow:hidden;transition:.15s}
  .qitem.gated{border-left:3px solid var(--amber)}
  .qitem.ship{border-left:3px solid var(--green)}
  .qhead{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
  .qglyph{width:32px;height:32px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:15px;
    font-family:var(--mono);font-weight:600}
  .qmid{flex:1;min-width:0}
  .qtitle{font-weight:600;font-size:13.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .qco{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:2px;display:flex;gap:8px;align-items:center}
  .qkind{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:5px;letter-spacing:.04em}
  .qgate{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;
    text-transform:uppercase}
  .qbody{padding:0 16px 15px;display:none}
  .qitem.open .qbody{display:block}
  .qev{font-size:12px;color:var(--ink-soft);background:var(--cream-2);border-radius:8px;padding:9px 12px;margin-bottom:11px;
    display:flex;gap:9px;align-items:flex-start}
  .qev .evl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);
    text-transform:uppercase;padding-top:2px;flex:none}
  .qactions{display:flex;gap:9px;align-items:center}
  .qbtn{padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.12s}
  .qbtn.app{background:var(--green);color:#fff;box-shadow:0 2px 7px rgba(79,138,82,.3)}
  .qbtn.app:hover{background:#46794a}
  .qbtn.rej{border:1px solid var(--line);color:var(--ink-soft);background:var(--paper)}
  .qbtn.rej:hover{border-color:#d8ccba;color:var(--ink)}
  .qhint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .qexpand{margin-left:auto;color:var(--ink-faint);font-size:11px;transition:transform .15s}
  .qitem.open .qexpand{transform:rotate(90deg)}
  .qresolved{padding:13px 16px;display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12.5px}
  .qresolved .ok{color:var(--green);font-weight:600}

  .diff{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:var(--cream-2);border-radius:8px;
    padding:11px 13px;margin-bottom:11px;border:1px solid var(--line-soft);white-space:pre;overflow-x:auto}
  .diff .add{color:var(--green)} .diff .mod{color:var(--amber)} .diff .ok2{color:var(--green);font-weight:600}
  .preview-url{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;
    background:var(--ink);color:#eadfce;border-radius:8px;padding:8px 12px;margin-bottom:11px}
  .preview-url .pu-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(79,138,82,.25)}
  .preview-url a{color:#f0c9a6;text-decoration:none;margin-left:auto}
  .draft-box{font-size:12.5px;line-height:1.55;background:var(--cream-2);border-left:3px solid var(--blue);
    border-radius:0 8px 8px 0;padding:11px 13px;margin-bottom:11px;color:var(--ink-soft);white-space:pre-wrap}

  /* activity */
  .act{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
  .act:last-child{border-bottom:none}
  .act .adot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
  .act .atxt{flex:1;font-size:12px;color:var(--ink-soft)}
  .act .atxt b{color:var(--ink);font-weight:600}
  .act .acode{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .act .at{font-family:var(--mono);font-size:10px;color:var(--ink-faint);flex:none}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* kpi strip */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .kl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .kpi .kv{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:5px;display:flex;align-items:baseline;gap:7px}
  .kpi .kv small{font-size:12px;font-weight:600}
  .kpi .kfoot{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:5px}
  .kpispark{position:absolute;right:10px;bottom:8px;opacity:.85}
  .chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;
    padding:1px 7px;border-radius:20px}

  /* progress */
  .prog{height:7px;background:var(--cream-2);border-radius:5px;overflow:hidden;margin-top:7px}
  .prog .pf{height:100%;border-radius:5px}

  /* oversight / strategy */
  .ov{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
  .ov:last-child{border-bottom:none}

function spark(series,w,h,color,fill){
  const max=Math.max(...series),min=Math.min(...series),range=(max-min)||1,n=series.length,dx=w/(n-1);
  const pts=series.map((v,i)=>[i*dx,(h-2)-((v-min)/range)*(h-4)+1]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[n-1];
  const area=fill?`<path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".08"/>`:'';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${color}"/></svg>`;
}
function areaChart(series,w,h,color){
  const pad=8,max=Math.max(...series)*1.08,min=0,n=series.length,dx=(w-pad*2)/(n-1);
  const pts=series.map((v,i)=>[pad+i*dx, h-pad-((v-min)/(max-min))*(h-pad*2-6)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[n-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const grid=[0,.33,.66,1].map(f=>{const y=pad+f*(h-pad*2-6);return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="#e6ddce" stroke-width="1"/>`}).join('');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#fffdf8" stroke="${color}" stroke-width="1.8"/>`).join('');
  const labels=series.map((v,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${pts[i][1]-9}" font-family="JetBrains Mono" font-size="9.5" fill="#7b7368" text-anchor="middle">${v}</text>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function scoreRing(score,color){
  const r=17,c=2*Math.PI*r,off=c*(1-score/100);
  return `<svg class="scorering" viewBox="0 0 42 42"><circle cx="21" cy="21" r="${r}" fill="none" stroke="#eee6d8" stroke-width="4"/><circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 21 21)"/><text x="21" y="25" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="${color}">${score}</text></svg>`;
}
function autoBadges(a){
  const map={0:'slate',1:'blue',2:'green'};
  return `<div class="auto-badges">`+Object.entries(a).map(([k,v])=>`<span class="ab st-${map[v]}" title="${k} autonomy L${v}">${k[0]}${k[1]?'':''}${k.slice(1,2)}·L${v}</span>`).join('')+`</div>`;
}
function autoBadgesShort(a){
  const map={0:'slate',1:'blue',2:'green'};
  const lab={MAKE:'MK',GROW:'GR',RUN:'RN'};
  return `<div class="auto-badges">`+Object.entries(a).map(([k,v])=>`<span class="ab st-${map[v]}">${lab[k]} L${v}</span>`).join('')+`</div>`;
}

/* ============================ COMMAND PALETTE ============================ */
let palItems=[],palCur=0;
function buildPalItems(){
  const items=[];
  NAV.forEach(n=>items.push({cat:'Navigate',g:'→',t:'Go to '+n.label,sub:'view',k:n.k,run:()=>go(n.id)}));
  COMPANIES.forEach(c=>items.push({cat:'Companies',g:c.owner==='You'?'◆':'◇',t:'Open '+c.name,sub:c.stage+' · $'+c.mrr,run:()=>{STATE.company=c.id;STATE.tab='build';go('companies')}}));
  QUEUE.filter(q=>q.status==='active'&&!q.resolved).forEach(q=>items.push({cat:'Resolve',g:q.glyph,t:(q.kind==='SHIP'?'Approve & ship - ':q.kind==='SPEND'?'Authorize - ':'Resolve - ')+CO[q.co].name,sub:q.title,run:()=>{approveGate(q.id)}}));
  items.push({cat:'Actions',g:'✦',t:'Spin up PayoutReconciler',sub:'top opportunity · 82',run:()=>toast('PayoutReconciler: spin-up queued','green')});
  items.push({cat:'Actions',g:'✕',t:'Kill RedditPainBot',sub:'blocked ×3 · 0 users',run:()=>toast('RedditPainBot: kill staged','red')});
  items.push({cat:'Actions',g:'▲',t:'Raise QuietInbox GROW → L2',sub:'best ROI',run:()=>toast('QuietInbox GROW → L2 staged','green')});
  return items;
}
function openPalette(){
  document.getElementById('overlay').classList.add('show');
  const inp=document.getElementById('palInput');inp.value='';palCur=0;
  renderPal('');setTimeout(()=>inp.focus(),20);
}
function closePalette(){document.getElementById('overlay').classList.remove('show')}
function renderPal(q){
  const all=buildPalItems();
  palItems=q?all.filter(i=>(i.t+' '+i.sub).toLowerCase().includes(q.toLowerCase())):all;
  if(palCur>=palItems.length)palCur=0;
  const cats=[...new Set(palItems.map(i=>i.cat))];
  const list=document.getElementById('palList');
  let html='';let idx=0;
  cats.forEach(cat=>{
    html+=`<div class="pal-cat">${cat}</div>`;
    palItems.filter(i=>i.cat===cat).forEach(i=>{const myIdx=idx;html+=`<div class="pal-item ${idx===palCur?'cur':''}" data-pi="${idx}"><span class="pal-g">${i.g}</span><div class="pal-t">${i.t}<span class="pal-sub">${i.sub}</span></div>${i.k?`<kbd>${i.k}</kbd>`:'<span class="pal-k">↵</span>'}</div>`;idx++;});
  });
  list.innerHTML=html||'<div class="empty">No matches.</div>';
}

/* ============================ ACTIONS ============================ */
function go(route){STATE.route=route;STATE.filter='';document.getElementById('search').value='';render();}
function toast(msg,tone){
  const w=document.getElementById('toastwrap');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="tdot bg-${tone||'green'}"></span>${msg}`;
  w.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},2600);
}
function approveGate(id){
  const q=QUEUE.find(x=>x.id===id);if(!q||q.resolved)return;
  q.resolved=true;q.resolution={SHIP:'Shipped to production',SPEND:'Authorized & launched',UNBLOCK:'Hint sent to agent',SIGN:'Signed',POST:'Posted'}[q.kind]||'Approved';
  const w=document.getElementById('toastwrap');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="tdot bg-green"></span>${q.kind} approved - ${CO[q.co].name}: ${q.resolution}<button class="tundo" data-act="undo-gate" data-id="${id}">undo</button>`;
  w.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},3400);
  render();
}
function rejectGate(id){
  const q=QUEUE.find(x=>x.id===id);if(!q)return;
  q.resolved=true;q.resolution='Rejected - feedback sent to agent';
  toast(`${q.kind} rejected - feedback returned to ${CO[q.co].name} agent`,'red');
  render();
}
function undoGate(id){const q=QUEUE.find(x=>x.id===id);if(q){q.resolved=false;q.resolution=null;render();toast('Reverted','slate');}}

/* ============================ EVENT WIRING ============================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  const pi=e.target.closest('[data-pi]');
  if(pi){palCur=+pi.dataset.pi;const it=palItems[palCur];closePalette();if(it)it.run();return;}
  if(!t)return;
  const a=t.dataset.act;
  if(a==='palette'){openPalette();}
  else if(a==='nav'){go(t.dataset.route);}
  else if(a==='nav-needs'){go('needs');}
  else if(a==='select-co'||a==='open-co'){STATE.company=t.dataset.co;STATE.tab='build';go('companies');}
  else if(a==='lmode'){STATE.listMode=t.dataset.m;document.querySelector('.listpane').innerHTML=companyList();}
  else if(a==='tab'){STATE.tab=t.dataset.tab;document.querySelector('.detail').outerHTML=companyDetail();}
  else if(a==='toggle-q'){const it=document.querySelector(`.qitem[data-qid="${t.dataset.id}"]`);if(it)it.classList.toggle('open');}
  else if(a==='approve'){approveGate(t.dataset.id);}
  else if(a==='reject'){rejectGate(t.dataset.id);}
  else if(a==='undo-gate'){undoGate(t.dataset.id);}
  else if(a==='toast'){toast(t.dataset.msg,t.dataset.tone);}
});
document.getElementById('search').addEventListener('input',e=>{
  STATE.filter=e.target.value;
  if(STATE.route==='companies'){document.querySelector('.listpane').innerHTML=companyList();}
});
document.getElementById('palInput').addEventListener('input',e=>{palCur=0;renderPal(e.target.value);});
document.getElementById('overlay').addEventListener('click',closePalette);
document.addEventListener('keydown',e=>{
  const palOpen=document.getElementById('overlay').classList.contains('show');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen?closePalette():openPalette();return;}
  if(palOpen){
    if(e.key==='Escape'){closePalette();}
    else if(e.key==='ArrowDown'){e.preventDefault();palCur=Math.min(palCur+1,palItems.length-1);renderPal(document.getElementById('palInput').value);}
    else if(e.key==='ArrowUp'){e.preventDefault();palCur=Math.max(palCur-1,0);renderPal(document.getElementById('palInput').value);}
    else if(e.key==='Enter'){e.preventDefault();const it=palItems[palCur];closePalette();if(it)it.run();}
    return;
  }
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT')return;
  if(e.key==='Escape'){if(STATE.route!=='home')go('home');}
  else if(e.key==='/'){e.preventDefault();document.getElementById('search').focus();}
  else if(/^[1-7]$/.test(e.key)){const n=NAV[+e.key-1];if(n)go(n.id);}
});

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
