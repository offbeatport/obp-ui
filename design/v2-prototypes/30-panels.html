<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Panels</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --ink:#16181d;
    --ink-2:#5a606b;
    --ink-3:#8b909c;
    --line:#e8eaed;
    --line-2:#eef0f2;
    --accent:#5b5bf0;
    --accent-soft:#eeeefe;
    --green:#1aa86b; --green-soft:#e6f6ee;
    --amber:#d9920b; --amber-soft:#fbf2db;
    --violet:#7b5cff; --violet-soft:#efebff;
    --blue:#2f7bf0; --blue-soft:#e7f0fe;
    --slate:#7b818d; --slate-soft:#eef0f2;
    --red:#dc4040; --red-soft:#fbe9e9;
    --gray:#9aa0ac;
    --radius:13px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(16,18,29,.04), 0 1px 3px rgba(16,18,29,.05);
    --shadow-lg:0 10px 40px rgba(16,18,29,.12), 0 2px 8px rgba(16,18,29,.06);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.01em;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  kbd{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    background:var(--line-2);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;color:var(--ink-2);line-height:1.4;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d3d6db;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#bfc3ca}

  /* ===== Shell ===== */
  .shell{display:flex;flex-direction:column;height:100vh}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:0 22px;height:54px;flex:0 0 auto;
    background:rgba(246,247,249,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .brand small{color:var(--ink-3);font-weight:450;font-size:12px}
  .topnav{display:flex;gap:2px;margin-left:8px}
  .topnav button{
    font-size:13px;font-weight:500;color:var(--ink-2);
    padding:6px 12px;border-radius:8px;transition:all .14s var(--ease);
  }
  .topnav button:hover{background:var(--line-2);color:var(--ink)}
  .topnav button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .topbar .spacer{flex:1}
  .cmdk{
    display:flex;align-items:center;gap:9px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;width:280px;
    color:var(--ink-3);font-size:13px;transition:all .15s var(--ease);box-shadow:var(--shadow);
  }
  .cmdk:hover{border-color:#d8dbe0}
  .cmdk svg{width:14px;height:14px;opacity:.6}
  .cmdk .spacer{flex:1}
  .pill-need{
    display:flex;align-items:center;gap:7px;
    background:var(--violet-soft);color:var(--violet);
    font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:9px;
    transition:transform .14s var(--ease);
  }
  .pill-need:hover{transform:translateY(-1px)}
  .pill-need .pdot{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:pulse 1.8s infinite}

  /* ===== Overview grid ===== */
  .scrollwrap{flex:1;overflow:auto;position:relative}
  .grid{
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:16px;
    padding:22px;
    max-width:1480px;
    margin:0 auto;
    align-content:start;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:box-shadow .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease);
  }
  .panel.click{cursor:pointer}
  .panel.click:hover{box-shadow:var(--shadow-lg);border-color:#dde0e5;transform:translateY(-1px)}
  .phead{
    display:flex;align-items:center;gap:9px;
    padding:13px 16px 11px;border-bottom:1px solid var(--line-2);flex:0 0 auto;
  }
  .phead .ico{
    width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;
  }
  .phead .ico svg{width:13px;height:13px}
  .phead h3{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .phead .sub{color:var(--ink-3);font-size:11.5px;font-weight:450}
  .phead .spacer{flex:1}
  .viewall{
    font-size:11.5px;font-weight:500;color:var(--ink-3);
    padding:3px 7px;border-radius:6px;transition:all .14s var(--ease);
    display:flex;align-items:center;gap:3px;
  }
  .viewall:hover{background:var(--line-2);color:var(--accent)}
  .viewall svg{width:11px;height:11px}
  .pbody{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}

  /* spans */
  .c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}
  .c-6{grid-column:span 6}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}

  /* ==== Needs you panel ==== */
  .panel.needs{
    border-color:#dfd9ff;background:linear-gradient(180deg,#faf9ff,#ffffff 60%);
  }
  .needs .phead{border-bottom-color:#eee9ff}
  .needs-row{display:flex;align-items:flex-start;gap:13px}
  .needs-glyph{
    width:42px;height:42px;border-radius:11px;background:var(--violet-soft);
    color:var(--violet);display:grid;place-items:center;flex:0 0 auto;
  }
  .needs-glyph svg{width:20px;height:20px}
  .needs-main{flex:1;min-width:0}
  .needs-main .co{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
  .needs-main .slice{color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .needs-meta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .chip{
    font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip .cdot{width:6px;height:6px;border-radius:50%}
  .chip.green{background:var(--green-soft);color:var(--green)}
  .chip.violet{background:var(--violet-soft);color:var(--violet)}
  .chip.mono{font-family:'JetBrains Mono',monospace;background:var(--line-2);color:var(--ink-2)}
  .needs-cta{
    margin-top:14px;width:100%;
    background:var(--accent);color:#fff;font-weight:600;font-size:13px;
    padding:11px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .15s var(--ease);box-shadow:0 1px 2px rgba(91,91,240,.3);
  }
  .needs-cta:hover{background:#4a4ae0;transform:translateY(-1px);box-shadow:0 4px 14px rgba(91,91,240,.32)}
  .needs-cta:active{transform:translateY(0)}
  .needs-cta kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:#fff}

  /* ==== Now building ==== */
  .build-list{display:flex;flex-direction:column;gap:2px}
  .build-row{
    display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;
    transition:background .13s var(--ease);cursor:pointer;
  }
  .build-row:hover{background:var(--line-2)}
  .build-row .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .build-row .co{font-weight:550;font-size:13px;flex:0 0 auto;min-width:96px}
  .build-row .what{color:var(--ink-2);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .build-row .st{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;flex:0 0 auto}
  .sdot.building{background:var(--blue);animation:pulse 1.5s infinite}
  .sdot.todo{background:var(--slate)}
  .sdot.blocked{background:var(--red)}
  .st.building{background:var(--blue-soft);color:var(--blue)}
  .st.todo{background:var(--slate-soft);color:var(--slate)}
  .st.blocked{background:var(--red-soft);color:var(--red)}

  /* ==== Opportunities ==== */
  .opp-list{display:flex;flex-direction:column;gap:8px}
  .opp{
    display:flex;align-items:center;gap:12px;padding:10px 11px;
    border:1px solid var(--line-2);border-radius:10px;transition:all .14s var(--ease);
  }
  .opp:hover{border-color:#dde0e5;background:#fcfcfd}
  .opp.killed{opacity:.5}
  .score{
    width:38px;height:38px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;
  }
  .score.hi{background:var(--green-soft);color:var(--green)}
  .score.mid{background:var(--amber-soft);color:var(--amber)}
  .score.lo{background:var(--slate-soft);color:var(--slate)}
  .opp .info{flex:1;min-width:0}
  .opp .info .t{font-weight:600;font-size:13px}
  .opp .info .th{color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .promote{
    font-size:12px;font-weight:600;color:var(--accent);
    padding:6px 11px;border-radius:8px;border:1px solid var(--accent-soft);
    background:var(--accent-soft);transition:all .14s var(--ease);flex:0 0 auto;
  }
  .promote:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .promote.killed{color:var(--red);border-color:var(--red-soft);background:var(--red-soft);pointer-events:none}

  /* ==== Metrics ==== */
  .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .metric{padding:2px}
  .metric .v{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .metric .v .cur{font-size:17px;color:var(--ink-3);font-weight:500}
  .metric .k{color:var(--ink-3);font-size:11.5px;margin-top:1px;font-weight:500}
  .metric .delta{font-size:11px;font-weight:600;margin-top:3px}
  .metric .delta.up{color:var(--green)}

  /* ==== Companies mini ==== */
  .co-grid{display:flex;flex-direction:column;gap:2px}
  .co-row{
    display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer;
    transition:background .13s var(--ease);
  }
  .co-row:hover{background:var(--line-2)}
  .co-av{
    width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
    font-weight:600;font-size:13px;color:#fff;
  }
  .co-row .nm{font-weight:550;font-size:13px;flex:1}
  .co-row .nm .stat{font-size:10px;font-weight:500;color:var(--ink-3);margin-left:6px}
  .co-row .nm .stat::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:1px}
  .stat.active::before{background:var(--green)}
  .stat.paused::before{background:var(--amber)}
  .co-row .mr{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-2);font-weight:500}
  .co-row .nd{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:pulse 1.8s infinite;flex:0 0 auto}

  /* ==== Next moves ==== */
  .moves{display:flex;flex-direction:column;gap:8px}
  .move{
    display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:10px;
    background:#fbfbfc;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);
    transition:all .14s var(--ease);cursor:pointer;
  }
  .move:hover{border-color:#dde0e5;color:var(--ink)}
  .move .num{
    width:18px;height:18px;border-radius:6px;flex:0 0 auto;
    background:var(--accent-soft);color:var(--accent);
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    display:grid;place-items:center;margin-top:1px;
  }

  /* ===== Activity strip (collapsible, bottom) ===== */
  .activity{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    box-shadow:0 -2px 12px rgba(16,18,29,.04);z-index:30;
  }
  .act-bar{
    display:flex;align-items:center;gap:12px;padding:0 22px;height:48px;cursor:pointer;
    transition:background .13s var(--ease);
  }
  .act-bar:hover{background:#fbfbfc}
  .act-label{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    display:flex;align-items:center;gap:7px;flex:0 0 auto;
  }
  .act-label .live{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite}
  .act-latest{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);overflow:hidden}
  .act-latest .co{font-weight:600;color:var(--ink);flex:0 0 auto}
  .act-latest .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-latest .ago{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:0 0 auto}
  .act-chev{transition:transform .2s var(--ease);color:var(--ink-3);flex:0 0 auto}
  .act-chev svg{width:15px;height:15px;display:block}
  .activity.open .act-chev{transform:rotate(180deg)}
  .act-stream{
    max-height:0;overflow:hidden;transition:max-height .26s var(--ease);
  }
  .activity.open .act-stream{max-height:340px;overflow-y:auto}
  .act-inner{padding:4px 22px 16px;display:flex;flex-direction:column;gap:14px}
  .act-group .gh{
    font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
    padding:6px 0 7px;display:flex;align-items:center;gap:7px;
  }
  .act-group .gh .av{width:16px;height:16px;border-radius:5px;color:#fff;display:grid;place-items:center;font-size:9px}
  .act-item{
    display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);
    border-left:2px solid transparent;
  }
  .act-item .idot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--slate)}
  .act-item.running{background:#fbfbfd;border-left-color:var(--blue)}
  .act-item.running .idot{background:var(--blue);animation:pulse 1.4s infinite}
  .act-item.await .idot{background:var(--violet)}
  .act-item.blocked .idot{background:var(--red)}
  .act-item.check .idot{background:var(--green)}
  .act-item .it{flex:1}
  .act-item .ia{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}

  /* ===== Company zoom (right-sliding panel) ===== */
  .scrim{
    position:fixed;inset:0;background:rgba(20,22,30,.34);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .22s var(--ease);z-index:50;
  }
  .scrim.show{opacity:1;pointer-events:auto}
  .zoom{
    position:fixed;top:0;right:0;height:100vh;width:min(860px,92vw);
    background:var(--bg);box-shadow:var(--shadow-lg);
    transform:translateX(100%);transition:transform .3s var(--ease);
    z-index:60;display:flex;flex-direction:column;
  }
  .zoom.show{transform:translateX(0)}
  .zhead{
    display:flex;align-items:center;gap:13px;padding:16px 22px;
    border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;
  }
  .zback{
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    color:var(--ink-2);transition:all .14s var(--ease);flex:0 0 auto;
  }
  .zback:hover{background:var(--line-2);color:var(--ink)}
  .zback svg{width:16px;height:16px}
  .zhead .zav{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:600;flex:0 0 auto}
  .zhead .zt{flex:1;min-width:0}
  .zhead .zt h2{font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .zhead .zt .zsub{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zhead .zurl{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);
    background:var(--accent-soft);padding:6px 11px;border-radius:8px;display:flex;align-items:center;gap:6px;flex:0 0 auto;
    text-decoration:none;
  }
  .zhead .zurl svg{width:12px;height:12px}
  .zhead .esc{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .zbody{flex:1;overflow:auto;padding:22px}

  .gate{
    background:var(--panel);border:1px solid #dfd9ff;border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;
  }
  .gate-head{
    display:flex;align-items:center;gap:11px;padding:14px 18px;
    background:linear-gradient(180deg,#faf9ff,#fff);border-bottom:1px solid #eee9ff;
  }
  .gate-head .gico{width:26px;height:26px;border-radius:8px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center}
  .gate-head .gico svg{width:15px;height:15px}
  .gate-head .gt{flex:1}
  .gate-head .gt h3{font-size:14px;font-weight:600}
  .gate-head .gt .gs{font-size:12px;color:var(--ink-2)}
  .gate-head .tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--violet);background:var(--violet-soft);padding:4px 9px;border-radius:6px}
  .gate-body{padding:18px}
  .gate-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .gmeta{
    flex:1;min-width:200px;border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;
  }
  .gmeta .gk{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:5px}
  .gmeta .gv{font-size:12.5px;display:flex;align-items:center;gap:7px}
  .gmeta a.gv{color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:12px}
  .gmeta a.gv:hover{text-decoration:underline}
  .gmeta .pass{color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px}
  .gmeta .pass svg{width:14px;height:14px}
  .gmeta .donewhen{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);line-height:1.5}

  .diff-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .diff{
    background:#fafbfc;border:1px solid var(--line);border-radius:10px;
    font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;
    padding:13px 0;overflow-x:auto;
  }
  .diff .dl{padding:0 16px;white-space:pre;display:block}
  .diff .dl.add{background:var(--green-soft);color:#0f7a4d}
  .diff .dl.ctx{color:var(--ink-3)}

  .preview{
    margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .preview-bar{
    display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafbfc;border-bottom:1px solid var(--line-2);
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);
  }
  .preview-bar .traffic{display:flex;gap:5px}
  .preview-bar .traffic i{width:9px;height:9px;border-radius:50%;display:block}
  .preview-bar .traffic i:nth-child(1){background:#ff5f57}
  .preview-bar .traffic i:nth-child(2){background:#febc2e}
  .preview-bar .traffic i:nth-child(3){background:#28c840}
  .preview-frame{padding:18px;background:#fff;min-height:90px}
  .preview-frame .ph{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .preview-frame .ph .badge{font-size:10px;font-weight:600;background:var(--green-soft);color:var(--green);padding:2px 7px;border-radius:5px}
  .preview-frame .lead{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:12.5px}
  .preview-frame .lead .ls{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--green);width:30px}
  .preview-frame .lead .ln{flex:1;color:var(--ink-2)}

  .gate-actions{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
  .btn-approve{
    flex:1;background:var(--green);color:#fff;font-weight:600;font-size:13.5px;
    padding:12px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .15s var(--ease);box-shadow:0 1px 2px rgba(26,168,107,.3);
  }
  .btn-approve:hover{background:#15915c;transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,168,107,.3)}
  .btn-approve svg{width:15px;height:15px}
  .btn-reject{
    flex:1;background:var(--panel);color:var(--ink-2);font-weight:600;font-size:13.5px;
    padding:12px;border-radius:10px;border:1px solid var(--line);
    transition:all .15s var(--ease);
  }
  .btn-reject:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
  .btn-approve.done{background:var(--green);pointer-events:none}
  .btn-approve.done::after{content:'✓ Approved'}
  .btn-approve.done span{display:none}

  /* reject feedback */
  .reject-box{margin-top:12px;display:none;flex-direction:column;gap:9px}
  .reject-box.show{display:flex;animation:slidein .2s var(--ease)}
  .reject-box textarea{
    font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:11px;resize:vertical;
    min-height:64px;color:var(--ink);background:#fff;
  }
  .reject-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .reject-box .rb-actions{display:flex;gap:9px;justify-content:flex-end}
  .reject-box .rb-cancel{font-size:12.5px;font-weight:500;color:var(--ink-2);padding:8px 14px;border-radius:8px}
  .reject-box .rb-cancel:hover{background:var(--line-2)}
  .reject-box .rb-send{font-size:12.5px;font-weight:600;color:#fff;background:var(--red);padding:8px 16px;border-radius:8px}
  .reject-box .rb-send:hover{background:#c43636}

  /* slices in zoom */
  .ztitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .ztitle .va{margin-left:auto;font-size:11px;font-weight:500;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .slices{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .slice-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
  .slice-row:last-child{border-bottom:none}
  .slice-row .sn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);width:22px;flex:0 0 auto}
  .slice-row .sd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .slice-row .stt{flex:1}
  .slice-row .sst{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:5px;flex:0 0 auto}
  .slice-row .pr{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);flex:0 0 auto}
  .sd.shipped{background:var(--green)}.sd.awaiting_approval{background:var(--violet);animation:pulse 1.8s infinite}
  .sd.todo{background:var(--slate)}.sd.blocked{background:var(--red)}.sd.building{background:var(--blue);animation:pulse 1.5s infinite}
  .sst.shipped{background:var(--green-soft);color:var(--green)}
  .sst.awaiting_approval{background:var(--violet-soft);color:var(--violet)}
  .sst.todo{background:var(--slate-soft);color:var(--slate)}
  .sst.blocked{background:var(--red-soft);color:var(--red)}
  .slice-row.note .nt{font-size:11px;color:var(--red);font-style:italic}

  /* company chat */
  .zchat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
  .zchat-log{padding:16px;display:flex;flex-direction:column;gap:11px;max-height:240px;overflow-y:auto}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg .mav{width:24px;height:24px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:600}
  .msg.assistant .mav{background:var(--accent-soft);color:var(--accent)}
  .msg.user .mav{background:var(--line-2);color:var(--ink-2)}
  .msg .bubble{font-size:13px;line-height:1.5;padding:9px 12px;border-radius:11px}
  .msg.assistant .bubble{background:#f7f8fa;color:var(--ink);border-top-left-radius:4px}
  .msg.user .bubble{background:var(--accent);color:#fff;border-top-right-radius:4px}
  .zchat-input{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line-2)}
  .zchat-input input{flex:1;border:none;background:none;font-family:inherit;font-size:13px;color:var(--ink)}
  .zchat-input input:focus{outline:none}
  .zchat-input input::placeholder{color:var(--ink-3)}
  .zchat-input .send{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .zchat-input .send svg{width:14px;height:14px}

  /* global chat bar (overview) */
  .globalchat{
    position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:35;
    width:min(620px,80vw);display:flex;align-items:center;gap:11px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow-lg);padding:11px 14px;transition:bottom .26s var(--ease);
  }
  .activity.open ~ .globalchat{bottom:64px}
  .globalchat .gci{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
  .globalchat .gci svg{width:14px;height:14px}
  .globalchat input{flex:1;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink)}
  .globalchat input:focus{outline:none}
  .globalchat input::placeholder{color:var(--ink-3)}
  .globalchat .hint{display:flex;gap:5px;flex:0 0 auto}

  /* toast */
  .toast{
    position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-12px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;
    padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:90;
    opacity:0;pointer-events:none;transition:all .22s var(--ease);display:flex;align-items:center;gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .toast.violet .tdot{background:var(--violet)}
  .toast.red .tdot{background:var(--red)}

  /* corner badge */
  .badge{
    position:fixed;left:18px;bottom:16px;z-index:80;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    background:var(--ink);color:#fff;padding:6px 11px;border-radius:8px;
    box-shadow:var(--shadow-lg);letter-spacing:.02em;
  }
  .badge .accent{color:#a9a9ff}

  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(47,123,240,.35)}50%{opacity:.55;box-shadow:0 0 0 4px rgba(47,123,240,0)}}
  @keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="shell">
  <!-- Topbar -->
  <header class="topbar">
    <div class="brand"><span class="dot"></span>C Slop Slop <small>· founder console</small></div>
    <nav class="topnav">
      <button class="on" data-view="overview">Overview</button>
      <button data-view="opps" onclick="scrollToPanel('opps')">Opportunities</button>
    </nav>
    <div class="spacer"></div>
    <button class="cmdk" onclick="cmd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <span>Search or ask anything</span><span class="spacer"></span><kbd>⌘K</kbd>
    </button>
    <button class="pill-need" onclick="openCo('leadsift')">
      <span class="pdot"></span>1 needs you
    </button>
  </header>

  <!-- Overview scroll area -->
  <div class="scrollwrap" id="scrollwrap">
    <main class="grid" id="grid"></main>
  </div>

  <!-- Activity strip -->
  <section class="activity" id="activity">
    <div class="act-bar" onclick="toggleActivity()">
      <span class="act-label"><span class="live"></span>Live activity</span>
      <div class="act-latest" id="actLatest"></div>
      <span class="act-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></span>
    </div>
    <div class="act-stream"><div class="act-inner" id="actInner"></div></div>
  </section>
</div>

<!-- Global command/chat bar -->
<div class="globalchat" id="globalchat">
  <span class="gci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-1L3 21l1.1-4A8.4 8.4 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg></span>
  <input id="globalInput" placeholder="Direct your portfolio — “approve LeadSift digest”, “promote PayoutReconciler”…" />
  <div class="hint"><kbd>↵</kbd></div>
</div>

<!-- Company zoom -->
<div class="scrim" id="scrim" onclick="closeCo()"></div>
<aside class="zoom" id="zoom"></aside>

<!-- Toast -->
<div class="toast" id="toast"><span class="tdot"></span><span id="toastText"></span></div>

<!-- Badge -->
<div class="badge">30 <span class="accent">·</span> Panels</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress — same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped — no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 — writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 — running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed — GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog — slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked — no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) — it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed — want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice — one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

const COLORS = {leadsift:'#5b5bf0',quietinbox:'#1aa86b',translatorbill:'#d9920b',datadrop:'#2f7bf0',redditpainbot:'#9aa0ac'};
const coById = id => DATA.companies.find(c=>c.id===id);
const coByName = nm => DATA.companies.find(c=>c.name===nm);
const initials = nm => nm.replace(/([a-z])([A-Z])/g,'$1 $2').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===== Icons ===== */
const IC = {
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  hammer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 6l4 4"/><path d="M5 21l9-9"/><path d="M14.5 5.5L18 2l4 4-3.5 3.5z"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 5h5v5M19 5l-9 9M19 13v6H5V5h6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
};

/* ===== Render overview ===== */
function scoreClass(s){return s>=75?'hi':s>=50?'mid':'lo'}

function renderGrid(){
  const p = DATA.portfolio;
  const ls = coById('leadsift');
  const ap = ls.approval;

  // Now building / active slices
  const buildRows = DATA.companies.filter(c=>c.currentSlice).map(c=>{
    const s=c.currentSlice;
    return `<div class="build-row" onclick="openCo('${c.id}')">
      <span class="sdot ${s.status}"></span>
      <span class="co">${c.name}</span>
      <span class="what">slice ${s.n} · ${esc(s.title)}${s.step?` — ${esc(s.step)}`:''}</span>
      <span class="st ${s.status}">${s.status==='building'?'building':s.status}</span>
    </div>`;
  }).join('');

  // Opportunities
  const oppRows = DATA.opportunities.map(o=>{
    const killed=o.status==='killed';
    return `<div class="opp${killed?' killed':''}">
      <span class="score ${scoreClass(o.score)}">${o.score}</span>
      <div class="info"><div class="t">${o.title}</div><div class="th">${esc(o.thesis)}</div></div>
      <button class="promote${killed?' killed':''}" onclick="promote('${o.id}','${o.title}')">${killed?'Killed':'Promote'}</button>
    </div>`;
  }).join('');

  // Companies mini list
  const coRows = DATA.companies.map(c=>`
    <div class="co-row" onclick="openCo('${c.id}')">
      <span class="co-av" style="background:${COLORS[c.id]}">${initials(c.name)}</span>
      <span class="nm">${c.name}<span class="stat ${c.status}">${c.status}</span></span>
      ${c.needsYou?'<span class="nd" title="needs you"></span>':''}
      <span class="mr">$${c.mrr}</span>
    </div>`).join('');

  // Next moves
  const moveRows = DATA.nextMoves.map((m,i)=>`
    <div class="move" onclick="${i===0?"openCo('leadsift')":i===2?"promote('o1','PayoutReconciler')":"toast('Opened RedditPainBot','violet')"}">
      <span class="num">${i+1}</span><span>${esc(m)}</span>
    </div>`).join('');

  document.getElementById('grid').innerHTML = `
  <!-- Needs you -->
  <section class="panel needs c-5">
    <div class="phead">
      <span class="ico" style="background:var(--violet-soft);color:var(--violet)">${IC.bell}</span>
      <h3>Needs you</h3><span class="sub">· ${p.needsYou} pending approval</span>
      <span class="spacer"></span>
    </div>
    <div class="pbody">
      <div class="needs-row">
        <span class="needs-glyph">${IC.shield}</span>
        <div class="needs-main">
          <div class="co"><span class="co-av" style="background:${COLORS.leadsift};width:18px;height:18px;border-radius:5px;font-size:9px">${initials('LeadSift')}</span> LeadSift · slice ${ap.slice}</div>
          <div class="slice">${esc(ap.title)}</div>
          <div class="needs-meta">
            <span class="chip green"><span class="cdot" style="background:var(--green)"></span>doneWhen passed</span>
            <span class="chip violet"><span class="cdot" style="background:var(--violet)"></span>awaiting approval</span>
            <span class="chip mono">attempt ${ap.attempt}</span>
          </div>
        </div>
      </div>
      <button class="needs-cta" onclick="openCo('leadsift')">Review &amp; approve <kbd>↵</kbd></button>
    </div>
  </section>

  <!-- Portfolio metrics -->
  <section class="panel c-4">
    <div class="phead">
      <span class="ico" style="background:var(--green-soft);color:var(--green)">${IC.chart}</span>
      <h3>Portfolio</h3><span class="spacer"></span>
      <span class="sub mono">live</span>
    </div>
    <div class="pbody">
      <div class="metrics">
        <div class="metric"><div class="v"><span class="cur">$</span>${p.mrr}</div><div class="k">MRR</div><div class="delta up">▲ 14%</div></div>
        <div class="metric"><div class="v">${p.users}</div><div class="k">Users</div><div class="delta up">▲ 9</div></div>
        <div class="metric"><div class="v">${p.activeCompanies}</div><div class="k">Active companies</div></div>
        <div class="metric"><div class="v">${p.slicesShipped}</div><div class="k">Slices shipped</div></div>
      </div>
    </div>
  </section>

  <!-- Companies -->
  <section class="panel c-3">
    <div class="phead">
      <span class="ico" style="background:var(--accent-soft);color:var(--accent)">${IC.grid}</span>
      <h3>Companies</h3><span class="spacer"></span>
      <button class="viewall" onclick="openCo('leadsift')">open ${IC.arrow}</button>
    </div>
    <div class="pbody"><div class="co-grid">${coRows}</div></div>
  </section>

  <!-- Now building -->
  <section class="panel c-7">
    <div class="phead">
      <span class="ico" style="background:var(--blue-soft);color:var(--blue)">${IC.hammer}</span>
      <h3>Now building</h3><span class="sub">· top slice per company</span>
      <span class="spacer"></span>
      <button class="viewall" onclick="toggleActivity(true)">live activity ${IC.arrow}</button>
    </div>
    <div class="pbody"><div class="build-list">${buildRows}</div></div>
  </section>

  <!-- Next moves -->
  <section class="panel c-5">
    <div class="phead">
      <span class="ico" style="background:var(--amber-soft);color:var(--amber)">${IC.route}</span>
      <h3>Next moves</h3><span class="spacer"></span>
    </div>
    <div class="pbody"><div class="moves">${moveRows}</div></div>
  </section>

  <!-- Opportunities -->
  <section class="panel c-12" id="panel-opps">
    <div class="phead">
      <span class="ico" style="background:var(--violet-soft);color:var(--violet)">${IC.spark}</span>
      <h3>Opportunities</h3><span class="sub">· scored thoughts — promote to a company</span>
      <span class="spacer"></span>
      <button class="viewall" onclick="toast('Opportunities inbox','violet')">view all ${IC.arrow}</button>
    </div>
    <div class="pbody"><div class="opp-list">${oppRows}</div></div>
  </section>`;
}

/* ===== Activity strip ===== */
function renderActivity(){
  const latest = DATA.activity.find(a=>a.running) || DATA.activity[0];
  document.getElementById('actLatest').innerHTML =
    `<span class="co">${latest.co}</span><span class="tx">${esc(latest.text)}</span><span class="ago">${latest.t}</span>`;

  // grouped by company, ordering by appearance
  const groups={};
  DATA.activity.forEach(a=>{(groups[a.co]=groups[a.co]||[]).push(a)});
  document.getElementById('actInner').innerHTML = Object.entries(groups).map(([co,items])=>{
    const c=coByName(co);
    return `<div class="act-group">
      <div class="gh"><span class="av" style="background:${c?COLORS[c.id]:'#9aa0ac'}">${initials(co)}</span>${co}</div>
      ${items.map(a=>`<div class="act-item ${a.running?'running':a.kind}">
        <span class="idot"></span><span class="it">${esc(a.text)}</span><span class="ia">${a.t}</span>
      </div>`).join('')}
    </div>`;
  }).join('');
}
function toggleActivity(force){
  const el=document.getElementById('activity');
  if(force===true) el.classList.add('open');
  else el.classList.toggle('open');
}

/* ===== Company zoom ===== */
function buildSlices(c){
  if(!c.slices){
    const s=c.currentSlice;
    return `<div class="slice-row${s.note?' note':''}">
      <span class="sn">${s.n}</span><span class="sd ${s.status}"></span>
      <span class="stt">${esc(s.title)}</span>
      <span class="sst ${s.status}">${s.status.replace('_',' ')}</span>
    </div>`;
  }
  return c.slices.map(s=>`
    <div class="slice-row${s.note?' note':''}">
      <span class="sn">${s.n}</span><span class="sd ${s.status}"></span>
      <span class="stt">${esc(s.title)}${s.note?` <span class="nt">— ${esc(s.note)}</span>`:''}</span>
      ${s.priority?`<span class="pr">P ${s.priority}</span>`:''}
      <span class="sst ${s.status}">${s.status.replace('_',' ')}</span>
    </div>`).join('');
}

function openCo(id){
  const c=coById(id);
  const z=document.getElementById('zoom');
  const hasGate = !!c.approval;
  const ap=c.approval;

  const gateHtml = hasGate ? `
    <div class="gate">
      <div class="gate-head">
        <span class="gico">${IC.shield}</span>
        <div class="gt"><h3>Approval gate · slice ${ap.slice}</h3><div class="gs">${esc(ap.title)}</div></div>
        <span class="tag">Needs you</span>
      </div>
      <div class="gate-body">
        <div class="gate-meta">
          <div class="gmeta"><div class="gk">Live preview</div>
            <a class="gv" href="${ap.previewUrl}" target="_blank">${ap.previewUrl} ${IC.ext}</a></div>
          <div class="gmeta"><div class="gk">doneWhen check</div>
            <div class="gv pass">${IC.check} ${ap.checkResult} <span style="color:var(--ink-3);font-weight:400">· attempt ${ap.attempt}</span></div>
            <div class="donewhen" style="margin-top:6px">${esc(ap.doneWhen)}</div></div>
        </div>

        <div class="diff-label">Diff <span style="color:var(--green)">+5</span> <span style="color:var(--ink-3)">±1</span></div>
        <div class="diff">${ap.diff.split('\n').map(l=>{
          const cls=l.startsWith('+')?'add':'ctx';
          return `<span class="dl ${cls}">${esc(l)}</span>`;
        }).join('')}</div>

        <div class="preview">
          <div class="preview-bar"><div class="traffic"><i></i><i></i><i></i></div>${ap.previewUrl}</div>
          <div class="preview-frame">
            <div class="ph">Your top leads today <span class="badge">200 OK</span></div>
            <div class="lead"><span class="ls">94</span><span class="ln">acme.co — “need pricing for 40 seats”</span></div>
            <div class="lead"><span class="ls">88</span><span class="ln">northwind.io — “demo request, enterprise”</span></div>
            <div class="lead"><span class="ls">76</span><span class="ln">globex.dev — “integration question”</span></div>
          </div>
        </div>

        <div class="gate-actions">
          <button class="btn-approve" id="approveBtn" onclick="approve()"><span>${IC.check} Approve slice ${ap.slice}</span></button>
          <button class="btn-reject" onclick="toggleReject()">Reject with feedback</button>
        </div>
        <div class="reject-box" id="rejectBox">
          <textarea id="rejectText" placeholder="What needs to change? The agent will re-run the slice with this feedback…"></textarea>
          <div class="rb-actions">
            <button class="rb-cancel" onclick="toggleReject()">Cancel</button>
            <button class="rb-send" onclick="sendReject()">Send feedback &amp; re-run</button>
          </div>
        </div>
      </div>
    </div>` : '';

  const chatLog = (c.id==='leadsift' ? DATA.chat : [
    {role:'assistant',text:`${c.name} is ${c.currentSlice?('on slice '+c.currentSlice.n+' — '+c.currentSlice.title):'active'}. Anything you want to redirect?`}
  ]).map(m=>`
    <div class="msg ${m.role}">
      <span class="mav">${m.role==='user'?'You':'AI'}</span>
      <span class="bubble">${esc(m.text)}</span>
    </div>`).join('');

  z.innerHTML = `
    <div class="zhead">
      <button class="zback" onclick="closeCo()" title="Back to overview (Esc)">${IC.back}</button>
      <span class="zav" style="background:${COLORS[c.id]}">${initials(c.name)}</span>
      <div class="zt">
        <h2>${c.name} <span class="stat ${c.status}" style="font-size:11px;font-weight:500;color:var(--ink-3)">${c.status}</span></h2>
        <div class="zsub">${esc(c.thesis)}</div>
      </div>
      ${c.previewUrl?`<a class="zurl" href="${c.previewUrl}" target="_blank">${c.previewUrl.replace('http://','')} ${IC.ext}</a>`:''}
      <span class="esc"><kbd>Esc</kbd> back</span>
    </div>
    <div class="zbody">
      ${gateHtml}
      <div class="ztitle">Slices <span class="va">${c.slices?c.slices.length:1} total</span></div>
      <div class="slices">${buildSlices(c)}</div>

      <div class="zchat">
        <div class="ztitle" style="padding:13px 16px 0;margin:0">${c.name} chat <span class="va">company spine</span></div>
        <div class="zchat-log">${chatLog}</div>
        <div class="zchat-input">
          <input placeholder="Message ${c.name}…" onkeydown="if(event.key==='Enter')coChat(this)"/>
          <button class="send" onclick="coChat(this.previousElementSibling)">${IC.send}</button>
        </div>
      </div>
    </div>`;

  document.getElementById('scrim').classList.add('show');
  z.classList.add('show');
}
function closeCo(){
  document.getElementById('zoom').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');
}

/* ===== Actions ===== */
function approve(){
  const b=document.getElementById('approveBtn');
  b.classList.add('done');
  toast('Approved ✓ — LeadSift slice 5 shipped','green');
}
function toggleReject(){document.getElementById('rejectBox').classList.toggle('show');
  if(document.getElementById('rejectBox').classList.contains('show')) document.getElementById('rejectText').focus();}
function sendReject(){
  const v=document.getElementById('rejectText').value.trim();
  toggleReject();
  document.getElementById('rejectText').value='';
  toast(v?'Feedback sent — agent re-running slice 5':'Reject sent — agent re-running','red');
}
function promote(id,title){toast(`Promoted “${title}” → new company`,'violet');}
function coChat(input){
  const v=input.value.trim(); if(!v)return;
  const log=input.closest('.zchat').querySelector('.zchat-log');
  log.insertAdjacentHTML('beforeend',`<div class="msg user"><span class="mav">You</span><span class="bubble">${esc(v)}</span></div>`);
  input.value='';
  log.scrollTop=log.scrollHeight;
  setTimeout(()=>{
    log.insertAdjacentHTML('beforeend',`<div class="msg assistant"><span class="mav">AI</span><span class="bubble">On it — re-prioritizing and reporting back in the live activity.</span></div>`);
    log.scrollTop=log.scrollHeight;
  },520);
}
function cmd(){
  document.getElementById('globalInput').focus();
  toast('⌘K — ask or jump anywhere','violet');
}
function scrollToPanel(id){
  document.querySelector('.topnav button[data-view="overview"]').classList.remove('on');
  event.target.classList.add('on');
  document.getElementById('panel-opps').scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{
    document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('on',b.dataset.view==='overview'));
  },900);
}

let toastTimer;
function toast(text,kind){
  const t=document.getElementById('toast');
  t.className='toast'+(kind&&kind!=='green'?' '+kind:'');
  document.getElementById('toastText').textContent=text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* global chat */
document.getElementById('globalInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){
    const v=e.target.value.trim();
    if(/approve/i.test(v)){openCo('leadsift');toast('Opening LeadSift approval gate','violet');}
    else if(/promote/i.test(v)){promote('o1','PayoutReconciler');}
    else toast('Directing portfolio: "'+v+'"','violet');
    e.target.value='';
  }
});

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeCo();}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();cmd();}
  if(e.key==='Enter'&&!document.getElementById('zoom').classList.contains('show')
     && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    openCo('leadsift');
  }
});

renderGrid();
renderActivity();
</script>
</body>
</html>
