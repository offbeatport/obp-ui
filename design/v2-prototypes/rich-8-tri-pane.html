<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop — Tri-Pane Console</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8; --ink:#2c2926; --ink-soft:#635c52; --ink-faint:#7b7368;
  --line:#e6ddce; --line-soft:#efe8da; --accent:#c8643c; --green:#4f8a52; --blue:#4a72b0; --violet:#7a5ea8;
  --amber:#c08a2e; --red:#b6483f; --slate:#8a8579;
  --shadow:0 1px 2px rgba(60,50,38,.04),0 8px 28px rgba(60,50,38,.07);
  --shadow-sm:0 1px 2px rgba(60,50,38,.05);
  --w-left:236px; --w-mid:412px;
  --mono:"JetBrains Mono",ui-monospace,monospace; --ui:"Inter",system-ui,sans-serif; --disp:"Space Grotesk",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--cream); color:var(--ink); font-family:var(--ui);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow:hidden; min-width:1240px;
}
::selection{background:rgba(200,100,60,.18)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d9cfbd;border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:#cabda6}
button{font-family:inherit;cursor:pointer}

/* tone system */
.tone{--tc:var(--slate)}
.tone.green{--tc:var(--green)} .tone.blue{--tc:var(--blue)} .tone.violet{--tc:var(--violet)}
.tone.amber{--tc:var(--amber)} .tone.red{--tc:var(--red)} .tone.slate{--tc:var(--slate)}
.tone.accent{--tc:var(--accent)} .tone.ink{--tc:var(--ink)}

/* ===== app shell ===== */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== topbar ===== */
.topbar{
  height:54px;flex:0 0 54px;display:flex;align-items:center;gap:18px;padding:0 16px;
  background:linear-gradient(180deg,var(--paper),#fbf7ef);
  border-bottom:1px solid var(--line); position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;min-width:188px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#a94f2e);
  display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;box-shadow:var(--shadow-sm)}
.brand b{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.2px;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.4px;margin-top:2px;text-transform:uppercase}

.kpis{display:flex;align-items:stretch;gap:0;margin-left:6px;flex:1;min-width:0}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:0 13px;border-left:1px solid var(--line-soft);position:relative;white-space:nowrap}
.kpi:first-child{border-left:none}
.kpi .kl{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--ink-faint);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.kpi .kv{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.3px;margin-top:1px;display:flex;align-items:center;gap:6px}
.kpi .kv .spark{margin-bottom:-2px}
.kpi .kv .up{font-size:10.5px;color:var(--green);font-weight:600}
.kpi .kv .dn{font-size:10.5px;color:var(--red);font-weight:600}
.kpi.k-spark{padding-right:8px}
.capbar{width:80px;height:5px;border-radius:4px;background:var(--cream-2);overflow:hidden;margin-top:4px;border:1px solid var(--line-soft)}
.capbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber))}

.topbar-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
.cmdk{display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink-faint);font-size:12px;box-shadow:var(--shadow-sm)}
.cmdk kbd{font-family:var(--mono);font-size:10px;background:var(--cream-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-soft)}
.cmdk:hover{border-color:#d8cbb4;color:var(--ink-soft)}
.ap-toggle{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--violet) 35%,transparent);
  background:color-mix(in srgb,var(--violet) 9%,var(--paper));color:var(--violet);font-weight:600;font-size:11.5px}
.ap-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 20%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ===== panes ===== */
.panes{display:grid;grid-template-columns:var(--w-left) 5px var(--w-mid) 5px 1fr;flex:1;min-height:0}
.resizer{cursor:col-resize;background:transparent;position:relative;z-index:10}
.resizer::after{content:"";position:absolute;top:0;left:2px;width:1px;height:100%;background:var(--line)}
.resizer:hover::after,.resizer.drag::after{background:var(--accent);width:2px;left:1.5px}
.pane{overflow-y:auto;overflow-x:hidden;min-height:0;position:relative}

/* ===== LEFT pane ===== */
.pane-left{background:linear-gradient(180deg,#f4efe5,#f1ebe0);border-right:0;display:flex;flex-direction:column}
.nav-sec{padding:12px 10px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint)}
.nav{padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;border:1px solid transparent;color:var(--ink-soft);background:transparent;text-align:left;width:100%}
.nav-item:hover{background:var(--paper);border-color:var(--line-soft)}
.nav-item.active{background:var(--paper);border-color:var(--line);box-shadow:var(--shadow-sm);color:var(--ink)}
.nav-item.active .nav-ico{color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);border-color:color-mix(in srgb,var(--tc) 26%,transparent)}
.nav-ico{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;
  background:var(--cream-2);border:1px solid var(--line-soft);color:var(--ink-faint)}
.nav-lbl{flex:1;font-weight:500;font-size:12.5px;letter-spacing:-.1px}
.nav-item.active .nav-lbl{font-weight:600}
.nav-key{font-family:var(--mono);font-size:9px;color:var(--ink-faint);opacity:.6}
.nav-badge{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:20px;background:var(--cream-2);border:1px solid var(--line);color:var(--ink-soft)}
.nav-badge.hot{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent)}
.nav-badge.live{background:color-mix(in srgb,var(--green) 12%,transparent);border-color:color-mix(in srgb,var(--green) 30%,transparent);color:var(--green);display:inline-flex;align-items:center;gap:4px}
.nav-badge.live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

.left-foot{margin-top:auto;padding:12px 12px 14px;border-top:1px solid var(--line)}
.lf-title{font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;display:flex;justify-content:space-between}
.lf-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-soft);padding:3px 0}
.lf-row b{font-family:var(--mono);color:var(--ink);font-weight:600}
.gauge-line{height:6px;border-radius:4px;background:var(--cream-2);border:1px solid var(--line-soft);overflow:hidden;margin:6px 0 3px;position:relative}
.gauge-line i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber))}
.gauge-line .cap{position:absolute;top:-2px;height:10px;width:2px;background:var(--ink-faint);right:0}

/* ===== MIDDLE pane ===== */
.pane-mid{background:var(--cream);border-right:0}
.mid-head{position:sticky;top:0;z-index:8;background:linear-gradient(180deg,var(--cream),rgba(247,243,236,.92));
  backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:11px 13px 10px}
.mid-titlerow{display:flex;align-items:center;gap:9px}
.mid-title{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.mid-count{font-family:var(--mono);font-size:10px;color:var(--ink-faint);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.mid-sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
.mid-tools{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:2px;gap:1px}
.seg button{border:none;background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.2px;color:var(--ink-faint);padding:3px 8px;border-radius:5px;font-weight:500}
.seg button.on{background:var(--cream-2);color:var(--ink);box-shadow:var(--shadow-sm)}
.mtool-label{font-family:var(--mono);font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint)}
.list{padding:8px}

/* company row */
.co-row{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm);position:relative;transition:border-color .12s,transform .05s}
.co-row:hover{border-color:#d8cbb4}
.co-row.sel{border-color:var(--tc);box-shadow:0 0 0 1px color-mix(in srgb,var(--tc) 36%,transparent),var(--shadow)}
.co-row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--tc)}
.co-top{display:flex;align-items:center;gap:8px}
.co-name{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:-.2px}
.badge{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.3px;padding:2px 6px;border-radius:5px;white-space:nowrap;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,transparent);border:1px solid color-mix(in srgb,var(--tc) 26%,transparent)}
.flag{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.3px;padding:1px 5px;border-radius:4px;margin-left:auto;text-transform:uppercase}
.flag.best{color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.flag.watch{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.flag.kill{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.co-tag{font-size:10.5px;color:var(--ink-faint);margin:3px 0 8px}
.co-mid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.co-mrr{display:flex;align-items:baseline;gap:7px}
.co-mrr b{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:-.4px}
.co-mrr .chg{font-family:var(--mono);font-size:10px;font-weight:600}
.chg.up{color:var(--green)} .chg.dn{color:var(--red)} .chg.flat{color:var(--amber)} .chg.zero{color:var(--slate)}
.spark{display:block}
.co-foot{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line-soft);flex-wrap:wrap}
.stat{font-family:var(--mono);font-size:10px;color:var(--ink-soft);display:flex;align-items:center;gap:3px}
.stat .sl{color:var(--ink-faint)}
.meter{display:inline-flex;align-items:center;gap:3px}
.meter .seg3{display:inline-flex;gap:2px}
.meter .sg{width:6px;height:9px;border-radius:2px;background:var(--cream-2);border:1px solid var(--line)}
.meter .sg.on{background:var(--tc);border-color:var(--tc)}
.meter b{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--ink-soft);margin-left:1px}
.am-row{display:flex;gap:9px;margin-top:7px}
.am{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.am .aml{font-family:var(--mono);font-size:8px;letter-spacing:.4px;color:var(--ink-faint)}

/* gate card */
.gate{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:0;margin-bottom:9px;box-shadow:var(--shadow-sm);overflow:hidden}
.gate.sel{border-color:var(--tc);box-shadow:0 0 0 1px color-mix(in srgb,var(--tc) 36%,transparent),var(--shadow)}
.gate.upcoming{opacity:.86}
.gate.resolved{opacity:.62}
.gate-hd{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;cursor:pointer}
.gtype{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:6px;
  color:#fff;background:var(--tc)}
.gate-co{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.gate-when{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ink-faint);text-transform:uppercase}
.gate-when.now{color:var(--accent)}
.gate-title{padding:0 12px;font-weight:600;font-size:12.5px;color:var(--ink);letter-spacing:-.1px}
.gate-ev{padding:5px 12px 0;font-size:10.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:flex-start}
.gate-ev .evk{font-family:var(--mono);color:var(--ink-faint);flex:0 0 auto}
.gate-act{display:flex;gap:7px;padding:10px 12px 11px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d3c6af}
.btn.approve{background:var(--green);border-color:var(--green);color:#fff}
.btn.approve:hover{filter:brightness(1.05)}
.btn.reject{color:var(--red);border-color:color-mix(in srgb,var(--red) 32%,transparent)}
.btn.reject:hover{background:color-mix(in srgb,var(--red) 8%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:10.5px}
.auto-tag{font-family:var(--mono);font-size:9px;color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent);border:1px solid color-mix(in srgb,var(--violet) 26%,transparent);padding:2px 6px;border-radius:5px;margin-left:auto;align-self:center}
.gate-done{padding:9px 12px 11px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.gate-done.ok{color:var(--green)} .gate-done.no{color:var(--red)}

/* activity */
.act-row{display:flex;gap:10px;padding:9px 11px;border-radius:9px;border:1px solid transparent;cursor:pointer;position:relative}
.act-row:hover{background:var(--paper);border-color:var(--line-soft)}
.act-rail{flex:0 0 14px;display:flex;flex-direction:column;align-items:center;padding-top:3px}
.act-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.act-row.live .act-dot{box-shadow:0 0 0 1px var(--green);background:var(--green);animation:pulse 1.6s infinite}
.act-line{width:1px;flex:1;background:var(--line);margin-top:3px}
.act-body{flex:1;min-width:0}
.act-co{font-family:var(--disp);font-weight:600;font-size:11.5px}
.act-kind{font-family:var(--mono);font-size:8px;letter-spacing:.4px;text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.act-txt{font-size:11px;color:var(--ink-soft);margin-top:2px}
.act-t{font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-left:auto;flex:0 0 auto}
.act-hdrow{display:flex;align-items:center}

/* generic list rows (money / autopilot / oversight / strategy middle) */
.lrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow-sm);width:100%;text-align:left}
.lrow:hover{border-color:#d8cbb4}
.lrow .lr-ico{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc) 24%,transparent)}
.lr-main{flex:1;min-width:0}
.lr-t{font-weight:600;font-size:12px}
.lr-s{font-size:10.5px;color:var(--ink-faint);margin-top:1px}
.lr-v{font-family:var(--mono);font-weight:600;font-size:13px;text-align:right}
.lr-v small{display:block;font-size:9px;color:var(--ink-faint);font-weight:500}
.scorebar{width:70px;height:6px;border-radius:4px;background:var(--cream-2);border:1px solid var(--line-soft);overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--tc)}

/* ===== DETAIL pane ===== */
.pane-detail{background:var(--paper)}
.det-head{position:sticky;top:0;z-index:8;background:linear-gradient(180deg,var(--paper),#fdfbf6);border-bottom:1px solid var(--line);padding:14px 18px 0}
.det-top{display:flex;align-items:flex-start;gap:12px}
.det-title{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.4px;line-height:1}
.det-dom{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.det-headmetrics{margin-left:auto;display:flex;gap:18px;text-align:right}
.dhm .dl{font-family:var(--mono);font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint)}
.dhm .dv{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.4px;margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:14px}
.tab{border:none;background:transparent;border-bottom:2px solid transparent;padding:8px 13px 9px;font-size:12px;font-weight:600;color:var(--ink-faint);position:relative;letter-spacing:-.1px}
.tab:hover{color:var(--ink-soft)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .tdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;vertical-align:middle}
.det-body{padding:16px 18px 40px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.span2{grid-column:span 2}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)}
.card.tint{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 6%,var(--paper)),var(--paper));border-color:color-mix(in srgb,var(--tc) 22%,transparent)}
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.card-hd h4{margin:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.card-hd .ch-r{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}

.bignum{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:10px}
.bignum .delta{font-size:12px;font-weight:600}
.subnum{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:4px}

.metric{background:var(--cream);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}
.metric .ml{font-family:var(--mono);font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint)}
.metric .mv{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.4px;margin-top:3px;display:flex;align-items:baseline;gap:5px}
.metric .mv small{font-size:10px;font-weight:600}

.chart{display:block;width:100%}
.xaxis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);margin-top:5px;padding:0 2px}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.chip.ok{color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent);border:1px solid color-mix(in srgb,var(--green) 24%,transparent)}
.chip.no{color:var(--ink-faint);background:var(--cream-2);border:1px solid var(--line);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 50%,transparent)}

const $=s=>document.querySelector(s);
const fmt$=v=>(v<0?'−$'+Math.abs(v):'$'+v);
function tcVar(t){return 'var(--'+t+')'}
function chgClass(c){ if(c.series.every(v=>v===0))return 'zero'; if(c.tone==='amber')return 'flat'; if(c.tone==='red')return 'dn'; return 'up'; }
function chgText(c){
  if(c.series.every(v=>v===0))return '—';
  const a=c.series[c.series.length-2],b=c.series[c.series.length-1];
  if(a===0)return '+new'; const p=Math.round((b-a)/a*100);
  return (p>0?'+':'')+p+'%';
}

function spark(series,color,w=86,h=24){
  const max=Math.max(...series,1),min=Math.min(...series),rng=(max-min)||1;
  const pts=series.map((v,i)=>[ (series.length<2?w/2:(i/(series.length-1))*(w-3)+1.5), h-2-((v-min)/rng)*(h-4) ]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2" fill="'+color+'"/></svg>';
}

function area(series,color,h=140){
  const w=440,pl=2,pr=2,pt=10,pb=4,iw=w-pl-pr,ih=h-pt-pb;
  const max=Math.max(...series,1);
  const xs=i=>pl+(series.length<2?iw/2:(i/(series.length-1))*iw);
  const ys=v=>pt+ih-(v/max)*ih;
  const line=series.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  const fill=line+' L '+xs(series.length-1).toFixed(1)+' '+(pt+ih)+' L '+xs(0).toFixed(1)+' '+(pt+ih)+' Z';
  const id='g'+Math.random().toString(36).slice(2,7);
  let grid='';[0,.5,1].forEach(f=>{const y=(pt+ih-f*ih).toFixed(1);grid+='<line class="grid-l" x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'"/>';});
  const dots=series.map((v,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.6" fill="'+color+'" stroke="var(--paper)" stroke-width="1.5"/>').join('');
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" height="'+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.24"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+fill+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+dots+'</svg>'+
    '<div class="xaxis">'+MONTHS.map(m=>'<span>'+m+'</span>').join('')+'</div>';
}

function gauge(pct,color,label){
  if(pct==null)return '<div class="gauge"><svg width="64" height="64" viewBox="0 0 70 70"><circle cx="35" cy="35" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><text x="35" y="40" text-anchor="middle" class="gnum" style="font-size:12px;fill:var(--ink-faint)">n/a</text></svg><span class="glabel">'+label+'</span></div>';
  const r=26,c=2*Math.PI*r,dash=c*(pct/100);
  return '<div class="gauge"><svg width="64" height="64" viewBox="0 0 70 70">'+
    '<circle cx="35" cy="35" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="6"/>'+
    '<circle cx="35" cy="35" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 35 35)"/>'+
    '<text x="35" y="34" text-anchor="middle" class="gnum">'+pct+'</text><text x="35" y="46" text-anchor="middle" class="gunit">%</text></svg><span class="glabel">'+label+'</span></div>';
}

function meter(level,tone){
  const segs=[0,1,2].map(i=>'<span class="sg'+(level!=null&&i<=level?' on':'')+'"></span>').join('');
  return '<span class="meter tone '+tone+'"><span class="seg3">'+segs+'</span><b>'+(level==null?'—':'L'+level)+'</b></span>';

function connChips(list){

function stackBar(items,total){
  const bar=items.map(([l,v,t])=>'<i style="width:'+(v/total*100).toFixed(1)+'%;background:'+tcVar(t)+'"></i>').join('');
  const leg=items.map(([l,v,t])=>'<span class="lg"><span class="sw" style="background:'+tcVar(t)+'"></span>'+l+' <b>$'+v+'</b></span>').join('');
  return '<div class="stack">'+bar+'</div><div class="legend">'+leg+'</div>';
}
function funnel(rows,tone){
  const max=Math.max(...rows.map(r=>r[1]),1);
  return '<div class="funnel">'+rows.map((r,i)=>{
    const pct=i>0&&rows[i-1][1]?Math.round(r[1]/rows[i-1][1]*100)+'%':'';
    const w=Math.max(r[1]/max*100,8);
    return '<div class="fn-row tone '+tone+'"><span class="fn-lbl">'+r[0]+'</span>'+
      '<div class="fn-bar" style="width:'+w+'%;background:color-mix(in srgb,var(--tc) '+(100-i*14)+'%,var(--paper))">'+r[1].toLocaleString()+'</div>'+
      (pct?'<span class="fn-pct">'+pct+'</span>':'')+'</div>';
  }).join('')+'</div>';
}

      '<div class="preview-body"><div class="pv-tt">Your daily digest · top 10 leads</div><div class="pv-line" style="width:88%"></div><div class="pv-line" style="width:72%"></div><div class="pv-line" style="width:80%"></div><div class="pv-line" style="width:54%"></div></div></div></div>';
  }
  if(g.type==='SPEND'){
    html+='<div class="card"><div class="card-hd"><h4>Amount</h4></div><div class="bignum">$'+g.amount+'</div><div class="subnum">above $25 guardrail — gated</div></div>'+
      '<div class="card"><div class="card-hd"><h4>Projection</h4></div><div class="bignum" style="font-size:22px">~120</div><div class="subnum">signups · best-ROI company</div></div>';
  }
  // resolution
  if(done){
    html+='<div class="card span2"><div class="gate-done '+(done==='approved'?'ok':'no')+'" style="padding:4px 0">'+(done==='approved'?'✓ Approved — action dispatched to '+c.name:'✕ Rejected — sent back to the agent with feedback')+'</div></div>';
  } else if(g.status==='open'){
    html+='<div class="card span2"><div class="gate-act" style="padding:0"><button class="btn approve" data-approve="'+g.id+'">✓ Approve & dispatch</button><button class="btn reject" data-reject="'+g.id+'">Reject with feedback…</button>'+
      '<button class="btn ghost" data-openco="'+c.id+'" style="margin-left:auto">Open '+c.name+' →</button></div></div>';
  } else {
    html+='<div class="card span2"><div class="note">This gate is <b>upcoming</b> — it will surface for approval when its blockers clear. <button class="btn ghost sm" data-openco="'+c.id+'" style="margin-left:6px">Open '+c.name+' →</button></div></div>';
  }
  html+='</div>';
  B.innerHTML=html;
}

/* =================== INTERACTIONS =================== */
function selectSource(id){
  state.source=id;
  if(id==='needs'){state.detail='gate';state.gateId=GATES[0].id;}
  else if(id==='companies'){state.detail='company';}
  else if(id==='activity'){state.detail='company';}
  else if(id==='money'){state.detail='money';}
  else if(id==='autopilot'){state.detail='autopilot';}
  else if(id==='oversight'){state.detail='oversight';}
  else if(id==='strategy'){state.detail='strategy';}
  renderAll();
}
function selectCompany(id,tab){
  state.companyId=id;state.detail='company';if(tab)state.tab=tab;
  renderMiddle();renderDetail();
}
function selectGate(id){state.gateId=id;state.detail='gate';renderMiddle();renderDetail();}
function renderAll(){renderNav();renderMiddle();renderDetail();}

function toast(msg,tone){
  const w=$('#toasts');const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span class="tg" style="background:'+(C[tone]||C.green)+'"></span>'+msg;
  w.appendChild(el);setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},2600);
}
function approve(id){
  const g=GATES.find(x=>x.id===id);resolved[id]='approved';
  toast('Approved '+g.type+' · '+CO[g.company].name+(g.type==='SPEND'?' — $'+g.amount+' authorized':' — dispatched'),g.tone);
  renderMiddle();renderDetail();renderKpis();
}
function reject(id){
  const g=GATES.find(x=>x.id===id);resolved[id]='rejected';
  toast('Rejected '+g.type+' · '+CO[g.company].name+' — feedback sent to agent','red');
  renderMiddle();renderDetail();
}

// delegated clicks
document.addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('[data-src]'); if(nav){selectSource(nav.dataset.src);return;}
  const ap=t.closest('[data-approve]'); if(ap){approve(ap.dataset.approve);return;}
  const rj=t.closest('[data-reject]'); if(rj){reject(rj.dataset.reject);return;}
  const tab=t.closest('[data-tab]'); if(tab){state.tab=tab.dataset.tab;state.detail='company';renderDetail();return;}
  const det=t.closest('[data-detail]'); if(det){state.detail=det.dataset.detail;renderDetail();
    document.querySelectorAll('.lrow[data-detail]').forEach(x=>x.classList.remove('sel'));return;}
  const gd=t.closest('[data-gate]'); if(gd){selectGate(gd.dataset.gate);return;}
  const openco=t.closest('[data-openco]'); if(openco){state.source='companies';selectCompany(openco.dataset.openco,'overview');renderNav();return;}
  const undo=t.closest('[data-undo]'); if(undo){undo.textContent='undone';undo.style.color='var(--red)';toast('Action undone','red');return;}
  const co=t.closest('[data-co]'); if(co){
    if(state.source==='oversight')selectCompany(co.dataset.co,'oversight');
    else selectCompany(co.dataset.co,state.source==='companies'?state.tab:'overview');
    return;}
});

// segmented controls (sort/filter) — separate because they live in mid header
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sort]'); if(s){state.sort=s.dataset.sort;renderMiddle();return;}
  const f=e.target.closest('[data-filter]'); if(f){state.filter=f.dataset.filter;renderMiddle();return;}
});

/* ---- command palette ---- */
let palItems=[],palIdx=0;
function buildPalette(){
  const items=[];
  NAV.forEach((n,i)=>items.push({cat:'Go to',t:n.label,s:n.sub,ico:n.ico,tone:n.tone,key:''+(i+1),run:()=>selectSource(n.id)}));
  COMPANIES.forEach(c=>items.push({cat:'Company',t:c.name,s:c.stage+' · '+fmt$(c.mrr)+' MRR',ico:c.name[0],tone:c.tone,key:'',run:()=>{state.source='companies';selectCompany(c.id,'overview');renderNav();}}));
  GATES.filter(g=>g.status==='open'&&!resolved[g.id]).forEach(g=>items.push({cat:'Resolve gate',t:g.type+' · '+CO[g.company].name,s:g.title,ico:ACTION_GLYPH[g.type],tone:g.tone,key:'↵',run:()=>{approve(g.id);}}));
  return items;
}
function openPalette(){$('#paletteWrap').classList.add('open');$('#palInput').value='';$('#palInput').focus();filterPalette('');}
function closePalette(){$('#paletteWrap').classList.remove('open');}
function filterPalette(q){
  const all=buildPalette();q=q.toLowerCase();
  palItems=all.filter(i=>(i.t+' '+i.s+' '+i.cat).toLowerCase().includes(q));palIdx=0;renderPalette();
}
function renderPalette(){
  let html='',lastCat='';
  palItems.forEach((it,i)=>{
    if(it.cat!==lastCat){html+='<div class="pal-cat">'+it.cat+'</div>';lastCat=it.cat;}
    html+='<div class="pal-item tone '+it.tone+(i===palIdx?' active':'')+'" data-pi="'+i+'"><span class="pal-ico">'+it.ico+'</span><div class="pal-main"><div class="pal-t">'+it.t+'</div><div class="pal-s">'+it.s+'</div></div>'+(it.key?'<span class="pal-k">'+it.key+'</span>':'')+'</div>';
  });
  $('#palList').innerHTML=html||'<div class="empty">No matches</div>';
}
$('#palList').addEventListener('click',e=>{const it=e.target.closest('[data-pi]');if(it){palItems[+it.dataset.pi].run();closePalette();}});
$('#palInput').addEventListener('input',e=>filterPalette(e.target.value));
$('#palInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);renderPalette();}
  else if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPalette();}
  else if(e.key==='Enter'){e.preventDefault();if(palItems[palIdx]){palItems[palIdx].run();closePalette();}}
});
$('#cmdkBtn').addEventListener('click',openPalette);
$('#paletteWrap').addEventListener('click',e=>{if(e.target.id==='paletteWrap')closePalette();});
$('#apToggle').addEventListener('click',()=>toast('Autopilot is engaged · reversible features auto-ship, money & humans stay gated','violet'));

// keyboard
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){closePalette();return;}
  if($('#paletteWrap').classList.contains('open'))return;
  if(/^[1-7]$/.test(e.key)){const n=NAV[+e.key-1];if(n)selectSource(n.id);}
});

/* ---- resizers ---- */
function makeResizer(el,which){
  let startX,startW;
  el.addEventListener('mousedown',e=>{
    e.preventDefault();el.classList.add('drag');
    startX=e.clientX;
    startW=which==='left'?parseInt(getComputedStyle(document.documentElement).getPropertyValue('--w-left')):parseInt(getComputedStyle(document.documentElement).getPropertyValue('--w-mid'));
    const move=ev=>{
      let w=startW+(ev.clientX-startX);
      if(which==='left')w=Math.max(196,Math.min(320,w));
      else w=Math.max(320,Math.min(560,w));
      document.documentElement.style.setProperty(which==='left'?'--w-left':'--w-mid',w+'px');
    };
    const up=()=>{el.classList.remove('drag');document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.body.style.cursor='';};
    document.body.style.cursor='col-resize';
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  });
}
makeResizer($('#rz1'),'left');
makeResizer($('#rz2'),'mid');

/* =================== INIT =================== */
renderKpis();renderAll();
</script>
