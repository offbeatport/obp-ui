<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop · Pinned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --ink:#1a1a1a;
    --ink-2:#5c5c5c;
    --ink-3:#8a8a8a;
    --line:#ececec;
    --line-2:#e3e3e3;
    --accent:#5b5bd6;        /* the ONE accent */
    --accent-soft:#eeeefb;
    --accent-ink:#4a4ac4;
    --green:#2f9e62;
    --green-soft:#e6f4ec;
    --amber:#b9770e;
    --amber-soft:#fbf0db;
    --violet:#6a4ac9;
    --violet-soft:#f0ebfb;
    --blue:#2f6fd6;
    --blue-soft:#e7f0fc;
    --red:#cf3b3b;
    --red-soft:#fbe9e9;
    --slate:#7a7a86;
    --slate-soft:#f0f0f2;
    --shadow-sm:0 1px 2px rgba(20,20,30,.04);
    --shadow-md:0 1px 3px rgba(20,20,30,.06),0 8px 24px rgba(20,20,30,.06);
    --shadow-lg:0 2px 8px rgba(20,20,30,.08),0 24px 60px rgba(20,20,30,.12);
    --r:14px;
    --r-sm:9px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell ---------- */
  .app{max-width:1180px;margin:0 auto;padding:0 28px 160px;}
  .topbar{
    position:sticky;top:0;z-index:40;background:rgba(251,251,250,.82);
    backdrop-filter:saturate(180%) blur(12px);
    display:flex;align-items:center;gap:18px;
    padding:18px 0 14px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;}
  .brand .mk{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:700;}
  .brand small{color:var(--ink-3);font-weight:450;}
  .nav{display:flex;gap:2px;margin-left:6px;}
  .nav button{padding:6px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13px;
    transition:background .15s var(--ease),color .15s var(--ease);}
  .nav button:hover{background:#f1f1f0;color:var(--ink);}
  .nav button.on{background:var(--ink);color:#fff;}
  .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:9px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
  .pill:hover{border-color:#d4d4d4;}
  kbd{font-family:'JetBrains Mono',monospace;font-size:11px;background:#f1f1f0;border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2);}

  /* ---------- portfolio strip ---------- */
  .pfstrip{display:flex;gap:30px;padding:22px 2px 6px;flex-wrap:wrap;}
  .pf{display:flex;flex-direction:column;gap:1px;}
  .pf .v{font-size:22px;font-weight:600;letter-spacing:-.03em;}
  .pf .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
  .pf .v small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0;}

  .sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px;}
  .sec-h h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0;}
  .sec-h .ct{font-size:12px;color:var(--ink-3);}

  /* ---------- PINNED HERO ---------- */
  .hero{
    position:relative;background:var(--surface);border:1px solid var(--line-2);
    border-radius:var(--r);box-shadow:var(--shadow-md);overflow:hidden;
    animation:rise .35s var(--ease) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.995);}to{opacity:1;transform:none;}}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet);}
  .hero-top{display:flex;align-items:center;gap:12px;padding:18px 22px 14px;}
  .pin{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;color:var(--violet);
    background:var(--violet-soft);padding:4px 9px;border-radius:7px;}
  .pin svg{width:12px;height:12px;}
  .hero-co{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.active{background:var(--green);}
  .hero-co .nm{font-size:18px;font-weight:600;letter-spacing:-.02em;}
  .hero-co .dm{font-size:13px;color:var(--ink-3);}
  .hero-co:hover .nm{color:var(--accent);}

  .gate{padding:0 22px 20px;}
  .gate-line{font-size:14.5px;font-weight:500;margin:2px 0 14px;}
  .gate-line .sl{color:var(--ink-3);font-weight:450;}
  .gate-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;}
  @media(max-width:820px){.gate-grid{grid-template-columns:1fr;}}

  .diff{background:#fcfcfc;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;}
  .diff-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:11.5px;color:var(--ink-3);font-weight:500;}
  .diff pre{margin:0;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;
    overflow-x:auto;white-space:pre;}
  .diff .add{color:#1f7a47;background:#effaf2;display:block;margin:0 -14px;padding:0 14px;}
  .diff .ctx{color:var(--ink-3);display:block;}

  .gate-side{display:flex;flex-direction:column;gap:12px;}
  .card-mini{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;}
  .card-mini .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;margin-bottom:6px;}
  .preview-row{display:flex;align-items:center;gap:9px;}
  .preview-row a{color:var(--accent-ink);font-family:'JetBrains Mono',monospace;font-size:12.5px;
    text-decoration:none;word-break:break-all;}
  .preview-row a:hover{text-decoration:underline;}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--green);font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;flex:none;}
  .live .b{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,158,98,.5);
    animation:beat 1.8s infinite;}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(47,158,98,.45);}70%{box-shadow:0 0 0 6px rgba(47,158,98,0);}100%{box-shadow:0 0 0 0 rgba(47,158,98,0);}}

  .checkbox{display:flex;align-items:flex-start;gap:10px;}
  .check-ic{width:20px;height:20px;border-radius:6px;background:var(--green-soft);color:var(--green);
    display:grid;place-items:center;flex:none;margin-top:1px;}
  .check-ic svg{width:13px;height:13px;}
  .check-txt .r{font-weight:600;color:var(--green);}
  .check-txt code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-2);
    display:block;margin-top:3px;line-height:1.5;}

  .gate-actions{display:flex;gap:9px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .btn{height:38px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease);}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn-go{background:var(--green);color:#fff;box-shadow:0 1px 2px rgba(47,158,98,.3);}
  .btn-go:hover{background:#28925a;}
  .btn-no{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);}
  .btn-no:hover{border-color:#d2d2d2;color:var(--ink);}
  .btn kbd{background:rgba(255,255,255,.18);border-color:transparent;color:inherit;}
  .btn-no kbd{background:#f1f1f0;border-color:var(--line-2);color:var(--ink-3);}
  .gate-actions .grow2{flex:1}
  .attempt{font-size:12px;color:var(--ink-3);align-self:center;}

  /* feedback flash */
  .flash{position:absolute;inset:0;background:var(--surface);display:grid;place-items:center;
    opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:5;}
  .flash.on{opacity:1;pointer-events:auto;}
  .flash-in{display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .3s var(--ease) both;}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .flash .ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;}
  .flash.ok .ring{background:var(--green-soft);color:var(--green);}
  .flash.rej .ring{background:var(--amber-soft);color:var(--amber);}
  .flash .ring svg{width:26px;height:26px;}
  .flash .msg{font-size:16px;font-weight:600;}
  .flash .sub{font-size:13px;color:var(--ink-3);}

  /* reject feedback inline */
  .reject-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:none;}
  .reject-box.on{display:block;animation:rise .25s var(--ease) both;}
  .reject-box textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;
    font-family:inherit;font-size:13px;resize:vertical;min-height:64px;color:var(--ink);outline:none;
    transition:border-color .15s var(--ease);}
  .reject-box textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .reject-box .rr{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}

  /* all caught up hero */
  .hero-clear{text-align:center;padding:42px 22px;}
  .hero-clear .em{width:48px;height:48px;border-radius:14px;background:var(--green-soft);color:var(--green);
    display:grid;place-items:center;margin:0 auto 14px;}
  .hero-clear .em svg{width:24px;height:24px;}
  .hero-clear h3{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em;}
  .hero-clear p{color:var(--ink-3);margin:0;font-size:13.5px;}

  /* ---------- quiet list ---------- */
  .qlist{margin-top:4px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);}
  .qrow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:background .12s var(--ease);position:relative;}
  .qrow:last-child{border-bottom:none;}
  .qrow:hover{background:#fafafa;}
  .qrow.kfocus{background:var(--accent-soft);}
  .qrow.kfocus::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);}
  .qrow .nm{font-weight:550;min-width:130px;letter-spacing:-.01em;}
  .qrow .th{color:var(--ink-3);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qrow .st{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;flex:none;display:inline-flex;align-items:center;gap:6px;}
  .qrow .metric{font-size:12.5px;color:var(--ink-2);min-width:78px;text-align:right;}
  .qrow .metric small{color:var(--ink-3);}
  .st-building{background:var(--blue-soft);color:var(--blue);}
  .st-building .d{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .st-todo{background:var(--slate-soft);color:var(--slate);}
  .st-blocked{background:var(--red-soft);color:var(--red);}
  .st-paused{background:var(--amber-soft);color:var(--amber);}
  .st-shipped{background:var(--green-soft);color:var(--green);}
  .chev{color:var(--ink-3);opacity:0;transition:opacity .12s var(--ease),transform .12s var(--ease);}
  .qrow:hover .chev{opacity:1;transform:translateX(2px);}

  /* ---------- opportunities ---------- */
  .opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;}
  .opp{border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:14px 15px;
    transition:box-shadow .15s var(--ease),transform .15s var(--ease),border-color .15s var(--ease);}
  .opp:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);border-color:#dadada;}
  .opp.killed{opacity:.55;}
  .opp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .opp .ti{font-weight:600;letter-spacing:-.01em;}
  .score{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .score .bar{width:40px;height:5px;border-radius:3px;background:#eee;overflow:hidden;}
  .score .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
  .opp .ts{font-size:12.5px;color:var(--ink-3);margin:6px 0 4px;}
  .opp .so{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-bottom:11px;}
  .opp-foot{display:flex;align-items:center;justify-content:space-between;}
  .promote{font-size:12.5px;font-weight:600;color:var(--accent-ink);display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:7px;transition:background .15s var(--ease);}
  .promote:hover{background:var(--accent-soft);}
  .promote.done{color:var(--green);background:var(--green-soft);}
  .killed-tag{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}

  /* ---------- next moves ---------- */
  .moves{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);}
  .move{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .move:last-child{border-bottom:none;}
  .move .ix{width:18px;height:18px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);
    font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;}

  /* ---------- command bar ---------- */
  .cmdwrap{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
    padding:18px;pointer-events:none;background:linear-gradient(to top,var(--bg) 30%,transparent);}
  .cmd{pointer-events:auto;width:100%;max-width:680px;background:var(--surface);border:1px solid var(--line-2);
    border-radius:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;padding:11px 14px;
    transition:box-shadow .15s var(--ease),border-color .15s var(--ease);}
  .cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lg);}
  .cmd svg{width:17px;height:17px;color:var(--ink-3);flex:none;}
  .cmd input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:none;color:var(--ink);}
  .cmd input::placeholder{color:var(--ink-3);}

  /* ---------- live activity strip ---------- */
  .actwrap{position:fixed;right:24px;bottom:88px;z-index:46;width:380px;max-width:calc(100vw - 48px);}
  .act{background:var(--surface);border:1px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-lg);overflow:hidden;}
  .act-bar{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
  .act-bar:hover{background:#fafafa;}
  .act-bar .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);flex:none;}
  .act-bar .now{font-size:12.5px;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .act-bar .now b{font-weight:600;}
  .rundot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;animation:pulse 1.1s infinite;}
  .act-bar .tg{color:var(--ink-3);transition:transform .2s var(--ease);}
  .act.open .act-bar .tg{transform:rotate(180deg);}
  .act-body{max-height:0;overflow:hidden;transition:max-height .25s var(--ease);}
  .act.open .act-body{max-height:60vh;overflow-y:auto;border-top:1px solid var(--line);}
  .act-grp{padding:4px 0;}
  .act-grp .gh{font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 14px 4px;text-transform:uppercase;letter-spacing:.05em;}
  .act-it{display:flex;align-items:flex-start;gap:9px;padding:6px 14px;font-size:12.5px;color:var(--ink-2);}
  .act-it .ad{width:6px;height:6px;border-radius:50%;flex:none;margin-top:6px;background:var(--ink-3);}
  .act-it.run .ad{background:var(--blue);animation:pulse 1.1s infinite;}
  .act-it.await .ad{background:var(--violet);}
  .act-it.check .ad,.act-it.deploy .ad{background:var(--green);}
  .act-it.blocked .ad{background:var(--red);}
  .act-it .tt{flex:1;}
  .act-it .tm{color:var(--ink-3);font-size:11px;flex:none;font-family:'JetBrains Mono',monospace;}

  /* ---------- company zoom ---------- */
  .zoom{position:fixed;inset:0;z-index:60;display:none;}
  .zoom.on{display:block;}
  .scrim{position:absolute;inset:0;background:rgba(20,20,28,.28);backdrop-filter:blur(2px);
    animation:fade .2s var(--ease) both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{position:absolute;top:0;right:0;bottom:0;width:min(880px,94vw);background:var(--bg);
    box-shadow:var(--shadow-lg);overflow-y:auto;animation:slide .3s var(--ease) both;}
  @keyframes slide{from{transform:translateX(40px);opacity:0;}to{transform:none;opacity:1;}}
  .ztop{position:sticky;top:0;background:rgba(251,251,250,.9);backdrop-filter:blur(10px);z-index:5;
    display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2);
    padding:6px 10px;border-radius:8px;transition:background .15s var(--ease);}
  .back:hover{background:#efefee;color:var(--ink);}
  .ztop .znm{font-size:16px;font-weight:600;letter-spacing:-.02em;}
  .ztop .zdm{font-size:12.5px;color:var(--ink-3);}
  .zbody{padding:24px 26px;display:grid;grid-template-columns:1fr;gap:20px;}
  .zgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start;}
  @media(max-width:760px){.zgrid{grid-template-columns:1fr;}}

  .zmetrics{display:flex;gap:24px;}
  .zmetrics .v{font-size:18px;font-weight:600;letter-spacing:-.02em;}
  .zmetrics .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;}

  .slices{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);}
  .slice{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .slice:last-child{border-bottom:none;}
  .slice .sn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-3);width:18px;flex:none;}
  .slice .stt{flex:1;}
  .slice.aw{background:var(--violet-soft);}
  .slice .pr{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-3);flex:none;}

  /* company chat */
  .chat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
  .chat-h{padding:12px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
  .chat-feed{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-height:300px;overflow-y:auto;}
  .msg{font-size:13px;line-height:1.55;max-width:90%;}
  .msg.assistant{align-self:flex-start;}
  .msg.user{align-self:flex-end;}
  .msg .bub{padding:9px 12px;border-radius:12px;}
  .msg.assistant .bub{background:#f4f4f3;border-bottom-left-radius:4px;}
  .msg.user .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .msg .who{font-size:10.5px;color:var(--ink-3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;}
  .chat-in{display:flex;gap:9px;padding:11px 14px;border-top:1px solid var(--line);}
  .chat-in input{flex:1;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;font-family:inherit;
    font-size:13px;outline:none;transition:border-color .15s var(--ease);}
  .chat-in input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  /* badge */
  .badge{position:fixed;left:18px;bottom:18px;z-index:80;background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:500;padding:6px 11px;border-radius:8px;box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:7px;letter-spacing:-.01em;}
  .badge .bn{font-family:'JetBrains Mono',monospace;color:#bdbdf0;}

  .hide{display:none!important;}
  .fade-in{animation:rise .3s var(--ease) both;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mk">C</span> C Slop Slop <small>- founder command center</small></div>
  <div class="nav">
    <button id="nav-focus" class="on" onclick="showView('focus')">Focus</button>
    <button id="nav-port" onclick="showView('port')">Portfolio</button>
  </div>
  <div class="grow"></div>
  <button class="pill" onclick="focusCmd()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Search or command <kbd>⌘K</kbd>
  </button>
</div>

<div class="app">

  <!-- FOCUS / OVERVIEW default view -->
  <div id="view-focus">
    <div class="pfstrip">
      <div class="pf"><span class="v mono">$695<small>/mo</small></span><span class="k">MRR</span></div>
      <div class="pf"><span class="v mono">56</span><span class="k">Users</span></div>
      <div class="pf"><span class="v mono">5</span><span class="k">Active companies</span></div>
      <div class="pf"><span class="v mono">22</span><span class="k">Slices shipped</span></div>
      <div class="pf"><span class="v mono" style="color:var(--violet)" id="needsCount">1</span><span class="k">Needs you</span></div>
    </div>

    <div class="sec-h"><h2>Needs you</h2><span class="ct" id="needsLabel">1 pinned · resolve to advance</span></div>
    <div id="heroSlot"></div>

    <div class="sec-h"><h2>Companies</h2><span class="ct">5 active · grows down ↓</span></div>
    <div class="qlist" id="qlist"></div>
  </div>

  <!-- PORTFOLIO view (opportunities + next moves) -->
  <div id="view-port" class="hide">
    <div class="sec-h" style="margin-top:22px"><h2>Next moves</h2><span class="ct">prioritized</span></div>
    <div class="moves" id="moves"></div>

    <div class="sec-h"><h2>Opportunities</h2><span class="ct">scored · promote to a company</span></div>
    <div class="opps" id="opps"></div>

    <div class="sec-h"><h2>All companies</h2><span class="ct">portfolio</span></div>
    <div class="qlist" id="qlist2"></div>
  </div>

</div>

<!-- LIVE ACTIVITY -->
<div class="actwrap">
  <div class="act" id="act">
    <div class="act-bar" onclick="toggleAct()">
      <span class="lab">Live</span>
      <span class="rundot"></span>
      <span class="now" id="actNow"></span>
      <svg class="tg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
    </div>
    <div class="act-body" id="actBody"></div>
  </div>
</div>

<!-- COMMAND BAR -->
<div class="cmdwrap">
  <div class="cmd">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
    <input id="cmdInput" placeholder="Ask, command, or jump to a company…  (try ‘approve leadsift’)">
    <kbd>↵</kbd>
  </div>
</div>

<!-- ZOOM -->
<div class="zoom" id="zoom">
  <div class="scrim" onclick="closeZoom()"></div>
  <div class="panel" id="panel"></div>
</div>

<!-- BADGE -->
<div class="badge"><span class="bn">25</span> · Pinned</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ---- helpers ---- */
const $ = s => document.querySelector(s);
const ic = {
  pin:'<path d="M12 17v5M9 3h6l-1 7 3 2v2H7v-2l3-2-1-7z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  spark:'<path d="m13 2-2 9h7l-9 11 2-9H4z"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>',
};
function svg(p,sz){return `<svg width="${sz||14}" height="${sz||14}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}

const SLICE_LABEL = {todo:'To do',building:'Building',awaiting_approval:'Needs you',shipped:'Shipped',blocked:'Blocked'};
function coStatusChip(c){
  if(c.status==='paused') return `<span class="st st-paused">Paused</span>`;
  const cs=c.currentSlice;
  if(!cs) return `<span class="st st-shipped">Active</span>`;
  if(cs.status==='building') return `<span class="st st-building"><span class="d"></span>Building s${cs.n}</span>`;
  if(cs.status==='blocked') return `<span class="st st-blocked">Blocked s${cs.n}</span>`;
  if(cs.status==='todo') return `<span class="st st-todo">Queued s${cs.n}</span>`;
  return `<span class="st st-todo">${SLICE_LABEL[cs.status]||cs.status}</span>`;
}

/* ---- pinned hero state ---- */
let resolvedNeeds = [];   // company ids whose gate is resolved
function needsList(){ return DATA.companies.filter(c=>c.needsYou && !resolvedNeeds.includes(c.id)); }

function renderHero(){
  const slot = $('#heroSlot');
  const pending = needsList();
  if(pending.length===0){
    slot.innerHTML = `
      <div class="hero hero-clear fade-in">
        <div class="em">${svg(ic.bag,24)}</div>
        <h3>All caught up</h3>
        <p>Nothing needs your approval. Agents keep building - the next gate will pin itself here.</p>
      </div>`;
    $('#needsCount').textContent='0';
    $('#needsCount').style.color='var(--green)';
    $('#needsLabel').textContent='cleared';
    return;
  }
  const c = pending[0];
  const a = c.approval;
  const diffHtml = a.diff.split("\n").map(l=>{
    const cls = l.startsWith('+') ? 'add' : 'ctx';
    return `<span class="${cls}">${escapeHtml(l)||' '}</span>`;
  }).join('');
  $('#needsCount').textContent=pending.length;
  $('#needsLabel').textContent = pending.length+' pinned · resolve to advance';
  slot.innerHTML = `
    <div class="hero fade-in" id="hero-${c.id}">
      <div class="hero-top">
        <span class="pin">${svg(ic.pin,12)} Pinned · needs you</span>
        <div class="hero-co" onclick="openZoom('${c.id}')">
          <span class="dot active"></span>
          <span class="nm">${c.name}</span>
          <span class="dm">${c.domain||c.previewUrl}</span>
        </div>
        <div class="grow"></div>
        <button class="back" onclick="openZoom('${c.id}')">Open company ${svg(ic.chev,13)}</button>
      </div>
      <div class="gate">
        <div class="gate-line">Slice ${a.slice} <span class="sl">·</span> ${a.title}</div>
        <div class="gate-grid">
          <div class="diff">
            <div class="diff-h">${svg('<path d="M16 18 22 12 16 6M8 6 2 12l6 6"/>',12)} diff · slice ${a.slice}</div>
            <pre>${diffHtml}</pre>
          </div>
          <div class="gate-side">
            <div class="card-mini">
              <div class="lbl">Live preview</div>
              <div class="preview-row">
                <a href="${a.previewUrl}" target="_blank" rel="noopener">${a.previewUrl}</a>
                <span class="live"><span class="b"></span>live</span>
              </div>
            </div>
            <div class="card-mini">
              <div class="lbl">doneWhen check</div>
              <div class="checkbox">
                <span class="check-ic">${svg(ic.check,13)}</span>
                <div class="check-txt"><span class="r">passed</span><code>${escapeHtml(a.doneWhen)}</code></div>
              </div>
            </div>
          </div>
        </div>
        <div class="gate-actions">
          <button class="btn btn-go" onclick="approve('${c.id}')">Approve & ship ${svg(ic.check,13)} <kbd>A</kbd></button>
          <button class="btn btn-no" onclick="toggleReject('${c.id}')">Reject with feedback <kbd>R</kbd></button>
          <div class="grow2"></div>
          <span class="attempt">attempt ${a.attempt} · check green</span>
        </div>
        <div class="reject-box" id="reject-${c.id}">
          <textarea id="rtext-${c.id}" placeholder="What should change? Agents pick this up and re-run the slice…"></textarea>
          <div class="rr">
            <button class="btn btn-no" onclick="toggleReject('${c.id}')">Cancel <kbd>Esc</kbd></button>
            <button class="btn btn-go" style="background:var(--amber)" onclick="sendReject('${c.id}')">Send feedback ${svg(ic.chev,13)}</button>
          </div>
        </div>
      </div>
      <div class="flash" id="flash-${c.id}">
        <div class="flash-in">
          <div class="ring" id="ring-${c.id}"></div>
          <div class="msg" id="fmsg-${c.id}"></div>
          <div class="sub" id="fsub-${c.id}"></div>
        </div>
      </div>
    </div>`;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleReject(id){
  const b=$('#reject-'+id); b.classList.toggle('on');
  if(b.classList.contains('on')) setTimeout(()=>$('#rtext-'+id)&&$('#rtext-'+id).focus(),60);
}
function approve(id){ flash(id,'ok','Approved ✓','Slice shipped - promoting next'); }
function sendReject(id){
  const t=($('#rtext-'+id)?.value||'').trim();
  flash(id,'rej','Feedback sent ✓', t? 'Agents will re-run the slice' : 'Agents will re-run the slice');
}
function flash(id,type,msg,sub){
  const f=$('#flash-'+id); if(!f) return;
  f.className='flash on '+(type==='ok'?'ok':'rej');
  $('#ring-'+id).innerHTML = svg(type==='ok'?ic.check:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',26);
  $('#fmsg-'+id).textContent=msg; $('#fsub-'+id).textContent=sub;
  setTimeout(()=>{
    resolvedNeeds.push(id);
    DATA.portfolio.needsYou = needsList().length;
    renderHero();
    // also reflect in zoom if open
    if(currentZoom===id) closeZoom();
  },1400);
}

/* ---- quiet list (companies) ---- */
function renderList(target, includeAll){
  const rows = DATA.companies.filter(c=> includeAll ? true : !c.needsYou || resolvedNeeds.includes(c.id));
  target.innerHTML = rows.map((c,i)=>{
    const metric = c.mrr ? `$${c.mrr}<small>/mo</small>` : `<small>no rev yet</small>`;
    return `<div class="qrow" data-idx="${i}" data-id="${c.id}" onclick="openZoom('${c.id}')">
      <span class="dot ${c.status==='active'?'active':''}" style="${c.status==='paused'?'background:var(--amber)':c.status==='archived'?'background:var(--slate)':''}"></span>
      <span class="nm">${c.name}</span>
      <span class="th">${c.thesis}</span>
      ${coStatusChip(c)}
      <span class="metric mono">${metric}</span>
      <span class="chev">${svg(ic.chev,15)}</span>
    </div>`;
  }).join('');
}

/* ---- opportunities ---- */
function renderOpps(){
  $('#opps').innerHTML = DATA.opportunities.map(o=>{
    const killed = o.status==='killed';
    return `<div class="opp ${killed?'killed':''}">
      <div class="opp-top">
        <span class="ti">${o.title}</span>
        <span class="score">${o.score}<span class="bar"><i style="width:${o.score}%"></i></span></span>
      </div>
      <div class="ts">${o.thesis}</div>
      <div class="so">“${o.thought}”</div>
      <div class="opp-foot">
        ${killed
          ? `<span class="killed-tag">killed</span>`
          : `<button class="promote" id="promo-${o.id}" onclick="promote('${o.id}')">${svg(ic.spark,13)} Promote to company</button>`}
      </div>
    </div>`;
  }).join('');
}
function promote(id){
  const b=$('#promo-'+id); if(!b||b.classList.contains('done'))return;
  b.classList.add('done'); b.innerHTML=`${svg(ic.check,13)} Promoted ✓`;
}

/* ---- next moves ---- */
function renderMoves(){
  $('#moves').innerHTML = DATA.nextMoves.map((m,i)=>
    `<div class="move"><span class="ix">${i+1}</span><span>${m}</span></div>`).join('');
}

/* ---- live activity ---- */
function renderAct(){
  const top = DATA.activity[0];
  $('#actNow').innerHTML = `<b>${top.co}</b> - ${top.text.replace(/^building slice \d+ - /,'')}`;
  const byCo={};
  DATA.activity.forEach(a=>{(byCo[a.co]=byCo[a.co]||[]).push(a);});
  $('#actBody').innerHTML = Object.entries(byCo).map(([co,items])=>
    `<div class="act-grp"><div class="gh">${co}</div>${items.map(a=>
      `<div class="act-it ${a.running?'run ':''}${a.kind}">
        <span class="ad"></span><span class="tt">${a.text}</span><span class="tm">${a.t}</span>
      </div>`).join('')}</div>`).join('');
}
let actOpen=false;
function toggleAct(){ actOpen=!actOpen; $('#act').classList.toggle('open',actOpen); }

/* ---- views ---- */
let view='focus';
function showView(v){
  view=v;
  $('#view-focus').classList.toggle('hide', v!=='focus');
  $('#view-port').classList.toggle('hide', v!=='port');
  $('#nav-focus').classList.toggle('on', v==='focus');
  $('#nav-port').classList.toggle('on', v==='port');
}

/* ---- zoom ---- */
let currentZoom=null;
function openZoom(id){
  const c=DATA.companies.find(x=>x.id===id); if(!c)return;
  currentZoom=id;
  $('#panel').innerHTML = panelHtml(c);
  $('#zoom').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeZoom(){
  $('#zoom').classList.remove('on'); currentZoom=null;
  document.body.style.overflow='';
}
function panelHtml(c){
  const metrics = `<div class="zmetrics">
    <div><div class="v mono">${c.mrr?'$'+c.mrr:'-'}</div><div class="k">MRR</div></div>
    <div><div class="v mono">${c.users}</div><div class="k">Users</div></div>
    <div><div class="v mono">${(c.slices?c.slices.filter(s=>s.status==='shipped').length:c.slicesShipped)}</div><div class="k">Shipped</div></div>
  </div>`;

  let gateBlock='';
  if(c.approval && !resolvedNeeds.includes(c.id)){
    const a=c.approval;
    const diffHtml=a.diff.split("\n").map(l=>`<span class="${l.startsWith('+')?'add':'ctx'}">${escapeHtml(l)||' '}</span>`).join('');
    gateBlock=`
      <div class="hero" style="box-shadow:none;border-color:var(--violet);">
        <div class="hero-top"><span class="pin">${svg(ic.pin,12)} Approval gate · slice ${a.slice}</span></div>
        <div class="gate">
          <div class="gate-line">${a.title}</div>
          <div class="gate-grid">
            <div class="diff"><div class="diff-h">diff · slice ${a.slice}</div><pre>${diffHtml}</pre></div>
            <div class="gate-side">
              <div class="card-mini"><div class="lbl">Live preview</div>
                <div class="preview-row"><a href="${a.previewUrl}" target="_blank" rel="noopener">${a.previewUrl}</a><span class="live"><span class="b"></span>live</span></div></div>
              <div class="card-mini"><div class="lbl">doneWhen check</div>
                <div class="checkbox"><span class="check-ic">${svg(ic.check,13)}</span><div class="check-txt"><span class="r">passed</span><code>${escapeHtml(a.doneWhen)}</code></div></div></div>
            </div>
          </div>
          <div class="gate-actions">
            <button class="btn btn-go" onclick="approveZoom('${c.id}')">Approve & ship ${svg(ic.check,13)}</button>
            <button class="btn btn-no" onclick="toggleReject('z-${c.id}')">Reject with feedback</button>
            <div class="grow2"></div><span class="attempt">attempt ${a.attempt} · green</span>
          </div>
          <div class="reject-box" id="reject-z-${c.id}">
            <textarea id="rtext-z-${c.id}" placeholder="What should change?"></textarea>
            <div class="rr"><button class="btn btn-no" onclick="toggleReject('z-${c.id}')">Cancel</button>
              <button class="btn btn-go" style="background:var(--amber)" onclick="approveZoom('${c.id}',true)">Send feedback</button></div>
          </div>
        </div>
        <div class="flash" id="flash-z-${c.id}"><div class="flash-in"><div class="ring" id="ring-z-${c.id}"></div>
          <div class="msg" id="fmsg-z-${c.id}"></div><div class="sub">Back to overview…</div></div></div>
      </div>`;
  }

  let slicesBlock='';
  if(c.slices){
    slicesBlock=`<div class="slices">${c.slices.map(s=>{
      const chip = s.status==='building'?`<span class="st st-building"><span class="d"></span>Building</span>`
        : s.status==='awaiting_approval'?`<span class="st" style="background:var(--violet-soft);color:var(--violet)">Needs you</span>`
        : s.status==='shipped'?`<span class="st st-shipped">Shipped</span>`
        : s.status==='blocked'?`<span class="st st-blocked">Blocked</span>`
        : `<span class="st st-todo">To do</span>`;
      return `<div class="slice ${s.status==='awaiting_approval'?'aw':''}">
        <span class="sn">${s.n}</span><span class="stt">${s.title}</span>
        ${s.priority?`<span class="pr">p${s.priority}</span>`:''}${s.note?`<span class="pr" style="color:var(--red)">${s.note}</span>`:''}
        ${chip}</div>`;
    }).join('')}</div>`;
  } else if(c.currentSlice){
    const cs=c.currentSlice;
    slicesBlock=`<div class="slices"><div class="slice ${cs.status==='building'?'':''}">
      <span class="sn">${cs.n}</span><span class="stt">${cs.title} <span style="color:var(--ink-3)">- ${cs.step}</span></span>
      ${cs.status==='building'?`<span class="st st-building"><span class="d"></span>Building</span>`:
        cs.status==='blocked'?`<span class="st st-blocked">Blocked</span>`:`<span class="st st-todo">Queued</span>`}</div></div>`;
  }

  const chatBlock=`<div class="chat">
    <div class="chat-h">Company chat</div>
    <div class="chat-feed" id="zchat">${DATA.chat.map(m=>
      `<div class="msg ${m.role}"><div class="who">${m.role==='user'?'You':'Agent'}</div><div class="bub">${m.text}</div></div>`).join('')}</div>
    <div class="chat-in"><input id="zchatIn" placeholder="Message ${c.name}…"><kbd>↵</kbd></div>
  </div>`;

  return `
    <div class="ztop">
      <button class="back" onclick="closeZoom()">${svg(ic.back,14)} Overview <kbd>Esc</kbd></button>
      <span class="dot active" style="${c.status==='paused'?'background:var(--amber)':''}"></span>
      <span class="znm">${c.name}</span>
      <span class="zdm">${c.domain||'no domain yet'}</span>
      <div class="grow"></div>
      ${c.previewUrl?`<a class="back" href="${c.previewUrl}" target="_blank" rel="noopener">${svg(ic.ext,13)} ${c.previewUrl}</a>`:''}
    </div>
    <div class="zbody">
      <div class="hero-co" style="cursor:default"><span class="zdm" style="font-size:14px;color:var(--ink-2)">${c.thesis}</span></div>
      ${metrics}
      ${gateBlock}
      <div class="zgrid">
        <div>
          <div class="sec-h" style="margin-top:0"><h2>Slices</h2><span class="ct">walking skeleton → bag → bag</span></div>
          ${slicesBlock}
        </div>
        ${chatBlock}
      </div>
    </div>`;
}
function approveZoom(id, reject){
  const f=$('#flash-z-'+id); if(!f)return;
  f.className='flash on '+(reject?'rej':'ok');
  $('#ring-z-'+id).innerHTML=svg(reject?'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>':ic.check,26);
  $('#fmsg-z-'+id).textContent= reject?'Feedback sent ✓':'Approved ✓';
  setTimeout(()=>{
    resolvedNeeds.push(id);
    DATA.portfolio.needsYou=needsList().length;
    renderHero(); renderList($('#qlist'),false);
    closeZoom();
  },1300);
}

/* ---- command bar + keyboard ---- */
function focusCmd(){ $('#cmdInput').focus(); }
$('#cmdInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=e.target.value.toLowerCase().trim(); e.target.value='';
    if(v.includes('leadsift')||v.includes('approve')){ if(v.includes('approve')&&needsList().length){ openZoom('leadsift'); } else { openZoom('leadsift'); } }
    else if(v.includes('portfolio')||v.includes('opp')) showView('port');
    else if(v){ const c=DATA.companies.find(x=>x.name.toLowerCase().includes(v)); if(c)openZoom(c.id); }
  }
});

let kIdx=-1;
function listRows(){ return [...$('#qlist').querySelectorAll('.qrow')]; }
document.addEventListener('keydown',e=>{
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if((e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); focusCmd(); return; }
  if(e.key==='Escape'){
    if(currentZoom){ closeZoom(); return; }
    document.querySelectorAll('.reject-box.on').forEach(b=>b.classList.remove('on'));
    if(typing) document.activeElement.blur();
    return;
  }
  if(typing) return;
  // hero approve / reject shortcuts
  const pending=needsList();
  if(!currentZoom && pending.length){
    if(e.key==='a'||e.key==='A'){ approve(pending[0].id); return; }
    if(e.key==='r'||e.key==='R'){ toggleReject(pending[0].id); return; }
  }
  // j/k list nav (focus view)
  if(view==='focus' && (e.key==='j'||e.key==='k')){
    const rows=listRows(); if(!rows.length)return;
    rows.forEach(r=>r.classList.remove('kfocus'));
    kIdx = e.key==='j' ? Math.min(kIdx+1,rows.length-1) : Math.max(kIdx-1,0);
    rows[kIdx].classList.add('kfocus'); rows[kIdx].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  if(e.key==='Enter' && kIdx>=0 && view==='focus'){ const rows=listRows(); rows[kIdx]?.click(); }
});

/* ---- boot ---- */
renderHero();
renderList($('#qlist'),false);
renderList($('#qlist2'),true);
renderOpps();
renderMoves();
renderAct();
</script>
