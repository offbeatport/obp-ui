<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Stage Pipeline</title>
<script>
  // Pre-paint theme: read stored preference before first paint to avoid flash.
  (function () {
    try {
      var t = localStorage.getItem('cslopslop-theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:      #f7f3ec;
    --cream-2:    #f1ebdf;
    --paper:      #fffdf8;
    --ink:        #2c2926;
    --ink-soft:   #6d665f;
    --ink-faint:  #a49b90;
    --line:       #e4ddd0;
    --line-soft:  #efe9dd;
    --accent:     #c8643c;
    --accent-soft:#f4e1d6;
    --green:      #4f8a52;
    --green-soft: #dfeadd;
    --blue:       #3d6ea5;
    --blue-soft:  #dbe6f1;
    --violet:     #7c5cbf;
    --violet-soft:#e6ddf3;
    --amber:      #bd8320;
    --amber-soft: #f2e6cb;
    --red:        #b0433a;
    --red-soft:   #f2dcd8;
    --slate:      #64748b;
    --slate-soft: #e2e4e8;
    --shadow:     0 1px 2px rgba(58,44,32,.05), 0 8px 24px rgba(58,44,32,.07);
    --shadow-lg:  0 4px 12px rgba(58,44,32,.10), 0 24px 60px rgba(58,44,32,.16);
  }
  :root[data-theme="dark"] {
    --cream:      #05060a;
    --cream-2:    #0a0c14;
    --paper:      #10131f;
    --ink:        #e6ebf5;
    --ink-soft:   #9aa3b2;
    --ink-faint:  #5a6373;
    --line:       #232838;
    --line-soft:  #1a1e2b;
    --accent:     #e0794e;
    --accent-soft:#3a251b;
    --green:      #34d399;
    --green-soft: #10291f;
    --blue:       #60a5fa;
    --blue-soft:  #13233a;
    --violet:     #a78bfa;
    --violet-soft:#221a38;
    --amber:      #fbbf24;
    --amber-soft: #322611;
    --red:        #f87171;
    --red-soft:   #331817;
    --slate:      #94a3b8;
    --slate-soft: #1c2230;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    --shadow-lg:  0 4px 12px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 12% -10%, var(--cream-2), transparent 55%),
      var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    transition: background-color .4s ease, color .4s ease;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-feature-settings: 'ss01';
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  ::selection { background: var(--accent-soft); color: var(--ink); }

  /* ---------- Top bar ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 26px;
    background: color-mix(in srgb, var(--cream) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--amber)));
    display: grid; place-items: center;
    color: #fff; font-family: 'Space Grotesk'; font-weight: 700; font-size: 17px;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 16px; letter-spacing: -.01em;
    line-height: 1;
  }
  .brand-sub { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }

  .totals {
    display: flex; align-items: center; gap: 0;
    margin-left: auto; flex-wrap: wrap;
  }
  .total {
    display: flex; flex-direction: column; gap: 2px;
    padding: 0 18px;
    border-left: 1px solid var(--line);
  }
  .total:first-child { border-left: 0; }
  .total .k { font-size: 9.5px; }
  .total .v {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600; font-size: 15px; letter-spacing: -.01em;
    color: var(--ink);
  }
  .total .v.pos { color: var(--green); }
  .total .v.spend { color: var(--accent); }
  .total .v.needs { color: var(--amber); }

  .icon-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .18s ease, border-color .18s ease, color .18s ease, background .18s ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .moon { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .moon { display: block; }

  /* ---------- Needs-you strip ---------- */
  .needs-strip {
    padding: 16px 26px 4px;
  }
  .needs-head {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 11px;
  }
  .needs-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 15px; letter-spacing: -.01em;
  }
  .needs-count {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--amber);
    background: var(--amber-soft);
    padding: 2px 8px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .needs-count .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: pulse 2.4s ease-in-out infinite; }
  .needs-hint { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }

  .needs-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .need {
    flex: 1 1 300px; min-width: 260px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color .2s ease, box-shadow .2s ease, opacity .35s ease, transform .35s ease;
  }
  .need.resolved { border-left-color: var(--green); opacity: .72; }
  .need-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; cursor: pointer; }
  .need-co {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px;
  }
  .need-stage-dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
  .need-ask { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .need-chev { margin-left: auto; color: var(--ink-faint); transition: transform .25s ease; }
  .need.open .need-chev { transform: rotate(90deg); }
  .need-body {
    max-height: 0; overflow: hidden;
    transition: max-height .3s ease;
  }
  .need.open .need-body { max-height: 220px; }
  .need-body-inner { padding: 0 14px 13px; }
  .need-detail { font-size: 12px; color: var(--ink-faint); margin-bottom: 11px; line-height: 1.45; }
  .need-actions { display: flex; gap: 8px; }
  .need-resolved-msg {
    display: none; align-items: center; gap: 8px;
    padding: 10px 14px 13px; font-size: 12.5px; color: var(--green);
  }
  .need.resolved .need-resolved-msg { display: flex; }
  .need.resolved .need-body { max-height: 0 !important; }
  .need.resolved .need-chev { display: none; }

  .btn {
    font-family: 'Inter', sans-serif; font-weight: 550; font-size: 12.5px;
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-approve { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-approve:hover { background: color-mix(in srgb, var(--green) 88%, #000); }
  :root[data-theme="dark"] .btn-approve { color: #05221a; }
  .btn-hold { color: var(--ink-soft); }
  .btn-hold:hover { border-color: var(--ink-soft); }
  .btn-kill { color: var(--red); border-color: var(--red-soft); }
  .btn-kill:hover { background: var(--red-soft); border-color: var(--red); }

  /* ---------- Pipeline board ---------- */
  .board-wrap { flex: 1; padding: 22px 26px 30px; overflow-x: auto; overflow-y: hidden; }
  .board-label { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .board-label .eyebrow { letter-spacing: .2em; }
  .board-label .flowline { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  .board { display: flex; gap: 16px; align-items: stretch; min-width: max-content; padding-bottom: 8px; }

  .stage-gap { display: flex; align-items: center; align-self: center; color: var(--line); flex-shrink: 0; }
  .stage-gap svg { width: 22px; height: 22px; }
  .stage-gap.terminal { color: var(--ink-faint); }
  .stage-gap.terminal::before {
    content: ''; width: 1px; height: 68vh; max-height: 560px;
    background: repeating-linear-gradient(var(--line) 0 5px, transparent 5px 11px);
    margin-right: 14px;
  }

  .col {
    width: 268px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .col-head {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 4px 12px;
    border-bottom: 2px solid var(--stage);
    position: relative;
  }
  .col-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--stage); flex-shrink: 0; }
  .col-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px;
    letter-spacing: .01em;
  }
  .col-count {
    margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--ink-faint);
    background: var(--stage-soft); color: var(--stage);
    width: 22px; height: 20px; border-radius: 6px; display: grid; place-items: center;
  }
  .col-desc { font-size: 10.5px; color: var(--ink-faint); padding: 0 4px; margin-top: -4px; line-height: 1.4; }
  .col.terminal .col-body { opacity: .92; }

  .col-body { display: flex; flex-direction: column; gap: 12px; }

  /* ---------- Card ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 15px 15px 14px;
    cursor: pointer;
    position: relative;
    box-shadow: var(--shadow);
    transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--stage); opacity: .0; transition: opacity .2s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--stage) 45%, var(--line)); }
  .card:hover::before { opacity: 1; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: -.01em; line-height: 1.15;
  }
  .card-flag {
    margin-left: auto; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .05em;
    color: var(--amber); background: var(--amber-soft);
    padding: 3px 7px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase;
  }
  .card-flag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
  .card-desc {
    font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.45;
    min-height: 34px;
  }

  .signal {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .08em;
    padding: 3px 8px 3px 6px; border-radius: 20px; margin-top: 11px;
    text-transform: uppercase; font-weight: 500;
  }
  .signal .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .signal .bars i { width: 2.5px; background: currentColor; border-radius: 1px; opacity: .35; }
  .signal .bars i.on { opacity: 1; }
  .signal.strong   { color: var(--green);  background: var(--green-soft); }
  .signal.promising{ color: var(--blue);   background: var(--blue-soft); }
  .signal.none     { color: var(--ink-faint); background: var(--line-soft); }
  .signal.weak     { color: var(--red);    background: var(--red-soft); }

  .card-metrics {
    display: flex; gap: 14px; margin-top: 13px;
    padding-top: 12px; border-top: 1px solid var(--line-soft);
  }
  .metric .m-k { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .metric .m-v { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: -.02em; margin-top: 2px; }
  .metric .m-v.rev { color: var(--green); }
  .metric .m-v.rev.zero { color: var(--ink-faint); }

  .progress { margin-top: 13px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .progress-lab { font-size: 10px; color: var(--ink-faint); }
  .progress-val { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--stage); font-weight: 600; }
  .track { height: 5px; background: var(--line-soft); border-radius: 20px; overflow: hidden; }
  .track > span { display: block; height: 100%; background: var(--stage); border-radius: 20px; width: 0; transition: width .9s cubic-bezier(.2,.7,.3,1); }

  .card-outcome {
    margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 8px; font-size: 11.5px;
  }
  .card-outcome .oc-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 20px;
  }
  .oc-badge.grad { color: var(--violet); background: var(--violet-soft); }
  .oc-badge.stop { color: var(--red); background: var(--red-soft); }
  .card-outcome .oc-note { color: var(--ink-faint); }

  /* ---------- Focus (zoom-in) ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 60;
    background: color-mix(in srgb, var(--cream) 40%, rgba(20,12,6,.55));
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .focus {
    position: fixed; z-index: 61; inset: 0;
    display: grid; place-items: center;
    pointer-events: none; padding: 24px;
  }
  .focus-panel {
    width: min(920px, 96vw); max-height: 92vh;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column;
    overflow: hidden;
    pointer-events: auto;
    transform: scale(.94) translateY(14px); opacity: 0;
    transition: transform .3s cubic-bezier(.2,.8,.25,1), opacity .3s ease;
  }
  .scrim.show ~ .focus .focus-panel { transform: scale(1) translateY(0); opacity: 1; }

  .focus-head {
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--stage-soft), transparent);
    position: relative;
  }
  .focus-crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .zoom-out {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .04em;
    color: var(--ink-soft); background: transparent; border: 0; cursor: pointer;
    padding: 4px 8px; border-radius: 7px; transition: background .16s ease, color .16s ease;
  }
  .zoom-out:hover { background: var(--stage-soft); color: var(--ink); }
  .focus-crumb .sep { color: var(--ink-faint); }
  .focus-crumb .cur { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-faint); }

  .focus-title-row { display: flex; align-items: flex-start; gap: 14px; }
  .focus-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -.02em; line-height: 1; }
  .stage-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500;
    color: var(--stage); background: var(--stage-soft);
    padding: 4px 10px; border-radius: 20px;
  }
  .stage-pill .d { width: 7px; height: 7px; border-radius: 2px; background: var(--stage); }
  .focus-close {
    position: absolute; top: 18px; right: 20px;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;
    transition: color .16s, border-color .16s, transform .16s;
  }
  .focus-close:hover { color: var(--accent); border-color: var(--accent); transform: rotate(90deg); }
  .focus-desc { font-family: 'Spectral', serif; font-size: 15px; color: var(--ink-soft); margin-top: 10px; line-height: 1.5; max-width: 62ch; }

  .rec-line { display: flex; align-items: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .rec-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    padding: 5px 12px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .rec-pill.continue { color: var(--green); background: var(--green-soft); }
  .rec-pill.eject    { color: var(--violet); background: var(--violet-soft); }
  .rec-pill.kill     { color: var(--red); background: var(--red-soft); }
  .rec-lab { font-size: 11px; color: var(--ink-faint); }

  /* tabs */
  .tabs { display: flex; gap: 2px; padding: 0 26px; border-bottom: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
  .tab {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12.5px;
    padding: 13px 14px 12px; border: 0; background: transparent; color: var(--ink-faint);
    cursor: pointer; position: relative; transition: color .16s ease;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
    background: var(--accent); border-radius: 2px 2px 0 0;
  }

  .focus-body { overflow-y: auto; padding: 22px 26px 26px; }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; }
  @media (max-width: 720px){ .grid2 { grid-template-columns: 1fr; } }

  .block {
    background: var(--cream);
    border: 1px solid var(--line-soft);
    border-radius: 14px; padding: 16px;
  }
  .block + .block { margin-top: 14px; }
  .block-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .block-h .eyebrow { letter-spacing: .13em; }
  .block-h .ico { color: var(--stage); display: grid; place-items: center; }
  .block-h .ico svg { width: 14px; height: 14px; }

  /* goal / progress big */
  .goal-txt { font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .goal-prog-row { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 0 7px; }
  .goal-prog-lab { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--stage); font-weight: 600; }
  .goal-prog-pct { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; letter-spacing: -.02em; color: var(--stage); }
  .track.big { height: 8px; }

  .kv-list { display: flex; flex-direction: column; gap: 0; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .kv:last-child { border-bottom: 0; }
  .kv .kv-k { font-size: 12px; color: var(--ink-soft); }
  .kv .kv-v { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: -.01em; text-align: right; }

  PORTFOLIO.forEach(p => {
    const d = el("div", "total");
    d.innerHTML = `<span class="k eyebrow">${p.k}</span><span class="v ${p.cls}">${p.v}</span>`;
    t.appendChild(d);
  });
}

/* ---------------- Render: legend ---------------- */
function renderLegend() {
  const l = $("#legend");
  STAGE_ORDER.forEach(k => {
    const s = STAGES[k];
    const g = el("span", "leg", `<i style="background:${s.color}"></i>${s.name}`);
    l.appendChild(g);
  });
}

/* ---------------- Render: needs-you ---------------- */
function renderNeeds() {
  const row = $("#needsRow");
  row.innerHTML = "";
  COMPANIES.filter(c => c.needs && c.approval).forEach(c => {
    const stage = STAGES[c.stage];
    const item = el("div", "need");
    item.dataset.id = c.id;
    item.innerHTML = `
      <div class="need-top" data-role="head">
        <span class="need-stage-dot" style="background:${stage.color}"></span>
        <div>
          <div class="need-co">${c.name}</div>
          <div class="need-ask">${c.approval.title}</div>
        </div>
        <span class="need-chev">${IC.chev}</span>
      </div>
      <div class="need-body"><div class="need-body-inner">
        <div class="need-detail">${c.approval.detail}</div>
        <div class="need-actions">
          <button class="btn btn-approve" data-act="approve">${IC.check}&nbsp; Approve</button>
          <button class="btn btn-hold" data-act="hold">Hold</button>
          <button class="btn btn-kill" data-act="kill">Kill bet</button>
          <button class="btn" data-act="open" style="margin-left:auto">Open →</button>
        </div>
      </div></div>
      <div class="need-resolved-msg">${IC.check}<span data-role="rmsg"></span></div>
    `;
    // toggle expand
    item.querySelector('[data-role="head"]').addEventListener("click", () => {
      if (item.classList.contains("resolved")) return;
      item.classList.toggle("open");
    });
    item.querySelectorAll("[data-act]").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === "open") { openFocus(c.id); return; }
        resolveNeed(c.id, act, item);
      });
    });
    row.appendChild(item);
  });
}

function resolveNeed(id, act, item) {
  if (state.resolved[id]) return;
  const c = byId(id);
  state.resolved[id] = act;
  const labels = {
    approve: `Approved — the AI is executing. Reversible from ${c.name}.`,
    hold: `Held. ${c.name} paused this decision; nothing shipped.`,
    kill: `${c.name} marked to kill — the AI is winding it down.`
  };
  item.querySelector('[data-role="rmsg"]').textContent = labels[act];
  item.classList.remove("open");
  item.classList.add("resolved");
  // reflect on card
  const card = $(`.card[data-id="${id}"] .card-flag`);
  if (card) { card.style.transition = "opacity .3s"; card.style.opacity = "0"; setTimeout(() => card.remove(), 320); }
  // update count
  state.needsRemaining = Math.max(0, state.needsRemaining - 1);
  $("#needsNum").textContent = state.needsRemaining;
  const totalNeeds = $("#totals .v.needs");
  if (totalNeeds) totalNeeds.textContent = state.needsRemaining;
  if (state.needsRemaining === 0) {
    $("#needsCount").innerHTML = `${IC.check} all clear`;
    $("#needsCount").style.color = "var(--green)";
    $("#needsCount").style.background = "var(--green-soft)";
  }
  const toastMsg = { approve: "Approved", hold: "Held", kill: "Winding down" };
  toast(toastMsg[act], `${c.name} · reversible`);
  // reflect in an open focus view
  syncFocusApproval(id, act);
}

/* ---------------- Render: board ---------------- */
function renderBoard() {
  const board = $("#board");
  board.innerHTML = "";
  STAGE_ORDER.forEach((key, idx) => {
    // divider before terminal columns
    if (key === "ejected") {
      const gap = el("div", "stage-gap terminal");
      board.appendChild(gap);
    } else if (idx > 0) {
      const gap = el("div", "stage-gap");
      gap.innerHTML = IC.arrow;
      board.appendChild(gap);
    }

    const s = STAGES[key];
    const isTerminal = key === "ejected" || key === "killed";
    const col = el("div", "col" + (isTerminal ? " terminal" : ""));
    col.style.setProperty("--stage", s.color);
    col.style.setProperty("--stage-soft", s.soft);
    const bets = COMPANIES.filter(c => c.stage === key);
    col.innerHTML = `
      <div class="col-head">
        <span class="col-dot"></span>
        <span class="col-name">${s.name}</span>
        <span class="col-count">${bets.length}</span>
      </div>
      <div class="col-desc">${s.desc}</div>
    `;
    const body = el("div", "col-body");
    bets.forEach(c => body.appendChild(buildCard(c)));
    col.appendChild(body);
    board.appendChild(col);
  });
  // animate progress bars in after layout
  requestAnimationFrame(() => {
    document.querySelectorAll(".card .track > span").forEach(sp => {
      sp.style.width = sp.dataset.w + "%";
    });
  });
}

function buildCard(c) {
  const s = STAGES[c.stage];
  const card = el("div", "card");
  card.dataset.id = c.id;
  card.style.setProperty("--stage", s.color);
  card.style.setProperty("--stage-soft", s.soft);
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `Open ${c.name}, stage ${s.name}`);

  const isTerminal = c.stage === "ejected" || c.stage === "killed";
  const revZero = c.revenue === 0 ? " zero" : "";

  let bottom;
  if (isTerminal) {
    bottom = `<div class="card-outcome">
        <span class="oc-badge ${c.outcome.badge}">${c.outcome.label}</span>
        <span class="oc-note">${c.outcome.note}</span>
      </div>`;
  } else {
    bottom = `<div class="progress">
        <div class="progress-row"><span class="progress-lab">Toward validation goal</span><span class="progress-val">${Math.round(c.progress * 100)}%</span></div>
        <div class="track"><span data-w="${Math.round(c.progress * 100)}"></span></div>
      </div>`;
  }

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${c.name}</span>
      ${c.needs ? `<span class="card-flag"><span class="dot"></span>needs you</span>` : ``}
    </div>
    <p class="card-desc">${c.desc}</p>
    ${signalMarkup(c.signal)}
    <div class="card-metrics">
      <div class="metric"><div class="m-k">Rev / mo</div><div class="m-v rev${revZero}">$${c.revenue}</div></div>
      <div class="metric"><div class="m-k">Spend</div><div class="m-v">$${c.spend}</div></div>
      <div class="metric"><div class="m-k">Users</div><div class="m-v">${c.usersNum}</div></div>
    </div>
    ${bottom}
  `;
  card.addEventListener("click", () => openFocus(c.id));
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFocus(c.id); } });
  return card;
}

/* ---------------- Focus (zoom-in) ---------------- */
function openFocus(id) {
  const c = byId(id);
  const s = STAGES[c.stage];
  const panel = $("#focusPanel");
  panel.style.setProperty("--stage", s.color);
  panel.style.setProperty("--stage-soft", s.soft);

  const recCls = c.rec === "CONTINUE" ? "continue" : c.rec === "EJECT" ? "eject" : "kill";
  const recIco = c.rec === "EJECT" ? IC.eject : c.rec === "KILL" ? IC.warn : IC.check;
  const altRec = c.altRec ? ` <span class="rec-lab">— or <b style="color:var(--red)">KILL</b> if the signal is weak</span>` : "";

  const revZero = c.revenue === 0 ? " zero" : "";
  const resolvedAct = state.resolved[c.id];

  const tabs = ["Overview", "Foundation", "Product", "Growth", "Budget"];

  panel.innerHTML = `
    <div class="focus-head">
      <div class="focus-crumb">
        <button class="zoom-out" id="zoomOut">${IC.arrow.replace('M5 12h14M13 6l6 6-6 6','M19 12H5M11 18l-6-6 6-6')} Zoom out to portfolio</button>
        <span class="sep">/</span>
        <span class="cur">${s.name.toUpperCase()}</span>
      </div>
      <button class="focus-close" id="focusClose" aria-label="Close">${IC.close}</button>
      <div class="focus-title-row">
        <h1 class="focus-title">${c.name}</h1>
        <span class="stage-pill"><span class="d"></span>${s.name}</span>
        ${signalMarkup(c.signal)}
      </div>
      <p class="focus-desc">${c.desc}</p>
      <div class="rec-line">
        <span class="rec-pill ${recCls}">${recIco} AI rec: ${c.rec}</span>
        ${altRec}
        <span class="rec-lab" style="margin-left:auto">Status · ${c.status}</span>
      </div>
    </div>
    <div class="tabs" id="tabs">
      ${tabs.map((t, i) => `<button class="tab${i === 0 ? " active" : ""}" data-tab="${t}">${t}</button>`).join("")}
    </div>
    <div class="focus-body" id="focusBody">
      ${overviewPanel(c, s, revZero, resolvedAct)}
      ${docPanel("Foundation", c)}
      ${docPanel("Product", c)}
      ${docPanel("Growth", c)}
      ${docPanel("Budget", c)}
    </div>
  `;

  // tab switching
  panel.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      panel.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      panel.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      $(`#panel-${t.dataset.tab}`).classList.add("active");
      $("#focusBody").scrollTop = 0;
    });
  });

  // approval actions inside focus
  panel.querySelectorAll(".approval-actions [data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const act = b.dataset.act;
      resolveNeed(c.id, act, findNeedItem(c.id));
    });
  });

  $("#zoomOut").addEventListener("click", closeFocus);
  $("#focusClose").addEventListener("click", closeFocus);

  // animate the overview goal bar
  $("#scrim").classList.add("show");
  $("#focus").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => {
    const bar = panel.querySelector(".track.big > span");
    if (bar) bar.style.width = bar.dataset.w + "%";
  });
}

function overviewPanel(c, s, revZero, resolvedAct) {
  const activity = c.recent.map(r => `<div class="act"><span class="a-dot"></span><span class="a-txt">${boldFirst(r)}</span></div>`).join("");
  const risks = c.risks.map(r => `<div class="risk"><span class="r-ico">${IC.warn}</span><span>${r}</span></div>`).join("");

  let approvalBox = "";
  if (c.approval) {
    const done = resolvedAct ? " done" : "";
    const msg = resolvedAct
      ? (resolvedAct === "approve" ? "Approved — the AI is executing this now. Reversible." :
         resolvedAct === "hold" ? "Held — nothing shipped." : "Marked to kill — winding down.")
      : "";
    approvalBox = `
      <div class="approval-box${done}" id="focusApproval">
        <div class="approval-tag"><span class="eyebrow">◆ Approval pending</span></div>
        <div class="approval-title">${c.approval.title}</div>
        <div class="approval-detail">${c.approval.detail}</div>
        <div class="approval-actions">
          <button class="btn btn-approve" data-act="approve">${IC.check}&nbsp; Approve</button>
          <button class="btn btn-hold" data-act="hold">Hold</button>
          <button class="btn btn-kill" data-act="kill">Kill bet</button>
        </div>
        <div class="approval-done">${IC.check}<span>${msg}</span></div>
      </div>`;
  }

  const naBlock = c.nextAction && c.nextAction !== "—"
    ? `<div class="next-action"><span class="na-ico">${IC.bolt}</span><div><div class="na-lab">Next best action</div><div class="na-txt">${c.nextAction}</div></div></div>`
    : "";

  return `
  <div class="panel active" id="panel-Overview">
    <div class="grid2">
      <div>
        <div class="block">
          <div class="block-h"><span class="ico">${IC.target}</span><span class="eyebrow">Validation goal</span></div>
          <div class="goal-txt">${c.goal}</div>
          <div class="goal-prog-row"><span class="goal-prog-lab">${c.goalLab}</span><span class="goal-prog-pct">${Math.round(c.progress * 100)}%</span></div>
          <div class="track big"><span data-w="${Math.round(c.progress * 100)}"></span></div>
        </div>
        <div class="block">
          <div class="block-h"><span class="ico">${IC.brain}</span><span class="eyebrow">Current AI plan</span></div>
          <div class="plan-txt">${c.plan}</div>
          ${naBlock}
        </div>
        ${approvalBox}
        <div class="block">
          <div class="block-h"><span class="ico">${IC.warn}</span><span class="eyebrow">Risks</span></div>
          ${risks}
        </div>
      </div>
      <div>
        <div class="block">
          <div class="block-h"><span class="ico">${IC.coin}</span><span class="eyebrow">Numbers</span></div>
          <div class="kv-list">
            <div class="kv"><span class="kv-k">Revenue / mo</span><span class="kv-v rev${revZero}">$${c.revenue}</span></div>
            <div class="kv"><span class="kv-k">Spend / mo</span><span class="kv-v spend">$${c.spend}</span></div>
            <div class="kv"><span class="kv-k">Net / mo</span><span class="kv-v" style="color:${c.revenue - c.spend >= 0 ? 'var(--green)' : 'var(--ink)'}">${c.revenue - c.spend >= 0 ? "+" : "−"}$${Math.abs(c.revenue - c.spend)}</span></div>
            <div class="kv"><span class="kv-k">Users</span><span class="kv-v">${c.users}</span></div>
            <div class="kv"><span class="kv-k">Signal</span><span class="kv-v" style="color:${signalColor(c.signal)}">${c.signal}</span></div>
          </div>
        </div>
        <div class="block">
          <div class="block-h"><span class="ico">${IC.clock}</span><span class="eyebrow">Recent activity</span></div>
          <div class="activity">${activity}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function signalColor(sig) {
  const map = { STRONG: "var(--green)", PROMISING: "var(--blue)", "NONE YET": "var(--ink-faint)", NONE: "var(--ink-faint)", WEAK: "var(--red)" };
  return map[sig] || "var(--ink-faint)";
}

function docPanel(name, c) {
  const d = c.docs[name];
  const li = d.li.map(x => `<li>${x}</li>`).join("");
  return `
  <div class="panel" id="panel-${name}">
    <div class="doc-prose">
      <h4>${d.h}</h4>
      <p>${d.p}</p>
      <ul>${li}</ul>
    </div>
  </div>`;
}

function boldFirst(str) {
  // bold leading verb-ish phrase up to first space cluster for rhythm
  return str.replace(/^([\w+]+)/, "<b>$1</b>");
}

function findNeedItem(id) {
  return document.querySelector(`.need[data-id="${id}"]`);
}

function syncFocusApproval(id, act) {
  const box = $("#focusApproval");
  if (!box) return;
  const c = byId(id);
  const open = $("#focusPanel");
  // only update if the currently open focus matches
  if (!open.querySelector(`.focus-title`)) return;
  if (open.querySelector(".focus-title").textContent !== c.name) return;
  box.classList.add("done");
  const msg = act === "approve" ? "Approved — the AI is executing this now. Reversible." :
              act === "hold" ? "Held — nothing shipped." : "Marked to kill — winding down.";
  const span = box.querySelector(".approval-done span");
  if (span) span.textContent = msg;
}

function closeFocus() {
  $("#scrim").classList.remove("show");
  $("#focus").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

/* ---------------- Toast ---------------- */
function toast(title, sub) {
  const wrap = $("#toastWrap");
  const t = el("div", "toast", `<span class="t-ico">${IC.check}</span><span>${title}</span><span class="t-sub">${sub}</span>`);
  wrap.appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s, transform .4s"; t.style.opacity = "0"; t.style.transform = "translateY(10px)"; }, 2600);
  setTimeout(() => t.remove(), 3100);
}

/* ---------------- Theme ---------------- */
function currentTheme() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
$("#themeToggle").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("cslopslop-theme", next); } catch (e) {}
});

/* ---------------- Keyboard ---------------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#scrim").classList.contains("show")) closeFocus();
});
$("#scrim").addEventListener("click", closeFocus);

/* ---------------- Init ---------------- */
renderTotals();
renderLegend();
renderNeeds();
renderBoard();
</script>
</body>
</html>
