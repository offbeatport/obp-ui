<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>21 · One Thing — C Slop Slop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-2: #6b6b6b;
    --ink-3: #9a9a9a;
    --line: #ececec;
    --line-2: #e2e2e2;
    --accent: #5b5bd6;      /* the ONE accent */
    --accent-soft: #eeeefb;
    --green: #16a34a;
    --green-soft: #e8f6ec;
    --amber: #d97706;
    --violet: #7c3aed;
    --red: #dc2626;
    --blue: #2563eb;
    --slate: #94a3b8;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.10);
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ---------- corner badge ---------- */
  .badge {
    position: fixed; bottom: 18px; left: 18px; z-index: 90;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; background: var(--surface);
    border: 1px solid var(--line-2); border-radius: 999px;
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    box-shadow: var(--shadow); user-select: none;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  /* ---------- top hint bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 80;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    background: rgba(251,251,250,.78);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .2s var(--ease);
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 7px; background: var(--ink);
    display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700;
  }
  .topbar .right { display: flex; align-items: center; gap: 10px; }
  .seg {
    display: flex; background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 3px;
  }
  .seg button {
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    padding: 5px 14px; border-radius: 999px; transition: all .16s var(--ease);
  }
  .seg button.on { background: var(--ink); color: #fff; }
  .kbd {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 2px 6px; border-radius: 6px; background: var(--surface);
    border: 1px solid var(--line-2); color: var(--ink-3); box-shadow: 0 1px 0 var(--line-2);
  }

  /* ============================================================
     FOCUS MODE — One Thing
     ============================================================ */
  .focus {
    min-height: 100vh; padding: 92px 24px 160px;
    display: flex; flex-direction: column; align-items: center;
  }
  .focus.hidden { display: none; }

  .progress-row {
    display: flex; align-items: center; gap: 14px; margin-bottom: 40px;
    opacity: 0; animation: rise .5s var(--ease) .05s forwards;
  }
  .progress-pips { display: flex; gap: 7px; }
  .pip { width: 26px; height: 4px; border-radius: 999px; background: var(--line-2); transition: background .3s var(--ease); }
  .pip.done { background: var(--green); }
  .pip.cur { background: var(--accent); }
  .progress-label { font-size: 12.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
  .progress-label b { color: var(--ink); }

  /* card stack — one decision at a time */
  .stage { width: 100%; max-width: 720px; position: relative; }

  .decision { width: 100%; }
  .decision.leaving { animation: slideOutLeft .34s var(--ease) forwards; }
  .decision.entering { animation: slideInRight .42s var(--ease) forwards; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
  }
  .eyebrow .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .eyebrow.violet { color: var(--violet); } .eyebrow.violet .pulse { background: var(--violet); }
  .eyebrow.red { color: var(--red); } .eyebrow.red .pulse { background: var(--red); }
  .eyebrow.accent { color: var(--accent); }

  .headline {
    font-size: 30px; line-height: 1.18; font-weight: 700; letter-spacing: -.025em;
    margin: 0 0 8px; max-width: 600px;
  }
  .subline { font-size: 15.5px; color: var(--ink-2); margin: 0 0 26px; line-height: 1.5; max-width: 560px; }
  .subline .co { color: var(--ink); font-weight: 600; }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel + .panel { margin-top: 14px; }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head .label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .panel-head .label .ic { color: var(--ink-3); }

  /* preview url chip + green check */
  .url-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--accent);
    text-decoration: none; padding: 4px 9px; border-radius: 8px;
    background: var(--accent-soft); transition: filter .15s var(--ease);
  }
  .url-chip:hover { filter: brightness(.97); }
  .url-chip .live { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(22,163,74,.5); animation: live 2s infinite; }

  .check-pass {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--green);
    background: var(--green-soft); padding: 4px 10px; border-radius: 999px;
  }
  .check-pass svg { display: block; }

  /* diff */
  .diff { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; padding: 6px 0; background: #fcfcfc; }
  .diff .dl { display: flex; padding: 0 16px; white-space: pre; }
  .diff .dl .gut { width: 18px; flex: none; color: var(--ink-3); user-select: none; }
  .diff .dl.add { background: var(--green-soft); }
  .diff .dl.add .gut { color: var(--green); }
  .diff .dl.add .code { color: #14532d; }
  .diff .dl.ctx .code { color: var(--ink-2); }

  .donewhen { padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .donewhen .expr { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); }
  .donewhen .expr b { color: var(--ink); }

  /* preview iframe mock */
  .preview-frame { padding: 16px; }
  .browser {
    border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: #fff;
  }
  .browser .bar { display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: #f6f6f6; border-bottom: 1px solid var(--line); }
  .browser .bar .tl { display: flex; gap: 5px; }
  .browser .bar .tl i { width: 9px; height: 9px; border-radius: 50%; background: #ddd; }
  .browser .bar .addr { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .browser .body { padding: 18px; }
  .browser .body .mh { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
  .browser .lead-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .browser .lead-row:first-of-type { border-top: none; }
  .browser .lead-row .sc { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--green); }

  /* action row */
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 11px;
    transition: transform .12s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:active { transform: scale(.97); }
  .btn-approve { background: var(--green); color: #fff; box-shadow: 0 4px 14px rgba(22,163,74,.28); }
  .btn-approve:hover { background: #15803d; }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-2); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-3); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(91,91,214,.28); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn .arr { transition: transform .15s var(--ease); }
  .btn:hover .arr { transform: translateX(3px); }
  .skip {
    margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 4px;
    transition: color .15s var(--ease);
  }
  .skip:hover { color: var(--ink); }

  .meta-line { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); }

  /* reject feedback inline */
  .reject-box {
    margin-top: 14px; background: var(--surface); border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); padding: 14px; box-shadow: var(--shadow);
    opacity: 0; max-height: 0; overflow: hidden; transition: all .28s var(--ease); padding-top: 0; padding-bottom: 0;
  }
  .reject-box.open { opacity: 1; max-height: 220px; padding-top: 14px; padding-bottom: 14px; }
  .reject-box textarea {
    width: 100%; border: 1px solid var(--line-2); border-radius: 9px; resize: none;
    font-family: inherit; font-size: 13.5px; padding: 10px 12px; color: var(--ink);
    min-height: 64px; outline: none; transition: border-color .15s var(--ease);
  }
  .reject-box textarea:focus { border-color: var(--accent); }
  .reject-box .rb-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

  /* toast confirmation */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 9px; z-index: 200;
    opacity: 0; pointer-events: none; transition: all .3s var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .tk { color: var(--green); display: grid; place-items: center; }
  .toast.accent .tk { color: #a5a5f5; }

  /* all clear */
  .allclear { width: 100%; max-width: 520px; text-align: center; padding-top: 30px; }
  .allclear .ring {
    width: 88px; height: 88px; margin: 0 auto 26px; border-radius: 50%;
    background: var(--green-soft); display: grid; place-items: center; color: var(--green);
    animation: pop .5s var(--ease);
  }
  .allclear h2 { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
  .allclear p { font-size: 15px; color: var(--ink-2); margin: 0 0 28px; line-height: 1.55; }
  .allclear .stat-row { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
  .allclear .stat .v { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: -.02em; }
  .allclear .stat .k { font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }

  /* chat spine (focus) */
  .chatbar {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 70;
    width: min(680px, calc(100vw - 48px));
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 14px; padding: 9px 9px 9px 16px; box-shadow: var(--shadow-lg);
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .chatbar:focus-within { border-color: var(--accent); }
  .chatbar .ck { color: var(--ink-3); }
  .chatbar input { flex: 1; border: none; outline: none; font-size: 14px; font-family: inherit; color: var(--ink); background: none; }
  .chatbar input::placeholder { color: var(--ink-3); }
  .chatbar .send { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .chatbar .ckhint { font-size: 11px; }

  /* ============================================================
     OVERVIEW MODE — portfolio
     ============================================================ */
  .overview { min-height: 100vh; padding: 80px 0 120px; display: none; }
  .overview.shown { display: block; animation: rise .35s var(--ease); }
  .ov-wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  .ov-h {
    display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px;
  }
  .ov-h h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .ov-h p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }

  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 36px; }
  .metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .metric .v { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: -.02em; }
  .metric .k { font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .metric.flag .v { color: var(--violet); }

  .sec-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 14px; }

  /* companies — grows down */
  .co-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 38px; }
  .co-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); cursor: pointer; text-align: left;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .co-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--line-2); }
  .co-card.needs { border-color: #ddd6fe; }
  .co-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .co-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .st-dot { width: 8px; height: 8px; border-radius: 50%; }
  .st-active { background: var(--green); }
  .st-paused { background: var(--amber); }
  .co-thesis { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin: 0 0 14px; min-height: 36px; }
  .co-foot { display: flex; align-items: center; justify-content: space-between; }
  .co-stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); }
  .co-stats b { color: var(--ink); font-family: 'JetBrains Mono', monospace; }
  .needs-tag { font-size: 11.5px; font-weight: 700; color: var(--violet); background: #f3effd; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .needs-tag .d { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); animation: live 2s infinite; }
  .slice-chip { font-size: 11.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .slice-chip .bd { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: live 1.6s infinite; }
  .slice-chip.blocked .bd { background: var(--red); animation: none; }
  .slice-chip.todo .bd { background: var(--slate); animation: none; }

  /* opportunities — grows right (horizontal strip) */
  .opp-strip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 38px; scroll-snap-type: x mandatory; }
  .opp-strip::-webkit-scrollbar { height: 6px; }
  .opp-strip::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }
  .opp-card {
    flex: 0 0 240px; scroll-snap-align: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow);
  }
  .opp-card.killed { opacity: .5; }
  .opp-score { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .score-pill { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .score-hi { background: var(--green-soft); color: var(--green); }
  .score-mid { background: #fef3e2; color: var(--amber); }
  .score-lo { background: #f1f1f1; color: var(--ink-3); }
  .opp-card h4 { margin: 0 0 5px; font-size: 15px; font-weight: 700; }
  .opp-card .thesis { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin: 0 0 14px; min-height: 36px; }
  .opp-card .thought { font-size: 11.5px; color: var(--ink-3); font-style: italic; margin: 0 0 12px; }
  .promote { width: 100%; padding: 8px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; transition: background .15s var(--ease); }
  .promote:hover { background: #e4e4f8; }
  .promote.killed { background: #f3f3f3; color: var(--ink-3); cursor: default; }

  /* next moves */
  .moves { display: flex; flex-direction: column; gap: 10px; }
  .move { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--shadow); font-size: 13.5px; }
  .move .num { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }

  /* ============================================================
     LIVE ACTIVITY (collapsible) — fixed bottom-right
     ============================================================ */
  .activity {
    position: fixed; right: 18px; bottom: 18px; z-index: 95;
    width: 320px; background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden;
    transition: width .25s var(--ease);
  }
  .act-head {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer;
    user-select: none;
  }
  .act-head .ld { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 0 rgba(37,99,235,.5); animation: live 1.6s infinite; flex: none; }
  .act-head .cur { flex: 1; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-head .cur b { color: var(--ink); font-weight: 600; }
  .act-head .chev { color: var(--ink-3); transition: transform .25s var(--ease); flex: none; }
  .activity.open .act-head .chev { transform: rotate(180deg); }
  .act-body { max-height: 0; overflow: hidden; transition: max-height .3s var(--ease); }
  .activity.open .act-body { max-height: 440px; overflow-y: auto; border-top: 1px solid var(--line); }
  .act-group { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .act-group:last-child { border-bottom: none; }
  .act-co { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .act-item { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
  .act-item .id { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--ink-3); }
  .act-item .id.running { background: var(--blue); animation: live 1.5s infinite; }
  .act-item .id.await { background: var(--violet); }
  .act-item .id.blocked { background: var(--red); }
  .act-item .id.check { background: var(--green); }
  .act-item .t { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); flex: none; }

  /* ---------- animations ---------- */
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,.45); } 70% { box-shadow: 0 0 0 6px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideOutLeft { to { opacity: 0; transform: translateX(-40px); } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(46px); } to { opacity: 1; transform: translateX(0); } }
  @media (max-width: 720px) {
    .metrics { grid-template-columns: repeat(2,1fr); }
    .co-grid { grid-template-columns: 1fr; }
    .headline { font-size: 25px; }
  }
</style>
</head>
<body>

<!-- ===================== TOP BAR ===================== -->
<header class="topbar" id="topbar">
  <div class="brand"><span class="mark">C</span> C Slop Slop</div>
  <div class="right">
    <div class="seg">
      <button id="tabFocus" class="on" onclick="setMode('focus')">Focus</button>
      <button id="tabOverview" onclick="setMode('overview')">Portfolio</button>
    </div>
    <span class="kbd">⌘K</span>
  </div>
</header>

<!-- ===================== FOCUS MODE ===================== -->
<main class="focus" id="focus">
  <div class="progress-row">
    <div class="progress-pips" id="pips"></div>
    <span class="progress-label" id="progLabel"></span>
  </div>
  <div class="stage" id="stage"></div>
</main>

<!-- ===================== OVERVIEW MODE ===================== -->
<section class="overview" id="overview">
  <div class="ov-wrap">
    <div class="ov-h">
      <div>
        <h1>Portfolio</h1>
        <p>5 active bets · the engine ships the top slice across all of them, continuously.</p>
      </div>
      <button class="btn btn-ghost" onclick="setMode('focus')">Back to focus <span class="kbd" style="margin-left:6px">Esc</span></button>
    </div>

    <div class="metrics" id="metrics"></div>

    <p class="sec-h">Companies</p>
    <div class="co-grid" id="coGrid"></div>

    <p class="sec-h">Opportunities — scored thoughts, promote the best</p>
    <div class="opp-strip" id="oppStrip"></div>

    <p class="sec-h">Next moves</p>
    <div class="moves" id="moves"></div>
  </div>
</section>

<!-- ===================== CHAT SPINE ===================== -->
<div class="chatbar" id="chatbar">
  <span class="ck">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </span>
  <input id="chatInput" placeholder="Direct the engine —  e.g. “approve LeadSift slice 5”" />
  <span class="kbd ckhint">⏎</span>
  <button class="send" onclick="sendChat()" aria-label="send">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
  </button>
</div>

<!-- ===================== LIVE ACTIVITY ===================== -->
<div class="activity" id="activity">
  <div class="act-head" onclick="toggleActivity()">
    <span class="ld"></span>
    <span class="cur" id="actCur"></span>
    <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m18 15-6-6-6 6"/></svg></span>
  </div>
  <div class="act-body" id="actBody"></div>
</div>

<!-- ===================== BADGE + TOAST ===================== -->
<div class="badge"><span class="dot"></span> 21 · One Thing</div>
<div class="toast" id="toast"><span class="tk" id="toastIcon"></span><span id="toastText"></span></div>

<script>
/* ===================== DATA (verbatim from brief) ===================== */
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress — same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped — no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 — writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 — running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed — GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog — slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked — no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) — it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed — want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice — one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ===================== DECISION QUEUE ===================== */
const ls = DATA.companies.find(c => c.id === 'leadsift');
const rb = DATA.companies.find(c => c.id === 'redditpainbot');
const pr = DATA.opportunities.find(o => o.id === 'o1');

const decisions = [
  { type:'approval', co:ls },
  { type:'unblock',  co:rb },
  { type:'promote',  opp:pr },
];

let idx = 0;

/* ----- icons ----- */
const ICchk = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';
const ICarr = '<svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===================== RENDER PROGRESS ===================== */
function renderProgress() {
  const pips = document.getElementById('pips');
  const done = idx >= decisions.length;
  pips.innerHTML = decisions.map((_,i) =>
    `<span class="pip ${i<idx?'done':(i===idx&&!done?'cur':'')}"></span>`).join('');
  const lbl = document.getElementById('progLabel');
  lbl.innerHTML = done
    ? `<b>${decisions.length}</b> of ${decisions.length} · done`
    : `<b>${idx+1}</b> of ${decisions.length} · decisions for you`;
}

/* ===================== RENDER A DECISION ===================== */
function renderDecision(entering) {
  const stage = document.getElementById('stage');
  if (idx >= decisions.length) { renderAllClear(); renderProgress(); return; }
  const d = decisions[idx];
  let html = '';

  if (d.type === 'approval') {
    const a = d.co.approval;
    html = `
    <div class="eyebrow violet"><span class="pulse"></span> Needs you · Approval gate</div>
    <h1 class="headline">Ship LeadSift slice ${a.slice}?</h1>
    <p class="subline"><span class="co">${a.title}.</span> It’s live and the check is green. Review the diff, glance at the preview, then approve.</p>

    <div class="panel">
      <div class="panel-head">
        <span class="label">${ICfile} Diff · slice ${a.slice} · attempt ${a.attempt}</span>
        <span class="check-pass">${ICchk} doneWhen passed</span>
      </div>
      <div class="diff">${a.diff.split('\n').map(line=>{
        const add = line.startsWith('+');
        return `<div class="dl ${add?'add':'ctx'}"><span class="gut">${add?'+':' '}</span><span class="code">${esc(line.replace(/^[+ ]/,''))}</span></div>`;
      }).join('')}</div>
      <div class="donewhen" style="border-top:1px solid var(--line)">
        <span class="expr"><b>doneWhen</b> &nbsp;${esc(a.doneWhen)}</span>
        <span class="check-pass">${ICchk} ${a.checkResult}</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="label">Live preview</span>
        <a class="url-chip" href="${a.previewUrl}" target="_blank"><span class="live"></span>${a.previewUrl}</a>
      </div>
      <div class="preview-frame">
        <div class="browser">
          <div class="bar"><span class="tl"><i></i><i></i><i></i></span><span class="addr">${a.previewUrl}</span></div>
          <div class="body">
            <p class="mh">Top leads today</p>
            <div class="lead-row"><span>acme.io — “need a demo this week”</span><span class="sc">94</span></div>
            <div class="lead-row"><span>northwind.co — pricing question</span><span class="sc">88</span></div>
            <div class="lead-row"><span>globex.com — enterprise plan</span><span class="sc">81</span></div>
            <div class="lead-row"><span>initech — integration query</span><span class="sc">73</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-approve" onclick="approve()">${ICchk} Approve & ship</button>
      <button class="btn btn-ghost" onclick="toggleReject()">Reject with feedback</button>
      <button class="skip" onclick="advance()">Skip for now ${ICarr}</button>
    </div>
    <div class="reject-box" id="rejectBox">
      <textarea id="rejectText" placeholder="What’s wrong? The engine re-attempts with your feedback…"></textarea>
      <div class="rb-actions">
        <button class="btn btn-ghost" onclick="toggleReject()" style="padding:8px 14px;font-size:13px">Cancel</button>
        <button class="btn btn-primary" onclick="reject()" style="padding:8px 16px;font-size:13px">Send back</button>
      </div>
    </div>
    <p class="meta-line">Approving makes the slice live for all ${d.co.users} users. The engine then pulls the next top slice automatically.</p>`;
  }

  else if (d.type === 'unblock') {
    const s = d.co.currentSlice;
    html = `
    <div class="eyebrow red"><span class="pulse"></span> Needs you · Blocked</div>
    <h1 class="headline">RedditPainBot is stuck.</h1>
    <p class="subline"><span class="co">Slice ${s.n} — ${s.title}.</span> ${s.step}. The engine hit the same failure three times and paused itself instead of burning cycles.</p>

    <div class="panel">
      <div class="panel-head"><span class="label">Why it stopped</span><span style="font-size:12px;color:var(--red);font-weight:600">same failure ×3</span></div>
      <div style="padding:14px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.55">
        Near-identical pain posts can’t be de-duplicated reliably — the similarity threshold keeps collapsing distinct ideas. Decide a direction, or pause the company so the engine spends cycles elsewhere.
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="resolveUnblock('retry')">Give direction & retry</button>
      <button class="btn btn-ghost" onclick="resolveUnblock('pause')">Pause company</button>
      <button class="skip" onclick="advance()">Skip for now ${ICarr}</button>
    </div>
    <p class="meta-line">Paused companies keep their progress; the engine simply stops pulling their slices.</p>`;
  }

  else if (d.type === 'promote') {
    const o = d.opp;
    html = `
    <div class="eyebrow accent"><span class="pulse"></span> Needs you · New opportunity</div>
    <h1 class="headline">Promote “${o.title}” to a company?</h1>
    <p class="subline">From your thought: <span class="co">“${o.thought}.”</span> Scored ${o.score}/100 — your highest open candidate.</p>

    <div class="panel">
      <div class="panel-head">
        <span class="label">Thesis</span>
        <span class="score-pill score-hi mono">${o.score}</span>
      </div>
      <div style="padding:14px 16px;font-size:14px;color:var(--ink);line-height:1.55">${o.thesis}</div>
      <div class="donewhen" style="border-top:1px solid var(--line)">
        <span class="expr">First slice will be a <b>walking skeleton</b> — live + proven before anything else.</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="resolvePromote()">Promote to company ${ICarr}</button>
      <button class="btn btn-ghost" onclick="advance()">Keep as candidate</button>
      <button class="skip" onclick="advance()">Skip ${ICarr}</button>
    </div>
    <p class="meta-line">Promoting commits a build bet: the engine drafts slice 1 and starts shipping.</p>`;
  }

  stage.innerHTML = `<div class="decision ${entering?'entering':''}" id="decision">${html}</div>`;
  renderProgress();
}

const ICfile = '<span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>';

/* ===================== ALL CLEAR ===================== */
function renderAllClear() {
  const p = DATA.portfolio;
  document.getElementById('stage').innerHTML = `
    <div class="allclear" id="decision">
      <div class="ring"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>All clear.</h2>
      <p>No decisions waiting. The engine is heads-down shipping the next slice across your ${p.activeCompanies} companies. We’ll surface the next thing the moment it needs you.</p>
      <div class="stat-row">
        <div class="stat"><div class="v mono">$${p.mrr}</div><div class="k">MRR</div></div>
        <div class="stat"><div class="v mono">${p.users}</div><div class="k">Users</div></div>
        <div class="stat"><div class="v mono">${p.slicesShipped}</div><div class="k">Slices shipped</div></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-ghost" onclick="setMode('overview')">See the portfolio ${ICarr}</button>
      </div>
    </div>`;
}

/* ===================== TRANSITIONS / ACTIONS ===================== */
function advance() {
  const cur = document.getElementById('decision');
  if (cur && !cur.classList.contains('allclear')) {
    cur.classList.add('leaving');
    setTimeout(() => { idx++; renderDecision(true); }, 300);
  } else { idx++; renderDecision(true); }
}

function approve() {
  ls.approval && (ls.slices.find(s=>s.n===5).status = 'shipped');
  toast('Approved ✓ — slice 5 is live', 'green');
  setTimeout(advance, 520);
}
let rejectOpen = false;
function toggleReject() {
  rejectOpen = !rejectOpen;
  document.getElementById('rejectBox').classList.toggle('open', rejectOpen);
  if (rejectOpen) setTimeout(()=>document.getElementById('rejectText').focus(), 60);
}
function reject() {
  const fb = (document.getElementById('rejectText').value || '').trim();
  toast(fb ? 'Sent back with feedback ✓' : 'Sent back ✓ — engine re-attempts', 'accent');
  toggleReject();
  setTimeout(advance, 520);
}
function resolveUnblock(kind) {
  toast(kind==='pause' ? 'RedditPainBot paused ✓' : 'Direction sent — retrying ✓', 'accent');
  setTimeout(advance, 520);
}
function resolvePromote() {
  pr.status = 'company';
  toast('PayoutReconciler promoted ✓', 'green');
  setTimeout(advance, 520);
}

/* ===================== TOAST ===================== */
let toastTimer;
function toast(text, tone) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastIcon').innerHTML = ICchk;
  t.className = 'toast show' + (tone==='accent' ? ' accent' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ===================== MODE SWITCH ===================== */
let mode = 'focus';
function setMode(m) {
  mode = m;
  const focus = document.getElementById('focus');
  const ov = document.getElementById('overview');
  const cb = document.getElementById('chatbar');
  document.getElementById('tabFocus').classList.toggle('on', m==='focus');
  document.getElementById('tabOverview').classList.toggle('on', m==='overview');
  if (m === 'overview') {
    focus.classList.add('hidden'); ov.classList.add('shown');
    cb.style.bottom = '18px'; cb.style.position='fixed';
  } else {
    focus.classList.remove('hidden'); ov.classList.remove('shown');
    cb.style.bottom = '80px';
    window.scrollTo({ top:0, behavior:'instant' });
  }
}

/* zoom from overview company card -> focus (LeadSift goes to approval) */
function zoomCompany(id) {
  if (id === 'leadsift') {
    idx = 0;
    renderDecision(true);
  }
  setMode('focus');
}

/* ===================== OVERVIEW RENDER ===================== */
function scoreClass(s){ return s>=70?'score-hi':s>=50?'score-mid':'score-lo'; }

function renderOverview() {
  const p = DATA.portfolio;
  document.getElementById('metrics').innerHTML = [
    {v:'$'+p.mrr, k:'MRR'}, {v:p.users, k:'Users'}, {v:p.activeCompanies, k:'Active companies'},
    {v:p.slicesShipped, k:'Slices shipped'}, {v:p.needsYou, k:'Needs you', flag:true},
  ].map(m=>`<div class="metric ${m.flag?'flag':''}"><div class="v">${m.v}</div><div class="k">${m.k}</div></div>`).join('');

  document.getElementById('coGrid').innerHTML = DATA.companies.map(c=>{
    const stDot = c.status==='active'?'st-active':'st-paused';
    let badge = '';
    if (c.needsYou) badge = `<span class="needs-tag"><span class="d"></span>Needs you</span>`;
    else if (c.currentSlice) {
      const cs = c.currentSlice;
      const cls = cs.status==='blocked'?'blocked':cs.status==='todo'?'todo':'';
      const word = cs.status==='building'?'building':cs.status==='blocked'?'blocked':'queued';
      badge = `<span class="slice-chip ${cls}"><span class="bd"></span>slice ${cs.n} · ${word}</span>`;
    }
    return `<button class="co-card ${c.needsYou?'needs':''}" onclick="zoomCompany('${c.id}')">
      <div class="co-top">
        <span class="co-name"><span class="st-dot ${stDot}"></span>${c.name}</span>
        ${badge}
      </div>
      <p class="co-thesis">${c.thesis}</p>
      <div class="co-foot">
        <div class="co-stats"><span>$<b>${c.mrr}</b> mrr</span><span><b>${c.users}</b> users</span></div>
        <span class="kbd">${c.domain || 'no domain'}</span>
      </div>
    </button>`;
  }).join('');

  document.getElementById('oppStrip').innerHTML = DATA.opportunities.map(o=>{
    const killed = o.status==='killed';
    return `<div class="opp-card ${killed?'killed':''}">
      <div class="opp-score">
        <span class="score-pill ${scoreClass(o.score)} mono">${o.score}</span>
        <span class="kbd">${killed?'killed':'candidate'}</span>
      </div>
      <h4>${o.title}</h4>
      <p class="thesis">${o.thesis}</p>
      <p class="thought">“${o.thought}”</p>
      <button class="promote ${killed?'killed':''}" ${killed?'':`onclick="promoteFromOverview('${o.id}','${o.title}')"`}>${killed?'Killed':'Promote →'}</button>
    </div>`;
  }).join('');

  document.getElementById('moves').innerHTML = DATA.nextMoves.map((m,i)=>
    `<div class="move"><span class="num">${i+1}</span><span>${m}</span></div>`).join('');
}
function promoteFromOverview(id, title) { toast(title+' promoted ✓','green'); }

/* ===================== ACTIVITY ===================== */
let actOpen = false;
function toggleActivity() {
  actOpen = !actOpen;
  document.getElementById('activity').classList.toggle('open', actOpen);
}
function renderActivity() {
  const latest = DATA.activity.find(a=>a.running) || DATA.activity[0];
  document.getElementById('actCur').innerHTML = `<b>${latest.co}</b> — ${latest.text.replace(/^building slice \d+ — /,'')}`;

  const groups = {};
  DATA.activity.forEach(a => { (groups[a.co] = groups[a.co] || []).push(a); });
  document.getElementById('actBody').innerHTML = Object.entries(groups).map(([co, items]) =>
    `<div class="act-group"><div class="act-co">${co}</div>${
      items.map(it=>{
        let cls = it.running?'running':it.kind==='await'?'await':it.kind==='blocked'?'blocked':it.kind==='check'?'check':'';
        return `<div class="act-item"><span class="id ${cls}"></span><span>${it.text}</span><span class="t">${it.t}</span></div>`;
      }).join('')
    }</div>`).join('');
}

/* ===================== CHAT ===================== */
function sendChat() {
  const inp = document.getElementById('chatInput');
  const v = (inp.value||'').trim();
  if (!v) return;
  const low = v.toLowerCase();
  if (low.includes('approve') && low.includes('leadsift')) {
    if (mode!=='focus') setMode('focus');
    if (idx===0 && decisions[0].type==='approval') { approve(); }
    else toast('LeadSift slice 5 approved ✓','green');
  } else if (low.includes('overview') || low.includes('portfolio')) {
    setMode('overview'); toast('Opened portfolio','accent');
  } else {
    toast('Sent to the engine ✓','accent');
  }
  inp.value = '';
}

/* ===================== KEYBOARD ===================== */
document.addEventListener('keydown', e => {
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if (e.key === 'Enter' && document.activeElement.id === 'chatInput') { sendChat(); return; }
  if (typing && e.key !== 'Escape') return;
  if (e.key === 'Escape') {
    if (rejectOpen) { toggleReject(); return; }
    if (mode === 'overview') { setMode('focus'); return; }
    document.activeElement.blur();
  }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); document.getElementById('chatInput').focus(); }
  if (mode === 'focus' && idx < decisions.length) {
    const d = decisions[idx];
    if (e.key === 'Enter' && d.type==='approval' && !rejectOpen) { approve(); }
    if ((e.key === 'n' || e.key === 'ArrowRight')) advance();
  }
});

/* topbar shadow on scroll */
addEventListener('scroll', () => {
  document.getElementById('topbar').classList.toggle('scrolled', scrollY > 8);
});

/* ===================== INIT ===================== */
renderDecision(true);
renderOverview();
renderActivity();
</script>
</body>
