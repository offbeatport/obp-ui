<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Portfolio · Split Spotlight</title>
<script>try{if(localStorage.getItem('cslopslop-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8;
    --ink:#2c2926; --ink-soft:#635c52; --ink-faint:#7b7368;
    --line:#e6ddce; --line-soft:#efe8da;
    --accent:#c8643c; --accent-soft:#f4e0d6;
    --green:#4f8a52; --green-soft:#e3efe1;
    --blue:#4a72b0; --blue-soft:#e2eaf5;
    --violet:#7a5ea8; --violet-soft:#ece6f5;
    --amber:#c08a2e; --amber-soft:#f6ecd4;
    --red:#b6483f; --red-soft:#f6e0dd;
    --slate:#8a8579; --slate-soft:#ece8df;
    --on-accent:#fffdf8;
  }
  :root[data-theme="dark"]{
    --cream:#05060a; --cream-2:#080d18; --paper:#10131f;
    --ink:#e6ebf5; --ink-soft:#aab4c8; --ink-faint:#7c8499;
    --line:#1c2233; --line-soft:#111726;
    --accent:#e0794e; --accent-soft:rgba(224,121,78,.18);
    --green:#34d399; --green-soft:rgba(52,211,153,.15);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,.15);
    --violet:#a78bfa; --violet-soft:rgba(167,139,250,.16);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.15);
    --red:#f87171; --red-soft:rgba(248,113,113,.15);
    --slate:#8a93a8; --slate-soft:rgba(120,140,200,.12);
    --on-accent:#0a0e18;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.005em;
    overflow: hidden;
  }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--cream); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-rows: 58px 1fr; height: 100vh; }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 26px; border-bottom: 1px solid var(--line);
    background: var(--cream);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: var(--on-accent);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .brand-tag { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .14em; color: var(--ink-faint); border-left: 1px solid var(--line); padding-left: 13px; }
  .spacer { flex: 1; }

  .need-chip {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--ink-soft);
    padding: 6px 12px 6px 10px; border-radius: 999px; border: 1px solid var(--line);
    transition: border-color .15s, color .15s, background .15s;
  }
  .need-chip:hover { border-color: var(--accent-soft); color: var(--ink); }
  .need-chip .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-soft); animation: pulse 2.4s infinite; }
  .need-chip b { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 500; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 var(--accent-soft);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }

  .cap { display: flex; align-items: center; gap: 9px; }
  .cap-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--ink-faint); }
  .cap-bar { width: 62px; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .cap-fill { height: 100%; width: 43%; background: var(--accent); border-radius: 3px; }
  .cap-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .cap-num i { color: var(--ink-faint); font-style: normal; }

  .theme-toggle {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex: 0 0 auto;
    background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft);
    display: grid; place-items: center; transition: color .15s, border-color .15s, transform .3s;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent-soft); }
  .theme-toggle:active { transform: scale(.92); }
  .theme-toggle svg { width: 17px; height: 17px; }
  .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: block; }

  /* ---------- split ---------- */
  .split { display: grid; grid-template-columns: 432px minmax(0,1fr); min-height: 0; }

  /* ===== LEFT ===== */
  .left { border-right: 1px solid var(--line); overflow-y: auto; padding: 26px 26px 44px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .16em; color: var(--ink-faint); }

  .mrr-row { display: flex; align-items: baseline; gap: 12px; margin-top: 8px; }
  .mrr { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -.025em; line-height: 1; }
  .mrr .cur { font-size: 22px; color: var(--ink-faint); margin-right: 1px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500; color: var(--green); background: var(--green-soft);
    padding: 3px 8px; border-radius: 999px; }
  .delta svg { width: 11px; height: 11px; }

  .pmetrics { display: grid; grid-template-columns: 1fr 1fr; margin-top: 22px; border-top: 1px solid var(--line-soft); }
  .pm { padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
  .pm:nth-child(even) { padding-left: 18px; border-left: 1px solid var(--line-soft); }
  .pm:nth-child(odd) { padding-right: 18px; }
  .pm-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--ink); }
  .pm-val small { font-size: 12px; color: var(--ink-faint); }
  .pm-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .sec-label { display: flex; align-items: baseline; gap: 9px; margin: 30px 0 6px; }
  .sec-label h2 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em; margin: 0; color: var(--ink-soft); }
  .sec-label span { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); }

  /* company rows */
  .clist { margin: 0 -10px; }
  .crow {
    position: relative; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 13px 12px 13px 16px; border-radius: 11px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    transition: background .16s, transform .16s;
  }
  .crow:last-child { border-bottom: 0; }
  .crow::before { content: ""; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 3px; background: var(--rc); opacity: 0; transition: opacity .18s, height .18s; }
  .crow:hover { background: var(--cream-2); }
  .crow:hover::before { opacity: .35; }
  .crow.active { background: var(--rc-soft); }
  .crow.active::before { opacity: 1; height: 60%; }
  .crow-main { min-width: 0; }
  .crow-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; }
  .crow-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rc); flex: 0 0 auto; }
  .crow.active .crow-name { color: var(--rc); }
  [data-theme="dark"] .crow.active .crow-name { color: var(--ink); }
  .crow-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .crow-mrr { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .crow-mrr.zero { color: var(--ink-faint); }
  .flag { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em;
    padding: 2px 7px; border-radius: 999px; font-weight: 500; }
  .flag.need { background: var(--rc-soft); color: var(--rc); }
  .flag.build { color: var(--ink-faint); display: inline-flex; align-items: center; gap: 5px; }
  .flag.build .live { width: 6px; height: 6px; border-radius: 50%; background: var(--rc); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.28;} }
  .flag.paused { color: var(--ink-faint); }

  /* ===== RIGHT · spotlight ===== */
  .right { overflow-y: auto; padding: 34px 46px 60px; }
  .spot { max-width: 720px; }
  .spot.swap { animation: swap .34s cubic-bezier(.22,.8,.28,1); }
  @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .sp-head { display: flex; align-items: flex-start; gap: 16px; }
  .sp-mark { width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
    background: var(--c-soft); color: var(--c); display: grid; place-items: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; }
  .sp-titles { flex: 1; min-width: 0; }
  .sp-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -.02em;
    margin: 0; display: flex; align-items: center; gap: 12px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
    color: var(--c); background: var(--c-soft); padding: 3px 10px; border-radius: 999px; }
  .status .d { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .status.live .d { animation: blink 1.8s infinite; }
  .sp-tagline { color: var(--ink-soft); font-size: 14px; margin-top: 5px; }

  .sp-metrics { display: flex; gap: 40px; margin: 26px 0 4px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
  .met-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: .14em; color: var(--ink-faint); }
  .met-val { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -.02em; margin-top: 5px; }
  .met-val .cur { font-size: 16px; color: var(--ink-faint); }
  .met-val .up { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--green); margin-left: 7px; font-weight: 500; }
  .spark { margin-left: auto; align-self: flex-end; }
  .spark svg { display: block; }
  .spark .no { font-size: 12px; color: var(--ink-faint); padding-bottom: 6px; }

  .sp-body { margin-top: 30px; }
  .body-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: .14em; color: var(--ink-faint); margin-bottom: 12px; }

  /* decision */
  .decide-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .decide-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
    color: var(--c); background: var(--c-soft); padding: 5px 12px; border-radius: 999px; }
  .decide-tag .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c); animation: blink 2s infinite; }
  .decide-check { font-size: 12.5px; color: var(--green); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .decide-check svg { width: 13px; height: 13px; }
  .decide-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 21px; letter-spacing: -.02em; margin: 4px 0 6px; }
  .decide-desc { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; max-width: 56ch; }

  .preview { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--paper); }
  .pv-head { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line-soft); }
  .pv-app { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: var(--c); }
  .pv-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
  .pv-time { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); }
  .pv-title { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .pv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .pv-list li { position: relative; padding-left: 16px; font-size: 13.5px; color: var(--ink-soft); }
  .pv-list li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
  .pv-list li b { color: var(--ink); font-weight: 600; }
  .pv-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft);
    font-size: 11.5px; color: var(--ink-faint); }

  .donewhen { margin-top: 18px; padding-left: 16px; border-left: 2px solid var(--green-soft); }
  .dw-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-faint); }
  .donewhen ul { list-style: none; margin: 7px 0 0; padding: 0; display: grid; gap: 6px; }
  .donewhen li { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
  .donewhen li svg { width: 13px; height: 13px; color: var(--green); flex: 0 0 auto; }

  /* info blocks (building / flat / blocked) */
  .info { margin-top: 4px; }
  .prog { margin-top: 16px; }
  .prog-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .prog-file { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); }
  .prog-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--c); }
  .prog-bar { height: 6px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 4px; background: var(--c); width: 0; transition: width 1s cubic-bezier(.3,.8,.3,1); }
  .loglines { margin-top: 18px; display: grid; gap: 7px; }
  .logline { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); display: flex; gap: 10px; }
  .logline .t { color: var(--ink-faint); flex: 0 0 46px; }
  .logline .ok { color: var(--green); }

  .callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--c-soft);
    border: 1px solid transparent; margin-top: 4px; }
  .callout svg { width: 18px; height: 18px; color: var(--c); flex: 0 0 auto; margin-top: 1px; }
  .callout .ct-title { font-weight: 600; font-size: 14px; }
  .callout .ct-desc { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  /* actions */
  .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .btn { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; padding: 11px 18px;
    border-radius: 11px; cursor: pointer; border: 1px solid transparent; transition: transform .12s, background .15s, border-color .15s, color .15s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--c); color: var(--on-accent); }
  .btn.primary:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
  .btn.ghost:hover { border-color: var(--c); color: var(--ink); }
  .btn.link { background: transparent; color: var(--ink-faint); padding: 11px 10px; }
  .btn.link:hover { color: var(--c); }

  /* resolved flash */
  .resolved { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 15px 18px;
    border-radius: 13px; background: var(--green-soft); animation: swap .3s ease; }
  .resolved.warn { background: var(--amber-soft); }
  .resolved .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--green); color: var(--on-accent); flex: 0 0 auto; }
  .resolved.warn .ic { background: var(--amber); }
  .resolved svg { width: 18px; height: 18px; }
  .resolved .r-title { font-weight: 600; font-size: 14.5px; }
  .resolved .r-desc { font-size: 13px; color: var(--ink-soft); margin-top: 1px; }

  /* activity */
  .sp-activity { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line); }
  .act-list { margin-top: 14px; display: grid; gap: 0; }
  .act { display: grid; grid-template-columns: 15px 1fr auto; gap: 12px; align-items: baseline; padding: 9px 0; }
  .act .rail { position: relative; align-self: stretch; }
  .act .rail::before { content: ""; position: absolute; left: 5px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--dot, var(--ink-faint)); }
  .act .rail::after { content: ""; position: absolute; left: 7px; top: 14px; bottom: -9px; width: 1px; background: var(--line-soft); }
  .act:last-child .rail::after { display: none; }
  .act-text { font-size: 13.5px; color: var(--ink-soft); }
  .act-text b { color: var(--ink); font-weight: 600; }
  .act-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
</style>
</head>
<body>
<div class="shell">

  <!-- topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">C</div>
      <div class="wordmark">C Slop Slop</div>
      <span class="brand-tag">Portfolio</span>
    </div>
    <div class="spacer"></div>
    <button class="need-chip" id="needChip">
      <span class="pulse"></span><b>3</b>&nbsp;need you
    </button>
    <div class="cap">
      <span class="cap-label">SPEND</span>
      <div class="cap-bar"><div class="cap-fill"></div></div>
      <span class="cap-num">$214<i>/$500</i></span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="split">
    <!-- LEFT -->
    <aside class="left">
      <div class="eyebrow">Monthly recurring revenue</div>
      <div class="mrr-row">
        <div class="mrr"><span class="cur">$</span>695</div>
        <span class="delta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
          14% MoM
        </span>
      </div>

      <div class="pmetrics">
        <div class="pm"><div class="pm-val">56 <small>users</small></div><div class="pm-sub">+8 this week</div></div>
        <div class="pm"><div class="pm-val" style="color:var(--green)">+$481<small style="color:var(--ink-faint)"> /mo</small></div><div class="pm-sub">net contribution</div></div>
        <div class="pm"><div class="pm-val">22 <small>shipped</small></div><div class="pm-sub">across portfolio</div></div>
        <div class="pm"><div class="pm-val">5 <small>companies</small></div><div class="pm-sub">4 active · 1 paused</div></div>
      </div>

      <div class="sec-label"><h2>Companies</h2><span>5 · sorted by attention</span></div>
      <div class="clist" id="clist"></div>
    </aside>

    <!-- RIGHT -->
    <section class="right">
      <div class="spot" id="spot"></div>
    </section>
  </div>
</div>

<script>
(function(){
  var root = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', function(){
    var dark = root.getAttribute('data-theme') === 'dark';
    if(dark){ root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme','dark'); }
    try{ localStorage.setItem('cslopslop-theme', dark ? 'light' : 'dark'); }catch(e){}
  });

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  // ---- data model ----
  var companies = [
    {
      id:'leadsift', name:'LeadSift', mark:'L', color:'--accent', soft:'--accent-soft',
      status:'Live · growing', statusCls:'live', mrr:180, mrrStr:'$180', up:'+$40', users:12,
      tagline:'Lead scoring for outbound teams. Compounding week over week.',
      spark:[120,132,128,141,150,147,162,170,180],

      tagline:'Reformats messy invoices into clean, exportable bills.',
      spark:null,
      flag:{cls:'build', label:'Building'}, sub:'building "invoice reformat"',
      needs:false, type:'building',
      activity:[
        {tone:'violet', t:'now', html:'Writing <b>InvoiceFormatter.tsx</b> · live'},
        {tone:'blue', t:'24m', html:'Scaffolded project · <b>Next + Nitro</b>'},
        {tone:'green', t:'1h', html:'Spec approved · <b>slice 1 of 6</b>'},

      ],
      body:function(){ return ''
        + '<div class="body-eyebrow">Needs your call · blocked</div>'

        + '<div class="callout" style="background:var(--red-soft)">'
        +   '<svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9l-8 13.9A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.2l-8-13.9a2 2 0 0 0-3.4 0z"/></svg>'

        + '</div>'
        + '<div class="actions">'

        +   '<button class="btn link">Archive company</button>'
        + '</div>';
      }
    }
  ];

  var TONES = {accent:'--accent', green:'--green', blue:'--blue', violet:'--violet', amber:'--amber', red:'--red', slate:'--slate'};

  // ---- spark builder ----
  function sparkSVG(data, colorVar){
    if(!data){ return '<div class="no">pre-revenue</div>'; }
    var W=118, H=38, pad=3;
    var min=Math.min.apply(null,data), max=Math.max.apply(null,data), span=(max-min)||1;
    var pts=data.map(function(v,i){
      var x=pad+(i/(data.length-1))*(W-pad*2);
      var y=(H-pad)-((v-min)/span)*(H-pad*2);
      return [x,y];
    });
    var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++){
      var mx=(pts[i-1][0]+pts[i][0])/2;
      var my=(pts[i-1][1]+pts[i][1])/2;
      d+=' Q'+pts[i-1][0].toFixed(1)+','+pts[i-1][1].toFixed(1)+' '+mx.toFixed(1)+','+my.toFixed(1);
    }
    d+=' L'+pts[pts.length-1][0].toFixed(1)+','+pts[pts.length-1][1].toFixed(1);
    var last=pts[pts.length-1];
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
      + '<path d="'+d+'" fill="none" stroke="var('+colorVar+')" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="'+(colorVar==='--green'&&max-min<6?'.5':'.9')+'"/>'
      + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="var('+colorVar+')"/>'
      + '</svg>';
  }

  // ---- left list ----
  var clist = document.getElementById('clist');
  function renderList(){
    clist.innerHTML = companies.map(function(c,i){
      var right;
      if(c.needs && !c.resolved){ right='<span class="flag need">'+c.flag.label+'</span>'; }
      else if(c.resolved){ right='<span class="flag paused">done ✓</span>'; }
      else if(c.type==='building'){ right='<span class="flag build"><span class="live"></span>live</span>'; }
      else { right='<span class="flag paused">'+c.flag.label+'</span>'; }
      return '<div class="crow'+(i===active?' active':'')+'" data-i="'+i+'" style="--rc:var('+c.color+');--rc-soft:var('+c.soft+')">'
        + '<div class="crow-main">'
        +   '<div class="crow-name"><span class="dot"></span>'+c.name+'</div>'
        +   '<div class="crow-sub">'+c.status+' · '+(c.resolved? 'resolved' : c.sub)+'</div>'
        + '</div>'
        + '<div class="crow-right">'
        +   '<span class="crow-mrr'+(c.mrr===0?' zero':'')+'">'+c.mrrStr+(c.up&&c.up!=='best'?' <span style="color:var(--green)">'+c.up+'</span>':'')+'</span>'
        +   right
        + '</div>'
        + '</div>';
    }).join('');
    Array.prototype.forEach.call(clist.querySelectorAll('.crow'), function(el){
      el.addEventListener('click', function(){ select(+el.getAttribute('data-i')); });
    });
  }

  // ---- spotlight ----
  var spot = document.getElementById('spot');
  var active = 0;
  function renderSpot(){
    var c = companies[active];
    spot.style.setProperty('--c', 'var('+c.color+')');
    spot.style.setProperty('--c-soft', 'var('+c.soft+')');
    var metricThird = c.spark
      ? '<div class="spark">'+sparkSVG(c.spark, c.color)+'</div>'
      : '<div class="spark"><div class="no">pre-revenue</div></div>';
    var usersVal = c.users>0 ? c.users : '&mdash;';
    var mrrMet = '<div class="met-val"><span class="cur">$</span>'+(c.mrr)+(c.up&&c.up!=='best'?'<span class="up">'+c.up+'</span>':(c.up==='best'?'<span class="up">top MRR</span>':''))+'</div>';
    var bodyHTML = c.resolved ? c.resolvedHTML : c.body();
    spot.innerHTML = ''
      + '<div class="sp-head">'
      +   '<div class="sp-mark">'+c.mark+'</div>'
      +   '<div class="sp-titles">'
      +     '<h1 class="sp-name">'+c.name+'<span class="status '+c.statusCls+'"><span class="d"></span>'+c.status+'</span></h1>'
      +     '<div class="sp-tagline">'+c.tagline+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="sp-metrics">'
      +   '<div><div class="met-label">MRR</div>'+mrrMet+'</div>'
      +   '<div><div class="met-label">Users</div><div class="met-val">'+usersVal+'</div></div>'
      +   metricThird
      + '</div>'
      + '<div class="sp-body">'+bodyHTML+'</div>'
      + '<div class="sp-activity">'
      +   '<div class="body-eyebrow">Recent activity</div>'
      +   '<div class="act-list">'
      +     c.activity.map(function(a){
              return '<div class="act" style="--dot:var('+TONES[a.tone]+')">'
                + '<div class="rail"></div>'
                + '<div class="act-text">'+a.html+'</div>'
                + '<div class="act-time">'+a.t+'</div>'
                + '</div>';
            }).join('')
      +   '</div>'
      + '</div>';
    spot.classList.remove('swap'); void spot.offsetWidth; spot.classList.add('swap');
    // animate progress bars
    setTimeout(function(){
      Array.prototype.forEach.call(spot.querySelectorAll('.prog-fill'), function(el){
        el.style.width = (el.getAttribute('data-w')||'0')+'%';
      });
    }, 60);
    // wire action buttons
    Array.prototype.forEach.call(spot.querySelectorAll('.btn[data-act]'), function(btn){
      btn.addEventListener('click', function(){ resolve(c, btn); });
    });
  }

  function resolve(c, btn){
    var warn = btn.getAttribute('data-warn')==='1';
    var wasNeed = c.needs && !c.resolved;
    c.resolved = true;
    c.resolvedHTML = ''
      + '<div class="resolved'+(warn?' warn':'')+'">'
      +   '<div class="ic">'+CHECK+'</div>'
      +   '<div><div class="r-title">'+btn.getAttribute('data-act')+'</div>'
      +   '<div class="r-desc">'+btn.getAttribute('data-desc')+'</div></div>'
      + '</div>';
    if(wasNeed && c.needs){ needCount = Math.max(0, needCount-1); updateNeed(); }
    renderSpot();
    renderList();
  }

  var needCount = 3;
  var needChip = document.getElementById('needChip');
  function updateNeed(){
    if(needCount<=0){
      needChip.innerHTML = '<span class="pulse" style="background:var(--green);box-shadow:none;animation:none"></span>all clear';
      needChip.style.color = 'var(--green)';
    } else {
      needChip.innerHTML = '<span class="pulse"></span><b>'+needCount+'</b>&nbsp;need you';
    }
  }
  needChip.addEventListener('click', function(){
    for(var i=0;i<companies.length;i++){ if(companies[i].needs && !companies[i].resolved){ select(i); return; } }
  });

  function select(i){
    active = i;
    renderList();
    renderSpot();
    document.querySelector('.right').scrollTop = 0;
  }

  // keyboard nav
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); select((active+1)%companies.length); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); select((active-1+companies.length)%companies.length); }
  });

  renderList();
  renderSpot();
})();
</script>
