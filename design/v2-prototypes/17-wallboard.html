<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop - Wallboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;
    --panel:#121419;
    --panel-2:#171a21;
    --line:#23262f;
    --line-soft:#1b1e25;
    --txt:#f2f4f8;
    --txt-2:#9aa1b1;
    --txt-3:#5e6575;
    --accent:#5b8cff;          /* the ONE neutral accent */
    --green:#1fd17a;
    --green-dim:#0e3a26;
    --amber:#f5b13d;
    --amber-dim:#3a2c0c;
    --red:#ff5b66;
    --red-dim:#3a1418;
    --violet:#a78bfa;
    --blue:#5b8cff;
    --slate:#6b7385;
    --radius:18px;
    --radius-sm:11px;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(91,140,255,.07), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:Inter,system-ui,-apple-system,sans-serif;
    font-feature-settings:"cv05","ss01";
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:rgba(91,140,255,.35)}

  /* ---------- shell ---------- */
  .app{height:100vh;display:flex;flex-direction:column}

  /* ---------- portfolio header strip ---------- */
  .topbar{
    display:flex;align-items:center;gap:28px;
    padding:18px 30px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0f1116,#0a0b0d);
    flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,209,122,.12)}
  .brand b{font-weight:800;letter-spacing:-.02em;font-size:16px}
  .brand span{color:var(--txt-3);font-size:12px;font-weight:600}

  .totals{display:flex;gap:34px;margin-left:8px}
  .stat{display:flex;flex-direction:column;gap:1px}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .stat .k{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  .stat .v.accent{color:#fff}
  .stat .v.green{color:var(--green)}

  .topbar .spacer{flex:1}
  .needsbar{
    display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;
    background:var(--violet);color:#1a1330;font-weight:800;font-size:13px;cursor:pointer;
    box-shadow:0 0 0 0 rgba(167,139,250,.5);animation:needPulse 2.2s var(--ease) infinite;
  }
  @keyframes needPulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.5)}70%{box-shadow:0 0 0 12px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
  .needsbar .pip{width:8px;height:8px;border-radius:50%;background:#1a1330}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--txt-2);transition:.15s var(--ease)}
  .seg button.on{background:var(--panel-2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}

  .kbd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--txt-3);border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#0d0f13}

  /* ---------- main / wall ---------- */
  .main{flex:1;position:relative;overflow:hidden}
  .wallscroll{position:absolute;inset:0;overflow:auto;padding:26px 30px 130px}
  .wallscroll::-webkit-scrollbar{width:10px;height:10px}
  .wallscroll::-webkit-scrollbar-thumb{background:#23262f;border-radius:10px;border:2px solid var(--bg)}

  .wallhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .wallhead h1{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-2);margin:0}
  .wallhead .live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt-3);font-weight:600}
  .wallhead .live .blip{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .wallhead .rotate{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--txt-3);font-weight:600;cursor:pointer;user-select:none}
  .wallhead .rotate .sw{width:34px;height:18px;border-radius:999px;background:#23262f;position:relative;transition:.18s}
  .wallhead .rotate .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#6b7385;transition:.18s var(--ease)}
  .wallhead .rotate.on .sw{background:rgba(91,140,255,.35)}
  .wallhead .rotate.on .sw::after{left:18px;background:var(--accent)}

  /* tile grid - wraps + grows down */
  .wall{
    display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    align-content:start;
  }

  .tile{
    position:relative;border-radius:var(--radius);padding:22px 22px 20px;
    background:var(--panel);border:1px solid var(--line);overflow:hidden;
    cursor:pointer;transition:transform .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease);
    min-height:188px;display:flex;flex-direction:column;
  }
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* color-fill signal: a saturated wash from the left edge */
  .tile .fill{position:absolute;inset:0;opacity:.13;pointer-events:none;
    background:radial-gradient(120% 120% at 0% 0%, currentColor, transparent 55%)}
  .tile .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:currentColor}
  .tile.s-active{color:var(--green)}
  .tile.s-paused{color:var(--amber)}
  .tile.s-blocked{color:var(--red)}
  .tile.s-archived{color:var(--slate)}

  .tile.needs{border-color:rgba(167,139,250,.55);animation:tileNeed 2.4s var(--ease) infinite}
  @keyframes tileNeed{0%{box-shadow:0 0 0 0 rgba(167,139,250,.45)}70%{box-shadow:0 0 0 14px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}

  .tile .row1{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1}
  .tile .nm{font-size:19px;font-weight:800;letter-spacing:-.025em}
  .tile .badge{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    padding:4px 9px;border-radius:999px;color:currentColor;background:rgba(255,255,255,.04);border:1px solid currentColor}
  .tile .badge .d{width:7px;height:7px;border-radius:50%;background:currentColor}
  .tile.s-active .badge .d{animation:none}

  .tile .needtag{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;
    color:#1a1330;background:var(--violet);padding:4px 10px;border-radius:999px}
  .tile .needtag .d{width:7px;height:7px;border-radius:50%;background:#1a1330;animation:blink 1.1s infinite}

  .tile .metric{position:relative;z-index:1;margin:16px 0 2px;display:flex;align-items:baseline;gap:8px}
  .tile .metric .big{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:.95}
  .tile .metric .cur{color:var(--txt-3);font-size:12px;font-weight:700}
  .tile .sub{position:relative;z-index:1;color:var(--txt-2);font-size:12.5px;font-weight:600;margin-top:2px}

  .tile .slice{position:relative;z-index:1;margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt-2);font-weight:600}
  .tile .slice .sd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .tile .slice .sd.building{background:var(--blue);animation:blip 1.1s infinite}
  @keyframes blip{0%{box-shadow:0 0 0 0 rgba(91,140,255,.6)}70%{box-shadow:0 0 0 7px rgba(91,140,255,0)}100%{box-shadow:0 0 0 0 rgba(91,140,255,0)}}
  .tile .slice .sd.todo{background:var(--slate)}
  .tile .slice .sd.blocked{background:var(--red)}
  .tile .slice .sd.await{background:var(--violet);animation:blink 1.1s infinite}
  .tile .slice .stxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .ship{position:relative;z-index:1;margin-top:9px;font-size:11px;color:var(--txt-3);font-weight:600;font-family:"JetBrains Mono",monospace}

  /* opportunities tail tile */
  .opptile{
    border-radius:var(--radius);border:1px dashed var(--line);background:#0e1014;padding:18px;min-height:188px;
    display:flex;flex-direction:column;
  }
  .opptile h3{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
  .opp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .opp:last-child{border-bottom:none}
  .opp .score{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;width:34px;text-align:right}
  .opp .nm2{font-weight:700;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opp.killed{opacity:.42}
  .opp.killed .nm2{text-decoration:line-through}
  .opp .promote{font-size:11px;font-weight:800;color:var(--accent);border:1px solid rgba(91,140,255,.3);padding:4px 9px;border-radius:7px;opacity:0;transition:.15s}
  .opp:hover .promote{opacity:1}
  .opp .promote:hover{background:rgba(91,140,255,.12)}
  .scorebar{height:3px;border-radius:3px;background:#23262f;margin-top:3px;overflow:hidden}
  .scorebar i{display:block;height:100%;border-radius:3px;background:var(--accent)}

  /* ---------- command bar (overview) ---------- */
  .cmdwrap{position:absolute;left:0;right:0;bottom:0;padding:0 30px 22px;pointer-events:none;z-index:30}
  .cmd{
    pointer-events:auto;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;
    background:rgba(18,20,25,.86);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);
  }
  .cmd .ic{color:var(--accent);font-weight:800;font-size:14px}
  .cmd input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px;font-weight:500}
  .cmd input::placeholder{color:var(--txt-3)}

  /* ---------- live activity strip ---------- */
  .activity{
    position:fixed;right:24px;bottom:90px;z-index:40;width:380px;
    background:rgba(18,20,25,.92);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:.2s var(--ease);
  }
  .activity .ahead{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;user-select:none}
  .activity .ahead .blip{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
  .activity .ahead .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-2)}
  .activity .ahead .latest{flex:1;font-size:12px;color:var(--txt-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"JetBrains Mono",monospace}
  .activity .ahead .chev{color:var(--txt-3);transition:.2s;font-size:13px}
  .activity.open .ahead .chev{transform:rotate(180deg)}
  .activity .abody{max-height:0;overflow:hidden;transition:max-height .26s var(--ease)}
  .activity.open .abody{max-height:50vh;overflow:auto}
  .agroup{padding:10px 15px;border-top:1px solid var(--line-soft)}
  .agroup .gco{font-size:11px;font-weight:800;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
  .aitem{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12px;color:var(--txt-2)}
  .aitem .ad{width:7px;height:7px;border-radius:50%;margin-top:4px;flex:0 0 auto;background:var(--slate)}
  .aitem.building .ad,.aitem.deploy .ad{background:var(--blue);animation:blip 1.1s infinite}
  .aitem.await .ad{background:var(--violet)}
  .aitem.check .ad{background:var(--green)}
  .aitem.blocked .ad{background:var(--red)}
  .aitem.reprioritize .ad{background:var(--accent)}
  .aitem .at{margin-left:auto;color:var(--txt-3);font-family:"JetBrains Mono",monospace;font-size:11px;flex:0 0 auto;padding-left:8px}

  /* ---------- zoom (company detail) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .zoom{
    position:fixed;top:0;right:0;bottom:0;width:min(960px,86vw);z-index:60;
    background:var(--bg);border-left:1px solid var(--line);box-shadow:-30px 0 80px -30px rgba(0,0,0,.8);
    transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column;
  }
  .zoom.show{transform:translateX(0)}
  .zhead{display:flex;align-items:center;gap:14px;padding:20px 26px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .zhead .back{display:flex;align-items:center;gap:7px;color:var(--txt-2);font-weight:700;font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid var(--line)}
  .zhead .back:hover{background:var(--panel)}
  .zhead .ztitle{font-size:22px;font-weight:900;letter-spacing:-.03em}
  .zhead .zdom{color:var(--txt-3);font-size:12.5px;font-weight:600;font-family:"JetBrains Mono",monospace}
  .zhead .zbadge{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--green);padding:5px 11px;border-radius:999px}
  .zhead .zbadge .d{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .zbody{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 360px}
  .zbody::-webkit-scrollbar{width:10px}.zbody::-webkit-scrollbar-thumb{background:#23262f;border-radius:10px;border:2px solid var(--bg)}
  .zmain{padding:24px 26px;min-width:0}
  .zside{border-left:1px solid var(--line);background:#0d0f13;display:flex;flex-direction:column;min-height:100%}

  .zstats{display:flex;gap:26px;margin-bottom:22px}
  .zstats .v{font-size:20px;font-weight:800;letter-spacing:-.03em}
  .zstats .k{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:2px}

  .sec-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3);margin:0 0 12px}

  /* approval gate */
  .gate{border:1px solid rgba(167,139,250,.45);border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,rgba(167,139,250,.06),transparent 60%),var(--panel);margin-bottom:26px}
  .gate .ghead{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .gate .ghead .tag{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#1a1330;background:var(--violet);padding:4px 10px;border-radius:999px}
  .gate .ghead .gt{font-weight:800;font-size:14.5px}
  .gate .ghead .att{margin-left:auto;font-size:11px;color:var(--txt-3);font-family:"JetBrains Mono",monospace}
  .gate .gbody{padding:16px 18px}

  .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .chip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#0d0f13}
  .chip a{color:var(--accent);text-decoration:none;font-family:"JetBrains Mono",monospace;font-size:12px}
  .chip a:hover{text-decoration:underline}
  .chip.pass{border-color:var(--green);color:var(--green);background:var(--green-dim)}
  .chip.pass .ck{font-weight:900}
  .chip .donewhen{color:var(--txt-2);font-family:"JetBrains Mono",monospace;font-size:11px}

  .diff{background:#0a0c10;border:1px solid var(--line);border-radius:11px;padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.7;overflow:auto;margin-bottom:16px;white-space:pre}
  .diff .add{color:var(--green)}
  .diff .ctx{color:var(--txt-3)}

  .gate .actions{display:flex;gap:11px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:11px;font-weight:800;font-size:13.5px;transition:.14s var(--ease)}
  .btn.approve{background:var(--green);color:#04230f}
  .btn.approve:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.reject{background:transparent;border:1px solid var(--line);color:var(--txt-2)}
  .btn.reject:hover{border-color:var(--red);color:var(--red)}
  .btn .k{font-size:11px;opacity:.7}

  .confirm{display:none;align-items:center;gap:9px;margin-top:14px;padding:12px 14px;border-radius:11px;font-weight:800;font-size:13px}
  .confirm.show{display:flex;animation:pop .3s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confirm.ok{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
  .confirm.rej{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber)}

  .feedback{display:none;margin-top:12px}
  .feedback.show{display:block}
  .feedback textarea{width:100%;min-height:74px;resize:vertical;background:#0a0c10;border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:12px;font-family:inherit;font-size:13px;outline:none}
  .feedback textarea:focus{border-color:var(--accent)}
  .feedback .frow{display:flex;gap:9px;margin-top:9px}
  .feedback .send{background:var(--amber);color:#2a1d04;padding:9px 15px;border-radius:9px;font-weight:800;font-size:12.5px}
  .feedback .cancel{color:var(--txt-3);font-weight:700;font-size:12.5px;padding:9px 12px}

  /* slice list */
  .slices{display:flex;flex-direction:column;gap:7px}
  .srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line-soft);border-radius:11px;background:var(--panel)}
  .srow .n{font-family:"JetBrains Mono",monospace;color:var(--txt-3);font-size:12px;width:22px;flex:0 0 auto}
  .srow .st{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow .pri{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--txt-3);flex:0 0 auto}
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;flex:0 0 auto}
  .pill.shipped{color:var(--green);background:var(--green-dim)}
  .pill.building{color:var(--blue);background:rgba(91,140,255,.12)}
  .pill.todo{color:var(--slate);background:#1a1d24}
  .pill.blocked{color:var(--red);background:var(--red-dim)}
  .pill.awaiting_approval{color:#1a1330;background:var(--violet)}

  /* company chat (zside) */
  .zside .chead{padding:14px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
  .zside .clog{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:90%;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.5}
  .msg.assistant{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.user{background:var(--accent);color:#06122e;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
  .zside .cinput{padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .zside .cinput input{flex:1;background:#0a0c10;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:13px;outline:none}
  .zside .cinput input:focus{border-color:var(--accent)}
  .zside .cinput .snd{color:var(--accent);font-weight:800;font-size:13px;padding:8px 10px}

  /* badge */
  .corner{position:fixed;left:20px;bottom:20px;z-index:70;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;color:var(--txt-3);background:rgba(18,20,25,.8);border:1px solid var(--line);border-radius:9px;padding:7px 11px;backdrop-filter:blur(8px)}

  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">

  <!-- portfolio header strip -->
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <b>C Slop Slop</b>
      <span>· Wallboard</span>
    </div>
    <div class="totals" id="totals"></div>
    <div class="spacer"></div>
    <div class="needsbar" id="needsbar" title="Jump to what needs you">
      <span class="pip"></span><span id="needsLbl">1 needs you</span>
    </div>
    <div class="seg" id="seg">
      <button class="on" data-view="wall">Wall</button>
      <button data-view="opps">Opportunities</button>
    </div>
  </div>

  <!-- main wall -->
  <div class="main">
    <div class="wallscroll" id="wallscroll">
      <div class="wallhead">
        <h1 id="wallTitle">Portfolio Status</h1>
        <div class="live"><span class="blip"></span> live</div>
        <div class="rotate" id="rotate" title="Auto-rotate spotlight across tiles">
          <span class="sw"></span> auto-rotate
        </div>
      </div>
      <div class="wall" id="wall"></div>
    </div>

    <!-- global command/chat bar -->
    <div class="cmdwrap">
      <div class="cmd">
        <span class="ic mono">⌘K</span>
        <input id="cmd" placeholder="Ask, command, or jump… e.g. “approve LeadSift slice 5”" />
        <span class="kbd">↵</span>
      </div>
    </div>
  </div>
</div>

<!-- live activity strip -->
<div class="activity" id="activity">
  <div class="ahead" id="ahead">
    <span class="blip"></span>
    <span class="lbl">Activity</span>
    <span class="latest mono" id="latest"></span>
    <span class="chev">▾</span>
  </div>
  <div class="abody" id="abody"></div>
</div>

<!-- zoom -->
<div class="scrim" id="scrim"></div>
<aside class="zoom" id="zoom" aria-hidden="true"></aside>

<div class="corner">17 · Wallboard</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- effective health color for a company ---- */
function health(c){
  if(c.status==='paused') return 'paused';
  if(c.status==='archived') return 'archived';
  // active: blocked slice → red, otherwise green
  const slices = c.slices || (c.currentSlice?[c.currentSlice]:[]);
  if(slices.some(s=>s.status==='blocked')) return 'blocked';
  return 'active';
}
function curSlice(c){
  if(c.currentSlice) return c.currentSlice;
  if(c.slices){
    return c.slices.find(s=>s.status==='awaiting_approval')
      || c.slices.find(s=>s.status==='building')
      || c.slices.find(s=>s.status==='todo')
      || [...c.slices].reverse().find(s=>s.status==='shipped');
  }
  return null;
}
const STATUSLBL = {active:'Healthy',paused:'Paused',archived:'Archived',blocked:'Blocked'};

/* ---------- portfolio totals ---------- */
function renderTotals(){
  const p = DATA.portfolio;
  $('#totals').innerHTML = [
    ['$'+p.mrr, 'MRR', 'green'],
    [p.users, 'Users', ''],
    [p.activeCompanies, 'Active', ''],
    [p.slicesShipped, 'Slices shipped', ''],
  ].map(([v,k,cls])=>`<div class="stat"><span class="v ${cls}">${v}</span><span class="k">${k}</span></div>`).join('');
}

/* ---------- wall tiles ---------- */
function renderWall(){
  const wall = $('#wall');
  wall.innerHTML = DATA.companies.map(c=>{
    const h = health(c);
    const cs = curSlice(c);
    const sStat = cs ? cs.status : 'todo';
    const sKey = sStat==='awaiting_approval' ? 'await' : sStat;
    const sliceTxt = cs ? `slice ${cs.n} · ${esc(cs.title)}` : 'no slices yet';
    const shipped = c.slices ? c.slices.filter(s=>s.status==='shipped').length : c.slicesShipped;
    const badge = c.needsYou
      ? `<span class="needtag"><span class="d"></span>Needs you</span>`
      : `<span class="badge"><span class="d"></span>${STATUSLBL[h]}</span>`;
    return `
      <div class="tile s-${h} ${c.needsYou?'needs':''}" tabindex="0" data-co="${c.id}" role="button" aria-label="${esc(c.name)} - open">
        <div class="fill"></div><div class="edge"></div>
        <div class="row1">
          <span class="nm">${esc(c.name)}</span>
          ${badge}
        </div>
        <div class="metric">
          <span class="big mono">$${c.mrr}</span><span class="cur">/mo · ${c.users} users</span>
        </div>
        <div class="sub">${esc(c.thesis)}</div>
        <div class="slice"><span class="sd ${sKey}"></span><span class="stxt">${sliceTxt}</span></div>
        <div class="ship">${shipped} shipped${c.domain?` · ${esc(c.domain)}`:''}</div>
      </div>`;
  }).join('');
  $$('.tile',wall).forEach(t=>{
    t.addEventListener('click',()=>openZoom(t.dataset.co));
    t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openZoom(t.dataset.co);}});
  });
}

/* ---------- opportunities view ---------- */
function renderOpps(){
  const wall = $('#wall');
  wall.innerHTML = `<div class="opptile" style="grid-column:1/-1;min-height:0">
    <h3>Opportunities · scored thoughts → promote to a company</h3>
    ${DATA.opportunities.map(o=>oppRow(o)).join('')}
  </div>
  <div class="opptile" style="grid-column:1/-1;min-height:0">
    <h3>Next moves</h3>
    ${DATA.nextMoves.map((m,i)=>`<div class="opp"><span class="score mono">${i+1}</span><span class="nm2" style="font-weight:600;white-space:normal">${esc(m)}</span></div>`).join('')}
  </div>`;
  wireOpps(wall);
}
function oppRow(o){
  const killed = o.status==='killed';
  return `<div class="opp ${killed?'killed':''}">
    <div class="score mono" style="color:${o.score>=70?'var(--green)':o.score>=50?'var(--amber)':'var(--txt-3)'}">${o.score}</div>
    <div style="flex:1;min-width:0">
      <div class="nm2">${esc(o.title)} <span style="color:var(--txt-3);font-weight:500">- ${esc(o.thesis)}</span></div>
      <div class="scorebar"><i style="width:${o.score}%;background:${o.score>=70?'var(--green)':o.score>=50?'var(--amber)':'var(--slate)'}"></i></div>
    </div>
    ${killed?'<span class="score" style="color:var(--txt-3);font-size:11px">killed</span>':`<button class="promote" data-promote="${esc(o.title)}">Promote →</button>`}
  </div>`;
}
function wireOpps(root){
  $$('[data-promote]',root).forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const orig=b.textContent;b.textContent='Promoted ✓';b.style.opacity='1';b.style.color='var(--green)';b.style.borderColor='var(--green)';
    setTimeout(()=>{b.textContent=orig;b.style.color='';b.style.borderColor='';},1400);
  }));
}

/* ---------- view toggle ---------- */
let view='wall';
function setView(v){
  view=v;
  $$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('#wallTitle').textContent = v==='wall'?'Portfolio Status':'Opportunities Inbox';
  if(v==='wall') renderWall(); else renderOpps();
}
$$('#seg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

/* ---------- activity strip ---------- */
function renderActivity(){
  const latest = DATA.activity.find(a=>a.running) || DATA.activity[0];
  $('#latest').textContent = `${latest.co}: ${latest.text}`;
  const groups={};
  DATA.activity.forEach(a=>{(groups[a.co]=groups[a.co]||[]).push(a);});
  $('#abody').innerHTML = Object.entries(groups).map(([co,items])=>`
    <div class="agroup">
      <div class="gco">${esc(co)}</div>
      ${items.map(a=>`<div class="aitem ${a.kind}">
        <span class="ad"></span>
        <span>${esc(a.text)}</span>
        <span class="at">${a.t}</span>
      </div>`).join('')}
    </div>`).join('');
}
$('#ahead').addEventListener('click',()=>$('#activity').classList.toggle('open'));

/* ---------- auto-rotate spotlight ---------- */
let rotateTimer=null, rotateIdx=0;
$('#rotate').addEventListener('click',()=>{
  const el=$('#rotate');el.classList.toggle('on');
  if(el.classList.contains('on')){
    rotateTimer=setInterval(()=>{
      const tiles=$$('.tile');if(!tiles.length)return;
      tiles.forEach(t=>t.style.outline='');
      rotateIdx=rotateIdx%tiles.length;
      const t=tiles[rotateIdx];
      t.style.outline='2px solid var(--accent)';t.style.outlineOffset='2px';
      t.scrollIntoView({block:'nearest',behavior:'smooth'});
      rotateIdx++;
    },2200);
  } else { clearInterval(rotateTimer); $$('.tile').forEach(t=>t.style.outline=''); }
});

/* ---------- zoom (LeadSift detail + approval gate) ---------- */
const zoom=$('#zoom'), scrim=$('#scrim');
function openZoom(id){
  const c=DATA.companies.find(x=>x.id===id);
  if(!c)return;
  if(view==='opps') setView('wall');
  zoom.innerHTML = zoomHTML(c);
  zoom.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>{zoom.classList.add('show');scrim.classList.add('show');});
  wireZoom(c);
}
function closeZoom(){
  zoom.classList.remove('show');scrim.classList.remove('show');
  zoom.setAttribute('aria-hidden','true');
}
scrim.addEventListener('click',closeZoom);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeZoom();$('#activity').classList.remove('open');}});

function zoomHTML(c){
  const h=health(c);
  const slices = c.slices || (c.currentSlice?[c.currentSlice]:[]);
  const shipped = c.slices ? c.slices.filter(s=>s.status==='shipped').length : c.slicesShipped;
  const stats=[['$'+c.mrr,'MRR'],[c.users,'Users'],[shipped,'Shipped'],[c.previewUrl?'live':'-','Preview']];

  let gate='';
  if(c.approval){
    const a=c.approval;
    const diffHtml=a.diff.split('\n').map(l=>{
      const cls = l.startsWith('+')?'add':'ctx';
      return `<span class="${cls}">${esc(l)}</span>`;
    }).join('\n');
    gate=`
    <div class="gate" id="gate">
      <div class="ghead">
        <span class="tag">Needs you · L0 approval</span>
        <span class="gt">Slice ${a.slice} - ${esc(a.title)}</span>
        <span class="att mono">attempt ${a.attempt}</span>
      </div>
      <div class="gbody">
        <div class="meta">
          <div class="chip">Preview <a href="${a.previewUrl}" target="_blank" rel="noopener">${a.previewUrl}</a></div>
          <div class="chip pass"><span class="ck">✓</span> doneWhen ${a.checkResult}</div>
        </div>
        <div class="chip" style="margin-bottom:14px"><span class="donewhen">${esc(a.doneWhen)}</span></div>
        <div class="diff">${diffHtml}</div>
        <div class="actions">
          <button class="btn approve" id="approveBtn">Approve &amp; ship <span class="k mono">↵</span></button>
          <button class="btn reject" id="rejectBtn">Reject with feedback</button>
        </div>
        <div class="confirm ok" id="confirmOk"><span>✓</span> Approved - shipping slice ${a.slice} now.</div>
        <div class="confirm rej" id="confirmRej"><span>↩</span> Sent back with your feedback.</div>
        <div class="feedback" id="feedback">
          <textarea id="fbText" placeholder="What needs to change before this ships?"></textarea>
          <div class="frow">
            <button class="send" id="fbSend">Send feedback &amp; re-run</button>
            <button class="cancel" id="fbCancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  const sliceRows = slices.map(s=>{
    const pri = s.priority?`<span class="pri">P ${s.priority}</span>`:'';
    return `<div class="srow">
      <span class="n">${s.n}</span>
      <span class="st">${esc(s.title)}</span>
      ${pri}
      <span class="pill ${s.status}">${s.status.replace('_',' ')}</span>
    </div>`;
  }).join('');

  const chatLog = DATA.chat.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');

  return `
  <div class="zhead">
    <button class="back" id="backBtn">‹ Esc</button>
    <div>
      <div class="ztitle">${esc(c.name)}</div>
      <div class="zdom">${c.domain?esc(c.domain):'no domain yet'}${c.previewUrl?` · ${c.previewUrl}`:''}</div>
    </div>
    <span class="zbadge" style="color:var(--${h==='active'?'green':h==='paused'?'amber':h==='blocked'?'red':'slate'});border-color:var(--${h==='active'?'green':h==='paused'?'amber':h==='blocked'?'red':'slate'})">
      <span class="d" style="background:currentColor"></span>${STATUSLBL[h]}
    </span>
  </div>
  <div class="zbody">
    <div class="zmain">
      <div class="zstats">
        ${stats.map(([v,k])=>`<div><div class="v mono">${v}</div><div class="k">${k}</div></div>`).join('')}
      </div>
      ${gate}
      <p class="sec-label">Slices${c.slices?` · ${slices.length}`:''}</p>
      <div class="slices">${sliceRows}</div>
    </div>
    <div class="zside">
      <div class="chead">Chat · ${esc(c.name)}</div>
      <div class="clog">${chatLog}</div>
      <div class="cinput">
        <input id="zchat" placeholder="Message ${esc(c.name)}…" />
        <button class="snd" id="zsend">↵</button>
      </div>
    </div>
  </div>`;
}

function wireZoom(c){
  $('#backBtn').addEventListener('click',closeZoom);

  // chat
  const zchat=$('#zchat'), clog=$('.clog');
  function send(){
    const v=zchat.value.trim();if(!v)return;
    const u=document.createElement('div');u.className='msg user';u.textContent=v;clog.appendChild(u);
    zchat.value='';clog.scrollTop=clog.scrollHeight;
    setTimeout(()=>{
      const a=document.createElement('div');a.className='msg assistant';
      a.textContent='On it - I’ll route that to '+c.name+' and report back in the activity feed.';
      clog.appendChild(a);clog.scrollTop=clog.scrollHeight;
    },550);
  }
  $('#zsend').addEventListener('click',send);
  zchat.addEventListener('keydown',e=>{if(e.key==='Enter')send();});

  // approval gate
  if(!c.approval)return;
  const okMsg=$('#confirmOk'), rejMsg=$('#confirmRej'), fb=$('#feedback'), gate=$('#gate');
  const approveBtn=$('#approveBtn'), rejectBtn=$('#rejectBtn');

  function approve(){
    rejMsg.classList.remove('show');fb.classList.remove('show');
    okMsg.classList.add('show');
    approveBtn.textContent='Approved ✓';approveBtn.disabled=true;approveBtn.style.opacity='.7';
    gate.style.borderColor='var(--green)';
  }
  approveBtn.addEventListener('click',approve);
  rejectBtn.addEventListener('click',()=>{
    okMsg.classList.remove('show');
    fb.classList.toggle('show');
    if(fb.classList.contains('show'))$('#fbText').focus();
  });
  $('#fbCancel').addEventListener('click',()=>fb.classList.remove('show'));
  $('#fbSend').addEventListener('click',()=>{
    fb.classList.remove('show');okMsg.classList.remove('show');
    rejMsg.classList.add('show');
    const v=$('#fbText').value.trim();
    if(v)rejMsg.querySelector('span:last-child').textContent=` Sent back: “${v.slice(0,48)}${v.length>48?'…':''}” - re-running.`;
    $('#fbText').value='';
  });

  // Enter approves when gate visible and chat not focused
  zoom._gateKey=e=>{
    if(e.key==='Enter' && document.activeElement!==zchat && document.activeElement!==$('#fbText') && !approveBtn.disabled){
      approve();
    }
  };
  document.addEventListener('keydown',zoom._gateKey);
}

/* ---------- command bar ---------- */
$('#cmd').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=e.target.value.toLowerCase();
  if(v.includes('leadsift')||v.includes('approve')||v.includes('digest')){openZoom('leadsift');}
  else if(v.includes('opportun')||v.includes('promote')){setView('opps');}
  else { const c=DATA.companies.find(x=>v.includes(x.id)||v.includes(x.name.toLowerCase())); if(c)openZoom(c.id); }
  e.target.value='';
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd').focus();}
});

// needs-you bar → jump to LeadSift
$('#needsbar').addEventListener('click',()=>openZoom('leadsift'));

/* ---------- init ---------- */
renderTotals();
renderWall();
renderActivity();
$('#needsLbl').textContent = DATA.portfolio.needsYou+' needs you';
</script>
</body>
</html>
