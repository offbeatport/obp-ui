<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · Evidence Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Newsreader:ital,opsz@0,12;1,12&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f5f1; --panel:#fffefb; --ink:#1b1a17; --ink2:#56534b; --ink3:#8d897f;
    --line:#e7e4dc; --line2:#d9d5cb; --accent:#3a6f5d; --accent-soft:#e4efe9;
    --green:#2f8f5b; --blue:#3d6fd6; --violet:#7a5bd0; --amber:#c98a14; --red:#c4503e; --slate:#7d8088;
    --shadow:0 1px 2px rgba(30,27,20,.04), 0 8px 28px rgba(30,27,20,.06);
    --radius:13px;
    /* rung tints, cheapest->most committed */
    --r0:#eef0ee; --r1:#eaf0ef; --r2:#e8f0f3; --r3:#e7eef8; --r4:#efeaf6; --r5:#f6efe6; --r6:#e9f3ec;
    --r0i:#7d8088; --r1i:#5f8a72; --r2i:#3d8aa6; --r3i:#3d6fd6; --r4i:#7a5bd0; --r5i:#c98a14; --r6i:#2f8f5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .serif{font-family:Newsreader,Georgia,serif}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:#d6d2c8;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100%}
  header.top{
    display:flex;align-items:center;gap:18px;padding:13px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fffefb,#faf9f5);z-index:30;flex:none;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .logo{font-weight:700;letter-spacing:-.02em;font-size:15px}
  .brand .logo b{color:var(--accent)}
  .brand .tag{color:var(--ink3);font-size:11.5px}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
  .crumbs button{background:none;border:none;color:var(--ink2);padding:3px 6px;border-radius:6px;font-size:12.5px}
  .crumbs button:hover{background:var(--accent-soft);color:var(--accent)}
  .crumbs .sep{color:var(--ink3)}
  .crumbs .here{color:var(--ink);font-weight:600}
  .top .metrics{margin-left:auto;display:flex;gap:20px}
  .metric{display:flex;flex-direction:column;line-height:1.15}
  .metric .v{font-weight:700;font-size:15px}
  .metric .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .metric .v.warn{color:var(--amber)}

  .body{display:flex;flex:1;min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

  /* ---------- ladder ---------- */
  .ladder-head{
    display:flex;align-items:center;gap:12px;padding:12px 22px 9px;flex:none;
  }
  .ladder-head h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
  .ladder-head .sub{color:var(--ink3);font-size:12px}
  .ladder-head .arrow{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--ink3);font-size:11.5px;letter-spacing:.04em}
  .ladder-head .arrow .line{height:1px;width:160px;background:linear-gradient(90deg,var(--line2),var(--accent));position:relative}
  .ladder-head .arrow .line::after{content:'';position:absolute;right:-1px;top:-2.5px;border-left:6px solid var(--accent);border-top:3px solid transparent;border-bottom:3px solid transparent}

  .ladder{
    flex:1;display:flex;gap:13px;overflow-x:auto;overflow-y:hidden;padding:4px 22px 18px;align-items:stretch;
  }
  .rung{
    flex:0 0 232px;display:flex;flex-direction:column;min-height:0;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  }
  .rung-head{padding:11px 13px 10px;border-bottom:1px solid var(--line);position:relative}
  .rung-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
  .rung[data-i="0"] .rung-head{background:var(--r0)} .rung[data-i="0"] .rung-head::before{background:var(--r0i)}
  .rung[data-i="1"] .rung-head{background:var(--r1)} .rung[data-i="1"] .rung-head::before{background:var(--r1i)}
  .rung[data-i="2"] .rung-head{background:var(--r2)} .rung[data-i="2"] .rung-head::before{background:var(--r2i)}
  .rung[data-i="3"] .rung-head{background:var(--r3)} .rung[data-i="3"] .rung-head::before{background:var(--r3i)}
  .rung[data-i="4"] .rung-head{background:var(--r4)} .rung[data-i="4"] .rung-head::before{background:var(--r4i)}
  .rung[data-i="5"] .rung-head{background:var(--r5)} .rung[data-i="5"] .rung-head::before{background:var(--r5i)}
  .rung[data-i="6"] .rung-head{background:var(--r6)} .rung[data-i="6"] .rung-head::before{background:var(--r6i)}
  .rung-head .rn{display:flex;align-items:baseline;gap:7px}
  .rung-head .step{font-size:10px;font-weight:700;color:var(--ink3)}
  .rung-head .name{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .rung-head .cost{margin-top:3px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
  .rung[data-i="0"] .cost{color:var(--r0i)} .rung[data-i="1"] .cost{color:var(--r1i)}
  .rung[data-i="2"] .cost{color:var(--r2i)} .rung[data-i="3"] .cost{color:var(--r3i)}
  .rung[data-i="4"] .cost{color:var(--r4i)} .rung[data-i="5"] .cost{color:var(--r5i)}
  .rung[data-i="6"] .cost{color:var(--r6i)}
  .rung-head .cnt{position:absolute;right:11px;top:11px;font-size:11px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line2);border-radius:20px;padding:1px 8px}
  .rung-items{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
  .rung-items:empty::after{content:'-';color:var(--line2);text-align:center;padding-top:14px;font-size:18px}

  /* ladder item cards (heterogeneous) */
  .item{
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;cursor:pointer;
    transition:.13s;position:relative;
  }
  .item:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,27,20,.07)}
  .item .kind{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-bottom:6px}
  .k-opportunity{background:#f0eee7;color:#8a7a55} .k-opportunity .dot{background:#b9a36b}
  .k-company{background:#e9f3ec;color:#2f8f5b} .k-company .dot{background:#2f8f5b}
  .k-feature{background:#e7eef8;color:#3d6fd6} .k-feature .dot{background:#3d6fd6}
  .k-campaign{background:#efeaf6;color:#7a5bd0} .k-campaign .dot{background:#7a5bd0}
  .kind .dot{width:5px;height:5px;border-radius:50%}
  .item .lbl{font-size:12.5px;font-weight:500;line-height:1.3}
  .item .clickable{font-size:10px;color:var(--accent);margin-top:5px;opacity:0;transition:.13s}
  .item:hover .clickable{opacity:1}
  .item.linked{border-left:3px solid var(--accent)}

  /* ---------- right rail ---------- */
  .rail{
    flex:0 0 372px;border-left:1px solid var(--line);background:linear-gradient(180deg,#fbfaf6,#f7f6f1);
    display:flex;flex-direction:column;min-height:0;
  }
  .rail.queue-rail{flex-basis:392px}
  .rail-tabs{display:flex;padding:10px 12px 0;gap:4px;flex:none}
  .rail-tabs button{
    border:none;background:none;padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--ink3);
    border-radius:8px 8px 0 0;position:relative;
  }
  .rail-tabs button .badge{display:inline-block;margin-left:5px;background:var(--violet);color:#fff;font-size:9.5px;font-weight:700;border-radius:20px;padding:0 6px;line-height:15px;vertical-align:middle}
  .rail-tabs button.on{color:var(--ink);background:var(--panel);box-shadow:0 -1px 0 var(--line) inset}
  .rail-tabs button:hover{color:var(--ink)}
  .rail-pane{flex:1;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line)}
  .pane-intro{padding:12px 15px 4px}
  .pane-intro .t{font-weight:600;font-size:13.5px}
  .pane-intro .d{color:var(--ink3);font-size:11.5px;margin-top:2px}

  /* queue cards */
  .qlist{padding:10px 13px 18px;display:flex;flex-direction:column;gap:11px}
  .qcard{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;transition:.15s}
  .qcard.gated{border-color:#e4d6c0}
  .qcard .qtop{display:flex;gap:10px;padding:11px 12px 10px;cursor:pointer}
  .qglyph{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--accent-soft);color:var(--accent)}
  .qcard.gated .qglyph{background:#f6ecdb;color:#a9760f}
  .qmeta{min-width:0;flex:1}
  .qmeta .qco{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .qmeta .qttl{font-weight:600;font-size:13px;line-height:1.3;margin-top:1px}
  .qmeta .qkind{font-size:10.5px;color:var(--ink3);margin-top:3px}
  .gate-flag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-top:6px}
  .gate-flag.must{background:#f6ecdb;color:#a9760f}
  .gate-flag.auto{background:#e9f3ec;color:#2f8f5b}
  .qrung{margin-left:auto;flex:none;align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line2);border-radius:20px;padding:2px 8px;white-space:nowrap}
  .qbody{padding:0 12px 12px;border-top:1px dashed var(--line)}
  .ev{display:flex;gap:7px;align-items:flex-start;padding:10px 0 9px;font-size:11.5px;color:var(--ink2)}
  .ev .evk{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);flex:none;margin-top:1px}
  .draft{background:#faf9f5;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11.5px;color:var(--ink);white-space:pre-wrap;line-height:1.45}
  .draft .dh{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px}
  .spend{font-size:13px;font-weight:700;color:var(--amber);margin:8px 0}
  .qacts{display:flex;gap:8px;margin-top:10px}
  .btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink);transition:.12s}
  .btn:hover{background:#faf9f5}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#2f5d4d}
  .btn.ghost{color:var(--ink2)}
  .btn.tiny{padding:5px 9px;font-size:11px}
  .resolved{padding:11px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
  .resolved.ok{color:var(--green)} .resolved.rej{color:var(--red)}
  .resolved .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}
  .resolved.ok .ic{background:var(--green)} .resolved.rej .ic{background:var(--red)}
  .rejbox{margin-top:9px;display:none}
  .rejbox textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px;font-family:inherit;font-size:12px;resize:vertical;min-height:54px;background:#fff;color:var(--ink)}
  .rejbox .row{display:flex;gap:8px;margin-top:7px}

  /* the full gate (q1) */
  .gate{margin-top:10px;border-top:1px dashed var(--line);padding-top:11px;display:none}
  .gate.show{display:block}
  .gate .grow{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11.5px}
  .gate .chk{display:inline-flex;align-items:center;gap:6px;background:#e9f3ec;color:#2f8f5b;border:1px solid #cfe7d8;border-radius:8px;padding:5px 9px;font-weight:600;font-size:11px}
  .gate .chk .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .preview-url{display:flex;align-items:center;gap:7px;background:#f4f8fc;border:1px solid #d8e6f5;border-radius:8px;padding:7px 10px;font-size:11.5px;margin-bottom:9px}
  .preview-url .mono{color:var(--blue);text-decoration:none;font-weight:500}
  .preview-url .mono:hover{text-decoration:underline}
  .preview-url .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .preview-url .live .d{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  .diff{background:#1d1c19;border-radius:9px;padding:11px 12px;overflow-x:auto;font-size:11px;line-height:1.6}
  .diff .l{white-space:pre;color:#cfcabe}
  .diff .add{color:#7ee2a8} .diff .ctx{color:#8a857a}
  .donewhen{font-size:11px;color:var(--ink2);margin:9px 0;background:#faf9f5;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .donewhen b{color:var(--ink)}

  /* comms streams */
  .comms-switch{display:flex;gap:5px;padding:11px 13px 4px;flex-wrap:wrap}
  .comms-switch button{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--ink2)}
  .comms-switch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .comms-body{padding:6px 13px 18px}
  .chat-msg{margin:9px 0;max-width:88%}
  .chat-msg .who{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
  .chat-msg .bub{padding:9px 11px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .chat-msg.assistant .bub{background:#f2f4f1;border:1px solid var(--line);border-top-left-radius:4px}
  .chat-msg.user{margin-left:auto} .chat-msg.user .who{text-align:right}
  .chat-msg.user .bub{background:var(--accent);color:#fff;border-top-right-radius:4px}
  .chat-input{display:flex;gap:8px;padding:11px 13px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
  .chat-input input{flex:1;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
  .chat-input input:focus{outline:none;border-color:var(--accent)}

  .stream-card{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;margin:10px 0}
  .stream-card .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .stat-pill{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
  .st-posted{background:#e9f3ec;color:#2f8f5b} .st-draft{background:#f6ecdb;color:#a9760f}
  .stream-card .txt{font-size:12.5px;line-height:1.45;color:var(--ink)}
  .stream-card .stats{font-size:11px;color:var(--ink3);margin-top:7px;font-weight:500}
  .stream-card .t{margin-left:auto;font-size:11px;color:var(--ink3)}
  .ticket{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;margin:10px 0}
  .ticket .th{display:flex;align-items:center;gap:8px}
  .ticket .subj{font-weight:600;font-size:12.5px}
  .ticket .from{font-size:11px;color:var(--ink3)}
  .ticket .signal{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--violet);background:#efeaf6;border-radius:20px;padding:2px 8px;margin-left:auto}
  .ticket .body{font-size:12px;color:var(--ink2);margin-top:7px;line-height:1.45}
  .ticket .ev{font-size:10px;color:var(--accent);font-weight:600;margin-top:6px;padding:0}

  /* ---------- company / feature detail (altitudes) ---------- */
  .detail{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;overflow:hidden}
  .detail.show{display:flex;animation:slideIn .22s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .detail-head{padding:16px 24px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffefb,#faf9f5);flex:none}
  .detail-head .row1{display:flex;align-items:center;gap:12px}
  .detail-head h2{margin:0;font-size:20px;letter-spacing:-.02em}
  .detail-head .thesis{color:var(--ink2);font-size:13px;margin-top:5px;max-width:640px}
  .pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
  .pill.active{background:#e9f3ec;color:var(--green)} .pill.paused{background:#f6ecdb;color:var(--amber)}
  .detail-head .stats{display:flex;gap:22px;margin-top:13px}
  .detail-head .stats .metric .v{font-size:17px}
  .back{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2)}
  .back:hover{background:#faf9f5;color:var(--ink)}
  .detail-grid{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
  .detail-main{overflow-y:auto;padding:18px 24px 40px}
  .detail-side{border-left:1px solid var(--line);background:#fbfaf6;overflow-y:auto;padding:16px 16px 40px}
  .sec-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:6px 0 11px}
  .feat{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:9px;cursor:pointer;transition:.12s}
  .feat:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
  .feat .num{flex:none;width:24px;height:24px;border-radius:7px;background:#f2f1ec;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}
  .feat .ft{flex:1;font-size:13px;font-weight:500}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none}
  .s-shipped{background:var(--green)} .s-building{background:var(--blue);animation:pulse 1.5s infinite}
  .s-todo{background:var(--slate)} .s-blocked{background:var(--red)} .s-awaiting_approval{background:var(--violet);animation:pulse 1.5s infinite}
  .slabel{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
  .feat.needs{border-color:#dccdf2;background:#fbf9ff}
  .feat .nb{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--violet);background:#efeaf6;border-radius:20px;padding:2px 8px}

  /* feature drill (3rd altitude) */
  .fdetail{position:absolute;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;overflow:auto}
  .fdetail.show{display:flex;animation:slideIn .22s ease}
  .fdetail .wrap{max-width:760px;margin:0 auto;padding:22px 24px 50px;width:100%}
  .fdetail h2{font-size:20px;margin:8px 0 4px;letter-spacing:-.01em}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}

  /* ---------- live activity ---------- */
  .activity{flex:none;border-top:1px solid var(--line);background:#fffefb;z-index:28}
  .act-bar{display:flex;align-items:center;gap:11px;padding:9px 22px;cursor:pointer}
  .act-bar .ld{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite;flex:none}
  .act-bar .latest{font-size:12.5px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act-bar .latest b{color:var(--ink);font-weight:600}
  .act-bar .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .act-bar .chev{transition:.2s;color:var(--ink3)}
  .activity.open .chev{transform:rotate(180deg)}
  .act-stream{max-height:0;overflow:hidden;transition:max-height .28s ease;border-top:1px solid transparent}

  .toast.ok .ic{background:var(--green)} .toast.rej .ic{background:var(--red)} .toast.info .ic{background:var(--accent)}

/* ============================ helpers ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
// maps from ladder labels to drillable entities
const LABEL_TO_COMPANY = {

};
const LABEL_TO_FEATURE = {

};
const companyByName = n => DATA.companies.find(c=>c.name===n);
const resolved = {}; // queue id -> 'ok'|'rej'

/* ============================ LADDER render ============================ */
function renderLadder(){

      const linkFt = LABEL_TO_FEATURE[it.label];

      card.innerHTML = `
        <span class="kind k-${k}"><span class="dot"></span>${k}</span>

        ${linkCo?'<div class="clickable">open company →</div>':linkFt?'<div class="clickable">open feature →</div>':''}

        if(linkCo) openCompany(linkCo);
        else if(linkFt) openFeature(linkFt.co,linkFt.n);

      });
      items.appendChild(card);
    });
    col.appendChild(items);

/* ============================ QUEUE render ============================ */
function renderQueue(){

function queueCard(q){
  const ak = ACTION_KIND[q.kind];
  const card = el('div','qcard'+(q.gated?' gated':'')); card.dataset.id=q.id;
  if(resolved[q.id]){ card.appendChild(resolvedRow(resolved[q.id])); return card; }

  const flag = q.gated
    ? '<span class="gate-flag must">⚠ you must approve</span>'
    : (q.autopilot?'<span class="gate-flag auto">✓ autopilot can ship this</span>':'');

  const top = el('div','qtop',`
    <div class="qglyph">${ak.glyph}</div>
    <div class="qmeta">
      <div class="qco">${esc(q.company)}</div>
      <div class="qttl">${esc(q.title)}</div>
      <div class="qkind">${ak.label}${q.amountUsd?` · $${q.amountUsd}`:''}</div>
      ${flag}
    </div>
    <span class="qrung">rung · ${esc(q.rung)}</span>
  `);
  const bodyOpen = q.id==='q1';
  const body = el('div','qbody'); body.style.display = bodyOpen?'block':'none';
  body.appendChild(el('div','ev',`<span class="evk">evidence</span><span>${esc(q.evidence||'-')}</span>`));

  // the FULL gate for q1
  if(q.kind==='ship_feature'){
    const gate = el('div','gate'+(bodyOpen?' show':''));
    gate.innerHTML = `
      <div class="grow"><span class="chk"><span class="d"></span>doneWhen passed · attempt 2</span></div>
      <div class="preview-url">
        <span>↗ preview</span>
        <a class="mono" href="${q.previewUrl}" target="_blank" rel="noopener">${q.previewUrl}</a>
        <span class="live"><span class="d"></span>live</span>
      </div>
      <div class="diff">${q.diff.split('\n').map(line=>{
        const cls = line.startsWith('+')?'add':(line.trim().startsWith('//')?'ctx':'l');
        return `<div class="l ${cls}">${esc(line)}</div>`;
      }).join('')}</div>
      <div class="donewhen"><b>doneWhen:</b> GET /digest/preview → 200 and body contains "Top leads" - <span style="color:var(--green);font-weight:600">passed ✓</span></div>
    `;
    body.appendChild(gate);
  } else if(q.draft){
    body.appendChild(el('div','draft',`<span class="dh">${q.kind==='cold_batch'?'cold email draft':q.kind==='tweet'?'post draft':'support reply draft'}</span>${esc(q.draft)}`));
  }
  if(q.kind==='authorize_spend'){
    body.appendChild(el('div','spend',`$${q.amountUsd}.00 - Google Ads test`));
  }

  // actions
  const acts = el('div','qacts');
  const approve = el('button','btn primary','Approve');
  const reject = el('button','btn ghost','Reject - feedback');
  acts.appendChild(approve); acts.appendChild(reject);
  body.appendChild(acts);

  // reject box
  const rej = el('div','rejbox',`
    <textarea placeholder="What needs to change before this goes out?"></textarea>
    <div class="row"><button class="btn primary tiny send">Send feedback</button><button class="btn ghost tiny cancel">Cancel</button></div>
  `);
  body.appendChild(rej);

  top.addEventListener('click',()=>{ body.style.display = body.style.display==='none'?'block':'none'; });
  approve.addEventListener('click',e=>{e.stopPropagation();resolveQueue(q,'ok');});
  reject.addEventListener('click',e=>{e.stopPropagation();rej.style.display='block';rej.querySelector('textarea').focus();});
  rej.querySelector('.cancel').addEventListener('click',()=>{rej.style.display='none';});
  rej.querySelector('.send').addEventListener('click',()=>{
    const v=rej.querySelector('textarea').value.trim();
    resolveQueue(q,'rej',v);
  });

  card.appendChild(top); card.appendChild(body);
  return card;
}

function resolvedRow(state){
  if(state==='ok') return el('div','resolved ok',`<span class="ic">✓</span>Approved - going out now. Result returns as evidence.`);
  return el('div','resolved rej',`<span class="ic">↺</span>Rejected with feedback - agent will revise.`);
}

function resolveQueue(q,state,fb){
  resolved[q.id]=state;
  const card = document.querySelector(`.qcard[data-id="${q.id}"]`);
  if(card){ card.innerHTML=''; card.appendChild(resolvedRow(state)); card.className='qcard'; }
  const ak = ACTION_KIND[q.kind];
  if(state==='ok'){
    toast('ok',`Approved · ${q.company} - ${ak.label.toLowerCase()}`);
    pushActivity(q.company,'comms', commsEventText(q));
  } else {
    toast('rej',`Rejected${fb?': “'+(fb.length>42?fb.slice(0,42)+'…':fb)+'”':''}`);
    pushActivity(q.company,'comms', `feedback sent on “${q.title}” - agent revising`);
  }
  updateBadges();
}

function commsEventText(q){
  switch(q.kind){
    case 'ship_feature': return 'slice 5 approved → shipping daily digest live';
    case 'tweet': return 'post approved → published to build-in-public';
    case 'cold_batch': return 'batch 2 approved → 25 cold emails sent';
    case 'support_reply': return 'support reply approved → sent to maria@acme.co';
    case 'authorize_spend': return '$50 ads test authorized → campaign live';
    default: return 'action approved';
  }
}

function updateBadges(){
  const open = QUEUE.filter(q=>!resolved[q.id]).length;
  $('#qBadge').textContent=open;
  $('#qBadge').style.display = open?'inline-block':'none';
  $('#needsYouCount').textContent=open;
}

    OUTBOUND.twitter.forEach(p=>{
      const c = el('div','stream-card');
      c.innerHTML=`<div class="sh"><span class="stat-pill st-${p.status}">${p.status}</span><span class="t">${p.t}</span></div>
        <div class="txt">${esc(p.text)}</div><div class="stats">${esc(p.stats)}</div>`;
      if(p.status==='draft'){
        const a=el('button','btn primary tiny','Approve & post');a.style.marginTop='9px';
        a.addEventListener('click',()=>{c.querySelector('.stat-pill').className='stat-pill st-posted';c.querySelector('.stat-pill').textContent='posted';c.querySelector('.stats').textContent='posted · gathering evidence';a.remove();toast('ok','Posted to build-in-public');pushActivity('LeadSift','comms','build-in-public post published');});
        c.appendChild(a);
      }
      body.appendChild(c);
    });
  } else if(commsStream==='cold'){
    body.appendChild(el('div','pane-intro',`<div class="d">Outbound sequences · gated to you (talks to real humans).</div>`));
    OUTBOUND.cold.forEach(s=>{
      body.appendChild(el('div','stream-card',`
        <div class="sh"><span class="stat-pill st-draft">${esc(s.step)}</span><span class="t">${esc(s.company)}</span></div>
        <div class="txt">${esc(s.segment)} · ${s.size} recipients</div>
        <div class="stats">${esc(s.stats)} · ${esc(s.status)}</div>
      `));
    });
  } else if(commsStream==='support'){
    body.appendChild(el('div','pane-intro',`<div class="d">Inbound = evidence stream. Tickets seed features & signal keep/kill.</div>`));
    SUPPORT.forEach(t=>{
      const tk = el('div','ticket');
      tk.innerHTML=`<div class="th"><span class="subj">${esc(t.subject)}</span><span class="signal">${esc(t.signal)}</span></div>
        <div class="from">${esc(t.company)} · ${esc(t.user)} · ${t.status==='answered'?'answered':'needs reply'}</div>
        <div class="body">${esc(t.body)}</div>
        <div class="ev">↳ evidence: ${esc(t.signal)}</div>`;
      body.appendChild(tk);
    });
  }
  pane.appendChild(body);
}

function renderChat(pane){
  const body = el('div','comms-body');
  body.appendChild(el('div','pane-intro',`<div class="d">Inward · you ⇄ your co-founder agent. You direct the build.</div>`));
  DATA.chat.forEach(m=>{
    body.appendChild(el('div','chat-msg '+m.role,`<div class="who">${m.role==='user'?'you':'co-founder'}</div><div class="bub">${esc(m.text)}</div>`));
  });
  pane.appendChild(body);
  const inp = el('div','chat-input',`<input id="chatInput" placeholder="Direct the build…" /><button class="btn primary" id="chatSend">Send</button>`);
  pane.appendChild(inp);
  const send=()=>{
    const v=$('#chatInput').value.trim(); if(!v)return;
    DATA.chat.push({role:'user',text:v});
    DATA.chat.push({role:'assistant',text:'On it - I’ll surface that as a proposed action in your queue when there’s evidence to approve.'});
    renderComms();
  };
  $('#chatSend').addEventListener('click',send);
  $('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
}

/* ============================ RAIL tabs ============================ */
let railTab='queue';
$('#railTabs').querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    railTab=b.dataset.tab;
    $('#railTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.tab===railTab));
    railTab==='queue'?renderQueue():renderComms();
  });
});

/* ============================ ALTITUDE 2: company ============================ */
function openCompany(id){
  const c = DATA.companies.find(x=>x.id===id); if(!c)return;
  const d = $('#companyDetail');
  const slices = c.slices || (c.currentSlice?[c.currentSlice]:[]);
  const qSlice = QUEUE.filter(q=>q.company===c.name);
  d.innerHTML=`
    <div class="detail-head">
      <div class="row1">
        <button class="back" id="coBack">← Ladder</button>
        <h2>${esc(c.name)}</h2>
        <span class="pill ${c.status}">${c.status}</span>
      </div>
      <div class="thesis serif">${esc(c.thesis)}</div>
      <div class="stats">
        <div class="metric"><span class="v">$${c.mrr}</span><span class="k">MRR</span></div>
        <div class="metric"><span class="v">${c.users}</span><span class="k">Users</span></div>
        <div class="metric"><span class="v">${(c.slices?c.slices.filter(s=>s.status==='shipped').length:c.slicesShipped)||0}</span><span class="k">Bags shipped</span></div>
        ${c.previewUrl?`<div class="metric"><span class="v" style="font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--blue)">${c.previewUrl.replace('http://','')}</span><span class="k">Preview</span></div>`:''}
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-main">
        <div class="sec-h">Slices - vertical, independently-shippable capabilities</div>
        <div id="featList"></div>
      </div>
      <div class="detail-side">
        <div class="sec-h">This company in your queue</div>
        <div id="coQueue"></div>
        <div class="sec-h" style="margin-top:22px">Comms - this company ⇄ world</div>
        <div id="coComms"></div>
      </div>
    </div>
  `;
  const fl = d.querySelector('#featList');
  slices.forEach(s=>{
    const f = el('div','feat'+(s.status==='awaiting_approval'?' needs':''));
    f.innerHTML=`<span class="sdot s-${s.status}"></span>
      <span class="num">${s.n}</span>
      <span class="ft">${esc(s.title)}</span>
      ${s.status==='awaiting_approval'?'<span class="nb">needs you</span>':`<span class="slabel">${s.status.replace('_',' ')}</span>`}`;
    f.addEventListener('click',()=>openFeature(c.id,s.n));
    fl.appendChild(f);
  });
  // company queue slice
  const cq = d.querySelector('#coQueue');
  if(qSlice.length){ qSlice.forEach(q=>cq.appendChild(miniQueue(q))); }
  else cq.appendChild(el('div','',`<div style="color:var(--ink3);font-size:12px">Nothing waiting on you here.</div>`));
  // company comms
  const cc = d.querySelector('#coComms');
  const tweets = OUTBOUND.twitter.filter(()=>c.id==='leadsift');
  const colds = OUTBOUND.cold.filter(x=>x.company===c.name);
  const tix = SUPPORT.filter(x=>x.company===c.name);
  if(tweets.length) tweets.forEach(p=>cc.appendChild(el('div','stream-card',`<div class="sh"><span class="stat-pill st-${p.status}">𝕏 ${p.status}</span></div><div class="txt">${esc(p.text)}</div><div class="stats">${esc(p.stats)}</div>`)));
  colds.forEach(s=>cc.appendChild(el('div','stream-card',`<div class="sh"><span class="stat-pill st-draft">✉ ${esc(s.step)}</span></div><div class="txt">${esc(s.segment)}</div><div class="stats">${esc(s.stats)}</div>`)));
  tix.forEach(t=>cc.appendChild(el('div','stream-card',`<div class="sh"><span class="stat-pill ${t.status==='answered'?'st-posted':'st-draft'}">❝ ${t.status==='answered'?'answered':'support'}</span></div><div class="txt">${esc(t.subject)}</div><div class="stats">${esc(t.signal)}</div>`)));
  if(!tweets.length&&!colds.length&&!tix.length) cc.appendChild(el('div','',`<div style="color:var(--ink3);font-size:12px">No comms yet.</div>`));

  d.querySelector('#coBack').addEventListener('click',closeCompany);
  d.classList.add('show');
  setCrumbs([{label:'Evidence Ladder',nav:'portfolio'},{label:c.name,here:true}]);
}
function closeCompany(){ $('#companyDetail').classList.remove('show'); setCrumbs([{label:'Evidence Ladder',here:true,nav:'portfolio'}]); }

function miniQueue(q){
  const ak=ACTION_KIND[q.kind];
  if(resolved[q.id]) return resolvedRow(resolved[q.id]);
  const c=el('div','qcard'+(q.gated?' gated':''));
  c.innerHTML=`<div class="qtop"><div class="qglyph">${ak.glyph}</div><div class="qmeta"><div class="qttl" style="font-size:12.5px">${esc(q.title)}</div><div class="qkind">${ak.label}</div>${q.gated?'<span class="gate-flag must">⚠ you must approve</span>':(q.autopilot?'<span class="gate-flag auto">✓ autopilot ok</span>':'')}</div></div>`;
  const acts=el('div','qacts');acts.style.padding='0 12px 11px';
  const ap=el('button','btn primary tiny','Approve');const rj=el('button','btn ghost tiny','Reject');
  ap.addEventListener('click',()=>{resolveQueue(q,'ok');c.innerHTML='';c.appendChild(resolvedRow('ok'));});
  rj.addEventListener('click',()=>{resolveQueue(q,'rej');c.innerHTML='';c.appendChild(resolvedRow('rej'));});
  acts.appendChild(ap);acts.appendChild(rj);c.appendChild(acts);
  return c;
}

/* ============================ ALTITUDE 3: feature ============================ */
function openFeature(coId,n){
  const c=DATA.companies.find(x=>x.id===coId); if(!c)return;
  let s = (c.slices&&c.slices.find(x=>x.n===n)) || c.currentSlice || {n,title:'Feature',status:'todo'};
  const d=$('#featureDetail');
  const isGate = coId==='leadsift'&&n===5;
  const ap = c.approval;
  d.innerHTML=`
    <div class="detail-head" style="border-bottom:1px solid var(--line)">
      <div class="row1">
        <button class="back" id="ftBack">← ${esc(c.name)}</button>
        <span class="sdot s-${s.status}" style="width:11px;height:11px"></span>
        <h2 style="font-size:18px">Slice ${s.n} · ${esc(s.title)}</h2>
      </div>
      <div class="thesis serif">${esc(c.name)} - ${esc(c.thesis)}</div>
    </div>
    <div class="wrap">
      ${isGate?gateHtml(ap):nonGateHtml(s,c)}
    </div>
  `;
  d.querySelector('#ftBack').addEventListener('click',()=>{ d.classList.remove('show'); });
  if(isGate){
    const a=d.querySelector('#fApprove'), r=d.querySelector('#fReject'), box=d.querySelector('#fRejBox');
    a.addEventListener('click',()=>{a.outerHTML='<div class="resolved ok"><span class="ic">✓</span>Approved - shipping daily digest live.</div>';r.remove();resolved['q1']='ok';updateBadges();toast('ok','Slice 5 approved - going live');pushActivity('LeadSift','comms','slice 5 approved → daily digest live');});
    r.addEventListener('click',()=>{box.style.display='block';box.querySelector('textarea').focus();});
    box.querySelector('.cancel').addEventListener('click',()=>box.style.display='none');
    box.querySelector('.send').addEventListener('click',()=>{const v=box.querySelector('textarea').value.trim();box.parentElement.innerHTML='<div class="resolved rej"><span class="ic">↺</span>Rejected with feedback - agent will revise.</div>';resolved['q1']='rej';updateBadges();toast('rej','Reject sent'+(v?': “'+v.slice(0,34)+'…”':''));});
  }
  d.classList.add('show');
  setCrumbs([{label:'Evidence Ladder',nav:'portfolio'},{label:c.name,nav:'company:'+c.id},{label:'Slice '+s.n,here:true}]);
}
function gateHtml(ap){
  return `
  <div class="fcard">
    <div class="sec-h">The approval gate - L0 · the headline feature</div>
    <p class="serif" style="font-size:15px;color:var(--ink2);margin:0 0 14px">You approve the slice, shown the diff + the live preview + the validation result.</p>
    <div class="preview-url">
      <span>↗ live preview</span>
      <a class="mono" href="${ap.previewUrl}" target="_blank" rel="noopener">${ap.previewUrl}</a>
      <span class="live"><span class="d"></span>live</span>
    </div>
    <div class="diff" style="margin:6px 0 0">${ap.diff.split('\n').map(line=>{const cls=line.startsWith('+')?'add':(line.trim().startsWith('//')?'ctx':'l');return `<div class="l ${cls}">${esc(line)}</div>`;}).join('')}</div>
    <div class="donewhen"><b>doneWhen:</b> ${esc(ap.doneWhen)}</div>
    <div class="grow"><span class="chk"><span class="d"></span>${esc(ap.checkResult)} · attempt ${ap.attempt}</span></div>
    <div class="qacts" style="margin-top:14px">
      <button class="btn primary" id="fApprove">Approve & ship</button>
      <button class="btn ghost" id="fReject">Reject - with feedback</button>
    </div>
    <div class="rejbox" id="fRejBox"><textarea placeholder="What needs to change?"></textarea><div class="row"><button class="btn primary tiny send">Send feedback</button><button class="btn ghost tiny cancel">Cancel</button></div></div>
  </div>`;
}
function nonGateHtml(s,c){
  return `
  <div class="fcard">
    <div class="sec-h">Slice status</div>
    <div class="feat" style="cursor:default"><span class="sdot s-${s.status}"></span><span class="num">${s.n}</span><span class="ft">${esc(s.title)}</span><span class="slabel">${s.status.replace('_',' ')}</span></div>
    ${s.step?`<div class="donewhen" style="margin-top:12px"><b>now:</b> ${esc(s.step)}</div>`:''}
    ${s.note?`<div class="donewhen" style="margin-top:12px;border-color:#e8c8c0;background:#fbeee9"><b>blocked:</b> ${esc(s.note)}</div>`:''}
    ${s.priority?`<div class="donewhen" style="margin-top:12px"><b>priority:</b> ${s.priority}/100${s.dependsOn?` · depends on slice ${s.dependsOn.join(', ')}`:''}</div>`:''}
    ${c.previewUrl?`<div class="preview-url" style="margin-top:12px"><span>↗ preview</span><a class="mono" href="${c.previewUrl}" target="_blank" rel="noopener">${c.previewUrl}</a></div>`:''}
    <p class="serif" style="color:var(--ink3);font-size:13px;margin-top:14px">Evidence: this slice is on rung <b>${rungFor(s.status)}</b> of the ladder.</p>
  </div>`;
}
function rungFor(st){return {shipped:'doneWhen → adoption',building:'live',awaiting_approval:'doneWhen',todo:'score',blocked:'live (stalled)'}[st]||'live';}

/* ============================ crumbs ============================ */
function setCrumbs(items){
  const c=$('#crumbs'); c.innerHTML='';
  items.forEach((it,i)=>{
    if(i>0) c.appendChild(el('span','sep','›'));
    const b=el('button',it.here?'here':'',it.label);
    if(!it.here){b.addEventListener('click',()=>{
      if(it.nav==='portfolio'){closeAll();}
      else if(it.nav&&it.nav.startsWith('company:')){$('#featureDetail').classList.remove('show');openCompany(it.nav.split(':')[1]);}
    });}
    c.appendChild(b);
  });
}
function closeAll(){$('#featureDetail').classList.remove('show');$('#companyDetail').classList.remove('show');setCrumbs([{label:'Evidence Ladder',here:true,nav:'portfolio'}]);}

/* ============================ live activity ============================ */
let activityLog = DATA.activity.map(a=>({...a}));
function renderActivity(){
  const latest = activityLog[0];
  $('#latestLine').innerHTML = `<b>${esc(latest.co)}</b> · ${esc(latest.text)}`;
  const s=$('#actStream'); s.innerHTML='';
  activityLog.forEach(a=>{
    const r=el('div','act-row',`
      ${a.running?'<span class="run"></span>':'<span style="width:7px;flex:none"></span>'}
      <span class="co">${esc(a.co)}</span>
      <span class="kd kd-${a.kind}">${a.kind}</span>
      <span class="tx">${esc(a.text)}</span>
      <span class="t">${esc(a.t)}</span>`);
    s.appendChild(r);
  });
}
function pushActivity(co,kind,text){
  activityLog.unshift({co,kind,text,t:'now'});
  renderActivity();
  $('#activity').classList.add('open');
}
$('#actBar').addEventListener('click',()=>$('#activity').classList.toggle('open'));

/* ============================ keyboard ============================ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#featureDetail').classList.contains('show')){$('#featureDetail').classList.remove('show');}
    else if($('#companyDetail').classList.contains('show')){closeCompany();}
  }
});

/* ============================ toast ============================ */
let toastT;
function toast(kind,msg){
  const t=$('#toast');t.className='toast '+kind+' show';
  t.querySelector('.ic').textContent = kind==='rej'?'↺':kind==='info'?'i':'✓';
  $('#toastMsg').textContent=msg;
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============================ boot ============================ */
renderLadder();
renderQueue();
renderActivity();
</script>
</body>
</html>
