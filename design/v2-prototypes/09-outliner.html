<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop · 09 Outliner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fcfcfb;
    --ink:#16150f;
    --ink-soft:#56544a;
    --ink-faint:#8d8a7e;
    --rule:#e6e3d9;
    --rule-strong:#d3cfc1;
    --guide:#e2ddcd;
    --accent:#2a2926;
    --green:#2f7d4f;
    --green-bg:#eaf4ec;
    --blue:#2f5fae;
    --blue-bg:#e9eefa;
    --violet:#6b46b8;
    --violet-bg:#efe9fa;
    --amber:#9a6a12;
    --amber-bg:#f7eecf;
    --red:#a33232;
    --red-bg:#f7e7e4;
    --slate:#5b6470;
    --slate-bg:#edeef0;
    --gray:#8b887d;
    --highlight:#fdf6dc;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---------- masthead ---------- */
  header.masthead{
    flex:0 0 auto;
    padding:22px 40px 16px;
    border-bottom:1px solid var(--rule-strong);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:30px;
  }
  .masthead .titleblock{display:flex;flex-direction:column;gap:2px}
  .masthead .kicker{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .masthead h1{
    font-weight:500;font-size:30px;letter-spacing:-.01em;margin:0;
    font-feature-settings:"liga" 1;
  }
  .masthead h1 em{font-style:italic;color:var(--ink-soft);font-weight:400}
  .metrics{display:flex;gap:0;align-items:stretch}
  .metric{
    padding:0 18px;text-align:right;border-left:1px solid var(--rule);
  }
  .metric:first-child{border-left:none}
  .metric .v{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.02em}
  .metric .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .metric.alert .v{color:var(--violet)}

  /* ---------- toolbar ---------- */
  .toolbar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:14px;
    padding:9px 40px;border-bottom:1px solid var(--rule);
    background:linear-gradient(#fbfaf6,#f7f5ee);
  }
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);flex:1;min-width:0}
  .crumb a{color:var(--ink-soft);text-decoration:none;cursor:pointer;border-bottom:1px solid transparent}
  .crumb a:hover{color:var(--ink);border-bottom-color:var(--rule-strong)}
  .crumb .sep{color:var(--ink-faint);font-family:var(--mono);font-size:12px}
  .crumb .here{color:var(--ink);font-weight:500}
  .tbtn{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    background:transparent;border:1px solid var(--rule-strong);color:var(--ink-soft);
    padding:5px 11px;border-radius:3px;cursor:pointer;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--ink-faint);color:var(--ink);background:#fff}

  /* ---------- body split ---------- */
  .stage{flex:1 1 auto;display:flex;min-height:0}
  .outline-wrap{
    flex:1 1 auto;min-width:0;overflow:auto;
    padding:14px 40px 120px;
  }
  /* the canvas can grow wider than viewport => horizontal scroll */
  .outline{min-width:760px;width:max-content;max-width:none}

  /* ---------- detail panel (zoom) ---------- */
  .detail{
    flex:0 0 0;width:0;overflow:hidden;
    border-left:1px solid var(--rule-strong);
    background:#faf9f4;
    transition:width .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  body.zoom .detail{width:380px}
  .detail-inner{flex:1 1 auto;overflow:auto;padding:22px 24px 40px;width:380px}
  .detail h2{font-weight:500;font-size:22px;margin:0 0 2px}
  .detail .dom{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
  .detail .thesis{font-size:14.5px;color:var(--ink-soft);font-style:italic;margin:10px 0 16px;line-height:1.5}
  .detail .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:18px}
  .detail .statgrid div{padding:9px 0}
  .detail .statgrid .v{font-family:var(--mono);font-size:16px;font-weight:500}
  .detail .statgrid .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .detail .panel-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin:20px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:5px}

  /* company chat (zoom spine) */
  .chat{display:flex;flex-direction:column;gap:9px}
  .msg{font-size:14px;line-height:1.5;border-radius:8px;padding:9px 12px;max-width:92%}
  .msg.assistant{background:#fff;border:1px solid var(--rule);color:var(--ink)}
  .msg.user{background:var(--ink);color:#f5f3ea;align-self:flex-end}
  .msg .who{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;display:block;margin-bottom:3px}
  .chatbar{display:flex;gap:7px;margin-top:12px}
  .chatbar input{flex:1;font-family:var(--serif);font-size:14px;padding:9px 12px;border:1px solid var(--rule-strong);border-radius:7px;background:#fff;color:var(--ink)}
  .chatbar input:focus{outline:none;border-color:var(--ink-faint)}
  .chatbar button{font-family:var(--mono);font-size:12px;background:var(--ink);color:#f5f3ea;border:none;border-radius:7px;padding:0 14px;cursor:pointer}

  /* ---------- outline rows ---------- */
  .node{position:relative}
  .row{
    display:flex;align-items:baseline;gap:0;
    padding:3px 8px 3px 0;border-radius:4px;
    cursor:default;position:relative;white-space:nowrap;
  }
  .row.clickable{cursor:pointer}
  .row.clickable:hover{background:#f4f2ea}
  .row.needs:hover,.row.needs{background:linear-gradient(90deg,var(--highlight),transparent 75%)}
  .indent{display:inline-block;flex:0 0 auto;position:relative}
  /* hairline indent guide */
  .guide-col{position:relative;width:22px;flex:0 0 22px;display:inline-block}
  .guide-col::before{
    content:"";position:absolute;left:9px;top:-3px;bottom:-3px;width:1px;background:var(--guide);
  }
  .tri{
    flex:0 0 18px;width:18px;text-align:center;color:var(--ink-faint);
    font-family:var(--mono);font-size:10px;cursor:pointer;user-select:none;
    transition:transform .12s ease;display:inline-block;line-height:1.4;
  }
  .tri.open{transform:rotate(90deg)}
  .tri.leaf{visibility:hidden}
  .bullet{flex:0 0 14px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.4}
  .label{font-size:15.5px;color:var(--ink);padding-right:14px}
  .label .slicen{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-right:8px}
  .row.lvl0 .label{font-size:19px;font-weight:500;letter-spacing:-.01em}
  .row.lvl1 .label{font-size:16.5px}
  .label .sub{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-left:8px}
  .spacer{flex:1 1 auto;min-width:24px}
  /* right-aligned terse mono tags */
  .tag{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
    padding:1px 7px;border-radius:3px;flex:0 0 auto;
    border:1px solid transparent;
  }
  .tag.shipped{color:var(--green);background:var(--green-bg)}
  .tag.building{color:var(--blue);background:var(--blue-bg)}
  .tag.awaiting,.tag.needs-you{color:var(--violet);background:var(--violet-bg)}
  .tag.todo{color:var(--slate);background:var(--slate-bg)}
  .tag.blocked{color:var(--red);background:var(--red-bg)}
  .tag.active{color:var(--green);background:var(--green-bg)}
  .tag.paused{color:var(--amber);background:var(--amber-bg)}
  .tag.archived{color:var(--gray);background:var(--slate-bg)}
  .tag.score{color:var(--ink);background:transparent;border-color:var(--rule-strong)}
  .tag.killed{color:var(--gray);background:var(--slate-bg);text-decoration:line-through}
  .tag.dim{color:var(--ink-faint);background:transparent;font-size:10px}
  .pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:5px;vertical-align:middle;animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(47,95,174,.4)}50%{opacity:.35;box-shadow:0 0 0 4px rgba(47,95,174,0)}}

  .focus-btn{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-faint);border:1px solid var(--rule);background:transparent;
    border-radius:3px;padding:1px 7px;cursor:pointer;margin-left:10px;flex:0 0 auto;
    opacity:0;transition:opacity .12s;
  }
  .row:hover .focus-btn{opacity:1}
  .focus-btn:hover{color:var(--ink);border-color:var(--ink-faint);background:#fff}

  .children{display:none}
  .node.open>.children{display:block}

  /* metric crumbs under company row */
  .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;margin-left:14px}
  .meta b{color:var(--ink-soft);font-weight:500}

  /* run / checkpoint detail leaf */
  .detail-leaf{
    font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
    white-space:nowrap;padding-right:8px;
  }
  .detail-leaf .k{color:var(--ink-faint)}
  .detail-leaf .sha{color:var(--ink)}

  /* ---------- inline approval gate ---------- */
  .gate{
    margin:6px 0 10px;border:1px solid var(--rule-strong);border-radius:8px;
    background:#fff;max-width:880px;overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .gate-head{
    display:flex;align-items:center;gap:10px;padding:9px 14px;
    background:var(--violet-bg);border-bottom:1px solid var(--rule);
  }
  .gate-head .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);font-weight:600}
  .gate-head .ttl{font-size:14px;color:var(--ink);font-weight:500}
  .gate-body{padding:14px;display:flex;flex-direction:column;gap:12px}
  .gate-field{display:flex;flex-direction:column;gap:4px}
  .gate-field .fk{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .preview-url{
    font-family:var(--mono);font-size:12.5px;color:var(--blue);text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;
  }
  .preview-url:hover{text-decoration:underline}
  .preview-url .live{font-size:9px;background:var(--green);color:#fff;border-radius:3px;padding:1px 5px;letter-spacing:.1em;text-transform:uppercase}
  .donewhen{
    display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
    background:var(--green-bg);border:1px solid #cfe6d6;border-radius:6px;padding:8px 11px;color:var(--green);
  }
  .donewhen .check{
    flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);
  }
  .donewhen .meta2{margin-left:auto;color:var(--ink-faint);font-size:10.5px}
  .diff{
    font-family:var(--mono);font-size:12px;line-height:1.65;background:#fbfaf6;
    border:1px solid var(--rule);border-radius:6px;padding:11px 13px;overflow-x:auto;white-space:pre;color:var(--ink-soft);
  }
  .diff .add{color:var(--green);background:rgba(47,125,79,.07);display:block}
  .diff .ctx{color:var(--ink-faint);display:block}
  .gate-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:.02em;border-radius:6px;
    padding:8px 16px;cursor:pointer;border:1px solid transparent;
  }
  .btn.approve{background:var(--green);color:#fff}
  .btn.approve:hover{background:#286b44}
  .btn.reject{background:#fff;color:var(--red);border-color:#e2c4be}
  .btn.reject:hover{background:var(--red-bg)}
  .gate-confirm{font-family:var(--mono);font-size:12px;font-weight:600;opacity:0;transition:opacity .2s}
  .gate-confirm.show{opacity:1}
  .gate-confirm.ok{color:var(--green)}
  .gate-confirm.rej{color:var(--red)}
  .reject-box{display:none;flex-direction:column;gap:7px;width:100%;margin-top:4px}
  .reject-box.show{display:flex}
  .reject-box textarea{
    font-family:var(--serif);font-size:13.5px;border:1px solid var(--rule-strong);border-radius:6px;
    padding:8px 10px;resize:vertical;min-height:54px;background:#fff;color:var(--ink);
  }
  .reject-box textarea:focus{outline:none;border-color:var(--ink-faint)}
  .reject-box .send{align-self:flex-start;font-family:var(--mono);font-size:11px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer}

  /* opportunities promote */
  .opp-row .promote{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--green);color:var(--green);background:transparent;border-radius:3px;
    padding:1px 8px;cursor:pointer;margin-left:10px;flex:0 0 auto;opacity:0;transition:opacity .12s;
  }
  .opp-row:hover .promote{opacity:1}
  .opp-row .promote:hover{background:var(--green);color:#fff}
  .opp-row.promoted .promote{opacity:1;border-color:var(--ink-faint);color:var(--ink-faint)}

  /* ---------- global command bar (overview spine) ---------- */
  .cmdbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:11px 40px;border-top:1px solid var(--rule-strong);
    background:linear-gradient(#f7f5ee,#f1eee4);
  }
  body.zoom .cmdbar{display:none}
  .cmd-prompt{font-family:var(--mono);font-size:14px;color:var(--ink-faint)}
  .cmdbar input{
    flex:1;font-family:var(--serif);font-size:15px;background:#fff;border:1px solid var(--rule-strong);
    border-radius:8px;padding:10px 14px;color:var(--ink);
  }
  .cmdbar input:focus{outline:none;border-color:var(--ink-faint)}
  .cmdbar .hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em}

  /* ---------- live activity strip ---------- */
  .activity{
    flex:0 0 auto;border-top:1px solid var(--rule-strong);background:#16150f;color:#e8e5d8;
  }
  .act-head{
    display:flex;align-items:center;gap:12px;padding:8px 40px;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;
  }
  .act-head .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.3s infinite;flex:0 0 auto}
  .act-head .latest{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d9d6c8}
  .act-head .latest .co{color:#fff;font-weight:600}
  .act-head .label{color:#8d8a7e;letter-spacing:.16em;text-transform:uppercase;font-size:9.5px}
  .act-head .toggle{color:#b6b3a4;font-size:10px}
  .act-stream{display:none;max-height:0;overflow:auto;transition:max-height .25s ease}
  .activity.open .act-stream{display:block;max-height:230px;padding:4px 40px 14px}
  .act-group{margin-top:12px}
  .act-group .gh{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#a8a594;border-bottom:1px solid #2e2c22;padding-bottom:3px;margin-bottom:5px}
  .act-line{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;padding:2px 0;color:#cfccbe}
  .act-line .t{color:#7d7a6b;width:38px;flex:0 0 38px;text-align:right}
  .act-line .rdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:#4d4a3c}
  .act-line.running .rdot{background:var(--blue);animation:pulse 1.3s infinite}
  .act-line.await .rdot{background:var(--violet)}
  .act-line.blocked .rdot{background:var(--red)}
  .act-line.check .rdot{background:var(--green)}
  .act-line .txt{flex:1}

  /* corner badge */
  .badge{
    position:fixed;right:14px;bottom:14px;z-index:50;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    background:var(--ink);color:#f3f1e6;padding:4px 9px;border-radius:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none;
  }

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="titleblock">
      <div class="kicker">C Slop Slop — Founder Command Center</div>
      <h1>The Portfolio <em>Outline</em></h1>
    </div>
    <div class="metrics" id="metrics"></div>
  </header>

  <div class="toolbar">
    <div class="crumb" id="crumb"></div>
    <button class="tbtn" id="expandAll">expand all</button>
    <button class="tbtn" id="collapseAll">collapse all</button>
  </div>

  <div class="stage">
    <div class="outline-wrap">
      <div class="outline" id="outline"></div>
    </div>
    <aside class="detail">
      <div class="detail-inner" id="detail"></div>
    </aside>
  </div>

  <div class="cmdbar">
    <span class="cmd-prompt">⌘</span>
    <input id="cmdInput" placeholder="Direct the portfolio…  e.g. “promote PayoutReconciler”, “approve LeadSift slice 5”">
    <span class="hint">⏎ to send · chat is the spine</span>
  </div>

  <section class="activity" id="activity">
    <div class="act-head" id="actHead">
      <span class="dot"></span>
      <span class="latest" id="actLatest"></span>
      <span class="label">live activity</span>
      <span class="toggle" id="actToggle">▴ expand</span>
    </div>
    <div class="act-stream" id="actStream"></div>
  </section>

</div>
<div class="badge">09 · Outliner</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress — same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fakeSha = seed => {
  const h = ('00000'+(Math.abs([...String(seed)].reduce((a,c)=>a*31+c.charCodeAt(0),7))%0xffffff).toString(16)).slice(-7);
  return h;
};
const sliceTag = st => ({
  shipped:'shipped', building:'building', awaiting_approval:'needs-you',
  todo:'todo', blocked:'blocked'
}[st] || st);

/* indent guide columns: produce N guide-col spans */
function guides(depth){
  let s='';
  for(let i=0;i<depth;i++) s+='<span class="guide-col"></span>';
  return s;
}
function tri(open, leaf){
  return `<span class="tri ${leaf?'leaf':''} ${open?'open':''}">▶</span>`;
}

/* ====================================================================== */
/* STATE                                                                  */
/* ====================================================================== */
let zoomCompany = null; // id of focused company, or null = portfolio root

/* ====================================================================== */
/* RENDER OUTLINE                                                         */
/* ====================================================================== */
function render(){
  document.body.classList.toggle('zoom', !!zoomCompany);
  renderMetrics();
  renderCrumb();
  renderOutline();
  if(zoomCompany) renderDetail(); else document.getElementById('detail').innerHTML='';
}

function renderMetrics(){
  const p = DATA.portfolio;
  document.getElementById('metrics').innerHTML = [
    ['$'+p.mrr,'mrr'],
    [p.users,'users'],
    [p.activeCompanies,'active cos'],
    [p.slicesShipped,'slices'],
  ].map(([v,k])=>`<div class="metric"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')
   + `<div class="metric alert"><div class="v">${p.needsYou}</div><div class="k">needs you</div></div>`;
}

function renderCrumb(){
  const c = document.getElementById('crumb');
  if(!zoomCompany){
    c.innerHTML = `<span class="here">▸ Portfolio</span>`;
  } else {
    const co = DATA.companies.find(x=>x.id===zoomCompany);
    c.innerHTML = `<a id="rootCrumb">Portfolio</a><span class="sep">/</span><span class="here">${esc(co.name)}</span>`;
    c.querySelector('#rootCrumb').onclick = ()=>{ zoomCompany=null; render(); };
  }
}

function renderOutline(){
  const root = document.getElementById('outline');
  if(zoomCompany){
    const co = DATA.companies.find(x=>x.id===zoomCompany);
    root.innerHTML = companyNode(co, 0, true);
  } else {
    root.innerHTML = portfolioNode() + opportunitiesNode();
  }
  wireOutline(root);
}

/* ---- Portfolio root node ---- */
function portfolioNode(){
  const cos = DATA.companies.map(c=>companyNode(c,1,false)).join('');
  const nm = DATA.nextMoves.map((m,i)=>
    `<div class="node"><div class="row lvl2">
       ${guides(2)}${tri(false,true)}<span class="bullet">·</span>
       <span class="label">${esc(m)}</span><span class="spacer"></span>
       <span class="tag dim">move ${i+1}</span></div></div>`).join('');
  return `<div class="node open" data-node="portfolio">
    <div class="row lvl0 clickable" data-toggle>
      ${tri(true,false)}<span class="bullet">◆</span>
      <span class="label">Portfolio</span>
      <span class="spacer"></span>
      <span class="meta"><b>5</b> companies · <b>$695</b> mrr · <b>22</b> bagged</span>
    </div>
    <div class="children">
      ${cos}
      <div class="node open" data-node="nextmoves">
        <div class="row lvl1 clickable" data-toggle>
          ${guides(1)}${tri(true,false)}<span class="bullet">▷</span>
          <span class="label">Next moves<span class="sub">what to do now</span></span>

}

/* ---- Opportunities top-level node ---- */
function opportunitiesNode(){

    const killed = o.status==='killed';
    return `<div class="node"><div class="row lvl1 opp-row ${killed?'':'clickable'}" ${killed?'':'data-toggle'}>
      ${guides(1)}${tri(false, killed)}<span class="bullet">·</span>
      <span class="label">${esc(o.title)}<span class="sub">${esc(o.thesis)}</span></span>
      <span class="spacer"></span>
      <span class="tag score">score ${o.score}</span>
      ${killed?'<span class="tag killed">killed</span>'
              :`<button class="promote" data-promote="${o.id}">promote ↗</button>`}
      ${killed?'':`<div class="children">
        <div class="node"><div class="row lvl2">${guides(2)}${tri(false,true)}<span class="bullet">·</span>
          <span class="detail-leaf"><span class="k">thought —</span> “${esc(o.thought)}”</span></div></div>
      </div>`}

  }).join('');
  return `<div class="node open" data-node="opps" style="margin-top:18px">

      ${tri(true,false)}<span class="bullet">◇</span>
      <span class="label">Opportunities<span class="sub">cheap, scored — promote the winners</span></span>
      <span class="spacer"></span>
      <span class="meta"><b>3</b> candidates · <b>1</b> killed</span>
    </div>
    <div class="children">${cands}</div>

}

/* ---- Company node (works at portfolio depth 1, or as root in zoom) ---- */
function companyNode(co, depth, asRoot){
  const stTag = `<span class="tag ${co.status}">${co.status}</span>`;
  const needsTag = co.needsYou ? `<span class="tag needs-you">needs-you</span>` : '';
  const head =
    `<div class="row lvl${depth===0?0:1} clickable" data-toggle>
       ${guides(depth)}${tri(asRoot,false)}<span class="bullet">${depth===0?'◆':'▸'}</span>
       <span class="label">${esc(co.name)}<span class="sub">${esc(co.thesis)}</span></span>
       <span class="spacer"></span>
       <span class="meta">$${co.mrr} · ${co.users}u · ${co.slices?co.slices.length:('+'+(co.slicesShipped||0))} slices</span>
       ${needsTag}${stTag}
       ${asRoot?'':`<button class="focus-btn" data-focus="${co.id}">focus →</button>`}
     </div>`;

  // build slice children
  let sliceRows;
  if(co.slices){
    sliceRows = co.slices.map(s=>sliceNode(co, s, depth+1)).join('');
  } else if(co.currentSlice){
    const s = co.currentSlice;
    const shippedLeaf = `<div class="node"><div class="row lvl${depth+1}">
        ${guides(depth+1)}${tri(false,true)}<span class="bullet">·</span>
        <span class="detail-leaf"><span class="k">shipped —</span> ${co.slicesShipped} slices bagged · <span class="sha">@${fakeSha(co.id)}</span></span>
      </div></div>`;
    sliceRows = shippedLeaf + sliceNode(co, s, depth+1, true);
  } else {
    sliceRows = '';
  }

  return `<div class="node ${asRoot?'open':''}" data-node="${co.id}">
    ${head}
    <div class="children">${sliceRows}</div>
  </div>`;
}

/* ---- Slice node (with run/checkpoint detail + inline gate for LeadSift #5) ---- */
function sliceNode(co, s, depth, isCurrent){
  const tg = sliceTag(s.status);
  const building = s.status==='building';
  const prio = s.priority!=null ? `<span class="tag dim">prio ${s.priority}</span>` : '';
  const dep = s.dependsOn ? `<span class="tag dim">needs #${s.dependsOn.join(',#')}</span>` : '';
  const num = s.n!=null ? `<span class="slicen">#${String(s.n).padStart(2,'0')}</span>` : '';
  const isGate = co.id==='leadsift' && s.status==='awaiting_approval';

  // run / checkpoint detail leaf line
  let detailLeaf='';
  if(s.status==='shipped'){
    detailLeaf = leafRow(depth+1, `<span class="k">run ok —</span> doneWhen ✓ · live · <span class="sha">@${fakeSha(co.id+s.n)}</span>`);
  } else if(building){
    detailLeaf = leafRow(depth+1, `<span class="k">building —</span> ${esc(s.step||'in progress')}`, 'building');
  } else if(s.status==='blocked'){
    detailLeaf = leafRow(depth+1, `<span class="k" style="color:var(--red)">blocked —</span> ${esc(s.note||s.step||'no progress')}`, 'blocked');
  } else if(s.status==='todo'){
    detailLeaf = leafRow(depth+1, `<span class="k">queued —</span> ${esc(s.step||'awaiting top-priority pull')}`);
  } else if(isGate){
    detailLeaf = leafRow(depth+1, `<span class="k">checkpoint —</span> attempt ${co.approval.attempt} · doneWhen <span style="color:var(--green)">passed</span> · <span class="sha">@${fakeSha(co.id+'gate')}</span>`, 'check');
  }

  const children = isGate
    ? detailLeaf + gateNode(co, depth+1)
    : detailLeaf;

  const open = (building || isGate) ? 'open' : '';

  return `<div class="node ${open}" data-node="${co.id}-s${s.n}">
    <div class="row lvl1 clickable ${isGate?'needs':''}" data-toggle>
      ${guides(depth)}${tri(!!open,false)}<span class="bullet">${building?'<span class="pulse-dot"></span>':'·'}</span>
      <span class="label">${num}${esc(s.title)}</span>
      <span class="spacer"></span>
      ${dep}${prio}<span class="tag ${tg}">[${tg}]</span>
    </div>
    <div class="children">${children}</div>
  </div>`;
}

function leafRow(depth, html, cls){
  return `<div class="node"><div class="row lvl2">
    ${guides(depth)}${tri(false,true)}<span class="bullet">${cls==='building'?'<span class="pulse-dot"></span>':'·'}</span>
    <span class="detail-leaf">${html}</span>
  </div></div>`;
}

/* ---- Inline approval GATE node ---- */
function gateNode(co, depth){
  const a = co.approval;
  const diffHtml = a.diff.split('\n').map(l=>{
    if(l.startsWith('+')) return `<span class="add">${esc(l)}</span>`;
    return `<span class="ctx">${esc(l)}</span>`;
  }).join('');
  return `<div class="node"><div class="row" style="display:block;padding-left:${22*depth+16}px">
    <div class="gate">
      <div class="gate-head">
        <span class="lbl">▢ approval gate · L0</span>
        <span class="ttl">${esc(a.title)}</span>
      </div>
      <div class="gate-body">
        <div class="gate-field">
          <span class="fk">live preview</span>
          <a class="preview-url" href="${a.previewUrl}" target="_blank" rel="noopener">
            <span class="live">live</span>${esc(a.previewUrl)} ↗</a>
        </div>
        <div class="gate-field">
          <span class="fk">doneWhen check</span>
          <div class="donewhen">
            <span class="check">✓</span>
            <span>${esc(a.doneWhen)}</span>
            <span class="meta2">passed · attempt ${a.attempt}</span>
          </div>
        </div>
        <div class="gate-field">
          <span class="fk">diff · slice ${a.slice}</span>
          <div class="diff">${diffHtml}</div>
        </div>
        <div class="gate-actions">
          <button class="btn approve" id="gateApprove">Approve ✓</button>
          <button class="btn reject" id="gateReject">Reject with feedback</button>
          <span class="gate-confirm" id="gateConfirm"></span>
        </div>
        <div class="reject-box" id="rejectBox">
          <textarea id="rejectText" placeholder="What needs to change? (sent back to the build loop as feedback)"></textarea>
          <button class="send" id="rejectSend">Send feedback ↩</button>
        </div>
      </div>
    </div>
  </div></div>`;
}

function renderDetail(){
  const co = DATA.companies.find(x=>x.id===zoomCompany);
  const d = document.getElementById('detail');
  const chat = DATA.chat.map(m=>
    `<div class="msg ${m.role}"><span class="who">${m.role}</span>${esc(m.text)}</div>`).join('');
  const preview = co.previewUrl
    ? `<a class="preview-url" href="${co.previewUrl}" target="_blank" rel="noopener"><span class="live">live</span>${esc(co.previewUrl)} ↗</a>`
    : `<span class="detail-leaf"><span class="k">no preview yet</span></span>`;
  d.innerHTML = `
    <h2>${esc(co.name)} <span class="tag ${co.status}" style="vertical-align:middle">${co.status}</span></h2>
    <div class="dom">${co.domain?esc(co.domain):'— no domain —'}</div>
    <div class="thesis">${esc(co.thesis)}</div>
    <div class="statgrid">
      <div><div class="v">$${co.mrr}</div><div class="k">mrr</div></div>
      <div><div class="v">${co.users}</div><div class="k">users</div></div>
      <div><div class="v">${co.slices?co.slices.filter(s=>s.status==='shipped').length:(co.slicesShipped||0)}</div><div class="k">bagged</div></div>
    </div>
    <div class="panel-label">live product</div>
    ${preview}
    <div class="panel-label">company chat — the spine</div>
    <div class="chat">${chat}</div>
    <div class="chatbar">
      <input id="coChat" placeholder="Direct ${esc(co.name)}…">
      <button id="coChatSend">↩</button>
    </div>`;
  const send = ()=>{
    const inp = d.querySelector('#coChat'); const v = inp.value.trim(); if(!v) return;
    const chatEl = d.querySelector('.chat');
    chatEl.insertAdjacentHTML('beforeend', `<div class="msg user"><span class="who">user</span>${esc(v)}</div>`);
    inp.value='';
    setTimeout(()=>{
      chatEl.insertAdjacentHTML('beforeend', `<div class="msg assistant"><span class="who">assistant</span>On it — directing ${esc(co.name)} to “${esc(v)}”. I’ll surface a slice + preview when it’s live.</div>`);
      chatEl.lastChild.scrollIntoView({block:'nearest'});
    },350);
  };
  d.querySelector('#coChatSend').onclick = send;
  d.querySelector('#coChat').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
}

/* ====================================================================== */
/* WIRING                                                                 */
/* ====================================================================== */
function wireOutline(root){
  // toggle disclosure
  root.querySelectorAll('[data-toggle]').forEach(rowEl=>{
    rowEl.addEventListener('click', e=>{
      if(e.target.closest('.focus-btn')||e.target.closest('.promote')||e.target.closest('a')||e.target.closest('.gate')) return;
      const node = rowEl.closest('.node');
      node.classList.toggle('open');
      const t = rowEl.querySelector('.tri'); if(t && !t.classList.contains('leaf')) t.classList.toggle('open');
    });
  });
  // focus → zoom company
  root.querySelectorAll('[data-focus]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); zoomCompany = b.dataset.focus; render(); });
  });
  // promote opportunity
  root.querySelectorAll('[data-promote]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const oppRow = b.closest('.opp-row');
      oppRow.classList.add('promoted');
      b.textContent = 'promoted ✓ → company';
      flashCmd(`Promoting “${b.closest('.node').querySelector('.label').firstChild.textContent}” to a company…`);
    });
  });
  // approval gate
  const ap = root.querySelector('#gateApprove');
  if(ap){
    const confirm = root.querySelector('#gateConfirm');
    const rejBtn = root.querySelector('#gateReject');
    const rejBox = root.querySelector('#rejectBox');
    ap.onclick = ()=>{
      confirm.textContent = 'Approved ✓ — shipping live'; confirm.className='gate-confirm ok show';
      ap.disabled=true; ap.style.opacity=.6; rejBox.classList.remove('show');
    };
    rejBtn.onclick = ()=>{ rejBox.classList.toggle('show'); confirm.className='gate-confirm'; const t=root.querySelector('#rejectText'); if(rejBox.classList.contains('show')) t.focus(); };
    root.querySelector('#rejectSend').onclick = ()=>{
      const t = root.querySelector('#rejectText'); const v=t.value.trim();
      confirm.textContent = v ? 'Rejected ✗ — feedback sent to build loop' : 'Rejected ✗ — sent back';
      confirm.className='gate-confirm rej show';
      rejBox.classList.remove('show'); t.value='';
    };
  }
}

/* expand / collapse all */
document.getElementById('expandAll').onclick = ()=>{
  document.querySelectorAll('#outline .node').forEach(n=>{ n.classList.add('open'); const t=n.querySelector(':scope > .row .tri'); if(t&&!t.classList.contains('leaf'))t.classList.add('open'); });
};
document.getElementById('collapseAll').onclick = ()=>{
  document.querySelectorAll('#outline .node').forEach(n=>{
    // keep top-level roots open, collapse the rest
    const isRoot = n.dataset.node==='portfolio'||n.dataset.node==='opps'||n.dataset.node===zoomCompany;
    if(!isRoot){ n.classList.remove('open'); const t=n.querySelector(':scope > .row .tri'); if(t)t.classList.remove('open'); }
  });
};

/* ---------- global command bar ---------- */
function flashCmd(msg){
  const i = document.getElementById('cmdInput');
  const old = i.placeholder; i.value=''; i.placeholder = msg;
  i.style.transition='none'; i.style.borderColor='var(--green)';
  setTimeout(()=>{ i.style.transition='border-color .8s'; i.style.borderColor=''; i.placeholder=old; }, 2200);
}
document.getElementById('cmdInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.value.trim()){
    const v=e.target.value.trim(); e.target.value='';
    flashCmd(`✓ sent to the loop: “${v}”`);
  }
});

/* ---------- live activity strip ---------- */
function renderActivity(){
  // collapsed: latest line per actively-building company (running:true), else single latest
  const building = DATA.activity.filter(a=>a.running);
  const latest = building.length ? building : [DATA.activity[0]];
  document.getElementById('actLatest').innerHTML = latest.map(a=>
    `<span class="co">${esc(a.co)}</span> · ${esc(a.text)}`).join('   ·   ');

  // expanded: grouped by company
  const groups = {};
  DATA.activity.forEach(a=>{ (groups[a.co]=groups[a.co]||[]).push(a); });
  const html = Object.keys(groups).map(co=>{
    const lines = groups[co].map(a=>
      `<div class="act-line ${a.running?'running':''} ${a.kind}">
        <span class="t">${esc(a.t)}</span><span class="rdot"></span>
        <span class="txt">${esc(a.text)}</span></div>`).join('');
    return `<div class="act-group"><div class="gh">${esc(co)}</div>${lines}</div>`;
  }).join('');
  document.getElementById('actStream').innerHTML = html;
}
const actEl = document.getElementById('activity');
document.getElementById('actHead').onclick = ()=>{
  actEl.classList.toggle('open');
  document.getElementById('actToggle').textContent = actEl.classList.contains('open') ? '▾ collapse' : '▴ expand';
};

/* ---------- esc to leave zoom ---------- */
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && zoomCompany){ zoomCompany=null; render(); } });

/* ---------- boot ---------- */
renderActivity();
render();
