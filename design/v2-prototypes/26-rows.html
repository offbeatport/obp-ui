<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop · 26 · Rows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfa;
    --panel:#ffffff;
    --line:#ececeb;
    --line-2:#f3f3f2;
    --ink:#1b1b1a;
    --ink-2:#6d6d6a;
    --ink-3:#a3a3a0;
    --accent:#5b5bff;
    --accent-soft:#eeeeff;
    --green:#2fa56a;
    --green-soft:#e6f5ec;
    --amber:#d99115;
    --amber-soft:#fbf1dd;
    --violet:#7c5cff;
    --violet-soft:#efeaff;
    --blue:#2f6df0;
    --blue-soft:#e6eefd;
    --slate:#9aa0aa;
    --red:#df4444;
    --red-soft:#fbe7e7;
    --radius:9px;
    --radius-sm:6px;
    --row-h:34px;
    --shadow:0 1px 2px rgba(20,20,20,.04),0 8px 28px rgba(20,20,20,.08);
    --shadow-sm:0 1px 2px rgba(20,20,20,.05);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:13px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.01em;
    overflow:hidden;
  }
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#dcdcdb;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#cacac9}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;width:100vw}
  .topbar{
    display:flex;align-items:center;gap:14px;height:48px;flex:0 0 48px;
    padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);
    position:relative;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
  .brand .sub{color:var(--ink-3);font-weight:450}
  .seg{display:flex;background:var(--line-2);border-radius:8px;padding:2px;gap:1px}
  .seg button{
    font-size:12px;font-weight:500;color:var(--ink-2);padding:4px 12px;border-radius:6px;
    transition:all .14s ease;
  }
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
  .grow{flex:1}
  .cmd{
    display:flex;align-items:center;gap:9px;height:32px;width:340px;
    border:1px solid var(--line);border-radius:8px;padding:0 11px;background:var(--bg);
    color:var(--ink-3);font-size:12.5px;transition:border-color .14s ease,background .14s ease;
  }
  .cmd:hover{border-color:#dcdcdb;background:var(--panel)}
  .cmd input{flex:1;border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none}
  .cmd input::placeholder{color:var(--ink-3)}
  .kbd{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-2);
    background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;min-width:18px;text-align:center;
  }
  .topbar .kbd{background:var(--line-2);border-color:var(--line)}
  .needs-pill{
    display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:7px;
    cursor:pointer;transition:filter .14s ease;
  }
  .needs-pill:hover{filter:brightness(.97)}
  .needs-pill .ndot{width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 0 rgba(124,92,255,.5);animation:pulse 1.8s infinite}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;min-height:0;position:relative}
  .center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

  /* portfolio metric strip */
  .metrics{
    display:flex;gap:0;padding:14px 18px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .metric{padding-right:34px;margin-right:0}
  .metric .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .metric .l{font-size:11px;color:var(--ink-3);margin-top:1px;font-weight:450}
  .metric .v small{font-size:12px;color:var(--ink-3);font-weight:500}

  /* section headers */
  .listhead{
    display:flex;align-items:center;gap:9px;padding:11px 18px 7px;
    color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  }
  .listhead .count{font-family:var(--mono);background:var(--line-2);color:var(--ink-2);border-radius:5px;padding:0 5px;font-size:10.5px;letter-spacing:0}
  .listhead .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:450;font-size:11px;display:flex;align-items:center;gap:5px}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden}

  /* ---------- rows ---------- */
  .rows{padding:0 10px}
  .row{
    display:grid;
    grid-template-columns:18px 158px 1fr 116px 78px 22px;
    align-items:center;gap:10px;
    height:var(--row-h);padding:0 8px;border-radius:7px;
    cursor:pointer;position:relative;
    transition:background .12s ease;
  }
  .row:hover{background:var(--line-2)}
  .row.sel{background:var(--accent-soft)}
  .row.sel::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--accent)}
  .glyph{display:flex;align-items:center;justify-content:center}
  .gd{width:8px;height:8px;border-radius:50%}
  .gd.active{background:var(--green)}
  .gd.paused{background:var(--amber)}
  .gd.archived{background:var(--slate)}
  .gd.building{background:var(--blue);box-shadow:0 0 0 0 rgba(47,109,240,.5);animation:pulse 1.6s infinite}
  .gd.await{background:var(--violet);box-shadow:0 0 0 0 rgba(124,92,255,.55);animation:pulse 1.6s infinite}
  .gd.blocked{background:var(--red)}
  .cname{font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cslice{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  .cslice .sn{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .chip{
    justify-self:start;display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:550;padding:2px 8px;border-radius:20px;white-space:nowrap;
    font-family:var(--mono);letter-spacing:0;
  }
  .chip.shipped{color:var(--green);background:var(--green-soft)}
  .chip.building{color:var(--blue);background:var(--blue-soft)}
  .chip.await{color:var(--violet);background:var(--violet-soft)}
  .chip.todo{color:var(--ink-2);background:var(--line-2)}
  .chip.blocked{color:var(--red);background:var(--red-soft)}
  .cmrr{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  .cmrr.zero{color:var(--ink-3)}
  .cmrr small{color:var(--ink-3);font-size:11px}
  .needsmark{display:flex;align-items:center;justify-content:center}
  .needsmark .nm{
    font-size:9px;font-weight:700;color:#fff;background:var(--violet);
    width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 0 rgba(124,92,255,.5);animation:pulse 1.8s infinite;
  }

  /* opportunities rows */
  .row.opp{grid-template-columns:18px 1fr 90px 64px 92px}
  .oscore{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .oscore.hi{color:var(--green)}.oscore.mid{color:var(--amber)}.oscore.lo{color:var(--ink-3)}
  .obar{height:4px;border-radius:3px;background:var(--line-2);overflow:hidden;align-self:center}
  .obar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .promote{
    justify-self:end;font-size:11px;font-weight:550;color:var(--accent);
    border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;
    transition:all .14s ease;white-space:nowrap;
  }
  .promote:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .promote.killed{color:var(--ink-3);pointer-events:none;border-style:dashed}
  .othought{color:var(--ink-3);font-size:11.5px;font-style:italic}

  /* next moves */
  .moves{padding:4px 18px 20px}
  .move{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
  .move:last-child{border-bottom:none}
  .move .mn{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--line-2);border-radius:5px;padding:1px 6px;margin-top:1px}

  /* ---------- peek panel (right) ---------- */
  .peek{
    width:0;flex:0 0 0;overflow:hidden;background:var(--panel);
    border-left:1px solid var(--line);
    transition:width .22s cubic-bezier(.4,0,.2,1),flex-basis .22s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .peek.open{width:416px;flex:0 0 416px}
  .peek.zoom{width:560px;flex:0 0 560px}
  .peekwrap{width:416px;flex:1;display:flex;flex-direction:column;min-height:0}
  .peek.zoom .peekwrap{width:560px}
  .peekhead{
    flex:0 0 auto;padding:16px 18px 14px;border-bottom:1px solid var(--line);
  }
  .peekhead .top{display:flex;align-items:center;gap:9px}
  .peekhead h2{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .peekhead .esc{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:11px}
  .peekhead .esc:hover{color:var(--ink)}
  .peekhead .domain{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:3px;display:block}
  .peekhead .thesis{color:var(--ink-2);font-size:12.5px;margin-top:7px}
  .peekstats{display:flex;gap:22px;margin-top:13px}
  .peekstats .s .v{font-family:var(--mono);font-size:15px;font-weight:600}
  .peekstats .s .l{font-size:10.5px;color:var(--ink-3)}
  .peekbody{flex:1;overflow-y:auto;padding:14px 18px 18px}
  .sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 0 9px;display:flex;align-items:center;gap:8px}
  .sub:not(:first-child){margin-top:20px}

  /* slice list in peek */
  .slice{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;font-size:12.5px;transition:background .12s ease}
  .slice:hover{background:var(--line-2)}
  .slice .sn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:18px}
  .slice .st{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slice.done .st{color:var(--ink-2)}
  .slice .micro{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .micro.shipped{background:var(--green)}.micro.building{background:var(--blue);animation:pulse 1.6s infinite}
  .micro.await{background:var(--violet);animation:pulse 1.6s infinite}.micro.todo{background:var(--slate)}.micro.blocked{background:var(--red)}

  /* ---------- approval gate ---------- */
  .gate{
    border:1px solid var(--violet);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 0 0 4px var(--violet-soft);margin-top:4px;
  }
  .gatehead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--violet-soft)}
  .gatehead .badge{font-size:10px;font-weight:700;color:#fff;background:var(--violet);border-radius:5px;padding:2px 7px;letter-spacing:.03em}
  .gatehead .gt{font-weight:550;font-size:12.5px}
  .gatehead .att{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .gatesec{padding:11px 13px;border-top:1px solid var(--line)}
  .gatesec .label{font-size:10.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .previewbar{
    display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;
    border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg);
    color:var(--accent);text-decoration:none;transition:border-color .14s ease;
  }
  .previewbar:hover{border-color:var(--accent)}
  .previewbar .live{display:flex;align-items:center;gap:5px;color:var(--green);font-size:10px;font-weight:600;margin-left:auto;font-family:'Inter'}
  .previewbar .live .d{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  .checkbox{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;background:var(--green-soft);border-radius:7px;padding:8px 10px;color:#1c7d4e}
  .checkbox .ok{font-weight:700}
  .checkbox .pass{margin-left:auto;background:var(--green);color:#fff;border-radius:5px;padding:1px 8px;font-size:10px;font-weight:600;font-family:'Inter';letter-spacing:.03em}
  .diff{
    font-family:var(--mono);font-size:11.5px;line-height:1.65;
    background:#fafafa;border:1px solid var(--line);border-radius:7px;
    padding:9px 0;overflow-x:auto;
  }
  .diff .dl{padding:0 12px;white-space:pre;display:block}
  .diff .add{background:var(--green-soft);color:#1c7d4e}
  .diff .ctx{color:var(--ink-3)}
  .gateact{display:flex;gap:9px;padding:12px 13px;border-top:1px solid var(--line);background:var(--bg)}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    height:36px;border-radius:8px;font-size:13px;font-weight:550;transition:all .14s ease;
  }
  .btn .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:inherit}
  .btn.approve{background:var(--green);color:#fff}
  .btn.approve:hover{filter:brightness(1.06)}
  .btn.reject{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn.reject:hover{border-color:var(--red);color:var(--red)}
  .btn.reject .kbd{background:var(--line-2);border-color:var(--line);color:var(--ink-3)}
  .gate.done .gateact,.gate.done .reject-row{display:none}
  .confirm{
    display:none;align-items:center;gap:9px;padding:13px;font-weight:550;font-size:13px;
    border-top:1px solid var(--line);
  }
  .gate.done .confirm{display:flex}
  .confirm.approved{background:var(--green-soft);color:#1c7d4e}
  .confirm.rejected{background:var(--amber-soft);color:#8a5a08}
  .confirm .ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .confirm.approved .ic{background:var(--green)}
  .confirm.rejected .ic{background:var(--amber)}
  .reject-row{display:none;gap:8px;padding:0 13px 13px}
  .reject-row.show{display:flex}
  .reject-row input{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:12.5px;outline:none}
  .reject-row input:focus{border-color:var(--accent)}
  .reject-row button{background:var(--ink);color:#fff;border-radius:7px;padding:0 13px;font-size:12px;font-weight:550}

  /* company chat */
  .chatwrap{margin-top:18px}
  .msg{margin-bottom:9px;max-width:88%}
  .msg.assistant{margin-right:auto}
  .msg.user{margin-left:auto}
  .bubble{padding:8px 11px;border-radius:11px;font-size:12.5px;line-height:1.5}
  .msg.assistant .bubble{background:var(--line-2);border-bottom-left-radius:3px}
  .msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
  .msg .who{font-size:10px;color:var(--ink-3);margin:0 4px 3px;font-weight:500}
  .chatinput{
    flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:11px 18px;border-top:1px solid var(--line);
  }
  .chatinput input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-family:inherit;font-size:12.5px;outline:none;background:var(--bg)}
  .chatinput input:focus{border-color:var(--accent);background:var(--panel)}
  .chatinput .send{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}

  /* peek empty hint */
  .peekhint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-3);padding:30px;text-align:center}
  .peekhint .keys{display:flex;gap:6px}
  .peekhint .keys .kbd{font-size:13px;padding:4px 9px;min-width:26px}

  /* ---------- activity strip ---------- */
  .activity{
    flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);z-index:20;
    box-shadow:0 -1px 0 var(--line-2);
  }
  .actbar{display:flex;align-items:center;gap:11px;height:38px;padding:0 16px;cursor:pointer}
  .actbar:hover{background:var(--line-2)}
  .actbar .ld{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto;box-shadow:0 0 0 0 rgba(47,109,240,.5);animation:pulse 1.6s infinite}
  .actbar .co{font-weight:600;font-size:12px;flex:0 0 auto}
  .actbar .txt{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .actbar .lbl{font-size:11px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .actbar .chev{transition:transform .2s ease;color:var(--ink-3)}
  .activity.open .actbar .chev{transform:rotate(180deg)}
  .actfeed{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:0 solid var(--line)}
  .activity.open .actfeed{max-height:240px;overflow-y:auto;border-top-width:1px}
  .actgroup{padding:5px 0}
  .actgroup .gh{font-size:11px;font-weight:600;color:var(--ink-2);padding:7px 16px 4px;display:flex;align-items:center;gap:7px}
  .actitem{display:flex;align-items:center;gap:10px;padding:4px 16px 4px 30px;font-size:12px;color:var(--ink-2)}
  .actitem .ad{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
  .actitem.running .ad{background:var(--blue);animation:pulse 1.6s infinite}
  .actitem.await .ad{background:var(--violet)}
  .actitem.blocked .ad{background:var(--red)}
  .actitem.check .ad{background:var(--green)}
  .actitem .at{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:0 0 auto}

  /* badge */
  .badge{
    position:fixed;right:14px;bottom:14px;z-index:90;
    font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:7px;
  }
  .badge .b{width:7px;height:7px;border-radius:2px;background:var(--accent)}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;
    padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:all .2s ease;z-index:100;display:flex;align-items:center;gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tc{width:8px;height:8px;border-radius:50%;background:var(--green)}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,109,240,.45)}70%{box-shadow:0 0 0 6px rgba(47,109,240,0)}100%{box-shadow:0 0 0 0 rgba(47,109,240,0)}}

  /* opportunities view */
  .oppview{display:none;flex-direction:column;height:100%}
  body[data-view="opps"] .portview{display:none}
  body[data-view="opps"] .oppview{display:flex}
  .portview{display:flex;flex-direction:column;height:100%}
</style>
</head>
<body data-view="port">
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand"><span class="dot"></span> C Slop Slop <span class="sub">/ portfolio</span></div>
    <div class="seg" id="seg">
      <button class="on" data-v="port">Companies</button>
      <button data-v="opps">Opportunities</button>
    </div>
    <div class="grow"></div>
    <div class="cmd" onclick="this.querySelector('input').focus()">
      <span style="opacity:.6">⌘</span>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const STAGE = { shipped:['shipped','#'], building:['building','#'], awaiting_approval:['needs you','#'], todo:['todo','#'], blocked:['blocked','#'] };
const stageClass = s => ({shipped:'shipped',building:'building',awaiting_approval:'await',todo:'todo',blocked:'blocked'}[s]);
function coState(c){
  if(c.needsYou) return 'await';
  if(c.status==='paused'||c.status==='archived') return c.status;
  const s = c.currentSlice ? c.currentSlice.status : null;
  if(s==='building') return 'building';
  if(s==='blocked') return 'blocked';
  return 'active';
}
function currentSliceFor(c){
  if(c.slices){ // leadsift
    const aw = c.slices.find(s=>s.status==='awaiting_approval');
    if(aw) return {n:aw.n, title:aw.title, status:aw.status};
    return c.slices[c.slices.length-1];
  }
  return c.currentSlice;
}

/* ---------- metrics ---------- */
function renderMetrics(){
  const p = DATA.portfolio;
  const m = [
    ['$'+p.mrr, 'MRR /mo'],
    [p.users, 'users'],
    [p.activeCompanies, 'active'],
    [p.slicesShipped, 'slices shipped'],
    [p.needsYou, 'needs you', true],
  ];
  const wrap = $('#metrics'); wrap.innerHTML='';
  m.forEach(([v,l,hot])=>{
    const e = el('div','metric',`<div class="v" ${hot?'style="color:var(--violet)"':''}>${v}</div><div class="l">${l}</div>`);
    wrap.appendChild(e);
  });
}

/* ---------- company rows ---------- */
let selIdx = 0;
function renderRows(){
  const wrap = $('#rows'); wrap.innerHTML='';
  DATA.companies.forEach((c,i)=>{
    const cs = currentSliceFor(c);
    const st = coState(c);
    const stage = stageClass(cs.status);
    const r = el('div','row');
    r.dataset.i = i;
    r.innerHTML = `
      <div class="glyph"><span class="gd ${st}"></span></div>
      <div class="cname">${c.name}</div>
      <div class="cslice"><span class="sn">#${cs.n}</span> ${cs.title}</div>
      <div class="chip ${stage}">${stageLabel(cs.status)}</div>
      <div class="cmrr ${c.mrr?'':'zero'}">${c.mrr?'$'+c.mrr:'-'}<small>${c.mrr?'/mo':''}</small></div>
      <div class="needsmark">${c.needsYou?'<span class="nm">!</span>':''}</div>`;
    r.addEventListener('click', ()=>selectRow(i,true));
    r.addEventListener('mouseenter', ()=>{ if(!zoomed) peekCompany(i); });
    wrap.appendChild(r);
  });
  highlight();
}
function stageLabel(s){return {shipped:'shipped',building:'building',awaiting_approval:'NEEDS YOU',todo:'todo',blocked:'blocked'}[s];}
function highlight(){
  document.querySelectorAll('#rows .row').forEach((r,i)=>r.classList.toggle('sel', i===selIdx));
}
function selectRow(i, open){
  selIdx = Math.max(0, Math.min(DATA.companies.length-1, i));
  highlight();
  const r = document.querySelector(`#rows .row[data-i="${selIdx}"]`);
  if(r) r.scrollIntoView({block:'nearest'});
  if(open) openZoom(selIdx);
  else peekCompany(selIdx);
}

/* ---------- peek (hover preview) ---------- */
let zoomed = false;
function peekCompany(i){
  const c = DATA.companies[i];
  const peek = $('#peek');
  peek.classList.add('open'); peek.classList.remove('zoom');
  $('#peekwrap').innerHTML = peekHTML(c, false);
}
function openZoom(i){
  const c = DATA.companies[i];
  zoomed = true;
  const peek = $('#peek');
  peek.classList.add('open','zoom');
  if(c.id==='leadsift') $('#peekwrap').innerHTML = leadsiftZoom(c);
  else $('#peekwrap').innerHTML = peekHTML(c, true);
  wireZoom(c);
}
function closeZoom(){
  zoomed = false;
  const peek = $('#peek');
  peek.classList.remove('zoom');
  peekCompany(selIdx);
}

function peekHTML(c, full){
  const cs = currentSliceFor(c);
  const st = coState(c);
  let slices = c.slices || (c.currentSlice ? [c.currentSlice] : []);
  return `
    <div class="peekhead">
      <div class="top">
        <span class="gd ${st}" style="width:10px;height:10px"></span>

      </div>
      <span class="domain">${c.domain||c.previewUrl||'no domain yet'}</span>
      <div class="thesis">${c.thesis}</div>
      <div class="peekstats">
        <div class="s"><div class="v">$${c.mrr}</div><div class="l">MRR</div></div>
        <div class="s"><div class="v">${c.users}</div><div class="l">users</div></div>
        <div class="s"><div class="v">${c.slicesShipped||(c.slices?c.slices.filter(s=>s.status==='shipped').length:0)}</div><div class="l">shipped</div></div>
      </div>
    </div>
    <div class="peekbody">

      ${cs.step?`<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:4px 8px 0 35px">${cs.step}</div>`:''}

      ${!full ? `<div class="peekhint" style="padding:30px 0 6px"><div class="keys"><span class="kbd">↵</span></div><div style="font-size:12px">Open ${c.name} to see the full slice ladder</div></div>` : ''}
    </div>`;
}
function sliceListHTML(slices){
  return `<div class="sub">Slice ladder <span style="margin-left:auto;font-weight:450;text-transform:none;letter-spacing:0" class="mono">${slices.filter(s=>s.status==='shipped').length}/${slices.length} shipped</span></div>`+
    slices.map(s=>`<div class="slice ${s.status==='shipped'?'done':''}">

      <span class="sn">#${s.n}</span>
      <span class="st">${s.title}</span>
      ${s.priority?`<span class="mono" style="font-size:10.5px;color:var(--ink-3)">p${s.priority}</span>`:''}
      ${s.note?`<span style="font-size:10.5px;color:var(--red)">${s.note}</span>`:''}
      <span class="chip ${stageClass(s.status)}">${stageLabel(s.status)}</span>
    </div>`).join('');
}

/* ---------- LeadSift zoom with approval gate ---------- */

  const diffLines = a.diff.split('\n').map(l=>{

    <div class="peekhead">
      <div class="top">
        <span class="gd await" style="width:10px;height:10px"></span>

        <button class="esc" onclick="closeAll()">back <span class="kbd">esc</span></button>

      <div class="peekstats">

        </div>

          <div class="label">doneWhen check</div>

      </div>

      <div class="sub">Slice ladder <span style="margin-left:auto;font-weight:450;text-transform:none;letter-spacing:0" class="mono">${c.slices.filter(s=>s.status==='shipped').length}/${c.slices.length} shipped</span></div>

function wireZoom(c){
  if(c.id!=='leadsift') return;
  const gate = $('#gate');
  $('#approveBtn').onclick = ()=>{
    gate.querySelector('.confirm').className='confirm approved';
    $('#confirmTxt').textContent='Approved ✓ - shipping slice 5 to production';
    gate.classList.add('done');
    toast('Approved ✓ - LeadSift slice 5 shipping', 'var(--green)');
  };
  $('#rejectBtn').onclick = ()=>{
    const row = $('#rejectRow'); row.classList.toggle('show');
    if(row.classList.contains('show')) $('#rejectInput').focus();
  };
  $('#rejectSend').onclick = sendReject;
  $('#rejectInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendReject(); });
  function sendReject(){
    const v = $('#rejectInput').value.trim() || 'sent feedback to the agent';
    gate.querySelector('.confirm').className='confirm rejected';
    $('#confirmTxt').textContent='Rejected - feedback sent to agent';
    gate.classList.add('done');
    toast('Reject sent ✓ - "'+v.slice(0,40)+'"', 'var(--amber)');
  }
  // company chat
  const send = ()=>{
    const inp = $('#coChat'); const v=inp.value.trim(); if(!v)return;
    const msgs = $('#chatMsgs');
    msgs.appendChild(elMsg('user', v));
    inp.value='';
    setTimeout(()=>{ msgs.appendChild(elMsg('assistant','On it - I’ll route that to the LeadSift build loop.')); msgs.lastChild.scrollIntoView({block:'nearest'}); }, 450);
    msgs.lastChild.scrollIntoView({block:'nearest'});
  };
  $('#coChatSend').onclick = send;
  $('#coChat').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}
function elMsg(role, text){
  const m = el('div','msg '+role, (role==='assistant'?'<div class="who">LeadSift</div>':'')+`<div class="bubble">${escapeHtml(text)}</div>`);
  return m;
}

      r.querySelector('.promote').addEventListener('click', e=>{ e.stopPropagation(); toast('Promoted “'+o.title+'” → new company', 'var(--accent)'); });

    wrap.appendChild(el('div','move',`<span class="mn">${i+1}</span><span>${escapeHtml(m)}</span>`));

/* ---------- activity ---------- */
function renderActivity(){
  const groups = {};
  DATA.activity.forEach(a=>{ (groups[a.co]=groups[a.co]||[]).push(a); });
  const feed = $('#actfeed'); feed.innerHTML='';
  Object.entries(groups).forEach(([co, items])=>{
    const g = el('div','actgroup');
    g.appendChild(el('div','gh', `<span class="gd ${items.some(x=>x.running)?'building':(items.some(x=>x.kind==='blocked')?'blocked':(items.some(x=>x.kind==='await')?'await':'active'))}"></span> ${co}`));
    items.forEach(a=>{
      const cls = a.running?'running':(a.kind==='await'?'await':a.kind==='blocked'?'blocked':a.kind==='check'?'check':'');
      g.appendChild(el('div','actitem '+cls, `<span class="ad"></span><span>${escapeHtml(a.text)}</span><span class="at">${a.t}</span>`));
    });
    feed.appendChild(g);
  });
  const building = DATA.activity.filter(a=>a.running).length;
  const awaiting = DATA.activity.filter(a=>a.kind==='await').length;
  $('#actMore').textContent = `${building} building · ${awaiting} awaiting`;
}

/* ---------- utils ---------- */
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let toastT;
function toast(txt, color){
  const t = $('#toast'); $('#toastTxt').textContent=txt;
  t.querySelector('.tc').style.background = color||'var(--green)';
  t.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function closeAll(){

}

  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if(e.key==='Escape'){
    if(typing){ document.activeElement.blur(); return; }
    if(zoomed){ closeZoom(); }
    return;
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#cmdbar').focus(); return; }
  if(typing) return;
  if(document.body.dataset.view!=='port') return;
  if(e.key==='j'){ e.preventDefault(); selectRow(selIdx+1, false); }
  if(e.key==='k'){ e.preventDefault(); selectRow(selIdx-1, false); }
  if(e.key==='Enter'){ e.preventDefault(); openZoom(selIdx); }
  if(zoomed && DATA.companies[selIdx].id==='leadsift'){
    if(e.key.toLowerCase()==='a' && $('#approveBtn')){ $('#approveBtn').click(); }
    if(e.key.toLowerCase()==='r' && $('#rejectBtn')){ $('#rejectBtn').click(); }
  }
});

/* global command bar */
$('#cmdbar').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const v = e.target.value.trim(); if(!v)return;
    const hit = DATA.companies.findIndex(c=>c.name.toLowerCase().includes(v.toLowerCase()));
    if(hit>=0){ selectRow(hit, true); toast('Jumped to '+DATA.companies[hit].name, 'var(--accent)'); }
    else toast('Routed to build loop: “'+v.slice(0,40)+'”', 'var(--accent)');
    e.target.value=''; e.target.blur();
  }
});

/* ---------- init ---------- */
renderMetrics();
renderRows();
renderOpps();
renderMoves();
renderActivity();
peekCompany(0);
</script>
