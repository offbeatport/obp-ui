<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop - Fund</title>
<script>
/* pre-paint theme: no flash of wrong theme */
(function(){try{var t=localStorage.getItem('cslopslop-theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --cream:#f7f3ec; --cream-2:#f1ebdf; --paper:#fffdf8;
  --ink:#2c2926; --ink-soft:#6d645a; --ink-faint:#a49a8c;
  --line:#e5ddce; --line-soft:#efe9dd;
  --accent:#c8643c; --accent-soft:rgba(200,100,60,.12);
  --green:#4f8a52; --green-soft:rgba(79,138,82,.14);
  --blue:#3b6ea5;  --blue-soft:rgba(59,110,165,.13);
  --violet:#7c5cbf;--violet-soft:rgba(124,92,191,.14);
  --amber:#c2872a; --amber-soft:rgba(194,135,42,.15);
  --red:#c0503f;   --red-soft:rgba(192,80,63,.13);
  --slate:#6b7280; --slate-soft:rgba(107,114,128,.12);
  --shadow:0 1px 2px rgba(44,41,38,.05), 0 10px 34px rgba(44,41,38,.07);
  --shadow-lg:0 4px 12px rgba(44,41,38,.08), 0 24px 60px rgba(44,41,38,.12);
}
:root[data-theme="dark"]{
  --cream:#05060a; --cream-2:#0a0c12; --paper:#10131f;
  --ink:#e6ebf5; --ink-soft:#a8b0c0; --ink-faint:#6b7280;
  --line:#242a38; --line-soft:#1a1f2b;
  --accent:#e0794e; --accent-soft:rgba(224,121,78,.16);
  --green:#34d399; --green-soft:rgba(52,211,153,.14);
  --blue:#5b9bd5;  --blue-soft:rgba(91,155,213,.16);
  --violet:#a78bfa;--violet-soft:rgba(167,139,250,.16);
  --amber:#fbbf24; --amber-soft:rgba(251,191,36,.13);
  --red:#f0685a;   --red-soft:rgba(240,104,90,.16);
  --slate:#94a3b8; --slate-soft:rgba(148,163,184,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.5);
  --shadow-lg:0 6px 18px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(1100px 640px at 88% -10%, var(--accent-soft), transparent 58%),
    radial-gradient(880px 560px at -8% 112%, var(--green-soft), transparent 60%),
    var(--cream);
  color:var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.serif{font-family:'Spectral',Georgia,serif}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-faint)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.01em}

/* ================= TOPBAR ================= */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:16px;
  padding:0 clamp(16px,4vw,40px);height:62px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--paper) 84%, transparent);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;
  display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:16px;color:#fff;
  background:linear-gradient(150deg,var(--accent),#a94e2c);box-shadow:var(--shadow);
}
:root[data-theme="dark"] .mark{background:linear-gradient(150deg,var(--accent),#b8562f)}
.brandname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;line-height:1.05}
.brand .eyebrow{margin-bottom:1px}
.ticker{margin-left:auto;display:flex;align-items:center;gap:14px}
.tick{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.tick .l{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.tick .v{font-family:'JetBrains Mono';font-size:13px;font-weight:600}
.tick.hide-sm{display:none}
@media(min-width:720px){.tick.hide-sm{display:flex}}
.toggle{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  display:grid;place-items:center;transition:background .18s,border-color .18s;
}
.toggle:hover{border-color:var(--accent);background:var(--accent-soft)}
.toggle svg{width:17px;height:17px}
.moon{display:none}
:root[data-theme="dark"] .sun{display:none}
:root[data-theme="dark"] .moon{display:block}

/* ================= SHELL ================= */
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,3.4vw,34px) clamp(16px,4vw,40px) 90px}
.view{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= FUND HERO ================= */
.hero-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero-title{font-size:clamp(24px,3.6vw,34px);line-height:1.05}
.hero-sub{color:var(--ink-soft);font-size:13.5px;margin-top:6px;max-width:52ch}
.asof{text-align:right}
.asof .eyebrow{display:block;margin-bottom:4px}
.asof .v{font-family:'Space Grotesk';font-weight:600;font-size:15px}

.board{
  display:grid;grid-template-columns:repeat(6,1fr);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--paper);box-shadow:var(--shadow);margin-bottom:16px;
}
.cell{padding:15px 16px 16px;border-right:1px solid var(--line-soft);position:relative}
.cell:last-child{border-right:none}
.cell .k{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px}
.cell .n{font-family:'Space Grotesk';font-weight:600;font-size:clamp(19px,2.4vw,25px);line-height:1;letter-spacing:-.02em}
.cell .u{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-soft);margin-top:6px}
.cell.accent .n{color:var(--accent)}
.cell.pos .n{color:var(--green)}
.cell.pos .u{color:var(--green)}
.cell.live{cursor:pointer;transition:background .18s}
.cell.live:hover{background:var(--accent-soft)}
.cell .dot{position:absolute;top:14px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
@media(max-width:860px){.board{grid-template-columns:repeat(3,1fr)}.cell:nth-child(3){border-right:none}.cell:nth-child(1),.cell:nth-child(2),.cell:nth-child(3){border-bottom:1px solid var(--line-soft)}}
@media(max-width:520px){.board{grid-template-columns:repeat(2,1fr)}.cell{border-right:1px solid var(--line-soft)!important;border-bottom:1px solid var(--line-soft)}.cell:nth-child(2n){border-right:none!important}}

/* strips row (allocation + composition) */
.strips{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:26px}
@media(max-width:760px){.strips{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-h .eyebrow{color:var(--ink-soft)}
.alloc-bar{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px}
.alloc-seg{height:100%;border-radius:3px;transition:filter .18s}
.alloc-seg:hover{filter:brightness(1.08)}
.alloc-legend{display:flex;flex-direction:column;gap:9px}
.leg-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.leg-row .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.leg-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg-row .amt{font-family:'JetBrains Mono';font-size:12px;color:var(--ink-soft)}
.leg-row .pct{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);width:40px;text-align:right}
.leg-row.idle .nm{color:var(--ink-faint)}
.comp{display:flex;flex-direction:column;gap:0}
.comp-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.comp-row:last-child{border-bottom:none}
.comp-row .dt{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.comp-row .st{flex:1;font-size:12.5px;font-weight:500}
.comp-row .co{font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%;text-align:right}

/* section head */
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 2px 13px}
.sec-head h2{font-size:15px}
.sec-head .cnt{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint)}
.sec-head .rule{flex:1;height:1px;background:var(--line);align-self:center}

/* ================= NEEDS YOU ================= */
.desk{display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.call-card{
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.call-card.done{border-left-color:var(--green);opacity:.92}
.cc-main{flex:1;min-width:220px}
.cc-top{display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.cc-pos{font-family:'Space Grotesk';font-weight:600;font-size:14px}
.cc-title{font-size:13.5px;color:var(--ink)}
.cc-detail{font-size:12px;color:var(--ink-faint);margin-top:3px}
.cc-actions{display:flex;gap:8px;flex-wrap:wrap}
.cc-resolved{display:flex;align-items:center;gap:10px;font-size:12.5px}
.cc-resolved .badge-ok{font-family:'JetBrains Mono';font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}

/* buttons */
.btn{
  font-family:'Inter';font-size:12.5px;font-weight:600;cursor:pointer;
  border-radius:9px;padding:8px 13px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);
  transition:transform .12s,background .16s,border-color .16s,color .16s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#b5572f}
.btn.ghost:hover{border-color:var(--ink-soft);background:var(--cream-2)}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.btn.link{border:none;background:none;padding:4px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn.sm{font-size:11.5px;padding:6px 10px}

/* ================= LEDGER ================= */
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.led-head,.pos-row{
  display:grid;
  grid-template-columns:minmax(0,2.5fr) 96px 1fr 1fr 1.15fr 1.05fr;
  align-items:center;gap:12px;padding:0 18px;
}
.led-head{height:38px;border-bottom:1px solid var(--line);background:var(--cream-2)}
.led-head span{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.led-head .r,.pos-row .r{text-align:right}
.pos-row{
  min-height:70px;border-bottom:1px solid var(--line-soft);cursor:pointer;position:relative;
  transition:background .16s;
}
.pos-row:last-child{border-bottom:none}
.pos-row:hover{background:var(--accent-soft)}
.pos-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pos-row.muted{opacity:.62}
.pos-row.muted:hover{opacity:.82}
.pr-name{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 0}
.pr-name .nm{font-family:'Space Grotesk';font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.pr-name .tg{font-size:11.8px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-num{font-family:'JetBrains Mono';font-size:13px;text-align:right}
.pr-num .sub{display:block;font-size:10px;color:var(--ink-faint);margin-top:2px}
.needdot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);flex:0 0 auto}

/* chips */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono';
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;white-space:nowrap;
}
.chip .g{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip[data-c="slate"]{color:var(--slate);background:var(--slate-soft)}
.chip[data-c="blue"]{color:var(--blue);background:var(--blue-soft)}
.chip[data-c="amber"]{color:var(--amber);background:var(--amber-soft)}
.chip[data-c="green"]{color:var(--green);background:var(--green-soft)}
.chip[data-c="violet"]{color:var(--violet);background:var(--violet-soft)}
.chip[data-c="red"]{color:var(--red);background:var(--red-soft)}
.chip[data-c="faint"]{color:var(--ink-faint);background:var(--slate-soft)}
.chip[data-c="accent"]{color:var(--accent);background:var(--accent-soft)}
.sig{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono';font-size:11px;font-weight:600;justify-content:flex-end}
.sig[data-t="good"]{color:var(--green)}
.sig[data-t="warn"]{color:var(--amber)}
.sig[data-t="bad"]{color:var(--red)}
.sig[data-t="faint"]{color:var(--ink-faint)}
.cell-mobile-k{display:none}

@media(max-width:780px){
  .led-head{display:none}
  .pos-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto;padding:14px 16px;gap:8px 14px;min-height:0}
  .pr-name{grid-column:1 / -1;padding:0}
  .pr-col{display:flex;flex-direction:column;gap:2px}
  .pr-num{text-align:left}
  .pr-num .sub{margin-top:1px}
  .pr-stage{grid-column:1 / -1}
  .cell-mobile-k{display:block;font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .sig{justify-content:flex-start}
  .pr-call{grid-column:1 / -1}
}

/* ================= POSITION DETAIL ================= */
.back{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink-soft);cursor:pointer;background:none;border:none;padding:6px 0;margin-bottom:14px;letter-spacing:.05em}
.back:hover{color:var(--accent)}
.crumb{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}

.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.p-head .lead{min-width:260px;flex:1}
.p-name{font-size:clamp(24px,3.2vw,32px);line-height:1.02;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.p-tag{font-family:'Spectral',serif;font-size:16px;color:var(--ink-soft);margin-top:9px;max-width:56ch}
.p-recc{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.recc-label{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.recc-big{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:.02em}

.p-metrics{
  display:grid;grid-template-columns:repeat(5,1fr);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);margin-bottom:22px;
}
.pm{padding:14px 15px;border-right:1px solid var(--line-soft)}
.pm:last-child{border-right:none}
.pm .k{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.pm .v{font-family:'Space Grotesk';font-weight:600;font-size:20px;letter-spacing:-.01em}
.pm.pos .v{color:var(--green)}
.pm.neg .v{color:var(--red)}
@media(max-width:720px){.p-metrics{grid-template-columns:repeat(2,1fr)}.pm{border-right:1px solid var(--line-soft)}.pm:nth-child(2n){border-right:none}.pm{border-bottom:1px solid var(--line-soft)}.pm:nth-last-child(-n+1){border-bottom:none}}

.p-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
@media(max-width:840px){.p-grid{grid-template-columns:1fr}}
.block{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:16px}
.block h3{font-size:12.5px;font-family:'JetBrains Mono';font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
.thesis-txt{font-family:'Spectral',serif;font-size:16.5px;line-height:1.55;color:var(--ink)}

/* progress */
.goal-line{font-size:13px;color:var(--ink-soft);margin-bottom:11px}
.bar{height:9px;border-radius:6px;background:var(--cream-2);overflow:hidden;border:1px solid var(--line-soft)}
.bar > i{display:block;height:100%;border-radius:6px}
.bar-i.good{background:var(--green)}
.bar-i.warn{background:var(--amber)}
.bar-i.bad{background:var(--red)}
.bar-i.neutral{background:var(--blue)}
.bar-meta{display:flex;justify-content:space-between;margin-top:8px;font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint)}

/* activity */
.feed{list-style:none;display:flex;flex-direction:column;gap:0}
.feed li{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.feed li:last-child{border-bottom:none}
.feed .tk{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);flex:0 0 auto;padding-top:2px;width:52px}
.risk-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.risk-list li{display:flex;gap:9px;font-size:13px;align-items:flex-start}
.risk-list .mk{color:var(--amber);flex:0 0 auto}

/* next action */
.block.nba{border-color:var(--accent);border-left:3px solid var(--accent)}
.nba-txt{font-size:14px;font-weight:500;line-height:1.45;margin-bottom:13px}
.block.approve{background:linear-gradient(180deg,var(--accent-soft),transparent 90%)}

/* the call */
.call-opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);cursor:pointer;background:var(--paper);text-align:left;width:100%;
  transition:border-color .16s,background .16s,transform .12s;font-family:'Inter';
}
.opt:hover{transform:translateY(-1px)}
.opt .oi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-family:'JetBrains Mono';font-weight:600;font-size:12px}
.opt .ot{flex:1}
.opt .oname{font-family:'Space Grotesk';font-weight:600;font-size:14px}
.opt .odesc{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.opt .pin{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:2px 6px}
.opt[data-rec="1"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen{border-color:var(--green);background:var(--green-soft)}
.opt.chosen .oi{background:var(--green);color:#fff}
.opt.exec[data-k="eject"]{border-color:var(--violet);background:var(--violet-soft)}
.opt.exec[data-k="kill"]{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.oi[data-k="continue"]{background:var(--green-soft);color:var(--green)}
.oi[data-k="eject"]{background:var(--violet-soft);color:var(--violet)}
.oi[data-k="kill"]{background:var(--red-soft);color:var(--red)}

/* doc tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:2px;flex-wrap:wrap}
.tab{
  font-family:'JetBrains Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 12px;cursor:pointer;border:none;background:none;color:var(--ink-faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .16s,border-color .16s;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.doc-body{padding:15px 2px 2px;font-size:13.5px;line-height:1.62;color:var(--ink-soft)}
.doc-body strong{color:var(--ink);font-weight:600}

/* ================= TOAST ================= */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;
  padding:11px 18px;border-radius:11px;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:90vw;
  display:flex;align-items:center;gap:12px;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .u{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] #toast{background:#e6ebf5;color:#10131f}
:root[data-theme="dark"] #toast .u{color:#c8643c}

[hidden]{display:none!important}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

const byId = id => POSITIONS.find(p=>p.id===id);

/* fund-level constants */
const FUND = {deployed:62, revenue:220, net:158, positions:6};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
function money(n){return '$'+n;}
function retMultiple(p){
  if(p.revenue===0) return '-';
  if(p.spend>0){ return (p.revenue/p.spend).toFixed(1).replace(/\.0$/,'')+'×'; }
  return '∞';
}
function netStr(p){
  const n=p.revenue-p.spend;
  if(n===0) return '$0';
  return (n>0?'+':'−')+'$'+Math.abs(n);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pendingCount(){return DESK_ORDER.filter(id=>decisions[id].status==='pending').length;}

/* ============================================================
   RENDER - FUND (zoom out)
   ============================================================ */
function renderFund(){
  const active = POSITIONS.filter(p=>p.spend>0);
  const total = FUND.deployed;
  const allocSegs = active.map(p=>{
    const pct=Math.round(p.revenue===undefined?0:(p.spend/total)*100);
    return {id:p.id,name:p.name,spend:p.spend,pct:Math.round((p.spend/total)*100),c:STAGE[p.stage].c};
  });

  const board = `
    <div class="hero-head">
      <div class="lead">
        <h1 class="hero-title">The book</h1>
        <p class="hero-sub">Six AI-operated bets. Each is a position: cost basis is what it burns, return is the traction signal, and every one carries a call - kill, continue, or eject.</p>
      </div>
      <div class="asof">
        <span class="eyebrow">Fund · as of</span>
        <div class="v mono">Jul 04, 2026</div>
      </div>
    </div>

    <div class="board">
      <div class="cell"><div class="k">Capital deployed</div><div class="n mono">$62<span style="font-size:.55em;color:var(--ink-faint)">/mo</span></div><div class="u">across 3 funded bets</div></div>
      <div class="cell"><div class="k">Active revenue</div><div class="n mono">$220<span style="font-size:.55em;color:var(--ink-faint)">/mo</span></div><div class="u">recurring, live bets</div></div>
      <div class="cell pos"><div class="k">Net / month</div><div class="n mono">+$158</div><div class="u">self-funding</div></div>
      <div class="cell"><div class="k">Runway</div><div class="n mono">∞</div><div class="u">net positive</div></div>
      <div class="cell"><div class="k">Positions</div><div class="n mono">6</div><div class="u">4 in flight · 1 exit · 1 write-off</div></div>
      <div class="cell accent live" id="needsCell" role="button" tabindex="0" aria-label="Jump to decisions that need you">
        <span class="dot" id="needsDotHero"></span>
        <div class="k">Needs you</div><div class="n mono" id="needsBig">3</div><div class="u">pending calls →</div></div>
    </div>

    <div class="strips">
      <div class="panel">
        <div class="panel-h"><span class="eyebrow">Capital allocation · $62/mo deployed</span><span class="mono" style="font-size:11px;color:var(--ink-faint)">by cost basis</span></div>

          ${allocSegs.map(s=>`<div class="alloc-seg" style="flex:${s.spend};background:var(--${s.c})" title="${esc(s.name)} · $${s.spend}/mo"></div>`).join('')}

        <div class="alloc-legend">
          ${allocSegs.map(s=>`<div class="leg-row"><span class="sw" style="background:var(--${s.c})"></span><span class="nm">${esc(s.name)}</span><span class="amt">$${s.spend}/mo</span><span class="pct">${s.pct}%</span></div>`).join('')}
          <div class="leg-row idle"><span class="sw" style="background:var(--line)"></span><span class="nm">PricePeek · TranslatorBill · RedditPainBot</span><span class="amt">$0</span><span class="pct">0%</span></div>

      <div class="panel">

function rowHTML(p){
  const st=STAGE[p.stage], sg=SIGNAL[p.signal];
  const done=(p.stage==='ejected'||p.stage==='killed');
  const needs=p.approvalId && decisions[p.approvalId].status==='pending';

      <span class="nm">${esc(p.name)} ${needs?'<span class="needdot" title="Needs your approval"></span>':''}</span>
      <span class="tg">${esc(p.tag)}</span>
    </div>
    <div class="pr-stage"><span class="cell-mobile-k">Stage</span><span class="chip" data-c="${st.c}"><span class="g"></span>${st.label}</span></div>

    <div class="pr-num r pr-col"><span class="cell-mobile-k">Revenue</span><span>${p.revenue?('$'+p.revenue+'/mo'):'$0'}${p.stage==='ejected'?'<span class="sub">last recorded</span>':''}</span></div>

    <div class="pr-call r pr-col"><span class="cell-mobile-k">Call</span><span class="chip" data-c="${REC[p.rec].c}">${recTxt}${done?' ✓':''}</span></div>
  </div>`;
}

/* ---- desk (needs-you) ---- */
function renderDesk(){
  const host=$('#desk'); if(!host) return;
  host.innerHTML = DESK_ORDER.map(id=>deskCardHTML(decisions[id])).join('');
  host.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click',()=>resolveDecision(b.dataset.id,b.dataset.act));
  });
  const dc=$('#deskCnt'); if(dc) dc.textContent = pendingCount()+' pending';
}
function deskCardHTML(d){
  if(d.status==='pending'){
    return `<div class="call-card" id="desk-${d.id}">
      <div class="cc-main">
        <div class="cc-top"><span class="cc-pos">${esc(d.pos)}</span><span class="chip" data-c="accent">Needs approval</span></div>
        <div class="cc-title">${esc(d.title)}</div>
        <div class="cc-detail">${esc(d.detail)}</div>
      </div>
      <div class="cc-actions">
        <button class="btn primary" data-id="${d.id}" data-act="approved">Approve</button>
        <button class="btn ghost" data-id="${d.id}" data-act="held">Hold</button>
        <button class="btn danger" data-id="${d.id}" data-act="killed">Kill</button>
      </div>
    </div>`;
  }
  const map={approved:{t:'Approved',c:'green'},held:{t:'On hold',c:'amber'},killed:{t:'Killed',c:'red'}};
  const m=map[d.status];
  return `<div class="call-card done" id="desk-${d.id}">
    <div class="cc-main">
      <div class="cc-top"><span class="cc-pos">${esc(d.pos)}</span></div>
      <div class="cc-title" style="color:var(--ink-soft)">${esc(d.title)}</div>
    </div>
    <div class="cc-resolved">
      <span class="badge-ok chip" data-c="${m.c}">${m.t} ✓</span>
      <button class="btn link" data-id="${d.id}" data-act="undo">Undo</button>
    </div>
  </div>`;
}

function resolveDecision(id,act){
  const d=decisions[id];
  if(act==='undo'){ d.status='pending'; }
  else { d.status=act; }
  renderDesk();
  syncNeeds();
  // if a position detail is open for this bet, refresh its approval + call
  if(!$('#posView').hidden && OPEN===findPosByApproval(id)){ paintApproval(id); }
  const labels={approved:'Approved',held:'Held',killed:'Killed'};
  if(act!=='undo'){
    toast(`${d.pos}: ${labels[act]}.`, ()=>{ resolveDecision(id,'undo'); });
  }
}
function findPosByApproval(aid){const p=POSITIONS.find(x=>x.approvalId===aid);return p?p.id:null;}

function syncNeeds(){
  const n=pendingCount();
  const nb=$('#needsBig'); if(nb) nb.textContent=n;
  const tn=$('#tickNeeds'); if(tn){ tn.textContent=n; }
  const hd=$('#needsDotHero'); if(hd) hd.style.display = n>0?'block':'none';
  const dc=$('#deskCnt'); if(dc) dc.textContent = n+' pending';
}
function jumpToDesk(){ const d=$('#desk'); if(d) d.scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'start'}); }

/* ============================================================
   RENDER - POSITION (zoom in)
   ============================================================ */
let OPEN=null;
function openPosition(id){
  const p=byId(id); if(!p) return;

  const net=p.revenue-p.spend;
  const netCls = net>0?'pos':(net<0?'neg':'');

  const html = `
    <button class="back" id="backBtn">← <span>The book</span></button>

      <div class="lead">
        <h1 class="p-name">${esc(p.name)} <span class="chip" data-c="${st.c}"><span class="g"></span>${st.label}</span></h1>
        <p class="p-tag">${esc(p.tag)}</p>
      </div>
      <div class="p-recc">
        <span class="recc-label">Recommendation</span>
        <span class="recc-big" style="color:var(--${REC[p.rec].c})">${REC[p.rec].label}${done?' ✓':''}</span>
        <span class="sig" data-t="${sg.t}" style="justify-content:flex-end">${sg.a} Signal ${sg.label}</span>
      </div>
    </div>

    <div class="p-metrics">
      <div class="pm"><div class="k">Cost basis</div><div class="v mono">${p.spend?('$'+p.spend):'$0'}</div></div>
      <div class="pm"><div class="k">Revenue</div><div class="v mono">${p.revenue?('$'+p.revenue):'$0'}</div></div>
      <div class="pm ${netCls}"><div class="k">Net / mo</div><div class="v mono">${netStr(p)}</div></div>
      <div class="pm"><div class="k">Return</div><div class="v mono">${retMultiple(p)}</div></div>
      <div class="pm"><div class="k">Users</div><div class="v mono" style="font-size:16px">${esc(p.users)}</div></div>
    </div>

    <div class="p-grid">
      <div class="p-left">
        <div class="block">
          <h3>Thesis</h3>
          <p class="thesis-txt">${esc(p.goal)}</p>
          <p class="goal-line" style="margin-top:9px">${esc(p.goalState)}</p>
        </div>

        <div class="block">
          <h3>Traction toward goal</h3>
          <div class="bar" role="progressbar" aria-valuenow="${Math.round(Math.min(p.progress,1)*100)}" aria-valuemin="0" aria-valuemax="100">
            <i class="bar-i ${p.tone}" style="width:${Math.max(4,Math.min(p.progress,1)*100)}%"></i>
          </div>
          <div class="bar-meta"><span>${esc(p.progLabel)}</span><span>${Math.round(p.progress*100)}%</span></div>
        </div>

        <div class="block">
          <h3>AI plan</h3>
          <p style="font-size:14px;line-height:1.55">${esc(p.plan)}</p>
        </div>

        <div class="block">
          <h3>Recent activity</h3>
          <ul class="feed">
            ${p.recent.map(r=>`<li><span class="tk">${esc(r[0])}</span><span>${esc(r[1])}</span></li>`).join('')}
          </ul>
        </div>

        <div class="block">
          <h3>Risks</h3>
          <ul class="risk-list">
            ${p.risks.map(r=>`<li><span class="mk">▲</span><span>${esc(r)}</span></li>`).join('')}
          </ul>
        </div>

        <div class="block">
          <h3>Documents · depth on demand</h3>
          <div class="tabs" id="docTabs">
            ${['foundation','product','growth','budget'].map((t,i)=>`<button class="tab ${i===0?'on':''}" data-tab="${t}">${t}</button>`).join('')}
          </div>
          <div class="doc-body" id="docBody">${p.docs.foundation}</div>
        </div>
      </div>

      <div class="p-right">
        ${p.nextAction?`<div class="block nba">
          <h3>Next best action</h3>
          <p class="nba-txt">${esc(p.nextAction)}</p>
        </div>`:''}

        <div id="approveSlot"></div>

        <div class="block">
          <h3>The call</h3>
          <div class="call-opts">
            ${callOptHTML(p,'continue','Continue','Keep operating & funding this bet.')}
            ${callOptHTML(p,'eject','Eject','Spin out into a standalone company.')}
            ${callOptHTML(p,'kill','Kill','Stop, write the post-mortem, free the capital.')}
          </div>
          ${p.recAlt?`<p class="cc-detail" style="margin-top:11px">${esc(p.recAlt)}</p>`:''}
        </div>
      </div>
    </div>
  `;
  const v=$('#posView');
  v.innerHTML=html;
  $('#fundView').hidden=true;
  v.hidden=false;
  v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  window.scrollTo({top:0,behavior:'auto'});

  // wire
  $('#backBtn').addEventListener('click',showFund);
  $('#docTabs').querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $('#docTabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      t.classList.add('on');
      $('#docBody').innerHTML = p.docs[t.dataset.tab];
    });
  });
  v.querySelectorAll('.opt').forEach(o=>{
    if(o.classList.contains('exec')) return;
    o.addEventListener('click',()=>chooseCall(p.id,o.dataset.k));
  });
  paintApproval(p.approvalId);
}

function callOptHTML(p,k,name,desc){
  const done=(p.stage==='ejected'||p.stage==='killed');
  const isRec = p.rec===k;
  let cls='opt';
  if(done && (k===p.rec)) cls+=' exec';
  else if(done) cls+=' dim';
  const pin = isRec ? '<span class="pin">Recommended</span>' : '';
  return `<button class="${cls}" data-k="${k}" ${isRec?'data-rec="1"':''} ${done?'disabled aria-disabled="true"':''}>
    <span class="oi" data-k="${k}">${k==='continue'?'▶':k==='eject'?'▲':'■'}</span>
    <span class="ot"><span class="oname">${name}</span><span class="odesc">${desc}</span></span>
    ${done && k===p.rec ? '<span class="pin" style="color:var(--ink-soft);border-color:var(--line)">Executed ✓</span>' : pin}
  </button>`;
}
function chooseCall(id,k){
  const p=byId(id);
  document.querySelectorAll('#posView .opt').forEach(o=>o.classList.remove('chosen'));
  const el=document.querySelector(`#posView .opt[data-k="${k}"]`);
  if(el) el.classList.add('chosen');
  const verb={continue:'Continue',eject:'Eject',kill:'Kill'}[k];
  toast(`${p.name}: logged your ${verb} call. (demo - reversible)`);
}

/* approval card inside detail, synced to the desk state */
function paintApproval(aid){
  const slot=$('#approveSlot'); if(!slot) return;
  if(!aid || !decisions[aid]){ slot.innerHTML=''; return; }
  const d=decisions[aid];
  if(d.status==='pending'){
    slot.innerHTML=`<div class="block approve">
      <h3>Approval pending</h3>
      <p class="nba-txt">${esc(d.title)}</p>
      <p class="cc-detail" style="margin-bottom:13px">${esc(d.detail)}</p>
      <div class="cc-actions">
        <button class="btn primary" data-id="${aid}" data-act="approved">Approve</button>
        <button class="btn ghost" data-id="${aid}" data-act="held">Hold</button>
        <button class="btn danger" data-id="${aid}" data-act="killed">Kill</button>
      </div>
    </div>`;
  } else {
    const map={approved:{t:'Approved',c:'green'},held:{t:'On hold',c:'amber'},killed:{t:'Killed',c:'red'}};
    const m=map[d.status];
    slot.innerHTML=`<div class="block approve">
      <h3>Approval</h3>
      <p class="nba-txt" style="color:var(--ink-soft)">${esc(d.title)}</p>
      <div class="cc-resolved"><span class="chip" data-c="${m.c}">${m.t} ✓</span><button class="btn link" data-id="${aid}" data-act="undo">Undo</button></div>
    </div>`;
  }
  slot.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>resolveDecision(b.dataset.id,b.dataset.act)));
}

function showFund(){
  $('#posView').hidden=true;
  const fv=$('#fundView');
  fv.hidden=false;
  fv.classList.remove('view'); void fv.offsetWidth; fv.classList.add('view');
  OPEN=null;
  window.scrollTo({top:0,behavior:'auto'});
  syncNeeds();
}

/* ============================================================
   THEME + TOAST + BOOT
   ============================================================ */
function reduceMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('cslopslop-theme',next);}catch(e){}
});

let toastTimer;
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML = esc(msg) + (undo?' <span class="u" id="toastUndo">Undo</span>':'');
  t.classList.add('show');
  if(undo){ const u=$('#toastUndo'); if(u) u.addEventListener('click',()=>{undo();t.classList.remove('show');}); }
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 3400);
}

// keyboard: Escape closes a position (hidden affordance)
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !$('#posView').hidden){ showFund(); }
});

renderFund();
</script>
</body>
</html>
