<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunity score · 10 versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6f0; --cream-2:#f3ebe0; --paper:#ffffff; --ink:#2b2320; --ink-soft:#6a5f55; --ink-faint:#9c8f81;
  --accent:#c2683f; --accent-ink:#a8542f; --accent-soft:#f4e2d6;
  --green:#4f8a52; --green-soft:#e2efdf; --amber:#c08a2c; --amber-soft:#f6ecd6; --gray:#b9ada0;
  --line:#e7ddd0; --line-soft:#efe7db; --shadow:0 1px 2px rgba(44,41,38,.05), 0 8px 24px rgba(44,41,38,.06);
  --radius:16px; --radius-sm:12px;
}
[data-theme="dark"]{
  --cream:#12100e; --cream-2:#1c1813; --paper:#191512; --ink:#f0e8dd; --ink-soft:#bcae9f; --ink-faint:#8a7d6f;
  --accent:#e0894f; --accent-ink:#e8a06a; --accent-soft:#3a2a1e;
  --green:#66b06a; --green-soft:#22301f; --amber:#d6a54b; --amber-soft:#332a17; --gray:#6a5f52;
  --line:#2c261f; --line-soft:#241f19; --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
}
*{ box-sizing:border-box; }
body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased; }
.wrap{ max-width:1160px; margin:0 auto; padding:34px 26px 90px; }
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:8px; }
h1{ font-family:'Space Grotesk',sans-serif; font-weight:300; font-size:34px; letter-spacing:-.02em; margin:0; }
.sub{ font-size:14px; color:var(--ink-soft); margin:8px 0 0; max-width:70ch; line-height:1.55; }
.theme-btn{ font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:8px 15px; cursor:pointer; }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; margin-top:30px; }
@media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 20px 22px; }
.panel-h{ display:flex; align-items:baseline; gap:10px; margin:0 0 16px; }
.panel-n{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:#fff; background:var(--accent); border-radius:7px; padding:3px 9px; }
.panel-t{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; }
.panel-d{ font-size:11.5px; color:var(--ink-faint); margin-left:auto; }
.mono{ font-family:'JetBrains Mono',monospace; }
.hi{ color:var(--green); } .mid{ color:var(--amber); } .lo{ color:var(--ink-faint); }

/* ============ V1 · label + bar + score, reasoning below (muted) ============ */
.v1 .row{ padding:9px 0; border-top:1px solid var(--line-soft); }
.v1 .row:first-child{ border-top:none; }
.v1 .r1{ display:flex; align-items:center; gap:10px; }
.v1 .nm{ flex:1; font-size:13px; font-weight:600; }
.v1 .track{ flex:0 0 120px; height:6px; border-radius:4px; background:var(--cream-2); overflow:hidden; }
.v1 .fill{ height:100%; border-radius:4px; }
.v1 .sc{ flex:0 0 auto; width:22px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.v1 .rs{ font-size:12px; color:var(--ink-soft); line-height:1.45; margin-top:5px; padding-left:1px; }

/* ============ V2 · two columns: bar block left, reasoning right ============ */
.v2 .row{ display:grid; grid-template-columns:190px 1fr; gap:18px; align-items:center; padding:11px 0; border-top:1px solid var(--line-soft); }
.v2 .row:first-child{ border-top:none; }
.v2 .nm{ font-size:12.5px; font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; }
.v2 .nm .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; }
.v2 .track{ height:7px; border-radius:5px; background:var(--cream-2); overflow:hidden; }
.v2 .fill{ height:100%; border-radius:5px; }
.v2 .rs{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

/* ============ V3 · score chip + bar overlay, reasoning in lighter right column ============ */
.v3 .row{ display:grid; grid-template-columns:1fr 1.15fr; gap:16px; align-items:center; padding:10px 0; border-top:1px solid var(--line-soft); }
.v3 .row:first-child{ border-top:none; }
.v3 .left{ display:flex; align-items:center; gap:11px; }
.v3 .chip{ flex:0 0 auto; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.v3 .chip.hi{ background:var(--green-soft); color:var(--green);} .v3 .chip.mid{ background:var(--amber-soft); color:var(--amber);} .v3 .chip.lo{ background:var(--cream-2); color:var(--ink-faint);}
.v3 .lx{ flex:1; min-width:0; }
.v3 .nm{ font-size:13px; font-weight:600; margin-bottom:5px; }
.v3 .track{ height:6px; border-radius:4px; background:var(--cream-2); overflow:hidden; }
.v3 .fill{ height:100%; border-radius:4px; }
.v3 .rs{ font-size:12px; color:var(--ink-faint); line-height:1.45; }

/* ============ V4 · segmented 10-pip track + reasoning beside ============ */
.v4 .row{ display:grid; grid-template-columns:200px 1fr; gap:18px; align-items:center; padding:11px 0; border-top:1px solid var(--line-soft); }
.v4 .row:first-child{ border-top:none; }
.v4 .nm{ font-size:12.5px; font-weight:600; margin-bottom:7px; }
.v4 .pips{ display:flex; gap:3px; }
.v4 .pip{ flex:1; height:9px; border-radius:2px; background:var(--cream-2); }
.v4 .rs{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.v4 .rs b{ font-family:'JetBrains Mono',monospace; }

/* ============ V5 · card tiles (2-col) with bar + reasoning ============ */
.v5 .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.v5 .tile{ background:var(--cream-2); border:1px solid var(--line-soft); border-radius:11px; padding:11px 12px; }
.v5 .th{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.v5 .nm{ font-size:12px; font-weight:600; }
.v5 .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.v5 .track{ height:6px; border-radius:4px; background:var(--paper); overflow:hidden; margin-bottom:8px; }
.v5 .fill{ height:100%; border-radius:4px; }
.v5 .rs{ font-size:11.5px; color:var(--ink-soft); line-height:1.45; }

/* ============ V6 · big mono number, thin bar, reasoning inline right ============ */
.v6 .row{ display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:center; padding:12px 0; border-top:1px solid var(--line-soft); }
.v6 .row:first-child{ border-top:none; }
.v6 .big{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px; line-height:1; text-align:center; }
.v6 .rx{ min-width:0; }
.v6 .nm{ font-size:13px; font-weight:600; margin-bottom:5px; display:flex; align-items:center; gap:10px; }
.v6 .track{ flex:1; height:4px; border-radius:3px; background:var(--cream-2); overflow:hidden; }
.v6 .fill{ height:100%; border-radius:3px; }
.v6 .rs{ font-size:12px; color:var(--ink-soft); line-height:1.45; }

/* ============ V7 · left colored accent bar rows ============ */
.v7 .row{ display:grid; grid-template-columns:1fr; gap:6px; padding:11px 13px; border-radius:10px; border-left:4px solid var(--line); margin-bottom:8px; background:var(--cream-2); }
.v7 .row.hi{ border-left-color:var(--green);} .v7 .row.mid{ border-left-color:var(--amber);} .v7 .row.lo{ border-left-color:var(--gray);}
.v7 .rh{ display:flex; align-items:center; gap:10px; }
.v7 .nm{ flex:1; font-size:13px; font-weight:600; }
.v7 .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.v7 .track{ height:5px; border-radius:3px; background:var(--paper); overflow:hidden; }
.v7 .fill{ height:100%; border-radius:3px; }
.v7 .rs{ font-size:12px; color:var(--ink-soft); line-height:1.45; }

/* ============ V8 · gradient bars, reasoning below italic ============ */
.v8 .row{ padding:10px 0; border-top:1px solid var(--line-soft); }
.v8 .row:first-child{ border-top:none; }
.v8 .rh{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
.v8 .nm{ font-size:13px; font-weight:600; }
.v8 .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; }
.v8 .track{ height:9px; border-radius:6px; background:var(--cream-2); overflow:hidden; }
.v8 .fill{ height:100%; border-radius:6px; }
.v8 .rs{ font-size:12px; color:var(--ink-soft); line-height:1.45; font-style:italic; margin-top:6px; }

/* ============ V9 · table with a bar column + zebra ============ */
.v9 table{ width:100%; border-collapse:collapse; }
.v9 th{ font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); text-align:left; padding:0 10px 8px; }
.v9 td{ padding:9px 10px; vertical-align:middle; font-size:12.5px; }
.v9 tr:nth-child(even) td{ background:var(--cream-2); }
.v9 .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; }
.v9 .nm{ font-weight:600; white-space:nowrap; }
.v9 .track{ width:90px; height:6px; border-radius:4px; background:var(--cream-2); overflow:hidden; }
.v9 .fill{ height:100%; border-radius:4px; }
.v9 .rs{ color:var(--ink-soft); line-height:1.4; }

/* ============ V10 · dense compact, reasoning next to a slim inline bar ============ */
.v10 .row{ display:grid; grid-template-columns:130px 66px 1fr; gap:12px; align-items:center; padding:7px 0; border-top:1px solid var(--line-soft); }
.v10 .row:first-child{ border-top:none; }
.v10 .nm{ font-size:12px; font-weight:600; display:flex; align-items:center; gap:7px; }
.v10 .sc{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; }
.v10 .track{ height:5px; border-radius:3px; background:var(--cream-2); overflow:hidden; }
.v10 .fill{ height:100%; border-radius:3px; }
.v10 .rs{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Opportunity score - 10 versions</h1>
      <p class="sub">Eight signals as progress bars with the reasoning next to each. Same data across every version (your AlertManager example), so you can compare purely on layout. Tell me a number and I'll wire that one into the full-opportunity view.</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">☾ Dark</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
var SIGNALS = [
  {name:'Buyer Quality',      score:9,  reason:'DevOps engineers managing infrastructure have significant budget authority.'},
  {name:'Pain Urgency',       score:8,  reason:'Alerting is critical infrastructure; manual management is a high-risk, high-effort task.'},
  {name:'Willingness to Pay', score:8,  reason:'The request explicitly asks for a solution to a missing feature in a paid-tier observability stack.'},
  {name:'Timing Signal',      score:6,  reason:'Observability stacks are increasingly complex, making automated rule management a stable, growing need.'},
  {name:'Build Simplicity',   score:6,  reason:'Requires a bridge service that implements the Prometheus protocol and pushes to AlertManager.'},
  {name:'Distribution Ready', score:7,  reason:'Targeted via GitHub issues and DevOps community forums.'},
  {name:'Pricing Ceiling',    score:7,  reason:'Infrastructure tools command higher price points, easily $100–200/mo for small teams.'},
  {name:'Legal Safety',       score:10, reason:'Standard infrastructure tooling, no regulatory risk.'}
];
function band(v){ return v>=8?'hi':(v>=6?'mid':'lo'); }
function col(v){ return v>=8?'var(--green)':(v>=6?'var(--amber)':'var(--gray)'); }
function grad(v){ var c=col(v); return 'linear-gradient(90deg, '+c+', color-mix(in srgb, '+c+' 62%, #ffffff))'; }

var V = {};
V[1]=function(){ return SIGNALS.map(function(s){ var b=band(s.score);
  return '<div class="row"><div class="r1"><span class="nm">'+s.name+'</span>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span>'+
    '<span class="sc '+b+'">'+s.score+'</span></div><div class="rs">'+s.reason+'</div></div>'; }).join(''); };
V[2]=function(){ return SIGNALS.map(function(s){
  return '<div class="row"><div><div class="nm">'+s.name+' <span class="sc '+band(s.score)+'">'+s.score+'</span></div>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span></div>'+
    '<div class="rs">'+s.reason+'</div></div>'; }).join(''); };
V[3]=function(){ return SIGNALS.map(function(s){ var b=band(s.score);
  return '<div class="row"><div class="left"><span class="chip '+b+'">'+s.score+'</span><div class="lx"><div class="nm">'+s.name+'</div>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span></div></div>'+
    '<div class="rs">'+s.reason+'</div></div>'; }).join(''); };
V[4]=function(){ return SIGNALS.map(function(s){ var pips='';
  for(var i=0;i<10;i++){ pips+='<span class="pip" style="'+(i<s.score?('background:'+col(s.score)):'')+'"></span>'; }
  return '<div class="row"><div><div class="nm">'+s.name+'</div><div class="pips">'+pips+'</div></div>'+
    '<div class="rs"><b>'+s.score+'/10</b> · '+s.reason+'</div></div>'; }).join(''); };
V[5]=function(){ return '<div class="tiles">'+SIGNALS.map(function(s){
  return '<div class="tile"><div class="th"><span class="nm">'+s.name+'</span><span class="sc '+band(s.score)+'">'+s.score+'</span></div>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span>'+
    '<div class="rs">'+s.reason+'</div></div>'; }).join('')+'</div>'; };
V[6]=function(){ return SIGNALS.map(function(s){
  return '<div class="row"><div class="big '+band(s.score)+'">'+s.score+'</div><div class="rx">'+
    '<div class="nm">'+s.name+'<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span></div>'+
    '<div class="rs">'+s.reason+'</div></div></div>'; }).join(''); };
V[7]=function(){ return SIGNALS.map(function(s){ var b=band(s.score);
  return '<div class="row '+b+'"><div class="rh"><span class="nm">'+s.name+'</span><span class="sc '+b+'">'+s.score+'</span></div>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span>'+
    '<div class="rs">'+s.reason+'</div></div>'; }).join(''); };
V[8]=function(){ return SIGNALS.map(function(s){
  return '<div class="row"><div class="rh"><span class="nm">'+s.name+'</span><span class="sc '+band(s.score)+'">'+s.score+'</span></div>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+grad(s.score)+'"></span></span>'+
    '<div class="rs">'+s.reason+'</div></div>'; }).join(''); };
V[9]=function(){ return '<table><thead><tr><th>Score</th><th>Signal</th><th></th><th>Reasoning</th></tr></thead><tbody>'+SIGNALS.map(function(s){
  return '<tr><td class="sc '+band(s.score)+'">'+s.score+'</td><td class="nm">'+s.name+'</td>'+
    '<td><span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span></td>'+
    '<td class="rs">'+s.reason+'</td></tr>'; }).join('')+'</tbody></table>'; };
V[10]=function(){ return SIGNALS.map(function(s){
  return '<div class="row"><span class="nm">'+s.name+'</span>'+
    '<span class="track"><span class="fill" style="width:'+(s.score*10)+'%;background:'+col(s.score)+'"></span></span>'+
    '<span class="rs" title="'+s.reason+'"><b class="sc '+band(s.score)+'">'+s.score+'</b> · '+s.reason+'</span></div>'; }).join(''); };

var TITLES = {
  1:['Bars + reasoning below','muted caption per row'],
  2:['Two columns','bar left · reasoning right'],
  3:['Score chip','bar under name · reasoning right'],
  4:['Segmented pips','10-pip meter + reasoning'],
  5:['Card tiles','2-up grid, bar per card'],
  6:['Big number','large score · thin bar'],
  7:['Accent border','colored left edge by band'],
  8:['Gradient bars','soft gradient fills'],
  9:['Table','zebra rows, bar column'],
  10:['Dense compact','inline bar, clamped reasoning']
};
var grid=document.getElementById('grid'); var html='';
for(var i=1;i<=10;i++){
  html+='<div class="panel"><div class="panel-h"><span class="panel-n">V'+i+'</span><span class="panel-t">'+TITLES[i][0]+'</span><span class="panel-d">'+TITLES[i][1]+'</span></div>'+
    '<div class="v'+i+'">'+V[i]()+'</div></div>';
}
grid.innerHTML=html;
var tb=document.getElementById('themeBtn');
tb.addEventListener('click',function(){ var d=document.documentElement.getAttribute('data-theme')==='dark'; document.documentElement.setAttribute('data-theme', d?'light':'dark'); tb.textContent=d?'☾ Dark':'☀ Light'; });
</script>
</body>
</html>
