<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · 03 Slice Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --ink: #1b2333;
    --ink-soft: #5a6580;
    --ink-faint: #97a0b5;
    --line: #e6e9f2;
    --line-soft: #eef1f7;

    --slate: #64748b;
    --slate-soft: #eef1f6;
    --blue: #3b82f6;
    --blue-soft: #e8f1ff;
    --violet: #7c5cff;
    --violet-soft: #efeaff;
    --amber: #f59e0b;
    --amber-soft: #fff3da;
    --green: #16a34a;
    --green-soft: #e3f7ea;
    --red: #ef4444;
    --red-soft: #fdeaea;

    --shadow-sm: 0 1px 2px rgba(20,30,60,.05), 0 1px 3px rgba(20,30,60,.06);
    --shadow-md: 0 6px 20px rgba(20,30,60,.10);
    --shadow-lg: 0 24px 60px rgba(20,30,60,.22);
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, #eef0ff 0%, transparent 55%),
      radial-gradient(900px 500px at -5% 110%, #e7fbef 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 22px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #3b82f6);
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 15px;
    box-shadow: 0 4px 12px rgba(124,92,255,.35);
  }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }

  .metrics { display: flex; gap: 8px; margin-left: 6px; }
  .metric {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 7px 13px; box-shadow: var(--shadow-sm);
  }
  .metric .v { font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
  .metric .k { font-size: 10px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .metric.alert .v { color: var(--amber); }

  .spacer { flex: 1; }

  /* global command bar */
  .cmd {
    display: flex; align-items: center; gap: 10px;
    width: 420px; max-width: 38vw;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 14px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  .cmd:focus-within { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-soft); }
  .cmd .glyph { color: var(--violet); font-weight: 800; }
  .cmd input { border: 0; outline: 0; flex: 1; font-family: inherit; font-size: 13.5px; background: transparent; color: var(--ink); }
  .cmd input::placeholder { color: var(--ink-faint); }
  .cmd .kbd { font-size: 10px; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-weight: 600; }

  /* ---------- Board ---------- */
  .board-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .board-title {
    display: flex; align-items: baseline; gap: 12px; padding: 16px 22px 8px;
  }
  .board-title h2 { margin: 0; font-size: 19px; letter-spacing: -.4px; }
  .board-title span { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
  .board-title .hint { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }

  .board {
    flex: 1;
    display: flex; gap: 16px;
    padding: 6px 22px 22px;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
  }
  .board::-webkit-scrollbar { height: 11px; }
  .board::-webkit-scrollbar-thumb { background: #d7dceb; border-radius: 99px; border: 3px solid var(--bg); }

  .col {
    flex: 0 0 312px; width: 312px;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,.55);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    scroll-snap-align: start;
    max-height: 100%;
  }
  .col-head {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px; border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
  }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-head h3 { margin: 0; font-size: 13.5px; font-weight: 700; letter-spacing: -.1px; flex: 1; }
  .count-chip {
    font-size: 12px; font-weight: 800; min-width: 22px; text-align: center;
    border-radius: 8px; padding: 2px 8px;
  }
  /* column accent themes */
  .col-todo .col-head { background: var(--slate-soft); }
  .col-todo .dot, .col-todo .count-chip { color: #fff; }
  .col-todo .dot { background: var(--slate); }
  .col-todo .count-chip { background: var(--slate); }

  .col-building .col-head { background: var(--blue-soft); }
  .col-building .dot { background: var(--blue); }
  .col-building .count-chip { background: var(--blue); color: #fff; }

  .col-await .col-head { background: linear-gradient(180deg, var(--violet-soft), #faf7ff); }
  .col-await .dot { background: var(--violet); }
  .col-await .count-chip { background: var(--violet); color: #fff; }

  .col-shipped .col-head { background: var(--green-soft); }
  .col-shipped .dot { background: var(--green); }
  .col-shipped .count-chip { background: var(--green); color: #fff; }

  .col-blocked .col-head { background: var(--red-soft); }
  .col-blocked .dot { background: var(--red); }
  .col-blocked .count-chip { background: var(--red); color: #fff; }

  /* glow on awaiting column */
  .col-await {
    border-color: #cdb9ff;
    box-shadow: 0 0 0 1px #cdb9ff, 0 10px 34px rgba(124,92,255,.20);
    animation: colGlow 3.2s ease-in-out infinite;
  }
  @keyframes colGlow {
    0%,100% { box-shadow: 0 0 0 1px #cdb9ff, 0 10px 30px rgba(124,92,255,.16); }
    50% { box-shadow: 0 0 0 1px #b79bff, 0 14px 42px rgba(124,92,255,.34); }
  }

  .col-body {
    padding: 12px; overflow-y: auto; flex: 1;
    display: flex; flex-direction: column; gap: 11px;
  }
  .col-body::-webkit-scrollbar { width: 9px; }
  .col-body::-webkit-scrollbar-thumb { background: #dde1ee; border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }

  /* ---------- Cards ---------- */
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px 12px 16px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--slate);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #d6dcec; }
  .card.s-building::before { background: var(--blue); }
  .card.s-awaiting_approval::before { background: linear-gradient(var(--violet), var(--amber)); }
  .card.s-shipped::before { background: var(--green); }
  .card.s-blocked::before { background: var(--red); }
  .card.s-todo::before { background: var(--slate); }

  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .co-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    background: var(--line-soft); border-radius: 7px; padding: 3px 8px;
  }
  .co-tag .cdot { width: 6px; height: 6px; border-radius: 50%; }
  .cdot.active { background: var(--green); }
  .cdot.paused { background: var(--amber); }
  .cdot.archived { background: var(--ink-faint); }
  .slice-no { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--ink-faint); }

  .card h4 { margin: 0 0 9px; font-size: 13.5px; font-weight: 600; line-height: 1.35; letter-spacing: -.1px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  .sd-todo { background: var(--slate); }
  .sd-building { background: var(--blue); }
  .sd-awaiting_approval { background: var(--violet); }
  .sd-shipped { background: var(--green); }
  .sd-blocked { background: var(--red); }

  .card-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .pill {
    border-radius: 7px; padding: 3px 8px; font-weight: 700; font-size: 10.5px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pill.check { background: var(--green-soft); color: var(--green); }
  .pill.prio { background: #f1f3fa; color: var(--ink-soft); }
  .pill.dep { background: var(--amber-soft); color: #b97700; }
  .pill.note { background: var(--red-soft); color: var(--red); }

  /* building step line + pulse */
  .step-line {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--blue); font-weight: 600;
    background: var(--blue-soft); border-radius: 8px; padding: 6px 9px;
  }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; animation: pulse 1.3s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(59,130,246,.55); }
    70% { box-shadow: 0 0 0 7px rgba(59,130,246,0); }
    100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
  }

  /* the standout awaiting card */
  .card.standout {
    border-color: #c4abff;
    box-shadow: 0 0 0 1px #c4abff, 0 14px 30px rgba(124,92,255,.22);
    background: linear-gradient(180deg, #fdfbff, #fff);
  }
  .needs-you {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--violet); color: #fff; border-radius: 8px;
    font-size: 10.5px; font-weight: 800; padding: 4px 9px; letter-spacing: .3px;
    box-shadow: 0 3px 10px rgba(124,92,255,.4);
  }
  .preview-mini { font-size: 10.5px; color: var(--violet); font-weight: 700; text-decoration: none; }

  /* opportunities mini-rail at bottom of board area handled in a sticky col */
  .col-ops .col-head { background: #fff4e8; }
  .col-ops .col-head .dot { background: var(--amber); }
  .col-ops .col-head .count-chip { background: var(--amber); color: #fff; }
  .op-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; box-shadow: var(--shadow-sm);
  }
  .op-card h4 { margin: 0 0 4px; font-size: 13.5px; }
  .op-card .thought { font-size: 11px; color: var(--ink-faint); font-style: italic; margin: 0 0 9px; line-height: 1.4; }
  .op-row { display: flex; align-items: center; gap: 8px; }
  .score {
    font-weight: 800; font-size: 12px; border-radius: 8px; padding: 3px 9px;
  }
  .score.hi { background: var(--green-soft); color: var(--green); }
  .score.mid { background: var(--amber-soft); color: #b97700; }
  .score.lo { background: var(--slate-soft); color: var(--slate); }
  .promote {
    margin-left: auto; border: 0; cursor: pointer;
    background: var(--ink); color: #fff; font-family: inherit; font-weight: 700;
    font-size: 11px; border-radius: 8px; padding: 6px 12px;
    transition: transform .12s, background .15s;
  }
  .promote:hover { transform: translateY(-1px); background: #000; }
  .promote.done { background: var(--green); }
  .op-card.killed { opacity: .55; }
  .op-card.killed .promote { background: var(--ink-faint); cursor: default; }

  .next-card {
    background: linear-gradient(135deg,#1b2333,#2b3552); color:#fff;
    border-radius: 12px; padding: 13px; box-shadow: var(--shadow-md);
  }
  .next-card h5 { margin: 0 0 9px; font-size: 12px; letter-spacing: .4px; text-transform: uppercase; color: #aeb8d6; }
  .next-card ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .next-card li { font-size: 12px; line-height: 1.4; display: flex; gap: 8px; align-items: flex-start; }
  .next-card li b { color: #ffd27a; font-weight: 800; }

  /* ---------- Activity strip ---------- */
  .activity {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(20,30,60,.10);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .activity-bar {
    display: flex; align-items: center; gap: 12px; padding: 11px 22px; cursor: pointer;
  }
  .live-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 800; color: var(--green);
    background: var(--green-soft); border-radius: 8px; padding: 4px 10px;
  }
  .live-badge .pulse { background: var(--green); animation: pulseG 1.3s infinite; }
  @keyframes pulseG {
    0% { box-shadow: 0 0 0 0 rgba(22,163,74,.5); }
    70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }
  .latest-line { font-size: 12.5px; color: var(--ink); font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .latest-line b { color: var(--violet); font-weight: 800; }
  .toggle-act { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .chev { transition: transform .3s; }
  .activity.open .chev { transform: rotate(180deg); }

  .activity-full {
    max-height: 0; overflow: hidden; transition: max-height .3s ease;
    border-top: 0 solid var(--line-soft);
  }
  .activity.open .activity-full { max-height: 320px; border-top-width: 1px; overflow-y: auto; }
  .act-groups { display: flex; gap: 18px; padding: 14px 22px 20px; flex-wrap: wrap; }
  .act-group { min-width: 250px; flex: 1; }
  .act-group h6 { margin: 0 0 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-faint); display: flex; align-items: center; gap: 7px; }
  .act-item { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 12px; line-height: 1.4; }
  .act-time { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; min-width: 32px; }
  .act-mark { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: none; }
  .am-building { background: var(--blue); }
  .am-deploy { background: var(--blue); }
  .am-await { background: var(--violet); }
  .am-check { background: var(--green); }
  .am-reprioritize { background: var(--slate); }
  .am-blocked { background: var(--red); }
  .act-item.run .act-mark { animation: pulse 1.3s infinite; }

  /* ---------- Zoom overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(20,28,52,.42); backdrop-filter: blur(4px);
    display: none; align-items: stretch; justify-content: flex-end;
  }
  .overlay.show { display: flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .panel {
    width: min(1120px, 94vw); background: var(--bg);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    animation: slideIn .28s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideIn { from { transform: translateX(40px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }

  .panel-head {
    display: flex; align-items: center; gap: 14px; padding: 16px 22px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .back-btn {
    border: 1px solid var(--line); background: var(--panel); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
    border-radius: 9px; padding: 8px 13px; display: flex; align-items: center; gap: 7px;
    transition: background .15s, border-color .15s;
  }
  .back-btn:hover { background: var(--line-soft); border-color: #d6dcec; }
  .co-avatar {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 15px;
    background: linear-gradient(135deg,#7c5cff,#3b82f6);
  }
  .panel-head .meta h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
  .panel-head .meta p { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .co-badge {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    border-radius: 7px; padding: 4px 9px;
  }
  .co-badge.active { background: var(--green-soft); color: var(--green); }
  .co-badge.paused { background: var(--amber-soft); color: #b97700; }
  .co-stats { margin-left: auto; display: flex; gap: 8px; }
  .co-stat { text-align: right; }
  .co-stat .v { font-size: 15px; font-weight: 800; }
  .co-stat .k { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }

  .panel-body { flex: 1; display: flex; overflow: hidden; }
  .chat-col {
    width: 42%; min-width: 380px; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 13px; }
  .msg { max-width: 86%; font-size: 13px; line-height: 1.5; padding: 11px 14px; border-radius: 14px; }
  .msg.assistant { background: var(--line-soft); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--violet); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .who { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; opacity: .6; margin-bottom: 3px; display: block; }
  .chat-input { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 9px; }
  .chat-input input { flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px; font-family: inherit; font-size: 13px; outline: none; }
  .chat-input input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-soft); }
  .chat-input button { border: 0; background: var(--violet); color: #fff; border-radius: 11px; padding: 0 16px; font-weight: 800; cursor: pointer; font-family: inherit; }

  .art-col { flex: 1; overflow-y: auto; padding: 20px 22px 30px; }
  .art-section { margin-bottom: 22px; }
  .art-section > h3 {
    margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--ink-faint); display: flex; align-items: center; gap: 9px;
  }
  .art-section > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* approval gate */
  .gate {
    background: var(--panel); border: 2px solid #cdb9ff; border-radius: 16px;
    box-shadow: 0 14px 40px rgba(124,92,255,.18); overflow: hidden;
  }
  .gate-head {
    background: linear-gradient(135deg, var(--violet-soft), #fff6e9);
    padding: 15px 18px; display: flex; align-items: center; gap: 11px;
  }
  .gate-head .needs-you { animation: pulseTag 2s infinite; }
  @keyframes pulseTag { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .gate-head h4 { margin: 0; font-size: 14.5px; }
  .gate-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-soft); }
  .gate-body { padding: 16px 18px; }

  .gate-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .preview-url {
    display: inline-flex; align-items: center; gap: 8px;
    background: #0e1626; color: #7ee2a8; font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; border-radius: 9px; padding: 8px 12px; text-decoration: none;
    border: 1px solid #1d2942; transition: border-color .15s;
  }
  .preview-url:hover { border-color: #2f8f59; }
  .preview-url .live { width: 7px; height: 7px; border-radius: 50%; background: #34d27b; animation: pulseG 1.3s infinite; }
  .check-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--green-soft); color: var(--green); font-weight: 800;
    font-size: 12px; border-radius: 9px; padding: 8px 12px;
  }
  .donewhen {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-soft);
    background: var(--green-soft); border: 1px dashed #a6dcb8; border-radius: 9px;
    padding: 9px 12px; margin-bottom: 14px; line-height: 1.5;
  }
  .donewhen b { color: var(--green); }

  .diff {
    background: #0e1626; border-radius: 11px; padding: 14px 16px; overflow-x: auto;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.65; margin-bottom: 16px;
  }
  .diff .ln { display: block; white-space: pre; }
  .diff .add { color: #7ee2a8; }
  .diff .ctx { color: #8895b3; }

  .gate-actions { display: flex; gap: 10px; }
  .btn-approve, .btn-reject {
    flex: 1; border: 0; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 13.5px;
    border-radius: 11px; padding: 13px; transition: transform .12s, box-shadow .15s, background .15s;
  }
  .btn-approve { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(22,163,74,.3); }
  .btn-approve:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(22,163,74,.4); }
  .btn-reject { background: var(--panel); color: var(--red); border: 1.5px solid #f3c4c4; }
  .btn-reject:hover { background: var(--red-soft); }

  .confirm {
    margin-top: 12px; border-radius: 11px; padding: 13px 15px; font-weight: 700; font-size: 13px;
    display: none; align-items: center; gap: 9px; animation: pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  .confirm.show { display: flex; }
  .confirm.approved { background: var(--green-soft); color: var(--green); border: 1px solid #a6dcb8; }
  .confirm.rejected { background: var(--amber-soft); color: #b97700; border: 1px solid #f0d29a; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reject-box { margin-top: 12px; display: none; flex-direction: column; gap: 9px; }
  .reject-box.show { display: flex; }
  .reject-box textarea {
    width: 100%; border: 1.5px solid #f3c4c4; border-radius: 11px; padding: 11px 13px;
    font-family: inherit; font-size: 13px; resize: vertical; min-height: 70px; outline: none;
  }
  .reject-box textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .reject-box button { align-self: flex-end; border: 0; background: var(--red); color: #fff; font-family: inherit; font-weight: 800; border-radius: 10px; padding: 9px 18px; cursor: pointer; }

  /* backlog list */
  .backlog { display: flex; flex-direction: column; gap: 8px; }
  .bl-item {
    display: flex; align-items: center; gap: 11px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 10px 13px; box-shadow: var(--shadow-sm);
  }
  .bl-n { font-size: 11px; font-weight: 800; color: var(--ink-faint); min-width: 30px; }
  .bl-title { flex: 1; font-size: 12.5px; font-weight: 600; }
  .bl-status {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px;
    border-radius: 6px; padding: 3px 8px;
  }
  .bls-shipped { background: var(--green-soft); color: var(--green); }
  .bls-awaiting_approval { background: var(--violet-soft); color: var(--violet); }
  .bls-building { background: var(--blue-soft); color: var(--blue); }
  .bls-todo { background: var(--slate-soft); color: var(--slate); }
  .bls-blocked { background: var(--red-soft); color: var(--red); }
  .bl-prio { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; }

  .preview-frame {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .pf-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--line-soft); border-bottom: 1px solid var(--line); }
  .pf-dots { display: flex; gap: 5px; }
  .pf-dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .pf-dots i:nth-child(1){ background:#ff5f57; } .pf-dots i:nth-child(2){ background:#febc2e; } .pf-dots i:nth-child(3){ background:#28c840; }
  .pf-url { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-soft); background: var(--panel); border-radius: 6px; padding: 4px 9px; flex: 1; }
  .pf-stage { padding: 26px 20px; text-align: center; color: var(--ink-faint); font-size: 13px; }
  .pf-stage .big { font-size: 15px; color: var(--ink); font-weight: 700; margin-bottom: 5px; }

  /* corner badge */
  .corner-badge {
    position: fixed; right: 16px; bottom: 70px; z-index: 80;
    background: var(--ink); color: #fff; font-size: 11px; font-weight: 800;
    border-radius: 10px; padding: 7px 12px; letter-spacing: .3px;
    box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 7px;
  }
  .corner-badge .b { width: 7px; height: 7px; border-radius: 50%; background: #7c5cff; }

  .empty-note { font-size: 11.5px; color: var(--ink-faint); text-align: center; padding: 18px 8px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR : global command bar (chat spine in overview) -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h1>C Slop Slop</h1>
        <p>From thought to bag</p>
      </div>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="spacer"></div>
    <div class="cmd" title="Global command bar - chat is the spine">
      <span class="glyph">⌘</span>
      <input id="cmdInput" placeholder="Direct your companies… e.g. “promote PayoutReconciler” or “approve LeadSift slice 5”" />
      <span class="kbd">↵</span>
    </div>
  </header>

  <!-- BOARD : kanban by slice stage across ALL companies -->
  <div class="board-wrap">
    <div class="board-title">
      <h2>Slice Pipeline</h2>
      <span>Every slice across all 5 companies - by stage. Click a card to zoom into its company.</span>
      <span class="hint">scroll right → for more stages · scroll ↓ within a column</span>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>

<!-- LIVE ACTIVITY STRIP -->
<div class="activity" id="activity">
  <div class="activity-bar" id="actBar">
    <span class="live-badge"><span class="pulse"></span> LIVE</span>
    <span class="latest-line" id="latestLine"></span>
    <span class="toggle-act">Build activity <span class="chev">▾</span></span>
  </div>
  <div class="activity-full" id="actFull"></div>
</div>

<!-- CORNER BADGE -->
<div class="corner-badge"><span class="b"></span> 03 · Slice Pipeline</div>

<!-- ZOOM OVERLAY -->
<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const STAGES = [
  { key:'todo',              label:'Todo',              cls:'col-todo' },
  { key:'building',          label:'Building',          cls:'col-building' },
  { key:'awaiting_approval', label:'Awaiting approval', cls:'col-await' },
  { key:'shipped',           label:'Shipped',           cls:'col-shipped' },
  { key:'blocked',           label:'Blocked',           cls:'col-blocked' },
];
const coById = id => DATA.companies.find(c => c.id === id);

/* Build a flat list of slice-cards across every company */
function buildCards() {
  const cards = [];
  DATA.companies.forEach(co => {
    const list = co.slices ? co.slices : (co.currentSlice ? [co.currentSlice] : []);
    list.forEach(s => {
      cards.push({
        coId: co.id, coName: co.name, coStatus: co.status,
        n: s.n, title: s.title, status: s.status,
        check: s.check, priority: s.priority, step: s.step,
        note: s.note, dependsOn: s.dependsOn,
      });
    });
  });
  return cards;
}

/* ---------- metrics ---------- */
function renderMetrics() {
  const p = DATA.portfolio;
  const m = [
    { v:'$'+p.mrr, k:'MRR' },
    { v:p.users, k:'Users' },
    { v:p.activeCompanies, k:'Companies' },
    { v:p.slicesShipped, k:'Shipped' },
    { v:p.needsYou, k:'Needs You', alert:true },
  ];
  const wrap = $('#metrics');
  m.forEach(x => {
    const d = el('div', 'metric' + (x.alert ? ' alert' : ''));
    d.appendChild(el('div', 'v', x.v));
    d.appendChild(el('div', 'k', x.k));
    wrap.appendChild(d);
  });
}

/* ---------- board ---------- */
function renderBoard() {
  const board = $('#board');
  board.innerHTML = '';
  const cards = buildCards();

  STAGES.forEach(stage => {
    const items = cards.filter(c => c.status === stage.key);
    const col = el('div', 'col ' + stage.cls);

    const head = el('div', 'col-head');
    head.appendChild(el('span', 'dot'));
    head.appendChild(el('h3', null, stage.label));
    head.appendChild(el('span', 'count-chip', String(items.length)));
    col.appendChild(head);

    const body = el('div', 'col-body');
    if (!items.length) body.appendChild(el('div', 'empty-note', 'no slices here'));
    items.forEach(c => body.appendChild(makeCard(c)));
    col.appendChild(body);
    board.appendChild(col);
  });

  // Opportunities column (intake) - keeps growing right
  board.appendChild(makeOppColumn());
  // Next moves column at the far right
  board.appendChild(makeNextColumn());
}

function makeCard(c) {
  const standout = (c.coId === 'leadsift' && c.n === 5);
  const card = el('div', 'card s-' + c.status + (standout ? ' standout' : ''));
  card.dataset.co = c.coId;

  const top = el('div', 'card-top');
  const tag = el('span', 'co-tag');
  tag.appendChild(el('span', 'cdot ' + c.coStatus));
  tag.appendChild(document.createTextNode(c.coName));
  top.appendChild(tag);
  top.appendChild(el('span', 'status-dot sd-' + c.status, ''));
  top.appendChild(el('span', 'slice-no', '#' + c.n));
  card.appendChild(top);

  card.appendChild(el('h4', null, c.title));

  if (c.status === 'building') {
    card.appendChild(el('div', 'step-line', '<span class="pulse"></span>' + (c.step || 'building…')));
  }

  const foot = el('div', 'card-foot');
  if (standout) {
    foot.appendChild(el('span', 'needs-you', '★ NEEDS YOU'));
    const a = el('a', 'preview-mini', 'preview ↗');
    a.href = 'http://localhost:4019/digest/preview'; a.target = '_blank';
    a.onclick = e => e.stopPropagation();
    foot.appendChild(a);
  } else {
    if (c.check === 'green') foot.appendChild(el('span', 'pill check', '✓ check green'));
    if (c.priority != null) foot.appendChild(el('span', 'pill prio', 'P ' + c.priority));
    if (c.dependsOn) foot.appendChild(el('span', 'pill dep', '⛓ needs #' + c.dependsOn.join(',')));
    if (c.note) foot.appendChild(el('span', 'pill note', '⚠ ' + c.note));
  }
  card.appendChild(foot);

  card.onclick = () => openZoom(c.coId, c.n);
  return card;
}

function makeOppColumn() {
  const live = DATA.opportunities;
  const col = el('div', 'col col-ops');
  const head = el('div', 'col-head');
  head.appendChild(el('span', 'dot'));
  head.appendChild(el('h3', null, 'Opportunities'));
  head.appendChild(el('span', 'count-chip', String(live.filter(o => o.status === 'candidate').length)));
  col.appendChild(head);

  const body = el('div', 'col-body');
  live.forEach(o => {
    const killed = o.status === 'killed';
    const c = el('div', 'op-card' + (killed ? ' killed' : ''));
    c.appendChild(el('h4', null, o.title));
    c.appendChild(el('p', 'thought', '“' + o.thought + '”'));
    const row = el('div', 'op-row');
    const tier = o.score >= 80 ? 'hi' : o.score >= 60 ? 'mid' : 'lo';
    row.appendChild(el('span', 'score ' + tier, o.score));
    const btn = el('button', 'promote', killed ? 'Killed' : 'Promote →');
    if (!killed) {
      btn.onclick = () => {
        btn.classList.add('done'); btn.textContent = 'Promoted ✓';
        setTimeout(() => { btn.classList.remove('done'); btn.textContent = 'Promote →'; }, 1600);
      };
    } else btn.disabled = true;
    row.appendChild(btn);
    c.appendChild(row);
    body.appendChild(c);
  });
  col.appendChild(body);
  return col;
}

function makeNextColumn() {
  const col = el('div', 'col');
  col.style.background = 'transparent'; col.style.border = '0';
  const body = el('div', 'col-body'); body.style.padding = '0';
  const card = el('div', 'next-card');
  card.appendChild(el('h5', null, 'Next moves'));
  const ul = el('ul');
  DATA.nextMoves.forEach(m => {
    const txt = m.replace(/“([^”]+)”/g, '<b>$1</b>').replace(/(slice \d+)/i, '<b>$1</b>');
    ul.appendChild(el('li', null, '<span>→</span><span>' + txt + '</span>'));
  });
  card.appendChild(ul);
  body.appendChild(card);
  col.appendChild(body);
  return col;
}

/* ---------- activity strip ---------- */
function renderActivity() {
  // collapsed: one line per actively-building company, joined; show latest running
  const running = DATA.activity.filter(a => a.running);
  const latest = running[0] || DATA.activity[0];
  $('#latestLine').innerHTML = '<b>' + latest.co + '</b> · ' + latest.text;

  // expanded: grouped by company
  const full = $('#actFull');
  const groups = el('div', 'act-groups');
  const byCo = {};
  DATA.activity.forEach(a => { (byCo[a.co] = byCo[a.co] || []).push(a); });
  Object.keys(byCo).forEach(co => {
    const g = el('div', 'act-group');
    const coObj = DATA.companies.find(c => c.name === co);
    const sCls = coObj ? coObj.status : 'active';
    g.appendChild(el('h6', null, '<span class="cdot ' + sCls + '" style="width:7px;height:7px;border-radius:50%;display:inline-block"></span>' + co));
    byCo[co].forEach(a => {
      const item = el('div', 'act-item' + (a.running ? ' run' : ''));
      item.appendChild(el('span', 'act-mark am-' + a.kind, ''));
      item.appendChild(el('span', null, a.text));
      item.appendChild(el('span', 'act-time', a.t));
      g.appendChild(item);
    });
    groups.appendChild(g);
  });
  full.appendChild(groups);

  $('#actBar').onclick = () => $('#activity').classList.toggle('open');
}

/* ---------- zoom overlay ---------- */
function openZoom(coId) {
  const co = coById(coId);
  if (!co) return;
  const panel = $('#panel');
  panel.innerHTML = '';

  // head
  const head = el('div', 'panel-head');
  const back = el('button', 'back-btn', '← Back to pipeline');
  back.onclick = closeZoom;
  head.appendChild(back);
  head.appendChild(el('div', 'co-avatar', co.name[0]));
  const meta = el('div', 'meta');
  meta.appendChild(el('h2', null, co.name));
  meta.appendChild(el('p', null, co.thesis + (co.domain ? ' · ' + co.domain : '')));
  head.appendChild(meta);
  head.appendChild(el('span', 'co-badge ' + co.status, co.status));
  const stats = el('div', 'co-stats');
  const shipped = co.slices ? co.slices.filter(s => s.status === 'shipped').length : (co.slicesShipped || 0);
  [['$' + co.mrr, 'MRR'], [co.users, 'Users'], [shipped, 'Shipped']].forEach(([v, k]) => {
    const s = el('div', 'co-stat');
    s.appendChild(el('div', 'v', v));
    s.appendChild(el('div', 'k', k));
    stats.appendChild(s);
  });
  head.appendChild(stats);
  panel.appendChild(head);

  // body
  const body = el('div', 'panel-body');
  body.appendChild(buildChatCol(co));
  body.appendChild(buildArtCol(co));
  panel.appendChild(body);

  $('#overlay').classList.add('show');
}

function buildChatCol(co) {
  const col = el('div', 'chat-col');
  const scroll = el('div', 'chat-scroll');
  const msgs = co.id === 'leadsift' ? DATA.chat : [
    { role:'assistant', text:co.name + ' is ' + (co.currentSlice ? 'on slice ' + co.currentSlice.n + ' - ' + co.currentSlice.title + '.' : 'running.') + ' I’ll surface a slice for approval when a check goes green.' },
    { role:'user', text:'keep going' },
  ];
  msgs.forEach(m => {
    const d = el('div', 'msg ' + m.role);
    d.appendChild(el('span', 'who', m.role === 'user' ? 'You' : co.name));
    d.appendChild(document.createTextNode(m.text));
    scroll.appendChild(d);
  });
  col.appendChild(scroll);

  const input = el('div', 'chat-input');
  const field = el('input'); field.placeholder = 'Message ' + co.name + '…';
  const send = el('button', null, 'Send');
  const fire = () => {
    if (!field.value.trim()) return;
    const u = el('div', 'msg user');
    u.appendChild(el('span', 'who', 'You'));
    u.appendChild(document.createTextNode(field.value));
    scroll.appendChild(u);
    field.value = '';
    setTimeout(() => {
      const a = el('div', 'msg assistant');
      a.appendChild(el('span', 'who', co.name));
      a.appendChild(document.createTextNode('On it - re-prioritizing the backlog and continuing the build.'));
      scroll.appendChild(a);
      scroll.scrollTop = scroll.scrollHeight;
    }, 500);
    scroll.scrollTop = scroll.scrollHeight;
  };
  send.onclick = fire;
  field.addEventListener('keydown', e => { if (e.key === 'Enter') fire(); });
  input.appendChild(field); input.appendChild(send);
  col.appendChild(input);
  return col;
}

function buildArtCol(co) {
  const col = el('div', 'art-col');

  // Approval gate first (only LeadSift has approval data)
  if (co.approval) {
    const sec = el('div', 'art-section');
    sec.appendChild(el('h3', null, 'Approval gate - slice ' + co.approval.slice));
    sec.appendChild(buildGate(co));
    col.appendChild(sec);
  }

  // Live preview
  if (co.previewUrl) {
    const sec = el('div', 'art-section');
    sec.appendChild(el('h3', null, 'Live preview'));
    const frame = el('div', 'preview-frame');
    const bar = el('div', 'pf-bar');
    const dots = el('span', 'pf-dots', '<i></i><i></i><i></i>');
    bar.appendChild(dots);
    const url = (co.approval && co.approval.previewUrl) || co.previewUrl;
    bar.appendChild(el('span', 'pf-url', url));
    frame.appendChild(bar);
    const stage = el('div', 'pf-stage');
    if (co.id === 'leadsift') {
      stage.innerHTML = '<div class="big">📧 Your top leads today</div>Daily digest rendering live - 10 leads scored ≥ 70';
    } else if (co.currentSlice) {
      stage.innerHTML = '<div class="big">' + co.name + '</div>slice ' + co.currentSlice.n + ' - ' + co.currentSlice.title;
    } else {
      stage.innerHTML = '<div class="big">' + co.name + '</div>app running at ' + co.previewUrl;
    }
    frame.appendChild(stage);
    sec.appendChild(frame);
    col.appendChild(sec);
  }

  // Backlog
  const sec = el('div', 'art-section');
  sec.appendChild(el('h3', null, 'Slice backlog'));
  const bl = el('div', 'backlog');
  const list = co.slices ? co.slices : (co.currentSlice ? [co.currentSlice] : []);
  list.forEach(s => {
    const item = el('div', 'bl-item');
    item.appendChild(el('span', 'bl-n', '#' + s.n));
    item.appendChild(el('span', 'bl-title', s.title));
    if (s.priority != null) item.appendChild(el('span', 'bl-prio', 'P' + s.priority));
    item.appendChild(el('span', 'bl-status bls-' + s.status, s.status.replace('_', ' ')));
    bl.appendChild(item);
  });
  sec.appendChild(bl);
  col.appendChild(sec);

  return col;
}

function buildGate(co) {
  const a = co.approval;
  const gate = el('div', 'gate');

  const gh = el('div', 'gate-head');
  gh.appendChild(el('span', 'needs-you', '★ NEEDS YOU'));
  const ghm = el('div');
  ghm.appendChild(el('h4', null, 'Slice ' + a.slice + ' · ' + a.title));
  ghm.appendChild(el('p', null, 'Attempt ' + a.attempt + ' · ready to ship - your call'));
  gh.appendChild(ghm);
  gate.appendChild(gh);

  const gb = el('div', 'gate-body');

  // preview + check row
  const row = el('div', 'gate-row');
  const url = el('a', 'preview-url');
  url.href = a.previewUrl; url.target = '_blank';
  url.innerHTML = '<span class="live"></span>' + a.previewUrl;
  row.appendChild(url);
  row.appendChild(el('span', 'check-pill', '✓ doneWhen ' + a.checkResult));
  gb.appendChild(row);

  // doneWhen
  gb.appendChild(el('div', 'donewhen', '<b>doneWhen</b> &nbsp;' + a.doneWhen.replace(/"/g, '&quot;')));

  // diff
  const diff = el('div', 'diff');
  a.diff.split('\n').forEach(line => {
    const add = line.startsWith('+');
    diff.appendChild(el('span', 'ln ' + (add ? 'add' : 'ctx'), line.replace(/</g, '&lt;')));
  });
  gb.appendChild(diff);

  // actions
  const actions = el('div', 'gate-actions');
  const approve = el('button', 'btn-approve', '✓ Approve & ship');
  const reject = el('button', 'btn-reject', '✕ Reject with feedback');
  actions.appendChild(approve);
  actions.appendChild(reject);
  gb.appendChild(actions);

  const confirmA = el('div', 'confirm approved', '<span>✓</span> Approved - shipping slice ' + a.slice + ' to production. The digest is now live.');
  const confirmR = el('div', 'confirm rejected', '<span>↩</span> Sent back with your feedback - the build will iterate and resubmit.');
  gb.appendChild(confirmA);
  gb.appendChild(confirmR);

  const rejectBox = el('div', 'reject-box');
  const ta = el('textarea'); ta.placeholder = 'What needs to change before this ships? (e.g. “only include leads ≥ 80, send at 09:00”)';
  const submit = el('button', null, 'Send feedback →');
  rejectBox.appendChild(ta); rejectBox.appendChild(submit);
  gb.appendChild(rejectBox);

  approve.onclick = () => {
    confirmR.classList.remove('show'); rejectBox.classList.remove('show');
    confirmA.classList.add('show');
    approve.textContent = 'Approved ✓'; approve.style.background = '#0f8a3c';
  };
  reject.onclick = () => {
    confirmA.classList.remove('show');
    rejectBox.classList.toggle('show');
  };
  submit.onclick = () => {
    rejectBox.classList.remove('show');
    confirmR.classList.add('show');
    ta.value = '';
  };

  gate.appendChild(gb);
  return gate;
}

function closeZoom() { $('#overlay').classList.remove('show'); }

/* ---------- wiring ---------- */
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeZoom(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });
$('#cmdInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  const v = e.target.value.toLowerCase();
  if (v.includes('leadsift') || v.includes('approve') || v.includes('digest')) openZoom('leadsift');
  e.target.value = '';
});

renderMetrics();
renderBoard();
renderActivity();
</script>
</body>
</html>
