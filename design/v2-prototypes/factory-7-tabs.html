<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop · Tabs</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('cslopslop-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f7f3ec;
  --cream-2: #efe8db;
  --paper: #fffdf8;
  --ink: #2c2926;
  --ink-soft: #5b544c;
  --ink-faint: #938a7d;
  --line: #e3dccf;
  --line-soft: #efe9dd;
  --accent: #c8643c;
  --accent-soft: #f3ddd0;
  --green: #4f8a52;
  --green-soft: #dcebda;
  --blue: #4a6ea8;
  --blue-soft: #dbe5f2;
  --violet: #7a5ca8;
  --violet-soft: #e6ddf1;
  --amber: #bf8a2e;
  --amber-soft: #f3e6c9;
  --red: #b8503f;
  --red-soft: #f2dbd5;
  --slate: #6b7280;
  --slate-soft: #e4e5e8;
  --shadow: 0 1px 2px rgba(60,50,40,.05), 0 8px 24px rgba(60,50,40,.06);
  --shadow-lg: 0 4px 12px rgba(60,50,40,.08), 0 24px 48px rgba(60,50,40,.10);
}
:root[data-theme="dark"] {
  --cream: #05060a;
  --cream-2: #0b0e17;
  --paper: #10131f;
  --ink: #e6ebf5;
  --ink-soft: #a4adc2;
  --ink-faint: #6b7488;
  --line: #232838;
  --line-soft: #1a1e2c;
  --accent: #e0794e;
  --accent-soft: #3a241a;
  --green: #34d399;
  --green-soft: #12362c;
  --blue: #6b95e0;
  --blue-soft: #182642;
  --violet: #a688e0;
  --violet-soft: #271d3d;
  --amber: #e0b24e;
  --amber-soft: #362a12;
  --red: #ef7361;
  --red-soft: #3a1d18;
  --slate: #8b93a7;
  --slate-soft: #1f2431;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.4), 0 24px 48px rgba(0,0,0,.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  transition: background .35s ease, color .35s ease;
}

::selection { background: var(--accent-soft); color: var(--accent); }

.mono {
  font-family: 'JetBrains Mono', monospace;
  font-feature-settings: 'tnum' 1;
}
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ============ SHELL ============ */
.app { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* ============ TAB STRIP ============ */
.chrome {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--cream);
  border-bottom: 1px solid var(--line);
  transition: background .35s ease, border-color .35s ease;
}
.chrome-top {
  max-width: 1240px;
  margin: 0 auto;
  padding: 10px 20px 0;
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
  padding-bottom: 8px;
}
.brand-mark {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: linear-gradient(150deg, var(--accent), #a24d2e);
  display: grid;
  place-items: center;
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 2px 6px rgba(200,100,60,.35);
}
.brand-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.brand-name b { color: var(--accent); }
.chrome-spacer { flex: 1; }
.toolbtn {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  border-radius: 9px;
  height: 32px;
  padding: 0 11px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  transition: all .18s ease;
  margin-bottom: 8px;
}
.toolbtn:hover { border-color: var(--ink-faint); color: var(--ink); transform: translateY(-1px); }
.toolbtn svg { width: 15px; height: 15px; }
.toolbtn .kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 4px;
}

/* the actual tabs row */
.tabs {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 14px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 15px 10px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .16s ease, color .16s ease;
  margin-bottom: -1px;
}
.tab:hover { background: var(--cream-2); color: var(--ink); }
.tab.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--line);
  font-weight: 600;
  box-shadow: 0 -3px 8px rgba(60,50,40,.04);
}
.tab.active::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2.5px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
}
.tab-portfolio { font-family: 'Space Grotesk', sans-serif; }
.tab-portfolio svg { width: 15px; height: 15px; opacity: .8; }
.stage-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 3px var(--dot-halo, transparent);
}
.needs-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: 0 0 0 0 var(--accent);
  animation: ndPulse 2.4s ease-in-out infinite;
}
@keyframes ndPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,100,60,.5); }
  50% { box-shadow: 0 0 0 4px rgba(200,100,60,0); }
}
.tab-dead { opacity: .62; }
.tab-dead:not(.active) .tab-label { text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.tab-new {
  color: var(--ink-faint);
  font-size: 18px;
  font-weight: 400;
  padding: 9px 13px 10px;
  border-radius: 10px 10px 0 0;
}
.tab-new:hover { color: var(--accent); background: var(--cream-2); }

/* ============ MAIN PANE ============ */
.pane {
  background: var(--paper);
  min-height: calc(100vh - 96px);
  transition: background .35s ease;
}
.pane-inner { max-width: 1240px; margin: 0 auto; padding: 30px 20px 80px; }

@media (prefers-reduced-motion: no-preference) {
  .view { animation: viewIn .32s cubic-bezier(.2,.7,.3,1); }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
}

/* ============ PORTFOLIO ============ */
.pf-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
.pf-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.1;
}
.pf-sub { color: var(--ink-soft); font-size: 14.5px; margin-top: 6px; max-width: 42ch; }

.totals {
  display: flex;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--cream-2);
  overflow: hidden;
  flex-wrap: wrap;
}
.total-cell {
  padding: 12px 20px;
  border-right: 1px solid var(--line);
  min-width: 118px;
}
.total-cell:last-child { border-right: none; }
.total-val { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.total-val.pos { color: var(--green); }
.total-lbl { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

/* needs-you band */
.needs-band { margin: 30px 0 34px; }
.band-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.band-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
.band-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  border-radius: 20px;
  padding: 2px 9px;
}
.needs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.need-card {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  background: var(--paper);
  border-radius: 12px;
  padding: 15px 16px 14px;
  box-shadow: var(--shadow);
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.need-card.resolved { border-left-color: var(--green); opacity: .96; }
.need-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.need-co { font-weight: 600; font-size: 13.5px; cursor: pointer; }
.need-co:hover { color: var(--accent); }
.need-tag {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.need-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.need-detail { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 13px; }
.need-actions { display: flex; gap: 7px; align-items: center; }
.resolved-msg { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--green); font-weight: 500; }
.resolved-msg svg { width: 15px; height: 15px; }

.btn {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 8px;
  padding: 7px 13px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .16s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #b5572f; }
:root[data-theme="dark"] .btn-primary:hover { background: #c96539; }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn-sm { padding: 5px 10px; font-size: 11.5px; }
.btn-link { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-family: inherit; font-size: 12px; text-decoration: underline; padding: 0; }
.btn-link:hover { color: var(--accent); }

/* portfolio grid of bets */
.bets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.bet-card {
  position: relative;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 14px;
  padding: 18px 18px 16px;
  cursor: pointer;
  transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, border-color .2s;
  text-align: left;
  font-family: inherit;
  color: inherit;
  width: 100%;
}
.bet-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--ink-faint); }
.bet-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bet-dead { opacity: .78; }
.bc-top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.bc-name { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.stage-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 20px;
  margin-left: auto;
  border: 1px solid var(--pill-bd);
  background: var(--pill-bg);
  color: var(--pill-fg);
}
.bc-desc { font-size: 12.8px; color: var(--ink-soft); line-height: 1.45; margin-bottom: 14px; min-height: 37px; }
.bc-meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
.signal { display: flex; align-items: flex-end; gap: 2.5px; height: 16px; }
.sig-bar { width: 4px; border-radius: 2px; background: var(--line); }
.sig-bar.on { background: var(--sig-col); }
.sig-bar:nth-child(1) { height: 6px; }
.sig-bar:nth-child(2) { height: 9px; }
.sig-bar:nth-child(3) { height: 12px; }
.sig-bar:nth-child(4) { height: 16px; }
.sig-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .06em; color: var(--ink-faint); text-transform: uppercase; }
.bc-stats { display: flex; gap: 16px; padding-top: 13px; border-top: 1px solid var(--line-soft); }
.bc-stat { display: flex; flex-direction: column; gap: 1px; }
.bc-stat .n { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
.bc-stat .n.pos { color: var(--green); }
.bc-stat .n.neg { color: var(--ink-faint); }
.bc-stat .l { font-size: 10px; color: var(--ink-faint); }
.bc-flag {
  position: absolute;
  top: 14px; right: 14px;
}
.bc-needs {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); font-weight: 600;
  background: var(--accent-soft);
  border-radius: 20px; padding: 3px 9px;
  margin-top: 12px;
}

/* ============ COMPANY VIEW ============ */
.co-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 4px; }
.co-title-wrap { flex: 1; min-width: 0; }
.co-name { font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; }
.co-desc { color: var(--ink-soft); font-size: 15px; margin-top: 6px; max-width: 58ch; }
.co-status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 500; margin-top: 12px;
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--cream-2);
}
.co-status .dot { width: 7px; height: 7px; border-radius: 50%; }

/* doc tabs (depth on demand) */
.doctabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); margin: 26px 0 24px; overflow-x: auto; scrollbar-width: none; }
.doctabs::-webkit-scrollbar { display: none; }
.doctab {
  padding: 9px 15px;
  background: none; border: none;
  border-bottom: 2px solid transparent;
  color: var(--ink-faint);
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
  transition: color .16s, border-color .16s;
  margin-bottom: -1px;
}
.doctab:hover { color: var(--ink); }
.doctab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* overview grid */
.ov-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .ov-grid { grid-template-columns: 1fr; } }

.card {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 18px; }
.card-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.card-eyebrow h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
.card-ico { color: var(--accent); display: grid; place-items: center; }
.card-ico svg { width: 16px; height: 16px; }

/* goal + progress */
.goal-text { font-family: 'Spectral', serif; font-size: 16px; line-height: 1.5; color: var(--ink); margin-bottom: 16px; }
.goal-text b { color: var(--accent); font-weight: 600; }
.prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.prog-lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }
.prog-val { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
.prog-track { height: 10px; border-radius: 6px; background: var(--line-soft); overflow: hidden; position: relative; }
.prog-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--green), #6aad6d); transition: width .9s cubic-bezier(.2,.7,.3,1); position: relative; }
.prog-fill.over { background: linear-gradient(90deg, var(--green), #3fa876); }
.prog-note { font-size: 12px; color: var(--green); margin-top: 8px; font-weight: 500; }

/* plan block */
.plan-line { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
.nba {
  margin-top: 16px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 11px;
  padding: 14px 15px;
}
.nba-eye { color: var(--accent); font-weight: 600; margin-bottom: 5px; }
.nba-text { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.nba-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* recent activity */
.feed { list-style: none; }
.feed li { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.feed li:last-child { border-bottom: none; }
.feed .fdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
.feed .ftime { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; }
.feed .ftext { color: var(--ink-soft); }

/* metrics mini */
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.metric { background: var(--paper); padding: 14px 16px; }
.metric .mv { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.metric .mv.pos { color: var(--green); }
.metric .ml { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

/* risk */
.risk-line { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-soft); }
.risk-line svg { width: 16px; height: 16px; color: var(--amber); flex-shrink: 0; margin-top: 1px; }

/* recommendation */
.rec {
  display: flex; align-items: center; gap: 13px;
  border-radius: 12px; padding: 15px 17px;
  border: 1px solid var(--rec-bd);
  background: var(--rec-bg);
}
.rec-badge {
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 7px;
  background: var(--rec-fg); color: var(--paper);
}
.rec-text { font-size: 13px; color: var(--ink-soft); }
.rec-text b { color: var(--ink); font-weight: 600; }

/* decision bar */
.decide-bar { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

/* approval card */
.approval {
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 18px 20px;
  background: linear-gradient(180deg, var(--accent-soft), var(--paper));
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}
:root[data-theme="dark"] .approval { background: linear-gradient(180deg, var(--accent-soft), var(--paper)); }
.approval .ap-eye { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; margin-bottom: 9px; }
.approval .ap-eye svg { width: 15px; height: 15px; }
.ap-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.ap-detail { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 16px; max-width: 62ch; }
.ap-detail .rev { color: var(--green); font-weight: 500; }

/* prose docs */
.prose { font-family: 'Spectral', serif; font-size: 16px; line-height: 1.68; color: var(--ink); max-width: 68ch; }
.prose h4 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 26px 0 9px; }
.prose h4:first-child { margin-top: 0; }
.prose p { margin-bottom: 13px; }
.prose ul { margin: 0 0 14px 0; padding-left: 4px; list-style: none; }
.prose ul li { position: relative; padding-left: 20px; margin-bottom: 7px; }
.prose ul li::before { content: '-'; position: absolute; left: 0; color: var(--accent); }
.prose .kv { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-soft); }
.doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 6px 0 20px; }
.doc-kpi { border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; background: var(--cream-2); }
.doc-kpi .dv { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; }
.doc-kpi .dl { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

/* new bet view */
.newbet { max-width: 560px; margin: 40px auto; text-align: center; }
.newbet .nb-ico { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 18px; }
.newbet .nb-ico svg { width: 28px; height: 28px; }
.newbet h2 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 8px; }
.newbet p { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 22px; }
.nb-input {
  display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 12px;
  padding: 7px 7px 7px 15px; background: var(--paper); box-shadow: var(--shadow); align-items: center;
}
.nb-input input {
  flex: 1; border: none; background: none; outline: none;
  font-family: inherit; font-size: 14.5px; color: var(--ink);
}
.nb-input input::placeholder { color: var(--ink-faint); }
.nb-hint { margin-top: 16px; font-size: 12.5px; color: var(--ink-faint); }
.nb-flow { display: flex; justify-content: center; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
.nb-step { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); border: 1px dashed var(--line); border-radius: 20px; padding: 5px 12px; }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--cream);
  padding: 11px 18px; border-radius: 11px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-lg); z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast svg { width: 16px; height: 16px; color: var(--green); }
.toast .undo { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; }
:root[data-theme="dark"] .toast .undo { color: var(--accent); }

.foot { text-align: center; padding: 30px 0 10px; color: var(--ink-faint); font-size: 11.5px; }
.foot .kbds { display: inline-flex; gap: 6px; margin-top: 8px; }
.foot .kc { font-family: 'JetBrains Mono', monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 10px; }
</style>
</head>

/* ---------- THEME ---------- */
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') ||

}
function paintThemeIcon() {
  $('#themeIcon').innerHTML = currentTheme() === 'dark' ? ICON.sun : ICON.moon;
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('cslopslop-theme', next); } catch (e) {}
  paintThemeIcon();
}

  tabs.innerHTML = '';

  // Portfolio tab
  const pf = el('button', 'tab tab-portfolio' + (active === 'portfolio' ? ' active' : ''));
  pf.setAttribute('role', 'tab');
  pf.innerHTML = ICON.grid + '<span>Portfolio</span>';
  pf.onclick = () => go('portfolio');
  tabs.appendChild(pf);

  // Company tabs
  COMPANIES.forEach((c, i) => {
    const s = STAGE[c.stage];
    const needs = c.approval && !resolved[c.id];
    const t = el('button', 'tab' + (c.dead ? ' tab-dead' : '') + (active === c.id ? ' active' : ''));
    t.setAttribute('role', 'tab');
    t.title = c.name + ' · ' + c.stage + (needs ? ' · needs you' : '');
    t.innerHTML =
      '<span class="stage-dot" style="background:' + s.col + '"></span>' +
      '<span class="tab-label">' + c.name + '</span>' +
      (needs ? '<span class="needs-dot" aria-label="needs you"></span>' : '');
    t.onclick = () => go(c.id);
    tabs.appendChild(t);
  });

  // New bet tab
  const nb = el('button', 'tab tab-new' + (active === 'new' ? ' active' : ''));
  nb.title = 'Start a new bet';
  nb.setAttribute('aria-label', 'New bet');
  nb.innerHTML = '+';
  nb.onclick = () => go('new');
  tabs.appendChild(nb);
}

/* ---------- NAV ---------- */
function go(id) {
  active = id;
  renderTabs();
  renderView();
  const av = $('.tab.active');
  if (av && av.scrollIntoView) av.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function orderedIds() {
  return ['portfolio'].concat(COMPANIES.map(c => c.id)).concat(['new']);
}

/* ---------- RENDER VIEW ---------- */
function renderView() {
  const v = $('#view');
  if (active === 'portfolio') v.innerHTML = ''; else v.innerHTML = '';
  const wrap = el('div', 'view');
  if (active === 'portfolio') wrap.appendChild(renderPortfolio());
  else if (active === 'new') wrap.appendChild(renderNew());
  else wrap.appendChild(renderCompany(co(active)));
  v.innerHTML = '';
  v.appendChild(wrap);
  bindDynamic();
}

/* ----- PORTFOLIO ----- */
function renderPortfolio() {
  const root = el('div');

  // header + totals
  const head = el('div', 'pf-head');
  head.innerHTML =
    '<div>' +
      '<div class="eyebrow">Zoom out · all bets</div>' +
      '<h1 class="pf-title">The portfolio</h1>' +
      '<p class="pf-sub">Six AI-operated bets across every stage. You approve the few calls that matter - the factory runs the rest.</p>' +
    '</div>';
  const totals = el('div', 'totals');
  totals.innerHTML =
    tcell(TOTALS.bets, 'active bets') +
    tcell(money(TOTALS.spend) + '/mo', 'spend') +
    tcell(money(TOTALS.revenue) + '/mo', 'active revenue') +
    tcell('<span class="pos">+' + money(TOTALS.net) + '/mo</span>', 'net') +
    tcell(pendingCount(), 'need you');
  head.appendChild(totals);
  root.appendChild(head);

  // needs-you band
  root.appendChild(renderNeedsBand());

  // bets grid
  const gridHead = el('div', 'band-head');
  gridHead.innerHTML = '<h2>All bets</h2>';
  root.appendChild(gridHead);

  const grid = el('div', 'bets-grid');
  COMPANIES.forEach(c => grid.appendChild(betCard(c)));
  root.appendChild(grid);

  return root;
}
function tcell(val, lbl) {
  return '<div class="total-cell"><div class="total-val">' + val + '</div><div class="total-lbl">' + lbl + '</div></div>';
}

function renderNeedsBand() {
  const band = el('div', 'needs-band');
  const n = pendingCount();
  const head = el('div', 'band-head');
  head.innerHTML = '<h2>Needs you</h2>' + (n > 0 ? '<span class="band-count">' + n + '</span>' : '<span class="need-tag">all clear</span>');
  band.appendChild(head);

  const grid = el('div', 'needs-grid');
  COMPANIES.filter(c => c.approval).forEach(c => grid.appendChild(needCard(c)));
  band.appendChild(grid);
  return band;
}

function needCard(c) {
  const card = el('div', 'need-card' + (resolved[c.id] ? ' resolved' : ''));
  card.dataset.need = c.id;
  card.innerHTML = needCardInner(c);
  return card;
}
function needCardInner(c) {
  const s = STAGE[c.stage];
  const top =
    '<div class="need-top">' +
      '<span class="stage-dot" style="background:' + s.col + '"></span>' +
      '<span class="need-co" data-open="' + c.id + '">' + c.name + '</span>' +
      '<span class="need-tag">' + c.stage + '</span>' +
    '</div>' +
    '<div class="need-title">' + c.approval.title + '</div>';

  if (resolved[c.id]) {
    const label = resolved[c.id] === 'approved' ? 'Approved · reversible'
      : resolved[c.id] === 'held' ? 'On hold'
      : 'Killed';
    return top +
      '<div class="need-actions"><span class="resolved-msg">' + ICON.check + label + '</span>' +
      '<button class="btn-link" data-undo="' + c.id + '">undo</button></div>';
  }
  return top +
    '<div class="need-detail">' + c.approval.detail + '</div>' +
    '<div class="need-actions">' +
      '<button class="btn btn-primary btn-sm" data-approve="' + c.id + '">' + ICON.check + 'Approve</button>' +
      '<button class="btn btn-sm" data-hold="' + c.id + '">Hold</button>' +
      '<button class="btn btn-ghost btn-sm btn-danger" data-kill="' + c.id + '">Kill</button>' +
    '</div>';
}

function betCard(c) {
  const s = STAGE[c.stage];
  const sig = SIGNAL[c.signal];
  const needs = c.approval && !resolved[c.id];
  const btn = el('button', 'bet-card' + (c.dead ? ' bet-dead' : ''));
  btn.style.setProperty('--pill-bd', s.bg);
  btn.style.setProperty('--pill-bg', s.bg);
  btn.style.setProperty('--pill-fg', s.fg);
  btn.style.setProperty('--sig-col', sig.col);
  btn.onclick = () => go(c.id);

  let bars = '';
  for (let i = 0; i < 4; i++) bars += '<span class="sig-bar' + (i < sig.lvl ? ' on' : '') + '"></span>';

  const netCls = c.net > 0 ? 'pos' : 'neg';
  const netStr = c.stage === 'Ejected' ? 'off book' : (c.net === 0 ? '$0' : (c.net > 0 ? '+' : '') + money(c.net));

  btn.innerHTML =
    '<div class="bc-top">' +
      '<span class="stage-dot" style="background:' + s.col + '"></span>' +
      '<span class="bc-name">' + c.name + '</span>' +
      '<span class="stage-pill">' + c.stage + '</span>' +
    '</div>' +
    '<div class="bc-desc">' + c.desc + '</div>' +
    '<div class="bc-meter-row">' +
      '<span class="signal" title="Traction signal">' + bars + '</span>' +
      '<span class="sig-label">' + c.signal + '</span>' +
    '</div>' +
    '<div class="bc-stats">' +
      stat(c.users, c.usersLbl) +
      stat(money(c.revenue) + '/mo', 'revenue') +
      stat('<span class="' + netCls + '">' + netStr + '</span>', 'net/mo') +
    '</div>' +
    (needs ? '<div class="bc-needs">' + ICON.bell + 'Needs you</div>' : '');
  return btn;
}
function stat(n, l) {
  return '<div class="bc-stat"><span class="n">' + n + '</span><span class="l">' + l + '</span></div>';
}

/* ----- COMPANY ----- */
function renderCompany(c) {
  const root = el('div');
  const s = STAGE[c.stage];
  const tab = docTab[c.id] || 'overview';

  // header
  const header = el('div', 'co-header');
  header.innerHTML =
    '<div class="co-title-wrap">' +
      '<div class="eyebrow">Zoom in · ' + c.stage.toLowerCase() + ' stage</div>' +
      '<div class="co-name">' + c.name +
        '<span class="stage-pill" style="--pill-bd:' + s.bg + ';--pill-bg:' + s.bg + ';--pill-fg:' + s.fg + '">' + c.stage + '</span>' +
      '</div>' +
      '<p class="co-desc">' + c.desc + '</p>' +
      '<span class="co-status"><span class="dot" style="background:' + s.col + '"></span>' + c.status + '</span>' +
    '</div>';
  root.appendChild(header);

  // doc tabs
  const dt = el('div', 'doctabs');
  [['overview','Overview'],['foundation','Foundation'],['product','Product'],['growth','Growth'],['budget','Budget']]
    .forEach(([k, lbl]) => {
      const b = el('button', 'doctab' + (tab === k ? ' active' : ''));
      b.textContent = lbl;
      b.onclick = () => { docTab[c.id] = k; renderView(); };
      dt.appendChild(b);
    });
  root.appendChild(dt);

  if (tab === 'overview') root.appendChild(renderOverview(c));
  else root.appendChild(renderDoc(c, tab));

  return root;
}

function renderOverview(c) {
  const wrap = el('div');

  // pending approval hero (only if unresolved)
  if (c.approval && !resolved[c.id]) {
    const ap = el('div', 'approval');
    ap.dataset.approval = c.id;
    ap.innerHTML = approvalInner(c);
    wrap.appendChild(ap);
  } else if (c.approval && resolved[c.id]) {
    const ap = el('div', 'approval');
    ap.dataset.approval = c.id;
    ap.style.background = 'var(--paper)';
    ap.style.borderColor = 'var(--green)';
    ap.innerHTML = approvalInner(c);
    wrap.appendChild(ap);
  }

  const grid = el('div', 'ov-grid');

  // LEFT column
  const left = el('div');

  // goal + progress
  const goalCard = el('div', 'card');
  const over = c.goalProgress >= 1;
  goalCard.innerHTML =
    cardHead(ICON.target, 'Validation goal') +
    '<div class="goal-text">' + c.goal + '</div>' +
    '<div class="prog-row"><span class="prog-lbl">Progress</span><span class="prog-val">' + c.progressVal + '</span></div>' +
    '<div class="prog-track"><div class="prog-fill' + (over ? ' over' : '') + '" style="width:0%" data-w="' + Math.min(100, Math.round(c.goalProgress * 100)) + '"></div></div>' +
    '<div class="prog-note">' + c.progressNote + '</div>';
  left.appendChild(goalCard);

  // AI plan + next best action
  const planCard = el('div', 'card');
  planCard.innerHTML =
    cardHead(ICON.bot, 'What the AI is doing') +
    '<div class="plan-line">' + c.plan + '</div>' +
    '<div class="nba">' +
      '<div class="nba-eye eyebrow" style="color:var(--accent)">Next best action</div>' +
      '<div class="nba-text">' + c.nba + '</div>' +
      nbaActions(c) +
    '</div>';
  left.appendChild(planCard);

  // recent activity
  const feedCard = el('div', 'card');
  let feed = '';
  c.recent.forEach(r => {
    feed += '<li><span class="fdot"></span><span class="ftext">' + r.t + '</span><span class="ftime">' + r.time + ' ago</span></li>';
  });
  feedCard.innerHTML = cardHead(ICON.clock, 'Recent activity') + '<ul class="feed">' + feed + '</ul>';
  left.appendChild(feedCard);

  grid.appendChild(left);

  // RIGHT column
  const right = el('div');

  // metrics
  const mCard = el('div', 'card');
  const netStr = c.stage === 'Ejected' ? 'off book' : (c.net === 0 ? '$0' : (c.net > 0 ? '+' : '') + money(c.net));
  mCard.innerHTML =
    cardHead(ICON.spark, 'The numbers') +
    '<div class="metrics">' +
      metric(c.users, c.usersLbl) +
      metric(money(c.revenue) + '/mo', 'revenue', false) +
      metric(money(c.spend) + '/mo', 'spend') +
      metric(netStr, 'net / mo', c.net > 0) +
    '</div>';
  right.appendChild(mCard);

  // risk
  const rCard = el('div', 'card');
  rCard.innerHTML =
    cardHead(ICON.warn, 'Watch this') +
    '<div class="risk-line">' + ICON.warn + '<span>' + c.risk + '</span></div>';
  right.appendChild(rCard);

  // recommendation + decide
  const recCard = el('div', 'card');
  const r = REC[c.rec];
  recCard.innerHTML =
    cardHead(ICON.target, 'Recommendation') +
    '<div class="rec" style="--rec-bd:' + r.bd + ';--rec-bg:' + r.bg + ';--rec-fg:' + r.fg + '">' +
      '<span class="rec-badge">' + c.rec + '</span>' +
      '<span class="rec-text"><b>' + c.recNote.split('.')[0] + '.</b>' + c.recNote.slice(c.recNote.indexOf('.') + 1) + '</span>' +
    '</div>' +
    decideBar(c);
  right.appendChild(recCard);

  grid.appendChild(right);
  wrap.appendChild(grid);
  return wrap;
}

function approvalInner(c) {
  if (resolved[c.id]) {
    const label = resolved[c.id] === 'approved' ? 'Approved & shipped'
      : resolved[c.id] === 'held' ? 'Put on hold'
      : 'Killed';
    return '<div class="ap-eye" style="color:var(--green)">' + ICON.check + label + '</div>' +
      '<div class="ap-title">' + c.approval.title + '</div>' +
      '<div class="ap-detail"><span class="rev">Reversible.</span> You can undo this decision anytime.</div>' +
      '<div class="nba-actions"><button class="btn btn-sm" data-undo="' + c.id + '">' + ICON.undo + 'Undo</button></div>';
  }
  return '<div class="ap-eye">' + ICON.bell + 'Approval pending</div>' +
    '<div class="ap-title">' + c.approval.title + '</div>' +
    '<div class="ap-detail">' + c.approval.detail + '</div>' +
    '<div class="nba-actions">' +
      '<button class="btn btn-primary" data-approve="' + c.id + '">' + ICON.check + 'Approve</button>' +
      '<button class="btn" data-hold="' + c.id + '">Hold for now</button>' +
      '<button class="btn btn-ghost btn-danger" data-kill="' + c.id + '">Kill this bet</button>' +
    '</div>';
}

function nbaActions(c) {
  if (c.approval && !resolved[c.id]) {
    return '<div class="nba-actions">' +
      '<button class="btn btn-primary btn-sm" data-approve="' + c.id + '">' + ICON.check + 'Approve now</button>' +
      '<button class="btn btn-sm" data-hold="' + c.id + '">Hold</button>' +
    '</div>';
  }
  if (c.dead) return '';
  return '<div class="nba-actions"><span class="need-tag">AI proceeds automatically</span></div>';
}

function decideBar(c) {
  if (c.dead) {
    const done = c.stage === 'Ejected' ? 'Graduated to standalone' : 'Closed with post-mortem';
    return '<div class="decide-bar"><span class="co-status" style="margin-top:14px"><span class="dot" style="background:' + STAGE[c.stage].col + '"></span>' + done + '</span></div>';
  }
  return '<div class="decide-bar">' +
    '<button class="btn btn-primary btn-sm" data-open-approve="' + c.id + '">Continue</button>' +
    '<button class="btn btn-sm" data-hold="' + c.id + '">Hold</button>' +
    '<button class="btn btn-ghost btn-sm btn-danger" data-kill="' + c.id + '">Kill</button>' +
    '<button class="btn btn-sm" data-eject="' + c.id + '">Eject…</button>' +
  '</div>';
}

function metric(v, l, pos) {
  return '<div class="metric"><div class="mv' + (pos ? ' pos' : '') + '">' + v + '</div><div class="ml">' + l + '</div></div>';
}
function cardHead(ico, title) {
  return '<div class="card-eyebrow"><span class="card-ico">' + ico + '</span><h3>' + title + '</h3></div>';
}

/* ----- DOC TABS ----- */
function renderDoc(c, tab) {
  const card = el('div', 'card');
  if (tab === 'budget') {
    const b = c.docs.budget;
    card.innerHTML =
      cardHead(ICON.spark, 'Budget') +
      '<div class="doc-grid">' +
        '<div class="doc-kpi"><div class="dv">' + b.spend + '</div><div class="dl">Spend</div></div>' +
        '<div class="doc-kpi"><div class="dv">' + b.rev + '</div><div class="dl">Revenue</div></div>' +
        '<div class="doc-kpi"><div class="dv">' + b.net + '</div><div class="dl">Net</div></div>' +
        '<div class="doc-kpi"><div class="dv">' + b.runway + '</div><div class="dl">Status</div></div>' +
      '</div>' +
      '<div class="prose"><p>' + b.note + '</p></div>';
    return card;
  }
  const blocks = c.docs[tab];
  let html = cardHead(
    tab === 'foundation' ? ICON.target : tab === 'product' ? ICON.bot : ICON.spark,
    tab.charAt(0).toUpperCase() + tab.slice(1)
  ) + '<div class="prose">';
  blocks.forEach(bl => {
    if (bl.h && bl.p) html += '<h4>' + bl.h + '</h4><p>' + bl.p + '</p>';
    else if (bl.k) html += '<p class="kv"><b>' + bl.k + ':</b> ' + bl.v + '</p>';
  });
  html += '</div>';
  card.innerHTML = html;
  return card;
}

/* ----- NEW BET ----- */
function renderNew() {
  const root = el('div', 'newbet');
  root.innerHTML =
    '<div class="nb-ico">' + ICON.plus + '</div>' +
    '<h2>Start a new bet</h2>' +
    '<p>Describe the idea in one plain sentence. The factory frames it, sets a validation goal, and starts working - you only approve the calls that matter.</p>' +
    '<div class="nb-input">' +
      '<input type="text" id="nbInput" placeholder="e.g. Auto-generates weekly changelogs from git commits…" aria-label="New bet idea">' +
      '<button class="btn btn-primary" id="nbGo">' + ICON.spark + 'Draft it</button>' +
    '</div>' +
    '<div class="nb-flow">' +
      '<span class="nb-step">1 · Frame</span>' +
      '<span class="nb-step">2 · Set goal</span>' +
      '<span class="nb-step">3 · Validate</span>' +
      '<span class="nb-step">4 · Build / kill</span>' +
    '</div>' +
    '<div class="nb-hint">This prototype starts every bet in the Idea stage - validate the pain before spending a cent.</div>';
  return root;
}

/* ---------- DYNAMIC BINDINGS ---------- */
function bindDynamic() {
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = e => { e.stopPropagation(); resolve(b.dataset.approve, 'approved'); });
  document.querySelectorAll('[data-hold]').forEach(b => b.onclick = e => { e.stopPropagation(); resolve(b.dataset.hold, 'held'); });
  document.querySelectorAll('[data-kill]').forEach(b => b.onclick = e => { e.stopPropagation(); resolve(b.dataset.kill, 'killed'); });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = e => { e.stopPropagation(); undo(b.dataset.undo); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.stopPropagation(); go(b.dataset.open); });
  document.querySelectorAll('[data-open-approve]').forEach(b => b.onclick = e => { e.stopPropagation(); const id = b.dataset.openApprove; if (co(id).approval && !resolved[id]) resolve(id, 'approved'); else toast('Continuing ' + co(id).name + ' - AI proceeds with its plan'); });
  document.querySelectorAll('[data-eject]').forEach(b => b.onclick = e => { e.stopPropagation(); toast('Eject needs a goal-hit - ' + co(b.dataset.eject).name + ' isn\'t there yet'); });

  const nbGo = $('#nbGo');
  if (nbGo) nbGo.onclick = () => {
    const val = ($('#nbInput').value || '').trim();
    toast(val ? 'Drafting "' + val.slice(0, 40) + (val.length > 40 ? '…' : '') + '" - framing as a new Idea bet' : 'Type a one-line idea first');
  };

  // animate progress fills
  requestAnimationFrame(() => {
    document.querySelectorAll('.prog-fill[data-w]').forEach(f => { f.style.width = f.dataset.w + '%'; });
  });
}

function resolve(id, kind) {
  const c = co(id);
  if (!c) return;
  resolved[id] = kind;
  renderTabs();
  renderView();
  const verb = kind === 'approved' ? 'Approved' : kind === 'held' ? 'Put on hold' : 'Killed';
  toast(verb + ' · ' + c.name, id);
}
function undo(id) {
  const c = co(id);
  delete resolved[id];
  renderTabs();
  renderView();
  toast('Reverted · ' + (c ? c.name : ''));
}

/* ---------- TOAST ---------- */
function toast(msg, undoId) {
  const t = $('#toast');
  clearTimeout(undoTimer);
  t.innerHTML = ICON.check + '<span>' + msg + '</span>' + (undoId ? '<span class="undo" id="toastUndo">Undo</span>' : '');
  t.classList.add('show');
  if (undoId) { const u = $('#toastUndo'); if (u) u.onclick = () => { undo(undoId); }; }
  undoTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ---------- KEYBOARD ---------- */
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const ids = orderedIds();
  if (e.key >= '1' && e.key <= '8') {
    const idx = parseInt(e.key, 10) - 1;
    if (idx < ids.length) { go(ids[idx]); e.preventDefault(); }
  } else if (e.key === 'ArrowRight') {
    const i = ids.indexOf(active); if (i < ids.length - 1) { go(ids[i + 1]); e.preventDefault(); }
  } else if (e.key === 'ArrowLeft') {
    const i = ids.indexOf(active); if (i > 0) { go(ids[i - 1]); e.preventDefault(); }
  } else if (e.key === 't' || e.key === 'T') {
    toggleTheme();
  }
});

/* ---------- INIT ---------- */
$('#themeBtn').onclick = toggleTheme;
$('#cmdBtn').onclick = () => toast('Keyboard: 1–8 jump to a tab · ← → move · T theme');
paintThemeIcon();
renderTabs();
renderView();
</script>
</body>
