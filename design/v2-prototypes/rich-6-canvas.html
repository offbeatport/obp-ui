<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Canvas Map</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8;
  --ink:#2c2926; --ink-soft:#635c52; --ink-faint:#7b7368;
  --line:#e6ddce; --line-soft:#efe8da;
  --accent:#c8643c; --green:#4f8a52; --blue:#4a72b0; --violet:#7a5ea8;
  --amber:#c08a2e; --red:#b6483f; --slate:#8a8579;
  --shadow:0 1px 2px rgba(60,50,38,.04),0 8px 28px rgba(60,50,38,.07);
  --shadow-lg:0 2px 6px rgba(60,50,38,.06),0 22px 60px rgba(60,50,38,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream); color:var(--ink);
  font-size:13px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum"}
.disp{font-family:'Space Grotesk',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(200,100,60,.2)}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;min-width:1280px}

/* ============ TOPBAR ============ */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;background:var(--paper);
  border-bottom:1px solid var(--line);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .logo{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#e0794e);
  display:grid;place-items:center;color:#fff;font-family:'Space Grotesk';
  font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(200,100,60,.35);
}
.brand .nm{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap}
.brand .nm small{display:block;font-family:'JetBrains Mono';font-weight:500;font-size:9px;
  letter-spacing:1.5px;color:var(--ink-faint);text-transform:uppercase}
.tb-div{width:1px;height:30px;background:var(--line)}

.kpis{display:flex;align-items:stretch;gap:0;flex:1;overflow:hidden}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:0 16px;border-right:1px solid var(--line-soft);min-width:0}
.kpi:first-child{padding-left:0}
.kpi .kl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;white-space:nowrap}
.kpi .kv{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:-.4px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.kpi .kv .u{font-size:11px;font-weight:600;color:var(--ink-faint)}
.kpi .kd{font-family:'JetBrains Mono';font-size:10px;font-weight:600}
.kpi.mrr{padding-left:4px}
.kpi-spark{display:flex;align-items:center;gap:10px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--amber)}
.pill-need{background:var(--accent);color:#fff;border-radius:20px;padding:3px 10px 3px 8px;
  font-family:'JetBrains Mono';font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-need .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.khint{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);display:flex;gap:10px}
.khint kbd{background:var(--cream-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-soft)}
.cmd-btn{display:flex;align-items:center;gap:7px;background:var(--cream-2);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-soft);font-weight:500}
.cmd-btn:hover{border-color:var(--accent);color:var(--ink)}
.cmd-btn kbd{font-family:'JetBrains Mono';font-size:10px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:0 4px}

/* ============ STAGE ============ */
.stage{display:grid;grid-template-columns:1fr 366px;min-height:0;position:relative}

/* ============ CANVAS ============ */
.canvas-area{position:relative;overflow:hidden;background:var(--cream)}
.canvas-wrap{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.canvas-wrap.grabbing{cursor:grabbing}
.canvas{
  position:absolute;top:0;left:0;width:1860px;height:1040px;
  transform-origin:0 0;will-change:transform;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:30px 30px;background-position:-1px -1px;
}
.backdrop{position:absolute;inset:0;pointer-events:none}
.backdrop .clk{pointer-events:auto;cursor:pointer}

/* nodes */
.node{
  position:absolute;width:282px;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:13px 14px 12px;
  transition:transform .14s ease,box-shadow .18s ease,border-color .14s ease;
  border-top-width:3px;
}
.node:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line)}
.node.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-lg);transform:translateY(-3px)}
.node.paused{opacity:.82;background:repeating-linear-gradient(135deg,var(--paper),var(--paper) 8px,#faf6ef 8px,#faf6ef 16px)}
.node-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer}
.node-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.node-name .ring{flex-shrink:0}
.badge{font-family:'JetBrains Mono';font-size:8.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  padding:2.5px 6px;border-radius:5px;white-space:nowrap}
.tag-mini{font-family:'JetBrains Mono';font-size:8px;font-weight:600;letter-spacing:.3px;padding:1.5px 5px;border-radius:4px;text-transform:uppercase}
.node-stage-row{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}

.node-mrr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:11px}
.node-mrr .big{font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-.6px;line-height:1}
.node-mrr .big .c{font-size:14px;color:var(--ink-faint);font-weight:600}
.node-mrr .dlt{font-family:'JetBrains Mono';font-size:10.5px;font-weight:600;margin-bottom:2px}
.node-mrr .spark{margin-bottom:1px}

.node-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.nm-cell{text-align:left}
.nm-cell .l{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint)}
.nm-cell .v{font-family:'JetBrains Mono';font-size:12.5px;font-weight:600;margin-top:1px}

.node-build{margin-top:10px;font-size:11px;color:var(--ink-soft);display:flex;gap:7px;align-items:flex-start;
  background:var(--cream);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px}
.node-build .bi{font-family:'JetBrains Mono';font-size:8px;font-weight:600;letter-spacing:.5px;padding:2px 5px;border-radius:4px;flex-shrink:0;margin-top:1px}
.node-build .bt{line-height:1.35}
.node-build .bt b{color:var(--ink);font-weight:600}

.node-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.auton{display:flex;gap:8px}
.auton .ax{display:flex;flex-direction:column;align-items:center;gap:3px}
.auton .axl{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.4px;color:var(--ink-faint)}
.auton .seg{display:flex;gap:2px}
.auton .seg i{width:9px;height:4px;border-radius:1px;background:var(--line);display:block}
.conn-dots{display:flex;gap:4px;align-items:center}
.conn-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);position:relative}
.conn-dots i.on{background:var(--green)}
.conn-dots i.off{background:transparent;border:1px solid var(--line);box-shadow:inset 0 0 0 1px var(--paper)}

.gate-flag{position:absolute;top:-11px;right:14px;background:var(--accent);color:#fff;
  font-family:'JetBrains Mono';font-size:9px;font-weight:600;letter-spacing:.4px;
  padding:2.5px 8px;border-radius:6px;box-shadow:0 3px 8px rgba(200,100,60,.35);display:flex;align-items:center;gap:5px}
.gate-flag.resolved{background:var(--green)}
.gate-flag .d{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}

/* opportunity nodes */
.opp{position:absolute;width:184px;background:var(--cream-2);border:1px dashed var(--line);
  border-radius:11px;padding:10px 11px;transition:transform .14s,box-shadow .16s,border-color .14s}
.opp:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.opp.killed{opacity:.5}
.opp-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.opp-nm{font-family:'Space Grotesk';font-weight:600;font-size:13px;letter-spacing:-.2px}
.opp-score{font-family:'JetBrains Mono';font-weight:700;font-size:15px}
.opp-bar{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.opp-bar i{display:block;height:100%;border-radius:3px}
.opp-note{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-faint);margin-top:7px}
.opp-spin{margin-top:8px;width:100%;background:var(--accent);color:#fff;border-radius:7px;padding:5px;
  font-family:'JetBrains Mono';font-size:10px;font-weight:600;letter-spacing:.4px}
.opp-spin:hover{background:#b5552f}

/* zone labels */
.zlabel{position:absolute;pointer-events:none}
.zlabel .zt{font-family:'Space Grotesk';font-weight:700;font-size:13px;letter-spacing:3px;color:rgba(124,115,104,.55)}
.zlabel .zs{font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;color:rgba(124,115,104,.45);text-transform:uppercase;margin-top:2px}

/* ============ FLOATING CANVAS UI ============ */
.legend{position:absolute;top:14px;left:14px;background:rgba(255,253,248,.9);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);z-index:10;max-width:230px}
.legend h4{font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.legend .lg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--ink-soft)}
.legend .lg-row:last-child{margin-bottom:0}
.legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend .lg-flow{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
  font-family:'JetBrains Mono';font-size:10px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}

.minimap{position:absolute;top:14px;right:14px;width:228px;height:128px;
  background:rgba(255,253,248,.92);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);z-index:10;overflow:hidden;cursor:pointer}
.minimap .mm-inner{position:absolute;inset:0}
.mm-node{position:absolute;border-radius:2px}
.mm-view{position:absolute;border:1.5px solid var(--accent);background:rgba(200,100,60,.1);border-radius:3px;pointer-events:none}
.minimap .mm-lbl{position:absolute;top:5px;left:7px;font-family:'JetBrains Mono';font-size:8px;letter-spacing:.8px;color:var(--ink-faint);text-transform:uppercase;z-index:2}

.zoomc{position:absolute;right:14px;top:158px;display:flex;flex-direction:column;gap:1px;z-index:10;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.zoomc button{width:34px;height:32px;display:grid;place-items:center;font-family:'JetBrains Mono';font-size:14px;color:var(--ink-soft);border-bottom:1px solid var(--line-soft)}
.zoomc button:last-child{border-bottom:none}
.zoomc button:hover{background:var(--cream-2);color:var(--ink)}
.zoomc .zlvl{font-size:9px;font-weight:600;height:24px;color:var(--ink-faint)}

/* activity strip */
.activity{position:absolute;left:14px;bottom:14px;width:480px;z-index:10;
  background:rgba(255,253,248,.94);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.act-head{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;user-select:none}
.act-head .lpulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(79,138,82,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,138,82,.45)}70%{box-shadow:0 0 0 7px rgba(79,138,82,0)}100%{box-shadow:0 0 0 0 rgba(79,138,82,0)}}
.act-head .at{font-family:'JetBrains Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.act-head .latest{font-size:11.5px;color:var(--ink-soft);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.act-head .latest b{color:var(--ink);font-weight:600}
.act-head .chev{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);transition:transform .2s}
.activity.open .act-head .chev{transform:rotate(180deg)}
.act-list{max-height:0;overflow:hidden;transition:max-height .26s ease}
.activity.open .act-list{max-height:280px;overflow-y:auto}
.act-item{display:flex;align-items:flex-start;gap:9px;padding:8px 13px;border-top:1px solid var(--line-soft);font-size:11.5px}
.act-item .ac-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-item .ac-body{flex:1;line-height:1.35}
.act-item .ac-body .co{font-weight:600;font-family:'JetBrains Mono';font-size:10.5px}
.act-item .ac-body .tx{color:var(--ink-soft)}
.act-item .ac-t{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-faint);flex-shrink:0;margin-top:2px}
.act-item .ac-live{font-family:'JetBrains Mono';font-size:8px;font-weight:600;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 4px;margin-top:2px}

/* ============ DOCK ============ */
.dock{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.dock-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 6px;gap:2px}
.dock-tab{flex:1;padding:11px 6px 10px;font-family:'JetBrains Mono';font-size:10px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent;position:relative}
.dock-tab:hover{color:var(--ink-soft)}
.dock-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.dock-tab .tcount{position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;font-size:8px;
  border-radius:8px;padding:0 4px;min-width:14px;height:14px;display:inline-grid;place-items:center;font-weight:700}
.dock-body{flex:1;overflow-y:auto;padding:14px}
.dock-body::-webkit-scrollbar{width:8px} .dock-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.act-list::-webkit-scrollbar{width:6px} .act-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.sec-h .t{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.sec-h .n{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-soft)}
.sec-h.mt{margin-top:18px}

/* gate cards */
.gate{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:var(--paper);border-left-width:3px;transition:box-shadow .15s}
.gate:hover{box-shadow:var(--shadow)}
.gate.upcoming{background:var(--cream);opacity:.92}
.gate.done{opacity:.62}
.gate-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.gate-type{font-family:'JetBrains Mono';font-size:9px;font-weight:700;letter-spacing:.6px;padding:2.5px 6px;border-radius:5px;color:#fff}
.gate-co{font-family:'Space Grotesk';font-weight:600;font-size:12.5px;cursor:pointer}
.gate-co:hover{text-decoration:underline;text-decoration-color:var(--line)}
.gate-mark{margin-left:auto;font-family:'JetBrains Mono';font-size:8px;font-weight:600;letter-spacing:.3px;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.gate-mark.you{background:rgba(182,72,63,.12);color:var(--red)}
.gate-mark.auto{background:rgba(79,138,82,.12);color:var(--green)}
.gate-title{font-size:12.5px;font-weight:600;margin-bottom:4px}
.gate-ev{font-size:11px;color:var(--ink-soft);line-height:1.4;display:flex;gap:6px;align-items:flex-start;margin-bottom:9px}
.gate-ev .evi{color:var(--ink-faint);flex-shrink:0}
.gate-acts{display:flex;gap:6px}
.btn{flex:1;border-radius:8px;padding:7px;font-size:11.5px;font-weight:600;border:1px solid var(--line);transition:.12s}
.btn-ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn-ok:hover{background:#447a47}
.btn-no{background:var(--paper);color:var(--ink-soft)}
.btn-no:hover{border-color:var(--red);color:var(--red)}
.btn-sm{flex:none;padding:7px 10px}
.gate-resolved{font-family:'JetBrains Mono';font-size:11px;font-weight:600;text-align:center;padding:7px}
.reject-box{margin-top:8px}
.reject-box textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;font-family:'Inter';font-size:11px;resize:none;background:var(--cream);color:var(--ink)}
.reject-box textarea:focus{outline:none;border-color:var(--accent)}
.preview-link{font-family:'JetBrains Mono';font-size:10px;color:var(--blue);display:inline-flex;align-items:center;gap:5px;
  background:rgba(74,114,176,.08);border:1px solid rgba(74,114,176,.2);border-radius:6px;padding:3px 7px;margin-bottom:8px;text-decoration:none}
.done-chip{font-family:'JetBrains Mono';font-size:9.5px;color:var(--green);display:inline-flex;align-items:center;gap:5px;margin-bottom:8px}

/* money */
.cap-gauge{margin-bottom:14px}
.cap-bar{height:26px;border-radius:8px;background:var(--cream-2);border:1px solid var(--line);overflow:hidden;display:flex;position:relative}
.cap-seg{height:100%;position:relative}
.cap-cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.cap-meta{display:flex;justify-content:space-between;margin-top:6px;font-family:'JetBrains Mono';font-size:10px;color:var(--ink-soft)}
.money-rows{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.mrow{display:flex;align-items:center;gap:9px}
.mrow .ml{width:60px;font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);flex-shrink:0}
.mrow .mbar{flex:1;height:8px;background:var(--cream-2);border-radius:4px;overflow:hidden}
.mrow .mbar i{display:block;height:100%;border-radius:4px}
.mrow .mv{width:42px;text-align:right;font-family:'JetBrains Mono';font-size:11px;font-weight:600;flex-shrink:0}
.net-card{display:flex;align-items:center;justify-content:space-between;background:rgba(79,138,82,.08);
  border:1px solid rgba(79,138,82,.22);border-radius:10px;padding:11px 13px;margin-top:14px}
.net-card .nl{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft)}
.net-card .nv{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--green)}
.guard{margin-top:11px;font-size:11px;color:var(--ink-soft);background:var(--cream);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.guard .gi{flex-shrink:0}

/* oversight */
.ov-co{margin-bottom:11px;border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px;border-left-width:3px}
.ov-co .ovh{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.ov-co .ovh .cn{font-family:'Space Grotesk';font-weight:600;font-size:12.5px}
.ov-co .ovh .ct{font-family:'JetBrains Mono';font-size:9px;color:var(--ink-faint);margin-left:auto}
.ov-acts{display:flex;flex-wrap:wrap;gap:5px}

/* ============ VIZ HELPERS ============ */
function spark(series,w,h,color,sw){
  sw=sw||2;
  const max=Math.max(...series),min=Math.min(...series),rng=(max-min)||1;
  const pts=series.map((v,i)=>{
    const x=(series.length===1?0:(i/(series.length-1)))*(w-3)+1.5;
    const y=h-2-((v-min)/rng)*(h-4);
    return [x,y];
  });
  const allZero=max===0;
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  const area=d+' L '+(w-1.5).toFixed(1)+' '+(h-1)+' L 1.5 '+(h-1)+' Z';
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    +(allZero?'':'<path d="'+area+'" fill="'+cv(color)+'" fill-opacity="0.1"/>')
    +'<path d="'+d+'" fill="none" stroke="'+cv(color)+'" stroke-opacity="'+(allZero?'0.4':'1')+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" '+(allZero?'stroke-dasharray="3 3"':'')+'/>'
    +(allZero?'':'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="'+cv(color)+'"/>')
    +'</svg>';
}
function areaChart(series,w,h,color){
  const max=Math.max(...series),min=Math.min(0,...series),rng=(max-min)||1;
  const padL=30,padB=0,cw=w-padL,ch=h;
  const pts=series.map((v,i)=>{
    const x=padL+(i/(series.length-1))*(cw-4)+2;
    const y=ch-2-((v-min)/rng)*(ch-6);
    return [x,y];
  });
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+' L '+(w-2)+' '+(ch-1)+' L '+(padL+2)+' '+(ch-1)+' Z';
  let grid='';
  for(let g=0;g<=3;g++){const y=2+g*((ch-4)/3);grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-2)+'" y2="'+y+'" stroke="'+cv('lineSoft')+'" stroke-width="1"/>';}
  const gid='ac'+Math.random().toString(36).slice(2,7);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+cv(color)+'" stop-opacity="0.28"/><stop offset="1" stop-color="'+cv(color)+'" stop-opacity="0.02"/></linearGradient></defs>'
    +grid+'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+d+'" fill="none" stroke="'+cv(color)+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
    +pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+cv('paper')+'" stroke="'+cv(color)+'" stroke-width="2"/>').join('')
    +'</svg>';
}
function ring(pct,size,color,sw){
  sw=sw||3.5;
  const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct);
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+cv('line')+'" stroke-width="'+sw+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+cv(color)+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    +'</svg>';
}
function autonScore(a){return (a.make+a.grow+a.run)/6;}

/* ============ VIEW / PAN / ZOOM ============ */
const BOARD={w:1860,h:1040};
const view={scale:0.72,tx:24,ty:0};
const wrap=document.getElementById('wrap'), canvas=document.getElementById('canvas');
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function applyView(){
  canvas.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.scale+')';
  document.getElementById('zLvl').textContent=Math.round(view.scale*100)+'%';
  document.body.classList.toggle('zoomed-out',view.scale<0.55);
  updateMinimap();
}
function centerView(){
  const r=wrap.getBoundingClientRect();
  view.ty=clamp((r.height-BOARD.h*view.scale)/2,r.height-BOARD.h*view.scale-20,20);
  applyView();
}
function zoomBy(f,cx,cy){
  const r=wrap.getBoundingClientRect();
  cx=cx==null?r.width/2:cx; cy=cy==null?r.height/2:cy;
  const ns=clamp(view.scale*f,0.34,1.9), k=ns/view.scale;
  view.tx=cx-(cx-view.tx)*k; view.ty=cy-(cy-view.ty)*k; view.scale=ns; applyView();
}
function fitAll(){
  const r=wrap.getBoundingClientRect();
  const s=clamp(Math.min((r.width-48)/BOARD.w,(r.height-48)/BOARD.h),0.3,1.5);
  view.scale=s; view.tx=(r.width-BOARD.w*s)/2; view.ty=(r.height-BOARD.h*s)/2; applyView();
}
let panning=false,start=null;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')||e.target.closest('.opp')||e.target.closest('.clk'))return;
  panning=true; start={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};
  wrap.setPointerCapture(e.pointerId); wrap.classList.add('grabbing');
});
wrap.addEventListener('pointermove',e=>{
  if(!panning)return;
  view.tx=start.tx+(e.clientX-start.x); view.ty=start.ty+(e.clientY-start.y); applyView();
});
wrap.addEventListener('pointerup',()=>{panning=false;wrap.classList.remove('grabbing');});
wrap.addEventListener('pointercancel',()=>{panning=false;wrap.classList.remove('grabbing');});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>0){
    const f=1+(-e.deltaY*0.0014);
    zoomBy(f,e.clientX-r.left,e.clientY-r.top);
  }
},{passive:false});
document.getElementById('zIn').onclick=()=>zoomBy(1.2);
document.getElementById('zOut').onclick=()=>zoomBy(1/1.2);
document.getElementById('zFit').onclick=fitAll;

  [[20,240,'violet'],[280,500,'violet'],[800,500,'blue'],[1320,520,'green']].forEach(z=>{
    s+='<div class="mm-node" style="left:'+(z[0]*k)+'px;top:'+(40*k)+'px;width:'+(z[1]*k)+'px;height:'+(960*k)+'px;background:'+cv(z[2])+'12;border:1px solid '+cv('lineSoft')+'"></div>';
  });
  COMPANIES.forEach(c=>{
    s+='<div class="mm-node" style="left:'+(c.pos.x*k)+'px;top:'+(c.pos.y*k)+'px;width:'+(282*k)+'px;height:'+(214*k)+'px;background:'+cv(c.color)+';opacity:.8"></div>';
  });
  OPPS.forEach(o=>{
    s+='<div class="mm-node" style="left:'+(o.pos.x*k)+'px;top:'+(o.pos.y*k)+'px;width:'+(184*k)+'px;height:'+(70*k)+'px;background:'+cv(o.color)+';opacity:.4"></div>';
  });

function updateMinimap(){
  const r=wrap.getBoundingClientRect(), k=228/BOARD.w;
  const vx=(-view.tx/view.scale)*k, vy=(-view.ty/view.scale)*k;
  const vw=(r.width/view.scale)*k, vh=(r.height/view.scale)*k;
  const mv=document.getElementById('mmView');
  mv.style.left=clamp(vx,0,228)+'px'; mv.style.top=clamp(vy,0,128)+'px';
  mv.style.width=clamp(vw,4,228)+'px'; mv.style.height=clamp(vh,4,128)+'px';
}
document.getElementById('minimap').addEventListener('click',e=>{
  const mm=document.getElementById('minimap').getBoundingClientRect();
  const k=228/BOARD.w;
  const bx=(e.clientX-mm.left)/k, by=(e.clientY-mm.top)/k;
  const r=wrap.getBoundingClientRect();
  view.tx=r.width/2-bx*view.scale; view.ty=r.height/2-by*view.scale; applyView();
});

/* ============ GATE RESOLUTION ============ */
function resolveGate(gid,resolution){
  const g=GATES.find(x=>x.id===gid); if(!g||g.status==='resolved')return;
  g.status='resolved'; g.resolution=resolution;
  const flag=document.getElementById('flag-'+g.cid);
  if(flag&&!GATES.some(x=>x.cid===g.cid&&x.status==='open')){flag.classList.add('resolved');flag.innerHTML=(resolution==='approved'?'✓ APPROVED':'↩ SENT BACK');}
  // add activity
  ACTIVITY.unshift({co:g.company,color:resolution==='approved'?'green':'amber',tx:(resolution==='approved'?g.type+' approved · '+g.title:g.type+' sent back with feedback'),t:'now'});
  renderActivity();
  updateNeed();
  renderDock();
  if(document.getElementById('detail').classList.contains('open')&&curDetail===g.cid) openDetail(g.cid);
  toast(resolution==='approved'?'✓':'↩',resolution==='approved'?g.company+' · '+g.type+' approved':g.company+' · sent back with feedback',resolution==='approved'?'green':'amber');
}
function updateNeed(){
  const n=GATES.filter(g=>g.status==='open').length;
  document.getElementById('needN').textContent=n;
  document.getElementById('gatesCount').textContent=n;
  document.getElementById('gatesCount').style.display=n?'':'none';
  document.getElementById('needPill').style.opacity=n?'1':'.5';
  // update KPI decisions
  const dk=document.getElementById('kpiDecisions'); if(dk) dk.textContent=n;
}

/* ============ COMMAND PALETTE ============ */
const overlay=document.getElementById('cmdkOverlay'), cmdkInput=document.getElementById('cmdkInput'), cmdkList=document.getElementById('cmdkList');
let cmdSel=0, cmdItems=[];
function cmdCommands(){
  const list=[];
  COMPANIES.forEach(c=>list.push({ic:'→',color:c.color,t:'Open · '+c.name,k:'company',fn:()=>{closeCmd();openDetail(c.id);focusNode(c.id);}}));
  list.push({ic:'⚑',color:'accent',t:'Approve next gate',k:'action',fn:()=>{const g=GATES.find(x=>x.status==='open');closeCmd();if(g){setTab('gates');resolveGate(g.id,'approved');}}});
  [['gates','Gates'],['money','Money'],['oversight','Oversight'],['strategy','Strategy']].forEach(t=>list.push({ic:'▦',color:'slate',t:'Panel · '+t[1],k:'panel',fn:()=>{closeCmd();setTab(t[0]);}}));
  OPPS.filter(o=>o.state==='ready').forEach(o=>list.push({ic:'⚡',color:'accent',t:'Spin · '+o.name,k:'action',fn:()=>{closeCmd();spinOpp(o.id);}}));
  list.push({ic:'⊡',color:'blue',t:'Fit map to screen',k:'view',fn:()=>{closeCmd();fitAll();}});
  list.push({ic:'⊙',color:'blue',t:'Reset view',k:'view',fn:()=>{closeCmd();view.scale=0.72;view.tx=24;centerView();}});
  return list;
}
function openCmd(){overlay.classList.add('open');cmdkInput.value='';cmdSel=0;renderCmd('');cmdkInput.focus();}
function closeCmd(){overlay.classList.remove('open');}
function setTab(t){dockTab=t;document.querySelectorAll('.dock-tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));renderDock();}
function focusNode(id){const c=byId(id);const r=wrap.getBoundingClientRect();view.scale=Math.max(view.scale,0.85);view.tx=r.width*0.32-(c.pos.x+141)*view.scale;view.ty=r.height/2-(c.pos.y+107)*view.scale;applyView();}
function renderCmd(q){
  const all=cmdCommands();
  cmdItems=all.filter(c=>c.t.toLowerCase().includes(q.toLowerCase()));
  if(!cmdItems.length){cmdkList.innerHTML='<div class="cmdk-empty">No matches</div>';return;}
  cmdkList.innerHTML=cmdItems.map((c,i)=>'<div class="cmdk-item'+(i===cmdSel?' sel':'')+'" data-i="'+i+'"><span class="ci" style="background:'+cv(c.color)+'">'+c.ic+'</span><span class="ct2">'+c.t+'</span><span class="ck">'+c.k+'</span></div>').join('');
  cmdkList.querySelectorAll('.cmdk-item').forEach(el=>{
    el.addEventListener('click',()=>cmdItems[+el.dataset.i].fn());
    el.addEventListener('mouseenter',()=>{cmdSel=+el.dataset.i;renderCmd(cmdkInput.value);});
  });
}
cmdkInput.addEventListener('input',()=>{cmdSel=0;renderCmd(cmdkInput.value);});
cmdkInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdItems.length-1);renderCmd(cmdkInput.value);}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);renderCmd(cmdkInput.value);}
  else if(e.key==='Enter'){e.preventDefault();if(cmdItems[cmdSel])cmdItems[cmdSel].fn();}
});
document.getElementById('cmdBtn').addEventListener('click',openCmd);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeCmd();});

/* ============ TOAST ============ */
let toastT=null;
function toast(icon,msg,color){
  const t=document.getElementById('toast');
  t.innerHTML='<span class="ti" style="background:'+cv(color)+'33;color:'+cv(color)+'">'+icon+'</span>'+msg;
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay.classList.contains('open')?closeCmd():openCmd();return;}
  if(e.key==='Escape'){if(overlay.classList.contains('open'))closeCmd();else if(document.getElementById('detail').classList.contains('open'))closeDetail();return;}
  if(overlay.classList.contains('open'))return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='+'||e.key==='='){zoomBy(1.2);}
  else if(e.key==='-'){zoomBy(1/1.2);}
  else if(e.key==='0'){fitAll();}
  else if(e.key==='g'){setTab('gates');}
  else if(e.key==='m'){setTab('money');}
});

/* ============ INIT ============ */
renderBackdrop();
renderNodes();
renderKPIs();
renderActivity();
renderDock();
buildMinimap();
window.addEventListener('resize',applyView);
requestAnimationFrame(()=>{centerView();document.getElementById('activity').classList.add('open');});
</script>
</body>
