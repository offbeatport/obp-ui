<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;
  --surface:#ffffff;
  --line:#ececef;
  --line-strong:#e0e0e4;
  --ink:#18181b;
  --ink-2:#52525b;
  --ink-3:#8e8e96;
  --accent:#6d4aff;
  --accent-soft:#f0ecff;
  --green:#16a34a;  --green-soft:#e9f7ee;
  --amber:#d97706;  --amber-soft:#fdf3e3;
  --blue:#2563eb;   --blue-soft:#e8f0fe;
  --violet:#7c3aed; --violet-soft:#f1ebfe;
  --red:#dc2626;    --red-soft:#fdecec;
  --slate:#64748b;  --slate-soft:#f1f3f6;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 6px 24px -12px rgba(20,20,30,.12);
  --shadow-lg:0 24px 60px -24px rgba(20,20,30,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
  letter-spacing:-.01em;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent-soft)}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(250,250,250,.82);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:760px;margin:0 auto;
  padding:14px 24px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;cursor:pointer;user-select:none}
.logo{
  width:24px;height:24px;border-radius:7px;
  background:linear-gradient(140deg,var(--accent),#9d7bff);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;
  box-shadow:0 2px 8px -2px var(--accent);
}
.brand-sub{color:var(--ink-3);font-weight:450;font-size:12.5px;border-left:1px solid var(--line-strong);padding-left:11px;margin-left:1px}
.spacer{flex:1}
.viewtabs{display:flex;gap:2px;background:#f0f0f2;border-radius:9px;padding:3px}
.viewtab{
  font-size:12.5px;font-weight:500;color:var(--ink-2);
  padding:5px 12px;border-radius:7px;transition:all .15s ease;
}
.viewtab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cmdk{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:9px;padding:6px 10px 6px 11px;
  color:var(--ink-3);font-size:12.5px;transition:all .15s ease;min-width:188px;
}
.cmdk:hover{border-color:#c9c9d0;color:var(--ink-2)}
.cmdk kbd{margin-left:auto}
kbd{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;
  background:#f4f4f6;border:1px solid var(--line-strong);border-bottom-width:2px;
  border-radius:5px;padding:1px 5px;color:var(--ink-2);line-height:1.6;
}

/* ---------- feed ---------- */
.feed-wrap{max-width:760px;margin:0 auto;width:100%;padding:0 24px 160px}
.feed-head{padding:28px 2px 6px;display:flex;align-items:flex-end;justify-content:space-between}
.feed-title{font-size:22px;font-weight:600;letter-spacing:-.02em}
.feed-meta{color:var(--ink-3);font-size:12.5px;margin-top:3px}

/* filter pills */
.pills{
  position:sticky;top:57px;z-index:30;
  display:flex;gap:7px;flex-wrap:wrap;
  padding:14px 2px 16px;margin:0 -2px;
  background:linear-gradient(var(--bg) 70%,transparent);
}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:999px;padding:6px 12px;transition:all .15s ease;
}
.pill:hover{border-color:#c9c9d0;transform:translateY(-1px)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .ct{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  background:#f0f0f2;color:var(--ink-3);border-radius:999px;
  padding:0 6px;line-height:16px;min-width:18px;text-align:center;
}
.pill.on .ct{background:rgba(255,255,255,.18);color:#fff}

/* feed list */
.feed{display:flex;flex-direction:column;gap:14px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;transition:opacity .2s ease,transform .2s ease,border-color .15s ease;
  animation:rise .35s cubic-bezier(.2,.7,.3,1) both;
}
.card:hover{border-color:var(--line-strong)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.hide{display:none}

.card-head{display:flex;align-items:center;gap:11px;padding:15px 17px}
.avatar{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;
}
.co-line{flex:1;min-width:0}
.co-name{font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.co-name:hover{color:var(--accent)}
.co-name .arrow{opacity:0;transform:translateX(-3px);transition:all .15s ease;color:var(--accent);font-size:12px}
.co-name:hover .arrow{opacity:1;transform:none}
.kind-row{display:flex;align-items:center;gap:8px;margin-top:1px;color:var(--ink-3);font-size:12px}
.ts{color:var(--ink-3);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:2px 8px;border-radius:999px;text-transform:none;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-await{color:var(--violet);background:var(--violet-soft)}
.b-build{color:var(--blue);background:var(--blue-soft)}
.b-ship{color:var(--green);background:var(--green-soft)}
.b-opp{color:var(--accent);background:var(--accent-soft)}
.b-block{color:var(--red);background:var(--red-soft)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card-body{padding:0 17px 16px}
.card-body p.lead{font-size:13.5px;color:var(--ink);margin-bottom:2px}
.muted{color:var(--ink-2);font-size:13px}

/* shipped receipt */
.receipt{
  display:flex;align-items:center;gap:10px;
  background:var(--green-soft);border:1px solid #d3eddd;
  border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12.5px;
}
.receipt .chk{color:var(--green);font-weight:700}
.url{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--accent);
  text-decoration:none;border-bottom:1px dashed #cdbcff;padding-bottom:1px;
}
.url:hover{border-bottom-style:solid}

/* build progress */
.prog{height:5px;background:#eef0f3;border-radius:999px;overflow:hidden;margin-top:11px}
.prog>i{display:block;height:100%;background:var(--blue);border-radius:999px;animation:indet 1.8s ease-in-out infinite}
@keyframes indet{0%{margin-left:-35%;width:35%}50%{width:55%}100%{margin-left:100%;width:35%}}
.step{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--blue);font-size:12.5px;font-weight:500}

/* opportunity */
.score-row{display:flex;align-items:center;gap:12px;margin-top:11px}
.score{
  font-family:'JetBrains Mono',monospace;font-weight:500;
  display:flex;align-items:baseline;gap:3px;
}
.score b{font-size:19px;font-weight:600;color:var(--ink)}
.score span{color:var(--ink-3);font-size:11px}
.score-bar{flex:1;height:6px;background:#eef0f3;border-radius:999px;overflow:hidden}
.score-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#9d7bff);border-radius:999px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;border-radius:9px;
  padding:7px 13px;transition:all .15s ease;white-space:nowrap;
}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px var(--accent)}
.btn-accent:hover{background:#5d3aef;transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{border-color:#c9c9d0;color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#15803d;transform:translateY(-1px)}
.card-actions{display:flex;gap:8px;align-items:center;margin-top:13px}

/* approval card (inline expandable) */
.approval{border-color:#e6defc;box-shadow:0 1px 2px rgba(20,20,30,.04),0 8px 28px -14px rgba(109,74,255,.3)}
.gate-toggle{
  display:flex;align-items:center;gap:8px;width:100%;
  font-size:12.5px;font-weight:600;color:var(--accent);
  padding:11px 17px;border-top:1px solid var(--line);
  background:var(--accent-soft);transition:background .15s ease;
}
.gate-toggle:hover{background:#eae3ff}
.gate-toggle .chev{margin-left:auto;transition:transform .2s ease}
.approval.open .gate-toggle .chev{transform:rotate(180deg)}
.gate{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .28s cubic-bezier(.2,.7,.3,1);
}
.approval.open .gate{grid-template-rows:1fr}
.gate-in{overflow:hidden}
.gate-pad{padding:16px 17px 17px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:13px}
.gate-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.gate-label{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;width:92px;flex:none}
.donewhen{
  display:flex;align-items:center;gap:9px;
  background:var(--green-soft);border:1px solid #d3eddd;border-radius:10px;padding:11px 13px;
}
.donewhen .ic{width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.donewhen code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#15663a}
.diff{
  background:#1c1c22;border-radius:11px;overflow:hidden;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;
}
.diff-bar{display:flex;align-items:center;gap:7px;padding:8px 13px;background:#26262e;color:#a9a9b6;font-size:10.5px}
.diff-dots{display:flex;gap:5px}.diff-dots i{width:9px;height:9px;border-radius:50%}
.diff pre{padding:11px 14px;overflow-x:auto;color:#d6d6df;white-space:pre;tab-size:2}
.diff .add{color:#7ee29a}.diff .ctx{color:#82828f}
.gate-actions{display:flex;gap:9px;align-items:center}
.reject-box{display:none;flex-direction:column;gap:9px;margin-top:2px}
.reject-box.show{display:flex}
.reject-box textarea{
  width:100%;resize:vertical;min-height:62px;
  font-family:inherit;font-size:12.5px;color:var(--ink);
  border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;outline:none;transition:border .15s;
}
.reject-box textarea:focus{border-color:var(--accent)}
.flash{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;border-radius:9px;padding:7px 13px;
  animation:flashin .2s ease;
}
.flash.ok{background:var(--green-soft);color:var(--green)}
.flash.rej{background:var(--amber-soft);color:var(--amber)}
@keyframes flashin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* load-more / infinite */
.loadmore{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:20px auto 0;color:var(--ink-3);font-size:12.5px;
  padding:11px;border:1px dashed var(--line-strong);border-radius:12px;width:100%;
  transition:all .15s ease;
}
.loadmore:hover{color:var(--ink-2);border-color:#c9c9d0;background:var(--surface)}
.empty{text-align:center;color:var(--ink-3);padding:54px 0;font-size:13px}

/* ---------- live activity strip ---------- */
.activity{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line-strong);
  box-shadow:0 -10px 40px -24px rgba(20,20,30,.18);
}
.act-in{max-width:760px;margin:0 auto;width:100%;padding:0 24px}
.act-bar{display:flex;align-items:center;gap:11px;padding:12px 0;cursor:pointer}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:live 1.6s ease-out infinite;flex:none}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.act-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);flex:none}
.act-latest{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-latest b{color:var(--ink);font-weight:600}
.act-chev{color:var(--ink-3);transition:transform .2s ease;flex:none}
.activity.open .act-chev{transform:rotate(180deg)}
.act-stream{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .3s cubic-bezier(.2,.7,.3,1);
}
.activity.open .act-stream{grid-template-rows:1fr}
.act-stream-in{overflow:hidden}
.act-groups{padding:4px 0 16px;max-height:46vh;overflow-y:auto}
.act-group{margin-top:6px}
.act-group-h{font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 0 3px;display:flex;align-items:center;gap:7px}
.act-item{display:flex;align-items:center;gap:9px;padding:6px 0 6px 4px;font-size:12.5px;color:var(--ink-2)}
.act-item .tdot{width:6px;height:6px;border-radius:50%;flex:none}
.act-item .at{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3)}

/* ---------- overview overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;
  background:var(--bg);overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.ov-in{max-width:760px;margin:0 auto;padding:24px 24px 120px}
.ov-bar{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.ov-bar h2{font-size:20px;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.metric .v{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:600}
.metric .l{font-size:11px;color:var(--ink-3);margin-top:2px}
.ov-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0 2px 11px}
.co-card{
  display:flex;align-items:center;gap:13px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .15s ease;
}
.co-card:hover{border-color:var(--line-strong);transform:translateX(2px)}
.co-card .meta{flex:1;min-width:0}
.co-card .nm{font-weight:600;font-size:13.5px}
.co-card .th{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-card .nums{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.statpip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.opp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.opp-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.opp-card.killed{opacity:.5}
.opp-card .nm{font-weight:600;font-size:13.5px}
.opp-card .th{color:var(--ink-3);font-size:12px;margin:2px 0 11px}
.nextmoves{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-top:8px}
.nextmoves li{list-style:none;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.nextmoves li:last-child{border-bottom:none}
.nm-i{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;margin-top:1px}

/* ---------- zoom panel (slides from right) ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(20,20,30,.28);opacity:0;pointer-events:none;transition:opacity .25s ease;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.zoom{
  position:fixed;top:0;right:0;bottom:0;z-index:100;
  width:min(620px,94vw);background:var(--bg);
  border-left:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;
}
.zoom.show{transform:none}
.zoom-head{
  display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:all .15s ease;border:1px solid transparent}
.iconbtn:hover{background:#f0f0f2;color:var(--ink)}
.zoom-title{flex:1;min-width:0}
.zoom-title .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.zoom-title .th{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.z-sec-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.z-stats{display:flex;gap:9px}
.z-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.z-stat .v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600}
.z-stat .l{font-size:11px;color:var(--ink-3)}
.slices{display:flex;flex-direction:column;gap:7px}
.slice{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px}
.slice .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);width:18px;flex:none}
.slice .t{flex:1;min-width:0}
.slice.cur{border-color:#cdbcff;background:var(--accent-soft)}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.s-shipped{background:var(--green)}.s-building{background:var(--blue)}
.s-todo{background:var(--slate)}.s-await{background:var(--violet)}.s-blocked{background:var(--red)}
.prio{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);background:#f4f4f6;border-radius:6px;padding:1px 6px;flex:none}

/* zoom chat */
.zchat{border-top:1px solid var(--line);background:var(--surface)}
.zchat-log{padding:14px 20px;display:flex;flex-direction:column;gap:10px;max-height:200px;overflow-y:auto}
.msg{max-width:84%;font-size:12.5px;line-height:1.55;padding:9px 12px;border-radius:13px}
.msg.assistant{background:#f3f3f5;color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.zchat-in{display:flex;gap:9px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.chat-field{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--line-strong);border-radius:11px;padding:9px 12px;
}
.chat-field input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink)}
.chat-field input::placeholder{color:var(--ink-3)}
.send{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:all .15s}
.send:hover{background:#5d3aef}

/* ---------- corner badge ---------- */
.corner{
  position:fixed;left:16px;bottom:64px;z-index:55;
  display:flex;align-items:center;gap:7px;
  background:var(--ink);color:#fff;border-radius:999px;
  padding:6px 12px 6px 8px;font-size:11.5px;font-weight:600;
  box-shadow:0 6px 20px -8px rgba(20,20,30,.5);
}
.corner .n{font-family:'JetBrains Mono',monospace;background:var(--accent);border-radius:999px;padding:1px 7px;font-size:10.5px}

@media(max-width:640px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .opp-grid{grid-template-columns:1fr}
  .viewtabs,.cmdk{display:none}
}
</style>
</head>
<body>
<div class="app">

  <!-- top bar -->
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand" id="brandHome" title="Home">
        <div class="logo">C</div>
        <span>C Slop Slop</span>
        <span class="brand-sub">Feed</span>
      </div>
      <div class="spacer"></div>
      <div class="viewtabs">
        <button class="viewtab on" id="tabFeed">Feed</button>
        <button class="viewtab" id="tabOverview">Portfolio</button>
      </div>
      <button class="cmdk" id="cmdkBtn">
        <span>⌘</span><span>Search or run a command…</span>
        <kbd>⌘K</kbd>
      </button>
    </div>
  </header>

  <!-- feed -->
  <main class="feed-wrap">
    <div class="feed-head">
      <div>
        <div class="feed-title">Today</div>
        <div class="feed-meta" id="feedMeta">Live across your portfolio · 5 active companies</div>
      </div>
    </div>

    <div class="pills" id="pills"></div>
    <div class="feed" id="feed"></div>
    <button class="loadmore" id="loadMore">↓ Load earlier activity</button>
    <div class="empty" id="emptyState" style="display:none">Nothing here yet — try another filter.</div>
  </main>
</div>

<!-- corner badge -->
<div class="corner"><span class="n">22</span> Feed</div>

<!-- live activity strip -->
<div class="activity" id="activity">
  <div class="act-in">
    <div class="act-bar" id="actBar">
      <span class="live-dot"></span>
      <span class="act-label">Live</span>
      <span class="act-latest" id="actLatest"></span>
      <span class="act-chev">⌃</span>
    </div>
    <div class="act-stream">
      <div class="act-stream-in">
        <div class="act-groups" id="actGroups"></div>
      </div>
    </div>
  </div>
</div>

<!-- overview overlay -->
<div class="overlay" id="overlay">
  <div class="ov-in">
    <div class="ov-bar">
      <h2>Portfolio</h2>
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn-ghost" id="ovClose">← Back to feed</button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="ov-h">Companies</div>
    <div id="ovCompanies"></div>
    <div class="ov-h" style="margin-top:24px">Opportunities</div>
    <div class="opp-grid" id="ovOpps"></div>
    <div class="ov-h" style="margin-top:24px">Next moves</div>
    <ul class="nextmoves" id="ovMoves"></ul>
  </div>
</div>

<!-- zoom -->
<div class="scrim" id="scrim"></div>
<aside class="zoom" id="zoom">
  <div class="zoom-head">
    <button class="iconbtn" id="zoomBack" title="Back (Esc)">←</button>
    <div class="zoom-title">
      <div class="nm" id="zNm"></div>
      <div class="th" id="zTh"></div>
    </div>
    <button class="iconbtn" id="zoomClose" title="Close (Esc)">✕</button>
  </div>
  <div class="zoom-body" id="zoomBody"></div>
  <div class="zchat">
    <div class="zchat-log" id="zchatLog"></div>
    <div class="zchat-in">
      <div class="chat-field">
        <input id="zchatInput" placeholder="Message LeadSift…" />
        <kbd>↵</kbd>
      </div>
      <button class="send" id="zchatSend">↑</button>
    </div>
  </div>
</aside>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress — same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped — no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 — writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 — running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed — GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog — slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked — no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) — it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed — want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice — one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const byId=id=>DATA.companies.find(c=>c.id===id);
const byName=n=>DATA.companies.find(c=>c.name===n);
const COLORS={leadsift:'#6d4aff',quietinbox:'#2563eb',translatorbill:'#0d9488',datadrop:'#d97706',redditpainbot:'#64748b'};
const avatarColor=name=>{const c=byName(name);return c?COLORS[c.id]:'#6d4aff';};
const initials=n=>n.replace(/([a-z])([A-Z])/g,'$1 $2').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- build the feed model from DATA ---------- */
// feed items: type ∈ approval|build|shipped|opportunity ; bucket for filters
const FEED=[];
// approval (LeadSift)
const ls=byId('leadsift');
FEED.push({type:'approval', bucket:'needs', co:'LeadSift', t:'2m', a:ls.approval});
// builds (one per actively building / current slice company)
DATA.companies.forEach(c=>{
  if(c.currentSlice){
    const s=c.currentSlice.status;
    if(s==='building') FEED.push({type:'build', bucket:'building', co:c.name, t:c.name==='QuietInbox'?'12s':'now', slice:c.currentSlice});
    else if(s==='blocked') FEED.push({type:'blocked', bucket:'building', co:c.name, t:'18m', slice:c.currentSlice});
  }
});
// shipped receipt (LeadSift slice 4 — latest shipped) + QuietInbox prior ship
FEED.push({type:'shipped', bucket:'shipped', co:'LeadSift', t:'1h',
  slice:{n:4,title:'User can filter leads by score'}, url:'http://localhost:4019', check:'GET /leads?min=70 → 200'});
FEED.push({type:'shipped', bucket:'shipped', co:'DataDrop', t:'3h',
  slice:{n:5,title:'Cleaned CSV preview before import'}, url:'http://localhost:4025', check:'GET /preview → 200'});
// opportunities
DATA.opportunities.filter(o=>o.status==='candidate').slice(0,2).forEach((o,i)=>{
  FEED.push({type:'opportunity', bucket:'opps', t:i===0?'4h':'6h', opp:o});
});

/* ---------- filters ---------- */
const FILTERS=[
  {key:'all',   label:'All',           match:()=>true},
  {key:'needs', label:'Needs you',     match:f=>f.bucket==='needs'},
  {key:'building',label:'Building',    match:f=>f.bucket==='building'},
  {key:'shipped',label:'Shipped',      match:f=>f.bucket==='shipped'},
  {key:'opps',  label:'Opportunities', match:f=>f.bucket==='opps'},
];
let activeFilter='all';
let shownCount=FEED.length; // load-more reveals "earlier" — start with all current

function pillCounts(){
  const m={};
  FILTERS.forEach(f=>m[f.key]=FEED.filter(f.match).length);
  return m;
}

function renderPills(){
  const counts=pillCounts();
  $('#pills').innerHTML=FILTERS.map(f=>`
    <button class="pill ${f.key===activeFilter?'on':''}" data-f="${f.key}">
      ${f.label}<span class="ct">${counts[f.key]}</span>
    </button>`).join('');
  $$('#pills .pill').forEach(p=>p.onclick=()=>{activeFilter=p.dataset.f;renderPills();renderFeed();});
}

/* ---------- card renderers ---------- */
function head(co,kind,t){
  return `<div class="card-head">
    <div class="avatar" style="background:${avatarColor(co)}">${initials(co)}</div>
    <div class="co-line">
      <span class="co-name" data-co="${co}">${co}<span class="arrow">→</span></span>
      <div class="kind-row">${kind}</div>
    </div>
    <span class="ts">${t}</span>
  </div>`;
}

function cardApproval(f){
  const a=f.a;
  return `<article class="card approval" data-bucket="${f.bucket}" id="approvalCard">
    ${head(f.co,`<span class="badge b-await"><span class="dot pulse"></span>Needs you</span> · slice ${a.slice}`,f.t)}
    <div class="card-body">
      <p class="lead">${a.title}</p>
      <p class="muted">It’s live and the <b>doneWhen</b> check passed on attempt ${a.attempt}. Review the diff, then approve or send feedback.</p>
    </div>
    <button class="gate-toggle" id="gateToggle">
      Review the approval gate
      <span class="chev">⌄</span>
    </button>
    <div class="gate"><div class="gate-in"><div class="gate-pad">
      <div class="donewhen">
        <span class="ic">✓</span>
        <div><div style="font-weight:600;color:var(--green);font-size:12px">doneWhen passed</div>
        <code>${a.doneWhen}</code></div>
      </div>
      <div class="gate-row">
        <span class="gate-label">Live preview</span>
        <a class="url" href="${a.previewUrl}" target="_blank" rel="noopener">${a.previewUrl}</a>
      </div>
      <div>
        <div class="gate-label" style="margin-bottom:8px">Diff</div>
        <div class="diff">
          <div class="diff-bar">
            <span class="diff-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
            DailyDigest.tsx
          </div>
          <pre>${a.diff.split('\n').map(l=>{
            const esc=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const cls=l.trimStart().startsWith('+')?'add':'ctx';
            return `<span class="${cls}">${esc}</span>`;
          }).join('\n')}</pre>
        </div>
      </div>
      <div class="gate-actions" id="gateActions">
        <button class="btn btn-green" id="approveBtn">✓ Approve & ship</button>
        <button class="btn btn-ghost" id="rejectBtn">Reject with feedback</button>
      </div>
      <div class="reject-box" id="rejectBox">
        <textarea id="rejectText" placeholder="What needs to change? The agent will pick this up…"></textarea>
        <div class="gate-actions">
          <button class="btn btn-accent" id="sendReject">Send feedback</button>
          <button class="btn btn-ghost" id="cancelReject">Cancel</button>
        </div>
      </div>
    </div></div></div>
  </article>`;
}

function cardBuild(f){
  const s=f.slice;
  return `<article class="card" data-bucket="${f.bucket}">
    ${head(f.co,`<span class="badge b-build"><span class="dot pulse"></span>Building</span> · slice ${s.n}`,f.t)}
    <div class="card-body">
      <p class="lead">${s.title}</p>
      <div class="prog"><i></i></div>
      <div class="step"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${s.step}</div>
    </div>
  </article>`;
}

function cardBlocked(f){
  const s=f.slice;
  const c=byName(f.co);
  return `<article class="card" data-bucket="${f.bucket}">
    ${head(f.co,`<span class="badge b-block"><span class="dot"></span>Blocked</span> · slice ${s.n} · ${c.status==='paused'?'paused':'active'}`,f.t)}
    <div class="card-body">
      <p class="lead">${s.title}</p>
      <p class="muted">${s.step} — same failure repeated. Unblock with guidance, or pause the company.</p>
      <div class="card-actions">
        <button class="btn btn-ghost" data-co="${f.co}">Open & unblock</button>
      </div>
    </div>
  </article>`;
}

function cardShipped(f){
  return `<article class="card" data-bucket="${f.bucket}">
    ${head(f.co,`<span class="badge b-ship"><span class="dot"></span>Shipped</span> · slice ${f.slice.n}`,f.t)}
    <div class="card-body">
      <p class="lead">${f.slice.title}</p>
      <div class="receipt">
        <span class="chk">✓</span>
        <div style="flex:1">
          <div>Live & proven — <a class="url" href="${f.url}" target="_blank" rel="noopener">${f.url}</a></div>
          <code class="mono" style="font-size:11px;color:var(--ink-3)">${f.check}</code>
        </div>
      </div>
    </div>
  </article>`;
}

function cardOpp(f){
  const o=f.opp;
  return `<article class="card" data-bucket="${f.bucket}">
    <div class="card-head">
      <div class="avatar" style="background:var(--accent-soft);color:var(--accent)">✦</div>
      <div class="co-line">
        <span class="co-name" style="cursor:default">${o.title}</span>
        <div class="kind-row"><span class="badge b-opp"><span class="dot"></span>Opportunity</span> · candidate</div>
      </div>
      <span class="ts">${f.t}</span>
    </div>
    <div class="card-body">
      <p class="muted" style="font-style:italic">“${o.thought}”</p>
      <p class="lead" style="margin-top:6px">${o.thesis}</p>
      <div class="score-row">
        <span class="score"><b>${o.score}</b><span>/100</span></span>
        <span class="score-bar"><i style="width:${o.score}%"></i></span>
        <button class="btn btn-accent promote" data-opp="${o.id}">Promote →</button>
      </div>
    </div>
  </article>`;
}

function renderCard(f){
  switch(f.type){
    case 'approval':   return cardApproval(f);
    case 'build':      return cardBuild(f);
    case 'blocked':    return cardBlocked(f);
    case 'shipped':    return cardShipped(f);
    case 'opportunity':return cardOpp(f);
  }
  return '';
}

function renderFeed(){
  const visible=FEED.filter(FILTERS.find(x=>x.key===activeFilter).match).slice(0,shownCount);
  $('#feed').innerHTML=visible.map(renderCard).join('');
  $('#emptyState').style.display=visible.length?'none':'block';
  $('#loadMore').style.display=activeFilter==='all'&&shownCount<FEED.length?'flex':(activeFilter==='all'?'flex':'none');
  wireCards();
  const counts=pillCounts();
  $('#feedMeta').textContent=`${counts.needs} need${counts.needs===1?'s':''} you · ${counts.building} building · ${counts.shipped} shipped today`;
}

function wireCards(){
  $$('.co-name[data-co]').forEach(el=>el.onclick=()=>openZoom(byName(el.dataset.co)));
  $$('.card .btn[data-co]').forEach(el=>el.onclick=()=>openZoom(byName(el.dataset.co)));
  $$('.promote').forEach(b=>b.onclick=()=>{
    const orig=b.textContent;b.outerHTML=`<span class="flash ok">✓ Promoted to a company</span>`;
  });
  // gate wiring (only present when approval card visible)
  const gt=$('#gateToggle');
  if(gt){
    gt.onclick=()=>$('#approvalCard').classList.toggle('open');
    $('#approveBtn').onclick=()=>{
      $('#gateActions').innerHTML='<span class="flash ok">✓ Approved — shipping slice 5 to production</span>';
      pushActivity('LeadSift','approved slice 5 — shipping to production');
    };
    $('#rejectBtn').onclick=()=>{$('#rejectBox').classList.add('show');$('#rejectText').focus();};
    $('#cancelReject').onclick=()=>$('#rejectBox').classList.remove('show');
    $('#sendReject').onclick=()=>{
      const v=$('#rejectText').value.trim();
      $('#gateActions').innerHTML=`<span class="flash rej">↺ Feedback sent — agent will revise${v?' "'+v.slice(0,40)+(v.length>40?'…':'')+'"':''}</span>`;
      $('#rejectBox').classList.remove('show');
      pushActivity('LeadSift','feedback received on slice 5 — revising');
    };
  }
}

/* ---------- load more (infinite-grow down) ---------- */
const EARLIER=[
  {type:'shipped',bucket:'shipped',co:'QuietInbox',t:'1d',slice:{n:8,title:'Auto-draft a reply for any thread'},url:'http://localhost:4021',check:'POST /draft → 200'},
  {type:'shipped',bucket:'shipped',co:'LeadSift',t:'1d',slice:{n:3,title:'Each lead gets an auto score 0–100'},url:'http://localhost:4019',check:'GET /leads/:id/score → 200'},
  {type:'shipped',bucket:'shipped',co:'TranslatorBill',t:'2d',slice:{n:4,title:'Detect source currency from invoice'},url:'http://localhost:4023',check:'POST /detect → 200'},
];
let earlierIdx=0;
$('#loadMore').onclick=()=>{
  if(earlierIdx<EARLIER.length){
    FEED.push(EARLIER[earlierIdx++]);
    shownCount=FEED.length;
    renderPills();renderFeed();
  }
  if(earlierIdx>=EARLIER.length){$('#loadMore').textContent='✓ Caught up — that’s all activity';}
};

/* ---------- live activity strip ---------- */
function pushActivity(co,text){DATA.activity.unshift({co,kind:'event',text,t:'now',running:false});renderActivity();}
function actDotColor(k){return {building:'var(--blue)',deploy:'var(--blue)',await:'var(--violet)',check:'var(--green)',reprioritize:'var(--slate)',blocked:'var(--red)',event:'var(--accent)'}[k]||'var(--slate)';}
function renderActivity(){
  const latest=DATA.activity[0];
  $('#actLatest').innerHTML=`<b>${latest.co}</b> — ${latest.text}`;
  // group by company
  const groups={};
  DATA.activity.forEach(a=>{(groups[a.co]=groups[a.co]||[]).push(a);});
  $('#actGroups').innerHTML=Object.entries(groups).map(([co,items])=>`
    <div class="act-group">
      <div class="act-group-h"><span class="tdot" style="background:${avatarColor(co)};width:6px;height:6px;border-radius:50%"></span>${co}</div>
      ${items.map(a=>`<div class="act-item">
        <span class="tdot ${a.running?'pulse':''}" style="background:${actDotColor(a.kind)}"></span>
        <span>${a.text}</span>
        <span class="at">${a.t}</span>
      </div>`).join('')}
    </div>`).join('');
}
$('#actBar').onclick=()=>$('#activity').classList.toggle('open');

/* ---------- overview overlay ---------- */
function statusPip(c){
  const map={active:['var(--green)','var(--green-soft)','Active'],paused:['var(--amber)','var(--amber-soft)','Paused'],archived:['var(--slate)','var(--slate-soft)','Archived']};
  const[fg,bg,lbl]=map[c.status];
  return `<span class="statpip" style="color:${fg};background:${bg}"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>${lbl}</span>`;
}
function renderOverview(){
  const p=DATA.portfolio;
  $('#metrics').innerHTML=[
    ['$'+p.mrr,'MRR'],[p.users,'Users'],[p.activeCompanies,'Active'],[p.slicesShipped,'Shipped'],[p.needsYou,'Needs you']
  ].map(([v,l])=>`<div class="metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  $('#ovCompanies').innerHTML=DATA.companies.map(c=>{
    const ship=c.slices?c.slices.filter(s=>s.status==='shipped').length:c.slicesShipped;
    return `<div class="co-card" data-co="${c.name}">
      <div class="avatar" style="background:${COLORS[c.id]}">${initials(c.name)}</div>
      <div class="meta"><div class="nm">${c.name}</div><div class="th">${c.thesis}</div></div>
      ${c.needsYou?'<span class="badge b-await"><span class="dot pulse"></span>Needs you</span>':statusPip(c)}
      <div class="nums">$${c.mrr} · ${c.users}u<br><span style="color:var(--ink-3)">${ship} shipped</span></div>
    </div>`;
  }).join('');
  $$('#ovCompanies .co-card').forEach(el=>el.onclick=()=>{closeOverview();openZoom(byName(el.dataset.co));});

  $('#ovOpps').innerHTML=DATA.opportunities.map(o=>`
    <div class="opp-card ${o.status==='killed'?'killed':''}">
      <div class="nm">${o.title}</div>
      <div class="th">${o.thesis}</div>
      <div class="score-row">
        <span class="score"><b>${o.score}</b><span>/100</span></span>
        <span class="score-bar"><i style="width:${o.score}%"></i></span>
      </div>
      ${o.status==='killed'?'<div style="margin-top:11px;font-size:12px;color:var(--ink-3)">Killed</div>':`<button class="btn btn-accent promote" data-opp="${o.id}" style="margin-top:11px;width:100%;justify-content:center">Promote →</button>`}
    </div>`).join('');
  $$('#ovOpps .promote').forEach(b=>b.onclick=()=>{b.outerHTML=`<span class="flash ok" style="margin-top:11px;width:100%;justify-content:center">✓ Promoted</span>`;});

  $('#ovMoves').innerHTML=DATA.nextMoves.map((m,i)=>`<li><span class="nm-i">${i+1}</span><span>${m}</span></li>`).join('');
}
function openOverview(){renderOverview();$('#overlay').classList.add('show');$('#tabOverview').classList.add('on');$('#tabFeed').classList.remove('on');}
function closeOverview(){$('#overlay').classList.remove('show');$('#tabOverview').classList.remove('on');$('#tabFeed').classList.add('on');}
$('#tabOverview').onclick=openOverview;
$('#tabFeed').onclick=closeOverview;
$('#ovClose').onclick=closeOverview;
$('#brandHome').onclick=closeOverview;

/* ---------- zoom (slides from right) ---------- */
let currentZoom=null;
function sliceClass(s){return {shipped:'s-shipped',building:'s-building',todo:'s-todo',awaiting_approval:'s-await',blocked:'s-blocked'}[s];}
function renderZoom(c){
  $('#zNm').innerHTML=`${c.name} ${c.needsYou?'<span class="badge b-await"><span class="dot pulse"></span>Needs you</span>':statusPip(c)}`;
  $('#zTh').textContent=c.thesis;
  $('#zchatInput').placeholder=`Message ${c.name}…`;

  let html='';
  // stats
  const ship=c.slices?c.slices.filter(s=>s.status==='shipped').length:c.slicesShipped;
  html+=`<div><div class="z-stats">
    <div class="z-stat"><div class="v">$${c.mrr}</div><div class="l">MRR</div></div>
    <div class="z-stat"><div class="v">${c.users}</div><div class="l">Users</div></div>
    <div class="z-stat"><div class="v">${ship}</div><div class="l">Slices shipped</div></div>
  </div></div>`;

  // preview link
  if(c.previewUrl){
    html+=`<div><div class="z-sec-h">Live</div>
      <div class="gate-row"><a class="url" href="${c.previewUrl}" target="_blank" rel="noopener">${c.previewUrl}</a></div></div>`;
  }

  // APPROVAL GATE for LeadSift
  if(c.approval){
    const a=c.approval;
    html+=`<div><div class="z-sec-h"><span class="badge b-await"><span class="dot pulse"></span>Approval gate</span> slice ${a.slice}</div>
      <div class="card approval open" style="box-shadow:none">
        <div class="card-body" style="padding:15px 16px 0">
          <p class="lead">${a.title}</p>
        </div>
        <div class="gate-pad" style="border-top:none">
          <div class="donewhen"><span class="ic">✓</span>
            <div><div style="font-weight:600;color:var(--green);font-size:12px">doneWhen passed (attempt ${a.attempt})</div>
            <code>${a.doneWhen}</code></div></div>
          <div class="gate-row"><span class="gate-label">Preview</span>
            <a class="url" href="${a.previewUrl}" target="_blank" rel="noopener">${a.previewUrl}</a></div>
          <div><div class="gate-label" style="margin-bottom:8px">Diff</div>
            <div class="diff">
              <div class="diff-bar"><span class="diff-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>DailyDigest.tsx</div>
              <pre>${a.diff.split('\n').map(l=>{const esc=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return `<span class="${l.trimStart().startsWith('+')?'add':'ctx'}">${esc}</span>`;}).join('\n')}</pre>
            </div></div>
          <div class="gate-actions" id="zGateActions">
            <button class="btn btn-green" id="zApprove">✓ Approve & ship</button>
            <button class="btn btn-ghost" id="zReject">Reject with feedback</button>
          </div>
          <div class="reject-box" id="zRejectBox">
            <textarea id="zRejectText" placeholder="What needs to change?"></textarea>
            <div class="gate-actions">
              <button class="btn btn-accent" id="zSendReject">Send feedback</button>
              <button class="btn btn-ghost" id="zCancelReject">Cancel</button>
            </div>
          </div>
        </div>
      </div></div>`;
  }

  // slices
  if(c.slices){
    html+=`<div><div class="z-sec-h">Slices</div><div class="slices">${c.slices.map(s=>`
      <div class="slice ${s.status==='awaiting_approval'?'cur':''}">
        <span class="n">${s.n}</span>
        <span class="sdot ${sliceClass(s.status)} ${s.status==='building'?'pulse':''}"></span>
        <span class="t">${s.title}</span>
        ${s.priority?`<span class="prio">P${s.priority}</span>`:''}
        ${s.status==='blocked'?'<span class="prio" style="color:var(--red);background:var(--red-soft)">blocked</span>':''}
      </div>`).join('')}</div></div>`;
  } else if(c.currentSlice){
    const s=c.currentSlice;
    html+=`<div><div class="z-sec-h">Current slice</div><div class="slices">
      <div class="slice ${s.status==='building'?'cur':''}">
        <span class="n">${s.n}</span>
        <span class="sdot ${sliceClass(s.status)} ${s.status==='building'?'pulse':''}"></span>
        <span class="t">${s.title}</span>
        <span class="prio">${s.step}</span>
      </div></div></div>`;
  }

  $('#zoomBody').innerHTML=html;

  // chat log
  $('#zchatLog').innerHTML=(c.id==='leadsift'?DATA.chat:[{role:'assistant',text:`${c.name} is ${c.status}. Latest slice is ${c.currentSlice?'slice '+c.currentSlice.n+' ('+c.currentSlice.status+')':'in progress'}.`}])
    .map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('');
  $('#zchatLog').scrollTop=$('#zchatLog').scrollHeight;

  // wire gate
  if(c.approval){
    $('#zApprove').onclick=()=>{$('#zGateActions').innerHTML='<span class="flash ok">✓ Approved — shipping slice 5</span>';pushActivity('LeadSift','approved slice 5 — shipping to production');};
    $('#zReject').onclick=()=>{$('#zRejectBox').classList.add('show');$('#zRejectText').focus();};
    $('#zCancelReject').onclick=()=>$('#zRejectBox').classList.remove('show');
    $('#zSendReject').onclick=()=>{const v=$('#zRejectText').value.trim();$('#zGateActions').innerHTML=`<span class="flash rej">↺ Feedback sent — revising</span>`;$('#zRejectBox').classList.remove('show');pushActivity('LeadSift','feedback received on slice 5 — revising');};
  }
}
function openZoom(c){currentZoom=c;renderZoom(c);$('#scrim').classList.add('show');$('#zoom').classList.add('show');}
function closeZoom(){$('#zoom').classList.remove('show');$('#scrim').classList.remove('show');currentZoom=null;}
$('#zoomBack').onclick=closeZoom;
$('#zoomClose').onclick=closeZoom;
$('#scrim').onclick=closeZoom;

// zoom chat send
function sendZChat(){
  const i=$('#zchatInput');const v=i.value.trim();if(!v)return;
  const log=$('#zchatLog');
  log.insertAdjacentHTML('beforeend',`<div class="msg user">${v.replace(/</g,'&lt;')}</div>`);
  i.value='';log.scrollTop=log.scrollHeight;
  setTimeout(()=>{log.insertAdjacentHTML('beforeend',`<div class="msg assistant">On it — I’ll route that to ${currentZoom?currentZoom.name:'the build'}.</div>`);log.scrollTop=log.scrollHeight;},420);
}
$('#zchatSend').onclick=sendZChat;
$('#zchatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendZChat();});

/* ---------- ⌘K / keyboard ---------- */
$('#cmdkBtn').onclick=()=>{const c=byId('leadsift');openZoom(c);};
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openZoom(byId('leadsift'));}
  if(e.key==='Escape'){if($('#zoom').classList.contains('show'))closeZoom();else if($('#overlay').classList.contains('show'))closeOverview();}
});

/* ---------- init ---------- */
renderPills();
renderFeed();
renderActivity();
</script>
</body>
</html>
