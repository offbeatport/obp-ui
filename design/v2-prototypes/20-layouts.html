ss=\"approval\" id=\"appr\">\n        <div class=\"ap-info\">\n          <div class=\"ap-k\">Slice 5 · awaiting approval</div>\n          <div class=\"ap-t\">Daily email digest of top leads</div>\n          <div class=\"ap-sub\"><code>localhost:4019/digest</code><span class=\"check\">✓ check passed</span></div>\n        </div>\n        <div class=\"ap-actions\" id=\"acts\">\n          <button class=\"btn btn-y\" onclick=\"decide('Approved')\">Approve</button>\n          <button class=\"btn btn-n\" onclick=\"decide('Rejected')\">Reject</button>\n        </div>\n      </div>\n    </section>\n\n    <\\!-- OTHER COMPANIES AS CHIPS -->\n    <div class=\"chips-hd\">Rest of portfolio</div>\n    <div class=\"chips\">\n      <div class=\"chip\">\n        <div class=\"chip-top\"><span class=\"chip-nm\">QuietInbox</span><span class=\"sdot bg-blue\"></span></div>\n        <div class=\"chip-state s-blue\">● Building</div>\n        <div class=\"chip-slice\">Slice 9 · Snooze a thread until tomorrow</div>\n        <div class=\"chip-stat\">$420 mrr · 38 users · quietinbox.io</div>\n      </div>\n      <div class=\"chip\">\n        <div class=\"chip-top\"><span class=\"chip-nm\">TranslatorBill</span><span class=\"sdot bg-blue\"></span></div>\n        <div class=\"chip-state s-blue\">● Building</div>\n        <div class=\"chip-slice\">Slice 6 · Digest scheduler UI</div>\n        <div class=\"chip-stat\">$0 · 0 users · no domain yet</div>\n      </div>\n      <div class=\"chip\">\n        <div class=\"chip-top\"><span class=\"chip-nm\">DataDrop</span><span class=\"sdot bg-slate\"></span></div>\n        <div class=\"chip-state s-slate\">● Todo</div>\n        <div class=\"chip-slice\">Slice 6 · Saved chart views (queued)</div>\n        <div class=\"chip-stat\">$95 mrr · 6 users · datadrop.sh</div>\n      </div>\n      <div class=\"chip paused\">\n        <div class=\"chip-top\"><span class=\"chip-nm\">RedditPainBot</span><span class=\"sdot bg-red\"></span></div>\n        <div class=\"chi "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>C Slop Slop</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#0a0c0e; --panel:#0f1316; --line:#1c2227; --line2:#262e35;\n    --txt:#c9d3da; --dim:#5e6b75; --dimmer:#3d474f;\n    --building:#4a9fff; --blocked:#ff5c5c; --todo:#7a8893;\n    --needs:#b98cff; --live:#4ade80; --paused:#d4a23a;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  html,body{height:100%}\n  body{\n    background:var(--bg); color:var(--txt);\n    font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.5;\n    display:grid; grid-template-columns:340px 1fr; height:100vh; overflow:hidden;\n  }\n  a{color:inherit;text-decoration:none}\n  .dim{color:var(--dim)} .dimmer{color:var(--dimmer)}\n\n  /* ===== CHAT (LEFT) ===== */\n  .chat{\n    border-right:1px solid var(--line); display:flex; flex-direction:column;\n    background:var(--panel);\n  }\n  .chat-hd{padding:18px 20px 14px; border-bottom:1px solid var(--line)}\n  .brand{font-weight:700; letter-spacing:.5px; font-size:14px}\n  .brand .blk{color:var(--live)}\n  .chat-sub{color:var(--dim); font-size:11px; margin-top:4px}\n  .msgs{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:16px}\n  .msg .who{font-size:10px; letter-spacing:1px; text-transform:uppercase; margin-bottom:5px}\n  .msg.a .who{color:var(--live)} .msg.u .who{color:var(--needs)}\n  .msg .body{color:var(--txt)}\n  .msg.u .body{color:var(--dim)}\n  .chat-in{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center}\n  .chat-in .pr{color:var(--live)}\n  .chat-in input{\n    flex:1; background:transparent; border:none; outline:none;\n    color:var(--txt); font-family:inherit; font-size:13px;\n  }\n  .chat-in input::placeholder{color:var(--dimmer)}\n\n  /* ===== MAIN ===== */\n  .main{display:flex; flex-direction:column; overflow:hidden}\n  .top{\n    padding:18px 28px; border-bottom:1px solid var(--line);\n    display:flex; justify-content:space-between; align-items:baseline;\n  }\n  .top h1{font-size:13px; font-weight:500; color:var(--dim); letter-spacing:.5px}\n  .stats{display:flex; gap:26px; font-size:12px}\n  .stats b{color:var(--txt); font-weight:700}\n  .stats .needs b{color:var(--needs)}\n\n  .scroll{flex:1; overflow-y:auto; padding:24px 28px}\n\n  /* companies */\n  .sec{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--dimmer); margin-bottom:14px}\n  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:30px}\n  .co{\n    background:var(--panel); border:1px solid var(--line);\n    border-left:3px solid var(--s); padding:18px 20px; min-height:130px;\n    display:flex; flex-direction:column;\n  }\n  .co.paused{opacity:.6}\n  .co-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}\n  .co-name{font-weight:700; font-size:15px}\n  .co-dot{width:8px;height:8px;border-radius:50%;background:var(--s);margin-top:5px;flex-shrink:0}\n  .co-desc{color:var(--dim); font-size:11.5px; margin:6px 0 auto; max-width:90%}\n  .co-status{font-size:15px; font-weight:700; color:var(--s); margin:16px 0 4px; letter-spacing:.3px}\n  .co-meta{display:flex; justify-content:space-between; font-size:11px; color:var(--dim)}\n  .co-meta .url{color:var(--dimmer)}\n  .needs-tag{\n    color:var(--needs); border:1px solid var(--needs); border-radius:3px;\n    font-size:9px; padding:2px 6px; letter-spacing:1px; align-self:flex-start;\n  }\n\n  /* approval queue */\n  .queue{background:var(--panel); border:1px solid var(--line); border-radius:4px}\n  .q-hd{padding:12px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between}\n  .q-hd .ct{color:var(--needs)}\n  .q-row{\n    display:flex; align-items:center; gap:14px; padding:12px 18px;\n    border-bottom:1px solid var(--line); font-size:12px;\n  }\n  .q-row:last-child{border-bottom:none}\n  .q-row.done{opacity:.35}\n  .q-co{color:var(--txt); font-weight:700; width:110px}\n  .q-slice{flex:1; color:var(--dim)}\n  .q-slice b{color:var(--txt); font-weight:500}\n  .q-url{color:var(--dimmer); width:200px}\n  .q-chk{color:var(--live); font-size:11px; width:90px}\n  .acts{display:flex; gap:10px}\n  .acts button{\n    background:none; border:none; font-family:inherit; font-size:11px; cursor:pointer; padding:0;\n  }\n  .acts .ap{color:var(--live)} .acts .rj{color:var(--blocked)}\n  .acts button:hover{text-decoration:underline}\n  .q-result{color:var(--dim); font-size:11px}\n  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}\n</style>\n</head>\n<body>\n\n  <\\!-- ===== CHAT LEFT ===== -->\n  <aside class=\"chat\">\n    <div class=\"chat-hd\">\n      <div class=\"brand\">C Slop Slop<span class=\"blk\">_</span></div>\n      <div class=\"chat-sub\">portfolio copilot</div>\n    </div>\n    <div class=\"msgs\" id=\"msgs\">\n      <div class=\"msg a\"><div class=\"who\">agent</div><div class=\"body\">LeadSift shipped a daily digest — it's live and the check passed. Approve it?</div></div>\n      <div class=\"msg u\"><div class=\"who\">you</div><div class=\"body\">show me what changed</div></div>\n      <div class=\"msg a\"><div class=\"who\">agent</div><div class=\"body\">One new component + a scheduler. Preview + green check are in the approval queue.</div></div>\n    </div>\n    <form class=\"chat-in\" id=\"chatForm\">\n      <span class=\"pr\">&gt;</span>\n      <input id=\"chatInput\" placeholder=\"message the copilot…\" autocomplete=\"off\">\n    </form>\n  </aside>\n\n  <\\!-- ===== MAIN ===== -->\n  <main class=\"main\">\n    <div class=\"top\">\n      <h1>~/portfolio</h1>\n      <div class=\"stats\">\n        <span class=\"dim\">mrr <b>$695</b></span>\n        <span class=\"dim\">users <b>56</b></span>\n        <span class=\"dim\">active <b>5</b></span>\n        <span class=\"dim\">shipped <b>22</b></span>\n        <span class=\"dim needs\">needs-you <b>1</b></span>\n      </div>\n    </div>\n\n    <div class=\"scroll\">\n      <div class=\"sec\">companies · 5</div>\n      <div class=\"grid\">\n\n        <div class=\"co\" style=\"--s:var(--live)\">\n          <div class=\"co-top\"><span class=\"co-name\">LeadSift</span><span class=\"co-dot\"></span></div>\n          <div class=\"co-desc\">Scrape + score inbound leads from any webform.</div>\n          <span class=\"needs-tag\">● NEEDS YOU · slice 5 awaiting approval</span>\n          <div class=\"co-status\" style=\"color:var(--needs)\">AWAITING APPROVAL · slice 5</div>\n          <div class=\"co-meta\"><span class=\"url\">leadsift.app</span><span>$180 · 12 users</span></div>\n        </div>\n\n        <div class=\"co\" style=\"--s:var(--building)\">\n          <div class=\"co-top\"><span class=\"co-name\">QuietInbox</span><span class=\"co-dot\"></span></div>\n          <div class=\"co-desc\">Email triage that auto-drafts replies you approve.</div>\n          <div class=\"co-status\">BUILDING · slice 9</div>\n          <div class=\"dim\" style=\"font-size:11px;margin-bottom:4px\">\"Snooze a thread until tomorrow\"</div>\n          <div class=\"co-meta\"><span class=\"url\">quietinbox.io</span><span>$420 · 38 users</span></div>\n        </div>\n\n        <div class=\"co\" style=\"--s:var(--building)\">\n          <div class=\"co-top\"><span class=\"co-name\">TranslatorBill</span><span class=\"co-dot\"></span></div>\n          <div class=\"co-desc\">Auto-translate + reformat invoices for cross-border freelancers.</div>\n          <div class=\"co-status\">BUILDING · slice 6</div>\n          <div class=\"dim\" style=\"font-size:11px;margin-bottom:4px\">\"Digest scheduler UI\"</div>\n          <div class=\"co-meta\"><span class=\"url\">no domain yet</span><span>$0 · 0 users</span></div>\n        </div>\n\n        <div class=\"co\" style=\"--s:var(--todo)\">\n          <div class=\"co-top\"><span class=\"co-name\">DataDrop</span><span class=\"co-dot\"></span></div>\n          <div class=\"co-desc\">CSV intake → clean → instant dashboard.</div>\n          <div class=\"co-status\">TODO · slice 6 queued</div>\n          <div class=\"dim\" style=\"font-size:11px;margin-bottom:4px\">\"Saved chart views\"</div>\n          <div class=\"co-meta\"><span class=\"url\">datadrop.sh</span><span>$95 · 6 users</span></div>\n        </div>\n\n        <div class=\"co paused\" style=\"--s:var(--blocked)\">\n          <div class=\"co-top\"><span class=\"co-name\">RedditPainBot</span><span class=\"co-dot\"></span></div>\n          <div class=\"co-desc\">Mine subreddits for pain posts → ranked ideas.</div>\n          <div class=\"co-status\" style=\"color:var(--blocked)\">BLOCKED · slice 8</div>\n          <div class=\"dim\" style=\"font-size:11px;margin-bottom:4px\">paused · stopped, no progress</div>\n          <div class=\"co-meta\"><span class=\"url\">no domain</span><span>$0 · 0 users</span></div>\n        </div>\n\n      </div>\n\n      <div class=\"sec\">approval queue · <span id=\"qcount\">3</span> awaiting</div>\n      <div class=\"queue\" id=\"queue\">\n        <div class=\"q-row\" data-id=\"1\">\n          <span class=\"q-co\">LeadSift</span>\n          <span class=\"q-slice\">slice 5 · <b>Daily email digest of top leads</b></span>\n          <span class=\"q-url\">localhost:4019/digest</span>\n          <span class=\"q-chk\">✓ check passed</span>\n          <span class=\"acts\"><button class=\"ap\" onclick=\"resolve(this,1)\">[approve]</button><button class=\"rj\" onclick=\"resolve(this,0)\">[reject]</button></span>\n        </div>\n        <div class=\"q-row\" data-id=\"2\">\n          <span class=\"q-co\">QuietInbox</span>\n          <span class=\"q-slice\">slice 8 · <b>Auto-draft tone control</b></span>\n          <span class=\"q-url\">localhost:4021/tone</span>\n          <span class=\"q-chk\">✓ check passed</span>\n          <span class=\"acts\"><button class=\"ap\" onclick=\"resolve(this,1)\">[approve]</button><button class=\"rj\" onclick=\"resolve(this,0)\">[reject]</button></span>\n        </div>\n        <div class=\"q-row\" data-id=\"3\">\n          <span class=\"q-co\">DataDrop</span>\n          <span class=\"q-slice\">slice 5 · <b>Shareable dashboard link</b></span>\n          <span class=\"q-url\">localhost:4025/share</span>\n          <span class=\"q-chk\">✓ check passed</span>\n          <span class=\"acts\"><button class=\"ap\" onclick=\"resolve(this,1)\">[approve]</button><button class=\"rj\" onclick=\"resolve(this,0)\">[reject]</button></span>\n        </div>\n      </div>\n    </div>\n  </main>\n\n<script>\n  let count = 3;\n  function resolve(btn, approved){\n    const row = btn.closest('.q-row');\n    row.classList.add('done');\n    row.querySelector('.acts').innerHTML =\n      '<span class=\"q-result\">'+(approved?'→ shipped to prod':'→ sent back')+'</span>';\n    count--; document.getElementById('qcount').textContent = count;\n  }\n  const form = document.getElementById('chatForm');\n  const input = document.getElementById('chatInput');\n  const msgs = document.getElementById('msgs');\n  form.addEventListener('submit', e=>{\n    e.preventDefault();\n    const v = input.value.trim(); if(!v) return;\n    const d = document.createElement('div');\n    d.className='msg u';\n    d.innerHTML='<div class=\"who\">you</div><div class=\"body\"></div>';\n    d.querySelector('.body').textContent=v;\n    msgs.appendChild(d); input.value='';\n    msgs.scrollTop = msgs.scrollHeight;\n  });\n<\\/script>\n</body>\n</html>",
"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>C Slop Slop</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#f6f7f9; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e7eaee;\n    --blue:#2563eb; --red:#e11d48; --slate:#94a3b8; --violet:#7c3aed; --green:#16a34a; --amber:#d97706;\n    --blue-bg:#eff4ff; --red-bg:#fef2f4; --slate-bg:#f1f5f9; --violet-bg:#f5f1fe; --green-bg:#eefbf2; --amber-bg:#fef6ec;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}\n  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}\n\n  /* CHAT LEFT */\n  .chat{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}\n  .chat-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}\n  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}\n  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}\n  .chat-sub{font-size:12px;color:var(--muted);margin-top:3px}\n  .msgs{flex:1;overflow-y:auto;padding:18px 18px;display:flex;flex-direction:column;gap:12px}\n  .msg{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;max-width:92%}\n  .msg.a{background:var(--slate-bg);color:var(--ink);border-bottom-left-radius:4px}\n  .msg.u{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}\n  .who{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}\n  .compose{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}\n  .compose input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;outline:none}\n  .compose input:focus{border-color:var(--blue)}\n  .compose button{border:none;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}\n\n  /* MAIN */\n  .main{overflow-y:auto;padding:22px 30px 40px}\n  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}\n  .h1{font-size:18px;font-weight:700;letter-spacing:-.02em}\n  .stats{display:flex;gap:22px;font-size:12.5px;color:var(--muted)}\n  .stats b{color:var(--ink);font-weight:600}\n\n  /* APPROVAL QUEUE — compact, fixed, pinned */\n  .queue{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:24px}\n  .queue-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:12px}\n  .pill{background:var(--violet-bg);color:var(--violet);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}\n  .q-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}\n  .q-row .q-co{font-weight:600;width:96px}\n  .q-row .q-title{flex:1;color:var(--ink)}\n  .q-row .q-url{color:var(--muted);font-size:11.5px;font-family:ui-monospace,monospace}\n  .q-check{color:var(--green);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}\n  .q-acts{display:flex;gap:6px}\n  .btn{font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:6px 14px;cursor:pointer;border:1px solid transparent}\n  .btn-approve{background:var(--green);color:#fff}\n  .btn-reject{background:#fff;color:var(--muted);border-color:var(--line)}\n  .btn:active{transform:translateY(1px)}\n  .q-done{color:var(--muted);font-size:12px;font-style:italic;padding:6px 0}\n\n  /* TIMELINE */\n  .lane-labels{display:grid;grid-template-columns:160px 1fr;gap:0}\n  .timeline{position:relative;padding-left:160px}\n  .axis{position:absolute;left:0;top:0;width:160px;height:100%}\n  .stage{position:relative;min-height:120px}\n  .stage-tag{position:absolute;left:0;width:148px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}\n  .stage-tag::before{content:\"\";width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--slate);z-index:2}\n  .stage.s-idea .stage-tag::before{border-color:var(--slate)}\n  .stage.s-build .stage-tag::before{border-color:var(--blue)}\n  .stage.s-live .stage-tag::before{border-color:var(--green)}\n  /* vertical line */\n  .timeline::before{content:\"\";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--slate),var(--blue),var(--green));opacity:.35}\n  .cards{display:flex;flex-direction:column;gap:14px;padding-bottom:26px}\n\n  /* COMPANY CARD — large */\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;border-left:5px solid var(--slate);display:flex;gap:18px;align-items:flex-start;transition:box-shadow .15s}\n  .card:hover{box-shadow:0 6px 20px rgba(15,23,42,.06)}\n  .card.b-building{border-left-color:var(--blue)}\n  .card.b-blocked{border-left-color:var(--red)}\n  .card.b-await{border-left-color:var(--violet)}\n  .card.b-live{border-left-color:var(--green)}\n  .card.b-todo{border-left-color:var(--slate)}\n  .card.paused{opacity:.72}\n  .card-body{flex:1;min-width:0}\n  .card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n  .co-name{font-size:16px;font-weight:700;letter-spacing:-.01em}\n  .co-domain{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}\n  .co-desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}\n  .co-foot{display:flex;align-items:center;gap:18px;margin-top:13px;font-size:12.5px}\n  .co-mrr{font-weight:600}\n  .co-foot .sep{color:var(--line)}\n  .badge n><b>5</b> active</span>\n        <span><b>22</b> shipped</span>\n        <span style=\"color:var(--violet)\"><b>1</b> needs you</span>\n      </div>\n    </div>\n\n    <\\!-- APPROVAL QUEUE -->\n    <section class=\"queue\">\n      <div class=\"queue-head\">Approval queue <span class=\"pill\" id=\"qcount\">3 awaiting</span></div>\n      <div id=\"qlist\">\n        <div class=\"q-row\">\n          <span class=\"q-co\">LeadSift</span>\n          <span class=\"q-title\">slice 5 · Daily email digest of top leads</span>\n          <span class=\"q-url\">localhost:4019/digest</span>\n          <span class=\"q-check\">● check passed</span>\n          <span class=\"q-acts\">\n            <button class=\"btn btn-approve\" onclick=\"act(this,'approved')\">Approve</button>\n            <button class=\"btn btn-reject\" onclick=\"act(this,'rejected')\">Reject</button>\n          </span>\n        </div>\n        <div class=\"q-row\">\n          <span class=\"q-co\">QuietInbox</span>\n          <span class=\"q-title\">slice 8 · Auto-draft tone control</span>\n          <span class=\"q-url\">localhost:4021/tone</span>\n          <span class=\"q-check\">● check passed</span>\n          <span class=\"q-acts\">\n            <button class=\"btn btn-approve\" onclick=\"act(this,'approved')\">Approve</button>\n            <button class=\"btn btn-reject\" onclick=\"act(this,'rejected')\">Reject</button>\n          </span>\n        </div>\n        <div class=\"q-row\">\n          <span class=\"q-co\">DataDrop</span>\n          <span class=\"q-title\">slice 5 · Shareable dashboard link</span>\n          <span class=\"q-url\">localhost:4025/share</span>\n          <span class=\"q-check\">● check passed</span>\n          <span class=\"q-acts\">\n            <button class=\"btn btn-approve\" onclick=\"act(this,'approved')\">Approve</button>\n            <button class=\"btn btn-reject\" onclick=\"act(this,'rejected')\">Reject</button>\n          </span>\n        </div>\n      </div>\n    </section>\n\n    <\\!-- TIMELINE -->\n    <div class=\"timeline\">\n      <div class=\"axis\"></div>\n\n      <\\!-- IDEA -->\n      <div class=\"stage s-idea\">\n        <div class=\"stage-tag\">Idea</div>\n        <div class=\"cards\">\n          <div class=\"card b-blocked paused\">\n            <div class=\"card-body\">\n              <div class=\"card-top\">\n                <span class=\"co-name\">RedditPainBot</span>\n                <span class=\"co-domain\">no domain</span>\n              </div>\n              <div class=\"co-desc\">Mine subreddits for pain posts → ranked ideas.</div>\n              <div class=\"build-state\">⛔ Slice 8 <b>blocked</b> — stopped, no progress</div>\n              <div class=\"co-foot\"><span class=\"co-mrr\">$0</span></div>\n            </div>\n            <div class=\"card-side\">\n              <span class=\"badge bd-paused\">Paused</span>\n              <span class=\"badge bd-blocked\">Blocked</span>\n              <span class=\"users\">0 users</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\\!-- BUILD -->\n      <div class=\"stage s-build\">\n        <div class=\"stage-tag\">Build</div>\n        <div class=\"cards\">\n          <div class=\"card b-building\">\n            <div class=\"card-body\">\n              <div class=\"card-top\">\n                <span class=\"co-name\">TranslatorBill</span>\n                <span class=\"co-domain\">no domain yet</span>\n              </div>\n              <div class=\"co-desc\">Auto-translate + reformat invoices for cross-border freelancers.</div>\n              <div class=\"build-state\">🔧 Building slice 6 — <b>Digest scheduler UI</b></div>\n              <div class=\"co-foot\"><span class=\"co-mrr\">$0</span></div>\n            </div>\n            <div class=\"card-side\">\n              <span class=\"badge bd-building\">Building</span>\n              <span class=\"users\">0 users</span>\n            </div>\n          </div>\n\n          <div class=\"card b-building\">\n            <div class=\"card-body\">\n              <div class=\"card-top\">\n                <span class=\"co-name\">QuietInbox</span>\n                <span class=\"co-domain\">quietinbox.io</span>\n              </div>\n              <div class=\"co-desc\">Email triage that auto-drafts replies you approve.</div>\n              <div class=\"build-state\">🔧 Building slice 9 — <b>Snooze a thread until tomorrow</b></div>\n              <div class=\"co-foot\"><span class=\"co-mrr\">$420 mrr</span></div>\n            </div>\n            <div class=\"card-side\">\n              <span class=\"badge bd-building\">Building</span>\n              <span class=\"badge bd-live\">Active</span>\n              <span class=\"users\">38 users</span>\n            </div>\n          </div>\n\n          <div class=\"card b-todo\">\n            <div class=\"card-body\">\n              <div class=\"card-top\">\n                <span class=\"co-name\">DataDrop</span>\n                <span class=\"co-domain\">datadrop.sh</span>\n              </div>\n              <div class=\"co-desc\">CSV intake → clean → instant dashboard.</div>\n              <div class=\"build-state\">○ Todo slice 6 — <b>Saved chart views</b> (queued)</div>\n              <div class=\"co-foot\"><span class=\"co-mrr\">$95 mrr</span></div>\n            </div>\n            <div class=\"card-side\">\n              <span class=\"badge bd-todo\">Queued</span>\n              <span class=\"badge bd-live\">Active</span>\n              <span class=\"users\">6 users</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\\!-- LIVE -->\n      <div class=\"stage s-live\">\n        <div class=\"stage-tag\">Live</div>\n        <div class=\"cards\">\n          <div class=\"card b-await\">\n            <div class=\"card-body\">\n              <div class=\"card-top\">\n                <span class=\"co-name\">LeadSift</span>\n                <span class=\"co-domain\">leadsift.app</span>\n              </div>\n              <div class=\"co-desc\">Scrape + score inbound leads from any webform.</div>\n              <div class=\"build-state\">★ Slice 5 <b>awaiting your approval</b> — “daily email digest” (check passed)</div>\n              <div class=\"co-foot\"><span class=\"co-mrr\">$180 mrr</span></div>\n            </div>\n            <div class=\"card-side\">\n              <span class=\"badge bd-await\">Needs you</span>\n              <span class=\"badge bd-live\">Active</span>\n              <span class=\"users\">12 users</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n    </div>\n  </main>\n</div>\n\n<script>\nfunction act(btn,verb){\n  const row=btn.closest('.q-row');\n  row.innerHTML='<span class=\"q-done\">'+row.querySelector('.q-co').textContent+' · '+verb+'</span>';\n  const left=document.querySelectorAll('#qlist .q-acts').length;\n  const pill=document.getElementById('qcount');\n  pill.textContent=left?left+' awaiting':'all clear';\n}\nfunction send(e){\n  e.preventDefault();\n  const inp=document.getElementById('inp'); const v=inp.value.trim(); if(!v)return false;\n  const m=document.getElementById('msgs');\n  const u=document.createElement('div'); u.className='msg u'; u.textContent=v; m.appendChild(u);\n  inp.value='';\n  setTimeout(()=>{\n    const a=document.createElement('div'); a.className='msg a';\n    a.innerHTML='<div class=\"who\">Agent</div>On it — checking the portfolio.';\n    m.appendChild(a); m.scrollTop=m.scrollHeight;\n  },350);\n  m.scrollTop=m.scrollHeight;\n  return false;\n}\n<\\/script>\n</body>\n</html>",
