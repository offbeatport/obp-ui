<!DOCTYPE html>
<html lang="en" data-theme="light" data-zoom="in">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · Areas — Stacked Rows</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('cslopslop-theme');
      document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    try {
      var z = localStorage.getItem('cslopslop-zoom');
      document.documentElement.setAttribute('data-zoom', (z === 'out' || z === 'in') ? z : 'in');
    } catch (e) {
      document.documentElement.setAttribute('data-zoom', 'in');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f7f3ec;
    --cream-2: #f1eae0;
    --paper: #fffdf8;
    --ink: #2c2926;
    --ink-soft: #6b645d;
    --ink-faint: #9c948b;
    --line: #e7ded0;
    --line-soft: #f0e9dd;
    --accent: #c8643c;
    --accent-soft: #f4ddce;
    --green: #4f8a52;
    --green-soft: #dcebd7;
    --blue: #3f6fb0;
    --blue-soft: #d9e3f2;
    --violet: #7c5cc4;
    --violet-soft: #e6ddf4;
    --amber: #c08a2c;
    --amber-soft: #f3e6c6;
    --red: #c0503f;
    --red-soft: #f4d8d1;
    --slate: #6a7686;
    --slate-soft: #e3e2df;
    --shadow: 0 1px 2px rgba(44, 41, 38, 0.05), 0 8px 30px rgba(44, 41, 38, 0.07);
    --shadow-lift: 0 2px 6px rgba(44, 41, 38, 0.08), 0 18px 50px rgba(44, 41, 38, 0.16);
  }
  :root[data-theme="dark"] {
    --cream: #05060a;
    --cream-2: #0a0c14;
    --paper: #10131f;
    --ink: #e6ebf5;
    --ink-soft: #a5adbf;
    --ink-faint: #6b7385;
    --line: #242938;
    --line-soft: #1a1e2b;
    --accent: #e0794e;
    --accent-soft: #3a2417;
    --green: #34d399;
    --green-soft: #10362c;
    --blue: #5b9cf0;
    --blue-soft: #142a45;
    --violet: #a78bfa;
    --violet-soft: #241d3f;
    --amber: #fbbf24;
    --amber-soft: #372a10;
    --red: #f87171;
    --red-soft: #3a1c1c;
    --slate: #94a3b8;
    --slate-soft: #202634;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 34px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 2px 8px rgba(0, 0, 0, 0.5), 0 22px 60px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* stage tone mapping */
  .s-idea    { --tone: var(--slate);  --tone-soft: var(--slate-soft); }
  .s-building{ --tone: var(--blue);   --tone-soft: var(--blue-soft); }
  .s-testing { --tone: var(--amber);  --tone-soft: var(--amber-soft); }
  .s-growing { --tone: var(--green);  --tone-soft: var(--green-soft); }
  .s-ejected { --tone: var(--violet); --tone-soft: var(--violet-soft); }
  .s-killed  { --tone: var(--red);    --tone-soft: var(--red-soft); }

  /* area accents */
  .r-build { --area: var(--blue);   --area-soft: var(--blue-soft); }
  .r-grow  { --area: var(--violet); --area-soft: var(--violet-soft); }
  .r-run   { --area: var(--green);  --area-soft: var(--green-soft); }

  /* ---------- Top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 11px clamp(16px, 4vw, 44px);
    background: color-mix(in srgb, var(--cream) 84%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center; position: relative;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--amber)));
    color: #fff; box-shadow: var(--shadow);
  }
  .logo svg { width: 17px; height: 17px; }
  .logo .hum {
    position: absolute; right: -3px; top: -3px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--green); border: 2px solid var(--cream);
  }
  .logo .hum::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    background: var(--green); opacity: .5; animation: ring 2.4s ease-out infinite;
  }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
  .brand-txt b {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
  }
  .brand-txt span { font-size: 10px; color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
  .top-spacer { flex: 1; }
  .icon-btn {
    height: 36px; min-width: 36px; padding: 0 10px; flex: none; border-radius: 10px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px; justify-content: center; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .04em;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.sq { width: 36px; padding: 0; }
  .sun { display: none; }
  :root[data-theme="dark"] .sun { display: block; }
  :root[data-theme="dark"] .moon { display: none; }
  .zoom-in-ic { display: none; }
  :root[data-zoom="out"] .zoom-in-ic { display: block; }
  :root[data-zoom="out"] .zoom-out-ic { display: none; }
  .zoom-label::after { content: "Compact"; }
  :root[data-zoom="out"] .zoom-label::after { content: "Expand"; }

  /* ---------- Legend strip ---------- */
  .legend {
    position: sticky; top: 58px; z-index: 40;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px clamp(16px, 4vw, 44px);
    background: color-mix(in srgb, var(--cream) 88%, transparent);
    backdrop-filter: saturate(1.3) blur(12px);
    -webkit-backdrop-filter: saturate(1.3) blur(12px);
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-soft);
  }
  .legend .lg-t { color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; }
  .lg { display: inline-flex; align-items: center; gap: 8px; }
  .lg .sw {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--ink-faint); background: var(--paper);
  }
  .lg .sw svg { width: 13px; height: 13px; }
  .lg.off .sw { border-style: dashed; opacity: .6; }
  .lg.idle .sw { border-color: var(--line); color: var(--blue); background: color-mix(in srgb, var(--blue-soft) 45%, var(--paper)); }
  .lg.live .sw {
    border-color: var(--green); color: var(--green); background: var(--green-soft);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent);
  }
  .lg.needs .sw { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .lg b { color: var(--ink); font-weight: 600; }
  .legend .spacer { flex: 1; }
  .legend .count { color: var(--ink-faint); }
  .legend .count b { color: var(--accent); }

  /* ---------- Grid ---------- */
  .wrap { padding: clamp(18px, 3vw, 30px) clamp(16px, 4vw, 44px) 40px; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    max-width: 1360px; margin: 0 auto;
  }
  :root[data-zoom="out"] .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

  /* ---------- Card ---------- */
  .card {
    position: relative; background: var(--paper);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 11px;
    box-shadow: var(--shadow);
    transition: box-shadow .22s ease, border-color .22s ease, transform .18s ease;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  .card:hover { box-shadow: var(--shadow-lift); border-color: color-mix(in srgb, var(--tone) 42%, var(--line)); }
  .card.is-dead { opacity: .6; }
  .card.is-dead:hover { opacity: .92; }

  .card-head { display: flex; align-items: center; gap: 9px; }
  .card-head h3 {
    margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 17px; letter-spacing: -0.01em; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: var(--tone);
    background: var(--tone-soft); border: 1px solid color-mix(in srgb, var(--tone) 35%, transparent);
    padding: 3px 8px; border-radius: 999px;
  }

  .dead-note {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--red);
    background: var(--red-soft); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
    border-radius: 8px; padding: 6px 9px;
  }

  /* ---------- Rows (expanded) ---------- */
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: 9px 11px; border-radius: 12px;
    border: 1px solid var(--line-soft); border-left: 3px solid var(--line);
    background: var(--paper);
    transition: border-color .2s ease, background .2s ease;
  }
  .st-active.row { border-left-color: var(--area); background: color-mix(in srgb, var(--area-soft) 20%, var(--paper)); }
  .st-needs.row  { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 34%, var(--paper)); }
  .st-idle.row   { border-left-color: color-mix(in srgb, var(--area) 40%, var(--line)); }
  .st-off.row    { border-left: 3px dashed var(--line); background: var(--cream-2); opacity: .58; }

  /* the STAR: area icon + its state */
  .area-ic {
    position: relative; width: 46px; height: 46px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--ink-faint); background: var(--paper);
    transition: box-shadow .25s ease, border-color .25s ease, color .25s ease, background .25s ease;
  }
  .area-ic svg { width: 22px; height: 22px; }
  .st-off .area-ic { border-style: dashed; color: var(--ink-faint); background: transparent; }
  .st-idle .area-ic {
    border-color: color-mix(in srgb, var(--area) 40%, var(--line));
    color: var(--area); background: color-mix(in srgb, var(--area-soft) 45%, var(--paper));
  }
  .st-active .area-ic {
    border-color: var(--area); color: var(--area); background: var(--area-soft);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--area) 20%, transparent), 0 6px 18px color-mix(in srgb, var(--area) 28%, transparent);
  }
  .st-active .area-ic::after {
    content: ""; position: absolute; inset: -1px; border-radius: 12px;
    box-shadow: 0 0 0 2px var(--area); opacity: .5; animation: glow 2s ease-out infinite;
  }
  .st-needs .area-ic {
    border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent), 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .st-needs .area-ic::after {
    content: ""; position: absolute; inset: -1px; border-radius: 12px;
    box-shadow: 0 0 0 2px var(--accent); opacity: .5; animation: glow 1.7s ease-out infinite;
  }
  .ic-lock {
    position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--cream-2); border: 1px solid var(--line); color: var(--ink-faint);
    display: grid; place-items: center; font-size: 8.5px;
  }
  .ic-flag {
    position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 2px solid var(--paper);
    display: grid; place-items: center; font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700; line-height: 1;
  }
  .ic-flag::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    background: var(--accent); opacity: .4; animation: ring 1.8s ease-out infinite;
  }

  .area-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .area-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .area-label {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px;
    letter-spacing: -.01em; color: var(--ink);
  }
  .st-off .area-label { color: var(--ink-faint); }
  .state-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
    border: 1px solid transparent; display: inline-flex; align-items: center; gap: 5px;
  }
  .st-active .state-pill { color: var(--green); background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .st-active .state-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.4s steps(2, start) infinite; }
  .st-idle .state-pill { color: var(--slate); background: var(--slate-soft); }
  .st-off .state-pill { color: var(--ink-faint); background: transparent; border: 1px dashed var(--line); }
  .st-needs .state-pill { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .auto-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600;
    color: var(--ink-soft); background: var(--cream-2); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 6px; letter-spacing: .03em;
  }
  .auto-chip.off { color: var(--ink-faint); opacity: .8; }
  .area-task {
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .st-off .area-task { color: var(--ink-faint); font-style: italic; }

  .area-live {
    justify-self: end; text-align: right; max-width: 44%;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .area-live .tick { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .22s ease; }
  .area-live .tick.muted { opacity: .55; }
  .st-active .area-live { color: var(--area); }
  .st-needs .area-live { color: var(--accent); }
  .area-live.anim::before {
    content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; animation: blink 1.5s steps(2, start) infinite;
  }

  /* ---------- Compact (zoomed-out) ---------- */
  .compact { display: none; }
  :root[data-zoom="out"] .rows { display: none; }
  :root[data-zoom="out"] .compact { display: flex; flex-direction: column; gap: 10px; }
  .areas-mini { display: flex; gap: 9px; }
  .mini {
    position: relative; flex: 1; aspect-ratio: 1 / 1; border-radius: 12px;
    display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--ink-faint); background: var(--paper);
  }
  .mini svg { width: 20px; height: 20px; }
  .mini.st-off { border-style: dashed; opacity: .5; }
  .mini.st-idle { border-color: color-mix(in srgb, var(--area) 40%, var(--line)); color: var(--area); background: color-mix(in srgb, var(--area-soft) 40%, var(--paper)); }
  .mini.st-active { border-color: var(--area); color: var(--area); background: var(--area-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--area) 20%, transparent); }
  .mini.st-needs { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .mini .dot {
    position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .mini.st-active .dot { background: var(--green); }
  .mini.st-idle .dot { background: var(--slate); }
  .mini.st-needs .dot { background: var(--accent); }
  .mini.st-off .dot { display: none; }
  .compact-note {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .compact-note .cn-live { color: var(--green); font-weight: 600; }
  .compact-note .cn-needs { color: var(--accent); font-weight: 600; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    z-index: 200; background: var(--ink); color: var(--paper);
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500;
    padding: 11px 18px; border-radius: 12px; box-shadow: var(--shadow-lift);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    max-width: 88vw; text-align: center;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    padding: 24px clamp(16px, 4vw, 44px); border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint);
  }
  footer b { color: var(--ink-soft); }

  /* ---------- keyframes ---------- */
  @keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes glow { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.22); opacity: 0; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  @media (max-width: 560px) {
    .legend { top: 56px; gap: 10px; }
    .legend .lg-t { display: none; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18M6 20V9l4 3V9l4 3V9l4 3v8" />
        </svg>
        <span class="hum"></span>
      </div>
      <div class="brand-txt">
        <b>C Slop Slop</b>
        <span>build · grow · run</span>
      </div>
    </div>
    <div class="top-spacer"></div>
    <button class="icon-btn" id="zoomBtn" aria-label="Toggle compact / expanded view" title="Toggle density">
      <svg class="zoom-out-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <svg class="zoom-in-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span class="zoom-label"></span>
    </button>
    <button class="icon-btn sq" id="themeBtn" aria-label="Toggle light / dark theme" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- Legend: the three area states -->
  <div class="legend" aria-label="Legend — the three area states">
    <span class="lg-t">area state</span>
    <span class="lg off"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span> <b>Off</b> locked</span>
    <span class="lg idle"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg></span> <b>Idle</b> quiet</span>
    <span class="lg live"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span> <b>Live</b> active</span>
    <span class="lg needs"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h13l-2 4 2 4H4"/></svg></span> <b>Needs you</b></span>
    <span class="spacer"></span>
    <span class="count"><b id="cNeeds">0</b> awaiting you · <b id="cCos">6</b> companies</span>
  </div>

  <main class="wrap">
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span>C Slop Slop · <b>the AI runs the company</b> — you oversee the three areas</span>
    <span>Build · Grow · Run — icon &amp; state say it all</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ICON = {
    build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    grow:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 16.5 8.5 11.5 1 19"/><polyline points="17 6 23 6 23 12"/></svg>',
    run:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
  };
  var AREA = {
    build: { label: 'Build', cls: 'r-build', icon: ICON.build },
    grow:  { label: 'Grow',  cls: 'r-grow',  icon: ICON.grow },
    run:   { label: 'Run',   cls: 'r-run',   icon: ICON.run }
  };
  var STATE = {
    active: { label: 'Live',      cls: 'st-active' },
    idle:   { label: 'Idle',      cls: 'st-idle' },
    off:    { label: 'Off',       cls: 'st-off' },
    needs:  { label: 'Needs you', cls: 'st-needs' }
  };
  var STAGE = {
    Idea: 's-idea', Building: 's-building', Testing: 's-testing',
    Growing: 's-growing', Ejected: 's-ejected', Killed: 's-killed'
  };

  var companies = [
    { name: 'LeadSift', stage: 'Growing',
      build: { s: 'active', a: 'L1', task: 'CSV export', ticks: ['wrote the exporter', 'ran tests ✓', 'deployed to staging'] },
      grow:  { s: 'needs',  a: 'L0', task: 'Product Hunt launch — $40 gated', ticks: ['drafted the PH post', 'wrote an SEO article', '$40 spend awaiting you'] },
      run:   { s: 'active', a: 'L1', task: 'onboarding + support', ticks: ['sent 3 onboarding emails', 'answered a ticket'] } },
    { name: 'QuietInbox', stage: 'Growing',
      build: { s: 'active', a: 'L2', task: 'Snooze a thread', ticks: ['wrote snooze logic', 'deployed slice 9'] },
      grow:  { s: 'active', a: 'L1', task: 'newsletter + launch', ticks: ['scheduled a tweet 4pm', '1.2k newsletter sent'] },
      run:   { s: 'active', a: 'L1', task: 'support queue', ticks: ['drafted 9 replies', '0 refunds'] } },
    { name: 'DataDrop', stage: 'Testing',
      build: { s: 'active', a: 'L1', task: 'Saved chart views', ticks: ['re-prioritized backlog', 'cleaning CSV parser'] },
      grow:  { s: 'needs',  a: 'L0', task: 'r/SaaS launch thread', ticks: ['drafted the thread + 3 replies', 'awaiting your post'] },
      run:   { s: 'idle',   a: 'L1', task: 'quiet — 1 open ticket', ticks: ['checked uptime · 200 OK'] } },
    { name: 'TranslatorBill', stage: 'Building',
      build: { s: 'active', a: 'L1', task: 'InvoiceFormatter.tsx', ticks: ['translating a sample invoice', 'ran tests · green'] },
      grow:  { s: 'off',    a: 'off', task: 'blocked — no domain', ticks: [] },
      run:   { s: 'off',    a: 'off', task: 'pre-revenue', ticks: [] } },
    { name: 'PricePeek', stage: 'Idea',
      build: { s: 'idle', a: 'L0', task: 'validating — 15 interviews', ticks: ['drafted interview script', 'listed 15 targets'] },
      grow:  { s: 'off',  a: 'off', task: 'locked', ticks: [] },
      run:   { s: 'off',  a: 'off', task: 'locked', ticks: [] } },
    { name: 'RedditPainBot', stage: 'Killed', dead: true, note: 'loop stopped · post-mortem filed',
      build: { s: 'off', a: 'off', task: 'stopped', ticks: [] },
      grow:  { s: 'off', a: 'off', task: 'stopped', ticks: [] },
      run:   { s: 'off', a: 'off', task: 'stopped', ticks: [] } }
  ];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }

  function areaRow(key, d) {
    var A = AREA[key], S = STATE[d.s];
    var badge = '';
    if (d.s === 'off') { badge = '<span class="ic-lock" aria-hidden="true">🔒</span>'; }
    if (d.s === 'needs') { badge = '<span class="ic-flag" title="Needs you" aria-hidden="true">!</span>'; }
    var auto = d.a === 'off'
      ? '<span class="auto-chip off">off</span>'
      : '<span class="auto-chip" title="Autonomy level">' + esc(d.a) + '</span>';
    var live;
    if (d.ticks && d.ticks.length) {
      var animate = (d.s === 'active' || d.s === 'needs');
      live = '<div class="area-live' + (animate ? ' anim' : '') + '" data-ticks=\'' + esc(JSON.stringify(d.ticks)) + '\'>' +
             '<span class="tick">' + esc(d.ticks[0]) + '</span></div>';
    } else {
      live = '<div class="area-live"><span class="tick muted">—</span></div>';
    }
    return '<div class="row ' + A.cls + ' ' + S.cls + '">' +
             '<div class="area-ic">' + A.icon + badge + '</div>' +
             '<div class="area-main">' +
               '<div class="area-top">' +
                 '<span class="area-label">' + A.label + '</span>' +
                 '<span class="state-pill">' + S.label + '</span>' + auto +
               '</div>' +
               '<div class="area-task">' + esc(d.task) + '</div>' +
             '</div>' + live +
           '</div>';
  }

  function miniArea(key, d) {
    var A = AREA[key], S = STATE[d.s];
    return '<span class="mini ' + A.cls + ' ' + S.cls + '" title="' + A.label + ' · ' + S.label + '">' +
             A.icon + '<span class="dot"></span></span>';
  }

  function summary(c) {
    var live = 0, needs = 0;
    ['build', 'grow', 'run'].forEach(function (k) {
      if (c[k].s === 'active') { live++; }
      if (c[k].s === 'needs') { needs++; }
    });
    var parts = [];
    if (live) { parts.push('<span class="cn-live">' + live + ' live</span>'); }
    if (needs) { parts.push('<span class="cn-needs">' + needs + ' needs you</span>'); }
    if (!parts.length) { parts.push('quiet'); }
    return parts.join(' · ');
  }

  function cardHTML(c) {
    var dead = c.dead ? ' is-dead' : '';
    return '<article class="card ' + STAGE[c.stage] + dead + '">' +
             '<div class="card-head"><h3>' + esc(c.name) + '</h3><span class="pill">' + esc(c.stage) + '</span></div>' +
             (c.note ? '<div class="dead-note">' + esc(c.note) + '</div>' : '') +
             '<div class="rows">' + areaRow('build', c.build) + areaRow('grow', c.grow) + areaRow('run', c.run) + '</div>' +
             '<div class="compact">' +
               '<div class="areas-mini">' + miniArea('build', c.build) + miniArea('grow', c.grow) + miniArea('run', c.run) + '</div>' +
               '<div class="compact-note">' + summary(c) + '</div>' +
             '</div>' +
           '</article>';
  }

  var grid = document.getElementById('grid');
  grid.innerHTML = companies.map(function (c, k) {
    return cardHTML(c).replace('<article ', '<article style="animation-delay:' + Math.min(k * 55, 400) + 'ms" ');
  }).join('');

  // legend counts
  var needsTotal = 0;
  companies.forEach(function (c) {
    ['build', 'grow', 'run'].forEach(function (k) { if (c[k].s === 'needs') { needsTotal++; } });
  });
  document.getElementById('cNeeds').textContent = needsTotal;
  document.getElementById('cCos').textContent = companies.length;

  // live-activity tickers — update in place
  if (!rm) {
    var lives = Array.prototype.slice.call(document.querySelectorAll('.area-live.anim'));
    lives.forEach(function (el, idx) {
      var ticks;
      try { ticks = JSON.parse(el.getAttribute('data-ticks')); } catch (e) { return; }
      if (!ticks || ticks.length < 2) { return; }
      var span = el.querySelector('.tick');
      var i = 0;
      setTimeout(function () {
        setInterval(function () {
          i = (i + 1) % ticks.length;
          span.style.opacity = '0';
          setTimeout(function () { span.textContent = ticks[i]; span.style.opacity = ''; }, 220);
        }, 2600 + (idx % 4) * 350);
      }, idx * 400);
    });
  }

  // toast
  var toast = document.getElementById('toast');
  var toastT = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    if (toastT) { clearTimeout(toastT); }
    toastT = setTimeout(function () { toast.classList.remove('on'); }, 2400);
  }

  // theme toggle
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('cslopslop-theme', next); } catch (e) {}
  });

  // zoom toggle
  document.getElementById('zoomBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-zoom');
    var next = cur === 'out' ? 'in' : 'out';
    document.documentElement.setAttribute('data-zoom', next);
    try { localStorage.setItem('cslopslop-zoom', next); } catch (e) {}
    showToast(next === 'out' ? '▦ Compact — all companies at a glance' : '≡ Expanded — full area rows');
  });
})();
</script>
</body>
</html>
