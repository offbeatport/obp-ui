<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop - 29 · Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f5f5f6;
    --border: #e7e7e9;
    --border-strong: #d8d8db;
    --text: #18181b;
    --text-2: #6b6b73;
    --text-3: #a1a1aa;
    --accent: #5b5bf6;
    --accent-soft: #eeeefe;
    --green: #16a34a;
    --green-soft: #e7f6ec;
    --amber: #d97706;
    --amber-soft: #fcf2e2;
    --violet: #7c3aed;
    --violet-soft: #f1ebfe;
    --blue: #2563eb;
    --blue-soft: #e8effe;
    --red: #dc2626;
    --red-soft: #fbe9e9;
    --slate: #94a3b8;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.03);
    --shadow-md: 0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.13), 0 4px 14px rgba(0,0,0,.07);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum"; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--accent-soft); }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; height: 52px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .brand .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); }
  .brand .sub { color: var(--text-3); font-weight: 450; font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .seg {
    display: flex; background: var(--surface-2); border-radius: 9px; padding: 3px;
    gap: 2px;
  }
  .seg button {
    font-size: 12.5px; font-weight: 500; color: var(--text-2);
    padding: 5px 12px; border-radius: 7px; transition: all .14s var(--ease);
  }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .cmd {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 10px; color: var(--text-3);
    font-size: 13px; min-width: 220px; transition: border-color .14s var(--ease);
  }
  .cmd:hover { border-color: var(--border-strong); }
  .cmd kbd {
    margin-left: auto; font-size: 11px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
    color: var(--text-2); font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- COMPANY STRIP ---------- */
  .strip-wrap { flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .strip-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px 8px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
  }
  .strip-head .hint { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 450; color: var(--text-3); }
  .strip-head .hint kbd {
    font-size: 10.5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 5px; font-family: 'JetBrains Mono', monospace; margin: 0 1px;
  }
  .strip {
    display: flex; gap: 10px; padding: 2px 18px 16px;
    overflow-x: auto; scroll-behavior: smooth;
  }
  .strip::-webkit-scrollbar { height: 8px; }
  .strip::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .strip::-webkit-scrollbar-track { background: transparent; }
  .chip {
    flex: 0 0 auto; width: 198px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 12px 13px;
    text-align: left; transition: all .15s var(--ease);
    position: relative; overflow: hidden;
  }
  .chip:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .chip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-md); }
  .chip.sel::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);
  }
  .chip.needs { }
  .chip-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.active { background: var(--green); }
  .status-dot.paused { background: var(--amber); }
  .status-dot.archived { background: var(--slate); }
  .chip-name { font-weight: 600; font-size: 14px; }
  .chip .needs-tag {
    margin-left: auto; font-size: 10px; font-weight: 600;
    background: var(--violet-soft); color: var(--violet);
    padding: 2px 7px; border-radius: 999px; letter-spacing: .02em;
    animation: pulseTag 2s var(--ease) infinite;
  }
  @keyframes pulseTag { 0%,100%{opacity:1} 50%{opacity:.55} }
  .chip-thesis {
    font-size: 12px; color: var(--text-2); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    height: 33px; margin-bottom: 10px;
  }
  .chip-foot { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-2); }
  .chip-foot .mono { font-weight: 500; color: var(--text); }
  .chip-foot .build { color: var(--blue); display:flex; align-items:center; gap:5px; }
  .chip-foot .build .mini { width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite; }
  .chip-add {
    flex: 0 0 auto; width: 56px; border: 1px dashed var(--border-strong);
    border-radius: var(--radius); background: transparent; color: var(--text-3);
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    transition: all .15s var(--ease);
  }
  .chip-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

  /* ---------- STAGE ---------- */
  .stage { flex: 1; overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; overflow: auto; padding: 22px 26px 40px; }
  .view::-webkit-scrollbar { width: 10px; }
  .view::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }

  .stage-swap { animation: swapIn .26s var(--ease); }
  @keyframes swapIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

  /* ---------- OVERVIEW ---------- */
  .ov-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .ov-head h1 { font-size: 19px; font-weight: 600; }
  .ov-head .muted { color: var(--text-3); font-size: 13px; }
  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 26px; }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .metric .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .metric .v.accent { color: var(--accent); }
  .metric .k { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
  .metric.needs { border-color: var(--violet); background: var(--violet-soft); }
  .metric.needs .v { color: var(--violet); }

  .sec-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 4px 0 12px; }
  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 26px; align-items: start; }

  .opp-list { display: flex; flex-direction: column; gap: 8px; }
  .opp {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 14px; transition: all .14s var(--ease);
  }
  .opp:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .opp.killed { opacity: .5; }
  .score {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px;
  }
  .score.hi { background: var(--green-soft); color: var(--green); }
  .score.mid { background: var(--amber-soft); color: var(--amber); }
  .score.lo { background: var(--surface-2); color: var(--text-2); }
  .opp .body { flex: 1; min-width: 0; }
  .opp .body .t { font-weight: 600; font-size: 13.5px; }
  .opp .body .th { font-size: 12px; color: var(--text-2); }
  .promote {
    flex: 0 0 auto; font-size: 12px; font-weight: 500; color: var(--accent);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    transition: all .14s var(--ease);
  }
  .promote:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .killed-tag { font-size: 11px; color: var(--red); font-weight: 500; }

  .moves { display: flex; flex-direction: column; gap: 8px; }
  .move {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 13px;
  }
  .move .num {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
  }

  /* global chat bar (overview) */
  .gchat {
    margin-top: 26px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .gchat .lbl { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .gchat-row { display: flex; gap: 10px; }
  .gchat-row input {
    flex: 1; border: 1px solid var(--border); border-radius: 9px; padding: 10px 13px;
    font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg);
    transition: border-color .14s var(--ease);
  }
  .gchat-row input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .gchat-row button {
    background: var(--accent); color: #fff; border-radius: 9px; padding: 0 18px;
    font-weight: 500; font-size: 13px; transition: filter .14s var(--ease);
  }
  .gchat-row button:hover { filter: brightness(1.08); }

  /* ---------- COMPANY ZOOM ---------- */
  .zoom-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .back {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px;
    transition: all .14s var(--ease);
  }
  .back:hover { border-color: var(--border-strong); color: var(--text); }
  .back kbd { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-3); }
  .zoom-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .zoom-head .domain {
    font-size: 12.5px; color: var(--accent); background: var(--accent-soft);
    padding: 3px 9px; border-radius: 7px; font-weight: 500;
  }
  .zoom-meta { display: flex; gap: 18px; margin: 14px 0 22px; padding-left: 2px; color: var(--text-2); font-size: 13px; }
  .zoom-meta b { color: var(--text); font-weight: 600; }

  .zoom-cols { display: grid; grid-template-columns: 1fr 1.05fr; gap: 24px; align-items: start; }
  @media (max-width: 1100px) { .zoom-cols { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 13px 16px;
    border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600;
  }
  .panel-head .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-weight: 450; }

  /* backlog */
  .slice { display: flex; align-items: center; gap: 11px; padding: 11px 16px; border-bottom: 1px solid var(--border); transition: background .12s; }
  .slice:last-child { border-bottom: none; }
  .slice:hover { background: var(--surface-2); }
  .slice .sn { font-size: 11px; color: var(--text-3); width: 18px; flex-shrink: 0; }
  .slice .st { flex: 1; font-size: 13px; }
  .badge {
    flex: 0 0 auto; font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    text-transform: capitalize; letter-spacing: .02em; display: flex; align-items: center; gap: 5px;
  }
  .badge.shipped { background: var(--green-soft); color: var(--green); }
  .badge.todo { background: var(--surface-2); color: var(--text-2); }
  .badge.building { background: var(--blue-soft); color: var(--blue); }
  .badge.awaiting_approval { background: var(--violet-soft); color: var(--violet); }
  .badge.blocked { background: var(--red-soft); color: var(--red); }
  .badge .bdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.building .bdot { animation: pulse 1.3s infinite; }
  .slice .prio { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .slice .note { font-size: 11px; color: var(--red); flex-shrink: 0; }

  /* approval gate */
  .gate { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet-soft); }
  .gate .panel-head { background: var(--violet-soft); color: var(--violet); border-bottom-color: #e4d9fb; }
  .gate-body { padding: 16px; }
  .gate-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .gate-sub { font-size: 12px; color: var(--text-2); margin-bottom: 14px; }
  .gate-row {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px;
  }
  .gate-row .lab { color: var(--text-2); font-weight: 500; flex-shrink:0; }
  .gate-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .gate-row a:hover { text-decoration: underline; }
  .gate-row.pass { background: var(--green-soft); border-color: #bce6c9; }
  .gate-row.pass .lab, .gate-row.pass .val { color: var(--green); }
  .gate-row .chk { margin-left: auto; font-weight: 600; }
  .gate-row .val { color: var(--text); }
  .gate-row .val.mono { font-size: 11.5px; }

  .diff {
    background: #1c1c20; border-radius: 10px; padding: 12px 14px; margin: 12px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.65;
    overflow-x: auto; color: #c9c9d4;
  }
  .diff .add { color: #6ee7a8; }
  .diff .ctx { color: #74747f; }
  .diff::-webkit-scrollbar { height: 7px; }
  .diff::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 4px; }

  .gate-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-approve {
    flex: 1; background: var(--green); color: #fff; font-weight: 600; font-size: 13.5px;
    border-radius: 9px; padding: 11px; transition: all .14s var(--ease);
  }
  .btn-approve:hover { filter: brightness(1.06); }
  .btn-reject {
    flex: 1; background: var(--surface); color: var(--text); font-weight: 500; font-size: 13.5px;
    border: 1px solid var(--border-strong); border-radius: 9px; padding: 11px; transition: all .14s var(--ease);
  }
  .btn-reject:hover { border-color: var(--red); color: var(--red); }
  .reject-box { margin-top: 10px; display: none; }
  .reject-box.show { display: block; animation: swapIn .2s var(--ease); }
  .reject-box textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
    font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; color: var(--text);
  }
  .reject-box textarea:focus { outline: none; border-color: var(--accent); }
  .reject-box .send {
    margin-top: 8px; background: var(--text); color: #fff; font-size: 12.5px; font-weight: 500;
    border-radius: 8px; padding: 8px 14px;
  }
  .flash {
    margin-top: 12px; padding: 11px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
    display: none; align-items: center; gap: 8px;
  }
  .flash.show { display: flex; animation: swapIn .22s var(--ease); }
  .flash.ok { background: var(--green-soft); color: var(--green); }
  .flash.rej { background: var(--amber-soft); color: var(--amber); }

  /* company chat */
  .chat-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; max-height: 360px; overflow-y: auto; }
  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .av {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.assistant .av { background: var(--accent-soft); color: var(--accent); }
  .msg.user .av { background: var(--surface-2); color: var(--text-2); }
  .msg .bub { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
  .msg.assistant .bub { background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg.user .bub { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .chat-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .chat-input input {
    flex: 1; border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px;
    font-family: inherit; font-size: 13px; color: var(--text); background: var(--bg);
  }
  .chat-input input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .chat-input button { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 16px; font-weight: 500; font-size: 13px; }

  /* ---------- LIVE ACTIVITY ---------- */
  .activity {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    width: 340px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden;
    transition: width .2s var(--ease);
  }
  .act-head {
    display: flex; align-items: center; gap: 9px; padding: 11px 14px; cursor: pointer;
    user-select: none;
  }
  .act-head:hover { background: var(--surface-2); }
  .act-head .live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  .act-head .ttl { font-size: 12px; font-weight: 600; }
  .act-head .latest { font-size: 12px; color: var(--text-2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-head .chev { color: var(--text-3); font-size: 12px; transition: transform .2s var(--ease); }
  .activity.open .act-head .chev { transform: rotate(180deg); }
  .activity.open .act-head .latest { display: none; }
  .act-stream { max-height: 0; overflow: hidden; transition: max-height .26s var(--ease); }
  .activity.open .act-stream { max-height: 340px; overflow-y: auto; border-top: 1px solid var(--border); }
  .act-group { padding: 10px 14px 4px; }
  .act-group .gname { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-bottom: 6px; }
  .act-item { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 12px; }
  .act-item .idot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; }
  .act-item.running .idot { animation: pulse 1.3s infinite; }
  .idot.building { background: var(--blue); }
  .idot.deploy { background: var(--blue); }
  .idot.await { background: var(--violet); }
  .idot.check { background: var(--green); }
  .idot.reprioritize { background: var(--accent); }
  .idot.blocked { background: var(--red); }
  .act-item .itxt { flex: 1; color: var(--text); line-height: 1.4; }
  .act-item .it { color: var(--text-3); flex-shrink: 0; font-size: 11px; }

  /* ---------- COMMAND PALETTE ---------- */
  .palette-bg {
    position: fixed; inset: 0; background: rgba(20,20,24,.28); backdrop-filter: blur(3px);
    z-index: 100; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh;
  }
  .palette-bg.show { display: flex; animation: fadeIn .15s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .palette {
    width: 560px; max-width: 92vw; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden;
    animation: popIn .18s var(--ease);
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
  .palette input {
    width: 100%; border: none; padding: 16px 18px; font-family: inherit; font-size: 15px;
    color: var(--text); border-bottom: 1px solid var(--border); background: transparent;
  }
  .palette input:focus { outline: none; }
  .palette .results { max-height: 320px; overflow-y: auto; padding: 6px; }
  .palette .pitem {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px;
    font-size: 13.5px; cursor: pointer;
  }
  .palette .pitem.sel, .palette .pitem:hover { background: var(--accent-soft); }
  .palette .pitem .pic { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .palette .pitem .ptype { margin-left: auto; font-size: 11px; color: var(--text-3); }

  /* badge */
  .corner {
    position: fixed; left: 18px; bottom: 18px; z-index: 60;
    background: var(--text); color: #fff; font-size: 11.5px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px; letter-spacing: .02em;
    box-shadow: var(--shadow-md);
  }
  .corner .accent { color: #a5a5fa; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      C Slop Slop
      <span class="sub">- from thought to bag</span>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="seg">
      <button data-view="overview" class="on">Portfolio</button>
      <button data-view="stage">Stage</button>
    </div>
    <div class="cmd" id="cmdOpen">
      <span>Search or run a command…</span>
      <kbd>⌘K</kbd>
    </div>
  </div>

  <!-- COMPANY STRIP -->
  <div class="strip-wrap">
    <div class="strip-head">
      <span>Companies</span>

    <div class="strip" id="strip"></div>

  <!-- STAGE -->
  <div class="stage">
    <div class="view stage-swap" id="stageView"></div>
  </div>
</div>

<!-- LIVE ACTIVITY -->
<div class="activity" id="activity">
  <div class="act-head" id="actHead">
    <span class="live"></span>
    <span class="ttl">Activity</span>
    <span class="latest" id="actLatest"></span>
    <span class="chev">▾</span>
  </div>
  <div class="act-stream" id="actStream"></div>
</div>

<!-- COMMAND PALETTE -->
<div class="palette-bg" id="paletteBg">
  <div class="palette">
    <input type="text" id="paletteInput" placeholder="Jump to a company, opportunity, or action…" autocomplete="off" />
    <div class="results" id="paletteResults"></div>
  </div>
</div>

<!-- CORNER BADGE -->
<div class="corner"><span class="accent">29</span> · Stage</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

// ---------- STATE ----------
let view = 'overview';      // 'overview' | 'stage'
let selected = 'leadsift';  // selected company id

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scoreClass = (s) => s >= 75 ? 'hi' : s >= 55 ? 'mid' : 'lo';

// ---------- COMPANY STRIP ----------
function renderStrip() {
  const strip = $('#strip');
  strip.innerHTML = DATA.companies.map(c => {
    const building = c.currentSlice && (c.currentSlice.status === 'building');
    const foot = c.needsYou
      ? `<span class="mono">$${c.mrr}</span><span>${c.users} users</span>`
      : building
        ? `<span class="build"><span class="mini"></span>building s${c.currentSlice.n}</span>`
        : c.status === 'paused'
          ? `<span style="color:var(--amber)">paused</span>`
          : `<span class="mono">$${c.mrr}</span><span>${c.users} users</span>`;
    return `<button class="chip ${selected===c.id&&view==='stage'?'sel':''} ${c.needsYou?'needs':''}" data-co="${c.id}">
      <div class="chip-top">
        <span class="status-dot ${c.status}"></span>
        <span class="chip-name">${esc(c.name)}</span>
        ${c.needsYou ? '<span class="needs-tag">needs you</span>' : ''}
      </div>
      <div class="chip-thesis">${esc(c.thesis)}</div>
      <div class="chip-foot">${foot}</div>
    </button>`;
  }).join('') + `<button class="chip-add" id="chipAdd" title="Promote an opportunity">+</button>`;

  $$('.chip', strip).forEach(b => b.onclick = () => selectCompany(b.dataset.co));
  $('#chipAdd').onclick = () => { setView('overview'); setTimeout(()=>{ const o=$('#oppSec'); if(o) o.scrollIntoView({behavior:'smooth'}); }, 60); };
}

function selectCompany(id) {
  selected = id;
  setView('stage');
}

function setView(v) {
  view = v;
  $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  renderStrip();
  renderStage();
}

// ---------- STAGE RENDER ----------
function renderStage() {
  const el = $('#stageView');
  el.innerHTML = view === 'overview' ? overviewHTML() : zoomHTML(DATA.companies.find(c=>c.id===selected));
  el.classList.remove('stage-swap'); void el.offsetWidth; el.classList.add('stage-swap');
  el.scrollTop = 0;
  if (view === 'overview') wireOverview(); else wireZoom();
}

// ---------- OVERVIEW ----------
function overviewHTML() {
  const p = DATA.portfolio;
  const metric = (v,k,cls='') => `<div class="metric ${cls}"><div class="v ${cls?'':''}">${v}</div><div class="k">${k}</div></div>`;
  const opps = DATA.opportunities.map(o => o.status === 'killed'
    ? `<div class="opp killed"><div class="score lo">${o.score}</div><div class="body"><div class="t">${esc(o.title)}</div><div class="th">${esc(o.thesis)}</div></div><span class="killed-tag">killed</span></div>`
    : `<div class="opp"><div class="score ${scoreClass(o.score)}">${o.score}</div><div class="body"><div class="t">${esc(o.title)}</div><div class="th">${esc(o.thesis)}</div></div><button class="promote" data-opp="${o.id}">Promote</button></div>`
  ).join('');
  const moves = DATA.nextMoves.map((m,i) => `<div class="move"><span class="num">${i+1}</span><span>${esc(m)}</span></div>`).join('');

  return `
    <div class="ov-head">
      <h1>Portfolio</h1>
      <span class="muted">${DATA.companies.length} companies · ${p.needsYou} needs you</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="v accent mono">$${p.mrr}</div><div class="k">MRR</div></div>
      <div class="metric"><div class="v mono">${p.users}</div><div class="k">Users</div></div>
      <div class="metric"><div class="v mono">${p.activeCompanies}</div><div class="k">Active companies</div></div>
      <div class="metric"><div class="v mono">${p.slicesShipped}</div><div class="k">Slices shipped</div></div>
      <div class="metric needs"><div class="v mono">${p.needsYou}</div><div class="k">Needs you</div></div>
    </div>
    <div class="grid-2">
      <div id="oppSec">
        <div class="sec-title">Opportunities</div>
        <div class="opp-list">${opps}</div>
      </div>
      <div>
        <div class="sec-title">Next moves</div>
        <div class="moves">${moves}</div>
      </div>
    </div>
    <div class="gchat">
      <div class="lbl">Command · chat</div>
      <div class="gchat-row">
        <input id="gchatInput" placeholder="Ask anything, or direct the portfolio - e.g. “approve LeadSift slice 5”" />
        <button id="gchatSend">Send</button>
      </div>
    </div>`;
}

function wireOverview() {
  $$('.promote').forEach(b => b.onclick = () => {
    const o = DATA.opportunities.find(x => x.id === b.dataset.opp);
    const orig = b.textContent;
    b.textContent = 'Promoted ✓';
    b.style.background = 'var(--green)'; b.style.color = '#fff'; b.style.borderColor = 'var(--green)';
    setTimeout(() => { b.textContent = orig; b.style.background=''; b.style.color=''; b.style.borderColor=''; }, 1600);
  });
  const send = () => {
    const inp = $('#gchatInput'); if (!inp.value.trim()) return;
    const v = inp.value.trim();
    inp.value = ''; inp.placeholder = '✓ sent - agents will pick this up'; inp.blur();
    setTimeout(() => inp.placeholder = 'Ask anything, or direct the portfolio - e.g. “approve LeadSift slice 5”', 1800);
    if (/leadsift/i.test(v)) selectCompany('leadsift');
  };
  $('#gchatSend').onclick = send;
  $('#gchatInput').onkeydown = (e) => { if (e.key === 'Enter') send(); };
}

// ---------- COMPANY ZOOM ----------
function zoomHTML(c) {
  if (!c) return '';
  // companies without a full backlog (only currentSlice): build a light view
  const hasGate = !!c.approval;
  const slices = c.slices || (c.currentSlice ? [c.currentSlice] : []);
  const backlog = slices.map(s => `
    <div class="slice">
      <span class="sn mono">${s.n}</span>
      <span class="st">${esc(s.title)}</span>
      ${s.priority ? `<span class="prio mono">P${s.priority}</span>` : ''}
      ${s.note ? `<span class="note">${esc(s.note)}</span>` : ''}
      <span class="badge ${s.status}"><span class="bdot"></span>${s.status.replace('_',' ')}</span>
    </div>`).join('');

  const chat = DATA.chat.map(m => `
    <div class="msg ${m.role}">
      <div class="av">${m.role === 'user' ? 'You' : 'cs'}</div>
      <div class="bub">${esc(m.text)}</div>
    </div>`).join('');

  const gate = hasGate ? gateHTML(c) : `
    <div class="panel">
      <div class="panel-head">Build status</div>
      <div class="gate-body">
        <div class="gate-title">${c.currentSlice ? esc('Slice '+c.currentSlice.n+' - '+c.currentSlice.title) : 'No active slice'}</div>
        <div class="gate-sub">${c.currentSlice ? esc(c.currentSlice.step) : ''}</div>
        ${c.previewUrl ? `<div class="gate-row"><span class="lab">Live</span><a href="${c.previewUrl}" target="_blank">${c.previewUrl}</a></div>` : ''}
      </div>
    </div>`;

  return `
    <div class="zoom-head">
      <button class="back" id="backBtn">← Portfolio <kbd>esc</kbd></button>
      <h1>${esc(c.name)}</h1>
      <span class="status-dot ${c.status}" style="width:9px;height:9px"></span>
      ${c.domain ? `<span class="domain">${esc(c.domain)}</span>` : `<span class="domain" style="background:var(--surface-2);color:var(--text-2)">no domain yet</span>`}
    </div>
    <div class="zoom-meta">
      <span>${esc(c.thesis)}</span>
    </div>
    <div class="zoom-meta" style="margin-top:-14px">
      <span class="mono"><b>$${c.mrr}</b> MRR</span>
      <span class="mono"><b>${c.users}</b> users</span>
      <span><b>${(c.slices ? c.slices.filter(s=>s.status==='shipped').length : c.slicesShipped)}</b> slices shipped</span>
      ${c.previewUrl ? `<span>Live · <a href="${c.previewUrl}" target="_blank" style="color:var(--accent);text-decoration:none">${c.previewUrl}</a></span>` : ''}
    </div>
    <div class="zoom-cols">
      <div style="display:flex;flex-direction:column;gap:24px">
        ${gate}
        <div class="panel">
          <div class="panel-head">Backlog <span class="count">${slices.length} slices</span></div>
          ${backlog}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">Chat <span class="count">${esc(c.name)}</span></div>
        <div class="chat-body" id="chatBody">${chat}</div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Message ${esc(c.name)}…  ⏎ to send" />
          <button id="chatSend">Send</button>
        </div>
      </div>
    </div>`;
}

function gateHTML(c) {
  const a = c.approval;
  const diff = a.diff.split('\n').map(l => {
    if (l.startsWith('+')) return `<span class="add">${esc(l)}</span>`;
    return `<span class="ctx">${esc(l)}</span>`;
  }).join('\n');
  return `
    <div class="panel gate">
      <div class="panel-head">Approval gate - slice ${a.slice} <span class="count" style="color:var(--violet)">NEEDS YOU</span></div>
      <div class="gate-body">
        <div class="gate-title">${esc(a.title)}</div>
        <div class="gate-sub">Attempt ${a.attempt} · review the change, then approve or reject with feedback.</div>

        <div class="gate-row">
          <span class="lab">Preview</span>
          <a href="${a.previewUrl}" target="_blank">${a.previewUrl}</a>
        </div>
        <div class="gate-row">
          <span class="lab">doneWhen</span>
          <span class="val mono">${esc(a.doneWhen)}</span>
        </div>
        <div class="gate-row pass">
          <span class="lab">Check</span>
          <span class="val">${a.checkResult}</span>
          <span class="chk">✓ green</span>
        </div>

        <div class="diff">${diff}</div>

        <div class="gate-actions">
          <button class="btn-approve" id="approveBtn">Approve &amp; ship</button>
          <button class="btn-reject" id="rejectBtn">Reject with feedback</button>
        </div>
        <div class="reject-box" id="rejectBox">
          <textarea id="rejectText" placeholder="What needs to change? Agents will iterate on this slice."></textarea>
          <button class="send" id="rejectSend">Send feedback</button>
        </div>
        <div class="flash ok" id="flashOk">✓ Approved - shipping slice ${a.slice} to production</div>
        <div class="flash rej" id="flashRej">↩ Feedback sent - agents will iterate on slice ${a.slice}</div>
      </div>
    </div>`;
}

function wireZoom() {
  const back = $('#backBtn'); if (back) back.onclick = () => setView('overview');

  // chat
  const send = () => {
    const inp = $('#chatInput'); if (!inp || !inp.value.trim()) return;
    const body = $('#chatBody');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="av">You</div><div class="bub">${esc(inp.value.trim())}</div>`;
    body.appendChild(div); inp.value = ''; body.scrollTop = body.scrollHeight;
    setTimeout(() => {
      const r = document.createElement('div');
      r.className = 'msg assistant';
      r.innerHTML = `<div class="av">cs</div><div class="bub">On it - I'll route this to the build loop and update the backlog.</div>`;
      body.appendChild(r); body.scrollTop = body.scrollHeight;
    }, 600);
  };
  const cs = $('#chatSend'); if (cs) cs.onclick = send;
  const ci = $('#chatInput'); if (ci) ci.onkeydown = (e) => { if (e.key === 'Enter') send(); };

  // approval gate
  const ap = $('#approveBtn');
  if (ap) {
    ap.onclick = () => {
      $('#flashRej').classList.remove('show');
      $('#rejectBox').classList.remove('show');
      const f = $('#flashOk'); f.classList.add('show');
      ap.textContent = 'Approved ✓'; ap.style.opacity = '.7'; ap.disabled = true;
    };
  }
  const rj = $('#rejectBtn');
  if (rj) {
    rj.onclick = () => {
      $('#flashOk').classList.remove('show');
      $('#rejectBox').classList.toggle('show');
      const t = $('#rejectText'); if (t) t.focus();
    };
  }
  const rs = $('#rejectSend');
  if (rs) {
    rs.onclick = () => {
      $('#rejectBox').classList.remove('show');
      $('#flashRej').classList.add('show');
    };
  }
}

// ---------- LIVE ACTIVITY ----------
function renderActivity() {
  const running = DATA.activity.find(a => a.running) || DATA.activity[0];
  $('#actLatest').textContent = `${running.co} · ${running.text}`;

  // group by company
  const groups = {};
  DATA.activity.forEach(a => { (groups[a.co] = groups[a.co] || []).push(a); });
  $('#actStream').innerHTML = Object.entries(groups).map(([co, items]) => `
    <div class="act-group">
      <div class="gname">${esc(co)}</div>
      ${items.map(a => `
        <div class="act-item ${a.running ? 'running' : ''}">
          <span class="idot ${a.kind}"></span>
          <span class="itxt">${esc(a.text)}</span>
          <span class="it mono">${esc(a.t)}</span>
        </div>`).join('')}
    </div>`).join('');
}
$('#actHead').onclick = () => $('#activity').classList.toggle('open');

// ---------- COMMAND PALETTE ----------
const palItems = () => [
  ...DATA.companies.map(c => ({ label: c.name, sub: 'Open in stage', type: 'company', color: c.status==='active'?'var(--green)':c.status==='paused'?'var(--amber)':'var(--slate)', act: () => selectCompany(c.id) })),
  ...DATA.opportunities.filter(o=>o.status!=='killed').map(o => ({ label: o.title, sub: 'Opportunity · '+o.score, type: 'opp', color: 'var(--accent)', act: () => { setView('overview'); } })),
  { label: 'Approve LeadSift slice 5', sub: 'Action', type: 'action', color: 'var(--violet)', act: () => { selectCompany('leadsift'); setTimeout(()=>{ const b=$('#approveBtn'); if(b) b.click(); }, 320); } },
  { label: 'Portfolio overview', sub: 'View', type: 'view', color: 'var(--accent)', act: () => setView('overview') },
];
let palSel = 0, palFiltered = [];
function openPalette() {
  $('#paletteBg').classList.add('show');
  $('#paletteInput').value = ''; $('#paletteInput').focus();
  renderPalette('');
}
function closePalette() { $('#paletteBg').classList.remove('show'); }
function renderPalette(q) {
  const all = palItems();
  palFiltered = all.filter(i => (i.label + ' ' + i.sub).toLowerCase().includes(q.toLowerCase()));
  palSel = 0;
  $('#paletteResults').innerHTML = palFiltered.map((i, idx) => `
    <div class="pitem ${idx===0?'sel':''}" data-idx="${idx}">
      <span class="pic" style="background:${i.color}"></span>
      <span>${esc(i.label)}</span>
      <span class="ptype">${esc(i.sub)}</span>
    </div>`).join('') || `<div style="padding:14px;color:var(--text-3);font-size:13px">No results</div>`;
  $$('#paletteResults .pitem').forEach(el => el.onclick = () => { palFiltered[+el.dataset.idx].act(); closePalette(); });
}
$('#cmdOpen').onclick = openPalette;
$('#paletteInput').oninput = (e) => renderPalette(e.target.value);
$('#paletteBg').onclick = (e) => { if (e.target.id === 'paletteBg') closePalette(); };
$('#paletteInput').onkeydown = (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palSel+1, palFiltered.length-1); updPalSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(palSel-1, 0); updPalSel(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (palFiltered[palSel]) { palFiltered[palSel].act(); closePalette(); } }
};
function updPalSel() {
  $$('#paletteResults .pitem').forEach((el,i) => el.classList.toggle('sel', i===palSel));
}

// ---------- GLOBAL KEYS ----------
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if ($('#paletteBg').classList.contains('show')) { closePalette(); return; }
    if (view === 'stage') { setView('overview'); return; }
  }
  // arrow-move through company strip (when not typing)
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (!typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && view === 'stage') {
    const ids = DATA.companies.map(c => c.id);
    let i = ids.indexOf(selected);
    i = e.key === 'ArrowRight' ? Math.min(i+1, ids.length-1) : Math.max(i-1, 0);
    selectCompany(ids[i]);
    const chip = $(`.chip[data-co="${ids[i]}"]`); if (chip) chip.scrollIntoView({behavior:'smooth', inline:'nearest', block:'nearest'});
  }
});

// ---------- SEG TOGGLE ----------
$$('#seg button').forEach(b => b.onclick = () => setView(b.dataset.view));

// ---------- INIT ----------
renderStrip();
renderStage();
renderActivity();
</script>
</body>
</html>
