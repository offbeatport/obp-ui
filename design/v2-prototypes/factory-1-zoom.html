<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop - Zoom Canvas</title>
<script>
/* pre-paint theme: no flash */
(function(){try{var t=localStorage.getItem('cslopslop-theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#f7f3ec; --cream-2:#f1ebdf; --paper:#fffdf8;
  --ink:#2c2926; --ink-soft:#6d645a; --ink-faint:#a49a8c;
  --line:#e5ddce; --line-soft:#efe9dd;
  --accent:#c8643c; --accent-soft:rgba(200,100,60,.12);
  --green:#4f8a52; --green-soft:rgba(79,138,82,.14);
  --blue:#3b6ea5;  --blue-soft:rgba(59,110,165,.13);
  --violet:#7c5cbf;--violet-soft:rgba(124,92,191,.14);
  --amber:#c2872a; --amber-soft:rgba(194,135,42,.15);
  --red:#c0503f;   --red-soft:rgba(192,80,63,.13);
  --slate:#6b7280; --slate-soft:rgba(107,114,128,.12);
  --shadow:0 1px 2px rgba(44,41,38,.05), 0 10px 34px rgba(44,41,38,.07);
  --shadow-lg:0 4px 12px rgba(44,41,38,.08), 0 24px 60px rgba(44,41,38,.12);
  --top-h:64px;
}
:root[data-theme="dark"]{
  --cream:#05060a; --cream-2:#0a0c12; --paper:#10131f;
  --ink:#e6ebf5; --ink-soft:#a8b0c0; --ink-faint:#6b7280;
  --line:#242a38; --line-soft:#1a1f2b;
  --accent:#e0794e; --accent-soft:rgba(224,121,78,.16);
  --green:#34d399; --green-soft:rgba(52,211,153,.14);
  --blue:#5b9bd5;  --blue-soft:rgba(91,155,213,.16);
  --violet:#a78bfa;--violet-soft:rgba(167,139,250,.16);
  --amber:#fbbf24; --amber-soft:rgba(251,191,36,.13);
  --red:#f0685a;   --red-soft:rgba(240,104,90,.16);
  --slate:#94a3b8; --slate-soft:rgba(148,163,184,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.5);
  --shadow-lg:0 6px 18px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 82% -8%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 600px at -6% 108%, var(--green-soft), transparent 62%),
    var(--cream);
  color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

/* ============ TOPBAR ============ */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:20px;
  padding:0 22px;height:var(--top-h);
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter:blur(14px);z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:grid;place-items:center;font-size:17px;color:#fff;
  background:linear-gradient(150deg,var(--accent),#a94e2c);
  box-shadow:var(--shadow);
}
:root[data-theme="dark"] .mark{background:linear-gradient(150deg,var(--accent),#b8562f)}
.brandname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;line-height:1.05;letter-spacing:-.01em}
.brand .eyebrow{margin-bottom:2px}

.totals{display:flex;gap:8px;margin-left:6px;flex-wrap:wrap}
.pill{
  display:flex;flex-direction:column;gap:1px;padding:5px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--paper);min-width:0;
}
.pill .k{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.pill .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink)}
.pill.pos .v{color:var(--green)}

.tb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.needs-chip{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;
  color:var(--accent);background:var(--accent-soft);border:1px solid transparent;
  transition:transform .15s ease, background .15s ease;
}
.needs-chip:hover{background:color-mix(in srgb,var(--accent) 20%,transparent);transform:translateY(-1px)}
.needs-chip:disabled{opacity:.5;cursor:default;color:var(--ink-faint);background:var(--line-soft)}
.needs-chip .nd{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
.needs-chip:disabled .nd{background:var(--ink-faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink-soft);cursor:pointer;font-size:16px;display:grid;place-items:center;
  transition:transform .15s ease, color .15s ease, border-color .15s ease;
}
.iconbtn:hover{transform:translateY(-1px);color:var(--accent);border-color:var(--accent)}

/* ============ STAGE (holds canvas + detail) ============ */
.stage{flex:1 1 auto;position:relative;overflow:hidden}
.canvas{position:absolute;inset:0;overflow-y:auto;padding:26px 26px 60px}
.canvas-head{max-width:1180px;margin:0 auto 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.canvas-head h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.02em}
.canvas-head p{color:var(--ink-soft);font-size:13.5px;margin-top:3px;max-width:52ch}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--ink-faint)}
.legend i{width:8px;height:8px;border-radius:2px}

/* ============ GRID OF SQUARES ============ */
.grid{
  max-width:1360px;margin:0 auto;
  --sq-col:330px;--sq-min:384px;--sq-pad:20px;--sq-gap:18px;
  display:grid;gap:var(--sq-gap);
  grid-template-columns:repeat(auto-fill,minmax(var(--sq-col),1fr));
}
.grid[data-size="s"]{--sq-col:250px;--sq-min:326px;--sq-pad:16px;--sq-gap:14px}
.grid[data-size="m"]{--sq-col:330px;--sq-min:384px;--sq-pad:20px;--sq-gap:18px}
.grid[data-size="l"]{max-width:1540px;--sq-col:456px;--sq-min:452px;--sq-pad:24px;--sq-gap:20px}
.square{
  position:relative;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(168deg, var(--paper) 0%, var(--co-soft) 165%);
  padding:var(--sq-pad);min-height:var(--sq-min);
  display:flex;flex-direction:column;gap:12px;color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease, border-color .2s ease;
  font-family:inherit;
}
.square:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--co) 40%,var(--line))}
.square:focus-visible{outline:2px solid var(--co);outline-offset:3px}
.square.terminal{opacity:.82}
.square.terminal:hover{opacity:1}

.sq-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--co);background:var(--co-soft);
}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--co)}
.sq-flags{display:flex;align-items:center;gap:9px}
.signal{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--ink-soft)}
.signal i{width:7px;height:7px;border-radius:50%}
.needs-dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.needs-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent);opacity:.4;animation:ring 2.4s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.5}80%{transform:scale(1.7);opacity:0}100%{opacity:0}}

.sq-body{flex:0 1 auto;display:flex;flex-direction:column;gap:6px}
.sq-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em}
.sq-desc{font-size:12.5px;line-height:1.42;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.sq-foot{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.sq-metric{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--ink)}
.sq-metric span{color:var(--ink-faint);font-weight:400}
.bar{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--co);transition:width .5s ease}
.sq-prog{font-size:10px;color:var(--ink-faint);letter-spacing:.02em}

/* ---- live activity on each square (10 lines) ---- */
.sq-activity{border-top:1px solid var(--line-soft);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.sq-act-hd{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.sq-act-hd .ld{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:livedot 2.2s infinite}
@keyframes livedot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sq-activity.frozen .ld{background:var(--ink-faint);animation:none}
.sq-act-list{display:flex;flex-direction:column;gap:4px}
.al{display:flex;gap:9px;align-items:baseline;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.32;color:var(--ink-soft)}
.al .at{flex:0 0 auto;width:32px;text-align:right;color:var(--ink-faint);font-size:9.5px}
.al .ax{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.fresh{animation:alfresh .8s ease}
.al.fresh .ax{color:var(--ink)}
@keyframes alfresh{0%{opacity:0;transform:translateY(-3px)}100%{opacity:1;transform:none}}
.grid[data-size="l"] .al{font-size:12px}
.grid[data-size="l"] .al .at{font-size:10px;width:36px}
.grid[data-size="s"] .al{font-size:10.5px;gap:7px}

/* ---- square-size segmented toggle ---- */
.sizeseg{display:inline-flex;border:1px solid var(--line);background:var(--paper);border-radius:10px;overflow:hidden;height:38px}
.sizeseg button{width:32px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;transition:color .15s ease,background .15s ease}
.sizeseg button + button{border-left:1px solid var(--line)}
.sizeseg button:hover{color:var(--ink)}
.sizeseg button.on{color:var(--accent);background:var(--accent-soft)}

/* ============ DETAIL (zoom target) ============ */
.detail{
  position:absolute;inset:0;overflow-y:auto;z-index:20;
  background:linear-gradient(178deg, var(--co-soft) 0%, transparent 220px), var(--paper);
  transform-origin:top left;will-change:transform;
  border-radius:20px;
}
.detail[hidden]{display:none}
.detail-inner{max-width:1080px;margin:0 auto;padding:22px 30px 70px}

.d-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px}
.back{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px 9px 12px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;
  transition:transform .15s ease,color .15s ease,border-color .15s ease;
}
.back:hover{transform:translateX(-2px);color:var(--accent);border-color:var(--accent)}
.d-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.d-title h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:-.02em}
.d-status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--ink-faint);padding:6px 11px;border:1px solid var(--line);border-radius:99px}

.rec{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;margin-bottom:16px;
  border:1px solid var(--co);background:var(--co-soft);font-size:13.5px;line-height:1.5;color:var(--ink);
}
.rec .rk{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--co);font-weight:600;flex:0 0 auto;padding-top:2px}
.rec b{color:var(--co);font-weight:700}

.d-desc{font-family:'Spectral',serif;font-size:18px;line-height:1.5;color:var(--ink);margin-bottom:18px;max-width:60ch}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.mcell{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--paper)}
.mcell .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.mcell .v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600}
.mcell .v small{font-size:11px;color:var(--ink-faint);font-weight:400}
.mcell .sub{font-size:10px;color:var(--ink-faint);margin-top:2px}
.mcell .v.sig{display:flex;align-items:center;gap:8px;font-size:15px}
.mcell .v.sig i{width:9px;height:9px;border-radius:50%}

.d-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:24px}
.col{display:flex;flex-direction:column;gap:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:16px 17px}
.card h4{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.card h4::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--co)}

.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.goal-txt{font-size:13.5px;line-height:1.45;color:var(--ink)}
.goal-pct{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;color:var(--co);flex:0 0 auto}
.gbar{height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-bottom:7px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--co),color-mix(in srgb,var(--co) 60%,var(--paper)));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.goal-note{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}

.nba{font-size:14px;line-height:1.5;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.nba::before{content:"→";color:var(--accent);font-weight:700;flex:0 0 auto}

/* approval */
.approval{border:1px solid var(--accent);background:var(--accent-soft)}
.approval h4{color:var(--accent)}
.approval h4::before{background:var(--accent)}
.ap-title{font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:5px;font-family:'Space Grotesk',sans-serif}
.ap-detail{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-bottom:13px}
.ap-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  padding:9px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);transition:transform .14s ease,filter .14s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn.approve{background:var(--green);border-color:var(--green);color:#fff}
.btn.kill{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.kill:hover{background:var(--red);border-color:var(--red);color:#fff}
:root[data-theme="dark"] .btn.approve{color:#05231a}
.resolved{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.resolved .rdot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff}
.resolved.ok .rdot{background:var(--green)}
.resolved.hold .rdot{background:var(--amber)}
.resolved.kill .rdot{background:var(--red)}
.resolved .rnext{margin-left:auto}
.rnext{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:none;padding:7px 12px;border-radius:8px;cursor:pointer}
.rnext:hover{filter:brightness(.96)}

.timeline{list-style:none;display:flex;flex-direction:column;gap:11px}
.timeline li{position:relative;padding-left:20px;font-size:12.5px;line-height:1.4;color:var(--ink-soft)}
.timeline li::before{content:"";position:absolute;left:3px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--co);box-shadow:0 0 0 3px var(--co-soft)}
.timeline li::after{content:"";position:absolute;left:6px;top:12px;bottom:-11px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}

.risks{list-style:none;display:flex;flex-direction:column;gap:8px}
.risks li{display:flex;gap:9px;font-size:12.5px;line-height:1.42;color:var(--ink-soft)}
.risks li::before{content:"!";flex:0 0 auto;width:17px;height:17px;border-radius:5px;background:var(--amber-soft);color:var(--amber);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;display:grid;place-items:center;margin-top:1px}

/* docs */
.docs{border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}
.doctabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--cream-2);flex-wrap:wrap}
.doctab{
  padding:8px 15px;border-radius:9px;cursor:pointer;border:none;background:transparent;color:var(--ink-soft);
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;transition:color .15s ease,background .15s ease;
}
.doctab:hover{color:var(--ink)}
.doctab.on{background:var(--paper);color:var(--accent);box-shadow:var(--shadow)}
.docpanel{padding:20px 22px;font-family:'Spectral',serif;font-size:15px;line-height:1.62;color:var(--ink)}
.docpanel b{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:12px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ RESPONSIVE ============ */
@media(max-width:820px){
  .totals{display:none}
  .d-grid{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .detail-inner{padding:18px 18px 60px}
  .canvas{padding:20px 16px 50px}
}
@media(max-width:520px){
  .topbar{gap:10px;padding:0 14px}
  .brand .eyebrow{display:none}
  .grid{grid-template-columns:1fr}
  .d-title h2{font-size:22px}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  .square,.detail,.detail-inner,.gbar i,.bar i,.back,.needs-chip,.iconbtn,.btn{transition:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">◧</div>
    <div>
      <div class="eyebrow">AI Startup Factory</div>
      <div class="brandname">C Slop Slop</div>
    </div>
  </div>
  <div class="totals" id="totals"></div>
  <div class="tb-actions">
    <button class="needs-chip" id="needsChip"><span class="nd"></span><span id="needsCount">3</span> need you</button>

const ACTIVITY = {

const LIVE = {};
function initLive(){
  COMPANIES.forEach(c=>{
    let pool = (ACTIVITY[c.id]||['working']).slice();
    while(pool.length < 10) pool = pool.concat(pool);
    LIVE[c.id] = { lines: pool.slice(0,10), ptr: 10 };
  });
}
function relTimes(n){
  const out=[]; let m=0;
  for(let i=0;i<n;i++){ out.push(i===0?'now':(m+'m')); m += 2 + ((i*7)%5); }
  return out;
}
function activityListHTML(id){
  const lines = LIVE[id].lines, times = relTimes(lines.length);
  return lines.map((t,i)=>`<div class="al"><span class="at">${times[i]}</span><span class="ax">${t}</span></div>`).join('');
}
function activityBlockHTML(c){
  const terminal = (state[c.id].stage==='ejected'||state[c.id].stage==='killed');
  return `<div class="sq-activity${terminal?' frozen':''}">
      <div class="sq-act-hd"><span class="ld"></span>${terminal?'Activity log':'Live activity'}</div>
      <div class="sq-act-list" data-act="${c.id}">${activityListHTML(c.id)}</div>
    </div>`;
}
/* live ticker: every few seconds an active bet logs a fresh line */
let tickT;
function tick(){
  const active = COMPANIES.filter(c=>{ const s=state[c.id].stage; return s!=='ejected' && s!=='killed'; });
  if(!active.length) return;
  const c = active[Math.floor(Math.random()*active.length)];
  const pool = ACTIVITY[c.id]||[]; if(!pool.length) return;
  const lv = LIVE[c.id];
  lv.lines.unshift(pool[lv.ptr % pool.length]); lv.ptr++;
  if(lv.lines.length>10) lv.lines.pop();
  const el = grid.querySelector(`.sq-act-list[data-act="${c.id}"]`);
  if(el){ el.innerHTML = activityListHTML(c.id); const f = el.querySelector('.al'); if(f) f.classList.add('fresh'); }
}
function startTicker(){ if(reduce()) return; clearInterval(tickT); tickT = setInterval(tick, 3600); }

function updateNeeds(){

    needsChip.disabled = false;
    needsChip.innerHTML = `<span class="nd"></span><span>${n}</span> need you`;
  }

    return `<div class="mcell"><div class="k">${m.k}</div><div class="v">${m.v}</div>${m.sub?`<div class="sub">${m.sub}</div>`:''}</div>`;

function approvalCard(c){
  const st = state[c.id];

      approved:{cls:'ok', icon:'✓', txt:'Approved - the AI is proceeding now. Reversible from the activity log.'},

      killed:{cls:'kill', icon:'✕', txt:'Killed - the bet is stopped and a post-mortem will be written.'}

    const r = map[st.resolvedAs];
    const more = firstNeeds();
    return `<div class="card approval"><h4>Decision</h4>
      <div class="resolved ${r.cls}"><span class="rdot">${r.icon}</span><span>${r.txt}</span>
      ${more?`<button class="rnext" data-next="${more}">Next decision →</button>`:''}</div></div>`;

  return `<div class="card approval"><h4>Approval needed</h4>

    b.addEventListener('click', ()=> resolve(id, b.dataset.act));

/* ---------- resolve a decision ---------- */
function resolve(id, act){
  const st = state[id];
  st.resolved = true; st.resolvedAs = act; st.needsYou = false;
  if(act==='approved') st.status = 'Shipping';
  else if(act==='held') st.status = 'On hold';
  else if(act==='killed'){ st.status = 'Stopped'; st.stage = 'killed'; }
  renderDetail(id);
  renderGrid();
  updateNeeds();
  const remain = QUEUE.filter(x=>state[x].needsYou && !state[x].resolved).length;
  const msg = act==='approved' ? 'Approved. ' : act==='held' ? 'Held. ' : 'Killed. ';
  showToast(msg + (remain>0 ? `${remain} decision${remain>1?'s':''} still need you.` : 'Nothing else needs you.'));
}

function goNext(id){
  closeCompany(()=> openCompany(id, true));
}

/* ---------- toast ---------- */
let toastT;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=> toastEl.classList.remove('show'), 2600);
}

/* ---------- ZOOM open/close (FLIP shared-element) ---------- */
function openCompany(id, focusApproval){
  if(animating) return;
  current = id;
  renderDetail(id);
  detailInner.scrollTop = 0;
  detail.scrollTop = 0;

  const card = grid.querySelector(`.square[data-id="${id}"]`);
  detail.hidden = false;
  detail.style.transform = 'none';

  const first = card.getBoundingClientRect();
  const last = detail.getBoundingClientRect();

  const finish = ()=>{
    detail.style.transition = '';
    detail.style.transform = 'none';
    detailInner.style.transition = '';
    detailInner.style.opacity = '1';
    detailInner.style.transform = 'none';
    animating = false;
    const bb = detailInner.querySelector('#backBtn'); if(bb) bb.focus({preventScroll:true});
    if(focusApproval){
      const ap = detailInner.querySelector('.approval');
      if(ap) ap.scrollIntoView({behavior: reduce()?'auto':'smooth', block:'center'});
    }
  };

  if(reduce()){ finish(); return; }

  animating = true;
  const dx = first.left - last.left;
  const dy = first.top - last.top;
  const sx = first.width / last.width;
  const sy = first.height / last.height;

  detail.style.transformOrigin = 'top left';
  detail.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
  detailInner.style.opacity = '0';
  detailInner.style.transform = 'translateY(10px)';
  detail.getBoundingClientRect(); /* reflow */

  detail.style.transition = 'transform .5s cubic-bezier(.22,.68,.24,1)';
  detail.style.transform = 'none';
  requestAnimationFrame(()=>{
    detailInner.style.transition = 'opacity .34s ease .14s, transform .42s cubic-bezier(.22,.68,.24,1) .14s';
    detailInner.style.opacity = '1';
    detailInner.style.transform = 'none';
  });

  let done=false;
  const end = (e)=>{ if(e && e.target!==detail) return; if(done) return; done=true; detail.removeEventListener('transitionend', end); finish(); };
  detail.addEventListener('transitionend', end);
  setTimeout(end, 650);
}

function closeCompany(cb){
  if(!current || animating){ return; }
  const id = current;
  const card = grid.querySelector(`.square[data-id="${id}"]`);

  const hide = ()=>{
    detail.hidden = true;
    detail.style.transition = '';
    detail.style.transform = 'none';
    detailInner.style.opacity = '1';
    detailInner.style.transform = 'none';
    animating = false;
    if(card) card.focus({preventScroll:true});
    current = null;
    if(typeof cb === 'function') cb();
  };

  if(reduce() || !card){ hide(); return; }

  animating = true;
  const first = detail.getBoundingClientRect();
  const last = card.getBoundingClientRect();
  const dx = last.left - first.left;
  const dy = last.top - first.top;
  const sx = last.width / first.width;
  const sy = last.height / first.height;

  detailInner.style.transition = 'opacity .22s ease, transform .3s ease';
  detailInner.style.opacity = '0';
  detailInner.style.transform = 'translateY(6px)';

  detail.style.transformOrigin = 'top left';
  detail.style.transition = 'transform .42s cubic-bezier(.5,.05,.35,1)';
  detail.getBoundingClientRect();
  detail.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;

  let done=false;
  const end = (e)=>{ if(e && e.target!==detail) return; if(done) return; done=true; detail.removeEventListener('transitionend', end); hide(); };
  detail.addEventListener('transitionend', end);
  setTimeout(end, 560);
}

/* ---------- theme toggle ---------- */
const themeBtn = document.getElementById('themeBtn');
function syncIcon(){ themeBtn.textContent = document.documentElement.getAttribute('data-theme')==='dark' ? '☀' : '☾'; }
syncIcon();
themeBtn.addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('cslopslop-theme', next); }catch(e){}
  syncIcon();
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && current){ closeCompany(); }
});

/* ---------- init ---------- */
initLive();
renderGrid();
setSize(savedSize);
updateNeeds();
startTicker();
</script>
