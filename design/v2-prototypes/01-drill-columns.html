<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · 01 Drill Columns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9;
    --col:#ffffff;
    --ink:#1c2128;
    --ink-2:#5b6470;
    --ink-3:#8a93a0;
    --line:#e7e9ee;
    --line-strong:#dcdfe6;
    --sel:#f1f2f6;
    --accent:#6d4ef0;        /* violet - "needs you" */
    --accent-soft:#efebfe;
    --green:#1fa971;
    --green-soft:#e7f6ee;
    --blue:#2f6fed;
    --amber:#d98a16;
    --slate:#9aa3b0;
    --red:#e0533d;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,24,31,.04), 0 6px 22px rgba(20,24,31,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:13.5px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit}

  /* ---------- top bar / breadcrumb ---------- */
  .topbar{
    height:52px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 20px;
    background:rgba(255,255,255,.86);
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px;font-size:14.5px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .brand small{font-weight:500;color:var(--ink-3);letter-spacing:0;font-size:11.5px}

  .crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
  .crumb{
    font-size:12.5px;color:var(--ink-2);white-space:nowrap;
    padding:4px 9px;border-radius:7px;cursor:pointer;font-weight:500;
    transition:background .12s,color .12s;
  }
  .crumb:hover{background:var(--sel)}
  .crumb.active{color:var(--ink);font-weight:600}
  .crumb-sep{color:var(--line-strong);font-size:12px;user-select:none}

  .topbar .pill{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
    background:var(--col);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:500;
  }
  .topbar .pill b{color:var(--ink);font-weight:650}
  .needs-pill{color:var(--accent);background:var(--accent-soft);border-color:transparent}

  /* ---------- columns strip ---------- */
  .strip{
    position:absolute;inset:52px 0 0 0;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    padding-bottom:var(--act-h,46px);
    transition:padding-bottom .25s ease;
  }
  .strip::-webkit-scrollbar{height:10px}
  .strip::-webkit-scrollbar-thumb{background:#d3d7df;border-radius:8px;border:3px solid var(--bg)}

  .col{
    flex:0 0 auto;
    width:340px;
    height:100%;
    background:var(--col);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    animation:slideIn .28s cubic-bezier(.2,.7,.25,1);
  }
  .col.wide{width:430px}
  @keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

  .col-head{
    padding:15px 18px 11px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--col);z-index:2;
  }
  .col-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:650}
  .col-title{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:3px;display:flex;align-items:center;gap:8px}
  .col-sub{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4}
  .col-body{flex:1;overflow-y:auto;padding:8px 10px 28px}
  .col-body::-webkit-scrollbar{width:9px}
  .col-body::-webkit-scrollbar-thumb{background:#e0e3ea;border-radius:8px;border:2.5px solid var(--col)}

  /* ---------- generic row card ---------- */
  .row{
    position:relative;
    padding:11px 13px 11px 15px;
    border-radius:9px;
    cursor:pointer;
    transition:background .12s;
    margin:2px 2px;
  }
  .row:hover{background:var(--sel)}
  .row.sel{background:var(--sel)}
  .row.sel::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);
  }
  .row-top{display:flex;align-items:center;gap:9px}
  .row-name{font-weight:600;font-size:13.5px;letter-spacing:-.1px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-meta{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:11.5px;color:var(--ink-2)}
  .row-meta .mrr{font-weight:600;color:var(--ink)}
  .chev{color:var(--ink-3);font-size:14px;margin-left:auto;flex:0 0 auto}

  /* status dots */
  .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .sdot.active,.sdot.shipped{background:var(--green)}
  .sdot.paused,.sdot.awaiting_approval{background:var(--amber)}
  .sdot.archived,.sdot.todo{background:var(--slate)}
  .sdot.building{background:var(--blue)}
  .sdot.blocked{background:var(--red)}
  .sdot.pulse{box-shadow:0 0 0 0 rgba(47,111,237,.5);animation:pulse 1.6s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,111,237,.45)}
    70%{box-shadow:0 0 0 7px rgba(47,111,237,0)}
    100%{box-shadow:0 0 0 0 rgba(47,111,237,0)}
  }

  .flag{
    margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.3px;
    color:var(--accent);background:var(--accent-soft);padding:2.5px 7px;border-radius:6px;text-transform:uppercase;
  }
  .badge{
    font-size:10px;font-weight:650;letter-spacing:.3px;padding:2px 7px;border-radius:6px;text-transform:uppercase;
  }
  .badge.shipped{color:var(--green);background:var(--green-soft)}
  .badge.building{color:var(--blue);background:#e8f0ff}
  .badge.awaiting_approval{color:var(--accent);background:var(--accent-soft)}
  .badge.todo{color:var(--ink-2);background:#eef0f4}
  .badge.blocked{color:var(--red);background:#fcebe7}

  .score{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;
    padding:2px 7px;border-radius:6px;background:#eef0f4;color:var(--ink-2);
  }
  .score.hi{background:var(--green-soft);color:var(--green)}
  .score.killed{background:#f0f1f4;color:var(--ink-3);text-decoration:line-through}

  /* section divider inside a column */
  .group-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:650;
    padding:14px 13px 5px;
  }

  /* ---------- portfolio mini metrics (overview col header extra) ---------- */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;}
  .metric{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600}
  .metric .v{font-size:18px;font-weight:700;letter-spacing:-.4px;margin-top:1px;font-variant-numeric:tabular-nums}
  .metric.needs .v{color:var(--accent)}

  /* command / chat bar */
  .cmdbar{
    padding:9px 10px;border-top:1px solid var(--line);background:var(--col);
  }
  .cmdbar .field{
    display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;
  }
  .cmdbar .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .cmdbar input{border:0;background:transparent;outline:none;flex:1;font-size:13px;color:var(--ink)}
  .cmdbar .send{
    border:0;background:var(--accent);color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;
    font-size:14px;display:grid;place-items:center;transition:filter .12s;
  }
  .cmdbar .send:hover{filter:brightness(1.08)}
  .cmdbar .hint{font-size:11px;color:var(--ink-3);padding:6px 4px 0}

  /* chat thread (company col) */
  .chat{display:flex;flex-direction:column;gap:8px;padding:6px 4px}
  .msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
  .msg.assistant{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

  /* ---------- approval gate (slice detail col) ---------- */
  .gate{padding:4px 4px 20px;display:flex;flex-direction:column;gap:14px}
  .gate-card{background:var(--col);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .gate-card .ch{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:650;font-size:12px}
  .gate-card .ch .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3)}
  .preview-url{
    display:flex;align-items:center;gap:8px;margin:10px 14px;padding:9px 11px;
    background:var(--bg);border:1px solid var(--line);border-radius:9px;font-size:12px;
  }
  .preview-url a{color:var(--blue);font-weight:600;text-decoration:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .preview-url a:hover{text-decoration:underline}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(31,169,113,.5);animation:pulseG 2s infinite}
  @keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(31,169,113,.5)}70%{box-shadow:0 0 0 6px rgba(31,169,113,0)}100%{box-shadow:0 0 0 0 rgba(31,169,113,0)}}

  .donewhen{
    margin:0 14px 12px;padding:10px 12px;background:var(--green-soft);border:1px solid #cdeede;border-radius:9px;
    display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#15724f;
  }
  .donewhen .ok{color:var(--green);font-weight:800;font-size:14px;line-height:1.2}
  .donewhen code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#0f5538}

  .diff{
    margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.65;
    background:#fbfcfd;border-top:1px solid var(--line);max-height:230px;overflow:auto;
  }
  .diff .ln{padding:0 14px;white-space:pre;display:block}
  .diff .add{background:var(--green-soft);color:#10643f}
  .diff .ctx{color:var(--ink-2)}

  .gate-actions{display:flex;gap:9px;padding:2px 14px 14px}
  .btn{
    flex:1;border:0;border-radius:9px;padding:11px 14px;font-size:13px;font-weight:650;cursor:pointer;transition:filter .12s,transform .05s;
  }
  .btn:active{transform:translateY(1px)}
  .btn.approve{background:var(--green);color:#fff}
  .btn.approve:hover{filter:brightness(1.06)}
  .btn.reject{background:var(--col);color:var(--ink);border:1px solid var(--line-strong)}
  .btn.reject:hover{background:var(--sel)}
  .toast{
    margin:0 14px;padding:10px 12px;border-radius:9px;font-size:12.5px;font-weight:600;text-align:center;
    display:none;animation:pop .3s ease;
  }
  .toast.ok{background:var(--green-soft);color:#15724f;display:block}
  .toast.rej{background:#fdeee9;color:#b23c25;display:block}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .reject-fb{display:none;padding:0 14px 14px;gap:8px;flex-direction:column}
  .reject-fb.show{display:flex}
  .reject-fb textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:60px;outline:none;
  }
  .reject-fb textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .kv{display:flex;justify-content:space-between;padding:8px 14px;font-size:12px;border-top:1px solid var(--line)}
  .kv .k{color:var(--ink-2)}
  .kv .v{font-weight:600}

  /* slice detail (non-gate) */
  .detail-block{padding:14px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

  /* opportunities promote */
  .opp .thought{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-top:4px;line-height:1.4}
  .opp .thesis{font-size:12px;color:var(--ink-2);margin-top:4px}
  .promote{
    margin-top:9px;border:1px solid var(--accent);color:var(--accent);background:#fff;
    border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:650;cursor:pointer;transition:background .12s,color .12s;
  }
  .promote:hover{background:var(--accent);color:#fff}
  .promote.done{background:var(--green);border-color:var(--green);color:#fff}

  /* next moves */
  .move{display:flex;gap:9px;align-items:flex-start;padding:9px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .move .n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}

  /* ---------- live activity strip ---------- */
  .activity{
    position:absolute;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px) saturate(1.4);
    border-top:1px solid var(--line-strong);
    box-shadow:0 -6px 22px rgba(20,24,31,.05);
    transition:height .25s cubic-bezier(.2,.7,.25,1);
    height:46px;overflow:hidden;
  }
  .activity.open{height:300px}
  .act-bar{height:46px;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;user-select:none}
  .act-bar .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:650;flex:0 0 auto}
  .act-latest{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink);overflow:hidden}
  .act-latest .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-latest .co{font-weight:650}
  .act-latest .t{color:var(--ink-3);font-size:11px;flex:0 0 auto}
  .act-toggle{flex:0 0 auto;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:550}
  .act-toggle .car{transition:transform .25s;font-size:13px}
  .activity.open .act-toggle .car{transform:rotate(180deg)}

  .act-stream{overflow-y:auto;height:254px;padding:4px 18px 18px}
  .act-grp{margin-top:12px}
  .act-grp .gh{font-size:11px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink)}
  .act-grp .gh .sdot{width:7px;height:7px}
  .act-item{display:flex;align-items:center;gap:10px;padding:5px 0 5px 16px;font-size:12px;color:var(--ink-2);border-left:1px solid var(--line);margin-left:3px}
  .act-item .t{margin-left:auto;font-size:11px;color:var(--ink-3);flex:0 0 auto}
  .act-item .rdot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto}
  .act-item .rdot.run{animation:pulse 1.6s infinite}

  /* corner badge */
  .badge-corner{
    position:fixed;right:14px;bottom:60px;z-index:60;
    background:var(--ink);color:#fff;font-size:11px;font-weight:600;letter-spacing:.2px;
    padding:6px 11px;border-radius:8px;box-shadow:var(--shadow);opacity:.92;
  }
  .activity.open ~ .badge-corner{bottom:314px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>C Slop Slop <small>from thought to bag</small></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="pill"><span class="sdot active"></span>MRR <b id="kpiMrr">$695</b></div>
  <div class="pill">Shipped <b>22</b></div>
  <div class="pill needs-pill">1 needs you</div>
</div>

<div class="strip" id="strip"></div>

<!-- live activity strip -->
<div class="activity" id="activity">
  <div class="act-bar" id="actBar">
    <span class="eyebrow">Live activity</span>
    <div class="act-latest" id="actLatest"></div>
    <div class="act-toggle"><span id="actCount"></span><span class="car">▴</span></div>
  </div>
  <div class="act-stream" id="actStream"></div>
</div>

<div class="badge-corner">01 · Drill Columns</div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

const $ = s => document.querySelector(s);
const el = (t, cls, html) => { const e=document.createElement(t); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
const esc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// drill path: array of {kind, id/n, label}
let path = [{kind:'overview', label:'Companies'}];

const strip = $('#strip');

/* ---------------- column builders ---------------- */
function buildOverviewCol(){
  const col = el('div','col');
  const head = el('div','col-head');
  head.appendChild(el('div','col-eyebrow','Portfolio'));
  head.appendChild(el('div','col-title','Companies'));
  head.appendChild(el('div','col-sub','5 active bets · pull the top slice across all of them'));
  col.appendChild(head);

  const body = el('div','col-body');

  // metrics
  const m = el('div','metrics');
  const mm = [
    {k:'MRR', v:'$'+DATA.portfolio.mrr},
    {k:'Users', v:DATA.portfolio.users},
    {k:'Slices shipped', v:DATA.portfolio.slicesShipped},
    {k:'Needs you', v:DATA.portfolio.needsYou, needs:true},
  ];
  mm.forEach(x=>{
    const c = el('div','metric'+(x.needs?' needs':''));
    c.appendChild(el('div','k',x.k));
    c.appendChild(el('div','v',x.v));
    m.appendChild(c);
  });
  body.appendChild(m);

  // companies
  body.appendChild(el('div','group-label','Companies'));
  DATA.companies.forEach(co=>{
    const r = el('div','row');
    r.dataset.coid = co.id;
    const sub = co.needsYou ? '<span class="flag">Needs you</span>'
      : (co.currentSlice ? '<span class="badge '+co.currentSlice.status+'">'+labelStatus(co.currentSlice.status)+'</span>' : '');
    r.innerHTML = `
      <div class="row-top">
        <span class="sdot ${co.status}"></span>
        <span class="row-name">${esc(co.name)}</span>
        ${sub}
      </div>
      <div class="row-meta">
        <span class="mrr">$${co.mrr}/mo</span>
        <span>${co.users} users</span>
        <span>${esc(co.domain||'no domain yet')}</span>
        <span class="chev">›</span>
      </div>`;
    r.onclick = ()=>drillCompany(co.id);
    body.appendChild(r);
  });

  // opportunities
  body.appendChild(el('div','group-label','Opportunities · promote a thought to a company'));
  DATA.opportunities.forEach(o=>{
    const killed = o.status==='killed';
    const r = el('div','row opp');
    const sc = o.score>=70?'hi':(killed?'killed':'');
    r.innerHTML = `
      <div class="row-top">
        <span class="row-name">${esc(o.title)}</span>
        <span class="score ${sc}">${o.score}</span>
      </div>
      <div class="thought">“${esc(o.thought)}”</div>
      <div class="thesis">${esc(o.thesis)}</div>
      ${killed?'<div class="row-meta" style="margin-top:6px"><span class="badge blocked">Killed</span></div>'
        :'<button class="promote">Promote to company →</button>'}`;
    if(!killed){
      const b = r.querySelector('.promote');
      b.onclick = (e)=>{ e.stopPropagation(); b.textContent='Promoted ✓'; b.classList.add('done'); };
    }
    body.appendChild(r);
  });

  // next moves
  body.appendChild(el('div','group-label','Next moves'));
  DATA.nextMoves.forEach((t,i)=>{
    const mv = el('div','move');
    mv.innerHTML = `<span class="n">${i+1}</span><span>${esc(t)}</span>`;
    body.appendChild(mv);
  });

  col.appendChild(body);

  // global command bar
  const cmd = el('div','cmdbar');
  cmd.innerHTML = `
    <div class="field">
      <span style="color:var(--accent);font-weight:700">⌘</span>
      <input placeholder="Direct the portfolio - “promote PayoutReconciler”, “what needs me?”" />
      <button class="send">↑</button>
    </div>
    <div class="hint">Chat is the spine. Ask anything across all companies.</div>`;
  col.appendChild(cmd);
  return col;
}

function buildCompanyCol(co){
  const col = el('div','col');
  const head = el('div','col-head');
  head.appendChild(el('div','col-eyebrow', co.status.toUpperCase()+' · '+(co.domain||'no domain')));
  const title = el('div','col-title');
  title.innerHTML = `<span class="sdot ${co.status}"></span>${esc(co.name)}`;
  head.appendChild(title);
  head.appendChild(el('div','col-sub', esc(co.thesis)));
  col.appendChild(head);

  const body = el('div','col-body');

  // preview url
  if(co.previewUrl){
    const pv = el('div','preview-url');
    pv.innerHTML = `<span class="live-dot"></span>Live preview <a href="${co.previewUrl}" target="_blank">${co.previewUrl}</a>`;
    pv.style.margin='8px 4px 4px';
    body.appendChild(pv);
  }

  // slices (LeadSift has full list; others have currentSlice)
  body.appendChild(el('div','group-label','Slices · one validated capability each'));
  const slices = co.slices || (co.currentSlice ? [Object.assign({}, co.currentSlice, {check: co.currentSlice.status==='shipped'?'green':null})] : []);
  slices.forEach(s=>{
    const r = el('div','row');
    r.dataset.slice = s.n;
    const right = s.status==='awaiting_approval'
      ? '<span class="flag">Needs you</span>'
      : '<span class="badge '+s.status+'">'+labelStatus(s.status)+'</span>';
    r.innerHTML = `
      <div class="row-top">
        <span class="sdot ${s.status}${s.status==='building'?' pulse':''}"></span>
        <span class="row-name">${s.n}. ${esc(s.title)}</span>
        ${right}
      </div>
      <div class="row-meta">
        ${s.priority?'<span>priority '+s.priority+'</span>':''}
        ${s.check==='green'?'<span style="color:var(--green);font-weight:600">✓ doneWhen</span>':''}
        ${s.dependsOn?'<span>depends on '+s.dependsOn.join(', ')+'</span>':''}
        ${s.note?'<span style="color:var(--red)">'+esc(s.note)+'</span>':''}
        ${s.step?'<span>'+esc(s.step)+'</span>':''}
        <span class="chev">›</span>
      </div>`;
    r.onclick = ()=>drillSlice(co, s);
    body.appendChild(r);
  });

  // metrics
  body.appendChild(el('div','group-label','Metrics'));
  body.appendChild(kv('MRR','$'+co.mrr+'/mo'));
  body.appendChild(kv('Users', co.users));
  body.appendChild(kv('Slices shipped', co.slicesShipped ?? (co.slices?co.slices.filter(s=>s.status==='shipped').length:0)));

  col.appendChild(body);

  // company chat
  const cmd = el('div','cmdbar');
  cmd.innerHTML = `
    <div class="field">
      <span class="sdot ${co.status}"></span>
      <input placeholder="Chat with ${esc(co.name)} - “ship slice 6 next”, “why is 8 blocked?”" />
      <button class="send">↑</button>
    </div>
    <div class="hint">Company chat · ${esc(co.name)}</div>`;
  col.appendChild(cmd);
  return col;
}

function buildSliceCol(co, s){
  // Approval gate for LeadSift slice 5
  if(co.id==='leadsift' && s.n===5 && co.approval){
    return buildApprovalCol(co, co.approval);
  }
  const col = el('div','col');
  const head = el('div','col-head');
  head.appendChild(el('div','col-eyebrow','Slice '+s.n+' · '+labelStatus(s.status)));
  head.appendChild(el('div','col-title', esc(s.title)));
  col.appendChild(head);
  const body = el('div','col-body');
  let txt = '';
  if(s.status==='shipped') txt = 'Shipped and live. The doneWhen check passed and the capability is in production.';
  else if(s.status==='todo') txt = 'Queued in the backlog'+(s.priority?' at priority '+s.priority:'')+'. Agents will pull this when it reaches the top.';
  else if(s.status==='building') txt = 'Currently building'+(s.step?' - '+s.step:'')+'.';
  else if(s.status==='blocked') txt = (s.note||s.step||'Blocked')+'. Unblock it or pause the company.';
  body.appendChild(el('div','detail-block', esc(txt)));
  if(s.dependsOn) body.appendChild(kv('Depends on', 'slice '+s.dependsOn.join(', ')));
  if(s.check==='green') body.appendChild(kv('doneWhen', '✓ passed'));
  col.appendChild(body);
  return col;
}

function buildApprovalCol(co, a){
  const col = el('div','col wide');
  const head = el('div','col-head');
  head.appendChild(el('div','col-eyebrow', 'Approval gate · slice '+a.slice+' · attempt '+a.attempt));
  const t = el('div','col-title');
  t.innerHTML = `<span class="flag">Needs you</span>${esc(a.title)}`;
  t.style.gap='10px';
  head.appendChild(t);
  head.appendChild(el('div','col-sub','Review the diff, open the live preview, confirm the check - then approve or send it back.'));
  col.appendChild(head);

  const body = el('div','col-body');
  const gate = el('div','gate');

  // preview + diff card
  const card = el('div','gate-card');
  card.appendChild((()=>{const h=el('div','ch','<span class="lbl">Diff</span> 1 new component + scheduler'); return h;})());
  const pv = el('div','preview-url');
  pv.innerHTML = `<span class="live-dot"></span>Live preview <a href="${a.previewUrl}" target="_blank">${a.previewUrl}</a>`;
  card.appendChild(pv);

  const dw = el('div','donewhen');
  dw.innerHTML = `<span class="ok">✓</span><div><b>doneWhen ${a.checkResult}</b><br><code>${esc(a.doneWhen)}</code></div>`;
  card.appendChild(dw);

  const diff = el('div','diff');
  a.diff.split('\n').forEach(line=>{
    const add = line.startsWith('+');
    const ln = el('div','ln '+(add?'add':'ctx'), esc(line));
    diff.appendChild(ln);
  });
  card.appendChild(diff);
  gate.appendChild(card);

  // toast + actions
  const toast = el('div','toast');
  gate.appendChild(toast);

  const actions = el('div','gate-actions');
  const approve = el('button','btn approve','Approve & ship ✓');
  const reject = el('button','btn reject','Reject with feedback');
  actions.appendChild(approve);
  actions.appendChild(reject);
  gate.appendChild(actions);

  const fb = el('div','reject-fb');
  fb.innerHTML = `<textarea placeholder="What should change? e.g. “only include leads scored ≥ 80, send at 7am”"></textarea>`;
  const sendFb = el('button','btn reject','Send feedback →');
  sendFb.style.flex='0 0 auto';
  fb.appendChild(sendFb);
  gate.appendChild(fb);

  approve.onclick = ()=>{
    toast.className='toast ok'; toast.textContent='Approved ✓ - shipping slice '+a.slice+', re-prioritizing backlog…';
    fb.classList.remove('show');
  };
  reject.onclick = ()=>{
    fb.classList.toggle('show');
    if(fb.classList.contains('show')) fb.querySelector('textarea').focus();
  };
  sendFb.onclick = ()=>{
    toast.className='toast rej'; toast.textContent='Sent back with feedback ✓ - agents will rework slice '+a.slice+'.';
    fb.classList.remove('show');
  };

  // meta
  gate.appendChild((()=>{const c=el('div','gate-card'); c.appendChild(kv('Company', co.name)); c.appendChild(kv('Preview', a.previewUrl)); c.appendChild(kv('Check', '✓ '+a.checkResult)); return c;})());

  body.appendChild(gate);
  col.appendChild(body);

  // company chat anchored - chat is the spine
  const cmd = el('div','cmdbar');
  const thread = el('div','chat');
  DATA.chat.forEach(m=>{ thread.appendChild(el('div','msg '+m.role, esc(m.text))); });
  cmd.appendChild(thread);
  const field = el('div','field');
  field.innerHTML = `<span class="sdot active"></span><input placeholder="Ask about this slice…" /><button class="send">↑</button>`;
  field.style.marginTop='8px';
  cmd.appendChild(field);
  col.appendChild(cmd);
  return col;
}

function kv(k,v){ const e=el('div','kv'); e.innerHTML=`<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; return e; }
function labelStatus(s){ return ({todo:'Todo',building:'Building',awaiting_approval:'Needs you',shipped:'Shipped',blocked:'Blocked'})[s]||s; }

/* ---------------- drilling / state ---------------- */
function render(){
  // build only missing columns to keep animation; simplest: rebuild all
  strip.innerHTML='';
  path.forEach((p,i)=>{
    let col;
    if(p.kind==='overview') col = buildOverviewCol();
    else if(p.kind==='company') col = buildCompanyCol(p.co);
    else if(p.kind==='slice') col = buildSliceCol(p.co, p.s);
    // mark selected row in the PREVIOUS column
    strip.appendChild(col);
  });
  // apply persistent selection highlights
  applySelections();
  renderCrumbs();
  // scroll to reveal newest column
  requestAnimationFrame(()=>{ strip.scrollLeft = strip.scrollWidth; });
}

function applySelections(){
  const cols = strip.querySelectorAll('.col');
  // company selected in overview col
  if(path[1]){
    const r = cols[0]?.querySelector(`.row[data-coid="${path[1].co.id}"]`);
    if(r) r.classList.add('sel');
  }
  // slice selected in company col
  if(path[2]){
    const r = cols[1]?.querySelector(`.row[data-slice="${path[2].s.n}"]`);
    if(r) r.classList.add('sel');
  }
}

function drillCompany(id){
  const co = DATA.companies.find(c=>c.id===id);
  path = [path[0], {kind:'company', co, label:co.name}];
  render();
}
function drillSlice(co, s){
  path = [path[0], {kind:'company', co, label:co.name}, {kind:'slice', co, s, label:'slice '+s.n}];
  render();
}
function gotoCrumb(i){
  path = path.slice(0, i+1);
  render();
}

function renderCrumbs(){
  const c = $('#crumbs'); c.innerHTML='';
  path.forEach((p,i)=>{
    if(i>0) c.appendChild(el('span','crumb-sep','›'));
    const b = el('span','crumb'+(i===path.length-1?' active':''), esc(p.label));
    b.onclick = ()=>gotoCrumb(i);
    c.appendChild(b);
  });
}

// Esc / back -> pop one level
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && path.length>1){ path.pop(); render(); }
});

/* ---------------- live activity ---------------- */
function renderActivity(){
  // collapsed: one line per actively-building company (running)
  const latest = $('#actLatest');
  const running = DATA.activity.filter(a=>a.running);
  const lead = running[0] || DATA.activity[0];
  latest.innerHTML = `<span class="sdot ${kindDot(lead.kind)}${lead.running?' pulse':''}"></span>
    <span class="txt"><span class="co">${esc(lead.co)}</span> - ${esc(lead.text)}</span>
    <span class="t">${lead.t}</span>`;
  $('#actCount').textContent = running.length+' building · '+DATA.activity.length+' events';

  // expanded: grouped by company, running pulsing
  const stream = $('#actStream'); stream.innerHTML='';
  const groups = {};
  DATA.activity.forEach(a=>{ (groups[a.co] ||= []).push(a); });
  Object.keys(groups).forEach(co=>{
    const company = DATA.companies.find(c=>c.name===co);
    const g = el('div','act-grp');
    const gh = el('div','gh', `<span class="sdot ${company?company.status:'active'}"></span>${esc(co)}`);
    g.appendChild(gh);
    groups[co].forEach(a=>{
      const it = el('div','act-item');
      it.innerHTML = `<span class="rdot ${kindDot(a.kind)}${a.running?' run':''}"></span><span>${esc(a.text)}</span><span class="t">${a.t}</span>`;
      g.appendChild(it);
    });
    stream.appendChild(g);
  });
}
function kindDot(kind){
  return ({building:'building',deploy:'building',await:'awaiting_approval',check:'shipped',reprioritize:'todo',blocked:'blocked'})[kind]||'building';
}
$('#actBar').onclick = ()=>{
  const a = $('#activity');
  a.classList.toggle('open');
  document.documentElement.style.setProperty('--act-h', a.classList.contains('open')?'300px':'46px');
};

/* ---------------- init ---------------- */
render();
renderActivity();
</script>
</body>
</html>
