<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · Feed</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('cslopslop-theme');
      document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f7f3ec;
    --cream-2: #f1eae0;
    --paper: #fffdf8;
    --ink: #2c2926;
    --ink-soft: #6b645d;
    --ink-faint: #9c948b;
    --line: #e7ded0;
    --line-soft: #f0e9dd;
    --accent: #c8643c;
    --accent-soft: #f4ddce;
    --green: #4f8a52;
    --green-soft: #dcebd7;
    --blue: #3f6fb0;
    --blue-soft: #d9e3f2;
    --violet: #7c5cc4;
    --violet-soft: #e6ddf4;
    --amber: #c08a2c;
    --amber-soft: #f3e6c6;
    --red: #c0503f;
    --red-soft: #f4d8d1;
    --slate: #6a7686;
    --slate-soft: #e3e2df;
    --shadow: 0 1px 2px rgba(44, 41, 38, 0.05), 0 8px 30px rgba(44, 41, 38, 0.07);
    --shadow-lift: 0 2px 6px rgba(44, 41, 38, 0.08), 0 18px 50px rgba(44, 41, 38, 0.16);
  }
  :root[data-theme="dark"] {
    --cream: #05060a;
    --cream-2: #0a0c14;
    --paper: #10131f;
    --ink: #e6ebf5;
    --ink-soft: #a5adbf;
    --ink-faint: #6b7385;
    --line: #242938;
    --line-soft: #1a1e2b;
    --accent: #e0794e;
    --accent-soft: #3a2417;
    --green: #34d399;
    --green-soft: #10362c;
    --blue: #5b9cf0;
    --blue-soft: #142a45;
    --violet: #a78bfa;
    --violet-soft: #241d3f;
    --amber: #fbbf24;
    --amber-soft: #372a10;
    --red: #f87171;
    --red-soft: #3a1c1c;
    --slate: #94a3b8;
    --slate-soft: #202634;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 34px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 2px 8px rgba(0, 0, 0, 0.5), 0 22px 60px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }

  /* ---------- Top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 18px;
    padding: 12px clamp(16px, 4vw, 40px);
    background: color-mix(in srgb, var(--cream) 82%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--amber)));
    color: #fff; box-shadow: var(--shadow);
  }
  .logo svg { width: 18px; height: 18px; }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
  .brand-txt b {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
  }
  .brand-txt span { font-size: 10.5px; color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; }

  .summary { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .sm {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--ink-soft); display: inline-flex; align-items: baseline; gap: 6px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper);
  }
  .sm b { color: var(--ink); font-weight: 600; }
  .sm .pos { color: var(--green); }
  .sm.need { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
  .sm.need b { color: var(--accent); }
  .sm .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); align-self: center; animation: pulse 2.4s infinite; }

  .toggle {
    flex: none; width: 38px; height: 38px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    cursor: pointer; display: grid; place-items: center; transition: color .18s, border-color .18s, transform .18s;
  }
  .toggle:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .toggle:active { transform: scale(0.94); }
  .toggle svg { width: 18px; height: 18px; }
  .toggle .moon { display: none; }
  :root[data-theme="dark"] .toggle .sun { display: none; }
  :root[data-theme="dark"] .toggle .moon { display: block; }

  /* ---------- Scope bar ---------- */
  .scopebar {
    position: sticky; top: 61px; z-index: 30;
    display: flex; gap: 7px; align-items: center; overflow-x: auto;
    padding: 10px clamp(16px, 4vw, 40px);
    background: color-mix(in srgb, var(--cream) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
    scrollbar-width: none;
  }
  .scopebar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500;
    color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;
    transition: color .16s, border-color .16s, background .16s;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-faint)); flex: none; }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip.active { color: var(--ink); background: var(--cream-2); border-color: var(--ink-faint); box-shadow: inset 0 0 0 1px var(--ink-faint); }
  .chip.all.active { box-shadow: inset 0 0 0 1px var(--accent); border-color: var(--accent); color: var(--accent); }

  /* ---------- Feed ---------- */
  .feed { max-width: 680px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 24px) 96px; }

  .aiwork {
    display: flex; align-items: center; gap: 10px; margin: 18px 2px 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint);
  }
  .aiwork .live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: pulse 2.6s infinite; flex: none; }
  .aiwork b { color: var(--ink-soft); font-weight: 500; }

  .grouphead {
    display: flex; align-items: center; gap: 12px; margin: 26px 2px 12px;
  }
  .grouphead .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-faint); }
  .grouphead .rule { flex: 1; height: 1px; background: var(--line-soft); }
  .grouphead.needs .lbl { color: var(--accent); }

  /* timeline rail */
  .stream { position: relative; }
  .stream::before {
    content: ""; position: absolute; left: 15px; top: 6px; bottom: 6px; width: 1.5px;
    background: linear-gradient(var(--line), var(--line-soft));
  }

  .item {
    position: relative; padding: 3px 0 3px 44px; margin: 2px 0;
  }
  .node {
    position: absolute; left: 9px; top: 12px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--paper); border: 2.5px solid var(--c, var(--ink-faint)); z-index: 1;
  }
  .node.big { background: var(--c, var(--ink-faint)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
  .item-card {
    border-radius: 13px; padding: 11px 13px; transition: background .16s, border-color .16s, transform .16s;
  }
  .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); margin-left: auto; flex: none; }
  .item-text { margin: 5px 0 0; font-size: 14px; color: var(--ink); line-height: 1.45; }
  .item-text .num { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--ink); }
  .item.activity .item-card:hover { background: var(--paper); box-shadow: var(--shadow); }
  .item.activity .item-card { cursor: default; }

  .tag {
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600;
    color: var(--c, var(--ink)); background: transparent; border: none; padding: 0;
    display: inline-flex; align-items: center; gap: 6px; letter-spacing: -0.005em;
  }
  .tag .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-faint)); flex: none; }
  .tag:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kind { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); padding: 2px 6px; border-radius: 5px; background: var(--cream-2); }

  /* decision cards (pinned needs-you) */
  .item.decision .item-card {
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); box-shadow: var(--shadow);
    cursor: default; padding: 14px 15px;
  }
  .item.decision .node { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .dec-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15.5px; margin: 7px 0 3px; letter-spacing: -0.01em; }
  .dec-detail { font-size: 13px; color: var(--ink-soft); margin: 0 0 4px; }
  .rec { display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: var(--green); margin-top: 6px; }
  .rec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 15px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    transition: transform .14s, background .16s, border-color .16s, color .16s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost:hover { border-color: var(--ink-faint); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: var(--red-soft); border-color: var(--red); }

  .resolved-note {
    display: flex; align-items: center; gap: 9px; margin-top: 12px; padding: 10px 12px;
    border-radius: 9px; background: var(--green-soft); font-size: 13px; color: var(--ink);
  }
  .resolved-note.hold { background: var(--amber-soft); }
  .resolved-note.kill { background: var(--red-soft); }
  .resolved-note svg { width: 16px; height: 16px; flex: none; }
  .resolved-note .undo { margin-left: auto; cursor: pointer; color: var(--ink-soft); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; background: none; border: none; font-family: inherit; }
  .resolved-note .undo:hover { color: var(--accent); }

  .item.resolving { animation: collapseOut .34s ease forwards; }

  /* ---------- Focus panel ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(20, 16, 12, 0.34);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .28s;
  }
  :root[data-theme="dark"] .backdrop { background: rgba(0, 0, 0, 0.6); }
  .backdrop.open { opacity: 1; visibility: visible; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
    width: min(560px, 94vw); background: var(--cream); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lift); overflow-y: auto; transform: translateX(102%);
    transition: transform .34s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .panel.open { transform: translateX(0); }

  .p-head { position: sticky; top: 0; z-index: 2; padding: 20px clamp(18px, 3vw, 26px) 0; background: linear-gradient(var(--cream) 78%, transparent); }
  .p-close { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; }
  .p-close:hover { color: var(--accent); border-color: var(--accent); }
  .p-close svg { width: 16px; height: 16px; }

  .p-stage { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); padding: 4px 9px; border-radius: 999px; background: var(--c-soft); font-weight: 500; }
  .p-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: -0.02em; margin: 12px 0 4px; }
  .p-desc { font-family: 'Spectral', serif; font-size: 16px; color: var(--ink-soft); margin: 0 0 6px; line-height: 1.45; max-width: 46ch; }
  .p-status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); }
  .signal { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 5px; }

  .tabs { display: flex; gap: 2px; margin: 18px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-faint); background: none; border: none; padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .p-body { padding: 20px clamp(18px, 3vw, 26px) 40px; }
  .tabpane { display: none; }
  .tabpane.active { display: block; }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 20px; }
  .metric { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; }
  .metric .k { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .metric .v { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; margin-top: 3px; letter-spacing: -0.01em; }
  .metric .v.pos { color: var(--green); }

  .block { margin: 0 0 18px; }
  .block > .eyebrow { display: block; margin-bottom: 8px; }
  .goalbar { height: 8px; border-radius: 999px; background: var(--line-soft); overflow: hidden; margin: 8px 0 6px; }
  .goalbar > span { display: block; height: 100%; border-radius: 999px; background: var(--c); transition: width .5s ease; }
  .goal-lbl { font-size: 12.5px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }
  .goal-txt { font-size: 14px; color: var(--ink); margin: 0; }

  .plan, .nba, .risk { font-size: 14px; color: var(--ink); margin: 0; line-height: 1.5; }
  .nba-card { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 11px; padding: 12px 14px; }
  .nba-card .eyebrow { color: var(--accent); }

  .approval-card { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 13px; padding: 15px; }
  .approval-card .dec-title { margin-top: 4px; font-size: 16px; }

  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { position: relative; padding: 6px 0 6px 18px; font-size: 13.5px; color: var(--ink-soft); border-bottom: 1px dashed var(--line-soft); }
  .recent li:last-child { border-bottom: none; }
  .recent li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  .risk-card { background: var(--amber-soft); border-radius: 11px; padding: 11px 13px; font-size: 13.5px; color: var(--ink); display: flex; gap: 9px; align-items: flex-start; }
  .risk-card svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--amber); }

  .verdict { display: flex; gap: 10px; margin-top: 22px; }
  .vbtn { flex: 1; cursor: pointer; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 11px 8px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); transition: transform .14s, border-color .16s, color .16s, background .16s; }
  .vbtn small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; margin-top: 3px; opacity: .7; }
  .vbtn:active { transform: scale(0.97); }
  .vbtn.kill:hover { color: var(--red); border-color: var(--red); }
  .vbtn.cont:hover { color: var(--green); border-color: var(--green); }
  .vbtn.eject:hover { color: var(--violet); border-color: var(--violet); }
  .vbtn.reco { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); border-color: var(--c); }

  .prose p { font-family: 'Spectral', serif; font-size: 15px; line-height: 1.6; color: var(--ink); }
  .prose .lead { color: var(--ink-soft); }

  /* ---------- animations ---------- */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 currentColor; }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes collapseOut {
    to { opacity: 0; transform: translateX(14px); max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .item { animation: fadeUp .4s ease both; }

  @media (max-width: 560px) {
    .summary .sm.wide { display: none; }
    .p-name { font-size: 23px; }
    .metrics { grid-template-columns: repeat(3, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    .item { animation: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
    </div>
    <div class="brand-txt">
      <b>C Slop Slop</b>
      <span>startup factory</span>
    </div>
  </div>
  <div class="summary" id="summary">
    <span class="sm wide"><span class="mono">6</span> bets</span>
    <span class="sm"><span>net</span> <b class="pos">+$158<span style="opacity:.6">/mo</span></b></span>
    <span class="sm wide"><span>rev</span> <b>$220</b> <span style="opacity:.5">·</span> <span>spend</span> <b>$62</b></span>
    <span class="sm need" id="needChip"><span class="pulse"></span> <b id="needCount">3</b> need you</span>
  </div>
  <button class="toggle" id="themeToggle" aria-label="Toggle light and dark theme" title="Toggle theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<nav class="scopebar" id="scopebar" aria-label="Filter feed by company"></nav>

<main class="feed" id="feed"></main>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-label="Company focus view" aria-hidden="true"></aside>

<script>
  /* ============ DATA ============ */
  var STAGE = {
    idea:     { color: 'slate',  label: 'Idea' },

  });

  /* theme toggle */
  $('#themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('cslopslop-theme', next); } catch (e) {}
  });

  /* boot */
  renderScope();
  renderFeed();
  updateNeed();
</script>
</body>
</html>
