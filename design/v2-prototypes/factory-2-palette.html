<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Slop Slop · Command</title>
<script>
/* pre-paint theme: no flash */
(function () {
  try {
    var t = localStorage.getItem('cslopslop-theme');
    document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#f7f3ec; --cream-2:#f1ebdf; --paper:#fffdf8;
  --ink:#2c2926; --ink-soft:#6b635b; --ink-faint:#9c9389;
  --line:#e6ddce; --line-soft:#f0e9dc;
  --accent:#c8643c; --accent-soft:#f6e2d7;
  --green:#4f8a52; --green-soft:#dde9dc;
  --blue:#3b6ea5; --blue-soft:#dde7f1;
  --violet:#7c5cbf; --violet-soft:#e7ddf5;
  --amber:#c08a2c; --amber-soft:#f3e7cd;
  --red:#c0503f; --red-soft:#f4ddd7;
  --slate:#6b7280; --slate-soft:#e5e5e3;
  --shadow:0 18px 50px -12px rgba(60,45,30,.22), 0 2px 6px rgba(60,45,30,.06);
  --shadow-sm:0 1px 3px rgba(60,45,30,.08);
}
:root[data-theme="dark"]{
  --cream:#05060a; --cream-2:#0a0c12; --paper:#10131f;
  --ink:#e6ebf5; --ink-soft:#a3adc2; --ink-faint:#6b7488;
  --line:#232838; --line-soft:#1a1e2b;
  --accent:#e0794e; --accent-soft:#3a241a;
  --green:#34d399; --green-soft:#0f3a2c;
  --blue:#60a5fa; --blue-soft:#14273f;
  --violet:#a78bfa; --violet-soft:#241a3d;
  --amber:#fbbf24; --amber-soft:#3a2e12;
  --red:#f87171; --red-soft:#3a1c19;
  --slate:#94a0b5; --slate-soft:#1e2230;
  --shadow:0 24px 60px -14px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
}

/* ============ RESET / BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  line-height:1.5; overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 80% -10%, var(--cream-2), transparent 70%);
  transition:background-color .4s ease, color .4s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
kbd{
  font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1;
  padding:3px 5px; border-radius:5px; background:var(--cream-2);
  border:1px solid var(--line); color:var(--ink-soft); box-shadow:0 1px 0 var(--line);
}
.eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:'Spectral',serif}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--cream) 78%, transparent);
  border-bottom:1px solid var(--line-soft);
}
.brand{
  display:flex; align-items:baseline; gap:9px;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em;
}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center}
.brand span{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.topbar-right{display:flex;align-items:center;gap:10px}
.cmd-pill{
  display:flex; align-items:center; gap:9px;
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);
  padding:8px 13px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); box-shadow:var(--shadow-sm); transition:.2s;
}
.cmd-pill:hover{border-color:var(--accent);color:var(--ink)}
.cmd-pill b{
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:11px;
  padding:2px 6px; border-radius:6px; background:var(--cream-2); border:1px solid var(--line-soft);
}
.theme-toggle{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper); display:grid;place-items:center; font-size:16px;
  box-shadow:var(--shadow-sm); transition:.2s;
}
.theme-toggle:hover{border-color:var(--accent);transform:translateY(-1px)}

/* ============ LAYOUT ============ */
#app{max-width:1120px;margin:0 auto;padding:0 24px 90px}

/* ============ HOME (calm) ============ */
.home{
  min-height:calc(100vh - 71px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px 0; gap:34px;
}
.home-eyebrow{animation:fadeUp .5s ease both}
.home h1{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(38px,6vw,64px); letter-spacing:-.03em; line-height:1.02;
  max-width:15ch; animation:fadeUp .55s ease both;
}
.home h1 em{font-style:normal;color:var(--accent)}
.home-sub{
  font-family:'Spectral',serif; font-size:clamp(16px,2vw,20px); font-style:italic;
  color:var(--ink-soft); max-width:44ch; animation:fadeUp .6s ease both;
}
.pulse{
  display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:0;
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft);
  padding:11px 6px; border-radius:14px; border:1px solid var(--line);
  background:var(--paper); box-shadow:var(--shadow-sm); animation:fadeUp .65s ease both;
}
.pulse .seg{padding:2px 15px;border-right:1px solid var(--line-soft)}
.pulse .seg:last-child{border-right:none}
.pulse b{color:var(--ink);font-weight:600}
.pulse .pos{color:var(--green)}
.pulse .need{color:var(--accent);font-weight:600}
.home-fake{
  width:min(560px,90vw); animation:fadeUp .7s ease both;
}
.home-fake button{
  width:100%; display:flex; align-items:center; gap:12px;
  padding:18px 20px; border-radius:16px; border:1px solid var(--line);
  background:var(--paper); box-shadow:var(--shadow);
  font-size:15px; color:var(--ink-faint); text-align:left; transition:.22s;
}
.home-fake button:hover{border-color:var(--accent);transform:translateY(-2px)}
.home-fake .glyph{font-size:18px;color:var(--accent)}
.home-fake .flush{margin-left:auto;display:flex;gap:6px}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fadeUp .78s ease both}
.btn{
  padding:11px 18px; border-radius:11px; font-size:14px; font-weight:500;
  border:1px solid var(--line); background:var(--paper); transition:.2s; box-shadow:var(--shadow-sm);
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-need{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
:root[data-theme="dark"] .btn-need{color:var(--ink)}

/* ============ COMMAND PALETTE ============ */
.palette[hidden]{display:none}
.palette{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:12vh;
}
.palette-backdrop{
  position:absolute; inset:0;
  background:color-mix(in srgb, var(--cream) 40%, rgba(20,15,10,.4));
  backdrop-filter:blur(4px); animation:fade .2s ease both;
}
.palette-panel{
  position:relative; width:min(660px,92vw);
  background:var(--paper); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden; animation:popIn .22s cubic-bezier(.2,.9,.3,1) both;
}
.palette-input-row{
  display:flex; align-items:center; gap:13px;
  padding:17px 20px; border-bottom:1px solid var(--line-soft);
}
.palette-glyph{font-size:18px;color:var(--accent)}
#palette-input{
  flex:1; border:none; outline:none; background:none;
  font-family:'Inter',sans-serif; font-size:17px; color:var(--ink);
}
#palette-input::placeholder{color:var(--ink-faint)}
.palette-results{max-height:52vh;overflow-y:auto;padding:8px}
.palette-group{
  padding:12px 12px 6px; font-family:'JetBrains Mono',monospace; font-size:10px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
}
.cmd{
  display:flex; align-items:center; gap:13px;
  padding:10px 12px; border-radius:11px; cursor:pointer;
  border-left:3px solid transparent; transition:background .12s, border-color .12s;
}
.cmd:hover{background:var(--cream-2)}
.cmd.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.cmd-icon{
  width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
  font-size:14px; background:var(--cream-2); border:1px solid var(--line-soft); color:var(--ink-soft);
}
.cmd.decision .cmd-icon{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cmd-body{flex:1;min-width:0}
.cmd-label{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-sub{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 7px;border-radius:6px;flex:none}
.palette-empty{padding:34px;text-align:center;color:var(--ink-faint);font-size:14px}
.palette-foot{
  display:flex; align-items:center; gap:16px;
  padding:11px 18px; border-top:1px solid var(--line-soft);
  background:var(--cream-2); font-size:12px; color:var(--ink-faint);
}
.palette-foot span{display:flex;align-items:center;gap:5px}
.foot-spacer{flex:1}
.foot-browse{font-size:12px;color:var(--accent);font-weight:500}
.foot-browse:hover{text-decoration:underline}

/* ============ CHIPS / SIGNAL ============ */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
  letter-spacing:.04em; text-transform:uppercase;
  padding:4px 10px; border-radius:20px; border:1px solid;
}
.chip .cd{width:6px;height:6px;border-radius:50%}
.stage-idea{background:var(--slate-soft);border-color:transparent;color:var(--slate)} .stage-idea .cd{background:var(--slate)}
.stage-building{background:var(--blue-soft);border-color:transparent;color:var(--blue)} .stage-building .cd{background:var(--blue)}
.stage-testing{background:var(--amber-soft);border-color:transparent;color:var(--amber)} .stage-testing .cd{background:var(--amber)}
.stage-growing{background:var(--green-soft);border-color:transparent;color:var(--green)} .stage-growing .cd{background:var(--green)}
.stage-ejected{background:var(--violet-soft);border-color:transparent;color:var(--violet)} .stage-ejected .cd{background:var(--violet)}
.stage-killed{background:var(--red-soft);border-color:transparent;color:var(--red)} .stage-killed .cd{background:var(--red)}
.signal{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.signal i{width:3px;border-radius:2px;background:var(--line);display:block}
.signal i:nth-child(1){height:6px} .signal i:nth-child(2){height:10px} .signal i:nth-child(3){height:14px}
.signal.green i.on{background:var(--green)} .signal.amber i.on{background:var(--amber)} .signal.red i.on{background:var(--red)}
.signal-wrap{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft)}

/* ============ BROWSE (portfolio zoom-out) ============ */
.view-head{padding:34px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.view-head h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em}
.view-head p{color:var(--ink-soft);font-size:14px;margin-top:4px}
.totals-bar{
  display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:14px;
  background:var(--paper);overflow:hidden;box-shadow:var(--shadow-sm);
}
.totals-bar .t{padding:12px 20px;border-right:1px solid var(--line-soft);min-width:100px}
.totals-bar .t:last-child{border-right:none}
.totals-bar .tl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.totals-bar .tv{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{
  position:relative; padding:20px; border-radius:16px; border:1px solid var(--line);
  background:var(--paper); box-shadow:var(--shadow-sm); cursor:pointer; transition:.22s;
  display:flex; flex-direction:column; gap:13px;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px}
.card-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.45;min-height:38px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.card-metric{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft)}
.card-metric b{color:var(--ink);font-weight:600}
.needs-flag{
  position:absolute;top:-9px;right:16px;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);
}

/* ============ COMPANY (zoom-in) ============ */
.crumbs{display:flex;align-items:center;gap:8px;padding:26px 0 4px;font-size:13px;color:var(--ink-faint)}
.crumbs button{color:var(--ink-faint)} .crumbs button:hover{color:var(--accent)}
.co-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:8px 0 20px}
.co-title h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:38px;letter-spacing:-.025em;line-height:1}
.co-desc{font-family:'Spectral',serif;font-size:18px;color:var(--ink-soft);margin-top:10px;max-width:52ch}
.co-badges{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.rec{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;
  padding:6px 13px;border-radius:9px;border:1px solid;
}
.rec-continue{background:var(--green-soft);color:var(--green);border-color:transparent}
.rec-eject{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.rec-kill{background:var(--red-soft);color:var(--red);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tab{
  padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--ink-faint);
  border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.co-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.panel{
  padding:20px;border-radius:15px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow-sm);
}
.panel.hi{border-color:var(--accent);background:var(--accent-soft)}
:root[data-theme="dark"] .panel.hi{background:color-mix(in srgb,var(--accent-soft) 60%,var(--paper))}
.panel h3{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.panel.hi h3{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.goal-line{font-size:14px;color:var(--ink);margin-bottom:12px}
.goal-line b{font-weight:600}
.progress{height:9px;border-radius:6px;background:var(--cream-2);overflow:hidden;border:1px solid var(--line-soft)}
.progress > i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .5s ease}
.progress.warn > i{background:var(--amber)} .progress.none > i{background:var(--slate)} .progress.dead > i{background:var(--red)}
.progress-label{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:8px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{padding:13px 14px;border-radius:12px;background:var(--cream-2);border:1px solid var(--line-soft)}
.metric .ml{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.metric .mv{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;margin-top:3px}
.metric .mv.pos{color:var(--green)} .metric .mv.neg{color:var(--accent)}
.plan-text{font-family:'Spectral',serif;font-size:16px;line-height:1.55;color:var(--ink)}
.action-text{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:14px}
.approval-detail{font-size:13px;color:var(--ink-soft);margin:8px 0 16px}
.resolve{display:flex;gap:9px;flex-wrap:wrap}
.activity{list-style:none;display:flex;flex-direction:column;gap:0}
.activity li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-soft)}
.activity li:last-child{border-bottom:none}
.activity .ad{width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:6px;flex:none}
.risk-text{font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.risk-text .warn{color:var(--amber);font-size:16px}
.rec-footer{
  margin-top:24px;padding:20px;border-radius:15px;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow-sm);
}
.rec-footer .rl{font-size:14px;color:var(--ink-soft)} .rec-footer .rl b{color:var(--ink)}
.rec-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn-kill{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn-eject{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.btn-cont{background:var(--green);color:#fff;border-color:var(--green)}
.done-note{
  padding:16px 20px;border-radius:13px;font-size:14px;
  display:flex;align-items:center;gap:12px;
}
.done-ejected{background:var(--violet-soft);color:var(--violet)}
.done-killed{background:var(--red-soft);color:var(--red)}
.doc{font-family:'Spectral',serif;font-size:16px;line-height:1.65;color:var(--ink);max-width:64ch}
.doc h4{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:22px 0 6px;color:var(--ink)}
.doc h4:first-child{margin-top:0}
.doc p{margin-bottom:10px;color:var(--ink-soft)}
.doc .kv{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);background:var(--cream-2);padding:2px 7px;border-radius:5px}

/* ============ NEEDS-YOU ============ */
.needs-list{display:flex;flex-direction:column;gap:14px;max-width:720px}
.need-card{
  padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--paper);
  box-shadow:var(--shadow-sm);border-left:4px solid var(--accent);transition:.3s;
}
.need-card.resolving{opacity:0;transform:translateX(24px)}
.need-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.need-head h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600}
.need-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);margin-bottom:12px}
.need-detail{font-size:14px;color:var(--ink-soft);margin-bottom:16px}
.need-empty{
  padding:56px 24px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--ink-faint);
}
.need-empty .big{font-size:40px;margin-bottom:12px}
.btn-hold{background:var(--cream-2);border-color:var(--line)}
.kill-link{font-size:13px;color:var(--ink-faint);align-self:center;margin-left:4px}
.kill-link:hover{color:var(--red);text-decoration:underline}

/* ============ TOAST ============ */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120%);
  z-index:200;padding:13px 20px;border-radius:12px;background:var(--ink);color:var(--cream);
  font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:90vw;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .tk{color:var(--green);font-weight:600}

/* ============ ANIM ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .co-grid{grid-template-columns:1fr}
  .cmd-pill span{display:none}
  #app{padding:0 16px 80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="brand" data-act="home">
    <span class="dot"></span>C&nbsp;Slop&nbsp;Slop <span>factory</span>
  </button>
  <div class="topbar-right">
    <button class="cmd-pill" data-act="palette-open"><b>⌘K</b><span>Command anything</span></button>
    <button class="theme-toggle" id="theme-toggle" data-act="theme" aria-label="Toggle theme">☾</button>
  </div>
</header>

<main id="app"></main>

<!-- COMMAND PALETTE -->
<div class="palette" id="palette" hidden>
  <div class="palette-backdrop" data-act="palette-close"></div>
  <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input-row">
      <span class="palette-glyph">⌘</span>
      <input id="palette-input" autocomplete="off" spellcheck="false"
             placeholder="Type a company, an action, or a stage…">
      <kbd>esc</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> run</span>
      <span class="foot-spacer"></span>
      <button class="foot-browse" data-act="browse">Browse all bets →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============ DATA ============ */
var STAGES = [
  { id:"idea", label:"Idea" },
  { id:"building", label:"Building" },
  { id:"testing", label:"Testing" },
  { id:"growing", label:"Growing" },
  { id:"ejected", label:"Ejected" },
  { id:"killed", label:"Killed" }
];

var COMPANIES = [
  {
    id:"leadsift", name:"LeadSift", stage:"growing",
    desc:"Scores inbound webform leads 0–100 so you call the hot ones first.",
    goal:"10 paying users at $15/mo, under 5% churn",
    progress:{ pct:100, tone:"good", label:"12 / 10 paying · 0% churn" },
    spend:28, revenue:180, users:"12 paying", signal:"STRONG", status:"Needs approval",
    plan:"Shipping the Daily digest, then watching activation to make sure new users stick.",
    nextAction:"Approve - ship Daily digest to all 12 users",
    recent:["scored 41 leads overnight","Daily digest passed its check","+2 signups from the embed"],
    risk:"Single acquisition channel - all growth is coming from one embed.",
    recommendation:"CONTINUE"
  },
  {
    id:"quietinbox", name:"QuietInbox", stage:"testing",
    desc:"Email triage that auto-drafts replies you approve.",
    goal:"20 beta users, 40% week-2 retention, 5 who would pay",
    progress:{ pct:30, tone:"warn", label:"6 / 20 beta users · retention TBD" },
    spend:22, revenue:40, users:"6 beta", signal:"PROMISING", status:"On track",
    plan:"Running the private beta and measuring week-2 retention before opening it wider.",
    nextAction:"Interview 3 churned beta users",
    recent:["auto-drafted 30 replies","2 new beta signups"],
    risk:"Retention is still unproven - nobody has hit week 2 yet.",
    recommendation:"CONTINUE"
  },
  {
    id:"datadrop", name:"DataDrop", stage:"building",
    desc:"CSV intake → clean → instant shareable dashboard.",
    goal:"Ship the walking skeleton, convert 5 of 40 waitlist",
    progress:{ pct:45, tone:"info", label:"walking skeleton ~45% · 0 / 5 converted" },
    spend:12, revenue:0, users:"40 waitlist", signal:"NONE YET", status:"On track",
    plan:"Building the CSV cleaner and the auto-dashboard so the first 5 waitlisters can try it.",
    nextAction:"Finish the cleaner, invite the first 5",
    recent:["scaffolded intake API","deployed to staging"],
    risk:"No traction yet - it's all promise until the skeleton ships.",
    recommendation:"CONTINUE"
  },
  {
    id:"pricepeek", name:"PricePeek", stage:"idea",
    desc:"Tracks competitor pricing pages and alerts you to changes.",
    goal:"15 problem interviews before writing any code",
    progress:{ pct:0, tone:"none", label:"0 / 15 interviews" },
    spend:0, revenue:0, users:"0", signal:"NONE", status:"Needs approval",
    plan:"Validate the pain with real interviews before committing a single line of code.",
    nextAction:"Approve - start the 15-interview validation sprint",
    recent:["idea drafted","competitor list assembled"],
    risk:"Might be a vitamin, not a painkiller - willingness-to-pay is unknown.",
    recommendation:"CONTINUE"
  },
  {
    id:"translatorbill", name:"TranslatorBill", stage:"ejected",
    desc:"Auto-translates & reformats cross-border invoices - ejected into its own standalone company.",
    goal:"HIT - 20 paying at $15/mo → ejected",
    progress:{ pct:100, tone:"good", label:"Goal hit · graduated to standalone" },
    spend:0, revenue:320, users:"22 paying", signal:"STRONG", status:"Graduated",
    plan:"Handed off - now running as its own company.",
    nextAction:"-",
    recent:["hit 20 paying users","incorporated + handed off","final MRR $320 recorded"],
    risk:"None - graduated cleanly.",
    recommendation:"EJECT"
  },
  {
    id:"redditpainbot", name:"RedditPainBot", stage:"killed",
    desc:"Mined Reddit for recurring product pains - killed on weak willingness-to-pay.",
    goal:"MISSED - nobody would pay, killed after 3 weeks",
    progress:{ pct:8, tone:"dead", label:"Missed · stopped in week 3" },
    spend:0, revenue:0, users:"0", signal:"WEAK", status:"Stopped",
    plan:"Post-mortem written and archived.",
    nextAction:"-",
    recent:["3 weeks of interviews","willingness-to-pay: near zero","post-mortem written"],
    risk:"Weak willingness-to-pay - the fatal one.",
    recommendation:"KILL"
  }
];

var DECISIONS = [
  { id:"leadsift-digest", company:"leadsift", title:"Ship Daily digest", sub:"LeadSift · to all 12 users",
    detail:"One email endpoint. Fully reversible - you can pull it back within 24h." },
  { id:"pricepeek-sprint", company:"pricepeek", title:"Approve validation sprint", sub:"PricePeek · no spend",
    detail:"Start the 15-interview validation sprint. Zero spend, just the AI's time." },
  { id:"quietinbox-ph", company:"quietinbox", title:"$40 Product Hunt launch", sub:"QuietInbox · $40 spend",
    detail:"One-time $40 launch spend on Product Hunt to pull in beta users." }
];

var SIGNAL = {
  "STRONG":    { on:3, color:"green" },
  "PROMISING": { on:2, color:"amber" },
  "NONE YET":  { on:0, color:"green" },
  "NONE":      { on:0, color:"green" },
  "WEAK":      { on:1, color:"red" }
};

/* ============ STATE ============ */
var state = { view:"home", companyId:null, tab:"overview", decisions:DECISIONS.slice(), sel:0, cmds:[] };

/* ============ HELPERS ============ */
function byId(id){ for(var i=0;i<COMPANIES.length;i++){ if(COMPANIES[i].id===id) return COMPANIES[i]; } return null; }
function stageLabel(id){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].id===id) return STAGES[i].label; } return id; }
function isActive(c){ return c.stage!=="ejected" && c.stage!=="killed"; }
function money(n){ return "$"+n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function decisionFor(id){ for(var i=0;i<state.decisions.length;i++){ if(state.decisions[i].company===id) return state.decisions[i]; } return null; }

function chip(stage){
  return '<span class="chip stage-'+stage+'"><span class="cd"></span>'+stageLabel(stage)+'</span>';
}
function signalHTML(sig){
  var s = SIGNAL[sig] || { on:0, color:"green" };
  var bars = "";
  for(var i=1;i<=3;i++){ bars += '<i class="'+(i<=s.on?"on":"")+'"></i>'; }
  return '<span class="signal-wrap"><span class="signal '+s.color+'">'+bars+'</span>'+sig+'</span>';
}
function totals(){
  var spend=0, rev=0;
  for(var i=0;i<COMPANIES.length;i++){ if(isActive(COMPANIES[i])){ spend+=COMPANIES[i].spend; rev+=COMPANIES[i].revenue; } }
  return { spend:spend, rev:rev, net:rev-spend };
}

/* ============ ROUTER ============ */
function go(view, arg){
  state.view = view;
  if(view==="company"){ state.companyId = arg; state.tab = "overview"; }
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function openCompany(id){ go("company", id); }

function render(){
  var app = document.getElementById("app");
  if(state.view==="home") app.innerHTML = renderHome();
  else if(state.view==="browse") app.innerHTML = renderBrowse();
  else if(state.view==="company") app.innerHTML = renderCompany(byId(state.companyId));
  else if(state.view==="needs") app.innerHTML = renderNeeds();
}

/* ============ HOME ============ */
function renderHome(){
  var t = totals();
  var n = state.decisions.length;
  return ''+
  '<section class="home">'+
    '<div class="home-eyebrow eyebrow">AI-operated startup factory</div>'+
    '<h1>A calm room where the AI runs the <em>bets</em>.</h1>'+
    '<p class="home-sub">Six tiny companies, each validating on its own. You approve only the few calls that matter - start typing to steer.</p>'+
    '<div class="pulse">'+
      '<span class="seg"><b>6</b> bets</span>'+
      '<span class="seg"><b>'+money(t.spend)+'</b>/mo out</span>'+
      '<span class="seg"><b>'+money(t.rev)+'</b>/mo in</span>'+
      '<span class="seg pos"><b class="pos">+'+money(t.net)+'</b> net/mo</span>'+
      '<span class="seg"><span class="need">'+n+'</span> need you</span>'+
    '</div>'+
    '<div class="home-fake">'+
      '<button data-act="palette-open">'+
        '<span class="glyph">⌘</span>'+
        '<span>Jump to a company, run an action, filter by stage…</span>'+
        '<span class="flush"><kbd>⌘</kbd><kbd>K</kbd></span>'+
      '</button>'+
    '</div>'+
    '<div class="home-actions">'+
      '<button class="btn btn-need" data-act="needs">● '+n+' decisions need you</button>'+
      '<button class="btn" data-act="browse">Browse all bets</button>'+
    '</div>'+
  '</section>';
}

/* ============ BROWSE (zoom-out) ============ */
function renderBrowse(arg){
  var t = totals();
  var cards = "";
  for(var i=0;i<COMPANIES.length;i++){
    var c = COMPANIES[i];
    var dec = decisionFor(c.id);
    var metric = c.revenue>0 ? "<b>"+money(c.revenue)+"</b>/mo · "+c.users
                             : "<b>"+c.users+"</b>";
    cards += ''+
    '<div class="card" data-act="open" data-id="'+c.id+'">'+
      (dec ? '<span class="needs-flag">Needs you</span>' : '')+
      '<div class="card-top">'+chip(c.stage)+signalHTML(c.signal)+'</div>'+
      '<div class="card-name">'+esc(c.name)+'</div>'+
      '<div class="card-desc">'+esc(c.desc)+'</div>'+
      '<div class="card-meta">'+
        '<span class="card-metric">'+metric+'</span>'+
        '<span class="card-metric">'+esc(c.status)+' →</span>'+
      '</div>'+
    '</div>';
  }
  return ''+
  '<div class="crumbs"><button data-act="home">Home</button> / <span>Portfolio</span></div>'+
  '<div class="view-head">'+
    '<div><h2>The portfolio</h2><p>All six bets, zoomed out. Click one to focus.</p></div>'+
    '<div class="totals-bar">'+
      '<div class="t"><div class="tl">Bets</div><div class="tv">6</div></div>'+
      '<div class="t"><div class="tl">Spend/mo</div><div class="tv">'+money(t.spend)+'</div></div>'+
      '<div class="t"><div class="tl">Revenue/mo</div><div class="tv">'+money(t.rev)+'</div></div>'+
      '<div class="t"><div class="tl">Net/mo</div><div class="tv" style="color:var(--green)">+'+money(t.net)+'</div></div>'+
      '<div class="t"><div class="tl">Need you</div><div class="tv" style="color:var(--accent)">'+state.decisions.length+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="grid">'+cards+'</div>';
}

/* ============ COMPANY (zoom-in) ============ */
function renderCompany(c){
  if(!c) return '<div class="crumbs"><button data-act="home">Home</button></div><p>Not found.</p>';
  var recClass = c.recommendation==="CONTINUE" ? "rec-continue" : (c.recommendation==="EJECT" ? "rec-eject" : "rec-kill");
  var tabs = ["overview","foundation","product","growth","budget"];
  var tabLabels = { overview:"Overview", foundation:"Foundation", product:"Product", growth:"Growth", budget:"Budget" };
  var tabsHTML = "";
  for(var i=0;i<tabs.length;i++){
    tabsHTML += '<button class="tab '+(state.tab===tabs[i]?"active":"")+'" data-act="tab" data-id="'+tabs[i]+'">'+tabLabels[tabs[i]]+'</button>';
  }
  var body = state.tab==="overview" ? tabOverview(c) :
             state.tab==="foundation" ? tabFoundation(c) :
             state.tab==="product" ? tabProduct(c) :
             state.tab==="growth" ? tabGrowth(c) : tabBudget(c);
  return ''+
  '<div class="crumbs"><button data-act="home">Home</button> / <button data-act="browse">Portfolio</button> / <span>'+esc(c.name)+'</span></div>'+
  '<div class="co-head">'+
    '<div class="co-title">'+
      '<h2>'+esc(c.name)+'</h2>'+
      '<div class="co-desc">'+esc(c.desc)+'</div>'+
      '<div class="co-badges">'+chip(c.stage)+signalHTML(c.signal)+
        '<span class="rec '+recClass+'">Recommend: '+c.recommendation+'</span>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="tabs">'+tabsHTML+'</div>'+
  body;
}

function tabOverview(c){
  var dec = decisionFor(c.id);
  var net = c.revenue - c.spend;
  var recentHTML = "";
  for(var i=0;i<c.recent.length;i++){ recentHTML += '<li><span class="ad"></span>'+esc(c.recent[i])+'</li>'; }

  var actionPanel;
  if(dec){
    actionPanel =
      '<div class="panel hi">'+
        '<h3>● Needs your approval</h3>'+
        '<div class="action-text">'+esc(dec.title)+'</div>'+
        '<div class="approval-detail">'+esc(dec.detail)+'</div>'+
        '<div class="resolve">'+
          '<button class="btn btn-accent" data-act="approve" data-id="'+dec.id+'">Approve</button>'+
          '<button class="btn btn-hold" data-act="hold" data-id="'+dec.id+'">Hold</button>'+
        '</div>'+
      '</div>';
  } else {
    actionPanel =
      '<div class="panel">'+
        '<h3>➜ Next best action</h3>'+
        '<div class="action-text">'+esc(c.nextAction)+'</div>'+
        (isActive(c) ? '<div class="resolve"><button class="btn" data-act="tab" data-id="product">See the plan →</button></div>' : '')+
      '</div>';
  }

  var footer;
  if(c.stage==="ejected"){
    footer = '<div class="done-note done-ejected">✓ Graduated - TranslatorBill is running as its own standalone company.</div>';
  } else if(c.stage==="killed"){
    footer = '<div class="done-note done-killed">■ Stopped in week 3 - post-mortem written and archived.</div>';
  } else {
    footer =
      '<div class="rec-footer">'+
        '<div class="rl">The AI recommends <b>'+c.recommendation+'</b>. Your call, one click, reversible.</div>'+
        '<div class="rec-actions">'+
          '<button class="btn btn-kill" data-act="killbet" data-id="'+c.id+'">Kill</button>'+
          '<button class="btn btn-cont" data-act="continue" data-id="'+c.id+'">Continue</button>'+
          '<button class="btn btn-eject" data-act="eject" data-id="'+c.id+'">Eject</button>'+
        '</div>'+
      '</div>';
  }

  return ''+
  '<div class="co-grid">'+
    '<div class="stack">'+
      '<div class="panel">'+
        '<h3>◎ Validation goal</h3>'+
        '<div class="goal-line">'+esc(c.goal)+'</div>'+
        '<div class="progress '+(c.progress.tone==="good"?"":c.progress.tone==="warn"?"warn":c.progress.tone==="none"?"none":c.progress.tone==="dead"?"dead":"")+'"><i style="width:'+c.progress.pct+'%"></i></div>'+
        '<div class="progress-label"><span>'+esc(c.progress.label)+'</span><span>'+c.progress.pct+'%</span></div>'+
      '</div>'+
      '<div class="panel">'+
        '<h3>◍ What the AI is doing now</h3>'+
        '<div class="plan-text">'+esc(c.plan)+'</div>'+
      '</div>'+
      '<div class="panel">'+
        '<h3>◷ Recent activity</h3>'+
        '<ul class="activity">'+recentHTML+'</ul>'+
      '</div>'+
    '</div>'+
    '<div class="stack">'+
      '<div class="panel">'+
        '<h3>▤ The numbers</h3>'+
        '<div class="metrics">'+
          '<div class="metric"><div class="ml">Spend/mo</div><div class="mv neg">'+money(c.spend)+'</div></div>'+
          '<div class="metric"><div class="ml">Revenue/mo</div><div class="mv '+(c.revenue>0?"pos":"")+'">'+money(c.revenue)+'</div></div>'+
          '<div class="metric"><div class="ml">Users</div><div class="mv" style="font-size:16px">'+esc(c.users)+'</div></div>'+
          '<div class="metric"><div class="ml">Net/mo</div><div class="mv '+(net>=0?"pos":"neg")+'">'+(net>=0?"+":"")+money(net)+'</div></div>'+
        '</div>'+
      '</div>'+
      actionPanel+
      '<div class="panel">'+
        '<h3>⚠ Key risk</h3>'+
        '<div class="risk-text"><span class="warn">▲</span><span>'+esc(c.risk)+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>'+
  footer;
}

function tabFoundation(c){
  return '<div class="doc">'+
    '<h4>The problem</h4><p>'+esc(c.desc)+'</p>'+
    '<h4>Thesis</h4><p>If the pain is real and repeated, a tiny focused tool can win a wedge of it before anyone big notices. We prove that cheaply before we scale it.</p>'+
    '<h4>Validation goal</h4><p><span class="kv">'+esc(c.goal)+'</span></p>'+
    '<h4>Current risk</h4><p>'+esc(c.risk)+'</p>'+
  '</div>';
}
function tabProduct(c){
  var recentHTML="";
  for(var i=0;i<c.recent.length;i++){ recentHTML += '<p>· '+esc(c.recent[i])+'</p>'; }
  return '<div class="doc">'+
    '<h4>What the AI is building</h4><p>'+esc(c.plan)+'</p>'+
    '<h4>Next best action</h4><p><span class="kv">'+esc(c.nextAction)+'</span></p>'+
    '<h4>Recent build log</h4>'+recentHTML+
  '</div>';
}
function tabGrowth(c){
  return '<div class="doc">'+
    '<h4>Traction signal</h4><p>Reading <span class="kv">'+esc(c.signal)+'</span> right now.</p>'+
    '<h4>Where users come from</h4><p>Current base: <span class="kv">'+esc(c.users)+'</span>. '+esc(c.risk)+'</p>'+
    '<h4>Status</h4><p>'+esc(c.status)+'.</p>'+
  '</div>';
}
function tabBudget(c){
  var net = c.revenue - c.spend;
  return '<div class="doc">'+
    '<h4>Monthly picture</h4>'+
    '<p>Spend <span class="kv">'+money(c.spend)+'/mo</span> · Revenue <span class="kv">'+money(c.revenue)+'/mo</span> · Net <span class="kv">'+(net>=0?"+":"")+money(net)+'/mo</span></p>'+
    '<h4>Runway note</h4><p>'+(c.spend===0 ? "No active spend - this bet costs nothing to keep watching." : "Burning "+money(c.spend)+"/mo. "+(net>=0?"Already net-positive.":"Not yet covering its own cost; that's expected this early."))+'</p>'+
  '</div>';
}

/* ============ NEEDS-YOU ============ */
function renderNeeds(){
  if(state.decisions.length===0){
    return ''+
    '<div class="crumbs"><button data-act="home">Home</button> / <span>Needs you</span></div>'+
    '<div class="view-head"><div><h2>Needs you</h2><p>The only decisions the AI can\'t make alone.</p></div></div>'+
    '<div class="need-empty"><div class="big">✓</div>All clear. Nothing needs you right now - the AI is running the rest.</div>';
  }
  var cards = "";
  for(var i=0;i<state.decisions.length;i++){
    var d = state.decisions[i];
    var c = byId(d.company);
    cards += ''+
    '<div class="need-card" id="need-'+d.id+'">'+
      '<div class="need-head">'+chip(c.stage)+'<h3>'+esc(d.title)+'</h3></div>'+
      '<div class="need-sub">'+esc(d.sub)+'</div>'+
      '<div class="need-detail">'+esc(d.detail)+'</div>'+
      '<div class="resolve">'+
        '<button class="btn btn-accent" data-act="approve" data-id="'+d.id+'">Approve</button>'+
        '<button class="btn btn-hold" data-act="hold" data-id="'+d.id+'">Hold</button>'+
        '<button class="kill-link" data-act="killfrom" data-id="'+d.id+'">or kill '+esc(c.name)+'</button>'+
      '</div>'+
    '</div>';
  }
  return ''+
  '<div class="crumbs"><button data-act="home">Home</button> / <span>Needs you</span></div>'+
  '<div class="view-head"><div><h2>Needs you</h2><p>Resolve one inline - Approve, hold, or kill. The AI handles everything else.</p></div></div>'+
  '<div class="needs-list">'+cards+'</div>';
}

/* ============ ACTIONS ============ */
function removeDecision(id){
  for(var i=0;i<state.decisions.length;i++){ if(state.decisions[i].id===id){ state.decisions.splice(i,1); return; } }
}
function resolveWithAnim(id, cb){
  var el = document.getElementById("need-"+id);
  if(el && !prefersReduced()){ el.classList.add("resolving"); setTimeout(function(){ removeDecision(id); cb(); }, 320); }
  else { removeDecision(id); cb(); }
}
function prefersReduced(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

function approveDecision(id){
  var d=null; for(var i=0;i<state.decisions.length;i++){ if(state.decisions[i].id===id) d=state.decisions[i]; }
  if(!d) return;
  var msg = d.title;
  resolveWithAnim(id, function(){
    toast("Approved - "+msg+". Reversible for 24h.");
    render();
  });
}
function holdDecision(id){
  var d=null; for(var i=0;i<state.decisions.length;i++){ if(state.decisions[i].id===id) d=state.decisions[i]; }
  if(!d) return;
  resolveWithAnim(id, function(){ toast("Held - the AI will hold off and re-surface this later."); render(); });
}
function killFromDecision(id){
  var d=null; for(var i=0;i<state.decisions.length;i++){ if(state.decisions[i].id===id) d=state.decisions[i]; }
  if(!d) return;
  var cid=d.company;
  resolveWithAnim(id, function(){ killBet(cid, true); });
}
function killBet(id, fromNeeds){
  var c=byId(id); if(!c) return;
  c.stage="killed"; c.status="Stopped"; c.recommendation="KILL"; c.signal="WEAK";
  c.progress={ pct:8, tone:"dead", label:"Stopped by operator" };
  for(var i=state.decisions.length-1;i>=0;i--){ if(state.decisions[i].company===id) state.decisions.splice(i,1); }
  toast(c.name+" stopped. Post-mortem queued.");
  if(fromNeeds) render(); else render();
}
function ejectBet(id){
  var c=byId(id); if(!c) return;
  c.stage="ejected"; c.status="Graduated"; c.recommendation="EJECT";
  c.progress={ pct:100, tone:"good", label:"Ejected to standalone" };
  for(var i=state.decisions.length-1;i>=0;i--){ if(state.decisions[i].company===id) state.decisions.splice(i,1); }
  toast(c.name+" ejected into its own standalone company. 🎉");
  render();
}
function continueBet(id){ var c=byId(id); toast("Keeping "+(c?c.name:"it")+" running. The AI carries on."); }

/* ============ TOAST ============ */
var toastTimer=null;
function toast(msg){
  var el=document.getElementById("toast");
  el.innerHTML='<span class="tk">✓</span>'+esc(msg);
  el.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ============ THEME ============ */
function currentTheme(){ return document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light"; }
function updateToggle(){ document.getElementById("theme-toggle").textContent = currentTheme()==="dark" ? "☀" : "☾"; }
function toggleTheme(){
  var next = currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("cslopslop-theme", next); }catch(e){}
  updateToggle();
}

/* ============ COMMAND PALETTE ============ */
function buildCommands(){
  var cmds=[];
  var i, c;
  /* Needs you */
  for(i=0;i<state.decisions.length;i++){
    (function(d){
      cmds.push({ group:"Needs you", icon:"!", kind:"decision", label:"Approve - "+d.title, sub:d.sub,
        keywords:"approve "+byId(d.company).name+" "+d.title,
        run:function(){ approveDecision(d.id); } });
    })(state.decisions[i]);
  }
  /* Jump to */
  for(i=0;i<COMPANIES.length;i++){
    (function(co){
      cmds.push({ group:"Jump to", icon:"→", label:"Open "+co.name, sub:co.desc,
        keywords:co.name+" "+co.stage+" open "+co.desc,
        run:function(){ openCompany(co.id); } });
    })(COMPANIES[i]);
  }
  /* Actions */
  cmds.push({ group:"Actions", icon:"✦", label:"New bet", sub:"Draft a new company idea",
    keywords:"new bet create idea start company", run:function(){ toast("New bet drafted - the AI is sketching the foundation (demo)."); } });
  cmds.push({ group:"Actions", icon:"▦", label:"Browse bets", sub:"See all 6 in the portfolio",
    keywords:"browse portfolio list all bets", run:function(){ go("browse"); } });
  cmds.push({ group:"Actions", icon:"!", label:"Needs you", sub:state.decisions.length+" decisions pending",
    keywords:"needs you decisions pending approve review", run:function(){ go("needs"); } });
  cmds.push({ group:"Actions", icon:"◐", label:"Toggle theme", sub:"Light / dark",
    keywords:"theme dark light toggle mode", run:function(){ toggleTheme(); } });
  for(i=0;i<COMPANIES.length;i++){
    if(isActive(COMPANIES[i])){
      (function(co){
        cmds.push({ group:"Actions", icon:"✕", label:"Kill "+co.name, sub:"Stop this bet",
          keywords:"kill stop end "+co.name, run:function(){ killBet(co.id); go("company", co.id); } });
      })(COMPANIES[i]);
    }
  }
  /* Filter by stage */
  for(i=0;i<STAGES.length;i++){
    (function(s){
      var count=0; for(var k=0;k<COMPANIES.length;k++){ if(COMPANIES[k].stage===s.id) count++; }
      cmds.push({ group:"Filter by stage", icon:"#", label:"Stage: "+s.label, sub:count+" bet"+(count===1?"":"s"),
        keywords:"stage filter "+s.label, run:function(){ go("browse"); } });
    })(STAGES[i]);
  }
  return cmds;
}

var GROUP_ORDER = ["Needs you","Jump to","Actions","Filter by stage"];

function fuzzySub(token, text){
  var ti=0, score=0, streak=0;
  for(var qi=0; qi<token.length; qi++){
    var ch=token.charAt(qi), found=-1;
    for(var k=ti;k<text.length;k++){ if(text.charAt(k)===ch){ found=k; break; } }
    if(found===-1) return 0;
    streak = (found===ti) ? streak+1 : 0;
    score += 1 + streak;
    ti = found+1;
  }
  return score;
}
function matchScore(q, cmd){
  var text = (cmd.label+" "+cmd.sub+" "+(cmd.keywords||"")).toLowerCase();
  var tokens = q.toLowerCase().split(/\s+/);
  var total=0;
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i]; if(!t) continue;
    var idx=text.indexOf(t);
    if(idx>=0){ total += 12 - Math.min(idx,8) + t.length; }
    else { var f=fuzzySub(t,text); if(!f) return 0; total += f; }
  }
  return total;
}

function computeVisible(q){
  var all=buildCommands();
  var scored=[];
  var i;
  if(!q || !q.trim()){
    for(i=0;i<all.length;i++){ all[i]._score=0; scored.push(all[i]); }
  } else {
    for(i=0;i<all.length;i++){
      var sc=matchScore(q, all[i]);
      if(sc>0){ all[i]._score=sc; scored.push(all[i]); }
    }
  }
  scored.sort(function(a,b){
    var ga=GROUP_ORDER.indexOf(a.group), gb=GROUP_ORDER.indexOf(b.group);
    if(ga!==gb) return ga-gb;
    return b._score-a._score;
  });
  return scored;
}

function tagFor(cmd){
  if(cmd.group==="Needs you") return '<span class="cmd-tag" style="background:var(--accent-soft);color:var(--accent)">approve</span>';
  if(cmd.group==="Jump to") return '<span class="cmd-tag" style="background:var(--cream-2);color:var(--ink-faint)">open</span>';
  return "";
}

function renderPalette(){
  var q = document.getElementById("palette-input").value;
  var vis = computeVisible(q);
  state.cmds = vis;
  if(state.sel >= vis.length) state.sel = 0;
  var box = document.getElementById("palette-results");
  if(vis.length===0){
    box.innerHTML = '<div class="palette-empty">No match. Try a name like <b>LeadSift</b>, an action like <b>approve</b>, or a stage.</div>';
    return;
  }
  var html="", lastGroup=null, idx=0;
  for(var i=0;i<vis.length;i++){
    var cmd=vis[i];
    if(cmd.group!==lastGroup){ html += '<div class="palette-group">'+cmd.group+'</div>'; lastGroup=cmd.group; }
    html += ''+
    '<div class="cmd '+(cmd.kind==="decision"?"decision":"")+' '+(idx===state.sel?"sel":"")+'" data-cmd="'+i+'">'+
      '<span class="cmd-icon">'+cmd.icon+'</span>'+
      '<span class="cmd-body">'+
        '<span class="cmd-label">'+esc(cmd.label)+'</span>'+
        '<span class="cmd-sub">'+esc(cmd.sub)+'</span>'+
      '</span>'+
      tagFor(cmd)+
    '</div>';
    idx++;
  }
  box.innerHTML = html;
  scrollSelIntoView();
}
function scrollSelIntoView(){
  var box=document.getElementById("palette-results");
  var sel=box.querySelector(".cmd.sel");
  if(sel && sel.scrollIntoView) sel.scrollIntoView({ block:"nearest" });
}
function moveSel(delta){
  var n=state.cmds.length; if(!n) return;
  state.sel=(state.sel+delta+n)%n;
  var items=document.querySelectorAll("#palette-results .cmd");
  for(var i=0;i<items.length;i++){ items[i].classList.toggle("sel", i===state.sel); }
  scrollSelIntoView();
}
function runCommandAt(i){
  var cmd=state.cmds[i];
  if(!cmd) return;
  closePalette();
  cmd.run();
}
function runSelected(){ runCommandAt(state.sel); }

function openPalette(){
  var p=document.getElementById("palette");
  if(!p.hidden) return;
  p.hidden=false;
  state.sel=0;
  var inp=document.getElementById("palette-input");
  inp.value="";
  renderPalette();
  inp.focus();
}
function closePalette(){
  var p=document.getElementById("palette");
  p.hidden=true;
}
function paletteOpen(){ return !document.getElementById("palette").hidden; }

/* ============ EVENT WIRING ============ */
function handleAct(act, el){
  var id = el.getAttribute("data-id");
  switch(act){
    case "home": go("home"); break;
    case "browse": closePalette(); go("browse"); break;
    case "needs": go("needs"); break;
    case "open": openCompany(id); break;
    case "tab": state.tab=id; render(); break;
    case "theme": toggleTheme(); break;
    case "palette-open": openPalette(); break;
    case "palette-close": closePalette(); break;
    case "approve": approveDecision(id); break;
    case "hold": holdDecision(id); break;
    case "killfrom": killFromDecision(id); break;
    case "killbet": killBet(id); render(); break;
    case "eject": ejectBet(id); break;
    case "continue": continueBet(id); break;
    default: break;
  }
}

document.addEventListener("click", function(e){
  var cmdEl = e.target.closest("[data-cmd]");
  if(cmdEl){ runCommandAt(parseInt(cmdEl.getAttribute("data-cmd"),10)); return; }
  var actEl = e.target.closest("[data-act]");
  if(actEl){ e.preventDefault(); handleAct(actEl.getAttribute("data-act"), actEl); }
});

document.getElementById("palette-input").addEventListener("input", function(){ state.sel=0; renderPalette(); });
document.getElementById("palette-input").addEventListener("keydown", function(e){
  if(e.key==="ArrowDown"){ e.preventDefault(); moveSel(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveSel(-1); }
  else if(e.key==="Enter"){ e.preventDefault(); runSelected(); }
  else if(e.key==="Escape"){ e.preventDefault(); closePalette(); }
});

document.addEventListener("keydown", function(e){
  var typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if((e.key==="k"||e.key==="K") && (e.metaKey||e.ctrlKey)){ e.preventDefault(); paletteOpen()?closePalette():openPalette(); return; }
  if(e.key==="/" && !typing && !paletteOpen()){ e.preventDefault(); openPalette(); return; }
  if(e.key==="Escape" && paletteOpen()){ closePalette(); }
});

/* ============ BOOT ============ */
updateToggle();
render();
openPalette();
</script>
</body>
