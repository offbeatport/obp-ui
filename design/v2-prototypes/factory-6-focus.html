<!DOCTYPE html>
<html lang="en" data-mode="focus">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Focus</title>
<script>
  /* pre-paint theme: no flash */
  (function () {
    try {
      var t = localStorage.getItem('cslopslop-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:      #f7f3ec;
    --cream-2:    #efe9dd;
    --paper:      #fffdf8;
    --ink:        #2c2926;
    --ink-soft:   #6a6459;
    --ink-faint:  #a49c8d;
    --line:       #e4ddcd;
    --line-soft:  #eee8db;
    --accent:     #c8643c;
    --green:      #4f8a52;
    --blue:       #3f6fa3;
    --violet:     #7c5cbf;
    --amber:      #c58a2a;
    --red:        #bf4d3b;
    --slate:      #71798a;

    --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--paper));
    --green-soft:  color-mix(in srgb, var(--green) 13%, var(--paper));
    --blue-soft:   color-mix(in srgb, var(--blue) 13%, var(--paper));
    --violet-soft: color-mix(in srgb, var(--violet) 13%, var(--paper));
    --amber-soft:  color-mix(in srgb, var(--amber) 15%, var(--paper));
    --red-soft:    color-mix(in srgb, var(--red) 13%, var(--paper));
    --slate-soft:  color-mix(in srgb, var(--slate) 13%, var(--paper));

    --shadow:      0 1px 2px rgba(44,41,38,.05), 0 12px 34px -18px rgba(44,41,38,.22);
    --shadow-lift: 0 2px 4px rgba(44,41,38,.06), 0 26px 60px -26px rgba(44,41,38,.34);

    --font-display: "Space Grotesk", sans-serif;
    --font-ui: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    --font-serif: "Spectral", serif;

    --ease: cubic-bezier(.2,.7,.2,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }

  :root[data-theme="dark"] {
    --cream:      #05060a;
    --cream-2:    #0a0c13;
    --paper:      #10131f;
    --ink:        #e6ebf5;
    --ink-soft:   #a6adbd;
    --ink-faint:  #656d7e;
    --line:       #232838;
    --line-soft:  #191d29;
    --accent:     #e0794e;
    --green:      #34d399;
    --blue:       #5f9ee0;
    --violet:     #a689e8;
    --amber:      #e0b355;
    --red:        #e0715e;
    --slate:      #8b93a6;

    --accent-soft: color-mix(in srgb, var(--accent) 17%, var(--paper));
    --green-soft:  color-mix(in srgb, var(--green) 15%, var(--paper));
    --blue-soft:   color-mix(in srgb, var(--blue) 16%, var(--paper));
    --violet-soft: color-mix(in srgb, var(--violet) 16%, var(--paper));
    --amber-soft:  color-mix(in srgb, var(--amber) 16%, var(--paper));
    --red-soft:    color-mix(in srgb, var(--red) 16%, var(--paper));
    --slate-soft:  color-mix(in srgb, var(--slate) 16%, var(--paper));

    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 14px 40px -18px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 30px 70px -26px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 100% 0%, var(--cream-2), transparent 55%),
      radial-gradient(120% 100% at 0% 100%, var(--cream-2), transparent 50%),
      var(--cream);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 70%, transparent);
    backdrop-filter: blur(8px);
    z-index: 40;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: .82rem;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .brand .mark {
    width: 11px; height: 11px; border-radius: 3px;
    background: var(--accent);
    align-self: center;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .brand small {
    font-family: var(--font-mono);
    font-size: .62rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .h-spacer { flex: 1; }

  .totals {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .totals .net { color: var(--green); font-weight: 600; }
  .totals span i { color: var(--ink-faint); font-style: normal; }
  @media (max-width: 860px) { .totals { display: none; } }

  .needs-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: .68rem; font-weight: 600;
    letter-spacing: .05em;
    padding: 7px 12px 7px 10px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    cursor: pointer;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .needs-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .needs-pill .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pulse 2.4s var(--ease) infinite;
  }
  .needs-pill[data-empty="1"] { color: var(--green); background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .needs-pill[data-empty="1"] .pulse { background: var(--green); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 34px; padding: 0 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: .66rem; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer;
    transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); transform: translateY(-1px); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.square { width: 34px; padding: 0; }
  .icon-btn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
  .sun { display: none; } .moon { display: inline; }
  :root[data-theme="dark"] .sun { display: inline; }
  :root[data-theme="dark"] .moon { display: none; }

  /* ---------- stage color mapping ---------- */
  [data-stage="Idea"]     { --sc: var(--slate);  --sc-soft: var(--slate-soft); }
  [data-stage="Building"] { --sc: var(--blue);   --sc-soft: var(--blue-soft); }
  [data-stage="Testing"]  { --sc: var(--amber);  --sc-soft: var(--amber-soft); }
  [data-stage="Growing"]  { --sc: var(--green);  --sc-soft: var(--green-soft); }
  [data-stage="Ejected"]  { --sc: var(--violet); --sc-soft: var(--violet-soft); }
  [data-stage="Killed"]   { --sc: var(--red);    --sc-soft: var(--red-soft); }

  /* ---------- main focus stage ---------- */
  main { position: relative; overflow: hidden; }

  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 86px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    color: var(--ink-soft);
    cursor: pointer; z-index: 20;
    backdrop-filter: blur(6px);
    transition: color .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease-out);
  }
  .arrow svg { width: 22px; height: 22px; }
  .arrow.prev { left: clamp(6px, 1.5vw, 18px); border-radius: 8px 18px 18px 8px; }
  .arrow.next { right: clamp(6px, 1.5vw, 18px); border-radius: 18px 8px 8px 18px; }
  .arrow:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--paper); }
  .arrow.prev:hover { transform: translateY(-50%) translateX(-3px); }
  .arrow.next:hover { transform: translateY(-50%) translateX(3px); }
  @media (max-width: 720px) { .arrow { width: 38px; height: 64px; } }

  .scroller { height: 100%; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
  .scroller::-webkit-scrollbar { width: 10px; }
  .scroller::-webkit-scrollbar-thumb { background: var(--line); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }

  .focus {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(22px, 4vh, 46px) clamp(60px, 8vw, 96px) 48px;
  }
  .focus.dim { opacity: .5; filter: grayscale(.35); }

  .enter { animation: enter .5s var(--ease-out) both; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stagger > * { animation: rise .5s var(--ease-out) both; }
  .stagger > *:nth-child(1) { animation-delay: .02s; }
  .stagger > *:nth-child(2) { animation-delay: .07s; }
  .stagger > *:nth-child(3) { animation-delay: .12s; }
  .stagger > *:nth-child(4) { animation-delay: .17s; }
  .stagger > *:nth-child(5) { animation-delay: .22s; }
  .stagger > *:nth-child(6) { animation-delay: .27s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* eyebrow row */
  .eyebrow-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: .68rem; font-weight: 500;
    letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint);
  }
  .stage-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: .66rem; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--sc);
    padding: 5px 11px; border-radius: 999px;
    background: var(--sc-soft);
    border: 1px solid color-mix(in srgb, var(--sc) 32%, transparent);
  }
  .stage-badge b { width: 6px; height: 6px; border-radius: 50%; background: var(--sc); }
  .er-spacer { flex: 1; }
  .status {
    font-family: var(--font-mono); font-size: .64rem; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .status b { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
  .status.attn { color: var(--accent); } .status.attn b { background: var(--accent); }
  .status.ok { color: var(--green); } .status.ok b { background: var(--green); }

  .bet-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.7rem, 7.5vw, 5.4rem);
    line-height: .96;
    letter-spacing: -.02em;
    margin-bottom: 14px;
  }
  .bet-desc {
    font-family: var(--font-serif);
    font-size: clamp(1.12rem, 2.4vw, 1.62rem);
    line-height: 1.42;
    color: var(--ink-soft);
    max-width: 44ch;
    margin-bottom: 30px;
  }
  .bet-desc em { color: var(--accent); font-style: italic; }

  /* metrics strip */
  .metrics {
    display: flex; flex-wrap: wrap; gap: clamp(20px, 4vw, 46px);
    padding: 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 30px;
  }
  .metric .m-lbl {
    font-family: var(--font-mono); font-size: .58rem; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
    display: block; margin-bottom: 6px;
  }
  .metric .m-val {
    font-family: var(--font-mono); font-weight: 600;
    font-size: clamp(1.1rem, 2.2vw, 1.5rem);
    letter-spacing: -.01em;
  }
  .metric .m-val small { font-size: .62em; color: var(--ink-faint); font-weight: 500; letter-spacing: 0; }
  .m-val.pos { color: var(--green); } .m-val.neg { color: var(--red); }

  .sig { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; }
  .sig-bar { width: 5px; border-radius: 2px; background: var(--line); height: var(--h); }
  .sig[data-tone="green"] .sig-bar.on { background: var(--green); }
  .sig[data-tone="amber"] .sig-bar.on { background: var(--amber); }
  .sig[data-tone="red"] .sig-bar.on { background: var(--red); }
  .sig[data-tone="faint"] .sig-bar.on { background: var(--ink-faint); }
  .metric.sig-metric { display: flex; flex-direction: column; }
  .sig-word { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 5px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 26px; flex-wrap: wrap; }
  .tab {
    font-family: var(--font-mono); font-size: .68rem; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint);
    padding: 8px 13px; border-radius: 8px;
    background: transparent; border: 1px solid transparent;
    cursor: pointer; transition: color .16s var(--ease), background .16s var(--ease);
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--paper); border-color: var(--line); box-shadow: var(--shadow); }

  /* approval callout */
  .approval {
    border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    background: linear-gradient(180deg, var(--accent-soft), color-mix(in srgb, var(--accent) 5%, var(--paper)));
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }
  .approval .a-eye {
    font-family: var(--font-mono); font-size: .6rem; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .approval .a-eye .spark { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
  .approval h3 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.15rem, 2.4vw, 1.5rem); letter-spacing: -.01em; margin-bottom: 6px; }
  .approval p { font-family: var(--font-ui); font-size: .92rem; color: var(--ink-soft); margin-bottom: 18px; max-width: 56ch; }
  .a-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-ui); font-size: .86rem; font-weight: 600;
    padding: 10px 18px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent;
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-approve { background: var(--green); color: #fff; box-shadow: 0 8px 20px -10px var(--green); }
  :root[data-theme="dark"] .btn-approve { color: #05231a; }
  .btn-hold { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn-hold:hover { border-color: var(--ink-faint); color: var(--ink); }
  .btn-kill { background: transparent; color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .btn-kill:hover { background: var(--red-soft); }
  .a-meta { margin-left: auto; font-family: var(--font-mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }

  .resolved {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border: 1px dashed var(--line); border-radius: 14px;
    padding: 16px 22px; margin-bottom: 28px;
    background: var(--paper);
  }
  .resolved .r-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .resolved.approved .r-ico { background: var(--green-soft); color: var(--green); }
  .resolved.held .r-ico { background: var(--amber-soft); color: var(--amber); }
  .resolved.killed .r-ico { background: var(--red-soft); color: var(--red); }
  .resolved svg { width: 16px; height: 16px; }
  .resolved .r-txt b { font-family: var(--font-ui); font-weight: 600; font-size: .92rem; display: block; }
  .resolved .r-txt span { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .undo {
    margin-left: auto; font-family: var(--font-mono); font-size: .66rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
    background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  /* overview grid */
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: clamp(28px, 4vw, 54px); align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; gap: 34px; } }

  .block { margin-bottom: 30px; }
  .block:last-child { margin-bottom: 0; }
  .b-eye {
    font-family: var(--font-mono); font-size: .6rem; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .b-eye::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  .goal-txt { font-family: var(--font-serif); font-size: 1.16rem; line-height: 1.4; color: var(--ink); margin-bottom: 16px; }
  .meter { height: 9px; border-radius: 999px; background: var(--line-soft); overflow: hidden; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--sc); width: 0; transition: width .9s var(--ease-out); }
  .meter.over i { background: linear-gradient(90deg, var(--sc), color-mix(in srgb, var(--sc) 60%, var(--accent))); }
  .meter-lbl { display: flex; justify-content: space-between; margin-top: 9px; font-family: var(--font-mono); font-size: .64rem; letter-spacing: .04em; color: var(--ink-soft); }
  .meter-lbl .pct { color: var(--sc); font-weight: 600; }

  .next-action {
    display: flex; gap: 13px; align-items: flex-start;
    padding: 15px 17px; border-radius: 12px;
    background: var(--paper); border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .next-action .na-dot { flex: none; margin-top: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .next-action p { font-family: var(--font-ui); font-size: .96rem; font-weight: 500; line-height: 1.45; }

  .decide { }
  .decide-opts { display: flex; gap: 8px; margin-bottom: 12px; }
  .opt {
    flex: 1; text-align: center;
    font-family: var(--font-mono); font-size: .7rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 11px 6px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--ink-faint);
    background: transparent;
  }
  .opt.on.opt-cont  { color: #fff; background: var(--green);  border-color: var(--green); }
  .opt.on.opt-eject { color: #fff; background: var(--violet); border-color: var(--violet); }
  .opt.on.opt-kill  { color: #fff; background: var(--red);    border-color: var(--red); }
  :root[data-theme="dark"] .opt.on.opt-cont { color: #05231a; }
  :root[data-theme="dark"] .opt.on.opt-eject { color: #100a24; }
  :root[data-theme="dark"] .opt.on.opt-kill { color: #2a0d08; }
  .decide-why { font-family: var(--font-ui); font-size: .88rem; color: var(--ink-soft); line-height: 1.5; }

  /* rail */
  .rail .block { margin-bottom: 26px; }
  .plan-txt { font-family: var(--font-serif); font-size: 1.02rem; line-height: 1.5; color: var(--ink-soft); }
  .plan-txt b { color: var(--ink); font-weight: 500; }

  .feed { list-style: none; }
  .feed li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .feed li:last-child { border-bottom: none; }
  .feed .f-time { flex: none; width: 66px; font-family: var(--font-mono); font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); padding-top: 2px; }

    var net = b.revenue - b.spend;
    var netCls = net > 0 ? "pos" : (net < 0 ? "neg" : "");
    var netStr = (net > 0 ? "+" : "") + money(net, true);
    var tab = activeTab[b.id] || "Overview";

    var status = b.status ? '<span class="status ' + (b.statusTone || "") + '"><b></b>' + b.status + '</span>' : '';

    var metrics =
      '<div class="metrics">' +
        metric("Revenue", '<span class="m-val">' + money(b.revenue, true) + '</span>') +
        metric("Burn", '<span class="m-val">' + money(b.spend, true) + '</span>') +
        metric("Net", '<span class="m-val ' + netCls + '">' + netStr + '</span>') +
        metric("Users", '<span class="m-val">' + b.usersNum + ' <small>' + b.usersLbl + '</small></span>') +
        '<div class="metric sig-metric"><span class="m-lbl">Signal</span>' + sigMarkup(b.sigLevel, b.sigTone) + '<span class="sig-word">' + b.signal + '</span></div>' +
      '</div>';

    var tabs = '<nav class="tabs" role="tablist">';
    ["Overview", "Foundation", "Product", "Growth", "Budget"].forEach(function (t) {
      tabs += '<button class="tab" role="tab" data-tab="' + t + '" aria-selected="' + (t === tab) + '">' + t + '</button>';
    });
    tabs += '</nav>';

    var panel = tab === "Overview" ? overviewPanel(b) : docPanel(b, tab);

    focusEl.className = "focus" + (b.done && b.rec === "Kill" ? "" : "");
    focusEl.innerHTML =
      '<div class="stagger">' +
        '<div class="eyebrow-row">' +
          '<span class="eyebrow">Bet ' + pad(current + 1) + ' / 06</span>' +
          '<span class="stage-badge"><b></b>' + b.stage + '</span>' +
          '<span class="er-spacer"></span>' + status +
        '</div>' +
        '<h1 class="bet-name">' + b.name + '</h1>' +
        '<p class="bet-desc">' + b.desc + '</p>' +
        metrics +
        tabs +
        '<div id="panel">' + panel + '</div>' +
      '</div>';
    focusEl.setAttribute("data-stage", b.stage);

    // animate meter fill
    var fill = focusEl.querySelector(".meter i");
    if (fill) { requestAnimationFrame(function () { fill.style.width = b.pct + "%"; }); }

    document.getElementById("stageWrap").scrollTop = 0;
    bindPanel();
    highlightPeek();
  }

  function metric(lbl, val) {
    return '<div class="metric"><span class="m-lbl">' + lbl + '</span>' + val + '</div>';
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function overviewPanel(b) {
    var approval = "";
    if (b.approval) {
      if (!b.resolved) {
        approval =
          '<div class="approval" data-stage="' + b.stage + '">' +
            '<div class="a-eye"><span class="spark"></span>Needs you · decide inline</div>' +
            '<h3>' + b.approval.title + '</h3>' +
            '<p>' + b.approval.detail + '</p>' +
            '<div class="a-actions">' +
              '<button class="btn btn-approve" data-act="approve">Approve</button>' +
              '<button class="btn btn-hold" data-act="hold">Hold</button>' +
              '<button class="btn btn-kill" data-act="kill">Kill bet</button>' +
              '<span class="a-meta">' + b.approval.meta + '</span>' +
            '</div>' +
          '</div>';
      } else {
        approval = resolvedMarkup(b);
      }
    }

    var feed = '<ul class="feed">';
    b.feed.forEach(function (f) {
      feed += '<li><span class="f-time">' + f.t + '</span><span class="f-txt">' + f.s + '</span></li>';
    });
    feed += '</ul>';

    var risks = "";
    b.risks.forEach(function (r) {
      risks += '<div class="risk' + (r.tone === "clear" ? " clear" : "") + '"><span class="r-bar"></span><p>' + r.t + '</p></div>';
    });

    var recCls = b.rec === "Continue" ? "opt-cont" : (b.rec === "Eject" ? "opt-eject" : "opt-kill");
    var decide =
      '<div class="block decide">' +
        '<div class="b-eye">Recommendation</div>' +
        '<div class="decide-opts">' +
          '<span class="opt opt-kill' + (b.rec === "Kill" ? " on" : "") + '">Kill</span>' +
          '<span class="opt opt-cont' + (b.rec === "Continue" ? " on" : "") + '">Continue</span>' +
          '<span class="opt opt-eject' + (b.rec === "Eject" ? " on" : "") + '">Eject</span>' +
        '</div>' +
        '<p class="decide-why">' + b.why + '</p>' +
      '</div>';

    var left =
      '<div class="col-left">' +
        approval +
        '<div class="block">' +
          '<div class="b-eye">Validation goal</div>' +
          '<p class="goal-txt">' + b.goal + '</p>' +
          '<div class="meter' + (b.over ? " over" : "") + '"><i></i></div>' +
          '<div class="meter-lbl"><span class="pct">' + b.meterHi + '</span><span>' + b.meterLo + '</span></div>' +
        '</div>' +
        '<div class="block">' +
          '<div class="b-eye">Next best action</div>' +
          '<div class="next-action"><span class="na-dot"></span><p>' + b.next + '</p></div>' +
        '</div>' +
        decide +
      '</div>';

    var right =
      '<div class="rail">' +
        '<div class="block">' +
          '<div class="b-eye">AI plan · what it\'s doing now</div>' +
          '<p class="plan-txt">' + b.plan + '</p>' +
        '</div>' +
        '<div class="block">' +
          '<div class="b-eye">Recent activity</div>' + feed +
        '</div>' +
        '<div class="block">' +
          '<div class="b-eye">Risks</div>' + risks +
        '</div>' +
      '</div>';

    return '<div class="grid" data-stage="' + b.stage + '">' + left + right + '</div>';
  }

  function resolvedMarkup(b) {
    var map = {
      approve: { cls: "approved", ico: svgCheck(), b: "Approved — " + b.approval.title, s: "Shipped · reversible", tone: "green", toast: "Approved. " + b.name + " is shipping." },
      hold: { cls: "held", ico: svgClock(), b: "Held for later — " + b.approval.title, s: "Parked · resume anytime", tone: "amber", toast: b.name + " decision held." },
      kill: { cls: "killed", ico: svgX(), b: "Bet killed — " + b.name, s: "Stopped · reversible", tone: "red", toast: b.name + " killed." }
    };
    var m = map[b.resolved];
    return '<div class="resolved ' + m.cls + '"><span class="r-ico">' + m.ico + '</span>' +
      '<span class="r-txt"><b>' + m.b + '</b><span>' + m.s + '</span></span>' +
      '<button class="undo" data-act="undo">Undo</button></div>';
  }

  function docPanel(b, tab) {
    var d = b.docs[tab];
    var net = b.revenue - b.spend;
    var kv =
      '<div class="kv">' +
        '<div><span>Revenue</span><b>' + money(b.revenue, true) + '</b></div>' +
        '<div><span>Burn</span><b>' + money(b.spend, true) + '</b></div>' +
        '<div><span>Net</span><b class="' + (net > 0 ? "" : "") + '">' + (net > 0 ? "+" : "") + money(net, true) + '</b></div>' +
        '<div><span>Signal</span><b>' + b.signal + '</b></div>' +
      '</div>';
    return '<div class="doc" data-stage="' + b.stage + '"><h4>' + tab + ' · ' + d.h + '</h4><p>' + d.p + '</p>' + (tab === "Budget" ? kv : "") + '</div>';
  }

  function bindPanel() {
    var b = bets[current];
    focusEl.querySelectorAll(".tab").forEach(function (t) {
      t.addEventListener("click", function () {
        activeTab[b.id] = t.getAttribute("data-tab");
        renderFocus();
      });
    });
    var acts = focusEl.querySelectorAll("[data-act]");
    acts.forEach(function (el) {
      el.addEventListener("click", function () {
        var a = el.getAttribute("data-act");
        if (a === "undo") { b.resolved = null; }
        else { b.resolved = a; }
        renderFocus();
        updateNeeds();
        if (a !== "undo") {
          var map = { approve: "Approved. " + b.name + " is shipping.", hold: b.name + " decision held.", kill: b.name + " killed — reversible." };
          showToast(map[a], a);
        }
      });
    });
  }

  function renderPeek() {
    var hint = '<div class="peek-hint"><b>← →</b> move<br>P portfolio</div>';
    var tiles = "";
    bets.forEach(function (b, i) {
      var flag = (b.approval && !b.resolved) ? '<span class="pt-flag" title="Needs you"></span>' : '';
      tiles +=
        '<button class="peek-tile" data-stage="' + b.stage + '" data-i="' + i + '" aria-current="' + (i === current) + '">' +
          '<span class="pt-top"><span class="pt-idx">' + pad(i + 1) + '</span><span class="pt-dot"></span>' + flag + '</span>' +
          '<span class="pt-name">' + b.name + '</span>' +
          '<span class="pt-stage">' + b.stage + '</span>' +
        '</button>';
    });
    peekEl.innerHTML = hint + tiles;
    peekEl.querySelectorAll(".peek-tile").forEach(function (t) {
      t.addEventListener("click", function () { goTo(+t.getAttribute("data-i")); });
    });
  }

  function highlightPeek() {
    peekEl.querySelectorAll(".peek-tile").forEach(function (t, i) {
      var on = i === current;
      t.setAttribute("aria-current", on);
      if (on) t.scrollIntoView({ block: "nearest", inline: "center" });
    });
  }

  function renderPortfolio() {
    var rows = "";
    bets.forEach(function (b, i) {
      var net = b.revenue - b.spend;
      var flag = (b.approval && !b.resolved) ? '<span class="pfn-flag">needs you</span>' : '';
      var rev = b.revenue > 0 ? money(b.revenue, true) : (b.spend > 0 ? '−' + money(b.spend, true) : '—');
      rows +=
        '<li class="pf-row" data-stage="' + b.stage + '" data-i="' + i + '">' +
          '<span class="pf-idx">' + pad(i + 1) + '</span>' +
          '<div class="pf-main"><div class="pf-name">' + b.name + flag + '</div><div class="pf-desc">' + b.desc.replace(/<\/?em>/g, "") + '</div></div>' +
          '<span class="pf-stage"><b></b>' + b.stage + '</span>' +
          '<span class="pf-rev">' + rev + '</span>' +
          '<span class="pf-sig">' + sigMarkup(b.sigLevel, b.sigTone) + '<span class="sig-word">' + b.signal + '</span></span>' +
          '<span class="pf-open">' + svgArrow() + '</span>' +
        '</li>';
    });

    portfolioEl.innerHTML =
      '<div class="pf-inner">' +
        '<div class="pf-head">' +
          '<div class="pf-eye">Zoom out · the whole portfolio</div>' +
          '<h1>Six bets, one operator.</h1>' +
          '<div class="pf-stats">' +
            '<div><span>Bets</span><b>6</b></div>' +
            '<div><span>Active revenue</span><b>$220/mo</b></div>' +
            '<div><span>Burn</span><b>$62/mo</b></div>' +
            '<div class="net"><span>Net</span><b>+$158/mo</b></div>' +
            '<div><span>Need you</span><b id="pf-needs">3</b></div>' +
          '</div>' +
        '</div>' +
        '<ul class="pf-list">' + rows + '</ul>' +
      '</div>';

    portfolioEl.querySelectorAll(".pf-row").forEach(function (r) {
      r.addEventListener("click", function () {
        current = +r.getAttribute("data-i");
        setMode("focus");
        renderFocus();
      });
    });
    var pn = document.getElementById("pf-needs");
    if (pn) pn.textContent = needsCount();
  }

  /* ---------- navigation ---------- */
  function goTo(i) {
    current = (i + bets.length) % bets.length;
    renderFocus();
  }
  function go(delta) { goTo(current + delta); }

  function setMode(m) {
    document.documentElement.setAttribute("data-mode", m);
    var btn = document.getElementById("pfBtn");
    var on = m === "portfolio";
    btn.setAttribute("aria-pressed", on);
    document.getElementById("pfLabel").textContent = on ? "Focus" : "Portfolio";
    if (on) renderPortfolio();
  }
  function toggleMode() {
    var m = document.documentElement.getAttribute("data-mode");
    setMode(m === "portfolio" ? "focus" : "portfolio");
  }

  function updateNeeds() {
    var n = needsCount();
    var pill = document.getElementById("needsPill");
    document.getElementById("needsTxt").textContent = n > 0 ? (n + " need you") : "all clear";
    pill.setAttribute("data-empty", n === 0 ? "1" : "0");
    var pn = document.getElementById("pf-needs");
    if (pn) pn.textContent = n;
  }

  function jumpToNeeds() {
    for (var k = 1; k <= bets.length; k++) {
      var idx = (current + k) % bets.length;
      if (bets[idx].approval && !bets[idx].resolved) {
        if (document.documentElement.getAttribute("data-mode") === "portfolio") setMode("focus");
        goTo(idx);
        return;
      }
    }
    showToast("No decisions pending — all clear.", "approve");
  }

  var toastTimer;
  function showToast(msg, tone) {
    toastTxt.textContent = msg;
    var dot = toastEl.querySelector(".t-dot");
    dot.style.background = tone === "kill" ? "var(--red)" : (tone === "hold" ? "var(--amber)" : "var(--green)");
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* ---------- theme ---------- */
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("cslopslop-theme", t); } catch (e) {}
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = "light";
    setTheme(cur === "dark" ? "light" : "dark");
  });

  document.getElementById("prevBtn").addEventListener("click", function () { go(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { go(1); });
  document.getElementById("pfBtn").addEventListener("click", toggleMode);
  document.getElementById("needsPill").addEventListener("click", jumpToNeeds);

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    var mode = document.documentElement.getAttribute("data-mode");
    if (e.key === "ArrowRight" && mode === "focus") { go(1); }
    else if (e.key === "ArrowLeft" && mode === "focus") { go(-1); }
    else if (e.key === "p" || e.key === "P") { toggleMode(); }
    else if (e.key === "Escape" && mode === "portfolio") { setMode("focus"); }
    else if (e.key === "t" || e.key === "T") { document.getElementById("themeBtn").click(); }
    else if (/^[1-6]$/.test(e.key)) { if (mode === "portfolio") setMode("focus"); goTo(+e.key - 1); }
  });

  /* ---------- init ---------- */
  renderPeek();
  renderFocus();
  updateNeeds();
</script>
</body>
</html>
