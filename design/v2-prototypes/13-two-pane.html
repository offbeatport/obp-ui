<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C Slop Slop · Two-Pane</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f7f5f1;            /* warm paper */
    --pane:#fffdf9;          /* list/detail surface */
    --pane-2:#fbf9f4;
    --ink:#2b2722;           /* warm near-black */
    --ink-2:#6b645b;         /* secondary */
    --ink-3:#9a948a;
    --muted:#9b948a;
    --line:#ece7df;
    --line-2:#e2dccf;
    --sel:#fdeede;           /* selection wash */
    --sel-line:#f2cf9e;
    --accent:#e3852b;        /* one warm accent (amber/ochre) */
    --accent-ink:#b8650f;
    --green:#3da35d;
    --blue:#3b78d8;
    --violet:#7c5cdb;
    --amber:#d8930e;
    --red:#d6493f;
    --slate:#9a948a;
    --gray:#b4ada3;
    --shadow:0 1px 2px rgba(60,50,30,.05),0 8px 24px rgba(60,50,30,.06);
    --shadow-pop:0 12px 40px rgba(60,50,30,.18);
    --r:12px; --r-sm:8px; --r-lg:16px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
    overflow:hidden;
  }
  ::selection{background:var(--sel-line)}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  kbd{
    font-family:"JetBrains Mono",monospace;font-size:11px;
    background:var(--pane-2);border:1px solid var(--line-2);border-bottom-width:2px;
    border-radius:6px;padding:1px 6px;color:var(--ink-2);line-height:1.6;
  }

  /* ───── App frame ───── */
  .app{display:flex;flex-direction:column;height:100vh}

  /* Top toolbar */
  .toolbar{
    height:52px;flex:none;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--pane);border-bottom:1px solid var(--line);
    -webkit-app-region:drag;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
  .logo{width:22px;height:22px;border-radius:7px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;box-shadow:0 1px 0 rgba(0,0,0,.12) inset,0 2px 6px rgba(227,133,43,.35)}
  .brand small{color:var(--muted);font-weight:500;font-size:12px;margin-left:2px}
  .tb-tabs{display:flex;gap:2px;background:var(--pane-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tb-tab{font-size:13px;font-weight:600;color:var(--ink-2);padding:5px 13px;border-radius:7px;transition:.14s var(--ease)}
  .tb-tab.on{background:var(--pane);color:var(--ink);box-shadow:var(--shadow)}
  .tb-tab:hover:not(.on){color:var(--ink)}
  .tb-spacer{flex:1}
  .cmdk{
    display:flex;align-items:center;gap:8px;min-width:300px;max-width:420px;
    background:var(--pane-2);border:1px solid var(--line-2);border-radius:10px;
    padding:7px 11px;color:var(--muted);font-size:13px;transition:.16s var(--ease);cursor:text;
  }
  .cmdk:hover{border-color:var(--accent);background:var(--pane)}
  .cmdk svg{width:15px;height:15px;opacity:.7}
  .cmdk .grow{flex:1}
  .needs-pill{
    display:flex;align-items:center;gap:7px;background:#fdf0e0;border:1px solid var(--sel-line);
    color:var(--accent-ink);font-weight:600;font-size:12.5px;padding:6px 11px;border-radius:9px;
  }
  .needs-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(227,133,43,.5);animation:ping 1.8s infinite}

  /* ───── Two-pane split ───── */
  .split{flex:1;display:flex;min-height:0}
  .list{
    width:340px;min-width:248px;max-width:560px;flex:none;
    background:var(--pane);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .divider{
    width:7px;flex:none;cursor:col-resize;margin:0 -3px;z-index:5;position:relative;
  }
  .divider::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:transparent;transition:.15s}
  .divider:hover::after,.divider.drag::after{background:var(--accent)}
  .detail{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}

  /* List header */
  .list-head{flex:none;padding:14px 16px 8px}
  .list-title{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .list-sub{color:var(--muted);font-size:12px;margin-top:1px}
  .list-search{
    margin:10px 0 2px;display:flex;align-items:center;gap:8px;
    background:var(--pane-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  }
  .list-search input{border:none;background:none;outline:none;flex:1;font:inherit;color:var(--ink)}
  .list-search input::placeholder{color:var(--muted)}
  .list-search svg{width:14px;height:14px;color:var(--muted)}

  .list-scroll{flex:1;overflow-y:auto;padding:4px 10px 16px}
  .grp-head{
    display:flex;align-items:center;gap:8px;padding:14px 6px 6px;
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  }
  .grp-head .cnt{background:var(--line);color:var(--ink-2);border-radius:20px;padding:1px 8px;font-size:11px;letter-spacing:0}
  .grp-head.needs{color:var(--accent-ink)}
  .grp-head.needs .cnt{background:#fbe2c4;color:var(--accent-ink)}

  .row{
    display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);
    cursor:pointer;transition:background .13s var(--ease);position:relative;margin:1px 0;
  }
  .row:hover{background:var(--pane-2)}
  .row.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-line)}
  .row.sel:hover{background:var(--sel)}
  .ico{
    width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;
  }
  .row-main{flex:1;min-width:0}
  .row-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
  .row-name .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .row-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
  .row-mrr{font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .badge-need{
    background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;
    padding:2px 7px;border-radius:20px;text-transform:uppercase;
  }
  .stat-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .stat-dot.building{animation:pulse 1.4s infinite}
  .mini-prog{display:flex;gap:2px;margin-top:5px}
  .mini-prog i{height:3px;flex:1;border-radius:2px;background:var(--line-2)}
  .mini-prog i.done{background:var(--green)}

  /* ───── Detail pane ───── */
  .det-scroll{flex:1;overflow-y:auto}
  .det-wrap{max-width:860px;margin:0 auto;padding:24px 30px 120px}

  .det-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
  .det-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none;box-shadow:var(--shadow)}
  .det-title{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .det-thesis{color:var(--ink-2);font-size:14.5px;margin-top:3px;max-width:560px}
  .det-meta{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
  .dm{display:flex;flex-direction:column}
  .dm b{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .dm span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:1px}
  .det-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13px;text-decoration:none}
  .det-link:hover{text-decoration:underline}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.active{background:#e7f4ea;color:#2a7b44}
  .pill.paused{background:#fbf0d8;color:#9a7411}

  .sec{margin-top:28px}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .sec-h h3{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin:0}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}

  /* Approval gate card */
  .gate{
    border:1.5px solid var(--sel-line);border-radius:var(--r-lg);overflow:hidden;
    background:linear-gradient(180deg,#fffaf2,#fffdf9);box-shadow:0 10px 30px rgba(216,147,14,.12);
  }
  .gate-top{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .gate-flag{background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:7px;text-transform:uppercase;flex:none}
  .gate-ttl{font-weight:700;font-size:15px}
  .gate-ttl small{color:var(--muted);font-weight:500}
  .gate-attempt{margin-left:auto;color:var(--muted);font-size:12px}
  .gate-body{padding:16px 18px}
  .gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:680px){.gate-grid{grid-template-columns:1fr}}
  .gbox{background:var(--pane-2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
  .gbox .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
  .gbox .url{font-size:13px;color:var(--blue);word-break:break-all;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .gbox .url:hover{text-decoration:underline}
  .check-ok{display:flex;align-items:center;gap:9px}
  .check-badge{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
  .check-badge svg{width:13px;height:13px;color:#fff}
  .check-ok .txt b{color:#2a7b44}
  .check-ok .txt span{display:block;font-size:11.5px;color:var(--muted)}

  .diff{
    background:#fbf9f4;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12.5px;
  }
  .diff-h{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:600}
  .diff pre{margin:0;padding:10px 0;overflow-x:auto}
  .diff .ln{display:block;padding:1px 14px;white-space:pre;font-family:"JetBrains Mono",monospace;line-height:1.65}
  .diff .ln.add{background:#eaf6ed;color:#266b3c}
  .diff .ln.add::before{content:"+ ";color:#3da35d}
  .diff .ln.ctx{color:var(--ink-2)}
  .diff .ln.ctx::before{content:"  ";color:transparent}

  .gate-actions{display:flex;align-items:center;gap:10px;margin-top:16px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:10px;transition:.14s var(--ease)}
  .btn-pri{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(61,163,93,.35)}
  .btn-pri:hover{background:#369553;transform:translateY(-1px)}
  .btn-pri:active{transform:translateY(0)}
  .btn-ghost{background:var(--pane);border:1px solid var(--line-2);color:var(--ink-2)}
  .btn-ghost:hover{border-color:var(--red);color:var(--red)}
  .gate-hint{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .gate-flash{
    margin-top:14px;border-radius:10px;padding:11px 15px;font-weight:600;font-size:13.5px;
    display:none;align-items:center;gap:9px;animation:flash .3s var(--ease);
  }
  .gate-flash.ok{display:flex;background:#e7f4ea;color:#2a7b44;border:1px solid #bfe3c9}
  .gate-flash.rej{display:flex;background:#fdeceb;color:#b53a31;border:1px solid #f3c7c3}
  .reject-box{display:none;margin-top:12px}
  .reject-box.show{display:block;animation:flash .25s var(--ease)}
  .reject-box textarea{
    width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font:inherit;
    resize:vertical;min-height:64px;background:var(--pane);outline:none;color:var(--ink);
  }
  .reject-box textarea:focus{border-color:var(--accent)}
  .reject-box .ra{display:flex;gap:8px;margin-top:8px}

  /* Backlog slices */
  .slice{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r);
    background:var(--pane);border:1px solid var(--line);margin-bottom:7px;transition:.13s var(--ease);
  }
  .slice:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .slice.await{border-color:var(--sel-line);background:#fffaf2}
  .s-n{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--pane-2);color:var(--ink-2);border:1px solid var(--line)}
  .s-main{flex:1;min-width:0}
  .s-title{font-weight:500;font-size:14px}
  .s-note{font-size:12px;color:var(--muted);margin-top:1px}
  .s-stat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;flex:none}
  .s-stat .d{width:7px;height:7px;border-radius:50%}
  .s-stat.shipped{background:#e7f4ea;color:#2a7b44}
  .s-stat.building{background:#e6effb;color:#2c5fb0}
  .s-stat.awaiting_approval{background:#f1ebfb;color:#5e44b8}
  .s-stat.todo{background:#f0ede7;color:#7a746a}
  .s-stat.blocked{background:#fdeceb;color:#b53a31}
  .s-stat.building .d{animation:pulse 1.3s infinite}
  .s-pri{font-size:11.5px;color:var(--muted);flex:none;font-weight:600}

  /* Chat */
  .chat-list{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .msg.assistant{background:var(--pane);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
  .msg.user{background:var(--accent);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;box-shadow:0 2px 8px rgba(227,133,43,.3)}
  .chat-bar{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--pane);border:1px solid var(--line-2);border-radius:13px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
  .chat-bar input{flex:1;border:none;outline:none;background:none;font:inherit;color:var(--ink)}
  .chat-bar input::placeholder{color:var(--muted)}
  .chat-send{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:.14s}
  .chat-send:hover{filter:brightness(1.05)}
  .chat-send svg{width:16px;height:16px}

  /* ───── Overview screen ───── */
  .overview{position:absolute;inset:52px 0 0 0;overflow-y:auto;background:var(--bg);display:none}
  .overview.show{display:block}
  .ov-wrap{max-width:1080px;margin:0 auto;padding:26px 30px 140px}
  .ov-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:8px}
  @media(max-width:820px){.ov-metrics{grid-template-columns:repeat(2,1fr)}}
  .metric{background:var(--pane);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
  .metric b{font-size:25px;font-weight:700;letter-spacing:-.02em}
  .metric span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:3px}
  .metric.alert b{color:var(--accent)}
  .ov-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:26px}
  @media(max-width:900px){.ov-cols{grid-template-columns:1fr}}
  .co-card{display:flex;align-items:center;gap:13px;padding:13px 15px;background:var(--pane);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;cursor:pointer;transition:.13s var(--ease)}
  .co-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .opp{padding:13px 15px;background:var(--pane);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px}
  .opp-top{display:flex;align-items:center;gap:10px}
  .opp-score{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:13px;padding:3px 9px;border-radius:8px}
  .opp-thought{font-size:12.5px;color:var(--muted);font-style:italic;margin:5px 0 9px}
  .opp-btn{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;background:var(--accent);color:#fff;transition:.13s}
  .opp-btn:hover{filter:brightness(1.05)}
  .opp.killed{opacity:.55}
  .opp.killed .opp-btn{background:var(--line-2);color:var(--muted);pointer-events:none}
  .nextmove{display:flex;gap:10px;padding:11px 14px;background:var(--pane);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;font-size:13.5px}
  .nextmove .num{width:20px;height:20px;flex:none;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
  .ov-cmd{position:sticky;bottom:0;margin:18px auto 0;max-width:1080px}
  .ov-cmd .chat-bar{box-shadow:var(--shadow-pop)}

  /* ───── Live activity strip ───── */
  .activity{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--pane);border-top:1px solid var(--line-2);box-shadow:0 -6px 24px rgba(60,50,30,.08);
    transition:.2s var(--ease);
  }
  .act-bar{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer}
  .act-live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;flex:none}
  .act-live .d{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.3s infinite}
  .act-latest{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act-latest b{color:var(--ink);font-weight:600}
  .act-chev{color:var(--muted);transition:.2s;flex:none}
  .activity.open .act-chev{transform:rotate(180deg)}
  .act-full{max-height:0;overflow:hidden;transition:max-height .25s var(--ease)}
  .activity.open .act-full{max-height:340px;overflow-y:auto}
  .act-inner{padding:4px 18px 16px}
  .act-grp{margin-top:12px}
  .act-grp-h{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .act-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--ink-2)}
  .act-item .ad{width:7px;height:7px;border-radius:50%;flex:none}
  .act-item.run .ad{animation:pulse 1.3s infinite}
  .act-item .at{margin-left:auto;font-size:11.5px;color:var(--muted);flex:none}

  /* Corner badge */
  .badge{position:fixed;right:14px;bottom:64px;z-index:60;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:9px;box-shadow:var(--shadow-pop);letter-spacing:.01em}
  .badge .mono{color:var(--accent)}

  /* animations */
  @keyframes pulse{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 5px transparent;opacity:.6}100%{opacity:1}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(227,133,43,.5)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @keyframes flash{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .det-wrap{animation:fadein .2s var(--ease)}
</style>
</head>
<body>
<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="brand"><span class="logo">C</span>C Slop Slop <small>command center</small></div>
    <div class="tb-tabs">
      <button class="tb-tab on" id="tab-co" onclick="showCompanies()">Companies</button>
      <button class="tb-tab" id="tab-ov" onclick="showOverview()">Overview</button>
    </div>
    <div class="tb-spacer"></div>
    <div class="needs-pill"><span class="dot"></span>1 needs you</div>
    <div class="cmdk" onclick="document.getElementById('listSearch').focus()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <span class="grow">Search or command…</span>
      <kbd>⌘K</kbd>
    </div>
  </div>

  <!-- Two-pane split -->
  <div class="split" id="split">
    <!-- LEFT: list -->
    <aside class="list" id="listPane">
      <div class="list-head">
        <div class="list-title">Companies</div>
        <div class="list-sub">5 active bets · $695 MRR</div>
        <div class="list-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
          <input id="listSearch" placeholder="Filter companies…" oninput="filterList(this.value)" />
        </div>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </aside>

    <div class="divider" id="divider"></div>

    <!-- RIGHT: detail -->
    <main class="detail">
      <div class="det-scroll" id="detScroll"></div>
    </main>
  </div>

  <!-- Overview (toggle screen) -->
  <div class="overview" id="overview">
    <div class="ov-wrap">
      <h2 style="font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0 0 16px">Portfolio</h2>
      <div class="ov-metrics" id="ovMetrics"></div>
      <div class="ov-cols">
        <div>
          <div class="sec-h"><h3>Companies</h3><div class="ln"></div></div>
          <div id="ovCompanies"></div>
          <div class="sec-h" style="margin-top:24px"><h3>Next moves</h3><div class="ln"></div></div>
          <div id="ovMoves"></div>
        </div>
        <div>
          <div class="sec-h"><h3>Opportunities</h3><div class="ln"></div></div>
          <div id="ovOpps"></div>
        </div>
      </div>
      <div class="ov-cmd">
        <div class="chat-bar">
          <input placeholder="Ask, command, or start a thought…  e.g. promote PayoutReconciler" onkeydown="if(event.key==='Enter')this.value=''" />
          <button class="chat-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Live activity strip -->
<div class="activity" id="activity">
  <div class="act-bar" onclick="toggleActivity()">
    <div class="act-live"><span class="d"></span>Live</div>
    <div class="act-latest" id="actLatest"></div>
    <svg class="act-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m18 15-6-6-6 6"/></svg>
  </div>
  <div class="act-full"><div class="act-inner" id="actInner"></div></div>
</div>

<div class="badge">13 · <span class="mono">Two-Pane</span></div>

<script>
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress — same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped — no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 — writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 — running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed — GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog — slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked — no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) — it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed — want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice — one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* color helpers */
const STATUS_COLOR = { active:'var(--green)', paused:'var(--amber)', archived:'var(--gray)' };
const SLICE_COLOR  = { todo:'var(--slate)', building:'var(--blue)', awaiting_approval:'var(--violet)', shipped:'var(--green)', blocked:'var(--red)' };
const ICO_BG = { leadsift:'#e3852b', quietinbox:'#3b78d8', translatorbill:'#7c5cdb', datadrop:'#3da35d', redditpainbot:'#b4ada3' };
const SLICE_LABEL = { todo:'To do', building:'Building', awaiting_approval:'Needs you', shipped:'Shipped', blocked:'Blocked' };
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const initials = n => n.replace(/([A-Z])/g,' $1').trim().split(' ').slice(0,2).map(w=>w[0]).join('');

let selected = 'leadsift';

/* ───── LIST ───── */
function shippedCount(c){ if(c.slices) return c.slices.filter(s=>s.status==='shipped').length; return c.slicesShipped||0; }
function totalSlices(c){ return c.slices ? c.slices.length : (c.slicesShipped||0)+1; }

function metaLine(c){
  if(c.needsYou) return 'Slice 5 · daily digest awaiting approval';
  if(c.currentSlice){
    const s=c.currentSlice;
    if(s.status==='building') return 'Building slice '+s.n+' · '+s.step;
    if(s.status==='blocked') return 'Blocked · slice '+s.n;
    if(s.status==='todo') return 'Next: slice '+s.n+' · '+s.title;
  }
  return c.thesis;
}

function rowHTML(c){
  const sel = c.id===selected ? ' sel' : '';
  const done = shippedCount(c), tot = totalSlices(c);
  let dotState = c.currentSlice && c.currentSlice.status==='building' ? 'building' : '';
  let dotColor = c.needsYou ? 'var(--violet)' : (c.currentSlice ? SLICE_COLOR[c.currentSlice.status]||SLICE_COLOR.todo : 'var(--green)');
  const bars = Array.from({length:tot},(_,i)=>'<i class="'+(i<done?'done':'')+'"></i>').join('');
  return `<div class="row${sel}" data-id="${c.id}" data-name="${c.name.toLowerCase()}" onclick="selectCompany('${c.id}')">
    <div class="ico" style="background:${ICO_BG[c.id]}">${initials(c.name)}</div>
    <div class="row-main">
      <div class="row-name"><span class="stat-dot ${dotState}" style="background:${dotColor};color:${dotColor}"></span><span class="truncate">${c.name}</span></div>
      <div class="row-meta">${esc(metaLine(c))}</div>
      <div class="mini-prog">${bars}</div>
    </div>
    <div class="row-right">
      ${c.needsYou?'<span class="badge-need">Needs you</span>':'<span class="row-mrr">$'+c.mrr+'</span>'}
    </div>
  </div>`;
}

function renderList(filter=''){
  const groups = { needs:[], active:[], paused:[] };
  DATA.companies.forEach(c=>{
    if(filter && !c.name.toLowerCase().includes(filter.toLowerCase())) return;
    if(c.needsYou) groups.needs.push(c);
    else if(c.status==='paused') groups.paused.push(c);
    else groups.active.push(c);
  });
  let html='';
  if(groups.needs.length){
    html+=`<div class="grp-head needs">Needs you<span class="cnt">${groups.needs.length}</span></div>`;
    html+=groups.needs.map(rowHTML).join('');
  }
  if(groups.active.length){
    html+=`<div class="grp-head">Active<span class="cnt">${groups.active.length}</span></div>`;
    html+=groups.active.map(rowHTML).join('');
  }
  if(groups.paused.length){
    html+=`<div class="grp-head">Paused<span class="cnt">${groups.paused.length}</span></div>`;
    html+=groups.paused.map(rowHTML).join('');
  }
  if(!html) html='<div style="padding:30px;text-align:center;color:var(--muted)">No companies match.</div>';
  document.getElementById('listScroll').innerHTML=html;
}
function filterList(v){ renderList(v); }

/* ───── DETAIL ───── */
function selectCompany(id){
  selected=id;
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel', r.dataset.id===id));
  renderDetail(id);
  document.getElementById('detScroll').scrollTop=0;
}

function renderDetail(id){
  const c = DATA.companies.find(x=>x.id===id);
  const statusPill = c.status==='paused'
    ? '<span class="pill paused"><span class="d" style="background:var(--amber)"></span>Paused</span>'
    : '<span class="pill active"><span class="d" style="background:var(--green)"></span>Active</span>';

  let body = `<div class="det-wrap">
    <div class="det-head">
      <div class="det-ico" style="background:${ICO_BG[c.id]}">${initials(c.name)}</div>
      <div style="flex:1">
        <div class="det-title">${c.name} ${statusPill}</div>
        <div class="det-thesis">${esc(c.thesis)}</div>
        <div class="det-meta">
          <div class="dm"><b class="mono">$${c.mrr}</b><span>MRR</span></div>
          <div class="dm"><b class="mono">${c.users}</b><span>Users</span></div>
          <div class="dm"><b class="mono">${shippedCount(c)}</b><span>Slices shipped</span></div>
          <div class="dm">${c.previewUrl?`<a class="det-link" href="${c.previewUrl}" target="_blank">${c.domain||c.previewUrl.replace('http://','')} ↗</a>`:'<b style="color:var(--muted);font-size:14px">no domain yet</b>'}</div>
        </div>
      </div>
    </div>`;

  /* Approval gate (LeadSift) */
  if(c.approval){
    const a=c.approval;
    body += `<div class="sec">
      <div class="sec-h"><h3>Approval gate</h3><div class="ln"></div></div>
      <div class="gate">
        <div class="gate-top">
          <span class="gate-flag">Needs you</span>
          <div class="gate-ttl">Slice ${a.slice} &nbsp;<small>${esc(a.title)}</small></div>
          <span class="gate-attempt">attempt ${a.attempt}</span>
        </div>
        <div class="gate-body">
          <div class="gate-grid">
            <div class="gbox">
              <div class="lbl">Live preview</div>
              <a class="url" href="${a.previewUrl}" target="_blank">${a.previewUrl}
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
            </div>
            <div class="gbox">
              <div class="lbl">doneWhen check</div>
              <div class="check-ok">
                <span class="check-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>
                <div class="txt"><b>${a.checkResult}</b><span>${esc(a.doneWhen)}</span></div>
              </div>
            </div>
          </div>
          <div class="diff">
            <div class="diff-h">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6h6M15 6l4 4M5 6l-2 2 2 2"/></svg>
              DailyDigest.tsx · +5 −0
            </div>
            <pre>${a.diff.split('\n').map(l=>{
              if(l.startsWith('+ ')) return '<span class="ln add">'+esc(l.slice(2))+'</span>';
              return '<span class="ln ctx">'+esc(l.replace(/^\s{0,2}/,''))+'</span>';
            }).join('')}</pre>
          </div>
          <div class="gate-actions">
            <button class="btn btn-pri" onclick="approve()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
              Approve & ship
            </button>
            <button class="btn btn-ghost" onclick="toggleReject()">Reject with feedback</button>
            <span class="gate-hint"><kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>Esc</kbd> overview</span>
          </div>
          <div class="reject-box" id="rejectBox">
            <textarea id="rejectText" placeholder="What needs to change before this ships? (sent back to the build)"></textarea>
            <div class="ra">
              <button class="btn btn-ghost" style="border-color:var(--red);color:var(--red)" onclick="reject()">Send rejection</button>
              <button class="btn btn-ghost" onclick="toggleReject()">Cancel</button>
            </div>
          </div>
          <div class="gate-flash" id="gateFlash"></div>
        </div>
      </div>
    </div>`;
  }

  /* Backlog */
  if(c.slices){
    body += `<div class="sec">
      <div class="sec-h"><h3>Backlog</h3><div class="ln"></div><span style="font-size:12px;color:var(--muted)">${c.slices.length} slices</span></div>`;
    body += c.slices.map(s=>{
      const isAwait = s.status==='awaiting_approval';
      return `<div class="slice ${isAwait?'await':''}">
        <div class="s-n">${s.n}</div>
        <div class="s-main">
          <div class="s-title">${esc(s.title)}</div>
          ${s.note?'<div class="s-note">'+esc(s.note)+'</div>':(s.dependsOn?'<div class="s-note">depends on slice '+s.dependsOn.join(', ')+'</div>':'')}
        </div>
        ${s.priority?'<span class="s-pri mono">P'+s.priority+'</span>':''}
        <span class="s-stat ${s.status}"><span class="d" style="background:${SLICE_COLOR[s.status]}"></span>${SLICE_LABEL[s.status]}</span>
      </div>`;
    }).join('');
    body += `</div>`;
  } else if(c.currentSlice){
    const s=c.currentSlice;
    body += `<div class="sec">
      <div class="sec-h"><h3>Current slice</h3><div class="ln"></div></div>
      <div class="slice ${s.status==='awaiting_approval'?'await':''}">
        <div class="s-n">${s.n}</div>
        <div class="s-main"><div class="s-title">${esc(s.title)}</div><div class="s-note">${esc(s.step)}</div></div>
        <span class="s-stat ${s.status}"><span class="d" style="background:${SLICE_COLOR[s.status]}"></span>${SLICE_LABEL[s.status]}</span>
      </div>
      <div style="color:var(--muted);font-size:13px;margin-top:8px;padding:0 4px">${c.slicesShipped} slices shipped so far. Full backlog opens when this company is fully wired.</div>
    </div>`;
  }

  /* Chat */
  body += `<div class="sec">
    <div class="sec-h"><h3>Chat</h3><div class="ln"></div></div>
    <div class="chat-list" id="chatList">${DATA.chat.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join('')}</div>
    <div class="chat-bar">
      <input id="chatInput" placeholder="Message ${c.name}…" onkeydown="if(event.key==='Enter')sendChat()" />
      <button class="chat-send" onclick="sendChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </div>`;

  body += `</div>`;
  document.getElementById('detScroll').innerHTML=body;
}

/* approval interactions */
function flash(cls,text){
  const f=document.getElementById('gateFlash');
  if(!f) return;
  f.className='gate-flash '+cls;
  f.innerHTML=text;
}
function approve(){
  flash('ok','<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Approved ✓ — slice 5 shipped & marked live');
  const box=document.getElementById('rejectBox'); if(box) box.classList.remove('show');
}
function toggleReject(){
  const box=document.getElementById('rejectBox');
  if(box){ box.classList.toggle('show'); if(box.classList.contains('show')) setTimeout(()=>document.getElementById('rejectText').focus(),50); }
}
function reject(){
  const t=(document.getElementById('rejectText').value||'').trim();
  flash('rej','✕ Rejected — feedback sent back to the build'+(t?': “'+esc(t)+'”':''));
  document.getElementById('rejectBox').classList.remove('show');
}

/* chat */
function sendChat(){
  const i=document.getElementById('chatInput'); const v=(i.value||'').trim(); if(!v) return;
  const list=document.getElementById('chatList');
  list.insertAdjacentHTML('beforeend','<div class="msg user">'+esc(v)+'</div>');
  i.value='';
  setTimeout(()=>{
    list.insertAdjacentHTML('beforeend','<div class="msg assistant">On it — I’ll route that to the build and report back here.</div>');
    document.getElementById('detScroll').scrollTop=document.getElementById('detScroll').scrollHeight;
  },450);
  document.getElementById('detScroll').scrollTop=document.getElementById('detScroll').scrollHeight;
}

/* ───── OVERVIEW ───── */
function renderOverview(){
  const p=DATA.portfolio;
  document.getElementById('ovMetrics').innerHTML=[
    ['$'+p.mrr,'MRR',''],[p.users,'Users',''],[p.activeCompanies,'Active',''],
    [p.slicesShipped,'Slices shipped',''],[p.needsYou,'Needs you','alert']
  ].map(m=>`<div class="metric ${m[2]}"><b class="mono">${m[0]}</b><span>${m[1]}</span></div>`).join('');

  document.getElementById('ovCompanies').innerHTML=DATA.companies.map(c=>{
    const dotColor=c.needsYou?'var(--violet)':STATUS_COLOR[c.status];
    return `<div class="co-card" onclick="openFromOverview('${c.id}')">
      <div class="ico" style="background:${ICO_BG[c.id]}">${initials(c.name)}</div>
      <div style="flex:1;min-width:0">
        <div class="row-name"><span class="stat-dot" style="background:${dotColor}"></span>${c.name}</div>
        <div class="row-meta">${esc(metaLine(c))}</div>
      </div>
      ${c.needsYou?'<span class="badge-need">Needs you</span>':'<span class="row-mrr">$'+c.mrr+' · '+c.users+'u</span>'}
    </div>`;
  }).join('');

  document.getElementById('ovMoves').innerHTML=DATA.nextMoves.map((m,i)=>
    `<div class="nextmove"><span class="num">${i+1}</span><span>${esc(m)}</span></div>`).join('');

  document.getElementById('ovOpps').innerHTML=DATA.opportunities.map(o=>{
    const killed=o.status==='killed';
    const sc = o.score>=80?'#e7f4ea;color:#2a7b44':o.score>=60?'#fbf0d8;color:#9a7411':'#f0ede7;color:#7a746a';
    return `<div class="opp ${killed?'killed':''}">
      <div class="opp-top">
        <span class="opp-score" style="background:${sc}">${o.score}</span>
        <b style="flex:1">${o.title}</b>
        <button class="opp-btn" onclick="promote('${o.title}',this)">${killed?'Killed':'Promote'}</button>
      </div>
      <div class="opp-thought">“${esc(o.thought)}”</div>
      <div style="font-size:13px;color:var(--ink-2)">${esc(o.thesis)}</div>
    </div>`;
  }).join('');
}
function promote(name,btn){
  btn.textContent='Promoted ✓'; btn.style.background='var(--green)';
  setTimeout(()=>{ btn.textContent='Promote'; btn.style.background=''; },1600);
}
function openFromOverview(id){ showCompanies(); selectCompany(id); }

/* ───── SCREEN TOGGLE ───── */
function showOverview(){
  document.getElementById('overview').classList.add('show');
  document.getElementById('tab-ov').classList.add('on');
  document.getElementById('tab-co').classList.remove('on');
}
function showCompanies(){
  document.getElementById('overview').classList.remove('show');
  document.getElementById('tab-co').classList.add('on');
  document.getElementById('tab-ov').classList.remove('on');
}

/* ───── ACTIVITY ───── */
function renderActivity(){
  const latest=DATA.activity[0];
  document.getElementById('actLatest').innerHTML=`<b>${latest.co}</b> — ${esc(latest.text)}`;
  const byCo={};
  DATA.activity.forEach(a=>{ (byCo[a.co]=byCo[a.co]||[]).push(a); });
  let html='';
  Object.keys(byCo).forEach(co=>{
    html+=`<div class="act-grp"><div class="act-grp-h">${co}</div>`;
    html+=byCo[co].map(a=>`<div class="act-item ${a.running?'run':''}">
      <span class="ad" style="background:${kindColor(a.kind)};color:${kindColor(a.kind)}"></span>
      <span>${esc(a.text)}</span><span class="at">${a.t}</span></div>`).join('');
    html+=`</div>`;
  });
  document.getElementById('actInner').innerHTML=html;
}
function kindColor(k){
  return {building:'var(--blue)',deploy:'var(--blue)',await:'var(--violet)',check:'var(--green)',reprioritize:'var(--slate)',blocked:'var(--red)'}[k]||'var(--slate)';
}
function toggleActivity(){ document.getElementById('activity').classList.toggle('open'); }

/* ───── RESIZABLE DIVIDER ───── */
(function(){
  const div=document.getElementById('divider'), pane=document.getElementById('listPane');
  let dragging=false;
  div.addEventListener('mousedown',e=>{ dragging=true; div.classList.add('drag'); document.body.style.cursor='col-resize'; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    let w=Math.max(248,Math.min(560,e.clientX));
    pane.style.width=w+'px';
  });
  window.addEventListener('mouseup',()=>{ dragging=false; div.classList.remove('drag'); document.body.style.cursor=''; });
})();

/* ───── KEYBOARD ───── */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){
    if(document.getElementById('rejectBox')&&document.getElementById('rejectBox').classList.contains('show')){ toggleReject(); return; }
    showOverview(); return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('listSearch').focus(); return; }
  if(typing) return;
  if(e.key==='a'||e.key==='A'){ if(document.getElementById('gateFlash'))approve(); }
  if(e.key==='r'||e.key==='R'){ if(document.getElementById('rejectBox')){ e.preventDefault(); toggleReject(); } }
  if(e.key==='j'||e.key==='k'){
    const ids=DATA.companies.map(c=>c.id); let i=ids.indexOf(selected);
    i = e.key==='j' ? Math.min(ids.length-1,i+1) : Math.max(0,i-1);
    showCompanies(); selectCompany(ids[i]);
    const r=document.querySelector('.row.sel'); if(r) r.scrollIntoView({block:'nearest'});
  }
});

/* init */
renderList();
renderDetail('leadsift');
renderOverview();
renderActivity();
</script>
</body>
</html>
