<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop - Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #1e2127;
    --bg-2:      #21252b;
    --bg-3:      #282c34;
    --bg-4:      #2c313a;
    --panel:     #1b1e24;
    --line:      #181a1f;
    --border:    #30353f;
    --border-2:  #3a4150;
    --fg:        #abb2bf;
    --fg-2:      #7d8590;
    --fg-3:      #5c6370;
    --fg-hi:     #e6edf3;
    --accent:    #61afef;
    --green:     #98c379;
    --green-bg:  rgba(152,195,121,.13);
    --amber:     #e5c07b;
    --violet:    #c678dd;
    --blue:      #61afef;
    --red:       #e06c75;
    --slate:     #6b7280;
    --tab-h:     35px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--fg);
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(97,175,239,.3); }
  /* scrollbars */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #4a5263; background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ===== Shell grid ===== */
  #shell {
    display: grid;
    grid-template-columns: 48px var(--explorer-w, 256px) 1fr;
    grid-template-rows: 1fr 24px;
    height: 100vh;
    width: 100vw;
  }
  #activitybar { grid-row: 1 / 3; }

  /* ===== Activity bar (far left) ===== */
  #activitybar {
    background: var(--line);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
    gap: 2px;
  }
  .abtn {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-3); cursor: pointer; position: relative;
    border-left: 2px solid transparent;
  }
  .abtn:hover { color: var(--fg-hi); }
  .abtn.active { color: var(--fg-hi); border-left-color: var(--accent); }
  .abtn svg { width: 23px; height: 23px; }
  .abtn .dot {
    position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--violet); border: 2px solid var(--line);
  }
  #activitybar .spacer { flex: 1; }
  .ab-badge {
    position: absolute; bottom: 4px; right: 4px; min-width: 15px; height: 15px;
    font-size: 9px; font-weight: 700; border-radius: 8px; background: var(--violet);
    color: #1b1e24; display: flex; align-items: center; justify-content: center; padding: 0 4px;
    border: 1.5px solid var(--line);
  }

  /* ===== Explorer ===== */
  #explorer {
    grid-row: 1 / 2;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-width: 0; overflow: hidden;
  }
  .ex-head {
    height: 34px; display: flex; align-items: center; padding: 0 14px;
    font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--fg-2);
    font-weight: 600; flex: none; justify-content: space-between;
  }
  .ex-head .cmd-k { font-size: 10px; color: var(--fg-3); font-family: var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .ex-scroll { overflow-y: auto; flex: 1; padding-bottom: 12px; }

  .tree-section {
    font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--fg-3);
    padding: 8px 14px 4px; font-weight: 600; display:flex; align-items:center; gap:6px;
  }
  .tree-section .caret { transition: transform .15s; }

  .co-row {
    display: flex; align-items: center; gap: 7px; padding: 4px 14px 4px 12px;
    cursor: pointer; user-select: none; position: relative; min-height: 26px;
  }
  .co-row:hover { background: var(--bg-3); }
  .co-row.sel { background: rgba(97,175,239,.16); }
  .co-row.sel::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
  .co-caret { width: 12px; color: var(--fg-3); flex: none; transition: transform .15s; font-size: 10px; text-align:center; }
  .co-caret.open { transform: rotate(90deg); }
  .co-ico { width: 15px; height: 15px; flex: none; }
  .co-name { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .co-row.sel .co-name { color: var(--fg-hi); }
  .st-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .needs-pill {
    font-size: 9px; font-weight: 700; background: var(--violet); color: #1b1e24;
    border-radius: 8px; padding: 1px 6px; flex: none;
  }

  .slices { overflow: hidden; }
  .slice-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 14px 3px 38px;
    cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--fg-2);
    white-space: nowrap; overflow: hidden;
  }
  .slice-row:hover { background: var(--bg-3); color: var(--fg); }
  .slice-row .sl-ico { flex: none; font-size: 11px; }
  .slice-row .sl-n { color: var(--fg-3); flex: none; }
  .slice-row .sl-title { overflow: hidden; text-overflow: ellipsis; }
  .slice-row.await .sl-title { color: var(--amber); }
  .slice-row.building .sl-title { color: var(--blue); }
  .slice-row.blocked .sl-title { color: var(--red); }
  .pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ===== Main / editor area ===== */
  #main {
    grid-row: 1 / 2;
    display: grid;
    grid-template-rows: var(--tab-h) auto 1fr var(--drawer-h, 30px);
    min-width: 0; min-height: 0; background: var(--bg-3);
    position: relative;
  }

  /* tab bar */
  #tabbar {
    display: flex; background: var(--line); border-bottom: 1px solid var(--border);
    overflow-x: auto; overflow-y: hidden; flex: none; align-items: stretch;
  }
  #tabbar::-webkit-scrollbar { height: 0; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 0 11px 0 13px;
    height: var(--tab-h); background: var(--bg-2); color: var(--fg-2);
    border-right: 1px solid var(--line); cursor: pointer; white-space: nowrap;
    font-size: 12.5px; max-width: 220px; position: relative;
  }
  .tab.active { background: var(--bg-3); color: var(--fg-hi); }
  .tab.active::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--accent); }
  .tab .t-ico { width: 14px; height: 14px; flex: none; }
  .tab .t-label { overflow: hidden; text-overflow: ellipsis; }
  .tab .t-close {
    width: 17px; height: 17px; border-radius: 4px; display: flex; align-items: center;
    justify-content: center; color: var(--fg-3); font-size: 14px; flex: none;
  }
  .tab .t-close:hover { background: var(--border-2); color: var(--fg-hi); }
  .tab.dirty .t-close::before { content:'●'; font-size: 9px; }
  .tab.dirty:hover .t-close::before { content:'×'; font-size: 14px; }
  #tabbar .tab-spacer { flex: 1; min-width: 14px; background: var(--line); border-right: none; }

  /* breadcrumb */
  #breadcrumb {
    height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 16px;
    background: var(--bg-3); border-bottom: 1px solid var(--border); flex: none;
    font-size: 11.5px; color: var(--fg-3); font-family: var(--mono);
  }
  #breadcrumb .crumb { color: var(--fg-2); }
  #breadcrumb .crumb.last { color: var(--fg); }
  #breadcrumb .sep { color: var(--fg-3); }
  #breadcrumb .back-link { color: var(--accent); cursor: pointer; margin-left: auto; font-family: var(--sans); }
  #breadcrumb .back-link:hover { text-decoration: underline; }

  /* editor body scroll */
  #editor { overflow: auto; min-height: 0; position: relative; }
  #editor .view { display: none; }
  #editor .view.show { display: block; }

  /* sub-view tabs (overview/diff/preview/backlog) */
  #subtabs {
    display: none; height: 32px; background: var(--bg-2); border-bottom: 1px solid var(--border);
    align-items: stretch; padding: 0 8px; gap: 2px; flex: none;
  }
  #subtabs.show { display: flex; }
  .subtab {
    display: flex; align-items: center; gap: 7px; padding: 0 14px; cursor: pointer;
    color: var(--fg-2); font-size: 12px; border-bottom: 2px solid transparent; align-self: stretch;
  }
  .subtab:hover { color: var(--fg-hi); }
  .subtab.active { color: var(--fg-hi); border-bottom-color: var(--accent); }
  .subtab .badge { font-size: 9px; font-weight: 700; background: var(--violet); color: #1b1e24; border-radius: 8px; padding: 0 5px; }

  /* ===== content blocks ===== */
  .pad { padding: 22px 26px; }
  .h1 { font-size: 19px; font-weight: 700; color: var(--fg-hi); letter-spacing: -.2px; }
  .sub { color: var(--fg-2); margin-top: 3px; font-size: 12.5px; }
  .section-label { font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--fg-3); font-weight: 600; margin: 28px 0 12px; }

  /* metrics */
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 12px; margin-top: 18px; }
  .metric { background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px; }
  .metric .v { font-size: 24px; font-weight: 700; color: var(--fg-hi); font-family: var(--mono); letter-spacing: -1px; }
  .metric .l { font-size: 11px; color: var(--fg-2); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
  .metric.alert { border-color: var(--violet); background: rgba(198,120,221,.08); }
  .metric.alert .v { color: var(--violet); }

  /* company grid (overview) */
  .co-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap: 14px; }
  .co-card {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 15px 16px; cursor: pointer; transition: border-color .12s, transform .12s;
    display: flex; flex-direction: column; min-height: 0;
  }
  .co-card:hover { border-color: var(--border-2); transform: translateY(-1px); }
  .co-card.alert { border-color: var(--violet); box-shadow: 0 0 0 1px rgba(198,120,221,.25); }
  .co-card .row1 { display: flex; align-items: center; gap: 9px; }
  .co-card .cname { font-size: 15px; font-weight: 700; color: var(--fg-hi); }
  .co-card .cthesis { color: var(--fg-2); margin-top: 7px; font-size: 12px; line-height: 1.45; }
  .co-card .cmeta { display: flex; gap: 16px; margin-top: 13px; font-family: var(--mono); font-size: 11.5px; }
  .co-card .cmeta b { color: var(--fg-hi); font-weight: 600; }
  .co-card .cmeta span { color: var(--fg-3); }
  .co-card .cstrip {
    margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; display: flex; align-items: center; gap: 7px; color: var(--fg-2);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px;
  }
  .chip .st-dot { width: 7px; height: 7px; }

  /* opportunities */
  .opp-list { display: flex; flex-direction: column; gap: 10px; }
  .opp {
    display: flex; align-items: center; gap: 14px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 9px; padding: 12px 15px;
  }
  .opp.killed { opacity: .5; }
  .score-ring { flex: none; width: 46px; height: 46px; position: relative; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--fg-hi); }
  .opp .otit { font-weight: 700; color: var(--fg-hi); font-size: 14px; }
  .opp .othought { color: var(--fg-3); font-size: 11.5px; margin-top: 2px; font-style: italic; }
  .opp .othesis { color: var(--fg-2); font-size: 12px; margin-top: 4px; }
  .opp .ogrow { flex: 1; }
  .btn {
    font-family: var(--sans); font-size: 12px; font-weight: 600; border: 1px solid var(--border-2);
    background: var(--bg-3); color: var(--fg); border-radius: 7px; padding: 7px 14px; cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-4); border-color: var(--fg-3); }
  .btn.primary { background: var(--green); color: #15200d; border-color: var(--green); }
  .btn.primary:hover { background: #a9d18a; }
  .btn.violet { background: var(--violet); color: #1b1e24; border-color: var(--violet); }
  .btn.violet:hover { background: #d18ce4; }
  .btn.ghost-red:hover { background: rgba(224,108,117,.15); border-color: var(--red); color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* next moves */
  .moves { display: flex; flex-direction: column; gap: 8px; }
  .move { display: flex; align-items: center; gap: 11px; background: var(--bg-2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 7px; padding: 11px 14px; font-size: 12.5px; }
  .move .mnum { font-family: var(--mono); color: var(--fg-3); font-weight: 700; flex: none; }

  /* ===== command bar (overview chat) ===== */
  #cmdbar-wrap { padding: 0 26px 22px; }
  #cmdbar {
    display: flex; align-items: center; gap: 10px; background: var(--bg-2);
    border: 1px solid var(--border-2); border-radius: 10px; padding: 11px 14px;
  }
  #cmdbar:focus-within { border-color: var(--accent); }
  #cmdbar .prompt { color: var(--green); font-family: var(--mono); font-weight: 700; }
  #cmdbar input { flex: 1; background: none; border: none; outline: none; color: var(--fg-hi); font-family: var(--mono); font-size: 13px; }
  #cmdbar input::placeholder { color: var(--fg-3); }
  #cmdbar .hint { font-size: 10px; color: var(--fg-3); font-family: var(--mono); }

  /* ===== Approval gate (diff view) ===== */
  .gate-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .gate-head .gtitle { font-size: 16px; font-weight: 700; color: var(--fg-hi); }
  .pass-pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--green-bg);
    color: var(--green); border: 1px solid rgba(152,195,121,.35); border-radius: 20px;
    padding: 3px 11px; font-size: 11.5px; font-weight: 600; font-family: var(--mono);
  }

  .donewhen {
    margin-top: 16px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 9px;
    border-left: 3px solid var(--green); padding: 13px 15px; font-family: var(--mono); font-size: 12px;
  }
  .donewhen .dw-label { color: var(--fg-3); text-transform: uppercase; letter-spacing: .7px; font-size: 10px; margin-bottom: 6px; }
  .donewhen .dw-check { color: var(--fg); }
  .donewhen .dw-result { color: var(--green); margin-top: 7px; display: flex; align-items: center; gap: 7px; }

  .preview-bar {
    margin-top: 14px; display: flex; align-items: center; gap: 10px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 9px; padding: 9px 13px; font-family: var(--mono); font-size: 12px;
  }
  .preview-bar .pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .preview-bar a { color: var(--accent); text-decoration: none; }
  .preview-bar a:hover { text-decoration: underline; }
  .preview-bar .open-ext { margin-left: auto; }

  .browser {
    margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff;
  }
  .browser .bchrome {
    background: var(--bg-2); border-bottom: 1px solid var(--border); display: flex; align-items: center;
    gap: 8px; padding: 8px 12px;
  }
  .browser .bdots { display: flex; gap: 6px; }
  .browser .bdots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .browser .burl {
    flex: 1; background: var(--line); border-radius: 6px; padding: 4px 11px; color: var(--fg-2);
    font-family: var(--mono); font-size: 11px;
  }
  .browser .bbody { background: #f6f8fa; color: #24292f; padding: 24px 26px; font-family: var(--sans); min-height: 180px; }
  .browser .bbody h2 { font-size: 18px; color: #0d1117; margin-bottom: 4px; }
  .browser .bbody .bsub { color: #57606a; font-size: 12px; margin-bottom: 16px; }
  .browser .lead-item {
    display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eaeef2; font-size: 13px;
  }
  .browser .lead-item .sc { font-family: var(--mono); font-weight: 700; color: #1a7f37; width: 34px; }
  .browser .lead-item .nm { font-weight: 600; color: #0d1117; }
  .browser .lead-item .em { color: #57606a; margin-left: auto; font-family: var(--mono); font-size: 11px; }

  /* diff */
  .diff-wrap { margin-top: 16px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .diff-head { background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 8px 14px; font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); display: flex; gap: 10px; align-items:center;}
  .diff-head .add { color: var(--green); }
  .diff-body { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; background: var(--bg); padding: 8px 0; overflow-x: auto; }
  .diff-line { display: flex; white-space: pre; padding: 0 16px 0 0; }
  .diff-line .gut { width: 46px; flex: none; color: var(--fg-3); text-align: right; padding-right: 16px; user-select: none; }
  .diff-line.add { background: var(--green-bg); }
  .diff-line.add .gut { color: rgba(152,195,121,.7); }
  .diff-line.add .code { color: var(--green); }
  .diff-line .code { color: var(--fg-2); }

  /* approval action bar */
  .gate-actions {
    margin-top: 20px; display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .gate-actions .gtext { color: var(--fg-2); font-size: 12.5px; }
  .gate-actions .gtext b { color: var(--amber); }
  .gate-actions .gspace { flex: 1; }

  /* reject feedback */
  #rejectBox { margin-top: 12px; display: none; }
  #rejectBox.show { display: block; }
  #rejectBox textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border-2); border-radius: 8px; padding: 11px 13px;
    color: var(--fg-hi); font-family: var(--mono); font-size: 12.5px; resize: vertical; min-height: 64px; outline: none;
  }
  #rejectBox textarea:focus { border-color: var(--red); }
  #rejectBox .rj-actions { margin-top: 9px; display: flex; gap: 9px; justify-content: flex-end; }

  /* toast */
  #toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #15200d; font-weight: 700; padding: 11px 22px; border-radius: 9px;
    font-size: 13.5px; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200; display: flex; align-items: center; gap: 8px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.reject { background: var(--red); color: #2a0d0f; }

  /* backlog list */
  .backlog { display: flex; flex-direction: column; gap: 6px; }
  .bk-row {
    display: flex; align-items: center; gap: 12px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
  }
  .bk-row .bk-n { font-family: var(--mono); color: var(--fg-3); font-weight: 700; width: 26px; flex: none; }
  .bk-row .bk-t { flex: 1; }
  .bk-row.await { border-color: var(--amber); }
  .bk-row.blocked { border-color: rgba(224,108,117,.4); }
  .bk-row .bk-pri { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
  .bk-row .bk-note { font-family: var(--mono); font-size: 11px; color: var(--red); }
  .bk-row .bk-dep { font-family: var(--mono); font-size: 10.5px; color: var(--fg-3); background: var(--bg); padding: 1px 7px; border-radius: 5px; }

  /* ===== Company chat (right inspector) ===== */
  #inspector {
    position: absolute; top: 0; right: 0; bottom: var(--drawer-h, 30px); width: 320px;
    background: var(--panel); border-left: 1px solid var(--border); display: none;
    flex-direction: column; z-index: 30;
  }
  #inspector.show { display: flex; }
  #inspector .ins-head { height: 33px; display: flex; align-items: center; padding: 0 14px; font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--fg-2); font-weight: 600; border-bottom: 1px solid var(--border); justify-content: space-between; }
  #inspector .ins-head .x { cursor: pointer; color: var(--fg-3); font-size: 16px; }
  #inspector .ins-head .x:hover { color: var(--fg-hi); }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; font-size: 12.5px; line-height: 1.5; }
  .msg .who { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--fg-3); margin-bottom: 4px; }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble { background: var(--accent); color: #0a1622; }
  .msg .bubble { background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; color: var(--fg); }
  .chat-input { border-top: 1px solid var(--border); padding: 11px; display: flex; gap: 8px; align-items: center; }
  .chat-input input { flex: 1; background: var(--bg); border: 1px solid var(--border-2); border-radius: 8px; padding: 9px 12px; color: var(--fg-hi); font-size: 12.5px; outline: none; }
  .chat-input input:focus { border-color: var(--accent); }
  .chat-input .send { background: var(--accent); color: #0a1622; border: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; flex: none; }

  /* ===== Activity drawer (bottom, IDE terminal) ===== */
  #drawer {
    grid-row: 4 / 5; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative;
  }
  #drawer-resize {
    position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 5;
  }
  #drawer-resize:hover { background: rgba(97,175,239,.3); }
  .dr-tabs {
    height: 30px; display: flex; align-items: stretch; background: var(--panel);
    border-bottom: 1px solid var(--border); flex: none; padding-left: 4px;
  }
  .dr-tab {
    display: flex; align-items: center; gap: 8px; padding: 0 13px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .7px; color: var(--fg-3); border-bottom: 1px solid transparent; cursor: pointer; font-weight: 600;
  }
  .dr-tab.active { color: var(--fg-hi); border-bottom-color: var(--accent); }
  .dr-tab .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dr-actions { margin-left: auto; display: flex; align-items: center; padding-right: 10px; gap: 4px; }
  .dr-toggle { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--fg-3); cursor: pointer; border-radius: 5px; }
  .dr-toggle:hover { background: var(--bg-3); color: var(--fg-hi); }

  /* collapsed strip: single latest line shown in status bar area; drawer body hidden when collapsed */
  #drawer.collapsed { --drawer-h: 30px; }
  #drawer.collapsed .dr-body { display: none; }
  #drawer.collapsed .dr-tabs { display: none; }

  /* collapsed single-line bar lives inside the drawer when collapsed */
  #collapsedLine {
    display: none; height: 30px; align-items: center; gap: 10px; padding: 0 14px;
    font-family: var(--mono); font-size: 11.5px; cursor: pointer; background: var(--panel);
  }
  #drawer.collapsed #collapsedLine { display: flex; }
  #collapsedLine:hover { background: var(--bg-3); }
  #collapsedLine .lbl { color: var(--fg-3); text-transform: uppercase; letter-spacing: .6px; font-size: 10px; flex: none; }
  #collapsedLine .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  #collapsedLine .ctext { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #collapsedLine .cco { color: var(--violet); font-weight: 600; }
  #collapsedLine .more { color: var(--fg-3); flex: none; }
  #collapsedLine .chev { color: var(--fg-3); flex: none; }

  .dr-body { flex: 1; overflow-y: auto; padding: 8px 0 12px; font-family: var(--mono); }
  .act-group { padding: 6px 0; }
  .act-group .grp-co {
    padding: 5px 16px; font-size: 11px; color: var(--fg-2); font-weight: 600; display: flex; align-items: center; gap: 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .act-line {
    display: flex; align-items: baseline; gap: 12px; padding: 3px 16px 3px 30px; font-size: 12px; color: var(--fg-2);
  }
  .act-line:hover { background: var(--bg-3); }
  .act-line .t { color: var(--fg-3); width: 40px; flex: none; text-align: right; font-size: 11px; }
  .act-line .k { width: 92px; flex: none; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .act-line .x { flex: 1; color: var(--fg); }
  .act-line.running .x { color: var(--blue); }
  .run-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; }

  /* ===== status bar ===== */
  #statusbar {
    grid-column: 1 / 4; grid-row: 2 / 3; background: var(--accent); color: #0a1622;
    display: flex; align-items: center; gap: 0; font-size: 11.5px; font-family: var(--mono); height: 24px;
  }
  #statusbar.gate-mode { background: var(--violet); color: #1b1e24; }
  #statusbar .sb-item { display: flex; align-items: center; gap: 6px; padding: 0 11px; height: 100%; }
  #statusbar .sb-item.btn-like { cursor: pointer; }
  #statusbar .sb-item.btn-like:hover { background: rgba(0,0,0,.13); }
  #statusbar .sb-spacer { flex: 1; }
  #statusbar .sb-strong { font-weight: 700; }

  /* corner badge */
  #badge {
    position: fixed; bottom: 32px; right: 14px; z-index: 300; background: var(--line);
    color: var(--fg-hi); border: 1px solid var(--border-2); border-radius: 20px; padding: 5px 13px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    pointer-events: none;
  }
  #badge b { color: var(--accent); }

  .hint-strong { color: var(--fg); }
</style>
</head>
<body>

<div id="shell">

  <!-- ===== Activity bar ===== -->
  <div id="activitybar">
    <div class="abtn active" data-act="companies" title="Companies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>
    </div>
    <div class="abtn" data-act="opps" title="Opportunities">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3.2"/></svg>
    </div>
    <div class="abtn" data-act="live" title="Live Activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>

    </div>
    <div class="spacer"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></svg>
      <span class="ab-badge">1</span>

  <!-- ===== Explorer ===== -->
  <div id="explorer">

      <span>Explorer</span><span class="cmd-k">⌘K</span>
    </div>
    <div class="ex-scroll">
      <div class="tree-section"><span class="caret">▾</span> COMPANIES</div>
      <div id="coTree"></div>
    </div>
  </div>

  <!-- ===== Main editor ===== -->
  <div id="main">

    <div id="tabbar"></div>

    <div id="breadcrumb"></div>

    <div id="subtabs">
      <div class="subtab active" data-sub="overview">Overview</div>
      <div class="subtab" data-sub="diff">Diff <span class="badge">!</span></div>

      <div class="subtab" data-sub="backlog">Backlog</div>
    </div>

    <div id="editor">
      <!-- views injected -->
      <div class="view show" id="view-overview"></div>
      <div class="view" id="view-company"></div>
    </div>

    <!-- right inspector: company chat -->
    <div id="inspector">
      <div class="ins-head"><span id="insTitle">Chat · LeadSift</span><span class="x" onclick="toggleInspector(false)">×</span></div>
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Message LeadSift…" />
        <button class="send" onclick="sendChat()">↑</button>
      </div>
    </div>

    <!-- ===== Bottom drawer ===== -->
    <div id="drawer" class="collapsed">
      <div id="drawer-resize"></div>

      <!-- collapsed single line -->
      <div id="collapsedLine" onclick="setDrawer(true)">
        <span class="live-dot pulse"></span>
        <span class="lbl">Activity</span>
        <span class="ctext"><span class="cco" id="clCo"></span> <span id="clText"></span></span>
        <span class="more" id="clMore"></span>
        <span class="chev">▴ expand</span>
      </div>

      <!-- expanded -->
      <div class="dr-tabs">
        <div class="dr-tab active"><span class="live-dot pulse"></span> Activity</div>
        <div class="dr-tab" style="color:var(--fg-3);cursor:default">Problems</div>
        <div class="dr-tab" style="color:var(--fg-3);cursor:default">Output</div>
        <div class="dr-actions">
          <div class="dr-toggle" title="Collapse" onclick="setDrawer(false)">▾</div>
        </div>
      </div>
      <div class="dr-body" id="drawerBody"></div>
    </div>

  </div>

  <!-- ===== Status bar ===== -->
  <div id="statusbar">
    <div class="sb-item btn-like" id="sbBranch" onclick="goOverview()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5a6 6 0 0 1-6 6H6"/></svg>
      <span>portfolio</span>
    </div>
    <div class="sb-item btn-like" id="sbDrawer" onclick="setDrawer()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
      <span id="sbDrawerTxt">Activity</span>
    </div>
    <div class="sb-spacer"></div>
    <div class="sb-item" id="sbNeeds"><span class="sb-strong">1</span> needs you</div>
    <div class="sb-item"><span class="sb-strong">$695</span> MRR</div>
    <div class="sb-item">5 companies · 22 shipped</div>
    <div class="sb-item sb-strong">C Slop Slop</div>
  </div>

</div>

<div id="toast"></div>
<div id="badge"><b>10</b> · Workspace</div>

<script>
/* ============ MOCK DATA (verbatim from brief) ============ */
const DATA = {
  portfolio: { mrr: 695, users: 56, activeCompanies: 5, slicesShipped: 22, needsYou: 1 },
  companies: [
    { id:'leadsift', name:'LeadSift', thesis:'Scrape + score inbound leads from any webform.',
      status:'active', domain:'leadsift.app', previewUrl:'http://localhost:4019',
      mrr:180, users:12, needsYou:true,
      slices:[
        {n:1, title:'A visitor can submit the lead webform',       status:'shipped',           check:'green'},
        {n:2, title:'Leads are stored and shown in a table',       status:'shipped',           check:'green'},
        {n:3, title:'Each lead gets an auto score 0–100',          status:'shipped',           check:'green'},
        {n:4, title:'User can filter leads by score',              status:'shipped',           check:'green'},
        {n:5, title:'User gets a daily email digest of top leads', status:'awaiting_approval', check:'green', priority:91},
        {n:6, title:'User can export leads to CSV',                status:'todo',              priority:74},
        {n:7, title:'Slack ping on a hot lead',                    status:'todo',              priority:60, dependsOn:[5]},
        {n:8, title:'Inbound webhook integration',                 status:'blocked',           note:'no progress - same failure ×3'},
      ],
      approval:{
        slice:5, title:'User gets a daily email digest of top leads',
        previewUrl:'http://localhost:4019/digest/preview',
        doneWhen:'GET /digest/preview → 200 and body contains "Top leads"',
        checkResult:'passed', attempt:2,
        diff:[
          "+ export function DailyDigest({ leads }: { leads: Lead[] }) {",
          "+   const top = leads.filter(l => l.score >= 70).slice(0, 10)",
          "+   return <DigestEmail subject=\"Your top leads today\" leads={top} />",
          "+ }",
          "  // schedule: cron 08:00, per-user timezone",
          "+ scheduleDailyDigest(userId, \"08:00\")",
        ].join("\n"),
      },
    },
    { id:'quietinbox', name:'QuietInbox', thesis:'Email triage that auto-drafts replies you can approve.',
      status:'active', domain:'quietinbox.io', previewUrl:'http://localhost:4021', mrr:420, users:38, needsYou:false,
      currentSlice:{n:9, title:'Snooze a thread until tomorrow', status:'building', step:'deploying to local container'}, slicesShipped:8 },
    { id:'translatorbill', name:'TranslatorBill', thesis:'Auto-translate + reformat invoices for cross-border freelancers.',
      status:'active', domain:null, previewUrl:'http://localhost:4023', mrr:0, users:0, needsYou:false,
      currentSlice:{n:6, title:'Digest scheduler UI', status:'building', step:'writing DigestScheduler.tsx'}, slicesShipped:4 },
    { id:'datadrop', name:'DataDrop', thesis:'CSV intake → clean → instant dashboard.',
      status:'active', domain:'datadrop.sh', previewUrl:'http://localhost:4025', mrr:95, users:6, needsYou:false,
      currentSlice:{n:6, title:'Saved chart views', status:'todo', step:'queued'}, slicesShipped:5 },
    { id:'redditpainbot', name:'RedditPainBot', thesis:'Mine subreddits for pain posts → ranked micro-SaaS ideas.',
      status:'paused', domain:null, previewUrl:null, mrr:0, users:0, needsYou:false,
      currentSlice:{n:8, title:'Dedupe near-identical pains', status:'blocked', step:'stopped - no progress'}, slicesShipped:2 },
  ],
  opportunities: [
    { id:'o1', thought:'freelancers hate reconciling stripe payouts by hand', title:'PayoutReconciler', thesis:'Match Stripe payouts to invoices automatically.', score:82, status:'candidate' },
    { id:'o2', thought:'podcasters spend hours adding chapter markers',       title:'ChapterForge',     thesis:'Auto-generate chapter markers from a transcript.', score:71, status:'candidate' },
    { id:'o3', thought:'designers waste time renaming layers',                title:'LayerTidy',        thesis:'One-click layer naming for Figma.',                score:54, status:'candidate' },
    { id:'o4', thought:'shopify stores need quick refund triage',             title:'RefundTriage',     thesis:'Prioritize refund requests by risk.',              score:38, status:'killed' },
  ],
  activity: [
    { co:'TranslatorBill', kind:'building',     text:'building slice 6 - writing DigestScheduler.tsx',        t:'now', running:true },
    { co:'QuietInbox',     kind:'deploy',       text:'deployed to localhost:4021 - running doneWhen probe',   t:'12s', running:true },
    { co:'LeadSift',       kind:'await',        text:'slice 5 awaiting your approval',                        t:'2m' },
    { co:'LeadSift',       kind:'check',        text:'doneWhen passed - GET /digest/preview → 200',           t:'2m' },
    { co:'DataDrop',       kind:'reprioritize', text:'re-prioritized backlog - slice 6 now top',              t:'5m' },
    { co:'RedditPainBot',  kind:'blocked',      text:'slice 8 blocked - no progress (same failure ×3)',       t:'18m' },
  ],
  nextMoves: [
    'Approve LeadSift slice 5 (daily digest) - it’s live and the check is green',
    'Unblock RedditPainBot slice 8, or pause the company',
    'Promote “PayoutReconciler” (score 82) to a company',
  ],
  chat: [
    { role:'assistant', text:'LeadSift just shipped a daily digest. It’s live at localhost:4019 and the check passed - want to approve it?' },
    { role:'user',      text:'show me the diff first' },
    { role:'assistant', text:'Here’s the slice - one new component + a scheduler. Preview URL + green check are attached above.' },
  ],
};

/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const SLICE_COLOR = { todo:'var(--slate)', building:'var(--blue)', awaiting_approval:'var(--amber)', shipped:'var(--green)', blocked:'var(--red)' };
const SLICE_ICON  = { todo:'○', building:'◐', awaiting_approval:'◆', shipped:'●', blocked:'■' };
const CO_COLOR    = { active:'var(--green)', paused:'var(--amber)', archived:'var(--slate)' };
const KIND_COLOR  = { building:'var(--blue)', deploy:'var(--blue)', await:'var(--amber)', check:'var(--green)', reprioritize:'var(--fg-2)', blocked:'var(--red)' };

function coIcon(status){
  const c = CO_COLOR[status];
  return `<svg class="co-ico" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><path d="M4 21h16M6 21V9l6-4 6 4v12M10 21v-5h4v5"/></svg>`;
}

/* ============ STATE ============ */
let state = { view:'overview', company:null, sub:'overview' };
let openTabs = []; // company ids open as tabs

/* ============ Explorer tree ============ */
function renderTree(){
  const tree = $('#coTree');
  tree.innerHTML = DATA.companies.map(c => {
    const slices = c.slices || (c.currentSlice ? [c.currentSlice] : []);
    const open = state.company === c.id;
    const sel = state.company === c.id;
    const sliceRows = slices.map(s => {
      const cls = s.status === 'awaiting_approval' ? 'await' : s.status;
      return `<div class="slice-row ${cls}" onclick="event.stopPropagation(); openCompany('${c.id}', ${s.status==='awaiting_approval'?"'diff'":"'backlog'"})">
          <span class="sl-ico ${s.status==='building'?'pulse':''}" style="color:${SLICE_COLOR[s.status]}">${SLICE_ICON[s.status]}</span>
          <span class="sl-n">${s.n}.</span>
          <span class="sl-title">${esc(s.title)}</span>
        </div>`;
    }).join('');
    return `<div class="co-block" data-co="${c.id}">
      <div class="co-row ${sel?'sel':''}" onclick="toggleTreeOrOpen('${c.id}')">
        <span class="co-caret ${open?'open':''}">▸</span>
        ${coIcon(c.status)}
        <span class="co-name">${esc(c.name)}</span>
        ${c.needsYou ? '<span class="needs-pill">!</span>' : `<span class="st-dot" style="background:${CO_COLOR[c.status]}"></span>`}
      </div>
      <div class="slices" style="display:${open?'block':'none'}">${sliceRows}</div>
    </div>`;
  }).join('');
}

function toggleTreeOrOpen(id){
  // expand the tree node AND open the company tab
  openCompany(id);
}

/* ============ Tabs ============ */
function renderTabs(){
  const tb = $('#tabbar');
  const overviewActive = state.view === 'overview';
  let html = `<div class="tab ${overviewActive?'active':''}" onclick="goOverview()">
      <svg class="t-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="t-label">Portfolio</span>
    </div>`;
  html += openTabs.map(id => {
    const c = DATA.companies.find(x => x.id === id);
    const active = state.view === 'company' && state.company === id;
    const dirty = c.needsYou;
    return `<div class="tab ${active?'active':''} ${dirty?'dirty':''}" onclick="openCompany('${id}')">
        ${coIcon(c.status)}
        <span class="t-label">${esc(c.name)}</span>
        <span class="t-close" onclick="event.stopPropagation(); closeTab('${id}')">${dirty?'':'×'}</span>
      </div>`;
  }).join('');
  html += `<div class="tab-spacer"></div>`;
  tb.innerHTML = html;
}

function closeTab(id){
  openTabs = openTabs.filter(x => x !== id);
  if (state.company === id) goOverview();
  else { renderTabs(); renderTree(); }
}

/* ============ Breadcrumb ============ */
function renderBreadcrumb(){
  const bc = $('#breadcrumb');
  if (state.view === 'overview'){
    bc.innerHTML = `<span class="crumb">C Slop Slop</span> <span class="sep">/</span> <span class="crumb last">Portfolio</span>`;
  } else {
    const c = DATA.companies.find(x => x.id === state.company);
    const subName = {overview:'Overview', diff:'Diff', preview:'Preview', backlog:'Backlog'}[state.sub];
    bc.innerHTML = `<span class="crumb" onclick="goOverview()" style="cursor:pointer">C Slop Slop</span> <span class="sep">/</span>
      <span class="crumb">companies</span> <span class="sep">/</span>
      <span class="crumb">${esc(c.name)}</span> <span class="sep">/</span>
      <span class="crumb last">${subName}</span>
      <span class="back-link" onclick="goOverview()">← back to portfolio (Esc)</span>`;
  }
}

/* ============ Overview view ============ */
function renderOverview(){
  const p = DATA.portfolio;
  const metrics = `
    <div class="metrics">
      <div class="metric"><div class="v">$${p.mrr}</div><div class="l">MRR</div></div>
      <div class="metric"><div class="v">${p.users}</div><div class="l">Users</div></div>
      <div class="metric"><div class="v">${p.activeCompanies}</div><div class="l">Active companies</div></div>
      <div class="metric"><div class="v">${p.slicesShipped}</div><div class="l">Slices shipped</div></div>
      <div class="metric alert"><div class="v">${p.needsYou}</div><div class="l">Needs you</div></div>
    </div>`;

  const cards = DATA.companies.map(c => {
    const cur = c.slices ? c.slices.find(s=>s.status==='awaiting_approval'||s.status==='building'||s.status==='blocked') : c.currentSlice;
    let stripTxt = '';
    if (c.needsYou) stripTxt = `<span style="color:var(--amber)">${SLICE_ICON.awaiting_approval}</span> slice ${cur?cur.n:5} awaiting your approval`;
    else if (cur) stripTxt = `<span style="color:${SLICE_COLOR[cur.status]}" class="${cur.status==='building'?'pulse':''}">${SLICE_ICON[cur.status]}</span> slice ${cur.n} · ${esc(cur.title)}`;
    const shipped = c.slices ? c.slices.filter(s=>s.status==='shipped').length : c.slicesShipped;
    return `<div class="co-card ${c.needsYou?'alert':''}" onclick="openCompany('${c.id}')">
      <div class="row1">
        ${coIcon(c.status)}
        <span class="cname">${esc(c.name)}</span>
        ${c.needsYou ? '<span class="needs-pill">NEEDS YOU</span>' : `<span class="chip" style="color:${CO_COLOR[c.status]};background:rgba(255,255,255,.04)"><span class="st-dot" style="background:${CO_COLOR[c.status]}"></span>${c.status}</span>`}
      </div>
      <div class="cthesis">${esc(c.thesis)}</div>
      <div class="cmeta"><span>MRR</span> <b>$${c.mrr}</b> <span>users</span> <b>${c.users}</b> <span>shipped</span> <b>${shipped}</b></div>
      <div class="cstrip">${stripTxt}</div>
    </div>`;
  }).join('');

  const opps = DATA.opportunities.map(o => {
    const C = 2*Math.PI*18;
    const off = C * (1 - o.score/100);
    const col = o.status==='killed' ? 'var(--slate)' : (o.score>=75?'var(--green)':o.score>=55?'var(--amber)':'var(--fg-2)');
    const action = o.status==='killed'
      ? `<span class="chip" style="color:var(--red);background:rgba(224,108,117,.1)">killed</span>`
      : `<button class="btn violet" onclick="event.stopPropagation(); promote('${esc(o.title)}')">Promote →</button>`;
    return `<div class="opp ${o.status==='killed'?'killed':''}">
      <div class="score-ring">
        <svg width="46" height="46"><circle cx="23" cy="23" r="18" stroke="var(--border)" stroke-width="4" fill="none"/>
        <circle cx="23" cy="23" r="18" stroke="${col}" stroke-width="4" fill="none" stroke-dasharray="${C}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>
        <div class="num">${o.score}</div>
      </div>
      <div>
        <div class="otit">${esc(o.title)}</div>
        <div class="othought">“${esc(o.thought)}”</div>
        <div class="othesis">${esc(o.thesis)}</div>
      </div>
      <div class="ogrow"></div>
      ${action}
    </div>`;
  }).join('');

  const moves = DATA.nextMoves.map((m,i) => `<div class="move"><span class="mnum">${i+1}</span><span>${esc(m)}</span></div>`).join('');

  $('#view-overview').innerHTML = `
    <div class="pad">
      <div class="h1">Portfolio</div>
      <div class="sub">5 active companies · agents are shipping validated slices continuously. One slice needs your approval.</div>
      ${metrics}

      <div class="section-label">Companies</div>
      <div class="co-grid">${cards}</div>

      <div class="section-label">Opportunities - scored thoughts, promote the strong ones</div>
      <div class="opp-list">${opps}</div>

      <div class="section-label">Next moves</div>
      <div class="moves">${moves}</div>
    </div>
    <div id="cmdbar-wrap">
      <div id="cmdbar">
        <span class="prompt">›</span>
        <input id="cmdInput" placeholder="Ask C Slop Slop, capture a thought, or direct any company…" />
        <span class="hint">⏎ to send</span>
      </div>
    </div>
  `;
  const ci = $('#cmdInput');
  if (ci) ci.addEventListener('keydown', e => { if(e.key==='Enter'&&ci.value.trim()){ flashToast('Captured: “'+ci.value.trim()+'”'); ci.value=''; } });
}

/* ============ Company view (LeadSift) ============ */
function renderCompany(){
  const c = DATA.companies.find(x => x.id === state.company);
  const v = $('#view-company');

  // OVERVIEW sub
  const shipped = c.slices ? c.slices.filter(s=>s.status==='shipped').length : c.slicesShipped;
  const total = c.slices ? c.slices.length : '-';
  const overviewHtml = `
    <div class="pad" data-subview="overview">
      <div class="h1">${esc(c.name)}</div>
      <div class="sub">${esc(c.thesis)}</div>
      <div class="metrics">
        <div class="metric"><div class="v">$${c.mrr}</div><div class="l">MRR</div></div>
        <div class="metric"><div class="v">${c.users}</div><div class="l">Users</div></div>
        <div class="metric"><div class="v">${shipped}/${total}</div><div class="l">Slices shipped</div></div>
        <div class="metric ${c.needsYou?'alert':''}"><div class="v">${c.needsYou?1:0}</div><div class="l">Awaiting you</div></div>
      </div>
      <div class="preview-bar" style="margin-top:18px">
        <span class="pdot ${c.previewUrl?'':'_'}" style="background:${c.previewUrl?'var(--green)':'var(--slate)'}"></span>
        <span style="color:var(--fg-2)">live preview</span>
        ${c.previewUrl ? `<a href="${c.previewUrl}" onclick="return previewClick(event)">${c.previewUrl}</a>` : '<span style="color:var(--fg-3)">not deployed</span>'}
        ${c.domain ? `<span class="open-ext" style="color:var(--fg-3)">domain: ${c.domain}</span>` : ''}
      </div>
      ${c.needsYou ? `<div class="move" style="margin-top:16px;border-left-color:var(--violet)"><span class="mnum" style="color:var(--violet)">!</span><span>Slice 5 (daily digest) is live and the check is green - <b style="color:var(--amber);cursor:pointer" onclick="setSub('diff')">review the diff →</b></span></div>` : ''}
    </div>`;

  // DIFF sub = approval gate
  const a = c.approval;
  let diffHtml = '';
  if (a){
    const diffLines = a.diff.split('\n').map((ln,i) => {
      const add = ln.startsWith('+');
      return `<div class="diff-line ${add?'add':''}"><span class="gut">${add?'+':' '}</span><span class="code">${esc(ln)}</span></div>`;
    }).join('');
    diffHtml = `
    <div class="pad" data-subview="diff">
      <div class="gate-head">
        <span style="color:var(--amber);font-size:18px">${SLICE_ICON.awaiting_approval}</span>
        <span class="gtitle">Slice ${a.slice} · ${esc(a.title)}</span>
        <span class="pass-pill">✓ doneWhen passed · attempt ${a.attempt}</span>
      </div>
      <div class="sub" style="margin-top:6px">This slice is built, deployed, and proven. Review and approve to ship it - or reject with feedback.</div>

      <div class="donewhen">
        <div class="dw-label">doneWhen check (executable)</div>
        <div class="dw-check">${esc(a.doneWhen)}</div>
        <div class="dw-result">✓ ${a.checkResult} - GET /digest/preview → 200, body contains "Top leads"</div>
      </div>

      <div class="preview-bar">
        <span class="pdot pulse"></span>
        <span style="color:var(--fg-2)">live preview</span>
        <a href="${a.previewUrl}" id="gatePreviewLink" onclick="return previewClick(event)">${a.previewUrl}</a>
        <span class="open-ext"><button class="btn" onclick="setSub('preview')">Open preview ↗</button></span>
      </div>

      <div class="diff-wrap">
        <div class="diff-head"><span>DailyDigest.tsx</span><span class="add">+5</span><span style="color:var(--fg-3)">1 new component · 1 scheduler call</span></div>
        <div class="diff-body">${diffLines}</div>
      </div>

      <div class="gate-actions">
        <span class="gtext"><b>Approval gate (L0)</b> - you ship this slice. The product stays live.</span>
        <div class="gspace"></div>
        <button class="btn ghost-red" onclick="toggleReject()">Reject with feedback</button>
        <button class="btn primary" onclick="approve()">✓ Approve & ship</button>
      </div>
      <div id="rejectBox">
        <textarea id="rejectText" placeholder="What needs to change? e.g. 'digest should only include leads from the last 24h'…"></textarea>
        <div class="rj-actions">
          <button class="btn" onclick="toggleReject()">Cancel</button>
          <button class="btn ghost-red" onclick="submitReject()">Send rejection →</button>
        </div>
      </div>
    </div>`;
  } else {
    diffHtml = `<div class="pad" data-subview="diff"><div class="sub">No slice awaiting approval for this company.</div></div>`;
  }

  // PREVIEW sub = embedded live browser
  const previewHtml = a ? `
    <div class="pad" data-subview="preview">
      <div class="preview-bar">
        <span class="pdot pulse"></span>
        <span style="color:var(--fg-2)">serving</span>
        <a href="${a.previewUrl}" onclick="return previewClick(event)">${a.previewUrl}</a>
        <span class="open-ext"><span class="pass-pill">✓ 200 OK</span></span>
      </div>
      <div class="browser">
        <div class="bchrome">
          <div class="bdots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
          <div class="burl">${a.previewUrl}</div>
        </div>
        <div class="bbody">
          <h2>Your top leads today</h2>
          <div class="bsub">Daily digest · ${c.domain || c.name} · sent 08:00 your time</div>
          <div class="lead-item"><span class="sc">94</span><span class="nm">Acme Robotics</span><span class="em">ops@acme.io</span></div>
          <div class="lead-item"><span class="sc">88</span><span class="nm">Nimbus Health</span><span class="em">cto@nimbus.health</span></div>
          <div class="lead-item"><span class="sc">81</span><span class="nm">Fjord Logistics</span><span class="em">buy@fjord.co</span></div>
          <div class="lead-item"><span class="sc">76</span><span class="nm">Pal &amp; Co Studio</span><span class="em">hi@palco.design</span></div>
        </div>
      </div>
      <div class="gate-actions" style="margin-top:16px">
        <span class="gtext">Looks right? This is exactly what users receive.</span>
        <div class="gspace"></div>
        <button class="btn ghost-red" onclick="setSub('diff'); toggleReject(true)">Reject with feedback</button>
        <button class="btn primary" onclick="approve()">✓ Approve & ship</button>
      </div>
    </div>` : `<div class="pad" data-subview="preview"><div class="sub">No live preview.</div></div>`;

  // BACKLOG sub
  let backlogHtml;
  const slices = c.slices || (c.currentSlice?[c.currentSlice]:[]);
  backlogHtml = `<div class="pad" data-subview="backlog">
    <div class="h1" style="font-size:16px">Backlog - one validated slice at a time</div>
    <div class="sub" style="margin-bottom:14px">Agents pull the top-priority slice, ship it live + proven, then re-prioritize.</div>
    <div class="backlog">
    ${slices.map(s => {
      const cls = s.status==='awaiting_approval'?'await':s.status;
      let right = '';
      if (s.status==='awaiting_approval') right = `<span class="chip" style="color:var(--amber);background:rgba(229,192,123,.1)">NEEDS YOU</span>`;
      else if (s.status==='blocked') right = `<span class="bk-note">${esc(s.note||'blocked')}</span>`;
      else if (s.status==='building') right = `<span class="chip" style="color:var(--blue);background:rgba(97,175,239,.1)"><span class="run-dot pulse" style="background:var(--blue)"></span>building</span>`;
      else if (s.status==='shipped') right = `<span class="chip" style="color:var(--green);background:var(--green-bg)">✓ shipped</span>`;
      else if (s.priority) right = `<span class="bk-pri">priority ${s.priority}</span>`;
      const dep = s.dependsOn ? `<span class="bk-dep">depends on #${s.dependsOn.join(', #')}</span>` : '';
      return `<div class="bk-row ${cls}">
        <span class="bk-n" style="color:${SLICE_COLOR[s.status]}">#${s.n}</span>
        <span class="bk-t">${esc(s.title)}</span>
        ${dep}
        ${right}
      </div>`;
    }).join('')}
    </div>
  </div>`;

  v.innerHTML = overviewHtml + diffHtml + previewHtml + backlogHtml;
  showSubview();
}

function showSubview(){
  $$('#view-company [data-subview]').forEach(el => {
    el.style.display = el.dataset.subview === state.sub ? '' : 'none';
  });
  $$('#subtabs .subtab').forEach(t => t.classList.toggle('active', t.dataset.sub === state.sub));
}

function setSub(sub){
  state.sub = sub;
  renderBreadcrumb();
  showSubview();
}

/* ============ navigation ============ */
function openCompany(id, sub){
  state.view = 'company';
  state.company = id;
  const c = DATA.companies.find(x=>x.id===id);
  // default sub: diff if needs you, else overview
  state.sub = sub || (c.needsYou ? 'diff' : 'overview');
  if (!openTabs.includes(id)) openTabs.push(id);

  $('#view-overview').classList.remove('show');
  $('#view-company').classList.add('show');
  $('#subtabs').classList.add('show');
  // badge on diff subtab only when needs approval
  $('#subtabs .subtab[data-sub="diff"] .badge').style.display = c.needsYou ? '' : 'none';

  renderCompany();
  renderTabs();
  renderTree();
  renderBreadcrumb();
  updateStatusBar();

  // company chat
  $('#insTitle').textContent = 'Chat · ' + c.name;
  $('#chatInput').placeholder = 'Message ' + c.name + '…';
  renderChat();
  toggleInspector(true);
  $('#editor').scrollTop = 0;
}

function goOverview(){
  state.view = 'overview';
  state.company = null;
  state.sub = 'overview';
  $('#view-company').classList.remove('show');
  $('#view-overview').classList.add('show');
  $('#subtabs').classList.remove('show');
  toggleInspector(false);
  renderTabs();
  renderTree();
  renderBreadcrumb();
  updateStatusBar();
  $('#editor').scrollTop = 0;
}

/* ============ inspector / chat ============ */
function toggleInspector(show){
  $('#inspector').classList.toggle('show', show);
}
function renderChat(){
  $('#chatScroll').innerHTML = DATA.chat.map(m => `
    <div class="msg ${m.role}">
      <div class="who">${m.role==='user'?'You':'C Slop Slop'}</div>
      <div class="bubble">${esc(m.text)}</div>
    </div>`).join('');
  const sc = $('#chatScroll'); sc.scrollTop = sc.scrollHeight;
}
function sendChat(){
  const inp = $('#chatInput');
  if (!inp.value.trim()) return;
  const sc = $('#chatScroll');
  sc.insertAdjacentHTML('beforeend', `<div class="msg user"><div class="who">You</div><div class="bubble">${esc(inp.value.trim())}</div></div>`);
  inp.value=''; sc.scrollTop = sc.scrollHeight;
  setTimeout(()=>{ sc.insertAdjacentHTML('beforeend', `<div class="msg assistant"><div class="who">C Slop Slop</div><div class="bubble">On it - I’ll route that to the build loop.</div></div>`); sc.scrollTop = sc.scrollHeight; }, 600);
}
$('#chatInput')?.addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });

/* ============ approval actions ============ */
function approve(){
  flashToast('Approved ✓ - slice 5 shipping live to leadsift.app', false);
  const co = DATA.companies.find(x=>x.id==='leadsift');
  co.needsYou = false;
  const s5 = co.slices.find(s=>s.n===5);
  if (s5) s5.status = 'shipped';
  DATA.portfolio.needsYou = 0;
  // reflect
  renderCompany(); renderTabs(); renderTree(); updateStatusBar(); pushActivity('LeadSift','check','slice 5 approved & shipped - live on leadsift.app');
  setSub('overview');
}
function toggleReject(force){
  const box = $('#rejectBox');
  const show = force === true ? true : !box.classList.contains('show');
  box.classList.toggle('show', show);
  if (show) setTimeout(()=>$('#rejectText')?.focus(), 50);
}
function submitReject(){
  const t = $('#rejectText').value.trim();
  flashToast('Rejected - feedback sent to the build loop ✗', true);
  $('#rejectBox').classList.remove('show');
  $('#rejectText').value='';
  pushActivity('LeadSift','building','reworking slice 5 from your feedback' + (t?' - "'+t.slice(0,40)+'"':''), true);
}

function previewClick(e){ e.preventDefault(); flashToast('Opening '+e.target.textContent+' (mock)'); return false; }
function promote(name){ flashToast('Promoting “'+name+'” to a company ✓'); }

/* ============ toast ============ */
let toastTimer;
function flashToast(msg, reject){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('reject', !!reject);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============ Activity drawer ============ */
function renderDrawer(){
  // grouped by company
  const groups = {};
  DATA.activity.forEach(a => { (groups[a.co] = groups[a.co] || []).push(a); });
  $('#drawerBody').innerHTML = Object.keys(groups).map(co => {
    const co_ = DATA.companies.find(c=>c.name===co);
    const dotColor = co_ ? CO_COLOR[co_.status] : 'var(--fg-3)';
    const lines = groups[co].map(a => `
      <div class="act-line ${a.running?'running':''}">
        <span class="t">${a.t}</span>
        <span class="run-dot ${a.running?'pulse':''}" style="background:${KIND_COLOR[a.kind]}"></span>
        <span class="k" style="color:${KIND_COLOR[a.kind]}">${a.kind}</span>
        <span class="x">${esc(a.text)}</span>
      </div>`).join('');
    return `<div class="act-group">
      <div class="grp-co"><span class="st-dot" style="background:${dotColor}"></span>${esc(co)}</div>
      ${lines}
    </div>`;
  }).join('');

  // collapsed line: latest currently-running, else latest overall
  const running = DATA.activity.filter(a=>a.running);
  const latest = running[0] || DATA.activity[0];
  $('#clCo').textContent = latest.co;
  $('#clText').textContent = latest.text;
  const others = running.length>1 ? running.length-1 : 0;
  $('#clMore').textContent = others>0 ? `+${others} more building` : '';
}

let drawerExpanded = false;
function setDrawer(force){
  drawerExpanded = (force === undefined) ? !drawerExpanded : !!force;
  const d = $('#drawer');
  d.classList.toggle('collapsed', !drawerExpanded);
  d.style.setProperty('--drawer-h', drawerExpanded ? (currentDrawerH+'px') : '30px');
  document.documentElement.style.setProperty('--drawer-h', drawerExpanded ? (currentDrawerH+'px') : '30px');
  $('#main').style.setProperty('--drawer-h', drawerExpanded ? (currentDrawerH+'px') : '30px');
  $('#sbDrawerTxt').textContent = drawerExpanded ? 'Hide activity' : 'Activity';
}

let currentDrawerH = 240;
/* drag resize */
(function(){
  const handle = $('#drawer-resize');
  let dragging=false, startY=0, startH=0;
  handle.addEventListener('mousedown', e=>{ if(!drawerExpanded) return; dragging=true; startY=e.clientY; startH=currentDrawerH; document.body.style.cursor='ns-resize'; e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(!dragging) return; const dy=startY-e.clientY; currentDrawerH=Math.max(90, Math.min(window.innerHeight*0.7, startH+dy)); $('#main').style.setProperty('--drawer-h', currentDrawerH+'px'); });
  window.addEventListener('mouseup', ()=>{ if(dragging){dragging=false; document.body.style.cursor='';} });
})();

function pushActivity(co, kind, text, running){
  DATA.activity.unshift({co, kind, text, t:'now', running:!!running});
  renderDrawer();
}

/* ============ status bar ============ */
function updateStatusBar(){
  const sb = $('#statusbar');
  const onGate = state.view==='company' && state.sub==='diff' && DATA.companies.find(c=>c.id===state.company)?.needsYou;
  sb.classList.toggle('gate-mode', !!onGate);
  $('#sbNeeds').innerHTML = `<span class="sb-strong">${DATA.portfolio.needsYou}</span> needs you`;
  $('#sbBranch span').textContent = state.view==='company' ? state.company : 'portfolio';
}

/* ============ activity bar nav ============ */
$$('.abtn[data-act]').forEach(b => b.addEventListener('click', () => {
  $$('.abtn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  const act = b.dataset.act;
  if (act==='live'){ setDrawer(true); }
  else if (act==='opps'){ goOverview(); setTimeout(()=>{ const el=[...$$('.section-label')].find(e=>e.textContent.includes('Opportunities')); el?.scrollIntoView({behavior:'smooth'}); },50); }
  else { goOverview(); }
}));

/* sub tabs */
$$('#subtabs .subtab').forEach(t => t.addEventListener('click', ()=> setSub(t.dataset.sub)));

/* esc to go back */
window.addEventListener('keydown', e => {
  if (e.key==='Escape'){ if($('#rejectBox').classList.contains('show')) toggleReject(false); else if(state.view==='company') goOverview(); }
});

/* ============ init ============ */
renderTree();
renderTabs();
renderBreadcrumb();
renderOverview();
renderDrawer();
updateStatusBar();
$('#main').style.setProperty('--drawer-h','30px');
</script>
</body>
</html>
