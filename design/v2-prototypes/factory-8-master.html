<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Thin Master-Detail</title>
<script>try{var t=localStorage.getItem('cslopslop-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8;
    --ink:#2c2926; --ink-soft:#635c52; --ink-faint:#948b7d;
    --line:#e6ddce; --line-soft:#efe8da;
    --accent:#c8643c; --accent-soft:#f4e0d6;
    --green:#4f8a52; --green-soft:#e3efe1;
    --blue:#4a72b0; --blue-soft:#e2eaf5;
    --violet:#7a5ea8; --violet-soft:#ece6f5;
    --amber:#c08a2e; --amber-soft:#f6ecd4;
    --red:#b6483f; --red-soft:#f6e0dd;
    --slate:#8a8579; --slate-soft:#ece8df;
    --shadow: 0 1px 2px rgba(44,41,38,.04), 0 10px 30px rgba(44,41,38,.07);
  }
  :root[data-theme="dark"] {
    --cream:#05060a; --cream-2:#080d18; --paper:#10131f;
    --ink:#e6ebf5; --ink-soft:#aab4c8; --ink-faint:#6f7891;
    --line:#1c2233; --line-soft:#141a29;
    --accent:#e0794e; --accent-soft:rgba(224,121,78,.18);
    --green:#34d399; --green-soft:rgba(52,211,153,.15);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,.15);
    --violet:#a78bfa; --violet-soft:rgba(167,139,250,.16);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.15);
    --red:#f87171; --red-soft:rgba(248,113,113,.15);
    --slate:#8a93a8; --slate-soft:rgba(120,140,200,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; cursor: pointer; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* stage color carriers */
  .s-slate  { --sc: var(--slate);  --scs: var(--slate-soft); }
  .s-blue   { --sc: var(--blue);   --scs: var(--blue-soft); }
  .s-amber  { --sc: var(--amber);  --scs: var(--amber-soft); }
  .s-green  { --sc: var(--green);  --scs: var(--green-soft); }
  .s-violet { --sc: var(--violet); --scs: var(--violet-soft); }
  .s-red    { --sc: var(--red);    --scs: var(--red-soft); }

  /* ====================================================== APP SHELL */
  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ===================================================== THIN RAIL */
  .rail {
    background: var(--cream-2);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .rail-head {
    display: flex; align-items: center; gap: 11px;
    padding: 18px 18px 14px;
  }
  .mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .bword {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: -0.02em;
    line-height: 1;
  }
  .bsub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 3px;
  }

  .rail-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 6px 10px 12px; }
  .rail-lbl { padding: 12px 8px 6px; }

  /* list item - content only, no nav idioms */
  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 10px 1fr auto;
    align-items: center; gap: 11px;
    padding: 9px 10px;
    border: none; background: transparent;
    border-radius: 9px;
    text-align: left; color: var(--ink);
    position: relative;
    transition: background .14s;
  }
  .item:hover { background: var(--paper); }
  .item.active { background: var(--paper); box-shadow: var(--shadow); }
  .item.active::before {
    content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .item .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--sc); box-shadow: 0 0 0 3px var(--scs);
  }
  .item .nm {
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .stg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 2px;
  }
  .item .txt { min-width: 0; }
  .item .need {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2.6s infinite;
  }
  .item.done .nm { color: var(--ink-faint); }

  /* All-bets item */
  .item.all { grid-template-columns: 22px 1fr auto; padding: 11px 10px; }
  .item.all .glyph {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .item.all.active .glyph { color: var(--accent); border-color: var(--accent-soft); }
  .item.all .glyph svg { width: 13px; height: 13px; }
  .item.all .nm { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; }
  .cnt {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--accent); background: var(--accent-soft);
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }

  .rail-div { height: 1px; background: var(--line); margin: 8px 12px; }

  .rail-foot {
    border-top: 1px solid var(--line);
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .foot-net { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; color: var(--green); }
  .foot-lbl { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  .theme-toggle {
    width: 30px; height: 30px; border-radius: 8px;
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    display: grid; place-items: center; flex: none;
    transition: color .16s, border-color .16s;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent-soft); }
  .theme-toggle svg { width: 15px; height: 15px; }

  /* ===================================================== DETAIL */
  .detail { overflow-y: auto; min-height: 0; min-width: 0; background: var(--cream); }
  .detail-in { max-width: 860px; margin: 0 auto; padding: 30px 44px 90px; }
  .fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .live-strip {
    display: flex; align-items: center; gap: 9px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 22px;
  }
  .live-strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2.4s infinite; }

  /* ---------- portfolio header ---------- */
  .p-hd h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 30px; letter-spacing: -0.025em; margin: 0 0 8px;
  }
  .p-hd p { color: var(--ink-soft); margin: 0; max-width: 52ch; font-size: 15px; }

  .totals {
    display: flex; flex-wrap: wrap; gap: 26px 40px;
    padding: 26px 0 30px; margin-top: 22px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .tot .n {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 26px; letter-spacing: -0.02em; line-height: 1;
  }
  .tot .n.pos { color: var(--green); }
  .tot .n.warn { color: var(--accent); }
  .tot .l {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
    margin-top: 8px;
  }

  .sec-hd { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }
  .sec-hd h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; margin: 0; }
  .sec-hd .hint { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin-left: auto; }

  /* ---------- needs-you cards ---------- */
  .need-card {
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .need-top { display: flex; align-items: center; gap: 10px; }
  .need-co { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .need-co .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sc); margin-right: 7px; vertical-align: middle; }
  .need-open { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--ink-faint); background: none; border: none; text-transform: uppercase; }
  .need-open:hover { color: var(--accent); }
  .need-ask { font-size: 15px; margin: 10px 0 3px; letter-spacing: -0.01em; }
  .need-sub { color: var(--ink-faint); font-size: 12.5px; }
  .need-acts { display: flex; gap: 9px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .14s, border-color .14s, color .14s, transform .06s;
  }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 13px; height: 13px; }
  .btn.approve { background: var(--green); border-color: var(--green); color: #fff; }
  :root[data-theme="dark"] .btn.approve { color: #05060a; }
  .btn.approve:hover { filter: brightness(1.05); }
  .btn.ghost:hover { border-color: var(--ink-faint); }
  .btn.kill { color: var(--red); }
  .btn.kill:hover { border-color: var(--red); background: var(--red-soft); }

  .resolved {
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
    padding: 10px 12px; border-radius: 9px;
    background: var(--green-soft); font-size: 13px; color: var(--ink);
  }
  .resolved.held { background: var(--amber-soft); }
  .resolved.killed { background: var(--red-soft); }
  .resolved svg { width: 15px; height: 15px; flex: none; }
  .resolved .undo { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; color: var(--ink-soft); }
  .resolved .undo:hover { color: var(--accent); }

  .allclear { display: flex; align-items: center; gap: 12px; padding: 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-soft); font-size: 14px; }
  .allclear svg { width: 18px; height: 18px; color: var(--green); }

  /* ---------- portfolio health list ---------- */
  .health { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .hrow {
    display: grid; grid-template-columns: 1fr 96px 150px 90px 20px;
    align-items: center; gap: 14px;
    padding: 13px 16px; width: 100%; text-align: left;
    background: transparent; border: none; border-top: 1px solid var(--line-soft);
    color: var(--ink); transition: background .14s;
  }
  .hrow:first-child { border-top: none; }
  .hrow:hover { background: var(--cream-2); }
  .hrow .hnm { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hrow .hnm .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); flex: none; }
  .hrow .hnm b { font-weight: 500; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hstg { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc); }
  .hrev { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; text-align: right; }
  .hrev.zero { color: var(--ink-faint); font-weight: 400; }
  .hrow .arr { color: var(--ink-faint); display: grid; place-items: center; }
  .hrow .arr svg { width: 14px; height: 14px; }
  .hrow.hnyou b::after {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-left: 8px; vertical-align: middle;
  }

  /* signal meter */
  .meter { display: inline-flex; gap: 3px; align-items: center; }
  .meter i { width: 5px; height: 12px; border-radius: 2px; background: var(--line); display: block; }
  .meter i.on { background: var(--mc, var(--green)); }
  .meter .mlab { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin-left: 7px; }

  /* ============================================ COMPANY DETAIL */
  .c-top { display: flex; align-items: flex-start; gap: 16px; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--sc);
    background: var(--scs); padding: 5px 11px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .chip .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
  .c-title { flex: 1 1 auto; min-width: 0; }
  .c-title h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 27px; letter-spacing: -0.025em; margin: 12px 0 8px;
  }
  .c-title .desc { color: var(--ink-soft); font-size: 15.5px; max-width: 54ch; margin: 0; }

  .c-metrics { display: flex; flex-wrap: wrap; gap: 22px 34px; padding: 22px 0 6px; margin-top: 18px; border-top: 1px solid var(--line); }
  .m .mv { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 21px; letter-spacing: -0.02em; line-height: 1; }
  .m .mv.pos { color: var(--green); }
  .m .mv.neg { color: var(--accent); }
  .m .ml { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin-top: 7px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin: 26px 0 20px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; padding: 9px 2px; margin-right: 18px;
    font-size: 13px; font-weight: 500; color: var(--ink-faint);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .14s, border-color .14s;
  }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card.span { grid-column: 1 / -1; }
  .card h3 { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; font-weight: 500; }

  /* goal + progress */
  .goal { font-size: 15px; letter-spacing: -0.01em; margin: 0 0 14px; }
  .bar { height: 8px; border-radius: 6px; background: var(--line-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: var(--sc); transition: width .5s ease; }
  .goal-note { display: flex; justify-content: space-between; margin-top: 9px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-soft); }
  .goal-note .pct { color: var(--sc); }

  /* AI plan */
  .plan-row { display: flex; align-items: flex-start; gap: 11px; }
  .ai-glyph { width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .ai-glyph svg { width: 15px; height: 15px; }
  .plan-txt { font-size: 14.5px; margin: 0; }
  .next {
    margin-top: 14px; padding: 13px 14px; border-radius: 10px;
    background: var(--cream-2); border: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 11px;
  }
  .next .nb { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  .next .na { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; margin-top: 3px; }

  /* activity */
  .act { list-style: none; margin: 0; padding: 0; }
  .act li { display: flex; gap: 11px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; color: var(--ink-soft); }
  .act li .tick { width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-top: 7px; flex: none; }
  .act li b { color: var(--ink); font-weight: 500; }

  .risks { list-style: none; margin: 0; padding: 0; }
  .risks li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-soft); padding: 4px 0; }
  .risks li svg { width: 14px; height: 14px; color: var(--amber); flex: none; margin-top: 2px; }

  /* recommendation banner */
  .rec {
    display: flex; align-items: center; gap: 14px; margin-top: 22px;
    padding: 16px 18px; border-radius: 12px;
    border: 1px solid var(--sc); background: var(--scs);
  }
  .rec .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; color: #fff; background: var(--sc);
    padding: 6px 13px; border-radius: 7px; white-space: nowrap;
  }
  :root[data-theme="dark"] .rec .badge { color: #05060a; }
  .rec .rtxt { font-size: 13.5px; color: var(--ink); }
  .rec .rtxt b { font-weight: 600; }

  /* doc prose */
  .prose { font-family: 'Spectral', Georgia, serif; font-size: 16px; line-height: 1.66; color: var(--ink); }
  .prose p { margin: 0 0 14px; }
  .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 14px; padding-left: 20px; }
  .prose li { margin-bottom: 6px; }
  .prose em { color: var(--ink-soft); }
  .prose .lead { font-size: 18px; color: var(--ink); }

  .kbd-hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    color: var(--ink-faint); background: var(--paper); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 20px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .kbd-hint.show { opacity: 1; }
  .kbd-hint kbd { color: var(--ink-soft); font-weight: 500; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(200,100,60,.5); }
    70% { box-shadow: 0 0 0 5px rgba(200,100,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,100,60,0); }
  }

  /* mobile */
  .rail-toggle { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail {
      border-right: none; border-bottom: 1px solid var(--line);
      max-height: 46vh;
    }
    .rail.collapsed .rail-scroll, .rail.collapsed .rail-foot { display: none; }
    .rail-toggle {
      display: grid; place-items: center; width: 30px; height: 30px;
      border-radius: 8px; background: transparent; border: 1px solid var(--line);
      color: var(--ink-soft); margin-left: auto;
    }
    .rail-toggle svg { width: 15px; height: 15px; }
    .detail-in { padding: 24px 20px 80px; }
    .p-hd h1 { font-size: 24px; }
    .hrow { grid-template-columns: 1fr auto; }
    .hrow .hstg, .hrow .meter, .hrow .arr { display: none; }
    .kbd-hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z"/><path d="M12 3 V21 M4 7.5 L12 12 L20 7.5"/>
      </svg>

/* ---------------- helpers ---------------- */
function el(id){ return document.getElementById(id); }
function pendingCount(){ return DECISION_ORDER.filter(function(id){ return decisions[id].status === "pending"; }).length; }
function meterHTML(signal){
  var s = SIGNAL[signal] || SIGNAL.NONE;
  var bars = "";
  for (var i=0;i<4;i++){ bars += "<i class='"+(i<s.level?"on":"")+"'></i>"; }
  return "<span class='meter' style='--mc:"+s.color+"'>"+bars+"<span class='mlab'>"+signal+"</span></span>";
}

/* ---------------- rail ---------------- */
function renderRail(){

        +   (pc>0 ? "<span class='cnt'>"+pc+" need you</span>" : "")

  html += "<div class='rail-lbl eyebrow'>Companies · 6</div>";

    html += "<button class='item "+st.cls+(active?" active":"")+(isDone?" done":"")+"' data-view='company' data-id='"+c.id+"'>"
          +   "<span class='dot'></span>"
          +   "<span class='txt'><span class='nm'>"+c.name+"</span><span class='stg'>"+st.label+"</span></span>"

          + "</button>";
  });
  el("railList").innerHTML = html;
  el("footNet").textContent = "+$"+TOTALS.net+"/mo";
}

/* ---------------- decision block (shared by portfolio + company) ---------------- */
function decisionBlock(id, opened){
  var d = decisions[id];
  var c = byId[id];
  var st = STAGE[c.stage];
  var head = "<div class='need-top "+st.cls+"'>"
           +   "<span class='need-co'><span class='cdot'></span>"+c.name+"</span>"
           +   (opened ? "" : "<button class='need-open' data-open='"+id+"'>Open →</button>")
           + "</div>";
  if (d.status === "pending"){
    return "<div class='need-card "+st.cls+"'>"+head
         +   "<div class='need-ask'>"+d.ask+"</div>"
         +   "<div class='need-sub'>"+d.sub+"</div>"
         +   "<div class='need-acts'>"
         +     "<button class='btn approve' data-act='approved' data-id='"+id+"'>"+iconCheck()+" Approve</button>"
         +     "<button class='btn ghost' data-act='held' data-id='"+id+"'>"+iconPause()+" Hold</button>"
         +     "<button class='btn kill' data-act='killed' data-id='"+id+"'>"+iconX()+" Kill</button>"
         +   "</div>"
         + "</div>";
  }
  var map = {
    approved:{ cls:"", ico:iconCheck(), word:"Approved" },
    held:    { cls:"held", ico:iconPause(), word:"On hold" },
    killed:  { cls:"killed", ico:iconX(), word:"Killed" }
  };
  var m = map[d.status];
  return "<div class='need-card "+st.cls+"'>"+head
       +   "<div class='resolved "+m.cls+"'>"+m.ico+"<span><b>"+m.word+".</b> "
       +     (d.status==="approved" ? "The AI is executing now - reversible." :
              d.status==="held" ? "Parked. Nothing runs until you say so." :
              "Stopped. The AI will not proceed.")
       +   "</span><button class='undo' data-undo='"+id+"'>Undo</button></div>"
       + "</div>";
}

/* ---------------- portfolio (zoom-out) ---------------- */
function renderPortfolio(){
  var pc = pendingCount();
  var html = "";
  html += "<div class='live-strip'><span class='dot'></span> Factory live · AI operating "+
          (COMPANIES.filter(function(c){return c.stage!=="ejected"&&c.stage!=="killed";}).length)+" active bets</div>";

  html += "<div class='p-hd'>"
        +   "<h1>Your portfolio</h1>"
        +   "<p>Six AI-operated bets. The factory does the work; you approve only the calls that matter. Zoom in on any company from the list.</p>"
        + "</div>";

  html += "<div class='totals'>"
        +   tot(TOTALS.bets, "Bets", "")
        +   tot("$"+TOTALS.revenue, "Active rev / mo", "pos")
        +   tot("$"+TOTALS.spend, "Spend / mo", "")
        +   tot("+$"+TOTALS.net, "Net / mo", "pos")
        +   tot(pc || "0", pc===1?"Decision needs you":"Decisions need you", pc>0?"warn":"")
        + "</div>";

  /* needs-you queue */
  html += "<div class='sec-hd'><h2>Needs you</h2><span class='hint'>resolve inline · reversible</span></div>";
  if (pc === 0){
    html += "<div class='allclear'>"+iconCheck()+" All caught up - no decisions waiting. The AI keeps running the plan.</div>";
  } else {
    DECISION_ORDER.forEach(function(id){
      if (decisions[id].status === "pending") html += decisionBlock(id, false);
    });
    /* also show recently resolved so the undo stays reachable */
    DECISION_ORDER.forEach(function(id){
      if (decisions[id].status !== "pending") html += decisionBlock(id, false);
    });
  }

  /* health list */
  html += "<div class='sec-hd'><h2>All bets</h2><span class='hint'>click to zoom in</span></div>";
  html += "<div class='health'>";
  COMPANIES.forEach(function(c){
    var st = STAGE[c.stage];
    var needs = c.decisionId && decisions[c.decisionId].status==="pending";
    var revClass = c.revenue>0 ? "hrev" : "hrev zero";
    html += "<button class='hrow "+st.cls+(needs?" hnyou":"")+"' data-id='"+c.id+"'>"
          +   "<span class='hnm'><span class='cdot'></span><b>"+c.name+"</b></span>"
          +   "<span class='hstg'>"+st.label+"</span>"
          +   meterHTML(c.signal)
          +   "<span class='"+revClass+"'>"+(c.revenue>0?"$"+c.revenue+"/mo":"-")+"</span>"
          +   "<span class='arr'>"+iconArrow()+"</span>"
          + "</button>";
  });
  html += "</div>";

  return html;
}
function tot(n, l, cls){
  return "<div class='tot'><div class='n "+(cls||"")+"'>"+n+"</div><div class='l'>"+l+"</div></div>";
}

  html += "<div class='c-top "+st.cls+"'>"

        +   "</div>"

  var netClass = c.net>0 ? "pos" : (c.net<0 ? "neg" : "");

        +   metric((c.revenue>0?"$"+c.revenue:"$0"), "Revenue / mo", c.revenue>0?"pos":"")
        +   metric((c.spend>0?"$"+c.spend:"$0"), "Spend / mo", "")
        +   metric(netStr, "Net / mo", netClass)
        +   metric(c.users, "Users", "")
        +   "<div class='m'><div class='mv'>"+meterHTML(c.signal)+"</div><div class='ml'>Traction signal</div></div>"
        + "</div>";

  /* tabs */
  var tabs = [["overview","Overview"],["foundation","Foundation"],["product","Product"],["growth","Growth"],["budget","Budget"]];
  html += "<div class='tabs'>";
  tabs.forEach(function(t){
    html += "<button class='tab"+(state.tab===t[0]?" on":"")+"' data-tab='"+t[0]+"'>"+t[1]+"</button>";

  if (state.tab === "overview"){
    html += renderOverview(c, st);

    html += "<div class='card span'><div class='prose'>"+c.docs[state.tab]+"</div></div>";
  }
  return html;

function metric(v, l, cls){

function renderOverview(c, st){

        +   "<div class='goal-note'><span>"+c.progress.note+"</span><span class='pct'>"+c.progress.pct+"%</span></div>"

  /* AI plan + next */
  var nextBlock = c.next
    ? "<div class='next'><div><div class='nb'>Next best action</div><div class='na'>"+c.next+"</div></div></div>"

        +   "<ul class='act'>";

  html += "<div class='card"+(c.decisionId&&decisions[c.decisionId].status==="pending"?"":" span")+"'>"
        +   "<h3>Risks</h3><ul class='risks'>";

function iconArrow(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>"; }
function iconWarn(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 9v4M12 17h.01M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z'/></svg>"; }
function iconSpark(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18'/></svg>"; }
function iconSun(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/></svg>"; }
function iconMoon(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z'/></svg>"; }

/* ---------------- render dispatch ---------------- */
function render(){
  renderRail();
  var d = el("detail");
  var inner;
  if (state.view === "all"){
    inner = renderPortfolio();
  } else {
    inner = renderCompany(byId[state.id]);
  }
  d.innerHTML = "<div class='detail-in fade'>"+inner+"</div>";
  d.scrollTop = 0;
}

/* ---------------- navigation ---------------- */
function openCompany(id){
  state.view = "company"; state.id = id; state.tab = "overview";
  render();
  if (window.innerWidth <= 820) el("rail").classList.add("collapsed");
}
function openAll(){ state.view = "all"; render(); }

/* ---------------- theme ---------------- */
function applyThemeIcon(){
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  el("theme").innerHTML = dark ? iconSun() : iconMoon();
}
el("theme").addEventListener("click", function(){
  var root = document.documentElement;
  var dark = root.getAttribute("data-theme") === "dark";
  if (dark){ root.removeAttribute("data-theme"); try{ localStorage.setItem("cslopslop-theme","light"); }catch(e){} }
  else { root.setAttribute("data-theme","dark"); try{ localStorage.setItem("cslopslop-theme","dark"); }catch(e){} }
  applyThemeIcon();
});

/* ---------------- delegated clicks ---------------- */
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target : e.target.parentNode;

  var railItem = e.target.closest("[data-view]");
  if (railItem){
    if (railItem.getAttribute("data-view") === "all") openAll();
    else openCompany(railItem.getAttribute("data-id"));
    return;
  }
  var hrow = e.target.closest(".hrow");
  if (hrow){ openCompany(hrow.getAttribute("data-id")); return; }

  var openBtn = e.target.closest("[data-open]");
  if (openBtn){ openCompany(openBtn.getAttribute("data-open")); return; }

  var tab = e.target.closest(".tab");
  if (tab){ state.tab = tab.getAttribute("data-tab"); render(); return; }

  var act = e.target.closest("[data-act]");
  if (act){
    var id = act.getAttribute("data-id");
    decisions[id].status = act.getAttribute("data-act");
    render();
    return;
  }
  var undo = e.target.closest("[data-undo]");
  if (undo){ decisions[undo.getAttribute("data-undo")].status = "pending"; render(); return; }
});

/* rail toggle (mobile) */
el("railToggle").addEventListener("click", function(){
  el("rail").classList.toggle("collapsed");
});

/* ---------------- keyboard (hidden affordance) ---------------- */
var order = ["all"].concat(COMPANIES.map(function(c){ return c.id; }));
function currentIndex(){ return state.view==="all" ? 0 : order.indexOf(state.id); }
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName||"").toLowerCase();
  if (tag==="input" || tag==="textarea") return;
  if (e.key === "ArrowDown" || e.key === "j"){
    e.preventDefault();
    var ni = Math.min(order.length-1, currentIndex()+1);
    if (order[ni]==="all") openAll(); else openCompany(order[ni]);
    flashHint();
  } else if (e.key === "ArrowUp" || e.key === "k"){
    e.preventDefault();
    var pi = Math.max(0, currentIndex()-1);
    if (order[pi]==="all") openAll(); else openCompany(order[pi]);
    flashHint();
  }
});
var hintTimer;
function flashHint(){
  var h = el("kbdHint");
  h.classList.add("show");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ h.classList.remove("show"); }, 1600);
}

/* ---------------- init ---------------- */
applyThemeIcon();
render();
</script>
</body>
</html>
