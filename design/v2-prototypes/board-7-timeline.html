<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C Slop Slop · Timeline Board</title>
<script>try{if(localStorage.getItem('cslopslop-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#f7f3ec; --cream-2:#f1ebe0; --paper:#fffdf8;
    --ink:#2c2926; --ink-soft:#635c52; --ink-faint:#7b7368;
    --line:#e6ddce; --line-soft:#efe8da;
    --accent:#c8643c; --accent-soft:#f4e0d6;
    --green:#4f8a52; --green-soft:#e3efe1;
    --blue:#4a72b0; --blue-soft:#e2eaf5;
    --violet:#7a5ea8; --violet-soft:#ece6f5;
    --amber:#c08a2e; --amber-soft:#f6ecd4;
    --red:#b6483f; --red-soft:#f6e0dd;
    --slate:#8a8579; --slate-soft:#ece8df;
    /* board ground */
    --board:#faf6ee;
    --dot:rgba(140,120,92,.24);
  }
  :root[data-theme="dark"]{
    --cream:#05060a; --cream-2:#080d18; --paper:#10131f;
    --ink:#e6ebf5; --ink-soft:#aab4c8; --ink-faint:#7c8499;
    --line:#1c2233; --line-soft:#111726;
    --accent:#e0794e; --accent-soft:rgba(224,121,78,.18);
    --green:#34d399; --green-soft:rgba(52,211,153,.15);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,.15);
    --violet:#a78bfa; --violet-soft:rgba(167,139,250,.16);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.15);
    --red:#f87171; --red-soft:rgba(248,113,113,.15);
    --slate:#8a93a8; --slate-soft:rgba(120,140,200,.12);
    --board:#05060a;
    --dot:rgba(150,170,220,.10);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream); color:var(--ink);
    overflow:hidden; -webkit-font-smoothing:antialiased;
    transition:background .3s, color .3s;
  }

  /* ---------- board viewport ---------- */
  .board{
    position:fixed; inset:0; overflow:hidden;
    background:var(--board);
    cursor:grab; transition:background .3s;
  }
  .board.panning{ cursor:grabbing; }
  .grid{
    position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size:44px 44px; background-position:0 0;
  }
  .world{
    position:absolute; top:0; left:0; width:0; height:0;
    transform-origin:0 0; will-change:transform;
  }

  /* ---------- timeline axis ---------- */
  .axis{
    position:absolute; height:1.5px; background:var(--line);
    border-radius:2px;
  }
  .axis::after{
    content:''; position:absolute; right:-2px; top:-3px;
    width:7px; height:7px; border-top:1.5px solid var(--line);
    border-right:1.5px solid var(--line); transform:rotate(45deg);
  }
  .axis-cap{
    position:absolute; font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.14em; color:var(--ink-faint);
    text-transform:uppercase; white-space:nowrap;
  }
  .stage-tick{
    position:absolute; width:1.5px; height:14px; background:var(--line);
    transform:translate(-50%,-50%); border-radius:2px;
  }
  .stage-label{
    position:absolute; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
    white-space:nowrap;
  }
  .stage-idx{
    display:block; font-size:10px; color:var(--ink-faint);
    opacity:.6; margin-bottom:3px; text-align:center;
  }

  .conn{
    position:absolute; width:1.5px; background:var(--c);
    opacity:.32; transform:translateX(-50%);
  }
  .pin{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:var(--c); transform:translate(-50%,-50%);
    box-shadow:0 0 0 4px var(--board);
  }

  /* ---------- company node ---------- */
  .node{
    position:absolute; width:244px; height:190px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:17px 19px;
    box-shadow:0 1px 2px rgba(20,18,14,.04), 0 14px 34px -20px rgba(20,18,14,.28);
    cursor:pointer; overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .node:hover{
    transform:translateY(-3px);
    box-shadow:0 2px 4px rgba(20,18,14,.05), 0 22px 46px -22px rgba(20,18,14,.4);
    border-color:var(--line);
  }
  .node.sel{
    border-color:var(--c);
    box-shadow:0 0 0 2px var(--cs), 0 22px 46px -22px rgba(20,18,14,.45);
  }
  .n-head{ display:flex; align-items:center; gap:9px; }
  .n-dot{ width:9px; height:9px; border-radius:50%; background:var(--c); flex:0 0 auto; }
  .n-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16.5px; color:var(--ink); letter-spacing:-.01em; }
  .n-status{ margin-top:5px; font-size:12.5px; color:var(--ink-faint); }
  .n-metrics{ display:flex; align-items:baseline; gap:8px; margin-top:20px; }
  .n-mrr{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:24px; color:var(--ink); letter-spacing:-.02em; }
  .n-delta{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--green); font-weight:500; }
  .n-tag{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); }
  .n-tag.blue{ color:var(--blue); }
  .n-users{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
  .n-work{
    position:absolute; left:19px; right:19px; bottom:18px;
    font-size:12.5px; color:var(--ink-soft); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .n-verb{ color:var(--ink-faint); font-weight:500; }
  .need-pill{
    position:absolute; top:15px; right:15px;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.09em; text-transform:uppercase; font-weight:500;
    color:var(--accent); background:var(--accent-soft);
    padding:3px 8px; border-radius:20px;
  }

  /* ---------- HUD chrome ---------- */
  .hud-tl{ position:fixed; top:22px; left:26px; z-index:20; user-select:none; }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em; color:var(--ink); }
  .brand .b-dot{ color:var(--accent); }
  .sub{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px; }
  .stats{ display:flex; align-items:center; gap:16px; margin-top:14px; flex-wrap:wrap; max-width:560px; }
  .stat{ display:flex; align-items:baseline; gap:6px; }
  .stat b{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:14px; color:var(--ink); }
  .stat span{ font-size:11.5px; color:var(--ink-faint); }
  .stat .up{ color:var(--green); font-size:11px; font-family:'JetBrains Mono',monospace; }
  .needs-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
    color:var(--accent); background:var(--accent-soft);
    padding:4px 11px; border-radius:20px; cursor:pointer;
    transition:filter .15s;
  }
  .needs-pill:hover{ filter:brightness(.97); }

  .theme-toggle{
    position:fixed; top:22px; right:26px; z-index:20;
    width:34px; height:34px; border-radius:10px; cursor:pointer;
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    display:grid; place-items:center;
    transition:color .15s, border-color .15s;
  }
  .theme-toggle:hover{ color:var(--accent); border-color:var(--accent); }

  .zoom{
    position:fixed; bottom:24px; right:26px; z-index:20;
    display:flex; align-items:center; gap:6px;
  }
  .zbtn{
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    height:34px; min-width:34px; border-radius:10px; cursor:pointer;
    display:grid; place-items:center; font-size:17px; line-height:1;
    font-family:'Inter',sans-serif;
    transition:color .15s, border-color .15s;
  }
  .zbtn:hover{ color:var(--accent); border-color:var(--accent); }
  .zbtn.wide{ padding:0 12px; }
  .zlabel{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft);
    min-width:44px; text-align:center; user-select:none;
  }

  .hint{
    position:fixed; bottom:26px; left:26px; z-index:20;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.06em; color:var(--ink-faint);
    display:flex; align-items:center; gap:10px; user-select:none;
    transition:opacity .4s;
  }
  .hint kbd{
    font-family:'JetBrains Mono',monospace; font-size:10.5px;
    border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--ink-soft);
  }

  /* ---------- focused detail ---------- */
  .detail{
    position:fixed; top:16px; right:16px; bottom:16px; width:348px; z-index:30;
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 30px 70px -30px rgba(20,18,14,.5);
    padding:26px 26px 24px; overflow-y:auto;
    transform:translateX(calc(100% + 28px));
    transition:transform .36s cubic-bezier(.22,.61,.36,1);
  }
  .detail.open{ transform:none; }
  .d-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px;
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
    border-radius:8px; display:grid; place-items:center; font-size:18px;
    transition:color .15s, background .15s;
  }
  .d-close:hover{ color:var(--ink); background:var(--cream-2); }
  .d-head{ display:flex; align-items:center; gap:10px; }
  .d-dot{ width:11px; height:11px; border-radius:50%; background:var(--c); }
  .d-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-.015em; color:var(--ink); }
  .d-status{ margin-top:4px; font-size:13px; color:var(--ink-faint); }
  .d-metrics{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
    margin:24px 0 4px; padding:18px 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  }
  .d-mlabel{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .d-mval{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:20px; color:var(--ink); margin-top:6px; letter-spacing:-.02em; }
  .d-mval small{ font-size:11px; color:var(--green); font-weight:400; }
  .d-mval.mom{ font-size:14px; font-family:'Inter',sans-serif; font-weight:500; }
  .d-sec{ margin-top:22px; }
  .d-sec h4{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 9px; font-weight:500;
  }
  .d-sec p{ margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .d-need{
    background:var(--accent-soft); border-radius:12px; padding:15px 16px; margin-top:22px;
  }
  .d-need .nlab{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  .d-need p{ margin:8px 0 0; font-size:13px; line-height:1.5; color:var(--ink); }
  .d-check{ display:inline-flex; align-items:center; gap:6px; margin-top:9px; font-size:12px; color:var(--green); font-family:'JetBrains Mono',monospace; }
  .d-cta{
    margin-top:13px; width:100%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:11px; border-radius:10px; transition:filter .15s;
  }
  :root[data-theme="dark"] .d-cta{ color:#05060a; }
  .d-cta:hover{ filter:brightness(1.05); }
  .d-act{ list-style:none; margin:0; padding:0; }
  .d-act li{
    display:flex; gap:11px; align-items:flex-start; padding:9px 0;
    border-top:1px solid var(--line-soft); font-size:13px; color:var(--ink-soft);
  }
  .d-act li:first-child{ border-top:none; }
  .d-act .ad-dot{ width:6px; height:6px; border-radius:50%; background:var(--c); margin-top:6px; flex:0 0 auto; }
  .d-act .ad-t{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); white-space:nowrap; padding-left:8px; }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:3px solid var(--paper); }
</style>
</head>
<body>

<div class="board" id="board">
  <div class="grid" id="grid"></div>
  <div class="world" id="world"></div>
</div>

<header class="hud-tl">
  <div class="brand">C Slop Slop<span class="b-dot">.</span></div>
  <div class="sub">Portfolio · Timeline</div>
  <div class="stats">
    <div class="stat"><b>$695</b><span class="up">↑14%</span><span>mrr</span></div>
    <div class="stat"><b>56</b><span>users</span></div>
    <div class="stat"><b>5</b><span>companies</span></div>
    <div class="stat"><b>22</b><span>shipped</span></div>
    <div class="stat"><b>+$481</b><span>net/mo</span></div>
    <div class="needs-pill" id="needsPill">3 need you</div>
  </div>
</header>

<button class="theme-toggle" id="themeToggle" title="Toggle theme"></button>

<div class="zoom">
  <button class="zbtn" id="zOut" title="Zoom out">&minus;</button>
  <div class="zlabel" id="zLabel">100%</div>
  <button class="zbtn" id="zIn" title="Zoom in">+</button>
  <button class="zbtn wide" id="zFit" title="Fit to view">Fit</button>
</div>

<div class="hint" id="hint">
  <span><kbd>drag</kbd> pan</span>
  <span><kbd>scroll</kbd> zoom</span>
  <span>along the timeline</span>
</div>

<aside class="detail" id="detail">
  <button class="d-close" id="dClose">&times;</button>
  <div id="dBody"></div>
</aside>

<script>
(function(){
  'use strict';

  var NODE_W = 244, NODE_H = 190, AXIS_Y = 700;

  var STAGES = [
    { label:'Idea',     x:300 },
    { label:'Building', x:900 },
    { label:'Launched', x:1500 },
    { label:'Growing',  x:2340 }
  ];

  var ORDER = ['reddit','translator','datadrop','leadsift','quietinbox'];

  var DATA = {
    reddit:{
      name:'RedditPainBot', color:'slate', axis:300, side:'above', top:430,
      status:'Paused · blocked', mrr:'$0', tag:'paused', tagTone:'faint', users:'0',
      work:{ v:'Blocked', t:'slice 8 ×3' }, need:true,
      d:{ momentum:'Paused', deltaTxt:'', usersLong:'0',
          currently:'Slice 8 has failed three build attempts and is paused pending your review.',
          need:{ verb:'Unblock', body:'RedditPainBot retried slice 8 three times and stopped. It needs a decision before it can continue.', cta:'Unblock & retry', check:'' },
          activity:[ ['Blocked ×3','18m'], ['Slice 8 build failed','-'], ['Paused pending review','-'] ] }
    },
    translator:{
      name:'TranslatorBill', color:'violet', axis:900, side:'below', top:760,
      status:'Building · pre-revenue', mrr:'$0', tag:'pre-revenue', tagTone:'faint', users:'0',
      work:{ v:'Build', t:'invoice reformat' }, need:false,
      d:{ momentum:'Pre-revenue', deltaTxt:'', usersLong:'0',
          currently:'Writing InvoiceFormatter.tsx now. First slice of the invoice reformat feature is underway.',
          need:null,
          activity:[ ['Building InvoiceFormatter.tsx','now'], ['Project scaffolded','-'], ['No revenue yet','-'] ] }
    },
    datadrop:{
      name:'DataDrop', color:'green', axis:1500, side:'above', top:400,
      status:'Live · flat', mrr:'$95', tag:'flat', tagTone:'faint', users:'6',
      work:{ v:'Queued', t:'saved chart views' }, need:false,
      d:{ momentum:'Flat', deltaTxt:'', usersLong:'6',
          currently:'Revenue has been flat for three weeks. "Saved chart views" is queued as the next growth bet.',
          need:null,
          activity:[ ['Re-prioritized backlog','5m'], ['Revenue flat 3 weeks','-'], ['6 paying users','-'] ] }
    },
    leadsift:{
      name:'LeadSift', color:'accent', axis:1980, side:'below', top:790,
      status:'Live · growing', mrr:'$180', delta:'↑ $40', users:'12',
      work:{ v:'Ship', t:'daily digest' }, need:true,
      d:{ momentum:'Growing', deltaTxt:'+$40 MoM', usersLong:'12',
          currently:'The "daily digest" feature built cleanly and passed all checks. It is waiting on your approval to ship.',
          need:{ verb:'Ship', body:'Daily digest is built and validated. Approve to ship it to all 12 users.', cta:'Approve & ship', check:'Passed checks' },
          activity:[ ['Awaiting approval','2m'], ['Daily digest passed checks','-'], ['+$40 MRR this month','-'] ] }
    },
    quietinbox:{
      name:'QuietInbox', color:'blue', axis:2380, side:'above', top:360,
      status:'Live · scaling · best', mrr:'$420', tag:'top earner', tagTone:'blue', users:'38',
      work:{ v:'Build', t:'snooze a thread' }, need:true,
      d:{ momentum:'Scaling', deltaTxt:'top earner', usersLong:'38',
          currently:'Building "snooze a thread". Top earner in the portfolio at 38 users and climbing.',
          need:{ verb:'Spend', body:'Approve $40 for a Product Hunt launch to accelerate QuietInbox growth.', cta:'Approve $40 spend', check:'' },
          activity:[ ['Deployed · checks passed','12s'], ['Building snooze a thread','-'], ['38 users · top earner','-'] ] }
    }
  };

  /* ---------- build world ---------- */
  var world = document.getElementById('board') && document.getElementById('world');
  var html = '';

  var AX0 = 140, AX1 = 2560;
  html += '<div class="axis" style="left:'+AX0+'px; top:'+AXIS_Y+'px; width:'+(AX1-AX0)+'px;"></div>';
  html += '<div class="axis-cap" style="left:'+AX0+'px; top:'+(AXIS_Y-30)+'px;">Stage / maturity &rarr;</div>';

  STAGES.forEach(function(s,i){
    html += '<div class="stage-tick" style="left:'+s.x+'px; top:'+AXIS_Y+'px;"></div>';
    html += '<div class="stage-label" style="left:'+s.x+'px; top:'+(AXIS_Y+18)+'px;"><span class="stage-idx">0'+(i+1)+'</span>'+s.label+'</div>';
  });

  ORDER.forEach(function(id){
    var d = DATA[id];
    var lineTop, lineH;
    if(d.side === 'above'){ var bot = d.top + NODE_H; lineTop = bot; lineH = AXIS_Y - bot; }
    else { lineTop = AXIS_Y; lineH = d.top - AXIS_Y; }
    html += '<div class="conn" style="left:'+d.axis+'px; top:'+lineTop+'px; height:'+lineH+'px; --c:var(--'+d.color+');"></div>';
    html += '<div class="pin" style="left:'+d.axis+'px; top:'+AXIS_Y+'px; --c:var(--'+d.color+');"></div>';

    var metric;
    if(d.delta){ metric = '<span class="n-delta">'+d.delta+'</span>'; }
    else { metric = '<span class="n-tag '+(d.tagTone==='blue'?'blue':'')+'">'+d.tag+'</span>'; }

    var left = d.axis - NODE_W/2;
    html += '<div class="node" data-co="'+id+'" style="left:'+left+'px; top:'+d.top+'px; --c:var(--'+d.color+'); --cs:var(--'+d.color+'-soft);">'
      + (d.need ? '<span class="need-pill">Needs you</span>' : '')
      + '<div class="n-head"><span class="n-dot"></span><span class="n-name">'+d.name+'</span></div>'
      + '<div class="n-status">'+d.status+'</div>'
      + '<div class="n-metrics"><span class="n-mrr">'+d.mrr+'</span>'+metric+'<span class="n-users">'+d.users+' users</span></div>'
      + '<div class="n-work"><span class="n-verb">'+d.work.v+'</span> · '+d.work.t+'</div>'
      + '</div>';
  });

  world.innerHTML = html;

  /* ---------- pan + zoom ---------- */
  var board = document.getElementById('board');
  var grid = document.getElementById('grid');
  var zLabel = document.getElementById('zLabel');
  var GRID = 44, MIN = 0.35, MAX = 2.6;
  var s = 1, tx = 0, ty = 0;

  function render(){
    world.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+s+')';
    var g = GRID * s;
    grid.style.backgroundSize = g+'px '+g+'px';
    grid.style.backgroundPosition = tx+'px '+ty+'px';
    zLabel.textContent = Math.round(s*100)+'%';
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function zoomAt(cx, cy, factor){
    var ns = clamp(s*factor, MIN, MAX);
    if(ns === s) return;
    var wx = (cx - tx)/s, wy = (cy - ty)/s;
    tx = cx - wx*ns; ty = cy - wy*ns; s = ns;
    render();
  }

  function fit(){
    var minX = 140, maxX = 2540, minY = 320, maxY = 1010;
    var pad = 96;
    var vw = window.innerWidth, vh = window.innerHeight;
    var bw = maxX - minX, bh = maxY - minY;
    var ns = clamp(Math.min((vw-pad*2)/bw, (vh-pad*2)/bh), MIN, MAX);
    s = ns;
    var cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    tx = vw/2 - cx*s;
    ty = vh/2 - cy*s;
    render();
  }

  /* pan / click detection */
  var down = false, moved = false, sx = 0, sy = 0, startTx = 0, startTy = 0, downNode = null;

  board.addEventListener('mousedown', function(e){
    down = true; moved = false;
    sx = e.clientX; sy = e.clientY; startTx = tx; startTy = ty;
    downNode = e.target.closest ? e.target.closest('.node') : null;
    board.classList.add('panning');
  });
  window.addEventListener('mousemove', function(e){
    if(!down) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && (Math.abs(dx)+Math.abs(dy)) > 4) moved = true;
    if(moved){ tx = startTx + dx; ty = startTy + dy; render(); hideHint(); }
  });
  window.addEventListener('mouseup', function(){
    if(!down) return;
    down = false; board.classList.remove('panning');
    if(!moved){
      if(downNode) openDetail(downNode.getAttribute('data-co'));
      else closeDetail();
    }
    downNode = null;
  });

  board.addEventListener('wheel', function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    zoomAt(e.clientX, e.clientY, factor);
    hideHint();
  }, { passive:false });

  document.getElementById('zIn').addEventListener('click', function(){ zoomAt(window.innerWidth/2, window.innerHeight/2, 1.2); });
  document.getElementById('zOut').addEventListener('click', function(){ zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.2); });
  document.getElementById('zFit').addEventListener('click', function(){ fit(); });
  document.getElementById('zLabel').addEventListener('click', function(){ zoomAt(window.innerWidth/2, window.innerHeight/2, 1/s); });
  window.addEventListener('resize', fit);

  var hint = document.getElementById('hint'), hintHidden = false;
  function hideHint(){ if(!hintHidden){ hintHidden = true; hint.style.opacity = '0'; } }

  /* ---------- detail ---------- */
  var detail = document.getElementById('detail');
  var dBody = document.getElementById('dBody');

  function openDetail(id){
    var d = DATA[id];
    if(!d) return;
    var det = d.d;
    var mrrSmall = det.deltaTxt ? ' <small>'+det.deltaTxt+'</small>' : '';

    var needHTML = '';
    if(det.need){
      var chk = det.need.check ? '<span class="d-check">✓ '+det.need.check+'</span>' : '';
      needHTML = '<div class="d-need"><span class="nlab">Needs you · '+det.need.verb+'</span>'
        + '<p>'+det.need.body+'</p>'+chk
        + '<button class="d-cta">'+det.need.cta+'</button></div>';
    }

    var actHTML = '<ul class="d-act">';
    det.activity.forEach(function(a){
      actHTML += '<li><span class="ad-dot"></span><span>'+a[0]+'</span><span class="ad-t">'+a[1]+'</span></li>';
    });
    actHTML += '</ul>';

    dBody.innerHTML =
      '<div class="d-head" style="--c:var(--'+d.color+');"><span class="d-dot"></span><span class="d-name">'+d.name+'</span></div>'
      + '<div class="d-status">'+d.status+'</div>'
      + '<div class="d-metrics">'
        + '<div><div class="d-mlabel">MRR</div><div class="d-mval">'+d.mrr+mrrSmall+'</div></div>'
        + '<div><div class="d-mlabel">Users</div><div class="d-mval">'+det.usersLong+'</div></div>'
        + '<div><div class="d-mlabel">Momentum</div><div class="d-mval mom">'+det.momentum+'</div></div>'
      + '</div>'
      + '<div class="d-sec"><h4>Currently</h4><p>'+det.currently+'</p></div>'
      + needHTML
      + '<div class="d-sec"><h4>Recent activity</h4>'+actHTML+'</div>';

    detail.classList.add('open');
    dBody.querySelector('.d-head').style.setProperty('--c','var(--'+d.color+')');
    dBody.querySelectorAll('.ad-dot, .d-dot').forEach(function(el){ el.style.background = 'var(--'+d.color+')'; });

    var nodes = world.querySelectorAll('.node');
    nodes.forEach(function(n){ n.classList.toggle('sel', n.getAttribute('data-co') === id); });
    hideHint();
  }

  function closeDetail(){
    detail.classList.remove('open');
    world.querySelectorAll('.node').forEach(function(n){ n.classList.remove('sel'); });
  }

  document.getElementById('dClose').addEventListener('click', closeDetail);

  document.getElementById('needsPill').addEventListener('click', function(){
    zoomToNode('leadsift');
  });

  function zoomToNode(id){
    var d = DATA[id];
    var cx = d.axis, cy = d.top + NODE_H/2;
    var ns = 1.15;
    s = clamp(ns, MIN, MAX);
    tx = window.innerWidth/2 - cx*s;
    ty = window.innerHeight/2 - cy*s;
    render();
    openDetail(id);
  }

  /* ---------- theme ---------- */
  var toggle = document.getElementById('themeToggle');
  var MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  var SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>';

  function syncToggle(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    toggle.innerHTML = dark ? SUN : MOON;
    grid.style.backgroundImage = 'radial-gradient(var(--dot) 1.4px, transparent 1.4px)';
  }
  toggle.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','dark');
    try{ localStorage.setItem('cslopslop-theme', dark ? 'light' : 'dark'); }catch(e){}
    syncToggle();
  });

  /* ---------- init ---------- */
  syncToggle();
  fit();
})();
</script>
</body>
</html>
