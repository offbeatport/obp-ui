<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Background -->
  <rect width="36" height="36" fill="#0F172A" rx="2"/>

  <!-- 3 input rows (left - different sources) -->
  <rect x="4" y="9"    width="11" height="3" rx="0.5" fill="white" fill-opacity="0.90"/>
  <rect x="4" y="16.5" width="11" height="3" rx="0.5" fill="white" fill-opacity="0.50"/>
  <rect x="4" y="24"   width="11" height="3" rx="0.5" fill="white" fill-opacity="0.90"/>

  <!-- Convergence paths -->
  <path d="M15 10.5 C 16.5 10.5 17 17.5 17 18"   stroke="white" stroke-opacity="0.35" stroke-width="1.25" stroke-linecap="round" fill="none"/>
  <path d="M15 18   L 17 18"                       stroke="white" stroke-opacity="0.35" stroke-width="1.25" stroke-linecap="round"/>
  <path d="M15 25.5 C 16.5 25.5 17 18.5 17 18"   stroke="white" stroke-opacity="0.35" stroke-width="1.25" stroke-linecap="round" fill="none"/>

  <!-- Output - one clean unified table -->
  <rect x="18" y="13" width="14" height="10" rx="1" fill="white"/>

  <!-- Column divider -->
  <line x1="23.5" y1="13.5" x2="23.5" y2="22.5" stroke="#0F172A" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Row dividers -->
  <line x1="18.5" y1="16.8" x2="31.5" y2="16.8" stroke="#0F172A" stroke-width="0.75" stroke-opacity="0.18"/>
  <line x1="18.5" y1="20"   x2="31.5" y2="20"   stroke="#0F172A" stroke-width="0.75" stroke-opacity="0.18"/>
</svg>
