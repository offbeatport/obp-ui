services:
  liveaipulse:
    build:
      context: ../..
      dockerfile: apps/liveaibeat/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - liveaipulse-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/app.db
      PORT: "3000"

      # Auth
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_USERS: ${ADMIN_USERS}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # AI
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-flash-1.5}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}

      # Cron
      CRON_SECRET: ${CRON_SECRET}

      # Billing (Polar - optional, for Brand Monitor paid tier)
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PRODUCT_ID_BRAND_MONITOR: ${POLAR_PRODUCT_ID_BRAND_MONITOR:-}

volumes:
  liveaipulse-data:
    driver: local
